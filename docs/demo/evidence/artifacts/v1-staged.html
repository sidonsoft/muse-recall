<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Calm Task Planner</title>
<style>
  :root {
    --bg: #191712;
    --surface: #23201a;
    --surface-2: #2c2820;
    --border: #3a352a;
    --text: #f4eee1;
    --muted: #b3a893;
    --accent: #e7c17c;
    --accent-ink: #241d0e;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08d7a;
    --radius: 14px;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 56px;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-size: 2rem;
    letter-spacing: 0.01em;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 800;
  }
  .tagline {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .progress-wrap { margin-bottom: 16px; }
  .progress-text {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  #progressLabel { font-weight: 650; }
  #progressPercent { color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #171410;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: inherit;
    transition: width 250ms ease;
  }
  form.add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  label.visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #171410;
    color: var(--text);
    font-size: 1rem;
  }
  #taskInput::placeholder { color: #8d8471; }
  #taskInput:focus-visible, button:focus-visible, .task-checkbox:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .btn {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    transition: transform 60ms ease, background 160ms ease, border-color 160ms ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    white-space: nowrap;
  }
  .btn-primary:hover { background: #eecf93; }
  .btn-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .filter-btn[aria-pressed="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  .link-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 8px 4px;
  }
  .link-btn:hover:not(:disabled) { color: var(--text); }
  .link-btn:disabled { opacity: 0.45; cursor: not-allowed; text-decoration: none; }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-2);
  }
  .task:hover { border-color: #57503e; }
  .task-checkbox {
    appearance: none;
    flex: none;
    width: 24px;
    height: 24px;
    margin: 0;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    cursor: pointer;
    display: inline-grid;
    place-content: center;
  }
  .task-checkbox::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 4px;
    transform: scale(0);
    transition: transform 120ms ease;
    background: var(--accent-ink);
  }
  .task-checkbox:checked { background: var(--accent); }
  .task-checkbox:checked::before { transform: scale(1); }
  .task-label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .task.done .task-label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
  }
  .delete-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
  }
  .delete-btn:hover {
    color: #2a1512;
    background: var(--danger);
    border-color: var(--danger);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 28px 16px;
    margin: 0;
  }
  .hint {
    margin: 14px 2px 0;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 16px; }
    .brand { font-size: 1.65rem; }
    form.add-row { flex-direction: column; }
    .btn-primary { width: 100%; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .filters { display: grid; grid-template-columns: 1fr 1fr 1fr; }
    .filter-btn { text-align: center; padding: 10px 6px; }
    .link-btn { text-align: center; }
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">◐</span> FocusFlow</h1>
      <p class="tagline">A calm place for today's tasks.</p>
    </header>

    <section class="card" aria-label="Task planner">
      <div class="progress-wrap" aria-live="polite">
        <div class="progress-text">
          <span id="progressLabel">0 of 0 completed</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressA11y">
          <div id="progressBar"></div>
        </div>
      </div>

      <form class="add-row" id="addForm" autocomplete="off">
        <label class="visually-hidden" for="taskInput">New task</label>
        <input id="taskInput" name="task" type="text" maxlength="200" placeholder="What needs attention?" />
        <button class="btn btn-primary" type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button class="link-btn" type="button" id="clearCompleted">Clear completed</button>
      </div>

      <ul id="taskList"></ul>
      <p class="hint">Tasks stay in memory for this session only.</p>
    </section>
  </main>

<script>
(function () {
  "use strict";

  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var form = document.getElementById("addForm");
  var input = document.getElementById("taskInput");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPercent = document.getElementById("progressPercent");
  var progressBar = document.getElementById("progressBar");
  var progressA11y = document.getElementById("progressA11y");
  var clearBtn = document.getElementById("clearCompleted");
  var filterButtons = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.done; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.done; });
    }
    return tasks;
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.done; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPercent.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressA11y.setAttribute("aria-valuenow", String(pct));

    filterButtons.forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.filter === filter ? "true" : "false");
    });

    clearBtn.disabled = done === 0;

    var shown = visibleTasks();
    list.innerHTML = "";

    if (shown.length === 0) {
      var empty = document.createElement("li");
      var msg;
      if (total === 0) {
        msg = "No tasks yet. Add one above to begin.";
      } else if (filter === "active") {
        msg = "All clear. Nothing active right now.";
      } else if (filter === "completed") {
        msg = "Nothing completed yet.";
      } else {
        msg = "No tasks to show.";
      }
      empty.innerHTML = '<p class="empty">' + escapeHtml(msg) + "</p>";
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task) {
      var li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");

      var box = document.createElement("input");
      box.type = "checkbox";
      box.className = "task-checkbox";
      box.checked = task.done;
      box.setAttribute("aria-label", "Mark task complete: " + task.text);
      box.addEventListener("change", function () {
        task.done = box.checked;
        render();
      });

      var label = document.createElement("span");
      label.className = "task-label";
      label.textContent = task.text;

      var del = document.createElement("button");
      del.type = "button";
      del.className = "delete-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "×";
      del.addEventListener("click", function () {
        tasks = tasks.filter(function (t) { return t.id !== task.id; });
        render();
      });

      li.appendChild(box);
      li.appendChild(label);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    tasks.push({ id: nextId++, text: text, done: false });
    input.value = "";
    input.focus();
    render();
  });

  filterButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.dataset.filter;
      render();
    });
  });

  clearBtn.addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    render();
  });

  render();
})();
</script>
</body>
</html>
