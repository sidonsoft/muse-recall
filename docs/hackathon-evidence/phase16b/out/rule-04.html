<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match - Arcade Challenge</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;outline:none}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #sr{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean Memory Match arcade game. Use Tab and arrow keys to move, Enter or Space to flip cards." tabindex="0"></div>
<div id="sr" aria-live="polite"></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F41A}", name: "Shell" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, level = 1, maxLevel = 2, streak = 0, bestStreak = 0;
  var hudMoves, hudPairs, hudScore, hudLevel, hudMsg, endOverlay, endTitle, endDetail, startOverlay, nextBtnBg, nextBtnTx, focusRects = [], focusedIndex = 0;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    window.addEventListener("keydown", handleKey);
    s.input.keyboard.on("keydown-ENTER", function(e){ if(started) handleKey({key:"Enter", preventDefault:function(){}}); });
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EFFF, 1); g.fillRect(0, 0, W, 180);
    g.fillStyle(0xB8E0F6, 1); g.fillRect(0, 180, W, 120);
    g.fillStyle(0xA8D8EA, 1); g.fillRect(0, 300, W, 170);
    g.fillStyle(0xE6F4FF, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 95, 140, 42); g.fillEllipse(230, 85, 110, 38);
    g.fillEllipse(560, 70, 130, 36); g.fillEllipse(620, 85, 90, 28);
    g.fillStyle(0x4EA8DE, 0.15); g.fillCircle(770, 110, 55);
    g.fillStyle(0x4EA8DE, 0.25); g.fillCircle(770, 110, 38);
    g.fillStyle(0xffffff, 0.95); g.fillCircle(770, 110, 18);
    g.lineStyle(6, 0xffffff, 0.55);
    for (var wy = 320; wy <= 360; wy += 18) {
      g.beginPath();
      for (var x = 0; x <= W; x += 20) {
        var y = wy + Math.sin(x * 0.02) * 6;
        if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.strokePath();
    }
    g.fillStyle(0x4EA8DE, 0.12);
    for (var i = 0; i < 12; i++) {
      var bx = 40 + i * 78 + (i % 3) * 10;
      var by = 520 + (i % 2) * 20;
      g.fillCircle(bx, by, 7 + (i % 3) * 3);
      g.fillCircle(bx + 12, by - 18, 4);
      g.fillCircle(bx - 8, by - 28, 3);
    }
    g.fillStyle(0xD0E8F2, 1);
    for (var s = 0; s < 8; s++) {
      var sx = 60 + s * 110;
      g.fillEllipse(sx, 640, 90, 22);
      g.fillEllipse(sx + 20, 655, 60, 16);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function announce(msg) {
    var el = document.getElementById("sr");
    if (el) el.textContent = msg;
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match Arcade", textStyle(32)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level: 1 / 2", textStyle(20));
    hudMoves = scene.add.text(24, 78, "Moves: 0", textStyle(20));
    hudPairs = scene.add.text(24, 104, "Pairs: 0 / 6", textStyle(20));
    hudScore = scene.add.text(24, 130, "Score: 0", textStyle(20));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find pairs to level up! No rush, just explore!", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var count = level === 1 ? 6 : 8;
    var pool = OCEAN_ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusRects = [];
    var deck = shuffledDeck();
    var cols = 4, rows = level === 1 ? 3 : 4;
    var cw = level === 1 ? 185 : 175, ch = level === 1 ? 140 : 110;
    var gx = level === 1 ? 62 : 52, gy = level === 1 ? 195 : 185, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      var obj = makeCard(scene, cx, cy, cw, ch, card, idx);
      cards.push(obj);
    });
    focusedIndex = 0;
    updateFocus();
    hudPairs.setText("Pairs: 0 / " + (level === 1 ? 6 : 8));
    hudLevel.setText("Level: " + level + " / " + maxLevel);
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 12);
    var paw = scene.add.text(0, -4, "\u{1F4A7}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xEAF6FF, 0xD6EFFF, 0xC1E7FF, 0xE0F2FF, 0xD0E8F2, 0xB8E0F6, 0xA8D8EA, 0xE6F4FF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -16, data.emoji, { fontSize: level === 1 ? "56px" : "48px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 42, data.name, textStyle(20)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    var focus = scene.add.graphics();
    focus.lineStyle(4, 0x4EA8DE, 1); focus.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 24);
    focus.setVisible(false);
    cont.add([showBack, face, focus]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    focusRects.push(focus);
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, idx: idx };
    cont.on("pointerdown", function () { focusedIndex = idx; updateFocus(); onCard(scene, card); });
    return card;
  }

  function updateFocus() {
    focusRects.forEach(function (r, i) { r.setVisible(i === focusedIndex && started); });
  }

  function handleKey(e) {
    if (!started || lockBoard && e.key !== "Tab") { if (e.key === "Tab") { e.preventDefault(); } return; }
    if (e.key === "ArrowRight" || e.key === "Tab") {
      e.preventDefault();
      focusedIndex = (focusedIndex + 1) % cards.length;
      updateFocus();
      announce("Focused " + cards[focusedIndex].data.name);
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      focusedIndex = (focusedIndex - 1 + cards.length) % cards.length;
      updateFocus();
      announce("Focused " + cards[focusedIndex].data.name);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      focusedIndex = Math.min(cards.length - 1, focusedIndex + 4);
      updateFocus();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      focusedIndex = Math.max(0, focusedIndex - 4);
      updateFocus();
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      var c = cards[focusedIndex];
      if (c) onCard(c.view.scene, c);
    }
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u{1F30A}"); announce("First card " + card.data.name); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        streak++;
        if (streak > bestStreak) bestStreak = streak;
        score += 100;
        if (streak >= 2) score += 20;
        hudScore.setText("Score: " + score);
        hudPairs.setText("Pairs: " + matches + " / " + (level === 1 ? 6 : 8));
        var need = level === 1 ? 6 : 8;
        if (matches === need) {
          hudMsg.setText("Level complete! \u{1F389}");
        } else {
          hudMsg.setText(streak >= 2 ? "Great streak! +" + score + " \u2728" : "Yay! A pair! \u{1F389}");
        }
        announce("Match found " + card.data.name + " score " + score);
        for (var i = 0; i < 6; i++) {
          var b = scene.add.graphics().setDepth(30);
          b.fillStyle(0x4EA8DE, 0.35); b.fillCircle(0, 0, 6 + i * 2);
          b.x = card.view.x; b.y = card.view.y;
          scene.tweens.add({ targets: b, y: b.y - 80 - i * 10, alpha: 0, duration: 900 + i * 80, onComplete: (function (t) { return function () { t.destroy(); }; })(b) });
        }
        lockBoard = false;
        updateFocus();
        if (matches === need) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Keep exploring! \u{1F30A}");
      announce("Not a match, try again");
      streak = 0;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocus(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F30A} Ocean Match Arcade", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Find pairs and level up!\nLevel 1: 6 pairs  •  Level 2: 8 pairs\nNo timers, no penalties — just fun!", Object.assign(textStyle(18), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F419} \u{1F433} \u{1F42C} \u{1F420} \u{1F980} \u{1F422}", { fontSize: "38px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Dive In", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card or use keyboard!");
      updateFocus();
      announce("Game started level 1");
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) { started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card or use keyboard!"); updateFocus(); }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} Level Complete! \u{1F389}", textStyle(36)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 50, 130, 60, 30);
    var btnTx = scene.add.text(-75, 80, "Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    nextBtnBg = scene.add.graphics();
    nextBtnBg.fillStyle(0x102A43, 1); nextBtnBg.fillRoundedRect(10, 50, 130, 60, 30);
    nextBtnTx = scene.add.text(75, 80, "Next Level \u25B6", textStyle(18, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, nextBtnBg, nextBtnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 50, 130, 60), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    nextBtnBg.setInteractive(new Phaser.Geom.Rectangle(10, 50, 130, 60), Phaser.Geom.Rectangle.Contains);
    nextBtnBg.on("pointerdown", function () { nextLevel(scene); });
  }

  function showWin(scene) {
    var need = level === 1 ? 6 : 8;
    var stars = moves <= need + 4 ? 3 : (moves <= need + 8 ? 2 : 1);
    if (level < maxLevel) {
      endTitle.setText("\u{1F389} Level " + level + " Complete! \u{1F389}");
      endDetail.setText("You found all " + need + " pairs!\nMoves: " + moves + "  Score: " + score + "  " + "\u2B50".repeat(stars) + "\nBest streak: " + bestStreak + "\nReady for the arcade challenge?");
      nextBtnBg.setVisible(true); nextBtnTx.setVisible(true);
      nextBtnTx.setText("Next Level \u25B6");
    } else {
      endTitle.setText("\u{1F3C6} Arcade Champion! \u{1F3C6}");
      endDetail.setText("You cleared all levels!\nTotal Score: " + score + "  Moves: " + moves + "  " + "\u2B50".repeat(stars) + "\nBest streak: " + bestStreak);
      nextBtnBg.setVisible(false); nextBtnTx.setVisible(false);
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText(level < maxLevel ? "Level up! \u2728" : "You win! \u{1F389}");
    announce(endTitle.text + " " + endDetail.text);
    for (var i = 0; i < 30; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F4A7}"][i % 4], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1400, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0; level = 1; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudPairs.setText("Pairs: 0 / 6"); hudScore.setText("Score: 0"); hudLevel.setText("Level: 1 / 2"); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    announce("Restarted level 1");
  }

  function nextLevel(scene) {
    level = 2; matches = 0; moves = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudPairs.setText("Pairs: 0 / 8"); hudLevel.setText("Level: 2 / 2"); hudMsg.setText("Arcade challenge! 8 pairs!");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    announce("Level 2 started, 8 pairs");
  }

  function update() {}
})();
</script>
</body>
</html>
