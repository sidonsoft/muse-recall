<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Arcade Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F4FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean Arcade Memory Match game"></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F420}", name: "Tropical Fish" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F41A}", name: "Shell" },
    { emoji: "\u{2B50}", name: "Starfish" }
  ];
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3, name: "Reef Explorer" },
    { pairs: 8, cols: 4, rows: 4, name: "Deep Diver" },
    { pairs: 12, cols: 6, rows: 4, name: "Ocean Master" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E6F4FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, levelIndex = 0;
  var hudMoves, hudPairs, hudScore, hudLevel, hudStreak, hudMsg, endOverlay, endTitle, endDetail, endBtnLabel, startOverlay;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    s.input.keyboard.on("keydown-R", function () { restart(s); });
    s.input.keyboard.on("keydown-ESC", function () {
      if (endOverlay.visible) {
        endOverlay.setVisible(false);
        startOverlay.setVisible(true);
        started = false;
        lockBoard = true;
      }
    });
    s.input.keyboard.on("keydown", function (e) {
      if (!started || lockBoard) { return; }
      var idx = parseInt(e.key, 10) - 1;
      if (!isNaN(idx) && idx >= 0 && idx < cards.length) {
        onCard(s, cards[idx]);
      }
    });
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE6F4FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EFFF, 1); g.fillRect(0, 0, W, 180);
    g.fillStyle(0xB8E0F6, 1); g.fillRect(0, 140, W, 80);
    g.fillStyle(0xFFF6B5, 1); g.fillCircle(770, 110, 48);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 36);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xA9DDF0, 1); g.fillRect(0, 200, W, 12);
    g.fillStyle(0x74C0E8, 0.6); g.fillRect(0, 212, W, 8);
    g.fillStyle(0xA9DDF0, 1); g.fillRect(0, 560, W, 140);
    g.fillStyle(0x8ECAE6, 1); g.fillRect(0, 620, W, 80);
    g.fillStyle(0x4EA8DE, 1);
    for (var i = 0; i < 6; i++) {
      var sx = 40 + i * 140;
      g.fillEllipse(sx, 580, 18, 60);
      g.fillEllipse(sx + 12, 590, 14, 50);
    }
    g.fillStyle(0x5DB9E8, 1);
    g.fillCircle(120, 640, 22); g.fillCircle(135, 625, 16);
    g.fillCircle(700, 650, 18); g.fillCircle(720, 635, 14);
    g.fillCircle(400, 645, 20);
    g.fillStyle(0xFFFFFF, 0.9);
    for (var b = 0; b < 12; b++) {
      var bx = 60 + b * 75 + (b % 2) * 20;
      var by = 250 + (b % 3) * 40;
      g.fillCircle(bx, by, 6 + (b % 3) * 3);
      g.fillStyle(0xFFFFFF, 0.5); g.fillCircle(bx - 2, by - 2, 2);
      g.fillStyle(0xFFFFFF, 0.9);
    }
    g.lineStyle(3, 0xFFFFFF, 0.5);
    for (var wy = 230; wy < 260; wy += 12) {
      g.beginPath();
      g.moveTo(0, wy);
      for (var wx = 0; wx <= W; wx += 40) {
        g.lineTo(wx + 20, wy + Math.sin(wx * 0.02) * 4);
      }
      g.strokePath();
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Arcade Match", textStyle(30)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level 1: Reef Explorer", textStyle(18, "#1B4F72")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 78, "Moves: 0", textStyle(20));
    hudPairs = scene.add.text(24, 102, "Pairs: 0 / 6", textStyle(20));
    hudScore = scene.add.text(W - 24, 52, "Score: 0", textStyle(22, "#102A43")).setOrigin(1, 0);
    hudStreak = scene.add.text(W - 24, 78, "Streak: 0  Best: 0", textStyle(18, "#1B4F72")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 108, "Tap a card!", textStyle(20, "#1B4F72")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 138);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -22, 172, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.05); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match pairs \u2022 Build streaks \u2022 Conquer 3 arcade levels!", textStyle(18, "#1B4F72")).setOrigin(0.5);
  }

  function shuffledDeck(numPairs) {
    var pool = OCEAN_ANIMALS.slice(0, numPairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var lvl = LEVELS[levelIndex];
    var deck = shuffledDeck(lvl.pairs);
    var cols = lvl.cols, rows = lvl.rows;
    var maxW = 860, maxH = 360;
    var padX = 14, padY = 12;
    var cw = Math.floor((maxW - (cols - 1) * padX) / cols);
    var ch = Math.floor((maxH - (rows - 1) * padY) / rows);
    if (cw > 185) { cw = 185; }
    if (ch > 140) { ch = 140; }
    if (cw < 110) { cw = 110; }
    if (ch < 90) { ch = 90; }
    var totalW = cols * cw + (cols - 1) * padX;
    var totalH = rows * ch + (rows - 1) * padY;
    var gx = (W - totalW) / 2;
    var gy = 195 + (360 - totalH) / 2;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (hudPairs) { hudPairs.setText("Pairs: 0 / " + lvl.pairs); }
    if (hudLevel) { hudLevel.setText("Level " + (levelIndex + 1) + ": " + lvl.name); }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    back.fillStyle(0xFFFFFF, 0.9);
    back.fillCircle(-w / 4, -h / 4, 8); back.fillCircle(w / 5, -h / 6, 5); back.fillCircle(0, h / 4, 10);
    back.fillStyle(0xFFFFFF, 0.6); back.fillCircle(-w / 4 + 3, -h / 4 - 2, 2); back.fillCircle(2, h / 4 - 3, 3);
    var icon = scene.add.text(0, -4, "\u{1F30A}", { fontSize: "42px" }).setOrigin(0.5);
    var showBack = scene.add.container(0, 0, [back, icon]);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE6F4FF, 0xD6EFFF, 0xB8E0F6, 0xA9DDF0, 0xE0F7FA, 0xCAF0F8];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    fg.lineStyle(2, 0x4EA8DE, 0.3); fg.strokeRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var emoSize = w > 150 ? "56px" : "44px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 150 ? 18 : 16)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, ease: "Quad.easeIn", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Quad.easeOut", onComplete: done || function () {} });
    }});
  }

  function showScorePopup(scene, x, y, text) {
    var t = scene.add.text(x, y, text, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "20px", color: "#102A43", fontStyle: "bold", stroke: "#FFFFFF", strokeThickness: 4 }).setOrigin(0.5).setDepth(10);
    scene.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 700, ease: "Quad.easeOut", onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160, ease: "Quad.easeOut" });
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var base = 100;
        var bonus = streak > 1 ? (streak - 1) * 30 : 0;
        var gained = base + bonus;
        score += gained;
        hudScore.setText("Score: " + score);
        hudStreak.setText("Streak: " + streak + "  Best: " + bestStreak);
        showScorePopup(scene, card.view.x, card.view.y - 40, "+" + gained + (bonus ? " Combo!" : ""));
        for (var i = 0; i < 6; i++) {
          var b = scene.add.text(a.view.x + Phaser.Math.Between(-20, 20), a.view.y, "\u{1F4A7}", { fontSize: "18px" }).setDepth(5).setOrigin(0.5);
          scene.tweens.add({ targets: b, y: b.y - 50 - Phaser.Math.Between(0, 20), alpha: 0, duration: 800, delay: i * 60, onComplete: (function (t) { return function () { t.destroy(); }; })(b) });
        }
        matches++;
        var lvl = LEVELS[levelIndex];
        hudPairs.setText("Pairs: " + matches + " / " + lvl.pairs);
        if (matches === lvl.pairs) {
          hudMsg.setText("Level clear! \u{1F389}");
          lockBoard = false;
          showWin(scene);
        } else {
          hudMsg.setText(streak > 1 ? "Combo x" + streak + "! \u{1F30A}" : "Yay! A pair! \u{1F389}");
          lockBoard = false;
        }
      }, 320);
    } else {
      hudMsg.setText("Try again! \u{1F41A}");
      scene.tweens.add({ targets: [a.view, card.view], x: "+=6", yoyo: true, duration: 80, repeat: 2, ease: "Sine.easeInOut" });
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
        streak = 0;
        hudStreak.setText("Streak: " + streak + "  Best: " + bestStreak);
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-310, -200, 620, 400, 28);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 28);
    var title = scene.add.text(0, -130, "\u{1F30A} Ocean Arcade Match \u{1F433}", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -70, "Dive in and find all the pairs!\n3 arcade levels \u2022 Build combos \u2022 No rush!", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 0, "\u{1F433} \u{1F419} \u{1F42C} \u{1F422} \u{1F980} \u{1F420}", { fontSize: "42px" }).setOrigin(0.5);
    var lvlInfo = scene.add.text(0, 50, "Level 1: Reef Explorer \u2014 6 pairs\nLevel 2: Deep Diver \u2014 8 pairs\nLevel 3: Ocean Master \u2014 12 pairs", Object.assign(textStyle(16, "#1B4F72"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 90, 260, 64, 32);
    var btnTx = scene.add.text(0, 122, "\u25B6  Dive In!", textStyle(26, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, lvlInfo, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 90, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
      }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
      }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-300, -180, 600, 360, 28);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 28);
    endTitle = scene.add.text(0, -110, "\u{1F389} Level Clear! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 60, 280, 60, 30);
    var btnTx = scene.add.text(0, 90, "\u25B6 Next Level", textStyle(24, "#ffffff")).setOrigin(0.5);
    endBtnLabel = btnTx;
    var hint = scene.add.text(0, 135, "Press R to restart \u2022 ESC for menu \u2022 Keys 1-9 to flip", textStyle(14, "#1B4F72")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 60), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      if (levelIndex < LEVELS.length - 1) { nextLevel(scene); } else { restart(scene); }
    });
  }

  function showWin(scene) {
    var lvl = LEVELS[levelIndex];
    var isFinal = levelIndex === LEVELS.length - 1;
    var stars = moves <= lvl.pairs * 2 ? 3 : (moves <= lvl.pairs * 3 ? 2 : 1);
    var efficiencyBonus = Math.max(0, (lvl.pairs * 4 - moves) * 10);
    if (efficiencyBonus > 0) {
      score += efficiencyBonus;
      hudScore.setText("Score: " + score);
    }
    var detail = "You found all " + lvl.pairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  Best Streak: " + bestStreak;
    if (efficiencyBonus > 0) { detail += "\nEfficiency Bonus: +" + efficiencyBonus; }
    if (!isFinal) { detail += "\n\nReady for " + LEVELS[levelIndex + 1].name + "?"; }
    else { detail += "\n\n\u{1F3C6} Arcade Champion! All levels cleared!"; }
    endDetail.setText(detail);
    if (isFinal) {
      endTitle.setText("\u{1F3C6} You Win! \u{1F3C6}");
      endBtnLabel.setText("\u21BB Play Again");
    } else {
      endTitle.setText("\u{1F389} Level " + (levelIndex + 1) + " Clear! \u{1F389}");
      endBtnLabel.setText("\u25B6 Next Level");
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText(isFinal ? "Champion! \u{1F3C6}" : "Amazing! Next level awaits!");
    for (var i = 0; i < 30; i++) {
      var emojis = ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F433}", "\u{1F41A}", "\u{1F499}"];
      var p = scene.add.text(Phaser.Math.Between(0, W), -20, emojis[i % emojis.length], { fontSize: "24px" }).setDepth(30).setAlpha(0.9);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), angle: Phaser.Math.Between(-20, 20), duration: Phaser.Math.Between(1400, 2200), delay: i * 40, ease: "Quad.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    levelIndex = 0; moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudStreak.setText("Streak: 0  Best: 0"); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function nextLevel(scene) {
    levelIndex++;
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0");
    hudPairs.setText("Pairs: 0 / " + LEVELS[levelIndex].pairs);
    hudLevel.setText("Level " + (levelIndex + 1) + ": " + LEVELS[levelIndex].name);
    hudMsg.setText("Level " + (levelIndex + 1) + " \u2014 Go!");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    scene.tweens.add({ targets: hudLevel, scale: 1.15, yoyo: true, duration: 200, ease: "Quad.easeOut" });
  }

  function update() {}
})();
</script>
</body>
</html>
