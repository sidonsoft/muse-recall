<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match - Arcade Edition</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15), 0 0 0 4px #ffb703, 0 0 20px rgba(255,183,3,.35)}
  #aria{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game"></div>
<div id="aria" aria-live="polite" aria-atomic="true"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;
  var INITIAL_TIME = 60;
  var TIME_BONUS_MATCH = 4;
  var TIME_PENALTY_MISS = 2;
  var BASE_SCORE = 100;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var hudTimer, hudLevel, hudArcadeScore, hudComboText, timerBg, timerFill, timerIcon, comboPopup, levelBanner;
  var timeLeft = INITIAL_TIME, score = 0, combo = 0, bestCombo = 0, level = 1;
  var timerEvent = null, isGameOver = false, selectedIndex = 0, flipDelay = 700;
  var audioCtx = null, shakeCooldown = 0;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    s.cameras.main.setBackgroundColor("#fdeec9");
  }

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
  }
  function beep(freq, dur, vol, type, slide) {
    ensureAudio();
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = vol || 0.18;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    if (slide) { o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur); }
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }
  function sfxFlip() { beep(620, 0.12, 0.12, "sine"); }
  function sfxMatch() { beep(440, 0.15, 0.2, "sine"); setTimeout(function(){ beep(660, 0.2, 0.2, "sine"); }, 90); setTimeout(function(){ beep(880, 0.25, 0.18, "sine"); }, 180); }
  function sfxMiss() { beep(180, 0.25, 0.15, "square", 120); }
  function sfxCombo(c) { beep(500 + c*80, 0.18, 0.2, "triangle", 700 + c*80); }
  function sfxTick() { beep(900, 0.08, 0.12, "square"); }
  function sfxLevelUp() { beep(300, 0.2, 0.2, "sine", 600); setTimeout(function(){ beep(500, 0.2, 0.2, "sine", 900); }, 140); setTimeout(function(){ beep(800, 0.4, 0.22, "sine"); }, 280); }
  function sfxGameOver() { beep(400, 0.3, 0.2, "sawtooth", 120); setTimeout(function(){ beep(300, 0.4, 0.2, "sawtooth", 80); }, 250); }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    var arcade = scene.add.graphics();
    arcade.lineStyle(4, 0xffb703, 0.9);
    arcade.strokeRoundedRect(6, 6, W-12, H-12, 18);
    arcade.lineStyle(2, 0xffffff, 0.35);
    arcade.strokeRoundedRect(10, 10, W-20, H-20, 16);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    var arcadeTag = scene.add.text(260, 18, "ARCADE", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "14px", color: "#ffffff", backgroundColor: "#ff006e", padding: { x: 8, y: 4 } }).setOrigin(0, 0);
    arcadeTag.setStyle({ fontStyle: "bold" });

    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(20));
    hudArcadeScore = scene.add.text(24, 106, "Score: 0", textStyle(22, "#b34a3e"));
    hudLevel = scene.add.text(24, 132, "Level: 1", textStyle(18, "#5da85f"));

    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(20, "#7a4a2b")).setOrigin(1, 0.5);
    hudComboText = scene.add.text(W - 24, 78, "", textStyle(20, "#ff006e")).setOrigin(1, 0.5).setVisible(false);

    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });

    var barW = 360, barH = 18, barX = W/2 - barW/2, barY = 148;
    timerBg = scene.add.graphics();
    timerBg.fillStyle(0x000000, 0.12); timerBg.fillRoundedRect(barX, barY, barW, barH, 9);
    timerBg.lineStyle(2, 0xffffff, 0.9); timerBg.strokeRoundedRect(barX, barY, barW, barH, 9);
    timerFill = scene.add.graphics();
    timerIcon = scene.add.text(barX - 22, barY + barH/2, "\u23F1", { fontSize: "18px" }).setOrigin(0.5);
    hudTimer = scene.add.text(barX + barW/2, barY + barH/2, INITIAL_TIME + "s", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "13px", color: "#ffffff", fontStyle: "bold" }).setOrigin(0.5);
    hudTimer.setDepth(2);
    updateTimerDisplay();

    scene.add.text(W / 2, 178, "Match fast! Combo = bonus! Beat the clock!", textStyle(16, "#8a6a4a")).setOrigin(0.5);

    comboPopup = scene.add.text(W/2, 260, "", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "42px", color: "#ff006e", stroke: "#ffffff", strokeThickness: 6, fontStyle: "bold" }).setOrigin(0.5).setDepth(15).setVisible(false).setAlpha(0);
    levelBanner = scene.add.text(W/2, H/2 - 10, "", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "56px", color: "#ffb703", stroke: "#5b3a29", strokeThickness: 8, fontStyle: "bold" }).setOrigin(0.5).setDepth(15).setVisible(false).setScale(0.5);
  }

  function updateTimerDisplay() {
    if (!timerFill) return;
    var barW = 360, barH = 18, barX = W/2 - barW/2, barY = 148;
    var pct = Phaser.Math.Clamp(timeLeft / INITIAL_TIME, 0, 1);
    var fillW = Math.max(0, Math.floor(barW * pct));
    timerFill.clear();
    var col = 0x5da85f;
    if (timeLeft <= 15) col = 0xff006e;
    else if (timeLeft <= 30) col = 0xffb703;
    timerFill.fillStyle(col, 1);
    if (fillW > 0) timerFill.fillRoundedRect(barX, barY, fillW, barH, 9);
    hudTimer.setText(Math.ceil(timeLeft) + "s");
    if (timeLeft <= 10 && timeLeft > 0) {
      hudTimer.setColor("#ff006e");
      timerIcon.setScale(1.2);
    } else {
      hudTimer.setColor("#ffffff");
      timerIcon.setScale(1);
    }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    selectedIndex = 0;
    updateSelectionHighlight();
    announce("Board ready. Level " + level + ". Find pairs fast!");
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    var selectFrame = scene.add.graphics();
    selectFrame.lineStyle(4, 0xffb703, 1); selectFrame.strokeRoundedRect(-w/2 -4, -h/2 -4, w+8, h+8, 24);
    selectFrame.setVisible(false);
    var glow = scene.add.graphics();
    glow.fillStyle(0xffb703, 0.18); glow.fillRoundedRect(-w/2 -6, -h/2 -6, w+12, h+12, 26);
    glow.setVisible(false);
    cont.add([glow, selectFrame, showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, idx: idx, selectFrame: selectFrame, glow: glow, x: x, y: y, w: w, h: h };
    cont.on("pointerdown", function () {
      ensureAudio();
      selectedIndex = idx;
      updateSelectionHighlight();
      onCard(scene, card);
    });
    cont.on("pointerover", function () {
      if (!card.matched && !card.faceUp) scene.tweens.add({ targets: cont, scale: 1.03, duration: 100 });
    });
    cont.on("pointerout", function () {
      scene.tweens.add({ targets: cont, scale: 1, duration: 100 });
    });
    return card;
  }

  function updateSelectionHighlight() {
    cards.forEach(function(c, i){
      var isSel = i === selectedIndex && started && !isGameOver;
      c.selectFrame.setVisible(isSel);
      c.glow.setVisible(isSel);
      if (isSel) {
        c.view.setDepth(2);
      } else {
        c.view.setDepth(0);
      }
    });
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (!started || isGameOver) {
        if (e.code === "Enter" || e.code === "Space") {
          if (startOverlay && startOverlay.visible) {
            ensureAudio();
            started = true; lockBoard = false; isGameOver = false;
            startOverlay.setVisible(false);
            hudMsg.setText("Go! Go! Go!");
            startTimer(scene);
            updateSelectionHighlight();
          } else if (endOverlay && endOverlay.visible) {
            ensureAudio();
            restart(scene);
          }
        }
        return;
      }
      var cols = 4;
      var handled = true;
      if (e.code === "ArrowRight") { selectedIndex = (selectedIndex + 1) % cards.length; }
      else if (e.code === "ArrowLeft") { selectedIndex = (selectedIndex - 1 + cards.length) % cards.length; }
      else if (e.code === "ArrowDown") { selectedIndex = (selectedIndex + cols) % cards.length; }
      else if (e.code === "ArrowUp") { selectedIndex = (selectedIndex - cols + cards.length) % cards.length; }
      else if (e.code === "Enter" || e.code === "Space") {
        var card = cards[selectedIndex];
        if (card) onCard(scene, card);
      } else if (e.code === "KeyR") {
        restart(scene);
      } else { handled = false; }
      if (handled) {
        updateSelectionHighlight();
        if (e.code.indexOf("Arrow") === 0) {
          var c = cards[selectedIndex];
          if (c) {
            scene.tweens.add({ targets: c.view, scale: 1.08, duration: 80, yoyo: true });
            beep(700, 0.08, 0.08, "sine");
          }
        }
      }
    });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    if (show) sfxFlip();
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || isGameOver || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("First pick " + card.data.name); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        scene.tweens.add({ targets: [a.view, card.view], angle: { from: -3, to: 3 }, duration: 120, yoyo: true });
        sfxMatch();
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        var base = BASE_SCORE;
        var mult = combo;
        var timeBonus = Math.max(0, Math.floor(timeLeft * 0.5));
        var gained = base * mult + timeBonus + (level * 20);
        score += gained;
        hudArcadeScore.setText("Score: " + score);
        timeLeft = Math.min(INITIAL_TIME + level*10, timeLeft + TIME_BONUS_MATCH + Math.floor(combo/2));
        updateTimerDisplay();
        showFloatingText(scene, (a.x + card.x)/2, (a.y + card.y)/2 - 30, "+" + gained, "#5da85f");
        if (combo > 1) {
          showComboPopup(scene, combo);
          sfxCombo(combo);
          hudComboText.setText("COMBO x" + combo + " \u{1F525}").setVisible(true);
          hudComboText.setColor(combo >= 3 ? "#ff006e" : "#ff8500");
          scene.tweens.add({ targets: hudComboText, scale: { from: 1.4, to: 1 }, duration: 200, ease: "Back.easeOut" });
        } else {
          hudComboText.setVisible(false);
        }
        spawnBurst(scene, a.x, a.y, 0xffb703);
        spawnBurst(scene, card.x, card.y, 0x5da85f);
        if (scene.cameras.main.shake && combo >= 2) { scene.cameras.main.shake(120, 0.006 * Math.min(combo, 4)); }
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(combo >= 3 ? "FRENZY! \u{1F525}" : (combo >= 2 ? "Combo! \u2728" : "Yay! A pair! \u{1F389}"));
        announce("Match! " + card.data.name + " pair. Combo " + combo + ". Score " + score);
        lockBoard = false;
        if (matches === 6) { levelComplete(scene); }
        else { updateSelectionHighlight(); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      combo = 0;
      hudComboText.setVisible(false);
      timeLeft = Math.max(0, timeLeft - TIME_PENALTY_MISS);
      updateTimerDisplay();
      showFloatingText(scene, card.x, card.y - 20, "-" + TIME_PENALTY_MISS + "s", "#ff006e");
      sfxMiss();
      if (scene.cameras.main.shake) scene.cameras.main.shake(180, 0.008);
      scene.tweens.add({ targets: [a.view, card.view], x: { from: a.view.x - 6, to: a.view.x + 6 }, duration: 60, yoyo: true, repeat: 2 });
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateSelectionHighlight(); });
      }, flipDelay);
    }
  }

  function showFloatingText(scene, x, y, txt, color) {
    var t = scene.add.text(x, y, txt, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "28px", color: color, stroke: "#ffffff", strokeThickness: 4, fontStyle: "bold" }).setOrigin(0.5).setDepth(12);
    scene.tweens.add({ targets: t, y: y - 50, alpha: 0, scale: 1.2, duration: 700, ease: "Cubic.easeOut", onComplete: function(){ t.destroy(); } });
  }

  function showComboPopup(scene, c) {
    var txt = c >= 4 ? "MEGA COMBO x" + c + "!!" : (c === 3 ? "SUPER COMBO x3!" : "COMBO x" + c + "!");
    comboPopup.setText(txt);
    comboPopup.setVisible(true).setAlpha(1).setScale(0.6);
    comboPopup.setColor(c >= 3 ? "#ff006e" : "#ff8500");
    scene.tweens.add({ targets: comboPopup, scale: 1.15, duration: 180, ease: "Back.easeOut", onComplete: function(){
      scene.tweens.add({ targets: comboPopup, alpha: 0, y: comboPopup.y - 20, duration: 400, delay: 300, onComplete: function(){ comboPopup.setVisible(false).setY(260).setAlpha(1); } });
    }});
  }

  function spawnBurst(scene, x, y, col) {
    var hex = "#" + ("000000" + col.toString(16)).slice(-6);
    for (var i=0;i<10;i++) {
      var p = scene.add.graphics();
      p.fillStyle(col, 1); p.fillCircle(0,0, Phaser.Math.Between(4,7));
      p.x = x; p.y = y; p.setDepth(11);
      var ang = (i/10)*Math.PI*2;
      var dist = Phaser.Math.Between(40, 90);
      scene.tweens.add({ targets: p, x: x + Math.cos(ang)*dist, y: y + Math.sin(ang)*dist - 20, alpha: 0, scale: 0.2, duration: Phaser.Math.Between(400,650), ease: "Cubic.easeOut", onComplete: (function(g){ return function(){ g.destroy(); }; })(p) });
    }
    var ring = scene.add.graphics();
    ring.lineStyle(3, col, 0.9); ring.strokeCircle(x, y, 10); ring.setDepth(11);
    scene.tweens.add({ targets: ring, scale: 2.2, alpha: 0, duration: 350, onComplete: function(){ ring.destroy(); } });
  }

  function startTimer(scene) {
    if (timerEvent) { timerEvent.remove(); timerEvent = null; }
    timeLeft = INITIAL_TIME;
    updateTimerDisplay();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function(){ onTick(scene); } });
  }

  function onTick(scene) {
    if (!started || isGameOver) return;
    timeLeft -= 1;
    if (timeLeft <= 10 && timeLeft > 0) sfxTick();
    updateTimerDisplay();
    if (timeLeft <= 0) {
      timeLeft = 0;
      updateTimerDisplay();
      gameOver(scene);
    } else if (timeLeft <= 10) {
      if (scene.cameras.main.shake && timeLeft % 2 === 0) scene.cameras.main.shake(80, 0.004);
      timerFill.setAlpha(0.6 + Math.abs(Math.sin(Date.now()/120))*0.4);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(3, 0x5da85f, 1); panel.strokeRoundedRect(-294, -204, 588, 408, 26);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(36)).setOrigin(0.5);
    var arcadeBadge = scene.add.text(0, -115, "\u2605 ARCADE EDITION \u2605", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "18px", color: "#ff006e", fontStyle: "bold", backgroundColor: "#fff0f5", padding: { x: 10, y: 4 } }).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Beat the clock! Chain combos\nfor huge bonuses!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var feats = scene.add.text(0, 5, "\u23F1 60s  \u2022  \u{1F525} Combo x5  \u2022  \u2B50 Time Bonus", textStyle(16, "#5b3a29")).setOrigin(0.5);
    var row = scene.add.text(0, 42, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 78, "Use mouse or arrow keys + Enter", textStyle(14, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0xff006e, 1); btnBg.fillRoundedRect(-130, 100, 260, 70, 35);
    btnBg.fillStyle(0xffffff, 0.18); btnBg.fillRoundedRect(-130, 100, 260, 22, 35);
    var btnTx = scene.add.text(0, 135, "\u25B6  START!", textStyle(30, "#ffffff")).setOrigin(0.5);
    var btnSub = scene.add.text(0, 155, "Press Enter", textStyle(12, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, arcadeBadge, sub, feats, row, hint, btnBg, btnTx, btnSub]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 100, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      ensureAudio();
      started = true; lockBoard = false; isGameOver = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Go! Go! Go! \u{1F525}");
      startTimer(scene);
      updateSelectionHighlight();
      announce("Game started. 60 seconds. Good luck!");
    });
    btnBg.on("pointerover", function(){ startOverlay.setScale(1.02); });
    btnBg.on("pointerout", function(){ startOverlay.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.55); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    endTitle = scene.add.text(0, -120, "\u{1F389} You Win! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 60, 260, 70, 35);
    var btnTx = scene.add.text(0, 95, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint2 = scene.add.text(0, 145, "Press Enter or click", textStyle(14, "#8a6a4a")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint2]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 60, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
  }

  function levelComplete(scene) {
    var bonus = Math.floor(timeLeft * 8) + level * 150;
    score += bonus;
    hudArcadeScore.setText("Score: " + score);
    levelBanner.setText("LEVEL " + level + " CLEAR!");
    levelBanner.setVisible(true).setAlpha(1).setScale(0.5);
    scene.tweens.add({ targets: levelBanner, scale: 1.1, duration: 220, ease: "Back.easeOut", onComplete: function(){
      scene.tweens.add({ targets: levelBanner, scale: 1, alpha: 0, duration: 300, delay: 600, onComplete: function(){ levelBanner.setVisible(false); } });
    }});
    sfxLevelUp();
    hudMsg.setText("Level " + level + " clear! +" + bonus + " \u2B50");
    showFloatingText(scene, W/2, H/2 - 80, "LEVEL BONUS +" + bonus, "#ffb703");
    for (var i = 0; i < 24; i++) {
      var p = scene.add.text(Phaser.Math.Between(80, W-80), H/2 + Phaser.Math.Between(-40,40), ["\u2B50","\u{1F389}","\u{1F525}"][i%3], { fontSize: "22px" }).setDepth(14);
      scene.tweens.add({ targets: p, y: p.y - Phaser.Math.Between(60,120), alpha: 0, duration: Phaser.Math.Between(600,900), onComplete: (function(t){ return function(){ t.destroy(); }; })(p) });
    }
    if (scene.cameras.main.flash) scene.cameras.main.flash(250, 255, 183, 3);
    level++;
    hudLevel.setText("Level: " + level);
    flipDelay = Math.max(300, 700 - (level-1)*45);
    timeLeft = Math.min(INITIAL_TIME + level*8, timeLeft + 8 + level);
    updateTimerDisplay();
    matches = 0;
    hudScore.setText("Pairs: 0 / 6");
    lockBoard = true;
    scene.time.delayedCall(1100, function(){
      if (isGameOver) return;
      cards.forEach(function(c){ c.view.destroy(); });
      buildBoard(scene);
      lockBoard = false;
      hudMsg.setText("Level " + level + "! Go! \u{1F680}");
      announce("Level " + level + " started");
    });
  }

  function gameOver(scene) {
    if (isGameOver) return;
    isGameOver = true;
    lockBoard = true;
    if (timerEvent) { timerEvent.remove(); timerEvent = null; }
    sfxGameOver();
    if (scene.cameras.main.shake) scene.cameras.main.shake(400, 0.012);
    var isWin = score > 800;
    endTitle.setText(timeLeft <= 0 ? "\u23F1 Time's Up!" : (isWin ? "\u{1F3C6} Arcade Champion!" : "\u{1F389} Game Over!"));
    var stars = score >= 1500 ? 3 : (score >= 800 ? 2 : 1);
    var rank = score >= 2000 ? "FARM LEGEND" : (score >= 1200 ? "BARN STAR" : (score >= 600 ? "ROOKIE" : "CHICK"));
    endDetail.setText("Score: " + score + "  " + "\u2B50".repeat(stars) + "\nLevel: " + level + "  \u2022  Best Combo: x" + bestCombo + "\nMoves: " + moves + "  \u2022  Rank: " + rank + "\n" + (timeLeft <= 0 ? "The clock beat you!" : "Amazing run!"));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 280, ease: "Back.easeOut" });
    hudMsg.setText("Game Over! \u23F1");
    announce("Game over. Score " + score + ". Level " + level + ". Best combo " + bestCombo);
    for (var i = 0; i < 30; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u23F1"][i % 5], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showWin(scene) {
    levelComplete(scene);
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; isGameOver = false;
    score = 0; combo = 0; bestCombo = 0; level = 1; timeLeft = INITIAL_TIME; flipDelay = 700;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudArcadeScore.setText("Score: 0"); hudLevel.setText("Level: 1"); hudMsg.setText("Go! Go! Go! \u{1F525}"); hudComboText.setVisible(false);
    updateTimerDisplay();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    if (scene.cameras.main.flash) scene.cameras.main.flash(200, 93, 168, 95);
    announce("Restarted. Level 1. Score zero.");
  }

  function announce(msg) {
    var el = document.getElementById("aria");
    if (el) el.textContent = msg;
  }

  function update() {
    if (started && !isGameOver && timeLeft <= 10 && timeLeft > 0) {
      var s = 1 + Math.sin(Date.now()/100) * 0.03;
      if (timerFill) timerFill.setScale(s);
    } else if (timerFill) {
      timerFill.setScale(1);
    }
  }
})();
</script>
</body>
</html>
