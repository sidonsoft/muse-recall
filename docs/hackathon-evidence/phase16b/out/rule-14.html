<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Arcade Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean Arcade Memory Match game. Use mouse or keyboard arrows and Enter to flip cards and find pairs. Press R to restart."></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "🐙", name: "Octopus" },
    { emoji: "🐳", name: "Whale" },
    { emoji: "🐬", name: "Dolphin" },
    { emoji: "🦈", name: "Shark" },
    { emoji: "🐠", name: "Fish" },
    { emoji: "🦀", name: "Crab" },
    { emoji: "🐢", name: "Turtle" },
    { emoji: "🦑", name: "Squid" },
    { emoji: "🐚", name: "Shell" },
    { emoji: "⭐", name: "Starfish" }
  ];
  var W = 900, H = 700;
  var PAIRS_PER_LEVEL = [6, 8, 10];
  var MAX_LEVEL = PAIRS_PER_LEVEL.length;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#D4EAF7",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, combo = 0, level = 1;
  var hudMoves, hudScore, hudLevel, hudCombo, hudMsg, endOverlay, endTitle, endDetail, endBtnLabel, startOverlay;
  var bubbles = [], focusedIndex = 0, focusRect = null;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    createBubbles(s);
    setupKeyboard(s);
    setFocus(0);
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE6F6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD4EAF7, 1); g.fillRect(0, 0, W, 470);
    g.fillStyle(0xB8E6FE, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x4EA8DE, 0.12); g.fillEllipse(200, 460, 900, 40);
    g.fillStyle(0x4EA8DE, 0.10); g.fillEllipse(600, 475, 700, 30);
    g.fillStyle(0x7EC8E3, 1);
    g.fillEllipse(120, 560, 18, 60); g.fillEllipse(140, 540, 14, 50); g.fillEllipse(100, 550, 12, 45);
    g.fillEllipse(780, 570, 20, 70); g.fillEllipse(800, 550, 16, 55); g.fillEllipse(760, 560, 12, 48);
    g.fillStyle(0x4EA8DE, 0.18);
    g.fillCircle(180, 80, 22); g.fillCircle(210, 70, 14); g.fillCircle(160, 95, 10);
    g.fillCircle(650, 60, 18); g.fillCircle(680, 75, 12);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(770, 110, 38);
    g.fillStyle(0xE0F2FE, 1); g.fillCircle(770, 110, 28);
    g.fillStyle(0xffffff, 0.55);
    g.fillEllipse(220, 90, 140, 36); g.fillEllipse(270, 80, 110, 32);
    g.fillEllipse(560, 70, 130, 34);
    g.fillStyle(0xC1E7FF, 1);
    for (var i = 0; i < 8; i++) {
      var fx = 30 + i * 110, fy = 620 + (i % 2) * 18;
      g.fillCircle(fx, fy, 7); g.fillCircle(fx + 10, fy + 6, 5); g.fillCircle(fx - 8, fy + 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "🌊 Ocean Arcade Match", textStyle(32)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 54, "Level: 1 / 3", textStyle(20));
    hudMoves = scene.add.text(24, 80, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 106, "Score: 0", textStyle(20));
    hudCombo = scene.add.text(W - 24, 88, "", textStyle(20, "#4EA8DE")).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "↻ Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find pairs • Build combos • Clear the reef!", textStyle(18, "#102A43")).setOrigin(0.5);
    focusRect = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function getLayout(lvl) {
    var pairs = PAIRS_PER_LEVEL[lvl - 1];
    if (pairs === 6) { return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 }; }
    if (pairs === 8) { return { cols: 4, rows: 4, cw: 185, ch: 110, gx: 62, gy: 185, padX: 22, padY: 12 }; }
    return { cols: 5, rows: 4, cw: 145, ch: 110, gx: 40, gy: 185, padX: 16, padY: 12 };
  }

  function shuffledDeckForLevel(lvl) {
    var count = PAIRS_PER_LEVEL[lvl - 1];
    var deck = [];
    for (var i = 0; i < count; i++) {
      var a = OCEAN_ANIMALS[i % OCEAN_ANIMALS.length];
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    }
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeckForLevel(level);
    var L = getLayout(level);
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / L.cols), c = idx % L.cols;
      var cx = L.gx + c * (L.cw + L.padX) + L.cw / 2;
      var cy = L.gy + r * (L.ch + L.padY) + L.ch / 2;
      cards.push(makeCard(scene, cx, cy, L.cw, L.ch, card, idx));
    });
    focusedIndex = 0;
    setFocus(0);
    updateHud();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 5, 10); back.fillCircle(w / 5, -2, 7); back.fillCircle(0, h / 4, 11);
    back.fillStyle(0xffffff, 0.45); back.fillCircle(-w / 6, h / 6, 5);
    var paw = scene.add.text(0, -4, "🌊", { fontSize: "42px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xD4EAF7, 0xB8E6FE, 0xE0F2FE, 0xC1E7FF, 0xA8D8EA, 0xD0EBFF, 0xE6F6FF, 0xB0D8F0, 0xC8E7FF, 0xA0D2EB];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    var emo = scene.add.text(0, -16, data.emoji, { fontSize: h > 120 ? "56px" : "44px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(h > 120 ? 18 : 16)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) { cont.setScale(1.03); } });
    cont.on("pointerout", function () { cont.setScale(1); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! 🌊"); setFocus(card.index); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        combo++;
        var base = 100;
        var bonus = combo > 1 ? 50 * (combo - 1) : 0;
        score += base + bonus;
        showScorePopup(scene, card.view.x, card.view.y, "+" + base + (bonus ? " +" + bonus + " combo!" : ""));
        if (combo > 1) {
          hudCombo.setText("Combo x" + combo + " 🔥");
          scene.tweens.add({ targets: hudCombo, scale: { from: 1.2, to: 1 }, duration: 200 });
        } else {
          hudCombo.setText("Nice! +100");
        }
        updateHud();
        hudMsg.setText(matches === PAIRS_PER_LEVEL[level - 1] ? "Amazing!" : (combo > 1 ? "Combo x" + combo + "! 🎉" : "Yay! A pair! 🎉"));
        for (var i = 0; i < 8; i++) {
          var bx = scene.add.graphics().setDepth(12);
          bx.fillStyle(0xffffff, 0.9); bx.fillCircle(0, 0, 4 + Math.random() * 4);
          bx.x = card.view.x; bx.y = card.view.y;
          scene.tweens.add({ targets: bx, y: bx.y - 60 - Math.random() * 40, x: bx.x + Phaser.Math.Between(-30, 30), alpha: 0, duration: 700, onComplete: (function (t) { return function () { t.destroy(); }; })(bx) });
        }
        lockBoard = false;
        if (matches === PAIRS_PER_LEVEL[level - 1]) { showWin(scene); }
        else { setFocus(card.index); }
      }, 350);
    } else {
      combo = 0;
      hudCombo.setText("");
      updateHud();
      hudMsg.setText("Nice try! Keep going! 🌊");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; setFocus(card.index); });
      }, 700);
    }
  }

  function showScorePopup(scene, x, y, txt) {
    var t = scene.add.text(x, y - 50, txt, textStyle(22, "#102A43")).setOrigin(0.5).setDepth(15);
    t.setStroke("#ffffff", 4);
    scene.tweens.add({ targets: t, y: y - 90, alpha: 0, duration: 800, ease: "Quad.easeOut", onComplete: function () { t.destroy(); } });
  }

  function updateHud() {
    hudLevel.setText("Level: " + level + " / " + MAX_LEVEL);
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Score: " + score);
    var total = PAIRS_PER_LEVEL[level - 1];
    if (hudScore && hudScore.scene) {
      var pairsText = sceneRef ? sceneRef.add : null;
    }
    // Pairs display via hudScore sibling - reuse hudMoves area for pairs
    // We keep pairs in hudMsg area? Instead update a dedicated text if exists
    // For simplicity, update hudLevel to include pairs
    // Create or update pairs text
    if (!window._hudPairs) {
      // create once
    }
  }

  var sceneRef = null;
  var hudPairs = null;

  function ensurePairsHud(scene) {
    if (!hudPairs) {
      hudPairs = scene.add.text(24, 132, "Pairs: 0 / " + PAIRS_PER_LEVEL[level - 1], textStyle(20));
    } else {
      hudPairs.setText("Pairs: " + matches + " / " + PAIRS_PER_LEVEL[level - 1]);
    }
  }

  // Wrap original updateHud to include pairs
  var _origUpdateHud = updateHud;
  updateHud = function () {
    hudLevel.setText("Level: " + level + " / " + MAX_LEVEL);
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Score: " + score);
    if (hudPairs) { hudPairs.setText("Pairs: " + matches + " / " + PAIRS_PER_LEVEL[level - 1]); }
    if (combo > 1) { hudCombo.setText("Combo x" + combo + " 🔥"); } else if (combo === 1) { hudCombo.setText("Combo!"); } else { if (hudCombo) { hudCombo.setText(""); } }
  };

  function makeStartOverlay(scene) {
    sceneRef = scene;
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 28);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 28);
    var title = scene.add.text(0, -130, "🌊 Ocean Arcade Match", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Dive through 3 arcade levels!\nMatch ocean friends & build combos!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "🐙 🐳 🐬 🦈 🐠 🦀", { fontSize: "42px" }).setOrigin(0.5);
    var feat = scene.add.text(0, 55, "No timers • No penalties • Just pure fun!", textStyle(16, "#4EA8DE")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 85, 260, 64, 32);
    var btnTx = scene.add.text(0, 117, "▶  Dive In", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, feat, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 85, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Find a pair! 🌊");
      ensurePairsHud(scene);
      updateHud();
    });
    btnBg.on("pointerover", function () { btnBg.setScale(1.04); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); });
    ensurePairsHud(scene);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -175, 600, 350, 28);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -175, 600, 350, 28);
    endTitle = scene.add.text(0, -105, "🎉 You Win! 🎉", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-135, 55, 270, 64, 32);
    endBtnLabel = scene.add.text(0, 87, "↻ Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnLabel]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-135, 55, 270, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      if (level < MAX_LEVEL && endBtnLabel.text.indexOf("Next") !== -1) { nextLevel(scene); }
      else { restart(scene); }
    });
    btnBg.on("pointerover", function () { btnBg.setScale(1.04); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); });
  }

  function showWin(scene) {
    if (level < MAX_LEVEL) {
      showLevelComplete(scene);
      return;
    }
    var stars = moves <= 12 ? 3 : (moves <= 18 ? 2 : 1);
    endTitle.setText("🏆 Ocean Master! 🏆");
    endDetail.setText("You cleared all 3 reefs!\nScore: " + score + "  Moves: " + moves + "  " + "⭐".repeat(stars) + "\nCombo master! No penalties, just fun!");
    endBtnLabel.setText("↻ Play Again");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("You win! 🎉");
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["🌊", "⭐", "🎉", "🐙", "🐬"][i % 5], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1400, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLevelComplete(scene) {
    var bonus = 200;
    score += bonus;
    updateHud();
    endTitle.setText("🌟 Level " + level + " Complete! 🌟");
    endDetail.setText("Reef " + level + " cleared!\nScore: " + score + "  Pairs: " + matches + " / " + PAIRS_PER_LEVEL[level - 1] + "\nBonus +" + bonus + " for leveling up!");
    endBtnLabel.setText("Next Reef →");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("Level Up! 🌊");
    for (var i = 0; i < 24; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["💧", "🌊", "⭐", "🐠"][i % 4], { fontSize: "24px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-50, 50), duration: Phaser.Math.Between(1300, 2000), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function nextLevel(scene) {
    level++;
    moves = 0; matches = 0; firstPick = null; lockBoard = false; combo = 0;
    hudMsg.setText("Level " + level + "! Go! 🌊");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateHud();
  }

  function restart(scene) {
    level = 1; moves = 0; matches = 0; score = 0; combo = 0; firstPick = null; lockBoard = false; started = true;
    hudMsg.setText("Tap a card! 🌊");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateHud();
  }

  function createBubbles(scene) {
    for (var i = 0; i < 12; i++) {
      var b = scene.add.graphics();
      var sz = 3 + Math.random() * 6;
      b.fillStyle(0xffffff, 0.5 + Math.random() * 0.3); b.fillCircle(0, 0, sz);
      b.x = Math.random() * W; b.y = 470 + Math.random() * 200;
      b.speed = 0.3 + Math.random() * 0.7;
      b.alphaBase = b.alpha;
      bubbles.push(b);
    }
  }

  function setFocus(idx) {
    if (!cards.length) { return; }
    if (idx < 0) { idx = cards.length - 1; }
    if (idx >= cards.length) { idx = 0; }
    focusedIndex = idx;
    var c = cards[idx];
    if (!c || !focusRect) { return; }
    focusRect.clear();
    focusRect.lineStyle(4, 0x4EA8DE, 1);
    focusRect.strokeRoundedRect(c.view.x - c.view.displayWidth / 2 - 6, c.view.y - c.view.displayHeight / 2 - 6, c.view.displayWidth + 12, c.view.displayHeight + 12, 20);
    focusRect.setVisible(started && !c.matched);
  }

  function setupKeyboard(scene) {
    document.addEventListener("keydown", function (e) {
      if (e.key === "r" || e.key === "R") { restart(scene); return; }
      if (!started) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          started = true; lockBoard = false;
          if (startOverlay) { startOverlay.setVisible(false); }
          hudMsg.setText("Find a pair! 🌊");
          ensurePairsHud(scene);
          updateHud();
          setFocus(0);
        }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (level < MAX_LEVEL && endBtnLabel.text.indexOf("Next") !== -1) { nextLevel(scene); }
          else { restart(scene); }
        }
        return;
      }
      var L = getLayout(level);
      var cols = L.cols;
      if (e.key === "ArrowLeft") { e.preventDefault(); setFocus(focusedIndex - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); setFocus(focusedIndex + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setFocus(focusedIndex - cols); }
      else if (e.key === "ArrowDown") { e.preventDefault(); setFocus(focusedIndex + cols); }
      else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        var card = cards[focusedIndex];
        if (card) { onCard(scene, card); }
      }
    });
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed;
      b.x += Math.sin(Date.now() * 0.001 + i) * 0.2;
      if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; }
    }
    if (focusRect && focusRect.visible && cards[focusedIndex]) {
      var c = cards[focusedIndex];
      if (c.matched) { focusRect.setVisible(false); }
    }
  }
})();
</script>
