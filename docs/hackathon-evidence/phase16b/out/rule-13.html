<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F419}", name: "Octo" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F42C}", name: "Dolphin" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, streak = 0, bestStreak = 0, level = 1;
  var selectedPairs = 6;
  var hudMoves, hudScore, hudMsg, hudStreak, hudLevel, endOverlay, endTitle, endDetail, startOverlay;
  var bubbles = [], waveOffset = 0;
  var difficultyButtons = [];

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    createBubbles(s);
    s.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Find the pairs! \u2728");
      } else if (endOverlay && endOverlay.visible) {
        restart(s);
      }
    });
    s.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Find the pairs! \u2728");
      }
    });
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 0, W, 170);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 95, 140, 42); g.fillEllipse(230, 85, 110, 38);
    g.fillEllipse(560, 70, 130, 36); g.fillEllipse(600, 85, 90, 28);
    g.fillStyle(0xA9D6E5, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x4EA8DE, 1);
    g.fillRect(0, 460, W, 18);
    g.fillStyle(0x89C2D9, 1);
    for (var i = 0; i < W; i += 40) {
      g.fillEllipse(i + 20, 472, 60, 18);
    }
    g.fillStyle(0x2A6F97, 0.12); g.fillRect(0, 520, W, 180);
    g.fillStyle(0x61A5C2, 1);
    g.fillEllipse(120, 560, 90, 22); g.fillEllipse(780, 580, 110, 24);
    g.fillStyle(0xEAF6FB, 0.7);
    for (var b = 0; b < 6; b++) {
      var bx = 80 + b * 140, by = 500 + (b % 2) * 20;
      g.fillCircle(bx, by, 6); g.fillCircle(bx + 10, by - 12, 4); g.fillCircle(bx - 8, by - 10, 3);
    }
    g.fillStyle(0x4EA8DE, 0.15); g.fillRoundedRect(40, 200, 820, 360, 24);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Arcade Match", textStyle(32, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 56, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudLevel = scene.add.text(24, 108, "Level: 1", textStyle(18, "#2A6F97"));
    hudStreak = scene.add.text(24, 132, "Streak: 0  Best: 0", textStyle(18, "#2A6F97"));
    hudMsg = scene.add.text(W - 24, 60, "Welcome!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.05); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match pairs to build your streak \u2728 No rush, just fun!", textStyle(18, "#2A6F97")).setOrigin(0.5);
  }

  function createBubbles(scene) {
    for (var i = 0; i < 8; i++) {
      var b = scene.add.graphics();
      b.fillStyle(0xffffff, 0.35);
      var r = Phaser.Math.Between(4, 8);
      b.fillCircle(0, 0, r);
      b.x = Phaser.Math.Between(40, W - 40);
      b.y = Phaser.Math.Between(480, 680);
      b.setDepth(1);
      b.alpha = 0.5;
      bubbles.push({ g: b, speed: 0.2 + Math.random() * 0.4, drift: (Math.random() - 0.5) * 0.3, r: r });
    }
  }

  function shuffledDeck(numPairs) {
    var count = numPairs || selectedPairs;
    var pool = ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck(selectedPairs);
    var total = deck.length;
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (total === 12) { cols = 4; rows = 3; cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16; }
    else if (total === 16) { cols = 4; rows = 4; cw = 185; ch = 108; gx = 62; gy = 188; padX = 22; padY = 12; }
    else { cols = 5; rows = 4; cw = 150; ch = 108; gx = 42; gy = 188; padX = 16; padY = 12; }
    hudScore.setText("Pairs: 0 / " + selectedPairs);
    hudLevel.setText("Level: " + level + "  \u2022  " + selectedPairs + " pairs");
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 5, 10); back.fillCircle(w / 5, -2, 7); back.fillCircle(0, h / 4, 11);
    back.fillStyle(0xA9D6E5, 0.9); back.fillCircle(-w / 3, h / 3, 5);
    var paw = scene.add.text(0, -4, "\u{1F4A7}", { fontSize: "42px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xD6EAF8, 0xA9D6E5, 0xEAF6FB, 0xB8E0D2, 0xC1E7FF, 0xD4F0F0, 0xE0F2FE, 0xCAF0F8, 0xADE8F4, 0x90E0EF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    fg.lineStyle(3, 0x4EA8DE, 0.35); fg.strokeRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    var emoSize = w > 160 ? "56px" : "48px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 160 ? 20 : 18, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) { scene.tweens.add({ targets: cont, scale: 1.03, duration: 120 }); } });
    cont.on("pointerout", function () { if (!card.matched) { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); } });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, ease: "Sine.easeInOut", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Sine.easeInOut", onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u{1F50D}"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        scene.tweens.add({ targets: [a.view, card.view], angle: { from: -2, to: 2 }, yoyo: true, duration: 180 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        hudStreak.setText("Streak: " + streak + "  Best: " + bestStreak);
        hudScore.setText("Pairs: " + matches + " / " + selectedPairs);
        var msgs = ["Nice splash! \u{1F4A6}", "Great match! \u2728", "Super! \u{1F30A}", "Amazing! \u{2B50}", "Combo x" + streak + "! \u{1F389}"];
        var msgIndex = Math.min(streak - 1, msgs.length - 1);
        if (streak >= 2) { hudMsg.setText(msgs[msgIndex]); } else { hudMsg.setText(matches === selectedPairs ? "You did it!" : "Yay! A pair! \u{1F389}"); }
        spawnSplash(scene, card.view.x, card.view.y);
        spawnSplash(scene, a.view.x, a.view.y);
        lockBoard = false;
        if (matches === selectedPairs) { showWin(scene); }
      }, 320);
    } else {
      hudMsg.setText("Keep exploring! \u{1F30A}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
        scene.tweens.add({ targets: [a.view, card.view], x: a.view.x + 2, yoyo: true, duration: 80, repeat: 1 });
      }, 700);
    }
  }

  function spawnSplash(scene, x, y) {
    for (var i = 0; i < 6; i++) {
      var t = scene.add.text(x, y, ["\u{1F4A7}", "\u2728", "\u{1F30A}"][i % 3], { fontSize: "18px" }).setOrigin(0.5).setDepth(5);
      scene.tweens.add({ targets: t, y: y - Phaser.Math.Between(30, 60), x: x + Phaser.Math.Between(-40, 40), alpha: 0, scale: 1.4, duration: 700, ease: "Sine.easeOut", onComplete: (function (txt) { return function () { txt.destroy(); }; })(t) });
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 420, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 28);
    var title = scene.add.text(0, -150, "\u{1F30A} Ocean Arcade Match", textStyle(36, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -105, "Flip cards and find pairs!\nBuild a streak and level up!", Object.assign(textStyle(20, "#2A6F97"), { align: "center" })).setOrigin(0.5);
    var hint = scene.add.text(0, -45, "Choose your challenge:", textStyle(18, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, hint]);

    var options = [
      { label: "Easy\n6 pairs", pairs: 6, x: -170 },
      { label: "Medium\n8 pairs", pairs: 8, x: 0 },
      { label: "Hard\n10 pairs", pairs: 10, x: 170 }
    ];
    difficultyButtons = [];
    options.forEach(function (opt) {
      var cont = scene.add.container(opt.x, 25);
      var box = scene.add.graphics();
      var isSelected = opt.pairs === selectedPairs;
      box.fillStyle(isSelected ? 0x4EA8DE : 0xEAF6FB, 1); box.fillRoundedRect(-80, -40, 160, 80, 18);
      box.lineStyle(3, isSelected ? 0x2A6F97 : 0xA9D6E5, 1); box.strokeRoundedRect(-80, -40, 160, 80, 18);
      var tx = scene.add.text(0, 0, opt.label, Object.assign(textStyle(18, isSelected ? "#ffffff" : "#102A43"), { align: "center" })).setOrigin(0.5);
      cont.add([box, tx]);
      box.setInteractive(new Phaser.Geom.Rectangle(-80, -40, 160, 80), Phaser.Geom.Rectangle.Contains);
      box.on("pointerdown", function () {
        selectedPairs = opt.pairs;
        difficultyButtons.forEach(function (b) {
          b.box.clear();
          var sel = b.opt.pairs === selectedPairs;
          b.box.fillStyle(sel ? 0x4EA8DE : 0xEAF6FB, 1); b.box.fillRoundedRect(-80, -40, 160, 80, 18);
          b.box.lineStyle(3, sel ? 0x2A6F97 : 0xA9D6E5, 1); b.box.strokeRoundedRect(-80, -40, 160, 80, 18);
          b.tx.setColor(sel ? "#ffffff" : "#102A43");
        });
        buildBoard(scene);
      });
      startOverlay.add(cont);
      difficultyButtons.push({ box: box, tx: tx, opt: opt, cont: cont });
    });

    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 95, 260, 64, 32);
    var btnTx = scene.add.text(0, 127, "\u25B6  Start Diving", textStyle(26, "#ffffff")).setOrigin(0.5);
    var btnHint = scene.add.text(0, 175, "No timer \u2022 No penalties \u2022 Just fun!", textStyle(14, "#2A6F97")).setOrigin(0.5);
    startOverlay.add([btnBg, btnTx, btnHint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 95, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card! \u{1F4A7}");
    });
    btnBg.on("pointerover", function () { btnBg.setScale(1.02); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -185, 600, 370, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -185, 600, 370, 28);
    endTitle = scene.add.text(0, -115, "\u{1F389} Splash Win! \u{1F389}", textStyle(38, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-135, 65, 270, 62, 31);
    var btnTx = scene.add.text(0, 96, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    var nextHint = scene.add.text(0, 145, "Try a harder level for more fun!", textStyle(14, "#2A6F97")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, nextHint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-135, 65, 270, 62), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= selectedPairs + 4 ? 3 : (moves <= selectedPairs + 8 ? 2 : 1);
    var msg = "You found all " + selectedPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nBest streak: " + bestStreak + "  \u2728";
    if (level < 3) { msg += "\nLevel " + level + " complete!"; }
    endDetail.setText(msg);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("Amazing! \u{1F389}");
    for (var i = 0; i < 28; i++) {
      var p = scene.add.text(Phaser.Math.Between(40, W - 40), -20, ["\u{1F4A7}", "\u2B50", "\u{1F389}", "\u{1F30A}", "\u2728"][i % 5], { fontSize: "24px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), alpha: 0.9, duration: Phaser.Math.Between(1400, 2200), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; streak = 0;
    level = level + 1;
    if (level > 5) { level = 1; }
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + selectedPairs); hudMsg.setText("Go again! \u{1F30A}");
    hudStreak.setText("Streak: 0  Best: " + bestStreak);
    hudLevel.setText("Level: " + level + "  \u2022  " + selectedPairs + " pairs");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update() {
    waveOffset += 0.015;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.g.y -= b.speed;
      b.g.x += Math.sin(waveOffset + i) * 0.2 + b.drift * 0.1;
      b.g.alpha = 0.45 + Math.sin(waveOffset * 2 + i) * 0.15;
      if (b.g.y < 470) {
        b.g.y = 680;
        b.g.x = Phaser.Math.Between(40, W - 40);
      }
    }
  }
})();
</script>
</body>
</html>
