<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match - Arcade Edition</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a1a2e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 0 0 4px #ffb703,0 0 30px rgba(255,183,3,.6),0 8px 30px rgba(0,0,0,.4);display:block}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  #a11y-help{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;line-height:1.3;pointer-events:none;z-index:5;max-width:260px}
  @media(max-width:600px){#a11y-help{font-size:10px;padding:4px 8px;max-width:180px}}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Memory Match arcade game. Use mouse or keyboard arrows and Enter to flip cards. Press R to restart, P to pause."></div>
<div id="a11y-help" aria-hidden="true">⌨️ Arrows: move • Enter/Space: flip • R: restart • P: pause</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;
  var DIFF = {
    easy: { label: "Easy", time: 75, bonus: 1 },
    normal: { label: "Normal", time: 60, bonus: 1.2 },
    hard: { label: "Hard", time: 40, bonus: 1.5 }
  };

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, combo = 0, maxCombo = 0, level = 1, maxLevel = 3;
  var timeLeft = 60, timeMax = 60, difficulty = "normal", isPaused = false, isGameOver = false;
  var focusIndex = 0, focusRing = null;
  var hudMoves, hudScore, hudMsg, hudTime, hudLevel, hudCombo, hudTimeBar, hudTimeBarBg, hudTimerIcon;
  var endOverlay, endTitle, endDetail, endBtnBg, endBtnTx, startOverlay, selectedDiff = "normal";
  var timerEvent = null, shuffleEvent = null, urgencyTween = null;
  var sceneRef = null;

  function create() {
    var s = this;
    sceneRef = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    s.cameras.main.setBackgroundColor("#fdeec9");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    // arcade grid glow
    g.lineStyle(1, 0xffb703, 0.18);
    for (var gx = 0; gx < W; gx += 45) { g.lineBetween(gx, 0, gx, H); }
    for (var gy = 0; gy < H; gy += 45) { g.lineBetween(0, gy, W, gy); }
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // arcade neon border inner
    var b = scene.add.graphics();
    b.lineStyle(4, 0x5da85f, 0.9); b.strokeRoundedRect(6, 6, W - 12, H - 12, 18);
    b.lineStyle(2, 0xffb703, 0.9); b.strokeRoundedRect(10, 10, W - 20, H - 20, 16);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    scene.add.text(24, 46, "ARCADE", { fontFamily: '"Comic Sans MS",sans-serif', fontSize: "13px", color: "#e63946", fontStyle: "bold", backgroundColor: "#ffe8a3" }).setOrigin(0, 0).setPadding(4, 2, 4, 2);
    hudMoves = scene.add.text(24, 72, "Moves: 0", textStyle(18));
    hudScore = scene.add.text(24, 96, "Score: 0", textStyle(20, "#1d3557"));
    hudLevel = scene.add.text(24, 120, "Level: 1 / 3", textStyle(16, "#5b3a29"));
    hudCombo = scene.add.text(24, 142, "", textStyle(16, "#e63946")).setVisible(false);

    hudTime = scene.add.text(W - 24, 22, "60.0s", Object.assign(textStyle(28, "#1d3557"), { align: "right" })).setOrigin(1, 0);
    hudTimerIcon = scene.add.text(W - 110, 22, "\u23F1\uFE0F", { fontSize: "22px" }).setOrigin(0.5, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(18, "#7a4a2b")).setOrigin(1, 0.5);

    // timer bar
    hudTimeBarBg = scene.add.graphics();
    hudTimeBarBg.fillStyle(0x000000, 0.12); hudTimeBarBg.fillRoundedRect(W - 210, 88, 186, 14, 7);
    hudTimeBar = scene.add.graphics();
    hudTimeBar.fillStyle(0x06d6a0, 1); hudTimeBar.fillRoundedRect(W - 210, 88, 186, 14, 7);

    var btn = scene.add.container(W - 110, 122);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -22, 172, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    // keyboard focus for restart
    bg.input.keyboard = true;

    scene.add.text(W / 2, 168, "Find pairs fast! Combo = bonus! \u26A1 Time is ticking!", textStyle(16, "#8a6a4a")).setOrigin(0.5);

    // focus ring for keyboard
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusIndex = 0;
    updateFocusRing();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    cont.cardIndex = idx;
    cont.cardX = x; cont.cardY = y;
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, idx: idx, x: x, y: y, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched) { cont.setScale(1.03); } });
    cont.on("pointerout", function () { cont.setScale(1); });
    return card;
  }

  function updateFocusRing() {
    if (!focusRing || cards.length === 0) { return; }
    if (!started || isGameOver) { focusRing.setVisible(false); return; }
    var c = cards[focusIndex];
    if (!c || c.matched) {
      // find next unmatched
      for (var i = 0; i < cards.length; i++) {
        var n = (focusIndex + i) % cards.length;
        if (!cards[n].matched) { focusIndex = n; c = cards[n]; break; }
      }
    }
    if (!c) { focusRing.setVisible(false); return; }
    focusRing.clear();
    focusRing.lineStyle(4, 0xffb703, 1);
    focusRing.strokeRoundedRect(c.x - c.w / 2 - 4, c.y - c.h / 2 - 4, c.w + 8, c.h + 8, 24);
    focusRing.lineStyle(2, 0xffffff, 1);
    focusRing.strokeRoundedRect(c.x - c.w / 2 - 2, c.y - c.h / 2 - 2, c.w + 4, c.h + 4, 22);
    focusRing.setVisible(true);
    focusRing.setDepth(6);
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 110, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 110, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || isPaused || isGameOver || card.faceUp || card.matched) { return; }
    // update focus to this card
    focusIndex = card.idx;
    updateFocusRing();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u26A1"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 140 });
        // arcade scoring
        combo++;
        if (combo > maxCombo) { maxCombo = combo; }
        var base = 100;
        var mult = combo;
        var timeBonus = Math.max(5, Math.floor(timeLeft / 4));
        var diffMult = DIFF[difficulty].bonus;
        var gained = Math.floor((base * mult + timeBonus * 10) * diffMult);
        score += gained;
        hudScore.setText("Score: " + score);
        if (combo > 1) {
          hudCombo.setText("\u26A1 Combo x" + combo + "!");
          hudCombo.setVisible(true);
          scene.tweens.add({ targets: hudCombo, scale: { from: 1.4, to: 1 }, duration: 200, ease: "Back.easeOut" });
          showComboPopup(scene, combo, card.view.x, card.view.y);
        } else {
          hudCombo.setVisible(false);
        }
        // time reward
        timeLeft = Math.min(timeMax, timeLeft + 3 + Math.floor(combo / 2));
        updateTimerBar();
        spawnBurst(scene, card.view.x, card.view.y, card.data.emoji);
        spawnBurst(scene, a.view.x, a.view.y, a.data.emoji);
        showScorePopup(scene, "+" + gained, card.view.x, card.view.y - 40, "#06d6a0");
        if (combo >= 3) {
          scene.cameras.main.flash(120, 255, 215, 0, false);
        }
        matches++;
        hudScore.setText("Score: " + score);
        hudLevel.setText("Level: " + level + " / " + maxLevel);
        hudMsg.setText(combo >= 3 ? "FRENZY! x" + combo + " \u{1F525}" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        updateFocusRing();
        if (matches === 6) { showWin(scene); }
      }, 320);
    } else {
      // mismatch penalty
      combo = 0;
      hudCombo.setVisible(false);
      hudMsg.setText("Try again! \u{1F340}");
      score = Math.max(0, score - 25);
      hudScore.setText("Score: " + score);
      timeLeft = Math.max(0, timeLeft - 2.5);
      updateTimerBar();
      showScorePopup(scene, "-2.5s", card.view.x, card.view.y - 30, "#e63946");
      shakeCamera(scene);
      // quick red flash on cards
      scene.tweens.add({ targets: [a.view, card.view], angle: { from: -4, to: 4 }, yoyo: true, duration: 80, repeat: 2 });
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(); });
      }, 650);
    }
  }

  function showScorePopup(scene, txt, x, y, color) {
    var t = scene.add.text(x, y, txt, { fontFamily: '"Comic Sans MS",sans-serif', fontSize: "28px", color: color, fontStyle: "bold", stroke: "#ffffff", strokeThickness: 4 }).setOrigin(0.5).setDepth(25);
    scene.tweens.add({ targets: t, y: y - 50, alpha: 0, scale: 1.2, duration: 700, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function showComboPopup(scene, c, x, y) {
    var txt = c === 2 ? "COMBO!" : c === 3 ? "MEGA COMBO!!" : "ULTRA COMBO!!!";
    var col = c === 2 ? "#ffb703" : c === 3 ? "#ff7b00" : "#e63946";
    var t = scene.add.text(x, y - 70, txt + " x" + c, { fontFamily: '"Comic Sans MS",sans-serif', fontSize: c > 3 ? "22px" : "20px", color: col, fontStyle: "bold", stroke: "#ffffff", strokeThickness: 5 }).setOrigin(0.5).setDepth(26);
    scene.tweens.add({ targets: t, scale: { from: 0.5, to: 1 }, duration: 180, ease: "Back.easeOut" });
    scene.tweens.add({ targets: t, y: y - 90, alpha: 0, delay: 500, duration: 400, onComplete: function () { t.destroy(); } });
  }

  function spawnBurst(scene, x, y, emoji) {
    var parts = ["\u2B50", "\u{1F389}", emoji, "\u2728"];
    for (var i = 0; i < 8; i++) {
      var p = scene.add.text(x, y, parts[i % parts.length], { fontSize: "22px" }).setOrigin(0.5).setDepth(24);
      var ang = (i / 8) * Math.PI * 2;
      var dist = Phaser.Math.Between(40, 90);
      scene.tweens.add({ targets: p, x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist - 20, alpha: 0, scale: 0.5, duration: Phaser.Math.Between(500, 800), ease: "Cubic.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function shakeCamera(scene) {
    scene.cameras.main.shake(180, 0.008);
    var g = scene.add.graphics().setDepth(20);
    g.fillStyle(0xe63946, 0.18); g.fillRect(0, 0, W, H);
    scene.tweens.add({ targets: g, alpha: 0, duration: 200, onComplete: function () { g.destroy(); } });
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.55); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 420, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(36)).setOrigin(0.5);
    var arcade = scene.add.text(0, -118, "ARCADE EDITION \u26A1", { fontFamily: '"Comic Sans MS",sans-serif', fontSize: "18px", color: "#e63946", fontStyle: "bold", backgroundColor: "#ffe8a3" }).setOrigin(0.5).setPadding(6, 2, 6, 2);
    var sub = scene.add.text(0, -70, "Flip cards fast! Build combos!\nBeat the clock & clear 3 levels!", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var diffLabel = scene.add.text(0, 32, "Choose Difficulty:", textStyle(16, "#5b3a29")).setOrigin(0.5);

    // difficulty buttons
    var diffCont = scene.add.container(0, 70);
    var diffs = ["easy", "normal", "hard"];
    var diffBtns = [];
    diffs.forEach(function (d, i) {
      var bx = (i - 1) * 170;
      var b = scene.add.container(bx, 0);
      var gg = scene.add.graphics();
      var isSel = d === selectedDiff;
      gg.fillStyle(isSel ? 0x1d3557 : 0xffffff, 1); gg.fillRoundedRect(-75, -22, 150, 44, 22);
      gg.lineStyle(3, isSel ? 0xffb703 : 0x5da85f, 1); gg.strokeRoundedRect(-75, -22, 150, 44, 22);
      var tx = scene.add.text(0, 0, DIFF[d].label + " (" + DIFF[d].time + "s)", textStyle(14, isSel ? "#ffffff" : "#5b3a29")).setOrigin(0.5);
      b.add([gg, tx]);
      gg.setInteractive(new Phaser.Geom.Rectangle(-75, -22, 150, 44), Phaser.Geom.Rectangle.Contains);
      gg.on("pointerdown", function () {
        selectedDiff = d;
        difficulty = d;
        diffBtns.forEach(function (ob, idx) {
          var dd = diffs[idx];
          var sel = dd === selectedDiff;
          ob.g.clear();
          ob.g.fillStyle(sel ? 0x1d3557 : 0xffffff, 1); ob.g.fillRoundedRect(-75, -22, 150, 44, 22);
          ob.g.lineStyle(3, sel ? 0xffb703 : 0x5da85f, 1); ob.g.strokeRoundedRect(-75, -22, 150, 44, 22);
          ob.t.setColor(sel ? "#ffffff" : "#5b3a29");
        });
      });
      diffCont.add(b);
      diffBtns.push({ g: gg, t: tx, c: b });
    });

    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0xe63946, 1); btnBg.fillRoundedRect(-140, 110, 280, 64, 32);
    btnBg.lineStyle(3, 0xffb703, 1); btnBg.strokeRoundedRect(-140, 110, 280, 64, 32);
    var btnTx = scene.add.text(0, 142, "\u25B6  START ARCADE", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 188, "Match fast for combo bonus! Mismatch = -time!", textStyle(13, "#8a6a4a")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, arcade, sub, row, diffLabel, diffCont, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 110, 280, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      difficulty = selectedDiff;
      timeMax = DIFF[difficulty].time;
      timeLeft = timeMax;
      level = 1; score = 0; combo = 0; maxCombo = 0;
      started = true; lockBoard = false; isPaused = false; isGameOver = false;
      startOverlay.setVisible(false);
      hudMsg.setText("GO! \u26A1");
      hudScore.setText("Score: 0");
      hudLevel.setText("Level: 1 / 3");
      hudCombo.setVisible(false);
      updateTimerBar();
      startTimer(scene);
      scheduleShuffle(scene);
      updateFocusRing();
      scene.tweens.add({ targets: startOverlay, alpha: 0, duration: 150 });
    });
    btnBg.on("pointerover", function () { btnBg.setScale(1.04); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.6); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    endTitle = scene.add.text(0, -120, "\u{1F389} You Win! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    endBtnBg = scene.add.graphics();
    endBtnBg.fillStyle(0x5da85f, 1); endBtnBg.fillRoundedRect(-140, 70, 280, 64, 32);
    var btnTx = scene.add.text(0, 102, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endBtnTx = btnTx;
    var hint2 = scene.add.text(0, 150, "Tip: Hard = 1.5x score! Try keyboard arrows + Enter!", textStyle(12, "#8a6a4a")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, endBtnBg, btnTx, hint2]);
    endBtnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 70, 280, 64), Phaser.Geom.Rectangle.Contains);
    endBtnBg.on("pointerdown", function () {
      if (endBtnTx.text.indexOf("Next Level") !== -1) {
        nextLevel(scene);
      } else {
        restart(scene);
      }
    });
  }

  function startTimer(scene) {
    stopTimer();
    updateTimerBar();
    timerEvent = scene.time.addEvent({ delay: 100, callback: function () {
      if (!started || isPaused || isGameOver) { return; }
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimerBar();
        showGameOver(scene, "time");
        return;
      }
      updateTimerBar();
      if (timeLeft < 10 && !urgencyTween) {
        hudTime.setColor("#e63946");
        urgencyTween = scene.tweens.add({ targets: hudTime, scale: { from: 1, to: 1.12 }, duration: 250, yoyo: true, repeat: -1 });
      } else if (timeLeft >= 10 && urgencyTween) {
        urgencyTween.stop(); urgencyTween = null; hudTime.setScale(1); hudTime.setColor("#1d3557");
      }
    }, loop: true });
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
    if (shuffleEvent) { shuffleEvent.remove(false); shuffleEvent = null; }
    if (urgencyTween) { urgencyTween.stop(); urgencyTween = null; }
  }

  function updateTimerBar() {
    if (!hudTimeBar) { return; }
    var pct = Phaser.Math.Clamp(timeLeft / timeMax, 0, 1);
    hudTime.setText(timeLeft.toFixed(1) + "s");
    hudTimeBar.clear();
    var col = pct > 0.5 ? 0x06d6a0 : pct > 0.25 ? 0xffb703 : 0xe63946;
    hudTimeBar.fillStyle(col, 1);
    hudTimeBar.fillRoundedRect(W - 210, 88, 186 * pct, 14, 7);
    if (pct < 0.25) {
      hudTimeBar.setAlpha(0.7 + Math.sin(Date.now() / 120) * 0.3);
    } else {
      hudTimeBar.setAlpha(1);
    }
  }

  function scheduleShuffle(scene) {
    if (shuffleEvent) { shuffleEvent.remove(false); }
    var delay = level === 1 ? 14000 : level === 2 ? 10000 : 7000;
    shuffleEvent = scene.time.addEvent({ delay: delay, callback: function () {
      if (!started || isGameOver || isPaused || matches === 6) { return; }
      doShuffleUnmatched(scene);
      scheduleShuffle(scene);
    }, loop: false });
  }

  function doShuffleUnmatched(scene) {
    var unmatched = cards.filter(function (c) { return !c.matched && !c.faceUp; });
    if (unmatched.length < 4) { return; }
    hudMsg.setText("SHUFFLE! \u{1F300}");
    scene.cameras.main.shake(120, 0.004);
    // collect positions
    var positions = unmatched.map(function (c) { return { x: c.x, y: c.y }; });
    // shuffle positions
    for (var i = positions.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = positions[i]; positions[i] = positions[j]; positions[j] = t;
    }
    unmatched.forEach(function (c, i) {
      var nx = positions[i].x, ny = positions[i].y;
      c.x = nx; c.y = ny;
      scene.tweens.add({ targets: c.view, x: nx, y: ny, duration: 400, ease: "Back.easeOut", delay: i * 30 });
    });
    // update focus ring after shuffle
    scene.time.delayedCall(500, function () { updateFocusRing(); });
    // flash
    var flash = scene.add.graphics().setDepth(15);
    flash.fillStyle(0xffb703, 0.15); flash.fillRect(0, 0, W, H);
    scene.tweens.add({ targets: flash, alpha: 0, duration: 400, onComplete: function () { flash.destroy(); } });
  }

  function showWin(scene) {
    stopTimer();
    var timeBonus = Math.floor(timeLeft * 10);
    var moveBonus = Math.max(0, (20 - moves) * 15);
    var levelBonus = level * 200;
    var perfect = moves === 6 ? 500 : 0;
    var totalBonus = timeBonus + moveBonus + levelBonus + perfect;
    score += totalBonus;
    hudScore.setText("Score: " + score);
    var stars = moves <= 10 && timeLeft > 15 ? 3 : (moves <= 16 ? 2 : 1);
    if (combo >= 4) { stars = Math.min(3, stars + 1); }
    var isFinal = level >= maxLevel;
    if (isFinal) {
      endTitle.setText("\u{1F3C6} ARCADE CHAMPION! \u{1F3C6}");
      endDetail.setText("All 3 levels cleared!\nScore: " + score + "  " + "\u2B50".repeat(stars) + "\nMoves: " + moves + "  Max Combo: x" + maxCombo + "\nTime left: " + timeLeft.toFixed(1) + "s  +" + totalBonus + " bonus" + (perfect ? "\n\u2728 PERFECT! +500" : ""));
      endBtnTx.setText("\u21BB Play Again");
      hudMsg.setText("CHAMPION! \u{1F3C6}");
    } else {
      endTitle.setText("\u2B50 Level " + level + " Clear! \u2B50");
      endDetail.setText("Score: " + score + "  " + "\u2B50".repeat(stars) + "\nMoves: " + moves + "  Combo: x" + maxCombo + "  Time: " + timeLeft.toFixed(1) + "s\nBonus: +" + totalBonus + (perfect ? " (Perfect!)" : "") + "\nNext: Level " + (level + 1) + " - faster shuffle!");
      endBtnTx.setText("\u25B6 Next Level");
      hudMsg.setText("Level " + level + " done! \u{1F389}");
    }
    endOverlay.setVisible(true);
    endOverlay.setAlpha(0); endOverlay.setScale(0.8);
    scene.tweens.add({ targets: endOverlay, alpha: 1, scale: 1, duration: 300, ease: "Back.easeOut" });
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u26A1", "\u{1F525}"][i % 6], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-100, 100), angle: Phaser.Math.Between(-180, 180), duration: Phaser.Math.Between(1200, 2400), delay: i * 40, onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
    scene.cameras.main.flash(200, 255, 215, 0, false);
    isGameOver = true;
    focusRing.setVisible(false);
  }

  function showGameOver(scene, reason) {
    stopTimer();
    isGameOver = true;
    lockBoard = true;
    focusRing.setVisible(false);
    if (urgencyTween) { urgencyTween.stop(); urgencyTween = null; }
    endTitle.setText("\u23F1\uFE0F Time Up!");
    var msg = reason === "time" ? "The clock beat you!" : "Game Over!";
    endDetail.setText(msg + "\nScore: " + score + "  Level: " + level + " / " + maxLevel + "\nPairs: " + matches + " / 6  Moves: " + moves + "\nMax Combo: x" + maxCombo + "\nTip: Match quickly for time bonus!");
    endBtnTx.setText("\u21BB Try Again");
    endOverlay.setVisible(true);
    endOverlay.setAlpha(0); endOverlay.setScale(0.85);
    scene.tweens.add({ targets: endOverlay, alpha: 1, scale: 1, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time Up! \u23F1\uFE0F");
    scene.cameras.main.shake(300, 0.012);
    scene.cameras.main.flash(300, 230, 57, 70, false);
  }

  function nextLevel(scene) {
    level++;
    if (level > maxLevel) { level = maxLevel; }
    timeMax = DIFF[difficulty].time - (level - 1) * 8;
    if (timeMax < 25) { timeMax = 25; }
    timeLeft = timeMax;
    moves = 0; matches = 0; firstPick = null; lockBoard = false; isGameOver = false; combo = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: " + score); hudLevel.setText("Level: " + level + " / " + maxLevel); hudMsg.setText("Level " + level + "! GO! \u26A1");
    hudCombo.setVisible(false);
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateTimerBar();
    startTimer(scene);
    scheduleShuffle(scene);
    updateFocusRing();
    scene.cameras.main.flash(180, 6, 214, 160, false);
  }

  function restart(scene) {
    stopTimer();
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; isPaused = false; isGameOver = false;
    score = 0; combo = 0; maxCombo = 0; level = 1;
    timeMax = DIFF[difficulty].time;
    timeLeft = timeMax;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudLevel.setText("Level: 1 / 3"); hudMsg.setText("GO! \u26A1");
    hudCombo.setVisible(false);
    hudTime.setColor("#1d3557"); hudTime.setScale(1);
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateTimerBar();
    startTimer(scene);
    scheduleShuffle(scene);
    updateFocusRing();
  }

  function setupKeyboard(scene) {
    window.addEventListener("keydown", function (e) {
      if (!started) {
        if (e.key === "Enter" || e.key === " ") {
          var btn = startOverlay && startOverlay.visible ? startOverlay : null;
          if (btn) {
            e.preventDefault();
            difficulty = selectedDiff;
            timeMax = DIFF[difficulty].time;
            timeLeft = timeMax;
            level = 1; score = 0; combo = 0; maxCombo = 0;
            started = true; lockBoard = false; isPaused = false; isGameOver = false;
            startOverlay.setVisible(false);
            hudMsg.setText("GO! \u26A1");
            hudScore.setText("Score: 0");
            hudLevel.setText("Level: 1 / 3");
            hudCombo.setVisible(false);
            updateTimerBar();
            startTimer(scene);
            scheduleShuffle(scene);
            updateFocusRing();
          }
        }
        return;
      }
      if (e.key === "r" || e.key === "R") {
        e.preventDefault();
        restart(scene);
        return;
      }
      if (e.key === "p" || e.key === "P") {
        e.preventDefault();
        if (isGameOver) { return; }
        isPaused = !isPaused;
        hudMsg.setText(isPaused ? "Paused \u23F8\uFE0F (P to resume)" : "GO! \u26A1");
        if (isPaused) { focusRing.setVisible(false); } else { updateFocusRing(); }
        return;
      }
      if (isPaused || isGameOver || !started) { return; }
      var cols = 4;
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        focusIndex = (focusIndex - 1 + cards.length) % cards.length;
        updateFocusRing();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        focusIndex = (focusIndex + 1) % cards.length;
        updateFocusRing();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        focusIndex = (focusIndex - cols + cards.length) % cards.length;
        updateFocusRing();
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        focusIndex = (focusIndex + cols) % cards.length;
        updateFocusRing();
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        var card = cards[focusIndex];
        if (card) { onCard(scene, card); }
      }
    });
  }

  function update() {
    if (started && !isGameOver && !isPaused) {
      updateTimerBar();
    }
  }
})();
</script>
</body>
