<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match - Arcade Edition</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15),0 0 0 4px #5da85f,0 0 22px rgba(93,168,95,.45)}
  #kb-help{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:#5b3a29;background:rgba(255,255,255,.92);padding:5px 12px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none;white-space:nowrap;z-index:5}
</style>
</head>
<body>
<div id="game"></div>
<div id="kb-help" aria-hidden="true">Arrows + Enter to flip • R to restart • Beat the clock!</div>
<div id="a11y-status" aria-live="polite" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F98A}", name: "Fox" },
    { emoji: "\u{1F438}", name: "Frog" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var score = 0, combo = 1, maxCombo = 1, timeLeft = 60, maxTime = 60, level = 1, totalPairs = 6;
  var hudScorePts, hudCombo, hudLevel, hudTimer, timerBar, timerBarBg, timerEvent, shuffleEvent, focusRing;
  var focusedIndex = 0, gameScene = null, isGameOver = false;
  var audioCtx = null;

  function getAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    return audioCtx;
  }
  function sfx(freq, dur, vol, type, slide) {
    try {
      var ctx = getAudio();
      if (!ctx) return;
      if (ctx.state === "suspended") ctx.resume();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      o.connect(g); g.connect(ctx.destination);
      g.gain.value = vol || 0.2;
      o.start();
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, ctx.currentTime + dur);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      o.stop(ctx.currentTime + dur);
    } catch (e) {}
  }
  function playFlip() { sfx(650, 0.1, 0.14, "square"); }
  function playMatch() { sfx(520, 0.14, 0.22, "sine"); setTimeout(function(){ sfx(880, 0.18, 0.22, "sine"); }, 110); }
  function playCombo(c) { sfx(700 + c * 70, 0.22, 0.28, "triangle", 950 + c * 70); }
  function playMiss() { sfx(180, 0.28, 0.2, "sawtooth", 70); }
  function playTick() { sfx(1100, 0.07, 0.09, "square"); }
  function playGameOver() { sfx(220, 0.45, 0.3, "sawtooth", 60); setTimeout(function(){ sfx(140, 0.6, 0.3, "sawtooth", 40); }, 220); }
  function playWin() { [0,1,2,3].forEach(function(i){ setTimeout(function(){ sfx(420 + i * 140, 0.28, 0.24, "sine"); }, i * 130); }); }
  function playLevelUp() { [0,1,2].forEach(function(i){ setTimeout(function(){ sfx(600 + i * 200, 0.2, 0.25, "triangle"); }, i * 100); }); }

  function announce(msg) {
    var el = document.getElementById("a11y-status");
    if (el) el.textContent = msg;
  }

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    s.cameras.main.setBackgroundColor("#fdeec9");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    var border = scene.add.graphics();
    border.lineStyle(4, 0x5da85f, 0.9);
    border.strokeRoundedRect(6, 6, W - 12, H - 12, 18);
    border.lineStyle(2, 0xffffff, 0.5);
    border.strokeRoundedRect(10, 10, W - 20, H - 20, 16);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 48, "LEVEL 1  \u2B50 ARCADE", textStyle(16, "#5da85f")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 72, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 96, "Pairs: 0 / 6", textStyle(20));
    hudScorePts = scene.add.text(24, 120, "Score: 0", textStyle(22, "#b34a3e")).setOrigin(0, 0);
    hudCombo = scene.add.text(24, 148, "", textStyle(18, "#ff6b00")).setOrigin(0, 0).setVisible(false);
    hudTimer = scene.add.text(W - 24, 22, "60s", textStyle(32, "#5b3a29")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#7a4a2b")).setOrigin(1, 0.5);
    timerBarBg = scene.add.graphics();
    timerBarBg.fillStyle(0xffffff, 1); timerBarBg.fillRoundedRect(W - 210, 88, 186, 18, 9);
    timerBarBg.lineStyle(2, 0x5da85f, 1); timerBarBg.strokeRoundedRect(W - 210, 88, 186, 18, 9);
    timerBar = scene.add.graphics();
    updateTimerBar();
    var btn = scene.add.container(W - 110, 132);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -22, 172, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { sfx(500, 0.12, 0.2, "sine"); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match fast! Combo = bonus! Mismatch = -3s!", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function updateTimerBar() {
    if (!timerBar) return;
    timerBar.clear();
    var pct = Math.max(0, timeLeft / maxTime);
    var w = 182 * pct;
    var col = 0x5da85f;
    if (pct < 0.35) col = 0xe63946;
    else if (pct < 0.6) col = 0xffb703;
    timerBar.fillStyle(col, 1);
    timerBar.fillRoundedRect(W - 208, 90, w, 14, 7);
    if (hudTimer) {
      hudTimer.setText(Math.ceil(timeLeft) + "s");
      hudTimer.setColor(pct < 0.35 ? "#e63946" : "#5b3a29");
      if (pct < 0.35) hudTimer.setScale(1.08);
      else hudTimer.setScale(1);
    }
  }

  function shuffledDeck() {
    var pool = ANIMALS.slice(0, totalPairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = totalPairs > 6 ? 4 : 4;
    var rows = totalPairs > 6 ? 4 : 3;
    var cw = totalPairs > 6 ? 165 : 185;
    var ch = totalPairs > 6 ? 118 : 140;
    var gx = totalPairs > 6 ? 52 : 62;
    var gy = totalPairs > 6 ? 188 : 195;
    var padX = totalPairs > 6 ? 18 : 22;
    var padY = totalPairs > 6 ? 12 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    updateFocusRing();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    cont.setData("idx", idx);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 14);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 8); back.fillCircle(0, h / 4, 12);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: totalPairs > 6 ? "44px" : "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xffb5a7, 0xb5ead7];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: totalPairs > 6 ? "48px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(totalPairs > 6 ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, x: x, y: y, w: w, h: h, idx: idx };
    cont.on("pointerdown", function () {
      focusedIndex = idx;
      updateFocusRing();
      onCard(scene, card);
    });
    cont.on("pointerover", function () {
      if (!card.matched && !card.faceUp) scene.tweens.add({ targets: cont, scale: 1.04, duration: 100 });
    });
    cont.on("pointerout", function () {
      scene.tweens.add({ targets: cont, scale: 1, duration: 100 });
    });
    return card;
  }

  function updateFocusRing() {
    if (!focusRing || !cards.length) return;
    if (!started || isGameOver) { focusRing.setVisible(false); return; }
    var c = cards[focusedIndex];
    if (!c || c.matched) {
      var found = -1;
      for (var i = 0; i < cards.length; i++) {
        var n = (focusedIndex + i) % cards.length;
        if (!cards[n].matched) { found = n; break; }
      }
      if (found === -1) { focusRing.setVisible(false); return; }
      focusedIndex = found;
      c = cards[focusedIndex];
    }
    focusRing.clear();
    focusRing.lineStyle(4, 0xffb703, 1);
    focusRing.strokeRoundedRect(c.x - c.w / 2 - 4, c.y - c.h / 2 - 4, c.w + 8, c.h + 8, 20);
    focusRing.lineStyle(2, 0xffffff, 1);
    focusRing.strokeRoundedRect(c.x - c.w / 2 - 6, c.y - c.h / 2 - 6, c.w + 12, c.h + 12, 22);
    focusRing.setVisible(true);
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    var dur = 110 - (level - 1) * 15;
    if (dur < 70) dur = 70;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: dur, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: dur, onComplete: done || function () {} });
    }});
  }

  function showFloating(scene, x, y, txt, color, size) {
    var t = scene.add.text(x, y, txt, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: (size || 28) + "px", color: color || "#e63946", fontStyle: "bold", stroke: "#ffffff", strokeThickness: 4 }).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 50, alpha: 0, scale: 1.2, duration: 700, ease: "Cubic.easeOut", onComplete: function(){ t.destroy(); } });
  }

  function triggerShake(scene) {
    if (scene.cameras && scene.cameras.main && scene.cameras.main.shake) {
      scene.cameras.main.shake(180, 0.008);
    } else {
      scene.tweens.add({ targets: scene.cameras.main, x: -4, duration: 40, yoyo: true, repeat: 3 });
    }
  }

  function onCard(scene, card) {
    if (!started || isGameOver || lockBoard || card.faceUp || card.matched) { return; }
    playFlip();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Flipped " + card.data.name); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      var base = 100;
      var timeBonus = Math.floor(timeLeft * 0.8);
      var pts = base * combo + timeBonus + (level * 20);
      score += pts;
      if (combo > 1) maxCombo = Math.max(maxCombo, combo);
      hudScorePts.setText("Score: " + score);
      hudScore.setText("Pairs: " + (matches + 1) + " / " + totalPairs);
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160, onComplete: function(){ a.view.setScale(1); card.view.setScale(1); } });
        if (combo > 1) {
          playCombo(combo);
          showFloating(scene, (a.x + card.x) / 2, (a.y + card.y) / 2 - 30, "COMBO x" + combo + "!", "#ff6b00", 26);
          hudCombo.setText("COMBO x" + combo + " \u{1F525}");
          hudCombo.setVisible(true);
          scene.tweens.add({ targets: hudCombo, scale: { from: 1.4, to: 1 }, duration: 200, ease: "Back.easeOut" });
        } else {
          playMatch();
          showFloating(scene, (a.x + card.x) / 2, (a.y + card.y) / 2 - 20, "+" + pts, "#5da85f", 24);
        }
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! +" + pts + " \u{1F389}");
        announce("Match! " + card.data.name + " plus " + pts + " points. Combo " + combo);
        combo++;
        if (combo > 2) {
          hudCombo.setText("COMBO x" + (combo - 1) + " \u{1F525}");
          hudCombo.setVisible(true);
        }
        for (var i = 0; i < 8; i++) {
          var p = scene.add.text(card.x, card.y, ["\u2B50", "\u{1F389}", "\u2728"][i % 3], { fontSize: "20px" }).setDepth(12);
          scene.tweens.add({ targets: p, y: p.y - Phaser.Math.Between(30, 70), x: p.x + Phaser.Math.Between(-50, 50), alpha: 0, duration: 600, onComplete: (function(t){ return function(){ t.destroy(); }; })(p) });
        }
        lockBoard = false;
        updateFocusRing();
        if (matches === totalPairs) {
          if (level < 3) {
            setTimeout(function(){ nextLevel(scene); }, 700);
          } else {
            showWin(scene);
          }
        }
      }, 300);
    } else {
      combo = 1;
      hudCombo.setVisible(false);
      hudMsg.setText("Try again! \u{1F340}");
      timeLeft -= (3 + level);
      if (timeLeft < 0) timeLeft = 0;
      updateTimerBar();
      score = Math.max(0, score - 15);
      hudScorePts.setText("Score: " + score);
      showFloating(scene, (a.x + card.x) / 2, (a.y + card.y) / 2, "-3s \u23F1", "#e63946", 22);
      playMiss();
      triggerShake(scene);
      announce("No match. Minus 3 seconds.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(); });
      }, 650 - (level - 1) * 80);
    }
  }

  function startTimer(scene) {
    stopTimer();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function() {
      if (!started || isGameOver) return;
      timeLeft -= 1;
      if (timeLeft <= 10 && timeLeft > 0) playTick();
      updateTimerBar();
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimerBar();
        showGameOver(scene);
      }
    }});
    shuffleEvent = scene.time.addEvent({ delay: 12000, loop: true, callback: function() {
      if (!started || isGameOver || lockBoard) return;
      if (matches >= totalPairs) return;
      shuffleUnmatched(scene);
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
    if (shuffleEvent) { shuffleEvent.remove(false); shuffleEvent = null; }
  }

  function shuffleUnmatched(scene) {
    var unmatched = cards.filter(function(c){ return !c.matched; });
    if (unmatched.length < 4) return;
    hudMsg.setText("Shuffle! \u{1F300}");
    sfx(300, 0.4, 0.18, "triangle", 600);
    var positions = unmatched.map(function(c){ return { x: c.x, y: c.y }; });
    for (var i = positions.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = positions[i]; positions[i] = positions[j]; positions[j] = t;
    }
    unmatched.forEach(function(c, idx){
      scene.tweens.add({ targets: c.view, x: positions[idx].x, y: positions[idx].y, duration: 350, ease: "Back.easeOut", delay: idx * 30 });
      c.x = positions[idx].x; c.y = positions[idx].y;
    });
    setTimeout(function(){ updateFocusRing(); }, 500);
    showFloating(scene, W / 2, 200, "SHUFFLE!", "#8a6a4a", 20);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 420, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var badge = scene.add.text(0, -112, "\u2B50 ARCADE EDITION \u2B50", textStyle(16, "#e63946")).setOrigin(0.5);
    var sub = scene.add.text(0, -70, "Flip cards & find all pairs\nbefore time runs out!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var feats = scene.add.text(0, -10, "\u23F1 60s Timer  \u2022  \u{1F525} Combo Bonus  \u2022  \u{1F300} Shuffle!", textStyle(15, "#7a4a2b")).setOrigin(0.5);
    var row = scene.add.text(0, 28, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var tip = scene.add.text(0, 68, "Match fast for +time bonus! Miss = -3s!", textStyle(14, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 92, 260, 64, 32);
    var btnTx = scene.add.text(0, 124, "\u25B6  START!", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 172, "Level 1: 6 pairs  \u2022  Level 2-3: 8 pairs!", textStyle(13, "#8a6a4a")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, badge, sub, feats, row, tip, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 92, 260, 64), Phaser.Geom.Rectangle.Contains);
    bg.setInteractive(new Phaser.Geom.Rectangle(-W / 2, -H / 2, W, H), Phaser.Geom.Rectangle.Contains);
    var startFn = function() {
      if (!started) sfx(700, 0.15, 0.25, "sine");
      started = true; lockBoard = false; isGameOver = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Go! Go! Go! \u{1F525}");
      timeLeft = maxTime; updateTimerBar();
      startTimer(scene);
      updateFocusRing();
      announce("Game started. Level 1. 60 seconds. Find 6 pairs.");
    };
    btnBg.on("pointerdown", startFn);
    bg.on("pointerdown", startFn);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    endTitle = scene.add.text(0, -120, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 60, 260, 64, 32);
    var btnTx = scene.add.text(0, 92, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint2 = scene.add.text(0, 140, "Tip: Keep combos for high score!", textStyle(13, "#8a6a4a")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint2]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 60, 260, 64), Phaser.Geom.Rectangle.Contains);
    bg.setInteractive(new Phaser.Geom.Rectangle(-W / 2, -H / 2, W, H), Phaser.Geom.Rectangle.Contains);
    var restartFn = function () { sfx(500, 0.12, 0.2, "sine"); restart(scene); };
    btnBg.on("pointerdown", restartFn);
    bg.on("pointerdown", restartFn);
  }

  function showWin(scene) {
    stopTimer();
    isGameOver = true;
    lockBoard = true;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    if (score > 800) stars = 3;
    var bonus = Math.floor(timeLeft * 5);
    score += bonus;
    hudScorePts.setText("Score: " + score);
    endTitle.setText("\u{1F3C6} ARCADE CHAMP! \u{1F3C6}");
    endDetail.setText("All 3 levels cleared!\nScore: " + score + "  +" + bonus + " time bonus\nMoves: " + moves + "  Max Combo x" + maxCombo + "\n" + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("CHAMPION! \u{1F389}");
    playWin();
    announce("You win! Final score " + score);
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showGameOver(scene) {
    stopTimer();
    isGameOver = true;
    lockBoard = true;
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("Level " + level + "  Score: " + score + "\nPairs: " + matches + " / " + totalPairs + "  Moves: " + moves + "\nMax Combo: x" + maxCombo + "\nKeep combos to score higher!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u{1F62D}");
    playGameOver();
    triggerShake(scene);
    announce("Time's up. Game over. Score " + score);
  }

  function nextLevel(scene) {
    level++;
    if (level === 2) { totalPairs = 8; maxTime = 50; }
    if (level === 3) { totalPairs = 8; maxTime = 45; }
    timeLeft = maxTime;
    matches = 0;
    firstPick = null;
    lockBoard = false;
    hudLevel.setText("LEVEL " + level + "  \u2B50 ARCADE");
    hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMsg.setText("Level " + level + "! Go! \u{1F525}");
    hudCombo.setVisible(false);
    updateTimerBar();
    playLevelUp();
    showFloating(scene, W / 2, H / 2 - 40, "LEVEL " + level + "!", "#5da85f", 36);
    announce("Level " + level + ". Find " + totalPairs + " pairs.");
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    stopTimer();
    startTimer(scene);
    scene.tweens.add({ targets: scene.cameras.main, alpha: { from: 0.5, to: 1 }, duration: 300 });
  }

  function restart(scene) {
    stopTimer();
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; isGameOver = false;
    score = 0; combo = 1; maxCombo = 1; level = 1; totalPairs = 6; maxTime = 60; timeLeft = maxTime;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudScorePts.setText("Score: 0"); hudCombo.setVisible(false);
    hudLevel.setText("LEVEL 1  \u2B50 ARCADE");
    hudMsg.setText("Go! Find pairs!");
    updateTimerBar();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    updateFocusRing();
    announce("Restarted. Level 1. Score zero.");
  }

  function setupKeyboard(scene) {
    window.addEventListener("keydown", function(e) {
      if (e.key === "r" || e.key === "R") { restart(scene); return; }
      if (!started) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          started = true; lockBoard = false; isGameOver = false;
          if (startOverlay) startOverlay.setVisible(false);
          hudMsg.setText("Go! Go! Go! \u{1F525}");
          timeLeft = maxTime; updateTimerBar();
          startTimer(scene);
          updateFocusRing();
        }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); restart(scene); }
        return;
      }
      if (isGameOver) return;
      var cols = totalPairs > 6 ? 4 : 4;
      if (e.key === "ArrowRight") { e.preventDefault(); focusedIndex = (focusedIndex + 1) % cards.length; updateFocusRing(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); focusedIndex = (focusedIndex - 1 + cards.length) % cards.length; updateFocusRing(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); focusedIndex = (focusedIndex + cols) % cards.length; updateFocusRing(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); focusedIndex = (focusedIndex - cols + cards.length) % cards.length; updateFocusRing(); }
      else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        var card = cards[focusedIndex];
        if (card) onCard(scene, card);
      }
    });
    var gameEl = document.getElementById("game");
    if (gameEl) {
      gameEl.setAttribute("tabindex", "0");
      gameEl.setAttribute("role", "application");
      gameEl.setAttribute("aria-label", "Farmyard Memory Match arcade game. Use arrow keys and Enter to flip cards. Press R to restart.");
    }
  }

  function update() {
    if (started && !isGameOver && timerBar) {
      var pct = Math.max(0, timeLeft / maxTime);
      if (pct < 0.35) {
        var pulse = 0.5 + Math.sin(Date.now() * 0.015) * 0.5;
        timerBar.setAlpha(0.7 + pulse * 0.3);
      } else {
        timerBar.setAlpha(1);
      }
    }
  }
})();
</script>
</body>
</html>
