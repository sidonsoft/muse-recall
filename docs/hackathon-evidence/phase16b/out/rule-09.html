<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#eaf6ff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean Memory Arcade - match pairs with keyboard or mouse"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{2B50}", name: "Star" },
    { emoji: "\u{1F41A}", name: "Shell" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#d6efff",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, level = 1, score = 0, streak = 0;
  var hudMoves, hudScore, hudPairs, hudLevel, hudMsg, endOverlay, endTitle, endDetail, endBtnLabel, endBtnBg, startOverlay;
  var selectedIndex = 0, highlight, bubbles = [], cols = 4, rows = 3;

  function create() {
    var s = this;
    drawOcean(s);
    createBubbles(s);
    makeHud(s);
    buildBoard(s);
    makeHighlight(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xd6efff, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xa8d8ea, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x7fb8d6, 1);
    g.fillEllipse(150, 482, 320, 36); g.fillEllipse(400, 492, 360, 42); g.fillEllipse(700, 486, 300, 38);
    g.fillStyle(0xe0f2ff, 1); g.fillRect(0, 620, W, 80);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x7fb8d6, 1);
    for (var i = 0; i < 6; i++) {
      var sx = 90 + i * 145;
      g.fillEllipse(sx, 640, 28, 70);
      g.fillEllipse(sx - 8, 625, 18, 40);
      g.fillEllipse(sx + 8, 630, 16, 36);
    }
    g.fillStyle(0xffffff, 0.55);
    for (var j = 0; j < 8; j++) {
      g.fillCircle(110 + j * 105, 560 + (j % 2) * 18, 5);
      g.fillCircle(130 + j * 105, 545 + (j % 3) * 10, 3);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Arcade", textStyle(32, "#102A43")).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level: 1", textStyle(20, "#102A43"));
    hudMoves = scene.add.text(24, 78, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 104, "Score: 0", textStyle(20, "#102A43"));
    hudPairs = scene.add.text(W - 24, 52, "Pairs: 0 / 6", textStyle(20, "#102A43")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 84, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 120);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find pairs to dive deeper! Use arrows + Enter", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function getLayout(numPairs) {
    if (numPairs === 6) { return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 }; }
    if (numPairs === 8) { return { cols: 4, rows: 4, cw: 185, ch: 108, gx: 62, gy: 195, padX: 22, padY: 12 }; }
    return { cols: 5, rows: 4, cw: 148, ch: 108, gx: 48, gy: 195, padX: 16, padY: 12 };
  }

  function shuffledDeck(numPairs) {
    var deck = [];
    for (var i = 0; i < numPairs; i++) {
      var a = ANIMALS[i % ANIMALS.length];
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    }
    for (var k = deck.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var t = deck[k]; deck[k] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var numPairs = level === 1 ? 6 : (level === 2 ? 8 : 10);
    var deck = shuffledDeck(numPairs);
    var L = getLayout(numPairs);
    cols = L.cols; rows = L.rows;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / L.cols), c = idx % L.cols;
      var cx = L.gx + c * (L.cw + L.padX) + L.cw / 2;
      var cy = L.gy + r * (L.ch + L.padY) + L.ch / 2;
      cards.push(makeCard(scene, cx, cy, L.cw, L.ch, card));
    });
    matches = 0;
    firstPick = null;
    hudPairs.setText("Pairs: 0 / " + numPairs);
    hudLevel.setText("Level: " + level);
    selectedIndex = 0;
    updateHighlight();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    back.fillStyle(0xffffff, 0.35);
    back.fillCircle(-w / 4, -h / 5, 10); back.fillCircle(w / 5, h / 6, 7); back.fillCircle(0, h / 4, 11);
    var paw = scene.add.text(0, -4, "\u{1F4A7}", { fontSize: (w > 160 ? "48px" : "40px") }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd6efff, 0xb8e0f0, 0xe0f2ff, 0xcce6ff, 0xa8d8ea, 0xd4f0ff, 0xbfe9ff, 0xe6f4ff, 0xc2e8ff, 0xd9eeff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: (w > 160 ? "56px" : "48px") }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 160 ? 18 : 16, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) { scene.tweens.add({ targets: cont, scale: 1.04, duration: 120 }); } });
    cont.on("pointerout", function () { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); });
    return card;
  }

  function makeHighlight(scene) {
    highlight = scene.add.graphics().setDepth(5);
    updateHighlight();
  }

  function updateHighlight() {
    if (!highlight || cards.length === 0) { return; }
    highlight.clear();
    if (selectedIndex < 0 || selectedIndex >= cards.length) { return; }
    var c = cards[selectedIndex];
    if (!c || c.matched) { return; }
    var x = c.view.x, y = c.view.y, w = c.w, h = c.h;
    highlight.lineStyle(4, 0x4EA8DE, 1);
    highlight.strokeRoundedRect(x - w / 2 - 6, y - h / 2 - 6, w + 12, h + 12, 20);
    highlight.lineStyle(2, 0xffffff, 0.9);
    highlight.strokeRoundedRect(x - w / 2 - 3, y - h / 2 - 3, w + 6, h + 6, 18);
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    var idx = cards.indexOf(card);
    if (idx !== -1) { selectedIndex = idx; updateHighlight(); }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        spawnBubbles(scene, card.view.x, card.view.y);
        spawnBubbles(scene, a.view.x, a.view.y);
        streak++;
        var pts = 100 + (streak - 1) * 20;
        score += pts;
        hudScore.setText("Score: " + score);
        matches++;
        var numPairs = level === 1 ? 6 : (level === 2 ? 8 : 10);
        hudPairs.setText("Pairs: " + matches + " / " + numPairs);
        if (streak > 1) {
          hudMsg.setText("Combo x" + streak + "! +" + pts + " \u2728");
        } else {
          hudMsg.setText("Great match! +" + pts + " \u{1F389}");
        }
        var scorePop = scene.add.text(card.view.x, card.view.y - 70, "+" + pts, textStyle(22, "#102A43")).setOrigin(0.5).setDepth(15);
        scene.tweens.add({ targets: scorePop, y: scorePop.y - 30, alpha: 0, duration: 800, onComplete: function () { scorePop.destroy(); } });
        lockBoard = false;
        updateHighlight();
        if (matches === numPairs) {
          if (level < 3) { showLevelComplete(scene); } else { showGameComplete(scene); }
        }
      }, 350);
    } else {
      streak = 0;
      hudMsg.setText("Try again! \u{1F4A7}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateHighlight(); });
      }, 700);
    }
  }

  function spawnBubbles(scene, x, y) {
    for (var i = 0; i < 6; i++) {
      var b = scene.add.text(x + Phaser.Math.Between(-20, 20), y + Phaser.Math.Between(-10, 10), "\u25CB", { fontSize: "16px", color: "#4EA8DE" }).setOrigin(0.5).setAlpha(0.7).setDepth(12);
      scene.tweens.add({ targets: b, y: y - Phaser.Math.Between(40, 80), x: b.x + Phaser.Math.Between(-20, 20), alpha: 0, scale: 1.4, duration: Phaser.Math.Between(600, 900), onComplete: (function (t) { return function () { t.destroy(); }; })(b) });
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F30A} Ocean Arcade \u{1F419}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Dive through 3 arcade levels!\n6, 8, then 10 pairs — score combos!", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F419} \u{1F433} \u{1F42C} \u{1F980} \u{1F422} \u{1F420}", { fontSize: "38px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 50, "No timers, no penalties — just skill!", textStyle(16, "#102A43")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Dive In", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card or use arrows + Enter!");
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card or use arrows + Enter!");
      }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} Level Complete! \u{1F389}", textStyle(36, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    endBtnBg = scene.add.graphics();
    endBtnBg.fillStyle(0x4EA8DE, 1); endBtnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    endBtnLabel = scene.add.text(0, 85, "Next Level \u25B6", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, endBtnBg, endBtnLabel]);
    endBtnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    endBtnBg.on("pointerdown", function () {
      if (level < 3) { nextLevel(scene); } else { restart(scene); }
    });
  }

  function showLevelComplete(scene) {
    var numPairs = level === 1 ? 6 : (level === 2 ? 8 : 10);
    endTitle.setText("\u2728 Level " + level + " Complete! \u2728");
    endDetail.setText("Pairs: " + numPairs + " / " + numPairs + "  Moves: " + moves + "\nScore: " + score + "  \u2B50 Keep diving!");
    endBtnLabel.setText("Next Level \u25B6");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Level " + level + " cleared! \u{1F30A}");
    burstConfetti(scene);
  }

  function showGameComplete(scene) {
    var stars = moves <= 18 ? 3 : (moves <= 28 ? 2 : 1);
    endTitle.setText("\u{1F389} Arcade Master! \u{1F389}");
    endDetail.setText("All 3 levels cleared!\nScore: " + score + "  Moves: " + moves + "  " + "\u2B50".repeat(stars));
    endBtnLabel.setText("\u21BB Play Again");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    burstConfetti(scene);
  }

  function burstConfetti(scene) {
    for (var i = 0; i < 30; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F4A7}", "\u2B50", "\u{1F389}", "\u{1F30A}"][i % 4], { fontSize: "24px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1400, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; level = 1; score = 0; streak = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function nextLevel(scene) {
    level++;
    moves = 0; matches = 0; firstPick = null; lockBoard = false; streak = 0;
    hudMoves.setText("Moves: " + moves);
    hudMsg.setText("Level " + level + "! Find " + (level === 2 ? 8 : 10) + " pairs!");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown-LEFT", function () { moveSelection(-1, 0); });
    scene.input.keyboard.on("keydown-RIGHT", function () { moveSelection(1, 0); });
    scene.input.keyboard.on("keydown-UP", function () { moveSelection(0, -1); });
    scene.input.keyboard.on("keydown-DOWN", function () { moveSelection(0, 1); });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (!started || endOverlay.visible) { return; }
      if (selectedIndex >= 0 && cards[selectedIndex]) { onCard(scene, cards[selectedIndex]); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (!started || endOverlay.visible) { return; }
      if (selectedIndex >= 0 && cards[selectedIndex]) { onCard(scene, cards[selectedIndex]); }
    });
  }

  function moveSelection(dx, dy) {
    if (!started || cards.length === 0 || endOverlay.visible) { return; }
    var c = selectedIndex % cols;
    var r = Math.floor(selectedIndex / cols);
    var nc = c + dx;
    var nr = r + dy;
    if (nc < 0) { nc = cols - 1; }
    if (nc >= cols) { nc = 0; }
    if (nr < 0) { nr = rows - 1; }
    if (nr >= rows) { nr = 0; }
    var ni = nr * cols + nc;
    if (ni >= 0 && ni < cards.length) { selectedIndex = ni; updateHighlight(); }
  }

  function createBubbles(scene) {
    for (var i = 0; i < 14; i++) {
      var b = scene.add.text(Phaser.Math.Between(40, W - 40), Phaser.Math.Between(480, 620), "\u25CB", { fontSize: Phaser.Math.Between(10, 18) + "px", color: "#ffffff" }).setAlpha(0.45).setDepth(2);
      bubbles.push({ view: b, speed: Phaser.Math.FloatBetween(0.3, 0.9), drift: Phaser.Math.FloatBetween(-0.3, 0.3) });
    }
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.view.y -= b.speed;
      b.view.x += b.drift * 0.2;
      if (b.view.y < 470) {
        b.view.y = 620;
        b.view.x = Phaser.Math.Between(40, W - 40);
      }
    }
  }
})();
</script>
</body>
</html>
