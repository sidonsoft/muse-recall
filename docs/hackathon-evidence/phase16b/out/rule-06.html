<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18);border:2px solid #B9E0FF}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean memory match game. Use arrow keys to move focus and Enter to flip cards. Press R to restart."></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, streak = 0, bestStreak = 0;
  var hudMoves, hudScore, hudMsg, hudStreak, endOverlay, endTitle, endDetail, startOverlay;
  var bubbles = [], focusIndex = 0;

  function create() {
    var s = this;
    drawOcean(s);
    createBubbles(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    s.input.keyboard.on("keydown", function (e) {
      if (!started) {
        if (e.code === "Enter" || e.code === "Space") {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Find a pair!");
          updateFocus();
        }
        return;
      }
      if (endOverlay.visible) {
        if (e.code === "Enter" || e.code === "Space") {
          restart(s);
        }
        return;
      }
      if (e.code === "ArrowRight") { focusIndex = (focusIndex + 1) % cards.length; updateFocus(); }
      else if (e.code === "ArrowLeft") { focusIndex = (focusIndex - 1 + cards.length) % cards.length; updateFocus(); }
      else if (e.code === "ArrowDown") { focusIndex = (focusIndex + 4) % cards.length; updateFocus(); }
      else if (e.code === "ArrowUp") { focusIndex = (focusIndex - 4 + cards.length) % cards.length; updateFocus(); }
      else if (e.code === "Enter" || e.code === "Space") {
        onCard(s, cards[focusIndex]);
      } else if (e.code === "KeyR") {
        restart(s);
      }
    });
    updateFocus();
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD4EAF7, 1); g.fillRect(0, 0, W, 170);
    g.fillStyle(0xB9E0FF, 1); g.fillRect(0, 150, W, 50);
    g.fillStyle(0x8ECAE6, 1);
    g.fillEllipse(160, 185, 320, 36); g.fillEllipse(420, 195, 360, 32); g.fillEllipse(700, 180, 300, 34);
    g.fillStyle(0xCAF0F8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x90E0EF, 1); g.fillEllipse(220, 525, 420, 56); g.fillEllipse(620, 545, 520, 68);
    g.fillStyle(0x4EA8DE, 1);
    for (var i = 0; i < 5; i++) {
      var sx = 70 + i * 180;
      g.fillEllipse(sx, 620, 28, 110); g.fillEllipse(sx + 12, 600, 18, 80);
    }
    g.fillStyle(0xFFAFCC, 0.9); g.fillCircle(130, 585, 16); g.fillCircle(150, 575, 12); g.fillCircle(115, 570, 10);
    g.fillStyle(0xFFC8DD, 0.9); g.fillCircle(760, 590, 18); g.fillCircle(780, 575, 12);
    g.fillStyle(0xffffff, 0.35); g.fillTriangle(770, 0, 710, 170, 830, 170);
    g.fillStyle(0xffffff, 0.5); g.fillCircle(770, 90, 38); g.fillStyle(0xEAF6FF, 1); g.fillCircle(770, 90, 28);
  }

  function createBubbles(scene) {
    for (var i = 0; i < 14; i++) {
      var b = scene.add.graphics();
      var r = Phaser.Math.Between(5, 12);
      b.fillStyle(0xffffff, 0.55); b.fillCircle(0, 0, r);
      b.lineStyle(1, 0x4EA8DE, 0.25); b.strokeCircle(0, 0, r);
      b.x = Phaser.Math.Between(30, W - 30);
      b.y = Phaser.Math.Between(200, H - 20);
      b.setDepth(1);
      b.speed = Phaser.Math.FloatBetween(0.25, 0.85);
      b.drift = Phaser.Math.FloatBetween(-0.35, 0.35);
      bubbles.push(b);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudStreak = scene.add.text(24, 114, "Streak: 0", textStyle(18, "#1D6FA5"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.05); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the 6 animal pairs! Build a streak!", textStyle(20, "#1D6FA5")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.focusOutline) c.focusOutline.destroy(); c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIndex = 0;
    updateFocus();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 16);
    back.fillStyle(0xB9E0FF, 1); back.fillRoundedRect(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 12);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 5, 10); back.fillCircle(w / 5, 2, 7); back.fillCircle(0, h / 4, 11);
    var paw = scene.add.text(0, -4, "\u{1F43E}", { fontSize: "48px" }).setOrigin(0.5);
    paw.setAlpha(0.95);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0x90E0EF, 0xADE8F4, 0xB9E0FF, 0xD6EFFF, 0xEAF6FF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 16);
    fg.lineStyle(2, 0x4EA8DE, 0.35); fg.strokeRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "58px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, focusOutline: null, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) scene.tweens.add({ targets: cont, scale: 1.03, duration: 120 }); });
    cont.on("pointerout", function () { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); });
    return card;
  }

  function updateFocus() {
    cards.forEach(function (c, i) {
      if (c.focusOutline) { c.focusOutline.destroy(); c.focusOutline = null; }
      if (i === focusIndex && started && endOverlay && !endOverlay.visible) {
        var g = c.view.scene.add.graphics();
        g.lineStyle(4, 0x4EA8DE, 1); g.strokeRoundedRect(c.view.x - c.w / 2 - 5, c.view.y - c.h / 2 - 5, c.w + 10, c.h + 10, 24);
        g.setDepth(4);
        c.focusOutline = g;
      }
    });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, ease: "Sine.easeInOut", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, ease: "Sine.easeInOut", onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); updateFocus(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        streak++; if (streak > bestStreak) bestStreak = streak;
        hudStreak.setText("Streak: " + streak + (streak > 1 ? " \u2728" : ""));
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.07, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        for (var i = 0; i < 6; i++) {
          var p = scene.add.graphics();
          p.fillStyle(0xffffff, 0.9); p.fillCircle(0, 0, 4 + i % 3);
          p.x = card.view.x; p.y = card.view.y; p.setDepth(6);
          scene.tweens.add({ targets: p, y: p.y - 60 - i * 8, x: p.x + Phaser.Math.Between(-30, 30), alpha: 0, duration: 700 + i * 60, onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
        }
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        if (streak >= 3) { hudMsg.setText("Amazing! " + streak + " in a row! \u{1F30A}"); }
        else if (streak === 2) { hudMsg.setText("Great streak! \u2728"); }
        else { hudMsg.setText(matches === 6 ? "You did it!" : "Yay! A pair! \u{1F389}"); }
        lockBoard = false;
        updateFocus();
        if (matches === 6) { showWin(scene); }
      }, 320);
    } else {
      streak = 0; hudStreak.setText("Streak: 0");
      hudMsg.setText("So close! Try again \u{1F4A7}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocus(); });
      }, 750);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(4, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F30A} Ocean Match \u{1F404}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var hint = scene.add.text(0, 10, "Build a streak for extra sparkle!\nNo rush \u2014 play at your pace.", Object.assign(textStyle(18, "#1D6FA5"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 55, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 95, 260, 64, 32);
    var btnTx = scene.add.text(0, 127, "\u25B6  Dive In", textStyle(26, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, hint, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 95, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Find a pair!");
      updateFocus();
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(4, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(40, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 64, 32);
    var btnTx = scene.add.text(0, 82, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var msg = "You found all 6 pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars);
    if (bestStreak >= 2) { msg += "\nBest streak: " + bestStreak + " \u2728"; }
    endDetail.setText(msg);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 28; i++) {
      var p = scene.add.text(Phaser.Math.Between(40, W - 40), H + 20, ["\u{1F4A7}", "\u2B50", "\u{1F389}", "\u{1F30A}"][i % 4], { fontSize: "24px" }).setDepth(30);
      p.alpha = 0.9;
      scene.tweens.add({ targets: p, y: Phaser.Math.Between(80, 220), x: p.x + Phaser.Math.Between(-40, 40), alpha: 0, duration: Phaser.Math.Between(1400, 2200), delay: i * 70, ease: "Sine.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudStreak.setText("Streak: 0"); hudMsg.setText("Find a pair!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { if (c.focusOutline) c.focusOutline.destroy(); c.view.destroy(); });
    buildBoard(scene);
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed;
      b.x += Math.sin(Date.now() * 0.001 + i) * 0.15 + b.drift * 0.05;
      if (b.y < 160) { b.y = H - 10; b.x = Phaser.Math.Between(30, W - 30); }
    }
  }
})();
</script>
</body>
</html>
