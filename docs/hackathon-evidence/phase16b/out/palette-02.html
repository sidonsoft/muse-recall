<body>

<script>
(function () {

  var config = {

    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);

  function makeHud(scene) {
    scene.add.text(24, 14, "OCEAN ARCADE MATCH", textStyle(28, "#102A43")).setOrigin(0, 0);

  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusedIndex = 0;
    updateFocusHighlight();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    back.lineStyle(2, 0xffffff, 0.5); back.strokeRoundedRect(-w / 2 + 18, -h / 2 + 22, w - 36, h - 44, 12);
    var paw = scene.add.text(0, -6, "\u{1F30A}", { fontSize: "48px" }).setOrigin(0.5);
    var shine = scene.add.graphics();
    shine.fillStyle(0xffffff, 0.18); shine.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, 22, 12);
    var showBack = scene.add.container(0, 0, [back, paw, shine]);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xB6E1F2, 0xC7EBFF, 0xD6EEFF, 0xA0D8EF, 0x7CC4E8];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    fg.lineStyle(3, 0x4EA8DE, 0.9); fg.strokeRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var focusRect = scene.add.graphics();
    focusRect.lineStyle(4, 0xFFB703, 1); focusRect.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 24);
    focusRect.setVisible(false);
    cont.add([showBack, face, focusRect]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, focusRect: focusRect, x: x, y: y };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () {
      if (!card.matched && !card.faceUp) {
        scene.tweens.add({ targets: cont, scale: 1.04, duration: 120 });
        var idx = cards.indexOf(card);
        if (idx !== -1) { focusedIndex = idx; updateFocusHighlight(); }
      }
    });
    cont.on("pointerout", function () { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    playTone(show ? 820 : 380, 0.08, "sine", 0.12);
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 110, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 110, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched || isGameOver) { return; }
    ensureAudio();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("ONE MORE! \u2728"); announce("One more"); return; }
    moves++;
    hudMoves.setText("MOVES " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        combo++;
        maxCombo = Math.max(maxCombo, combo);
        var add = addScore(scene, 100, true);
        timeLeft = Math.min(timeMax, timeLeft + 1.2);
        updateTimerDisplay();
