<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#D6EAF8;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.25)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game"></div>
<div id="status" class="sr-only" role="status" aria-live="polite">Farmyard Match. Press Start to play.</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, round = 1, streak = 0, bestStreak = 0, missesThisRound = 0;
  var hudMoves, hudScore, hudMsg, hudExtra, endOverlay, endTitle, endDetail, startOverlay;
  var bubbles = [], selectRing = null, selectedIndex = 0;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeBubbles(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  var audioCtx = null;
  function tone(freq, dur, delay, type) {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return; }
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function playFlip() { tone(420, 0.12, 0, "sine"); }
  function playMatch() { tone(523, 0.14, 0, "triangle"); tone(659, 0.16, 0.09, "triangle"); tone(784, 0.22, 0.18, "triangle"); }
  function playMiss() { tone(300, 0.15, 0, "sine"); tone(240, 0.18, 0.1, "sine"); }
  function playWin() { tone(523, 0.15, 0, "triangle"); tone(659, 0.15, 0.12, "triangle"); tone(784, 0.15, 0.24, "triangle"); tone(1047, 0.3, 0.36, "triangle"); }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xBDDDEE, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 450, W, 30);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFEF9C3, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.85);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn in ocean tones (keeps layout, cool palette)
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2A6F97, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xEAF6FB, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xEAF6FB, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence in deep ocean tones
    g.lineStyle(8, 0x2A6F97, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers / anemones
    var cols = [0x4EA8DE, 0x56CFE1, 0x72EFDD, 0xA9D6E5];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2A6F97, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function makeBubbles(scene) {
    for (var i = 0; i < 14; i++) {
      var b = scene.add.circle(
        Phaser.Math.Between(20, W - 20),
        Phaser.Math.Between(180, H - 20),
        Phaser.Math.Between(3, 10),
        0xffffff, 0.35
      ).setDepth(-1);
      b.speed = Phaser.Math.FloatBetween(12, 34);
      b.drift = Phaser.Math.FloatBetween(-10, 10);
      b.baseX = b.x;
      bubbles.push(b);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudExtra = scene.add.text(24, 122, "Score: 0  •  Round 1  •  Streak 0", textStyle(20));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#2A6F97")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    btn.setSize(172, 52);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match pairs to score! Chain matches for a combo!", textStyle(21, "#2A6F97")).setOrigin(0.5);
    scene.add.text(W / 2, 688, "Arrows: choose card   Enter/Space: flip   R: restart", textStyle(15, "#2A6F97")).setOrigin(0.5);
    updateHudExtra();
  }

  function updateHudExtra() {
    if (hudExtra) { hudExtra.setText("Score: " + score + "  •  Round " + round + "  •  Streak " + streak); }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    selectedIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      var made = makeCard(scene, cx, cy, cw, ch, card);
      made.idx = idx;
      cards.push(made);
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0xADE8F4, 0x90E0EF, 0xBDDDEE, 0xA9D6E5, 0xD6EAF8];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () {
      if (typeof card.idx === "number") { selectedIndex = card.idx; updateSelection(scene); }
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function burstAt(scene, x, y) {
    for (var i = 0; i < 10; i++) {
      var star = scene.add.text(x, y, "\u2728", { fontSize: "22px" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({
        targets: star,
        x: x + Phaser.Math.Between(-70, 70),
        y: y + Phaser.Math.Between(-60, 30),
        alpha: 0, duration: Phaser.Math.Between(450, 750), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(star)
      });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    playFlip();
    if (!firstPick) {
      firstPick = card;
      hudMsg.setText("One more!");
      announce("First card " + card.data.name + ". Pick one more.");
      updateSelection(scene);
      return;
    }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak > 1 ? (streak - 1) * 25 : 0);
        score += gained;
        burstAt(scene, card.view.x, card.view.y);
        playMatch();
        hudScore.setText("Pairs: " + matches + " / 6");
        updateHudExtra();
        if (matches === 6) {
          hudMsg.setText("Round " + round + " clear!");
          announce("Round " + round + " clear! Score " + score + ".");
        } else if (streak > 1) {
          hudMsg.setText("Combo x" + streak + "! +" + gained + " \u{1F389}");
          announce("Combo times " + streak + ". Plus " + gained + " points. " + matches + " of 6 pairs.");
        } else {
          hudMsg.setText("Yay! A pair! +100 \u{1F389}");
          announce("Pair found. Plus 100 points. " + matches + " of 6 pairs.");
        }
        lockBoard = false;
        updateSelection(scene);
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      missesThisRound++;
      streak = 0;
      updateHudExtra();
      playMiss();
      hudMsg.setText("Try again! \u{1F340}");
      announce("Not a match. Try again. " + matches + " of 6 pairs.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateSelection(scene); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Flip the cards and find\nall 6 animal pairs!\nChain pairs for COMBO bonus points!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card! Round " + round);
    announce("Round " + round + " started. Score " + score + ". Tap a card.");
    updateSelection(scene);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} Round Clear! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u25B6 Next Round", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { nextRound(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var perfect = missesThisRound === 0 ? "\nPerfect round! +200 bonus!" : "";
    if (missesThisRound === 0) { score += 200; updateHudExtra(); }
    endTitle.setText("\u{1F389} Round " + round + " Clear! \u{1F389}");
    endDetail.setText("6 pairs in " + moves + " moves  " + "\u2B50".repeat(stars) +
      "\nScore: " + score + "  •  Best streak: " + bestStreak + perfect +
      "\nPress Next Round to keep scoring!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Round " + round + " clear! \u{1F389}");
    announce("Round " + round + " clear. Score " + score + ". Press Next Round.");
    playWin();
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function resetRoundState(scene, keepScore) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    streak = 0; missesThisRound = 0;
    if (!keepScore) { score = 0; bestStreak = 0; }
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudMsg.setText("Tap a card! Round " + round);
    updateHudExtra();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    announce("Round " + round + " started. Score " + score + ".");
    updateSelection(scene);
  }

  function nextRound(scene) {
    round++;
    resetRoundState(scene, true);
  }

  function restart(scene) {
    round = 1;
    resetRoundState(scene, false);
  }

  function updateSelection(scene) {
    if (!cards.length) { return; }
    if (selectedIndex < 0) { selectedIndex = 0; }
    if (selectedIndex >= cards.length) { selectedIndex = cards.length - 1; }
    if (!selectRing) {
      selectRing = scene.add.graphics().setDepth(5);
    }
    selectRing.clear();
    if (!started || !cards[selectedIndex]) { return; }
    var v = cards[selectedIndex].view;
    selectRing.lineStyle(5, 0x102A43, 1);
    selectRing.strokeRoundedRect(v.x - 99, v.y - 76, 198, 152, 24);
  }

  function activateSelected(scene) {
    if (!started) {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { nextRound(scene); return; }
      return;
    }
    if (endOverlay && endOverlay.visible) { nextRound(scene); return; }
    var card = cards[selectedIndex];
    if (card) { onCard(scene, card); }
  }

  function setupKeyboard(scene) {
    updateSelection(scene);
    window.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "ArrowDown" ||
          e.key === " " || e.key === "Enter" || e.key === "r" || e.key === "R") {
        e.preventDefault();
      } else { return; }
      var cols = 4;
      if (e.key === "ArrowRight") { selectedIndex = (selectedIndex + 1) % cards.length; updateSelection(scene); }
      else if (e.key === "ArrowLeft") { selectedIndex = (selectedIndex + cards.length - 1) % cards.length; updateSelection(scene); }
      else if (e.key === "ArrowDown") { selectedIndex = (selectedIndex + cols) % cards.length; updateSelection(scene); }
      else if (e.key === "ArrowUp") { selectedIndex = (selectedIndex + cards.length - cols) % cards.length; updateSelection(scene); }
      else if (e.key === " " || e.key === "Enter") { activateSelected(scene); }
      else if (e.key === "r" || e.key === "R") { restart(scene); }
    });
  }

  function update(time, delta) {
    var dt = Math.min((delta || 16.6) / 1000, 0.05);
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed * dt;
      b.x = b.baseX + Math.sin((time || 0) / 900 + i) * 12 + b.drift * 0.2;
      if (b.y < 175) {
        b.y = H - 10;
        b.baseX = Phaser.Math.Between(20, W - 20);
      }
    }
  }
})();
</script>
</body>
</html>
