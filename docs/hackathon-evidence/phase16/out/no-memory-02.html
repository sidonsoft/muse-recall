<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" tabindex="0" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to move, Enter to flip a card, R to restart."></div>
<div id="status" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0;
  var TIME_TOTAL = 60, TIME_BONUS = 4, TIME_PENALTY = 2;
  var timeLeft = TIME_TOTAL, timerEv = null, gameScene = null;
  var selectedIdx = 0, cursorGfx = null, keyboardUsed = false;
  var hudMoves, hudScore, hudPts, hudTime, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var timeBarBg, timeBarFill;

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  var actx = null;
  function tone(freq, dur, type, vol, when) {
    try {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) { return; } actx = new AC(); }
      if (actx.state === "suspended") { actx.resume(); }
      var t = actx.currentTime + (when || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + (dur || 0.12) + 0.05);
    } catch (e) {}
  }
  function sfxFlip() { tone(520, 0.08, "square", 0.07); }
  function sfxMatch(s) { tone(523, 0.1, "square", 0.1); tone(659, 0.1, "square", 0.1, 0.09); tone(784 + Math.min(s, 5) * 60, 0.16, "square", 0.11, 0.18); }
  function sfxMiss() { tone(196, 0.18, "sawtooth", 0.09); tone(147, 0.2, "sawtooth", 0.08, 0.1); }
  function sfxTick() { tone(880, 0.06, "square", 0.07); }
  function sfxWin() { var n = [523, 659, 784, 1047, 784, 1047]; for (var i = 0; i < n.length; i++) { tone(n[i], 0.14, "square", 0.1, i * 0.12); } }
  function sfxLose() { var m = [392, 330, 262, 196]; for (var j = 0; j < m.length; j++) { tone(m[j], 0.2, "sawtooth", 0.09, j * 0.16); } }

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    cursorGfx = s.add.graphics().setDepth(6);
    drawCursor();
    timerEv = s.time.addEvent({ delay: 1000, loop: true, callback: tickClock });
    bindKeys();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudPts = scene.add.text(24, 122, "Score: 0", textStyle(24, "#b34700"));
    hudTime = scene.add.text(W / 2, 24, "\u23F1 1:00", textStyle(30)).setOrigin(0.5, 0);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0x000000, 0.12); timeBarBg.fillRoundedRect(W / 2 - 130, 62, 260, 14, 7);
    timeBarFill = scene.add.graphics();
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Beat the clock! Pairs earn +4s, combos multiply!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    drawTimeBar();
  }

  function drawTimeBar() {
    if (!timeBarFill) { return; }
    timeBarFill.clear();
    var frac = Math.max(0, timeLeft / TIME_TOTAL);
    var col = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xffb703 : 0xe63946);
    timeBarFill.fillStyle(col, 1);
    timeBarFill.fillRoundedRect(W / 2 - 130, 62, Math.max(14, 260 * frac), 14, 7);
    if (hudTime) {
      var s = Math.max(0, Math.ceil(timeLeft));
      hudTime.setText("\u23F1 0:" + (s < 10 ? "0" + s : s));
      hudTime.setColor(frac > 0.25 ? "#5b3a29" : "#c1121f");
    }
  }

  function tickClock() {
    if (!started || !gameScene) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= 1;
    if (timeLeft <= 10 && timeLeft > 0) { sfxTick(); }
    drawTimeBar();
    announce("Time left " + Math.max(0, Math.ceil(timeLeft)) + " seconds. Score " + score + ". Pairs " + matches + " of 6.");
    if (timeLeft <= 0) {
      timeLeft = 0; drawTimeBar();
      showLose(gameScene);
    }
  }

  function addScorePopup(x, y, msg, color) {
    if (!gameScene) { return; }
    var t = gameScene.add.text(x, y - 70, msg, textStyle(28, color || "#b34700")).setOrigin(0.5).setDepth(8);
    gameScene.tweens.add({ targets: t, y: y - 120, alpha: 0, scale: 1.25, duration: 900, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function burst(x, y, big) {
    if (!gameScene) { return; }
    var colors = [0xffb703, 0xfb5607, 0x5da85f, 0x3a86ff, 0xff006e];
    var n = big ? 12 : 7;
    for (var i = 0; i < n; i++) {
      var c = gameScene.add.circle(x, y, big ? 7 : 5, colors[i % colors.length], 1).setDepth(8);
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      var dist = (big ? 90 : 60) + Math.random() * 40;
      gameScene.tweens.add({ targets: c, x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist, alpha: 0, duration: 550 + Math.random() * 250, onComplete: (function (o) { return function () { o.destroy(); }; })(c) });
    }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(true); });
    cards = [];
    selectedIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, cx: x, cy: y, cw: w, ch: h };
    cont.on("pointerdown", function () {
      keyboardUsed = false;
      selectedIdx = cards.indexOf(card);
      drawCursor();
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    if (timeLeft <= 0) { return; }
    flip(card, true);
    sfxFlip();
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("First card " + card.data.name + ". Pick one more."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (timeLeft <= 0) { lockBoard = false; return; }
        a.matched = card.matched = true;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 * streak + Math.max(0, Math.ceil(timeLeft / 10)) * 5;
        score += gained;
        timeLeft = Math.min(TIME_TOTAL, timeLeft + TIME_BONUS);
        hudPts.setText("Score: " + score);
        drawTimeBar();
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 170, ease: "Quad.easeOut" });
        scene.tweens.add({ targets: [a.view, card.view], angle: { from: -3, to: 3 }, yoyo: true, duration: 120, repeat: 1 });
        burst((a.cx + card.cx) / 2, (a.cy + card.cy) / 2, streak >= 2);
        addScorePopup(card.cx, card.cy, "+" + gained + (streak >= 2 ? "  x" + streak + "!" : ""));
        sfxMatch(streak);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        if (matches === 6) { hudMsg.setText("You did it!"); lockBoard = false; showWin(scene); return; }
        hudMsg.setText(streak >= 2 ? "\u{1F525} COMBO x" + streak + "! +" + TIME_BONUS + "s" : "Yay! +" + gained + " (+" + TIME_BONUS + "s) \u{1F389}");
        announce("Pair found! " + card.data.name + ". Plus " + gained + " points. Combo " + streak + ". " + Math.ceil(timeLeft) + " seconds left.");
        lockBoard = false;
        drawCursor();
      }, 350);
    } else {
      streak = 0;
      score = Math.max(0, score - 25);
      timeLeft = Math.max(0, timeLeft - TIME_PENALTY);
      hudPts.setText("Score: " + score);
      drawTimeBar();
      sfxMiss();
      if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(150, 0.008); }
      addScorePopup(card.cx, card.cy, "-2s", "#c1121f");
      hudMsg.setText("Miss! -" + TIME_PENALTY + "s \u{1F340}");
      announce("No match. Minus " + TIME_PENALTY + " seconds. " + Math.ceil(timeLeft) + " seconds left.");
      if (timeLeft <= 0) {
        setTimeout(function () {
          flip(a, false); flip(card, false, function () { lockBoard = false; showLose(scene); });
        }, 550);
        return;
      }
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawCursor(); });
      }, 700);
    }
  }

  function drawCursor() {
    if (!cursorGfx) { return; }
    cursorGfx.clear();
    if (!started || !cards.length) { return; }
    if (!keyboardUsed) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[selectedIdx];
    if (!card || card.matched) { return; }
    cursorGfx.lineStyle(5, 0xfb5607, 1);
    cursorGfx.strokeRoundedRect(card.cx - card.cw / 2 - 5, card.cy - card.ch / 2 - 5, card.cw + 10, card.ch + 10, 26);
  }

  function moveCursor(dRow, dCol) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(selectedIdx / cols), c = selectedIdx % cols;
    r = (r + dRow + 3) % 3; c = (c + dCol + cols) % cols;
    selectedIdx = r * cols + c;
    keyboardUsed = true;
    drawCursor();
  }

  function bindKeys() {
    document.addEventListener("keydown", function (ev) {
      var k = ev.key;
      if (k === "ArrowUp" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowRight") {
        ev.preventDefault();
        if (!started || (endOverlay && endOverlay.visible)) { return; }
        keyboardUsed = true;
        if (k === "ArrowUp") { moveCursor(-1, 0); }
        else if (k === "ArrowDown") { moveCursor(1, 0); }
        else if (k === "ArrowLeft") { moveCursor(0, -1); }
        else { moveCursor(0, 1); }
        return;
      }
      if (k === "Enter" || k === " ") {
        ev.preventDefault();
        if (startOverlay && startOverlay.visible) { startGame(gameScene); return; }
        if (endOverlay && endOverlay.visible) { restart(gameScene); return; }
        if (!started) { return; }
        keyboardUsed = true;
        drawCursor();
        var card = cards[selectedIdx];
        if (card) { onCard(gameScene, card); }
        return;
      }
      if (k === "r" || k === "R") {
        if (started) { restart(gameScene); }
      }
    });
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    timeLeft = TIME_TOTAL; drawTimeBar();
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    announce("Game started. 60 seconds. Find all 6 pairs.");
    var el = document.getElementById("game");
    if (el) { el.focus(); }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "\u23F1 60 seconds! Pairs earn +4s.\nStreaks multiply points. Misses cost -2s!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var timeBonus = Math.ceil(timeLeft) * 10;
    score += timeBonus;
    hudPts.setText("Score: " + score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nScore: " + score + " (+" + timeBonus + " time bonus)\nBest combo x" + Math.max(1, bestStreak) + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Score " + score + " in " + moves + " moves.");
    sfxWin();
    for (var i = 0; i < 70; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    if (endOverlay.visible && matches === 6) { return; }
    lockBoard = true; firstPick = null;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  Moves: " + moves + "\nBest combo x" + Math.max(0, bestStreak));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again!");
    announce("Time is up. You found " + matches + " of 6 pairs. Score " + score + ".");
    sfxLose();
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true;
    timeLeft = TIME_TOTAL; selectedIdx = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudPts.setText("Score: 0");
    hudMsg.setText("Tap a card!");
    drawTimeBar(); drawCursor();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(true); });
    buildBoard(scene);
    drawCursor();
    announce("New game. 60 seconds. Score 0.");
  }

  function update() {}
})();
</script>
</body>
</html>
