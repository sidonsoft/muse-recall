<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d9f0fa;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<p class="visually-hidden" id="game-status" aria-live="polite">Farmyard Match loaded. Press Start to play.</p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F42C}", name: "Dolphin" }
  ];
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3 },
    { pairs: 8, cols: 4, rows: 4 },
    { pairs: 10, cols: 5, rows: 4 }
  ];
  var ACCENT = "#4EA8DE", INK = "#102A43";
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#d9f0fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, level = 1, score = 0, streak = 0, bestStreak = 0, muted = false;
  var bubbles = [], selectedIndex = 0, selBox = null;
  var hudMoves, hudPairs, hudMeta, hudMsg, endOverlay, endTitle, endDetail, endBtnLabel, startOverlay;
  var audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    window.addEventListener("keydown", function (e) { onKey(s, e); });
  }

  function announce(msg) {
    var el = document.getElementById("game-status");
    if (el) { el.textContent = msg; }
  }

  function tone(freq, dur, delay) {
    if (muted) { return; }
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) { /* sound is optional */ }
  }

  function levelConfig() { return LEVELS[Math.min(level, LEVELS.length) - 1]; }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xd9f0fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcaf0f8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x90e0ef, 1); g.fillRect(0, 460, W, 14);
    g.fillStyle(0xffffff, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn in ocean tones
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x1d6fa5, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence in deep sea tone
    g.lineStyle(8, 0x1d6fa5, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // shells along the sand
    var cols = [0xffffff, 0x90e0ef, 0xffc8dd, 0xcaf0f8];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x1d6fa5, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0x4EA8DE, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // slow-drifting bubbles (gentle motion only, no flashing)
    (bubbles || []).forEach(function (b) { b.destroy(); });
    bubbles = [];
    for (var k = 0; k < 14; k++) {
      var bx = 20 + Math.random() * (W - 40), by = 200 + Math.random() * 460;
      var c = scene.add.circle(bx, by, 4 + Math.random() * 9, 0xffffff, 0.35);
      c.setDepth(-1);
      bubbles.push({ view: c, speed: 8 + Math.random() * 18, wobble: Math.random() * 6.28 });
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || INK, fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 12, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 54, "Moves: 0", textStyle(22));
    hudPairs = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(22));
    hudMeta = scene.add.text(24, 110, "Level 1 \u2022 Score 0", textStyle(22));
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(22)).setOrigin(1, 0);
    var btn = scene.add.container(W - 110, 112);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    bg.lineStyle(3, 0xffffff, 1); bg.strokeRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    btn.setSize(172, 52);
    scene.add.text(W / 2, 164, "Clear all pairs to reach the next arcade level!", textStyle(20)).setOrigin(0.5);
    scene.add.text(W - 24, 142, "Arrows move \u2022 Enter flips \u2022 M mutes", textStyle(15)).setOrigin(1, 0.5);
  }

  function ensureAudio() {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { /* sound is optional */ }
  }

  function shuffledDeck(pairCount) {
    var deck = [];
    ANIMALS.slice(0, pairCount).forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function refreshMeta() {
    var cfg = levelConfig();
    hudMoves.setText("Moves: " + moves);
    hudPairs.setText("Pairs: " + matches + " / " + cfg.pairs);
    hudMeta.setText("Level " + level + " \u2022 Score " + score + (bestStreak > 1 ? " \u2022 Best combo x" + bestStreak : ""));
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    if (selBox) { selBox.destroy(); selBox = null; }
    var cfg = levelConfig();
    var deck = shuffledDeck(cfg.pairs);
    var cols = cfg.cols, rows = cfg.rows;
    var boardW = 800, boardH = rows > 3 ? 470 : 430;
    var padX = 16, padY = 14;
    var cw = Math.min(185, (boardW - padX * (cols - 1)) / cols);
    var ch = Math.min(140, boardH / rows - padY);
    var gx = (W - (cols * cw + (cols - 1) * padX)) / 2, gy = 192;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    selectedIndex = 0;
    drawSelection(scene);
    refreshMeta();
  }

  function drawSelection(scene) {
    if (!cards.length) { return; }
    if (selectedIndex < 0) { selectedIndex = 0; }
    if (selectedIndex >= cards.length) { selectedIndex = cards.length - 1; }
    var card = cards[selectedIndex];
    var w = card.w + 12, h = card.h + 12;
    if (!selBox) {
      selBox = scene.add.graphics().setDepth(5);
    }
    selBox.clear();
    selBox.lineStyle(4, 0x102A43, 1);
    selBox.strokeRoundedRect(card.view.x - w / 2, card.view.y - h / 2, w, h, 20);
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xe0fbfc, 0xc8e7ff, 0xd8f3dc, 0xfff3b0, 0xe4c1f9, 0x90e0ef, 0xbde0fe, 0xffd6a5, 0xffc8dd];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h, index: idx };
    cont.on("pointerdown", function () { ensureAudio(); selectedIndex = card.index; drawSelection(scene); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function scorePopup(scene, x, y, text) {
    var p = scene.add.text(x, y - 60, text, textStyle(26, "#1d6fa5")).setOrigin(0.5).setDepth(8);
    scene.tweens.add({ targets: p, y: y - 110, alpha: 0, duration: 900, ease: "Sine.easeOut",
      onComplete: function () { p.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    tone(520, 0.12, 0);
    if (!firstPick) {
      firstPick = card;
      selectedIndex = card.index; drawSelection(scene);
      hudMsg.setText("One more!");
      announce("First card: " + card.data.name + ". Pick one more.");
      return;
    }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    refreshMeta();
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180 });
        tone(660, 0.14, 0); tone(880, 0.18, 0.12);
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak > 1 ? (streak - 1) * 25 : 0);
        score += gained;
        scorePopup(scene, card.view.x, card.view.y, "+" + gained + (streak > 1 ? "  combo x" + streak : ""));
        refreshMeta();
        var cfg = levelConfig();
        var done = matches === cfg.pairs;
        var msg = done ? "Level " + level + " clear!" : (streak > 1 ? "Combo x" + streak + "! Yay! \u{1F389}" : "Yay! A pair! \u{1F389}");
        hudMsg.setText(msg);
        announce(msg + " Score " + score + ". Pairs " + matches + " of " + cfg.pairs + ".");
        lockBoard = false;
        if (done) { showWin(scene); }
      }, 350);
    } else {
      // No penalty: streak bonus simply pauses; score never goes down.
      streak = 0;
      refreshMeta();
      hudMsg.setText("Good try! Keep swimming! \u{1F340}");
      announce("Not a match. " + a.data.name + " and " + card.data.name + ". Try again.");
      tone(330, 0.16, 0);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "3 arcade levels: 6, 8, then 10 pairs!\nMatch pairs for 100 pts + combo bonus.\nNo timer, no penalties \u2014 just keep swimming!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 75, 260, 70, 35);
    var btnTx = scene.add.text(0, 110, "\u25B6  Start (Enter)", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 75, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    ensureAudio();
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card or press Enter!");
    announce("Level " + level + " started. Find all " + levelConfig().pairs + " pairs. Use arrow keys and Enter.");
    tone(523, 0.14, 0); tone(659, 0.14, 0.12); tone(784, 0.2, 0.24);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} Level Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-150, 50, 300, 70, 35);
    endBtnLabel = scene.add.text(0, 85, "\u21BB Next Level (Enter)", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnLabel]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-150, 50, 300, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); advance(scene); });
  }

  function starsFor(cfg, moveCount) {
    if (moveCount <= cfg.pairs + 4) { return 3; }
    if (moveCount <= cfg.pairs * 2) { return 2; }
    return 1;
  }

  function showWin(scene) {
    var cfg = levelConfig();
    var stars = starsFor(cfg, moves);
    var last = level >= LEVELS.length;
    endTitle.setText(last ? "\u{1F389} Arcade Champion! \u{1F389}" : "\u{1F389} Level " + level + " Clear! \u{1F389}");
    endDetail.setText("Pairs: " + matches + " / " + cfg.pairs + "  \u2022  Score: " + score +
      "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) +
      (last ? "\nYou cleared all 3 arcade levels!" : "\nNext: " + LEVELS[Math.min(level, LEVELS.length - 1)].pairs + " pairs!"));
    endBtnLabel.setText(last ? "\u21BB Play Again (Enter)" : "\u21BB Next Level (Enter)");
    endOverlay.setVisible(true);
    announce(endTitle.text + " " + endDetail.text);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText(last ? "Arcade champion! \u{1F389}" : "Level clear! \u{1F389}");
    tone(659, 0.15, 0); tone(784, 0.15, 0.14); tone(1047, 0.25, 0.28);
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u26AA"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1400, 2400), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function advance(scene) {
    if (level >= LEVELS.length) {
      level = 1; score = 0; bestStreak = 0;
    } else {
      level++;
    }
    resetBoard(scene);
  }

  function resetBoard(scene) {
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Level " + level + ": tap a card!");
    announce("Level " + level + " with " + levelConfig().pairs + " pairs. Score " + score + ".");
    buildBoard(scene);
  }

  function restart(scene) {
    level = 1; score = 0; streak = 0; bestStreak = 0;
    resetBoard(scene);
  }

  function onKey(scene, e) {
    var key = e.key;
    if (key === "m" || key === "M") { muted = !muted; hudMsg.setText(muted ? "Sound off (M to turn on)" : "Sound on!"); return; }
    if (startOverlay && startOverlay.visible) {
      if (key === "Enter" || key === " ") { e.preventDefault(); startGame(scene); }
      return;
    }
    if (endOverlay && endOverlay.visible) {
      if (key === "Enter" || key === " ") { e.preventDefault(); ensureAudio(); advance(scene); }
      return;
    }
    if (!started || !cards.length) { return; }
    var cfg = levelConfig();
    var cols = cfg.cols;
    if (key === "ArrowLeft") { e.preventDefault(); selectedIndex = (selectedIndex + cards.length - 1) % cards.length; drawSelection(scene); }
    else if (key === "ArrowRight") { e.preventDefault(); selectedIndex = (selectedIndex + 1) % cards.length; drawSelection(scene); }
    else if (key === "ArrowUp") { e.preventDefault(); selectedIndex = (selectedIndex - cols + cards.length) % cards.length; drawSelection(scene); }
    else if (key === "ArrowDown") { e.preventDefault(); selectedIndex = (selectedIndex + cols) % cards.length; drawSelection(scene); }
    else if (key === "Enter" || key === " ") { e.preventDefault(); ensureAudio(); onCard(scene, cards[selectedIndex]); }
    else if (key === "r" || key === "R") { restart(scene); }
  }

  function update(time, delta) {
    var dt = Math.min((delta || 16) / 1000, 0.05);
    bubbles.forEach(function (b) {
      b.wobble += dt * 0.8;
      b.view.y -= b.speed * dt;
      b.view.x += Math.sin(b.wobble) * 8 * dt;
      if (b.view.y < 180) { b.view.y = 660; b.view.x = 20 + Math.random() * (W - 40); }
    });
  }
})();
</script>
</body>
</html>
