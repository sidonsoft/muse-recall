<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;flex-direction:column}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18);outline:none}
  canvas:focus-visible{outline:3px solid #4EA8DE;outline-offset:4px}
  #live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard memory match card game. Use arrow keys to choose a card and Enter to flip it."></div>
<p id="live" aria-live="polite"></p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  var game = new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, level = 1, streak = 0, bestCombo = 0;
  var hudMoves, hudScore, hudMsg, hudArcade, endOverlay, endTitle, endDetail, startOverlay;
  var kbIndex = 0, kbMarker = null, progressBar = null, progressFill = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    kbMarker = s.add.graphics().setDepth(5);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    updateKbMarker();
    setupKeyboard(s);
    var cv = s.game.canvas;
    if (cv) { cv.setAttribute("tabindex", "0"); cv.setAttribute("aria-label", "Memory match board. Arrow keys choose a card, Enter flips it."); }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // Cool ocean palette backdrop (keeps the same farm layout, recolored).
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xCAF0F8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(770, 110, 55);
    g.fillStyle(0x90E0EF, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn (recolored boathouse in ocean tones)
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x277DA1, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xEAF6FB, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xEAF6FB, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence (deep-sea posts)
    g.lineStyle(8, 0x277DA1, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // bubbles / sea flowers
    var cols = [0x4EA8DE, 0x48CAE4, 0x90E0EF, 0x00B4D8];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x277DA1, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // soft bubbles rising (static, gentle)
    g.fillStyle(0xffffff, 0.7);
    for (var b = 0; b < 14; b++) {
      g.fillCircle(40 + ((b * 67) % 820), 200 + ((b * 53) % 240), 4 + (b % 3));
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22));
    hudArcade = scene.add.text(24, 114, "Level 1  •  Score 0  •  Combo x0", textStyle(20, "#277DA1"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#102A43")).setOrigin(1, 0.5);
    // Gentle pairs progress bar (fills up, never drains as punishment).
    progressBar = scene.add.graphics();
    progressBar.fillStyle(0xffffff, 1); progressBar.fillRoundedRect(W - 224, 84, 200, 16, 8);
    progressBar.lineStyle(2, 0x4EA8DE, 1); progressBar.strokeRoundedRect(W - 224, 84, 200, 16, 8);
    progressFill = scene.add.graphics();
    drawProgress();
    var btn = scene.add.container(W - 110, 128);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); announce("Board restarted. Level " + level + ", score " + score + "."); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the 6 animal pairs! Arrows + Enter work too.", textStyle(20, "#277DA1")).setOrigin(0.5);
  }

  function drawProgress() {
    if (!progressFill) { return; }
    progressFill.clear();
    var frac = matches / 6;
    if (frac > 0) {
      progressFill.fillStyle(0x4EA8DE, 1);
      progressFill.fillRoundedRect(W - 222, 86, Math.max(12, 196 * frac), 12, 6);
    }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function updateArcadeHud() {
    if (hudArcade) { hudArcade.setText("Level " + level + "  •  Score " + score + "  •  Combo x" + streak); }
  }

  function popupText(scene, x, y, msg) {
    var t = scene.add.text(x, y, msg, textStyle(26, "#277DA1")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    kbIndex = 0;
    updateKbMarker();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0x90E0EF, 0xADE8F4, 0xEAF6FB, 0x48CAE4, 0xBDE0FE];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) {
      firstPick = card;
      hudMsg.setText("One more!");
      announce("First card: " + card.data.name + ". Pick one more.");
      return;
    }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        // Gentle arcade bounce (no flashing).
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        streak++;
        if (streak > bestCombo) { bestCombo = streak; }
        var gained = 100 + ((streak - 1) * 20) + ((level - 1) * 25);
        score += gained;
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        updateArcadeHud();
        drawProgress();
        var cheer = matches === 6 ? "You did it!" : (streak >= 2 ? "Combo x" + streak + "! +" + gained + " \u{1F389}" : "Yay! A pair! +" + gained + " \u{1F389}");
        hudMsg.setText(cheer);
        announce(cheer + " Pairs " + matches + " of 6. Score " + score + ".");
        popupText(scene, card.view.x, card.view.y - 70, "+" + gained);
        lockBoard = false;
        updateKbMarker();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      // No penalty: score stays, streak gently restarts, message stays kind.
      streak = 0;
      updateArcadeHud();
      hudMsg.setText("Try again! \u{1F340}");
      announce("Not a pair. " + a.data.name + " and " + card.data.name + ". Try again.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateKbMarker(); });
      }, 700);
    }
  }

  function beginPlay(scene, msg) {
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText(msg || "Tap a card! Arrows + Enter work too.");
    announce(hudMsg.text);
    updateKbMarker();
    var cv = scene.game.canvas;
    if (cv && cv.focus) { try { cv.focus({ preventScroll: true }); } catch (e) { cv.focus(); } }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Flip the cards and find\nall 6 animal pairs!\nPairs earn points. Back-to-back pairs build a combo!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 40, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 90, 260, 70, 35);
    var btnTx = scene.add.text(0, 125, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 90, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { beginPlay(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} Level Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 60, 280, 70, 35);
    var btnTx = scene.add.text(0, 95, "\u25B6 Next Level", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { nextLevel(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var levelBonus = 50 * level;
    score += levelBonus;
    updateArcadeHud();
    endTitle.setText("\u{1F389} Level " + level + " Clear! \u{1F389}");
    endDetail.setText("All 6 pairs found!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nLevel bonus +" + levelBonus + "  •  Score " + score + "\nBest combo x" + bestCombo);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Level " + level + " clear! \u{1F389}");
    announce("Level " + level + " clear. Score " + score + ". Press Enter for next level.");
    // Gentle drifting celebration (slow fall, no flashing).
    for (var i = 0; i < 28; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "26px" }).setDepth(30).setAlpha(0.95);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1600, 2600), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    // Kind restart: score and level carry on, only this board resets.
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudMsg.setText("Tap a card! Arrows + Enter work too.");
    updateArcadeHud(); drawProgress();
    announce("Board restarted. Level " + level + ", score " + score + ".");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function nextLevel(scene) {
    level++;
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudMsg.setText("Level " + level + "! Tap a card!");
    updateArcadeHud(); drawProgress();
    announce("Level " + level + ". Score " + score + ". Find all 6 pairs.");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function updateKbMarker() {
    if (!kbMarker) { return; }
    kbMarker.clear();
    if (!started || !cards.length) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    var card = cards[kbIndex];
    if (!card || card.matched) {
      var n;
      for (n = 0; n < cards.length; n++) { if (!cards[n].matched) { break; } }
      if (n < cards.length) { kbIndex = n; card = cards[kbIndex]; } else { return; }
    }
    var v = card.view;
    kbMarker.lineStyle(4, 0x102A43, 1);
    kbMarker.strokeRoundedRect(v.x - 96, v.y - 73, 192, 146, 24);
  }

  function setupKeyboard(scene) {
    document.addEventListener("keydown", function (e) {
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") { return; }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "ArrowDown") {
        if (!started || lockBoard || !cards.length) { return; }
        if ((startOverlay && startOverlay.visible) || (endOverlay && endOverlay.visible)) { return; }
        e.preventDefault();
        var cols = 4;
        if (e.key === "ArrowRight") { kbIndex = (kbIndex + 1) % cards.length; }
        if (e.key === "ArrowLeft") { kbIndex = (kbIndex - 1 + cards.length) % cards.length; }
        if (e.key === "ArrowDown") { kbIndex = (kbIndex + cols) % cards.length; }
        if (e.key === "ArrowUp") { kbIndex = (kbIndex - cols + cards.length) % cards.length; }
        updateKbMarker();
        if (cards[kbIndex]) { announce("Selected " + (kbIndex + 1) + " of " + cards.length + (cards[kbIndex].matched ? ", already paired." : ".")); }
      } else if (e.key === "Enter" || e.key === " ") {
        if (startOverlay && startOverlay.visible) { e.preventDefault(); beginPlay(scene); }
        else if (endOverlay && endOverlay.visible) { e.preventDefault(); nextLevel(scene); }
        else if (cards[kbIndex]) { e.preventDefault(); onCard(scene, cards[kbIndex]); }
      } else if (e.key === "r" || e.key === "R") {
        e.preventDefault(); restart(scene);
      }
    });
    if (scene.game.canvas) {
      scene.game.canvas.addEventListener("pointerdown", function () {
        if (scene.game.canvas.focus) { scene.game.canvas.focus({ preventScroll: true }); }
      });
    }
  }

  function update() {}
})();
</script>
</body>
</html>
