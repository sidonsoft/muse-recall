<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var hudScore2, hudTimer, timerBarBg, timerBar, hudCombo;
  var TIME_START = 75, TIME_BONUS = 4, TIME_PENALTY = 2, TIME_MAX = 99;
  var timeLeft = TIME_START, score = 0, combo = 0, bestCombo = 0, gameOver = false;
  var cursorIndex = 0, cursorBox = null, lastTickSec = -1;
  var audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeCursor(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function beep(freq, dur, type, delay, vol) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (!audioCtx || audioCtx.state === "suspended") { audioCtx.resume(); }
      var t0 = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol || 0.06, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.12));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + (dur || 0.12) + 0.02);
    } catch (e) {}
  }
  function sfxFlip() { beep(520, 0.07, "square", 0, 0.04); }
  function sfxMatch(c) { beep(523 + Math.min(c, 6) * 80, 0.12, "square", 0, 0.07); beep(784 + Math.min(c, 6) * 80, 0.14, "square", 0.08, 0.07); }
  function sfxMiss() { beep(180, 0.18, "sawtooth", 0, 0.06); }
  function sfxTick() { beep(880, 0.06, "square", 0, 0.05); }
  function sfxWin() { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.16, "square", i * 0.11, 0.07); }); }
  function sfxLose() { [400, 320, 240, 160].forEach(function (f, i) { beep(f, 0.2, "sawtooth", i * 0.13, 0.06); }); }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20));
    hudScore2 = scene.add.text(24, 110, "Score: 0", textStyle(20, "#1d6f2b"));
    hudTimer = scene.add.text(W - 24, 16, "\u23F1 75s", textStyle(26, "#7a4a2b")).setOrigin(1, 0);
    timerBarBg = scene.add.graphics();
    timerBarBg.fillStyle(0x000000, 0.15); timerBarBg.fillRoundedRect(W - 244, 50, 220, 14, 7);
    timerBar = scene.add.graphics();
    drawTimerBar();
    hudCombo = scene.add.text(W / 2, 186, "", textStyle(22, "#d35400")).setOrigin(0.5);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 166, "Beat the clock! Match = +4s, miss = -2s", textStyle(20, "#8a6a4a")).setOrigin(0.5);
  }

  function drawTimerBar() {
    if (!timerBar) { return; }
    timerBar.clear();
    var frac = Math.max(0, Math.min(1, timeLeft / TIME_START));
    var color = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xffb703 : 0xe63946);
    timerBar.fillStyle(color, 1);
    timerBar.fillRoundedRect(W - 244, 50, Math.max(14, 220 * frac), 14, 7);
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudScore2.setText("Score: " + score);
    hudTimer.setText("\u23F1 " + Math.ceil(Math.max(0, timeLeft)) + "s");
    if (combo >= 2) { hudCombo.setText("\u{1F525} COMBO x" + combo); }
    else { hudCombo.setText(""); }
    drawTimerBar();
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    cursorIndex = 0;
    updateCursor();
  }

  function makeCursor(scene) {
    cursorBox = scene.add.graphics().setDepth(5);
    updateCursor();
  }

  function updateCursor() {
    if (!cursorBox || !cards.length) { return; }
    cursorBox.clear();
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[cursorIndex];
    if (!card) { return; }
    cursorBox.lineStyle(5, 0xffb703, 1);
    cursorBox.strokeRoundedRect(card.view.x - 100, card.view.y - 77, 200, 154, 24);
  }

  function moveCursor(dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(cursorIndex / cols), c = cursorIndex % cols;
    c = (c + dx + cols) % cols;
    r = (r + dy + 3) % 3;
    cursorIndex = r * cols + c;
    updateCursor();
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-ENTER", function () { onConfirmKey(scene); });
    kb.on("keydown-SPACE", function () { onConfirmKey(scene); });
    kb.on("keydown-LEFT", function () { moveCursor(-1, 0); });
    kb.on("keydown-A", function () { moveCursor(-1, 0); });
    kb.on("keydown-RIGHT", function () { moveCursor(1, 0); });
    kb.on("keydown-D", function () { moveCursor(1, 0); });
    kb.on("keydown-UP", function () { moveCursor(0, -1); });
    kb.on("keydown-W", function () { moveCursor(0, -1); });
    kb.on("keydown-DOWN", function () { moveCursor(0, 1); });
    kb.on("keydown-S", function () { moveCursor(0, 1); });
    kb.on("keydown-R", function () {
      if (started && (!startOverlay || !startOverlay.visible)) { restart(scene); }
    });
  }

  function onConfirmKey(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    if (cards[cursorIndex]) { onCard(scene, cards[cursorIndex]); }
  }

  function startGame(scene) {
    started = true; lockBoard = false; gameOver = false;
    timeLeft = TIME_START; lastTickSec = -1;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card! Arrows + Enter work too!");
    updateCursor();
  }

  function floatText(scene, x, y, msg, color, size) {
    var t = scene.add.text(x, y, msg, textStyle(size || 28, color || "#1d6f2b")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y, n) {
    for (var i = 0; i < (n || 10); i++) {
      var p = scene.add.text(x, y, ["\u2B50", "\u{1F389}", "\u2728", "\u{1F33B}"][i % 4], { fontSize: "24px" }).setDepth(14);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-70, 40), alpha: 0, scale: 0.4, duration: Phaser.Math.Between(450, 800), ease: "Cubic.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    cursorIndex = cards.indexOf(card);
    updateCursor();
    flip(card, true);
    sfxFlip();
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      combo++;
      if (combo > bestCombo) { bestCombo = combo; }
      refreshHud();
      setTimeout(function () {
        a.matched = card.matched = true;
        var pts = 100 + (combo - 1) * 50 + Math.max(0, Math.ceil(timeLeft / 10)) * 5;
        score += pts;
        timeLeft = Math.min(TIME_MAX, timeLeft + TIME_BONUS);
        matches++;
        refreshHud();
        sfxMatch(combo);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        scene.tweens.add({ targets: a.view, angle: { from: 0, to: 360 }, duration: 450 });
        burst(scene, card.view.x, card.view.y, 10 + combo * 2);
        floatText(scene, card.view.x, card.view.y - 60, "+" + pts + (combo >= 2 ? "  x" + combo : ""), "#1d6f2b", combo >= 3 ? 32 : 28);
        hudMsg.setText(matches === 6 ? "You did it!" : (combo >= 3 ? "\u{1F525} Hot streak x" + combo + "!" : "Yay! +" + pts + " \u{1F389}"));
        lockBoard = false;
        updateCursor();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      timeLeft = Math.max(0, timeLeft - TIME_PENALTY);
      refreshHud();
      sfxMiss();
      hudMsg.setText("Miss! -" + TIME_PENALTY + "s \u{1F340}");
      try { scene.cameras.main.shake(140, 0.006); } catch (e) {}
      setTimeout(function () {
        if (gameOver) { return; }
        flip(a, false); flip(card, false, function () { lockBoard = false; updateCursor(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{26A1}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "ARCADE: 75s on the clock!\nPairs +4s, miss -2s, streaks = big pts!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    gameOver = true; lockBoard = true;
    var timeBonus = Math.ceil(Math.max(0, timeLeft)) * 10;
    score += timeBonus;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs cleared!\nScore: " + score + " (time +" + timeBonus + ")\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nBest combo: x" + Math.max(1, bestCombo));
    endOverlay.setVisible(true);
    sfxWin();
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389} Press R / Enter to play again!");
    refreshHud();
    if (cursorBox) { cursorBox.clear(); }
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F525}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    gameOver = true; lockBoard = true; firstPick = null;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  Moves: " + moves + "\nBest combo: x" + Math.max(1, bestCombo) + "\nPress R / Enter to retry!");
    endOverlay.setVisible(true);
    sfxLose();
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u{1F622} Try again!");
    refreshHud();
    if (cursorBox) { cursorBox.clear(); }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    score = 0; combo = 0; bestCombo = 0; gameOver = false;
    timeLeft = TIME_START; lastTickSec = -1;
    refreshHud();
    hudMsg.setText("Tap a card! Arrows + Enter work too!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var scene = this;
    timeLeft -= (delta || 16) / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      refreshHud();
      showLose(scene);
      return;
    }
    var sec = Math.ceil(timeLeft);
    if (sec <= 10 && sec !== lastTickSec) { lastTickSec = sec; sfxTick(); }
    hudTimer.setText("\u23F1 " + sec + "s");
    drawTimerBar();
    if (sec <= 10) {
      var pulse = 1 + 0.06 * Math.sin(time * 0.02);
      hudTimer.setScale(pulse);
      hudTimer.setColor("#c1121f");
    } else {
      hudTimer.setScale(1);
      hudTimer.setColor("#7a4a2b");
    }
  }
})();
</script>
</body>
</html>
