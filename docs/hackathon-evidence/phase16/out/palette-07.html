<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #hud-help{text-align:center;font-size:13px;color:#102A43;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;margin:6px 0 0}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to move, Enter to flip a card, R to restart."></div>
<p id="hud-help">Arrows move &middot; Enter flips &middot; R restarts &middot; N next round</p>
<div id="status" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false, over = false, won = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, round = 1;
  var timeLeft = 60, lastTick = 0, focusIdx = 0;
  var hudMoves, hudScore, hudMsg, hudTime, hudPts, hudRound, endOverlay, endTitle, endDetail, startOverlay, endNextBg, endNextTx;
  var focusRing, audioCtx = null;

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }
  function beep(freq, dur, type, vol, when) {
    try {
      if (!audioCtx) { return; }
      var t = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.12));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + (dur || 0.12) + 0.02);
    } catch (e) {}
  }
  function ensureAudio() {
    try {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) {}
  }
  function sndFlip() { beep(520, 0.09, "triangle", 0.1); }
  function sndMatch() { beep(660, 0.1, "square", 0.07); beep(880, 0.14, "square", 0.07, 0.09); }
  function sndMiss() { beep(180, 0.18, "sawtooth", 0.06); }
  function sndWin() { beep(523, 0.12, "square", 0.08); beep(659, 0.12, "square", 0.08, 0.12); beep(784, 0.2, "square", 0.08, 0.24); }
  function sndTick() { beep(990, 0.06, "square", 0.05); }
  function roundTime(r) { return Math.max(40, 65 - (r - 1) * 5); }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbfe3f2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22));
    hudPts = scene.add.text(24, 114, "Score: 0", textStyle(22, "#0b6fa4"));
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    hudTime = scene.add.text(W - 24, 80, "Time: 60", textStyle(26)).setOrigin(1, 0.5);
    hudRound = scene.add.text(W - 24, 108, "Round 1  Combo x1", textStyle(18, "#0b6fa4")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 140);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -24, 172, 48, 24);
    var label = scene.add.text(0, 0, "\u21BB Restart (R)", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -24, 172, 48), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 170, "Match fast! +time bonus, streaks = big points!", textStyle(20, "#33566e")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { ensureAudio(); focusIdx = cards.indexOf(card); drawFocus(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function floatPts(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(26, color || "#0b6fa4")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }
  function drawFocus() {
    if (!focusRing || !cards.length) { return; }
    var c = cards[focusIdx];
    if (!c) { return; }
    focusRing.setVisible(started && !over && !c.matched);
    focusRing.x = c.view.x; focusRing.y = c.view.y;
  }
  function onCard(scene, card) {
    if (!started || over || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    sndFlip();
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var pts = 100 * streak + Math.ceil(timeLeft);
        score += pts;
        timeLeft = Math.min(roundTime(round), timeLeft + 4);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        try { scene.cameras.main.flash(120, 255, 255, 255); } catch (e) {}
        sndMatch();
        matches++;
        floatPts(scene, card.view.x, card.view.y - 70, "+" + pts + (streak > 1 ? "  x" + streak + "!" : ""));
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPts.setText("Score: " + score);
        hudRound.setText("Round " + round + "  Combo x" + Math.max(1, streak));
        hudMsg.setText(streak >= 3 ? "ON FIRE! x" + streak + " \u{1F525}" : (matches === 6 ? "You did it!" : "Yay! +4s \u{1F389}"));
        announce("Pair found! Score " + score + ". " + matches + " of 6 pairs.");
        drawFocus();
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      score = Math.max(0, score - 25);
      hudPts.setText("Score: " + score);
      hudRound.setText("Round " + round + "  Combo x1");
      hudMsg.setText("Miss! Combo lost \u{1F340}");
      try { scene.cameras.main.shake(150, 0.004); } catch (e) {}
      sndMiss();
      announce("No match. Combo reset. Score " + score + ".");
      var delay = Math.max(350, 720 - matches * 50);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, delay);
    }
  }

  function startGame(scene) {
    ensureAudio();
    started = true; over = false; won = false; lockBoard = false;
    timeLeft = roundTime(round);
    lastTick = Math.ceil(timeLeft);
    hudTime.setText("Time: " + lastTick).setColor("#102A43");
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("GO! Beat the clock!");
    announce("Round " + round + " started. " + Math.ceil(timeLeft) + " seconds. Find all 6 pairs.");
    drawFocus();
  }
  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -125, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "ARCADE: beat the clock!\n6 pairs, +4s per match, streaks score big!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 25, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start (Enter)", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-260, 45, 240, 64, 32);
    var btnTx = scene.add.text(-140, 77, "\u21BB Replay (R)", textStyle(22, "#ffffff")).setOrigin(0.5);
    endNextBg = scene.add.graphics();
    endNextBg.fillStyle(0x102A43, 1); endNextBg.fillRoundedRect(20, 45, 240, 64, 32);
    endNextTx = scene.add.text(140, 77, "Next Round (N) \u25B6", textStyle(22, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, endNextBg, endNextTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-260, 45, 240, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    endNextBg.setInteractive(new Phaser.Geom.Rectangle(20, 45, 240, 64), Phaser.Geom.Rectangle.Contains);
    endNextBg.on("pointerdown", function () { ensureAudio(); nextRound(scene); });
  }

  function showWin(scene) {
    won = true; over = true; lockBoard = true;
    sndWin();
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var timeBonus = Math.ceil(timeLeft) * 5;
    score += timeBonus;
    hudPts.setText("Score: " + score);
    endTitle.setText("\u{1F389} Round " + round + " Clear! \u{1F389}");
    endDetail.setText("6 pairs in " + moves + " moves  " + "\u2B50".repeat(stars) + "\nTime bonus +" + timeBonus + "  Score: " + score + "\nBest streak x" + Math.max(1, bestStreak));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Round clear! N = next!");
    announce("Round " + round + " clear! Score " + score + ". Press N for next round.");
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F525}", "\u{1F404}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    over = true; won = false; lockBoard = true;
    beep(220, 0.3, "sawtooth", 0.08); beep(147, 0.45, "sawtooth", 0.08, 0.25);
    endTitle.setText("\u23F0 Time Up!");
    endDetail.setText("You found " + matches + " / 6 pairs\nScore: " + score + "  Round " + round + "\nReplay (R) or Next Round (N)?");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time up! Try again!");
    announce("Time up. You found " + matches + " of 6 pairs. Score " + score + ".");
  }

  function resetBoard(scene, keepScore) {
    if (!keepScore) { score = 0; streak = 0; bestStreak = 0; round = 1; }
    moves = 0; matches = 0; firstPick = null; streak = keepScore ? 0 : streak;
    lockBoard = false; started = true; over = false; won = false;
    timeLeft = roundTime(round);
    lastTick = Math.ceil(timeLeft);
    focusIdx = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: " + score);
    hudTime.setText("Time: " + Math.ceil(timeLeft)).setColor("#102A43");
    hudRound.setText("Round " + round + "  Combo x1");
    hudMsg.setText("GO! Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    drawFocus();
  }

  function restart(scene) {
    resetBoard(scene, false);
    announce("Game restarted. Round 1, score 0.");
  }

  function nextRound(scene) {
    round++;
    score += 0;
    moves = 0; matches = 0; firstPick = null; streak = 0;
    lockBoard = false; started = true; over = false; won = false;
    timeLeft = roundTime(round);
    lastTick = Math.ceil(timeLeft);
    focusIdx = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: " + score);
    hudTime.setText("Time: " + Math.ceil(timeLeft)).setColor("#102A43");
    hudRound.setText("Round " + round + "  Combo x1");
    hudMsg.setText("Round " + round + "! Faster clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    drawFocus();
    announce("Round " + round + " started with " + Math.ceil(timeLeft) + " seconds. Score carried: " + score + ".");
  }

  function wireKeyboard(s) {
    focusRing = s.add.graphics().setDepth(14).setVisible(false);
    focusRing.lineStyle(5, 0x102A43, 1);
    focusRing.strokeRoundedRect(-100, -75, 200, 150, 24);
    drawFocus();
    function moveFocus(dx, dy) {
      if (!cards.length) { return; }
      var cols = 4;
      var n = cards.length;
      focusIdx = ((focusIdx + dx + dy * cols) % n + n) % n;
      drawFocus();
    }
    function pressFocused() {
      var c = cards[focusIdx];
      if (c) { onCard(s, c); }
    }
    if (s.input && s.input.keyboard) {
      s.input.keyboard.on("keydown", function (e) {
        ensureAudio();
        var k = e.key;
        if (!started || startOverlay.visible) {
          if (k === "Enter" || k === " " || k === "s" || k === "S") { e.preventDefault(); startGame(s); }
          return;
        }
        if (endOverlay.visible) {
          if (k === "n" || k === "N" || k === "Enter") { e.preventDefault(); nextRound(s); }
          else if (k === "r" || k === "R") { e.preventDefault(); restart(s); }
          return;
        }
        if (k === "ArrowLeft") { e.preventDefault(); moveFocus(-1, 0); }
        else if (k === "ArrowRight") { e.preventDefault(); moveFocus(1, 0); }
        else if (k === "ArrowUp") { e.preventDefault(); moveFocus(0, -1); }
        else if (k === "ArrowDown") { e.preventDefault(); moveFocus(0, 1); }
        else if (k === "Enter" || k === " ") { e.preventDefault(); pressFocused(); }
        else if (k === "r" || k === "R") { restart(s); }
        else if (k === "n" || k === "N") { nextRound(s); }
      });
    }
    document.addEventListener("keydown", function (e) {
      var tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") { return; }
      if (e.key === " " && e.target === document.body) { e.preventDefault(); }
    });
    var canvas = s.game && s.game.canvas;
    if (canvas) {
      canvas.setAttribute("tabindex", "0");
      canvas.setAttribute("role", "application");
      canvas.setAttribute("aria-label", "Memory cards. Arrow keys choose a card, Enter flips it, R restarts.");
    }
  }

  function update(time, delta) {
    if (!started || over || !startOverlay || startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      hudTime.setText("Time: 0").setColor("#c0392b");
      showLose(this);
      return;
    }
    var whole = Math.ceil(timeLeft);
    hudTime.setText("Time: " + whole);
    if (whole <= 10) {
      hudTime.setColor("#c0392b");
      hudMsg.setText("HURRY! " + whole + "s left!");
      if (whole < lastTick) { sndTick(); }
    } else {
      hudTime.setColor("#102A43");
    }
    lastTick = whole;
  }
})();
</script>
</body>
</html>
