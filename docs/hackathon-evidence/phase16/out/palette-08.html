<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" tabindex="0" role="application" aria-label="Farmyard match card game. Use arrow keys to move between cards, Enter to flip, R to restart."></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#dff3fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var ACCENT = 0x4EA8DE, DARK = "#102A43";
  var TIME_START = 60, MATCH_BONUS = 3, MISS_COST = 2;
  var cards = [], firstPick = null, lockBoard = true, started = false, gameOver = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, timeLeft = TIME_START;
  var hudMoves, hudScore, hudMsg, hudTime, hudPoints, hudCombo, endOverlay, endTitle, endDetail, startOverlay;
  var timeBar, timeBarBg, gameScene = null, focusIdx = 0, lastTickSec = -1;
  var audioCtx = null;
  var clouds = [];

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    bindKeys();
    setFocus(0);
  }

  function drawFarm(scene) {
    clouds = [];
    var g = scene.add.graphics();
    g.fillStyle(0xdff3fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbde0fe, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xcaf0f8, 1); g.fillRect(0, 470, W, 26);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.95);
    var c1 = scene.add.ellipse(180, 110, 150, 48, 0xffffff, 0.95);
    var c2 = scene.add.ellipse(250, 100, 120, 44, 0xffffff, 0.95);
    var c3 = scene.add.ellipse(560, 80, 140, 44, 0xffffff, 0.95);
    clouds = [c1, c2, c3];
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || DARK, fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 54, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 110, "Score: 0", textStyle(22));
    hudTime = scene.add.text(W - 24, 26, "\u23F1 " + TIME_START, textStyle(30)).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 62, "Tap a card!", textStyle(22)).setOrigin(1, 0.5);
    hudCombo = scene.add.text(W / 2, 118, "", textStyle(24, "#023e8a")).setOrigin(0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(ACCENT, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Beat the clock! +3s per pair, -2s per miss!", textStyle(20)).setOrigin(0.5);
    scene.add.text(W / 2, 672, "Arrows + Enter flip \u2022 R restart", textStyle(15, "#33566d")).setOrigin(0.5);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0xffffff, 0.9); timeBarBg.fillRoundedRect(24, 146, W - 48, 12, 6);
    timeBar = scene.add.graphics();
    drawTimeBar();
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    var frac = Math.max(0, timeLeft / TIME_START);
    var w = (W - 48) * frac;
    timeBar.clear();
    var col = frac > 0.5 ? ACCENT : (frac > 0.25 ? 0xffb703 : 0xe63946);
    timeBar.fillStyle(col, 1);
    if (w > 4) { timeBar.fillRoundedRect(24, 146, w, 12, 6); }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function setFocus(idx) {
    if (!cards.length) { return; }
    focusIdx = ((idx % cards.length) + cards.length) % cards.length;
    cards.forEach(function (c, i) {
      if (c.ring) { c.ring.setVisible(i === focusIdx && started && !gameOver); }
    });
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.lineStyle(4, ACCENT, 1); back.strokeRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xffc8dd, 0xc8e7ff, 0xd8f3d8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    var ring = scene.add.graphics();
    ring.lineStyle(5, ACCENT, 1); ring.strokeRoundedRect(-w / 2 - 5, -h / 2 - 5, w + 10, h + 10, 26);
    ring.setVisible(false);
    cont.add([showBack, face, ring]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, ring: ring, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () {
      ensureAudio();
      var idx = cards.indexOf(card);
      if (idx >= 0) { setFocus(idx); }
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { audioCtx = new AC(); }
      }
      if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { audioCtx = null; }
  }

  function tone(freq, dur, type, vol, delay) {
    if (!audioCtx) { return; }
    try {
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function sfx(name) {
    if (!audioCtx) { return; }
    if (name === "flip") { tone(520, 0.09, "triangle", 0.12, 0); }
    else if (name === "match") { tone(523, 0.12, "triangle", 0.16, 0); tone(659, 0.12, "triangle", 0.16, 0.09); tone(784, 0.18, "triangle", 0.16, 0.18); }
    else if (name === "miss") { tone(220, 0.18, "sawtooth", 0.08, 0); tone(165, 0.22, "sawtooth", 0.08, 0.1); }
    else if (name === "tick") { tone(880, 0.07, "square", 0.06, 0); }
    else if (name === "win") { tone(523, 0.14, "triangle", 0.16, 0); tone(659, 0.14, "triangle", 0.16, 0.12); tone(784, 0.14, "triangle", 0.16, 0.24); tone(1047, 0.3, "triangle", 0.18, 0.36); }
    else if (name === "lose") { tone(330, 0.2, "sawtooth", 0.09, 0); tone(262, 0.2, "sawtooth", 0.09, 0.18); tone(196, 0.4, "sawtooth", 0.09, 0.36); }
  }

  function floatText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(26, color || "#023e8a")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y, n) {
    for (var i = 0; i < (n || 8); i++) {
      var p = scene.add.text(x, y, ["\u2B50", "\u2728", "\u{1F389}", "\u{1F4A6}"][i % 4], { fontSize: "22px" }).setDepth(15);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-90, 40), alpha: 0, duration: Phaser.Math.Between(500, 900), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    ensureAudio();
    flip(card, true);
    sfx("flip");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (gameOver) { return; }
        a.matched = card.matched = true;
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        var gained = 100 + (streak - 1) * 50;
        score += gained;
        timeLeft = Math.min(TIME_START, timeLeft + MATCH_BONUS);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.1, yoyo: true, duration: 170 });
        scene.cameras.main.flash(90, 202, 240, 248);
        burst(scene, card.view.x, card.view.y, 8);
        floatText(scene, card.view.x, card.view.y - 60, "+" + gained, "#023e8a");
        sfx("match");
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPoints.setText("Score: " + score);
        if (streak >= 2) {
          hudCombo.setText("\u{1F525} Combo x" + streak + "!");
          scene.tweens.add({ targets: hudCombo, scale: { from: 1.35, to: 1 }, duration: 220, ease: "Back.easeOut" });
        } else { hudCombo.setText(""); }
        drawTimeBar(); refreshTime();
        hudMsg.setText(matches === 6 ? "You did it!" : "Pair! +" + MATCH_BONUS + "s \u{1F389}");
        announce("Pair found! " + matches + " of 6. Score " + score + ". Plus " + MATCH_BONUS + " seconds.");
        lockBoard = false;
        setFocus(cards.indexOf(card));
        if (matches === 6) { showWin(scene); }
      }, 320);
    } else {
      streak = 0;
      hudCombo.setText("");
      timeLeft = Math.max(0, timeLeft - MISS_COST);
      score = Math.max(0, score - 10);
      hudPoints.setText("Score: " + score);
      hudMsg.setText("Miss! -" + MISS_COST + "s \u{1F340}");
      announce("No match. Minus " + MISS_COST + " seconds.");
      scene.cameras.main.shake(140, 0.007);
      sfx("miss");
      drawTimeBar(); refreshTime();
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { if (!gameOver) { lockBoard = false; } });
      }, 650);
    }
  }

  function refreshTime() {
    hudTime.setText("\u23F1 " + Math.ceil(timeLeft));
    drawTimeBar();
  }

  function startGame(scene) {
    ensureAudio();
    started = true; gameOver = false; lockBoard = false;
    timeLeft = TIME_START; lastTickSec = -1;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    refreshTime();
    setFocus(focusIdx);
    announce("Go! Find all 6 pairs before the clock runs out.");
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -195, 620, 390, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-310, -195, 620, 390, 30);
    var title = scene.add.text(0, -128, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -58, "\u23F1 60 seconds on the clock!\nMatch fast for combos. +3s per pair, -2s per miss!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 22, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "42px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 72, 260, 70, 35);
    var btnTx = scene.add.text(0, 107, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 72, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -28, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 55, 260, 70, 35);
    var btnTx = scene.add.text(0, 90, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 55, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
  }

  function showWin(scene) {
    gameOver = true; lockBoard = true;
    var bonus = Math.ceil(timeLeft) * 10;
    score += bonus;
    hudPoints.setText("Score: " + score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs! Time bonus +" + bonus + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  \u2022  Best combo x" + Math.max(1, bestStreak));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    hudCombo.setText("");
    announce("You win! Score " + score + " in " + moves + " moves.");
    sfx("win");
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    gameOver = true; lockBoard = true;
    firstPick = null;
    setFocus(focusIdx);
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  \u2022  Best combo x" + Math.max(1, bestStreak) + "\nFaster pairs earn time back. Go again!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u{1F340}");
    hudCombo.setText("");
    announce("Time's up! You found " + matches + " of 6 pairs. Score " + score + ".");
    sfx("lose");
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeLeft = TIME_START; lastTickSec = -1; focusIdx = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: 0"); hudMsg.setText("Tap a card!");
    hudCombo.setText(""); refreshTime();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    setFocus(0);
    announce("New game. 60 seconds. Good luck!");
  }

  function bindKeys() {
    document.addEventListener("keydown", function (ev) {
      var s = gameScene;
      if (!s) { return; }
      var k = ev.key;
      if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown") {
        ev.preventDefault();
        ensureAudio();
        if (!started || gameOver) { return; }
        var d = (k === "ArrowLeft") ? -1 : (k === "ArrowRight") ? 1 : (k === "ArrowUp") ? -4 : 4;
        setFocus(focusIdx + d);
        var c = cards[focusIdx];
        if (c) { s.tweens.add({ targets: c.view, scale: { from: 1.06, to: 1 }, duration: 140 }); }
      } else if (k === "Enter" || k === " ") {
        ensureAudio();
        if (startOverlay && startOverlay.visible) { ev.preventDefault(); startGame(s); }
        else if (endOverlay && endOverlay.visible) { ev.preventDefault(); restart(s); }
        else if (started && !gameOver && cards[focusIdx]) { ev.preventDefault(); onCard(s, cards[focusIdx]); }
      } else if (k === "r" || k === "R") {
        ensureAudio();
        if (started) { restart(s); }
      }
    });
    var g = document.getElementById("game");
    if (g) {
      g.addEventListener("click", function () { ensureAudio(); });
    }
  }

  function update(time, delta) {
    var s = this;
    clouds.forEach(function (c, i) {
      c.x += (0.12 + i * 0.06) * (delta / 16.7);
      if (c.x - 90 > W) { c.x = -90; }
    });
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 5.5) {
      var sec = Math.ceil(Math.max(0, timeLeft));
      if (sec !== lastTickSec && sec > 0) {
        lastTickSec = sec;
        sfx("tick");
        s.tweens.add({ targets: hudTime, scale: { from: 1.3, to: 1 }, duration: 180 });
      }
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      refreshTime();
      showLose(s);
      return;
    }
    refreshTime();
  }
})();
</script>
</body>
