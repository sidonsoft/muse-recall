<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#dceef7;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match arcade memory game. Use arrow keys to choose a card and Enter to flip it. Press R to restart." tabindex="0"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, combo = 0, bestCombo = 0, timeLeft = 90, gameOver = false, timerEv = null;
  var cursor = 0, cursorGfx = null, keysUsed = false, audioCtx = null;
  var TIME_START = 90, MATCH_BONUS = 4, MISS_PENALTY = 3;
  var hudMoves, hudScore, hudMsg, hudPts, hudTime, hudCombo, endOverlay, endTitle, endDetail, startOverlay;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    setTime(s, TIME_START);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    try {
      var cv = s.game.canvas;
      if (cv) { cv.setAttribute("tabindex", "0"); cv.setAttribute("aria-label", "Farmyard Match arcade memory game. Arrow keys choose a card, Enter flips it, R restarts."); }
    } catch (e) {}
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xdceef7, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xa9d6e5, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x89c2d9, 1);
    for (var wv = 0; wv < 5; wv++) { g.fillEllipse(120 + wv * 170, 492, 150, 22); }
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
      o.stop(audioCtx.currentTime + (dur || 0.12));
    } catch (e) {}
  }

  function floatText(scene, x, y, msg, color, size) {
    var t = scene.add.text(x, y, msg, textStyle(size || 26, color || "#ffffff")).setOrigin(0.5).setDepth(15);
    t.setStroke("#102A43", 4);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(21));
    hudScore = scene.add.text(24, 76, "Pairs: 0 / 6", textStyle(21));
    hudPts = scene.add.text(24, 102, "Score: 0", textStyle(21));
    hudTime = scene.add.text(W / 2, 46, "\u23F1 90", textStyle(34)).setOrigin(0.5, 0);
    hudCombo = scene.add.text(W / 2, 88, "", textStyle(22, "#d90429")).setOrigin(0.5, 0);
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(22)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 108);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { beep(440, 0.08); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Beat the clock! Match = +time, miss = -time", textStyle(20, "#334E68")).setOrigin(0.5);
    scene.add.text(W - 24, 140, "Arrows+Enter / R", textStyle(16, "#334E68")).setOrigin(1, 0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    cursor = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (cursorGfx) { cursorGfx.destroy(); }
    cursorGfx = scene.add.graphics().setDepth(5);
    drawCursor();
  }

  function drawCursor() {
    if (!cursorGfx || !cards.length) { return; }
    cursorGfx.clear();
    if (!started || gameOver) { return; }
    var v = cards[cursor] && cards[cursor].view;
    if (!v) { return; }
    cursorGfx.lineStyle(keysUsed ? 6 : 3, keysUsed ? 0xFFB703 : 0xffffff, keysUsed ? 1 : 0.7);
    cursorGfx.strokeRoundedRect(v.x - 100, v.y - 77, 200, 154, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0xADE8F4, 0x90E0EF, 0xBDE0FE, 0xA2D2FF, 0xCDB4DB];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function setTime(scene, v) {
    timeLeft = Math.max(0, Math.min(99, Math.round(v)));
    hudTime.setText("\u23F1 " + timeLeft);
    hudTime.setColor(timeLeft <= 10 ? "#d90429" : "#102A43");
  }

  function startTimer(scene) {
    if (timerEv) { timerEv.remove(); timerEv = null; }
    timerEv = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started || gameOver) { return; }
      if (endOverlay.visible || (startOverlay && startOverlay.visible)) { return; }
      setTime(scene, timeLeft - 1);
      if (timeLeft <= 10 && timeLeft > 0) { beep(880, 0.07, "square", 0.04); }
      if (timeLeft <= 0) { showGameOver(scene); }
    }});
  }

  function burst(scene, x, y, n) {
    var bits = ["\u2B50", "\u{1F389}", "\u2728", "\u{1F33B}"];
    for (var i = 0; i < (n || 10); i++) {
      var p = scene.add.text(x, y, bits[i % bits.length], { fontSize: "26px" }).setOrigin(0.5).setDepth(14);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-110, 110), y: y + Phaser.Math.Between(-90, 60),
        alpha: 0, duration: Phaser.Math.Between(500, 900), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    if (endOverlay.visible) { return; }
    beep(520, 0.07);
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        matches++;
        combo++;
        if (combo > bestCombo) { bestCombo = combo; }
        var gained = 100 + (combo - 1) * 50 + Math.min(timeLeft, 30);
        score += gained;
        setTime(scene, timeLeft + MATCH_BONUS);
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPts.setText("Score: " + score);
        hudCombo.setText(combo >= 2 ? "COMBO x" + combo + " \u{1F525}" : "");
        floatText(scene, card.view.x, card.view.y - 70, "+" + gained, "#ffb703", 30);
        burst(scene, card.view.x, card.view.y, 8 + combo * 2);
        beep(660 + combo * 80, 0.14, "square", 0.07);
        setTimeout(function () { beep(880 + combo * 80, 0.16, "square", 0.07); }, 110);
        hudMsg.setText(matches === 6 ? "You did it!" : "Yay! +" + gained + " \u{1F389}");
        lockBoard = false;
        drawCursor();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      hudCombo.setText("");
      score = Math.max(0, score - 10);
      setTime(scene, timeLeft - MISS_PENALTY);
      hudPts.setText("Score: " + score);
      hudMsg.setText("Miss! -" + MISS_PENALTY + "s \u{1F340}");
      beep(180, 0.2, "sawtooth", 0.06);
      try { scene.cameras.main.shake(150, 0.008); } catch (e) {}
      floatText(scene, card.view.x, card.view.y - 70, "-" + MISS_PENALTY + "s", "#d90429", 28);
      setTimeout(function () {
        if (timeLeft <= 0) {
          flip(a, false); flip(card, false);
          lockBoard = false;
          showGameOver(scene);
          return;
        }
        flip(a, false); flip(card, false, function () { lockBoard = false; drawCursor(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -200, 600, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -200, 600, 400, 30);
    var title = scene.add.text(0, -132, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -58, "ARCADE: 90 seconds on the clock!\nMatch = points + 4s \u2022 Miss = -10 pts, -3s\nCombos multiply your score!", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 28, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    started = true; gameOver = false; lockBoard = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Go! Beat the clock!");
    beep(660, 0.1); setTimeout(function () { beep(880, 0.14); }, 110);
    startTimer(scene);
    drawCursor();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -20, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 60, 260, 70, 35);
    var btnTx = scene.add.text(0, 95, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 60, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { beep(440, 0.08); restart(scene); });
  }

  function showWin(scene) {
    gameOver = true;
    if (timerEv) { timerEv.remove(); timerEv = null; }
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var timeBonus = timeLeft * 10;
    score += timeBonus;
    hudPts.setText("Score: " + score);
    endTitle.setText("\u{1F389} ARCADE CLEAR! \u{1F389}");
    endDetail.setText("All 6 pairs with " + timeLeft + "s left!\nTime bonus +" + timeBonus +
      "\nScore: " + score + " \u2022 Moves: " + moves +
      "\nBest combo x" + Math.max(bestCombo, 1) + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    try { endOverlay.setScale(0.8); } catch (e) {}
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    hudCombo.setText("");
    beep(523, 0.12); setTimeout(function () { beep(659, 0.12); }, 120);
    setTimeout(function () { beep(784, 0.12); }, 240); setTimeout(function () { beep(1047, 0.25); }, 360);
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
    drawCursor();
  }

  function showGameOver(scene) {
    if (gameOver) { return; }
    gameOver = true; lockBoard = true; firstPick = null;
    if (timerEv) { timerEv.remove(); timerEv = null; }
    setTime(scene, 0);
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + " \u2022 Moves: " + moves +
      "\nBest combo x" + Math.max(bestCombo, 0) + "\nPress R or Play Again!");
    endOverlay.setVisible(true);
    try { endOverlay.setScale(0.8); } catch (e) {}
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again!");
    beep(220, 0.25, "sawtooth", 0.07); setTimeout(function () { beep(147, 0.4, "sawtooth", 0.07); }, 200);
    try { scene.cameras.main.shake(250, 0.012); } catch (e) {}
    drawCursor();
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: 0"); hudCombo.setText("");
    setTime(scene, TIME_START);
    hudMsg.setText("Go! Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    drawCursor();
  }

  function moveCursor(scene, dx, dy) {
    if (!started || gameOver) { return; }
    keysUsed = true;
    var cols = 4;
    var r = Math.floor(cursor / cols), c = cursor % cols;
    r = (r + dy + 3) % 3; c = (c + dx + cols) % cols;
    cursor = r * cols + c;
    beep(300, 0.05, "square", 0.03);
    drawCursor();
  }

  function pressCursor(scene) {
    keysUsed = true;
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay.visible) { restart(scene); return; }
    if (!started || gameOver) { return; }
    if (cards[cursor]) { onCard(scene, cards[cursor]); }
    drawCursor();
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    kb.on("keydown-LEFT", function () { moveCursor(scene, -1, 0); });
    kb.on("keydown-A", function () { moveCursor(scene, -1, 0); });
    kb.on("keydown-RIGHT", function () { moveCursor(scene, 1, 0); });
    kb.on("keydown-D", function () { moveCursor(scene, 1, 0); });
    kb.on("keydown-UP", function () { moveCursor(scene, 0, -1); });
    kb.on("keydown-W", function () { moveCursor(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveCursor(scene, 0, 1); });
    kb.on("keydown-S", function () {
      if (startOverlay && startOverlay.visible) { pressCursor(scene); }
      else { moveCursor(scene, 0, 1); }
    });
    kb.on("keydown-ENTER", function () { pressCursor(scene); });
    kb.on("keydown-SPACE", function () { pressCursor(scene); });
    kb.on("keydown-R", function () {
      keysUsed = true;
      if (started || (startOverlay && startOverlay.visible)) { restart(scene); }
    });
  }

  function update() {
    if (hudTime && started && !gameOver && timeLeft <= 10 && !(startOverlay && startOverlay.visible) && !endOverlay.visible) {
      var s = 1 + Math.sin(Date.now() / 150) * 0.06;
      hudTime.setScale(s);
    } else if (hudTime) { hudTime.setScale(1); }
  }
})();
</script>
