<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0;
  var TIME_LIMIT = 60, timeLeft = TIME_LIMIT, gameOver = false;
  var hudMoves, hudScore, hudMsg, hudTime, hudPoints, endOverlay, endTitle, endDetail, startOverlay;
  var focusIdx = 0, focusRing = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0x8ecae6, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x4EA8DE, 0.35); g.fillRect(0, 470, W, 26);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 88, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 118, "Score: 0", textStyle(22));
    hudTime = scene.add.text(W - 24, 30, "⏱ 60", textStyle(30)).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 66, "Tap a card!", textStyle(22)).setOrigin(1, 0);
    var btn = scene.add.container(W - 110, 118);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match fast! Miss = -3s. Streaks earn bonus!", textStyle(20)).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (!focusRing) {
      focusRing = scene.add.graphics().setDepth(5);
    }
    drawFocus();
  }

  function drawFocus() {
    if (!focusRing || !cards.length) { return; }
    focusRing.clear();
    if (!started || gameOver) { return; }
    var card = cards[focusIdx % cards.length];
    if (!card || card.matched) { return; }
    var w = 185, h = 140;
    focusRing.lineStyle(5, 0x102A43, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xbde0fe, 0xcaf0f8, 0xade8f4, 0x90e0ef, 0x48cae4, 0x0096c7];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function addScore(scene, x, y, text, color) {
    var p = scene.add.text(x, y, text, textStyle(26, color || "#102A43")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: p, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { p.destroy(); } });
  }

  function burst(scene, x, y) {
    for (var i = 0; i < 10; i++) {
      var dot = scene.add.circle(x, y, 5, [0x4EA8DE, 0x90e0ef, 0xffd166, 0xffffff][i % 4]).setDepth(15);
      var ang = (Math.PI * 2 * i) / 10;
      scene.tweens.add({ targets: dot, x: x + Math.cos(ang) * 70, y: y + Math.sin(ang) * 70,
        alpha: 0, scale: 0.3, duration: 500, ease: "Cubic.easeOut",
        onComplete: (function (d) { return function () { d.destroy(); }; })(dot) });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    focusIdx = cards.indexOf(card);
    drawFocus();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more… combo x" + (streak + 1)); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        burst(scene, card.view.x, card.view.y);
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 50 + Math.ceil(timeLeft / 10) * 5;
        score += gained;
        timeLeft = Math.min(TIME_LIMIT, timeLeft + 2);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPoints.setText("Score: " + score);
        hudMsg.setText(matches === 6 ? "Amazing finish!" : "Combo x" + streak + "! +" + gained);
        addScore(scene, card.view.x, card.view.y - 60, "+" + gained, "#0a7d2c");
        drawFocus();
        lockBoard = false;
        if (matches === 6) { showEnd(scene, true); }
      }, 350);
    } else {
      streak = 0;
      score = Math.max(0, score - 10);
      timeLeft = Math.max(0, timeLeft - 3);
      hudPoints.setText("Score: " + score);
      hudMsg.setText("Miss! -3s \u{1F340}");
      addScore(scene, card.view.x, card.view.y - 60, "-3s", "#c1121f");
      if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(150, 0.008); }
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 700);
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false; gameOver = false;
    timeLeft = TIME_LIMIT;
    startOverlay.setVisible(false);
    hudMsg.setText("Go! 60 seconds!");
    drawFocus();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "60 seconds! Find all 6 pairs!\nMatch = points +2s. Miss = -3s.\nStreaks earn combo bonus!", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.55); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -25, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 55, 260, 70, 35);
    var btnTx = scene.add.text(0, 90, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 55, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showEnd(scene, won) {
    gameOver = true;
    lockBoard = true;
    if (focusRing) { focusRing.clear(); }
    var timeBonus = won ? Math.ceil(timeLeft) * 10 : 0;
    if (won) { score += timeBonus; hudPoints.setText("Score: " + score); }
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText(won ? "\u{1F389} You Win! \u{1F389}" : "⏱ Time Up!");
    endDetail.setText((won ? "All 6 pairs found!\n" : "You found " + matches + " / 6 pairs.\n") +
      "Score: " + score + "  (best streak x" + bestStreak + ")\n" +
      "Moves: " + moves + "  " + "\u2B50".repeat(won ? stars : 1) +
      (won ? "\nTime bonus: +" + timeBonus : "\nPress R or Play Again!"));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText(won ? "You win! \u{1F389}" : "Time up!");
    var count = won ? 50 : 20;
    for (var i = 0; i < count; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "🌊", "🐬"][i % 6], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeLeft = TIME_LIMIT;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: 0"); hudTime.setText("⏱ " + TIME_LIMIT).setColor("#102A43");
    hudMsg.setText("Go! Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function setupKeyboard(scene) {
    function clampFocus(d) {
      if (!cards.length) { return; }
      for (var n = 0; n < cards.length; n++) {
        focusIdx = (focusIdx + d + cards.length) % cards.length;
        if (!cards[focusIdx].matched) { break; }
      }
      drawFocus();
    }
    function pressFocused() {
      if (!started || gameOver) { return; }
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      var card = cards[focusIdx % cards.length];
      if (card) { onCard(scene, card); }
    }
    scene.input.keyboard.on("keydown", function (e) {
      if (e.key === "ArrowRight") { clampFocus(1); }
      else if (e.key === "ArrowLeft") { clampFocus(-1); }
      else if (e.key === "ArrowDown") { clampFocus(4); }
      else if (e.key === "ArrowUp") { clampFocus(-4); }
      else if (e.key === "Enter" || e.key === " ") { pressFocused(); }
      else if (e.key === "r" || e.key === "R") { restart(scene); }
    });
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      hudTime.setText("⏱ 0");
      showEnd(this, false);
      return;
    }
    var t = Math.ceil(timeLeft);
    hudTime.setText("⏱ " + t);
    if (t <= 10) {
      hudTime.setColor("#c1121f");
      var pulse = 1 + 0.08 * Math.abs(Math.sin(time / 180));
      hudTime.setScale(pulse);
    } else {
      hudTime.setColor("#102A43");
      hudTime.setScale(1);
    }
  }
})();
</script>
</body>
</html>
