<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, combo = 0, bestCombo = 0, level = 1;
  var timeLeft = 95, timerEvent = null, endMode = "win";
  var hudMoves, hudScore, hudMsg, hudPoints, hudTime, hudCombo, hudLevel;
  var endOverlay, endTitle, endDetail, endBtnTx, startOverlay;
  var audioCtx = null;

  function timeForLevel(lv) { return Math.max(40, 95 - (lv - 1) * 10); }
  function fmtTime(s) {
    s = Math.max(0, Math.ceil(s));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ":" + (r < 10 ? "0" + r : "" + r);
  }
  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (!audioCtx) { return; }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
      o.stop(audioCtx.currentTime + (dur || 0.12));
    } catch (e) { /* audio is juice only */ }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    s.input.keyboard.on("keydown", function (e) { onKey(s, e.key); });
  }

  function onKey(scene, key) {
    if (!key) { return; }
    var k = String(key).toLowerCase();
    if (startOverlay && startOverlay.visible && (k === "enter" || k === " ")) {
      startGame(scene); return;
    }
    if (endOverlay && endOverlay.visible && (k === "enter" || k === " ")) {
      endPrimary(scene); return;
    }
    if (k === "r") { fullRestart(scene); return; }
    if (!started || lockBoard || endOverlay.visible) { return; }
    var order = ["1","2","3","4","5","6","7","8","9","0","q","w"];
    var idx = order.indexOf(k);
    if (idx >= 0 && idx < cards.length) { onCard(scene, cards[idx]); }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudPoints = scene.add.text(24, 122, "Score: 0", textStyle(24, "#2a7a2e"));
    hudLevel = scene.add.text(24, 154, "Level: 1", textStyle(20, "#8a6a4a"));
    hudTime = scene.add.text(W / 2, 42, "\u23F1 " + fmtTime(timeLeft), textStyle(34, "#b3541e")).setOrigin(0.5);
    hudCombo = scene.add.text(W / 2, 80, "", textStyle(22, "#d94f30")).setOrigin(0.5);
    scene.add.text(W / 2, 168, "Match fast! Miss \u22123s \u2022 Pair +2s", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () {
      if (started && !lockBoard && !card.faceUp && !card.matched) { cont.setScale(1.045); }
    });
    cont.on("pointerout", function () { if (!card.matched) { cont.setScale(1); } });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function floatText(scene, x, y, str, color) {
    var t = scene.add.text(x, y, str, textStyle(26, color || "#2a7a2e")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y) {
    var bits = ["\u2B50", "\u2728", "\u{1F389}", "\u2600"];
    for (var i = 0; i < 8; i++) {
      var p = scene.add.text(x, y, bits[i % bits.length], { fontSize: "24px" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-80, 40),
        alpha: 0, duration: Phaser.Math.Between(500, 900), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function updateTimeHud(scene) {
    hudTime.setText("\u23F1 " + fmtTime(timeLeft));
    hudTime.setColor(timeLeft <= 15 ? "#d92b2b" : "#b3541e");
    if (timeLeft <= 10 && timeLeft > 0) {
      scene.tweens.add({ targets: hudTime, scale: 1.15, yoyo: true, duration: 120 });
      beep(880, 0.07, "square", 0.03);
    }
  }

  function startTimer(scene) {
    stopTimer();
    timeLeft = timeForLevel(level);
    updateTimeHud(scene);
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started) { return; }
      timeLeft -= 1;
      updateTimeHud(scene);
      if (timeLeft <= 0) { timeLeft = 0; updateTimeHud(scene); timeUp(scene); }
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    if (endOverlay.visible) { return; }
    flip(card, true);
    beep(520, 0.06, "square", 0.03);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        var mx = (a.view.x + card.view.x) / 2, my = (a.view.y + card.view.y) / 2;
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        var gained = (100 + (combo - 1) * 50) * level;
        var fever = combo >= 3;
        if (fever) { gained *= 2; }
        score += gained;
        timeLeft = Math.min(timeLeft + 2, 999);
        hudPoints.setText("Score: " + score);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        burst(scene, mx, my);
        floatText(scene, mx, my - 40, "+" + gained + (fever ? " FEVER x2!" : ""), fever ? "#d94f30" : "#2a7a2e");
        beep(660 + combo * 60, 0.12, "square", 0.05);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        if (combo >= 2) { hudCombo.setText("\u{1F525} Combo x" + combo + (fever ? "  FEVER x2!" : "!")); }
        hudMsg.setText(matches === 6 ? "Amazing!" : (fever ? "\u{1F525} FEVER x2! Keep going!" : "Yay! +" + gained + "!"));
        updateTimeHud(scene);
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      hudCombo.setText("");
      timeLeft = Math.max(0, timeLeft - 3);
      updateTimeHud(scene);
      hudMsg.setText("Miss! \u22123s \u{1F340}");
      beep(180, 0.18, "sawtooth", 0.05);
      try { scene.cameras.main.shake(120, 0.006); } catch (e) { /* no camera */ }
      floatText(scene, card.view.x, card.view.y - 60, "\u22123s", "#d92b2b");
      if (timeLeft <= 0) { lockBoard = false; timeUp(scene); return; }
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Tap a card!");
    startTimer(scene);
    beep(660, 0.1, "square", 0.05);
  }

  function endPrimary(scene) {
    if (endMode === "win") { nextLevel(scene); } else { retryLevel(scene); }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -215, 600, 430, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -215, 600, 430, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -75, "ARCADE: beat the clock!\nFlip cards, build a combo,\nmiss \u22123s \u2022 pair +2s", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 25, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 75, "Click, or keys 1\u20139, 0, Q, W \u2022 R restarts", textStyle(18, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 100, 260, 70, 35);
    var btnTx = scene.add.text(0, 135, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 100, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -190, 580, 380, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -190, 580, 380, 30);
    endTitle = scene.add.text(0, -120, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-140, 70, 280, 70, 35);
    endBtnTx = scene.add.text(0, 105, "\u25B6 Next Level", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 70, 280, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { endPrimary(scene); });
  }

  function showWin(scene) {
    stopTimer();
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var bonus = Math.ceil(timeLeft) * 10 * level;
    score += bonus;
    hudPoints.setText("Score: " + score);
    endMode = "win";
    endTitle.setText("\u{1F389} Level " + level + " Clear! \u{1F389}");
    endDetail.setText("All 6 pairs found! Time bonus +" + bonus +
      "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) +
      "\nScore: " + score + " \u2022 Best combo x" + Math.max(bestCombo, 1) +
      "\nNext: less time on the clock!");
    endBtnTx.setText("\u25B6 Next Level (Enter)");
    hudMsg.setText("Level clear! \u{1F389}");
    beep(660, 0.1, "square", 0.05);
    setTimeout(function () { beep(880, 0.15, "square", 0.05); }, 120);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function timeUp(scene) {
    if (endOverlay.visible || !started || matches === 6) { return; }
    stopTimer();
    started = false; lockBoard = true; firstPick = null;
    try { scene.cameras.main.shake(200, 0.01); } catch (e) { /* no camera */ }
    beep(220, 0.25, "sawtooth", 0.05);
    setTimeout(function () { beep(150, 0.3, "sawtooth", 0.05); }, 200);
    endMode = "lose";
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("Level " + level + " \u2022 Pairs: " + matches + " / 6" +
      "\nScore: " + score + " \u2022 Best combo x" + Math.max(bestCombo, 1) +
      "\nTip: pairs add +2s, misses cost \u22123s.\nChain matches for FEVER x2!");
    endBtnTx.setText("\u21BB Retry Level (Enter)");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Hit retry!");
  }

  function resetRound(scene) {
    moves = 0; matches = 0; combo = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: " + score);
    hudLevel.setText("Level: " + level);
    hudCombo.setText("");
    hudMsg.setText("Tap a card! Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
  }

  function nextLevel(scene) {
    level++;
    resetRound(scene);
  }

  function retryLevel(scene) {
    resetRound(scene);
  }

  function fullRestart(scene) {
    level = 1; score = 0; bestCombo = 0; combo = 0;
    resetRound(scene);
  }

  function restart(scene) {
    fullRestart(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
