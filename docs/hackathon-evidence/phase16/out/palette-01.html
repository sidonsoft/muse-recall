<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#dff2fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var TIME_TOTAL = 90, timeLeft = 90, score = 0, streak = 0, bestStreak = 0, gameOver = false;
  var hudMoves, hudScore, hudMsg, hudTime, hudPts, hudCombo, timeBar, endOverlay, endTitle, endDetail, startOverlay;
  var focusIdx = 0, focusRing = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xdff2fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbfe3f0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0x9adcf0, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 52, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(22));
    hudPts = scene.add.text(W - 24, 12, "Score: 0", textStyle(24)).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 46, "Tap a card!", textStyle(22, "#334E68")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 108);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart (R)", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudTime = scene.add.text(W / 2, 14, "⏱ 90", textStyle(30)).setOrigin(0.5, 0);
    timeBar = scene.add.graphics();
    hudCombo = scene.add.text(W / 2, 84, "", textStyle(22, "#0277BD")).setOrigin(0.5, 0);
    scene.add.text(W / 2, 168, "Match fast! +4s per pair, -3s per miss!", textStyle(21, "#334E68")).setOrigin(0.5);
    drawTimeBar();
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var bw = 220, bx = W / 2 - bw / 2, by = 58;
    timeBar.fillStyle(0xffffff, 1); timeBar.fillRoundedRect(bx - 3, by - 3, bw + 6, 20, 10);
    var frac = Math.max(0, timeLeft / TIME_TOTAL);
    var col = frac > 0.5 ? 0x4EA8DE : (frac > 0.25 ? 0xFFB703 : 0xE63946);
    timeBar.fillStyle(col, 1); timeBar.fillRoundedRect(bx, by, Math.max(8, bw * frac), 14, 7);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    focusRing = scene.add.graphics().setDepth(5);
    drawFocus();
  }

  function drawFocus() {
    if (!focusRing || !cards.length) { return; }
    focusRing.clear();
    if (!started || gameOver || endOverlay && endOverlay.visible) { return; }
    var c = cards[focusIdx];
    if (!c || c.matched) { return; }
    focusRing.lineStyle(5, 0x0277BD, 1);
    focusRing.strokeRoundedRect(c.view.x - 99, c.view.y - 76, 198, 152, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcfeefc, 0xd7f0e4, 0xe2e8f5, 0xcde7f7, 0xd8ecf5, 0xcfe3ef];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function popup(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(30, color || "#0277BD")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    var idx = cards.indexOf(card);
    if (idx >= 0) { focusIdx = idx; drawFocus(); }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more..."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        var gained = 100 + (streak - 1) * 50;
        score += gained;
        timeLeft = Math.min(TIME_TOTAL, timeLeft + 4);
        hudPts.setText("Score: " + score);
        hudCombo.setText(streak >= 2 ? ("🔥 Combo x" + streak + "  +" + gained) : ("+" + gained));
        popup(scene, card.view.x, card.view.y - 60, "+" + gained, "#0277BD");
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "You did it!" : "Yay! +4s \u{1F389}");
        drawTimeBar(); drawFocus();
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      timeLeft = Math.max(0, timeLeft - 3);
      hudCombo.setText("");
      hudMsg.setText("Miss! -3s \u{1F340}");
      if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(140, 0.006); }
      popup(scene, card.view.x, card.view.y - 60, "-3s", "#E63946");
      drawTimeBar();
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "ARCADE: beat the 90-second clock!\n+4s per pair, -3s per miss.\nStreaks earn combo bonus points!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "42px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 55, "Click, or arrows + Enter. R restarts.", textStyle(19, "#334E68")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    started = true; lockBoard = false; gameOver = false;
    timeLeft = TIME_TOTAL;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    drawTimeBar(); drawFocus();
    hudTime.setText("⏱ " + Math.ceil(timeLeft));
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -180, 600, 360, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 30);
    endTitle = scene.add.text(0, -105, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var hint = scene.add.text(0, 42, "Enter: play again   R: restart", textStyle(18, "#334E68")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 60, 260, 70, 35);
    var btnTx = scene.add.text(0, 95, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 60, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    gameOver = true; lockBoard = true;
    var bonus = Math.ceil(timeLeft) * 10;
    score += bonus;
    hudPts.setText("Score: " + score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs! Time bonus +" + bonus + "\nMoves: " + moves + "  Score: " + score + "\nBest combo x" + Math.max(1, bestStreak) + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    if (focusRing) { focusRing.clear(); }
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showGameOver(scene) {
    gameOver = true; lockBoard = true;
    firstPick = null;
    endTitle.setText("⏱ Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nMoves: " + moves + "  Score: " + score + "\nBest combo x" + Math.max(1, bestStreak));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again!");
    if (focusRing) { focusRing.clear(); }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; gameOver = false;
    score = 0; streak = 0; bestStreak = 0; timeLeft = TIME_TOTAL;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: 0"); hudCombo.setText(""); hudMsg.setText("Tap a card!");
    hudTime.setText("⏱ " + TIME_TOTAL);
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawTimeBar(); drawFocus();
  }

  function setupKeyboard(scene) {
    function moveFocus(dx, dy) {
      if (!cards.length) { return; }
      var cols = 4;
      var next = focusIdx + dx + dy * cols;
      if (next < 0 || next >= cards.length) { return; }
      focusIdx = next;
      drawFocus();
    }
    function pressFocused() {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      var c = cards[focusIdx];
      if (c && !c.matched) { onCard(scene, c); }
    }
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-ENTER", pressFocused);
    kb.on("keydown-SPACE", pressFocused);
    kb.on("keydown-LEFT", function () { moveFocus(-1, 0); });
    kb.on("keydown-RIGHT", function () { moveFocus(1, 0); });
    kb.on("keydown-UP", function () { moveFocus(0, -1); });
    kb.on("keydown-DOWN", function () { moveFocus(0, 1); });
    kb.on("keydown-R", function () { restart(scene); });
    kb.on("keydown", function () { drawFocus(); });
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= (delta || 16.7) / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      hudTime.setText("⏱ 0");
      drawTimeBar();
      showGameOver(this);
      return;
    }
    hudTime.setText("⏱ " + Math.ceil(timeLeft));
    hudTime.setColor(timeLeft <= 15 ? "#E63946" : "#102A43");
    drawTimeBar();
  }
})();
</script>
</body>
</html>
