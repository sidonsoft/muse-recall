<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#e3f2fa;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<div id="arcade-status" class="visually-hidden" role="status" aria-live="polite">Farmyard Match loaded. Press Enter on the Start control to begin. Use arrow keys and Enter to flip cards.</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#dff2fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, level = 1;
  var elapsed = 0, timerOn = false, focusIdx = 0;
  var hudMoves, hudScore, hudMsg, hudPoints, hudStreak, hudLevel, hudTime, focusRing, endOverlay, endTitle, endDetail, endBtnTx, startOverlay;
  var bubbles = [], statusEl = null, audioCtx = null;

  function create() {
    var s = this;
    statusEl = document.getElementById("arcade-status");
    drawFarm(s);
    makeBubbles(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard(s);
    announce("Farmyard Match loaded. Level 1. Press Enter to start.");
  }

  function announce(msg) {
    if (hudMsg && hudMsg.setText) { /* visual side handled by callers */ }
    if (statusEl) { statusEl.textContent = msg; }
  }

  function blip(freq, dur, vol) {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return; }
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
      o.stop(audioCtx.currentTime + (dur || 0.12));
    } catch (e) { /* sound is decoration only */ }
  }

  function fmtTime(sec) {
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + ":" + (r < 10 ? "0" + r : r);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xdff2fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbcdcee, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.85);
    g.fillCircle(770, 110, 55);
    g.fillStyle(0xcaf0f8, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn in cool ocean blues
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2C7DA0, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xeaf6fb, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xeaf6fb, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x5390af, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // cool shore flowers / shells
    var cols = [0x90e0ef, 0xcaf0f8, 0xade8f4, 0x48cae4];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a6f97, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function makeBubbles(scene) {
    bubbles = [];
    for (var i = 0; i < 14; i++) {
      var b = scene.add.circle(
        Phaser.Math.Between(20, W - 20),
        Phaser.Math.Between(0, H),
        Phaser.Math.Between(3, 9),
        0xffffff, 0.35
      ).setDepth(-1);
      b.speed = Phaser.Math.FloatBetween(8, 26);
      b.drift = Phaser.Math.FloatBetween(-8, 8);
      b.baseX = b.x;
      bubbles.push(b);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    hudPoints = scene.add.text(24, 48, "Score: 0", textStyle(22));
    hudMoves = scene.add.text(24, 74, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 100, "Pairs: 0 / 6", textStyle(22));
    hudStreak = scene.add.text(24, 126, "Combo: x0", textStyle(22));
    hudLevel = scene.add.text(W / 2, 30, "LEVEL 1", textStyle(24)).setOrigin(0.5, 0);
    hudTime = scene.add.text(W / 2, 60, "Time 0:00", textStyle(22)).setOrigin(0.5, 0);
    scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(20, "#2a6f97")).setOrigin(0.5);
    hudMsg = scene.add.text(W - 24, 44, "Tap a card!", textStyle(22, "#2a6f97")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 108);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene, false); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    focusRing = scene.add.graphics().setDepth(5);
  }

  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || !cards[focusIdx]) { return; }
    var c = cards[focusIdx];
    if (c.matched) { return; }
    focusRing.lineStyle(5, 0x023e8a, 1);
    focusRing.strokeRoundedRect(c.view.x - 100, c.view.y - 77, 200, 154, 24);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0xbde0fe, 0xa9d6e5, 0x89c2d9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 115, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 115, onComplete: done || function () {} });
    }});
  }

  function floatPoints(scene, x, y, txt) {
    var t = scene.add.text(x, y - 70, txt, textStyle(26, "#023e8a")).setOrigin(0.5).setDepth(6);
    scene.tweens.add({ targets: t, y: y - 120, alpha: 0, duration: 900, ease: "Sine.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    blip(520, 0.09);
    var idx = cards.indexOf(card);
    if (idx >= 0) { focusIdx = idx; drawFocus(); }
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("One card up. Pick one more."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.1, yoyo: true, duration: 170 });
        scene.tweens.add({ targets: [a.view, card.view], y: "-=10", yoyo: true, duration: 200 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 25 + (level - 1) * 10;
        score += gained;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPoints.setText("Score: " + score);
        hudStreak.setText("Combo: x" + streak);
        floatPoints(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2, "+" + gained);
        blip(streak > 1 ? 740 : 620, 0.14);
        if (streak > 1) { setTimeout(function () { blip(880, 0.12); }, 90); }
        var msg = matches === 6 ? "You did it!" : (streak > 1 ? "Combo x" + streak + "! Splash-tastic! \u{1F30A}" : "Yay! A pair! \u{1F389}");
        hudMsg.setText(msg);
        announce(msg + " Score " + score + ". Pairs " + matches + " of 6.");
        lockBoard = false;
        drawFocus();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      hudStreak.setText("Combo: x0");
      hudMsg.setText("Try again! \u{1F340}");
      announce("No match. Try again. Score stays " + score + ".");
      blip(330, 0.12, 0.045);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 700);
    }
  }

  function startGame(scene) {
    if (started && startOverlay && !startOverlay.visible) { return; }
    started = true; lockBoard = false; timerOn = true;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Tap a card!");
    announce("Level " + level + " started. Score " + score + ". Find all 6 pairs.");
    drawFocus();
    blip(660, 0.12);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -200, 600, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -200, 600, 400, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -62, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var arcade = scene.add.text(0, 2, "Score points! Chain combos!\nNo rush, no losing points.", Object.assign(textStyle(20, "#2a6f97"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 52, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 92, 260, 70, 35);
    var btnTx = scene.add.text(0, 127, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, arcade, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 92, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -185, 600, 370, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -185, 600, 370, 30);
    endTitle = scene.add.text(0, -115, "\u{1F389} Wave Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-150, 60, 300, 70, 35);
    endBtnTx = scene.add.text(0, 95, "\u21BB Next Wave", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-150, 60, 300, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene, true); });
  }

  function showWin(scene) {
    timerOn = false;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var waveBonus = 50 + (level - 1) * 25;
    score += waveBonus;
    hudPoints.setText("Score: " + score);
    endTitle.setText("\u{1F389} Wave " + level + " Clear! \u{1F389}");
    endDetail.setText("Score: " + score + "  (+" + waveBonus + " wave bonus)\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nBest combo: x" + bestStreak + "   Time: " + fmtTime(elapsed));
    endBtnTx.setText("\u21BB Next Wave: Lv " + (level + 1));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Wave clear! \u{1F389}");
    announce("Wave " + level + " clear. Score " + score + ". Best combo " + bestStreak + ". Press Enter for next wave.");
    blip(660, 0.12); setTimeout(function () { blip(780, 0.12); }, 130); setTimeout(function () { blip(920, 0.16); }, 260);
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F30A}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1400, 2400), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene, nextWave) {
    if (nextWave) { level++; }
    else { level = 1; score = 0; bestStreak = 0; elapsed = 0; }
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true; timerOn = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: " + score); hudStreak.setText("Combo: x0");
    hudLevel.setText("LEVEL " + level); hudTime.setText("Time " + fmtTime(nextWave ? elapsed : 0));
    if (!nextWave) { elapsed = 0; hudTime.setText("Time 0:00"); }
    hudMsg.setText("Tap a card!");
    announce("Level " + level + " started. Score " + score + ".");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawFocus();
  }

  function moveFocus(dRow, dCol) {
    var cols = 4;
    var r = Math.floor(focusIdx / cols), c = focusIdx % cols;
    r = (r + dRow + 3) % 3; c = (c + dCol + cols) % cols;
    focusIdx = r * cols + c;
    drawFocus();
    var card = cards[focusIdx];
    if (card) { announce("Selected " + (card.matched ? "cleared" : (card.faceUp ? card.data.name : "face-down")) + " card, row " + (r + 1) + " column " + (c + 1) + "."); }
  }

  function wireKeyboard(scene) {
    function activateFocused() {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene, true); return; }
      if (cards[focusIdx]) { onCard(scene, cards[focusIdx]); }
    }
    scene.input.keyboard.on("keydown-ENTER", activateFocused);
    scene.input.keyboard.on("keydown-SPACE", activateFocused);
    scene.input.keyboard.on("keydown-LEFT", function () { moveFocus(0, -1); });
    scene.input.keyboard.on("keydown-RIGHT", function () { moveFocus(0, 1); });
    scene.input.keyboard.on("keydown-UP", function () { moveFocus(-1, 0); });
    scene.input.keyboard.on("keydown-DOWN", function () { moveFocus(1, 0); });
    scene.input.keyboard.on("keydown-R", function () { restart(scene, false); });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { activateFocused(); }
      else if (ev.key === " ") { activateFocused(); }
      else if (ev.key === "ArrowLeft") { moveFocus(0, -1); }
      else if (ev.key === "ArrowRight") { moveFocus(0, 1); }
      else if (ev.key === "ArrowUp") { moveFocus(-1, 0); }
      else if (ev.key === "ArrowDown") { moveFocus(1, 0); }
    });
    if (scene.game && scene.game.canvas) {
      scene.game.canvas.setAttribute("tabindex", "0");
    }
  }

  var lastTick = 0;
  function update(time, delta) {
    var dt = Math.min((delta || 16) / 1000, 0.1);
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed * dt;
      b.x = b.baseX + Math.sin((time || 0) / 1400 + i) * 10;
      if (b.y < -12) { b.y = H + 12; b.baseX = Phaser.Math.Between(20, W - 20); }
    }
    if (timerOn && started) {
      lastTick += delta || 16;
      if (lastTick >= 1000) {
        lastTick = 0;
        elapsed++;
        if (hudTime) { hudTime.setText("Time " + fmtTime(elapsed)); }
      }
    } else { lastTick = 0; }
  }
})();
</script>
</body>
</html>
