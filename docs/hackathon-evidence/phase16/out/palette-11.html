<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d8eef7;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#d8eef7",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, combo = 0, bestCombo = 0, timeLeft = 60, gameOver = false;
  var focusIndex = 0, focusRing = null, lastTickSecond = -1;
  var hudMoves, hudScore, hudMsg, hudTime, hudPoints, hudCombo, endOverlay, endTitle, endDetail, startOverlay;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // cool ocean sky + sea
    g.fillStyle(0xd8eef7, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbfe3f2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x4EA8DE, 0.25); g.fillRect(0, 470, W, 10);
    // sun + clouds
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.95);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn (kept, ocean-muted red)
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // pier rails
    g.lineStyle(8, 0x1d6fa5, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // bubbles / sea flowers
    var cols = [0x4EA8DE, 0x48cae4, 0x90e0ef, 0xcaf0f8];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x1d6fa5, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // waves
    g.lineStyle(5, 0xffffff, 0.8);
    for (var wx = 20; wx < W; wx += 90) {
      g.strokeCircle(wx, 492, 18, false, 0.15 * Math.PI, 0.85 * Math.PI);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudPoints = scene.add.text(24, 102, "Score: 0", textStyle(21, "#0b5e8a"));
    hudCombo = scene.add.text(24, 128, "", textStyle(20, "#e36414")).setDepth(2);
    hudTime = scene.add.text(W - 24, 34, "\u23F1 60", textStyle(30, "#102A43")).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 66, "Tap a card!", textStyle(21, "#1d6fa5")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match fast! +4s & combo bonus per pair!", textStyle(20, "#1d6fa5")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null; focusIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { focusIndex = cards.indexOf(card); drawFocus(scene); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function beep(freq, dur, type, vol, when) {
    try {
      window.__arcadeAudio = window.__arcadeAudio || new (window.AudioContext || window.webkitAudioContext)();
      var ctx = window.__arcadeAudio;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      var t0 = ctx.currentTime + (when || 0);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + (dur || 0.09));
    } catch (e) {}
  }

  function popup(scene, x, y, msg, color) {
    var tx = scene.add.text(x, y, msg, textStyle(26, color || "#0b5e8a")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: tx, y: y - 46, alpha: 0, duration: 800, ease: "Cubic.easeOut", onComplete: function () { tx.destroy(); } });
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPoints.setText("Score: " + score);
    hudCombo.setText(combo > 1 ? ("Combo x" + combo + " \uD83D\uDD25") : "");
    hudTime.setText("\u23F1 " + Math.ceil(timeLeft));
    hudTime.setColor(timeLeft <= 10 ? "#d00000" : "#102A43");
  }

  function drawFocus(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length || !started || gameOver) { return; }
    var c = cards[focusIndex];
    if (!c) { return; }
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, 0xe36414, 1);
    focusRing.strokeRoundedRect(c.view.x - 99, c.view.y - 76, 198, 152, 24);
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-LEFT", function () { moveFocus(scene, -1, 0); });
    kb.on("keydown-RIGHT", function () { moveFocus(scene, 1, 0); });
    kb.on("keydown-UP", function () { moveFocus(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveFocus(scene, 0, 1); });
    kb.on("keydown-ENTER", function () { pressFocused(scene); });
    kb.on("keydown-SPACE", function () { pressFocused(scene); });
  }

  function moveFocus(scene, dx, dy) {
    if (!started || gameOver || !cards.length) { return; }
    var cols = 4;
    var r = Math.floor(focusIndex / cols), c = focusIndex % cols;
    c = (c + dx + cols) % cols;
    r = (r + dy + 3) % 3;
    focusIndex = r * cols + c;
    drawFocus(scene);
    beep(300, 0.05, "square", 0.03);
  }

  function pressFocused(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    var card = cards[focusIndex];
    if (card) { onCard(scene, card); }
  }

  function startGame(scene) {
    started = true; lockBoard = false; gameOver = false;
    timeLeft = 60; lastTickSecond = -1;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card! Arrows + Enter work too!");
    refreshHud(); drawFocus(scene);
    beep(523, 0.1, "square", 0.06); beep(784, 0.12, "square", 0.06, 0.1);
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    focusIndex = Math.max(0, cards.indexOf(card));
    drawFocus(scene);
    flip(card, true);
    beep(440, 0.07, "square", 0.05);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      var flipDelay = 350;
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 170 });
        matches++;
        combo++;
        if (combo > bestCombo) { bestCombo = combo; }
        var gained = 100 * combo + Math.ceil(timeLeft);
        score += gained;
        timeLeft = Math.min(99, timeLeft + 4);
        hudMsg.setText(matches === 6 ? "You did it!" : ("+" + gained + "! Combo x" + combo + " \uD83C\uDF89"));
        popup(scene, card.view.x, card.view.y - 70, "+" + gained, "#0b5e8a");
        beep(660, 0.09, "square", 0.06); beep(990, 0.12, "square", 0.06, 0.09);
        refreshHud();
        hudMoves.setText("Moves: " + moves);
        hudScore.setText("Pairs: " + matches + " / 6");
        lockBoard = false;
        drawFocus(scene);
        if (matches === 6) { showWin(scene); }
      }, flipDelay);
    } else {
      // arcade penalty: combo breaks, -25 pts, -3s, shake; flip-back speeds up as board clears
      var speedUp = Math.min(260, matches * 40);
      var backDelay = Math.max(420, 700 - speedUp);
      combo = 0;
      score = Math.max(0, score - 25);
      timeLeft = Math.max(0, timeLeft - 3);
      hudMsg.setText("Miss! -3s \uD83D\uDCA6");
      popup(scene, card.view.x, card.view.y - 70, "-25", "#d00000");
      refreshHud();
      try { scene.cameras.main.shake(140, 0.006); } catch (e) {}
      beep(160, 0.18, "sawtooth", 0.06);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(scene); });
      }, backDelay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Arcade mode: 60 seconds!\nMatch fast for +4s & combo bonus!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    gameOver = true;
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    var timeBonus = Math.ceil(timeLeft) * 5;
    score += timeBonus;
    var stars = (moves <= 10 && timeLeft >= 20) ? 3 : ((moves <= 16 && timeLeft >= 8) ? 2 : 1);
    endTitle.setText("\uD83C\uDF89 You Win! \uD83C\uDF89");
    endDetail.setText("All 6 pairs! Time bonus +" + timeBonus + "\nScore: " + score + "  Moves: " + moves + "\nBest combo x" + Math.max(1, bestCombo) + "  " + "\u2B50".repeat(stars) + "\nMissed the clock? Press Enter to play again!");
    refreshHud();
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \uD83C\uDF89");
    beep(523, 0.12, "square", 0.07); beep(659, 0.12, "square", 0.07, 0.12); beep(784, 0.2, "square", 0.07, 0.24);
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\uD83C\uDF89", "\u{1F404}", "\u26A1"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showGameOver(scene) {
    gameOver = true;
    lockBoard = true;
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    endTitle.setText("\u23F1 Time\u2019s Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  Moves: " + moves + "  Best combo x" + Math.max(0, bestCombo) + "\nPress Enter or tap Play Again!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time\u2019s up! Try again!");
    try { scene.cameras.main.shake(200, 0.008); } catch (e) {}
    beep(220, 0.25, "sawtooth", 0.07); beep(147, 0.35, "sawtooth", 0.07, 0.22);
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeLeft = 60; lastTickSecond = -1;
    refreshHud(); hudMsg.setText("Tap a card! Arrows + Enter work too!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawFocus(scene);
    beep(523, 0.1, "square", 0.06); beep(784, 0.12, "square", 0.06, 0.1);
  }

  function update(time, delta) {
    var scene = this;
    if (!started || gameOver || !endOverlay) { return; }
    if (matches >= 6) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    timeLeft -= (delta || 16) / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      refreshHud();
      showGameOver(scene);
      return;
    }
    var sec = Math.ceil(timeLeft);
    if (sec !== lastTickSecond) {
      lastTickSecond = sec;
      refreshHud();
      if (sec <= 10) {
        beep(880, 0.06, "square", 0.05);
        scene.tweens.add({ targets: hudTime, scale: { from: 1.35, to: 1 }, duration: 180 });
      }
    }
  }

  function update() {}
})();
</script>
</body>
</html>
