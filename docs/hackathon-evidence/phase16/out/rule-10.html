<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d8ecf5;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match card game. Use arrow keys to choose a card and Enter to flip it."></div>
<p id="kbd-help" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Use Left and Right arrows to choose a card, Enter or Space to flip it. Green Start and Restart shapes are keyboard operable with Enter.</p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F986}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F430}", name: "Rabbit" }
  ];
  var OCEAN = "#4EA8DE", INK = "#102A43";
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#e8f4fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0;
  var level = 1, maxLevel = 2, selIndex = 0;
  var hudMoves, hudScore, hudMsg, hudPoints, hudLevel, selRing, endOverlay, endTitle, endDetail, endBtnTx, startOverlay;
  var drifters = [];

  function pairCount() { return level >= 2 ? 8 : 6; }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe8f4fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcaf0f8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x90e0ef, 0.55); g.fillRect(0, 470, W, 26);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.95);
    drifters = [];
    var c1 = scene.add.ellipse(180, 110, 150, 48, 0xffffff).setAlpha(0.95);
    var c2 = scene.add.ellipse(240, 100, 120, 44, 0xffffff).setAlpha(0.95);
    var c3 = scene.add.ellipse(560, 80, 140, 44, 0xffffff).setAlpha(0.95);
    drifters.push({ obj: c1, baseX: 180, speed: 9, amp: 16, phase: 0 });
    drifters.push({ obj: c2, baseX: 240, speed: 12, amp: 20, phase: 1.4 });
    drifters.push({ obj: c3, baseX: 560, speed: 7, amp: 14, phase: 2.6 });
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || INK, fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 114, "Score: 0", textStyle(22));
    hudLevel = scene.add.text(24, 142, "Level 1 of 2", textStyle(20));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Clear both levels for the big finish!", textStyle(20)).setOrigin(0.5);
    selRing = scene.add.graphics().setDepth(5);
  }

  var currentCols = 4;

  function shuffledDeck(n) {
    var deck = [];
    ANIMALS.slice(0, n).forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    var n = pairCount();
    var deck = shuffledDeck(n);
    var cols = 4;
    currentCols = cols;
    var rows = Math.ceil(deck.length / cols);
    var cw = 185, ch = rows > 3 ? 104 : 140, gx = 62, gy = 198, padX = 22, padY = 12;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      var made = makeCard(scene, cx, cy, cw, ch, card);
      made.index = idx;
      cards.push(made);
    });
    selIndex = 0;
    drawSel();
  }

  function drawSel() {
    if (!selRing) { return; }
    selRing.clear();
    if (!started || !cards.length || cards[selIndex] === undefined) { return; }
    var card = cards[selIndex];
    if (card.matched) { return; }
    selRing.lineStyle(5, 0x102A43, 1);
    selRing.strokeRoundedRect(card.view.x - 96, card.view.y - 72, 192, 144, 20);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0x48cae4, 0xcaf0f8, 0xade8f4, 0x90e0ef, 0x48cae4];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function popupPoints(scene, x, y, text) {
    var t = scene.add.text(x, y - 60, text, textStyle(26, "#102A43")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 110, alpha: 0, duration: 900, ease: "Sine.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function bubbleBurst(scene, x, y) {
    for (var i = 0; i < 8; i++) {
      var b = scene.add.circle(x + Phaser.Math.Between(-40, 40), y + Phaser.Math.Between(-20, 20),
        Phaser.Math.Between(4, 9), i % 2 ? 0x4EA8DE : 0xffffff).setAlpha(0.8).setDepth(14);
      scene.tweens.add({ targets: b, y: y - Phaser.Math.Between(50, 110),
        alpha: 0, duration: Phaser.Math.Between(700, 1100), ease: "Sine.easeOut",
        onComplete: (function (c) { return function () { c.destroy(); }; })(b) });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    selIndex = card.index;
    drawSel();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var points = 100 + (streak - 1) * 25;
        score += points;
        hudPoints.setText("Score: " + score);
        hudScore.setText("Pairs: " + matches + " / " + pairCount());
        if (matches === pairCount()) {
          hudMsg.setText("Level clear!");
        } else if (streak >= 3) {
          hudMsg.setText("Super streak x" + streak + "! +" + points + " \u{1F389}");
        } else if (streak >= 2) {
          hudMsg.setText("Combo x" + streak + "! +" + points + " \u{1F389}");
        } else {
          hudMsg.setText("Yay! A pair! +" + points + " \u{1F389}");
        }
        popupPoints(scene, card.view.x, card.view.y, "+" + points);
        bubbleBurst(scene, card.view.x, card.view.y);
        drawSel();
        lockBoard = false;
        if (matches === pairCount()) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      hudMsg.setText("Nice try! Keep going! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawSel(); });
      }, 700);
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card! Arrows + Enter work too!");
    drawSel();
  }

  function moveSel(d) {
    if (!cards.length) { return; }
    selIndex = (selIndex + d + cards.length) % cards.length;
    drawSel();
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-LEFT", function () { moveSel(-1); });
    kb.on("keydown-A", function () { moveSel(-1); });
    kb.on("keydown-RIGHT", function () { moveSel(1); });
    kb.on("keydown-D", function () { moveSel(1); });
    kb.on("keydown-UP", function () { moveSel(-currentCols); });
    kb.on("keydown-W", function () { moveSel(-currentCols); });
    kb.on("keydown-DOWN", function () { moveSel(currentCols); });
    kb.on("keydown-S", function () { moveSel(currentCols); });
    kb.on("keydown-ENTER", function () { pressActive(scene); });
    kb.on("keydown-SPACE", function () { pressActive(scene); });
    kb.on("keydown-R", function () {
      if (started && !startOverlay.visible) { restart(scene); }
    });
  }

  function pressActive(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { advanceFromEnd(scene); return; }
    if (!started || lockBoard) { return; }
    var card = cards[selIndex];
    if (card) { onCard(scene, card); }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Two arcade levels: 6 pairs, then 8!\nCombos grow your score. Misses never lose points.", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 25, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F986} \u{1F410} \u{1F430}", { fontSize: "34px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 62, "Click, or Arrows + Enter. R restarts.", textStyle(18)).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 84, 260, 70, 35);
    var btnTx = scene.add.text(0, 119, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 84, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 50, 280, 70, 35);
    endBtnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 50, 280, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { advanceFromEnd(scene); });
  }

  function praise() {
    if (score >= 1000) { return "Arcade Champion!"; }
    if (bestStreak >= 3) { return "Super Combo Star!"; }
    if (moves <= 10 && level >= 2) { return "Sharp_memory Explorer!"; }
    return "Superstar Explorer!";
  }

  function showWin(scene) {
    if (level < maxLevel) {
      endTitle.setText("\u{1F389} Level 1 Clear! \u{1F389}");
      endDetail.setText("Score: " + score + "  Best combo: x" + bestStreak + "\nLevel 2 has 8 pairs. " + praise());
      endBtnTx.setText("Next Level \u25B6");
    } else {
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("Final score: " + score + "\nMoves: " + moves + "  Best combo: x" + bestStreak + "\n" + praise());
      endBtnTx.setText("\u21BB Play Again");
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText(level < maxLevel ? "Level clear! \u{1F389}" : "You win! \u{1F389}");
    for (var i = 0; i < 32; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1600, 2600), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function advanceFromEnd(scene) {
    if (level < maxLevel) {
      level++;
      moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
      hudMoves.setText("Moves: 0");
      hudScore.setText("Pairs: 0 / " + pairCount());
      hudLevel.setText("Level " + level + " of " + maxLevel);
      hudMsg.setText("Level 2: 8 pairs!");
      endOverlay.setVisible(false);
      cards.forEach(function (c) { c.view.destroy(); });
      buildBoard(scene);
    } else {
      restart(scene);
    }
  }

  function restart(scene) {
    level = 1;
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + pairCount());
    hudPoints.setText("Score: 0"); hudLevel.setText("Level 1 of " + maxLevel);
    hudMsg.setText("Tap a card! Arrows + Enter work too!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update(time) {
    for (var i = 0; i < drifters.length; i++) {
      var d = drifters[i];
      if (d.obj && d.obj.active) {
        d.obj.x = d.baseX + Math.sin(time / 1000 * d.speed / 12 + d.phase) * d.amp;
      }
    }
  }
})();
</script>
</body>
</html>
