<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var hudTime, hudPoints, hudCombo, timeBarBg, timeBar;
  var timeTotal = 75, timeLeft = timeTotal, timerEvt = null;
  var score = 0, streak = 0, bestStreak = 0, over = false;
  var focusIdx = 0, focusRing = null, CW = 185, CH = 140;
  var audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    makeFocusRing(s);
    setupKeyboard(s);
    setupCanvasA11y();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    hudTime = scene.add.text(W / 2, 12, "\u23F1 " + timeLeft + "s", textStyle(28, "#a35400")).setOrigin(0.5, 0);
    hudPoints = scene.add.text(W / 2, 46, "Score: 0", textStyle(22)).setOrigin(0.5, 0);
    hudCombo = scene.add.text(W / 2, 74, "", textStyle(18, "#d9480f")).setOrigin(0.5, 0);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0x000000, 0.15); timeBarBg.fillRoundedRect(W / 2 - 120, 100, 240, 14, 7);
    timeBar = scene.add.graphics();
    scene.add.text(W / 2, 140, "Arrows + Enter to flip \u2022 Match fast: +3s & combos!", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    updateArcadeHud();
  }

  function setupCanvasA11y() {
    var c = document.querySelector("#game canvas");
    if (c) {
      c.setAttribute("tabindex", "0");
      c.setAttribute("role", "application");
      c.setAttribute("aria-label", "Farmyard Match memory game. Use arrow keys to choose a card, Enter or Space to flip it, R to restart.");
    }
  }

  function beep(freq, dur, delay, type, vol, slideTo) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var t0 = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) { o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur); }
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  function sfxFlip() { beep(440, 0.09, 0, "square", 0.05, 660); }
  function sfxMatch() { beep(523, 0.12, 0, "square", 0.08); beep(659, 0.12, 0.09, "square", 0.08); beep(784, 0.2, 0.18, "square", 0.08, 1040); }
  function sfxMiss() { beep(220, 0.18, 0, "sawtooth", 0.06, 140); }
  function sfxTick() { beep(880, 0.07, 0, "square", 0.05); }
  function sfxWin() { beep(523, 0.14, 0, "square", 0.09); beep(659, 0.14, 0.12, "square", 0.09); beep(784, 0.14, 0.24, "square", 0.09); beep(1047, 0.32, 0.36, "square", 0.1); }
  function sfxLose() { beep(392, 0.2, 0, "sawtooth", 0.08, 330); beep(311, 0.2, 0.18, "sawtooth", 0.08, 262); beep(233, 0.4, 0.36, "sawtooth", 0.08, 155); }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIdx = 0;
    moveFocusRing();
  }

  function updateArcadeHud() {
    if (!hudTime) { return; }
    hudTime.setText("\u23F1 " + timeLeft + "s");
    hudTime.setColor(timeLeft <= 10 ? "#d00000" : "#a35400");
    hudPoints.setText("Score: " + score);
    hudCombo.setText(streak >= 2 ? ("\u{1F525} Combo x" + streak + "!") : "");
    if (timeBar) {
      timeBar.clear();
      var frac = Math.max(0, timeLeft / timeTotal);
      timeBar.fillStyle(timeLeft <= 10 ? 0xd00000 : 0xff9f1c, 1);
      if (frac > 0) { timeBar.fillRoundedRect(W / 2 - 120, 100, Math.max(14, 240 * frac), 14, 7); }
    }
  }

  function startTimer(scene) {
    stopTimer(scene);
    timerEvt = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started || over) { return; }
      if (startOverlay && startOverlay.visible) { return; }
      if (endOverlay && endOverlay.visible) { return; }
      timeLeft--;
      if (timeLeft <= 10 && timeLeft > 0) { sfxTick(); }
      updateArcadeHud();
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateArcadeHud();
        showLose(scene);
      }
    }});
  }

  function stopTimer(scene) {
    if (timerEvt) { timerEvt.remove(false); timerEvt = null; }
  }

  function floatingText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y - 70, msg, textStyle(26, color || "#2a9d3a")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 120, alpha: 0, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y, big) {
    var icons = ["\u2B50", "\u{1F389}", "\u2728", "\u{1F33B}"];
    var n = big ? 10 : 6;
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(x, y, icons[i % icons.length], { fontSize: "24px" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({ targets: p,
        x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-90, 60),
        alpha: 0, duration: Phaser.Math.Between(500, 900), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function makeFocusRing(scene) {
    focusRing = scene.add.graphics().setDepth(5);
    moveFocusRing();
  }

  function moveFocusRing() {
    if (!focusRing || !cards.length) { return; }
    var c = cards[focusIdx] || cards[0];
    focusRing.clear();
    if (!started || over) { return; }
    if ((startOverlay && startOverlay.visible) || (endOverlay && endOverlay.visible)) { return; }
    if (c.matched) { return; }
    focusRing.lineStyle(5, 0xffb703, 1);
    focusRing.strokeRoundedRect(c.view.x - CW / 2 - 5, c.view.y - CH / 2 - 5, CW + 10, CH + 10, 24);
  }

  function moveFocus(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(focusIdx / cols), c = focusIdx % cols;
    var nr = Math.min(2, Math.max(0, r + dy)), nc = Math.min(cols - 1, Math.max(0, c + dx));
    focusIdx = nr * cols + nc;
    if (cards[focusIdx] && cards[focusIdx].matched) {
      for (var k = 0; k < cards.length; k++) {
        var cand = (focusIdx + k) % cards.length;
        if (!cards[cand].matched) { focusIdx = cand; break; }
      }
    }
    moveFocusRing();
  }

  function setupKeyboard(scene) {
    function activateFocused() {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      var card = cards[focusIdx];
      if (card) { onCard(scene, card); }
    }
    scene.input.keyboard.on("keydown-LEFT", function (e) { moveFocus(scene, -1, 0); });
    scene.input.keyboard.on("keydown-RIGHT", function (e) { moveFocus(scene, 1, 0); });
    scene.input.keyboard.on("keydown-UP", function (e) { moveFocus(scene, 0, -1); });
    scene.input.keyboard.on("keydown-DOWN", function (e) { moveFocus(scene, 0, 1); });
    scene.input.keyboard.on("keydown-ENTER", function (e) { activateFocused(); });
    scene.input.keyboard.on("keydown-SPACE", function (e) { activateFocused(); });
    scene.input.keyboard.on("keydown-R", function (e) { restart(scene); });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") { return; }
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") { return; }
      if (e.key === " ") { e.preventDefault(); }
    });
  }

  function startGame(scene) {
    started = true; lockBoard = false; over = false;
    startOverlay.setVisible(false);
    focusIdx = 0;
    hudMsg.setText("Beat the clock!");
    resetArcade(true);
    startTimer(scene);
    moveFocusRing();
    sfxFlip();
  }

  function resetArcade(full) {
    if (full) { timeLeft = timeTotal; score = 0; streak = 0; bestStreak = 0; }
    focusIdx = 0;
    updateArcadeHud();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () {
      for (var k = 0; k < cards.length; k++) { if (cards[k] === card) { focusIdx = k; break; } }
      moveFocusRing();
      onCard(scene, card);
    });
    cont.on("pointerover", function () {
      for (var m = 0; m < cards.length; m++) { if (cards[m] === card && !card.matched) { focusIdx = m; moveFocusRing(); break; } }
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || over || lockBoard || card.faceUp || card.matched) { return; }
    if ((startOverlay && startOverlay.visible) || (endOverlay && endOverlay.visible)) { return; }
    flip(card, true);
    sfxFlip();
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); moveFocusRing(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 50;
        score += gained;
        timeLeft = Math.min(timeTotal, timeLeft + 3);
        updateArcadeHud();
        floatingText(scene, card.view.x, card.view.y, "+" + gained, "#2a9d3a");
        burst(scene, card.view.x, card.view.y, streak >= 3);
        sfxMatch();
        hudScore.setText("Pairs: " + matches + " / 6");
        if (matches === 6) {
          hudMsg.setText("You did it!");
        } else if (streak >= 3) {
          hudMsg.setText("\u{1F525} Frenzy x" + streak + "! +3s \u{1F389}");
        } else if (streak >= 2) {
          hudMsg.setText("Combo x" + streak + "! +3s \u{1F389}");
        } else {
          hudMsg.setText("Yay! A pair! +3s \u{1F389}");
        }
        moveFocusRing();
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      score = Math.max(0, score - 20);
      timeLeft = Math.max(0, timeLeft - 2);
      updateArcadeHud();
      hudMsg.setText("Miss! -2s \u{1F340}");
      sfxMiss();
      try { scene.cameras.main.shake(150, 0.004); } catch (e) {}
      setTimeout(function () {
        if (over) { return; }
        flip(a, false); flip(card, false, function () { lockBoard = false; moveFocusRing(); });
      }, 700);
      if (timeLeft <= 0) { showLose(scene); }
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Beat the \u23F1 clock! Match fast for\ncombos, +3s bonus & big scores!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    over = true;
    stopTimer(scene);
    var timeBonus = timeLeft * 10;
    score += timeBonus;
    updateArcadeHud();
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!  " + "\u2B50".repeat(stars) + "\nScore: " + score + " (time bonus +" + timeBonus + ")\nBest combo: x" + Math.max(1, bestStreak) + "  \u2022  " + timeLeft + "s left!");
    endOverlay.setVisible(true);
    endOverlay.setScale(1);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    sfxWin();
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u2728", "\u{1F525}"][i % 6], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    if (over) { return; }
    if (matches === 6) { return; }
    over = true;
    lockBoard = true;
    firstPick = null;
    stopTimer(scene);
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  \u2022  Best combo: x" + Math.max(0, bestStreak) + "\nMoves: " + moves + " \u2014 try a faster run!");
    endOverlay.setVisible(true);
    endOverlay.setScale(1);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    sfxLose();
    try { scene.cameras.main.shake(250, 0.006); } catch (e) {}
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; over = false;
    timeLeft = timeTotal; score = 0; streak = 0; bestStreak = 0; focusIdx = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudMsg.setText("Beat the clock!");
    updateArcadeHud();
    endOverlay.setVisible(false);
    endOverlay.setScale(1);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    moveFocusRing();
  }

  function update() {}
})();
</script>
</body>
</html>
