<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#e6f4fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0;
  var TIME_LIMIT = 90, timeLeft = TIME_LIMIT, timerEvent = null, over = false;
  var hudMoves, hudScore, hudPts, hudMsg, hudTime, hudCombo, endOverlay, endTitle, endDetail, startOverlay;
  var timeBarBg, timeBar, focusRing, focusIdx = 0;
  var audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { audioCtx = new AC(); }
      }
      if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) {}
  }

  function beep(freq, dur, type, vol, delay) {
    try {
      if (!audioCtx) { return; }
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + (dur || 0.12) + 0.02);
    } catch (e) {}
  }

  function sfx(name) {
    if (!audioCtx) { return; }
    if (name === "flip") { beep(520, 0.08, "square", 0.05); }
    else if (name === "match") { beep(660, 0.1, "square", 0.07); beep(880, 0.14, "square", 0.07, 0.09); }
    else if (name === "miss") { beep(220, 0.16, "sawtooth", 0.05); beep(160, 0.18, "sawtooth", 0.05, 0.08); }
    else if (name === "win") { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.16, "square", 0.07, i * 0.12); }); }
    else if (name === "tick") { beep(980, 0.06, "square", 0.05); }
    else if (name === "over") { [400, 320, 240, 160].forEach(function (f, i) { beep(f, 0.18, "sawtooth", 0.06, i * 0.13); }); }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe6f4fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(22));
    hudPts = scene.add.text(24, 110, "Score: 0", textStyle(22, "#0b6e99"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#334e68")).setOrigin(1, 0.5);
    hudTime = scene.add.text(W - 24, 22, "\u23F1 1:30", textStyle(26, "#102A43")).setOrigin(1, 0.5);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0xbcd7e6, 1); timeBarBg.fillRoundedRect(W - 224, 40, 200, 10, 5);
    timeBar = scene.add.graphics();
    drawTimeBar();
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 162, "Match all 6 pairs in 90s! Combos = big points!", textStyle(20, "#334e68")).setOrigin(0.5);
    hudCombo = scene.add.text(W / 2, 184, "", textStyle(20, "#d64541")).setOrigin(0.5);
    scene.add.text(24, 136, "Arrows + Enter: play from keyboard", textStyle(15, "#62748a"));
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function fmtTime(sec) {
    var m = Math.floor(sec / 60), r = sec % 60;
    return "\u23F1 " + m + ":" + (r < 10 ? "0" + r : r);
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var frac = Math.max(0, timeLeft / TIME_LIMIT);
    var col = frac > 0.5 ? 0x4EA8DE : (frac > 0.25 ? 0xf0a030 : 0xd64541);
    timeBar.fillStyle(col, 1);
    timeBar.fillRoundedRect(W - 224, 40, 200 * frac, 10, 5);
  }

  function startTimer(scene) {
    stopTimer();
    timeLeft = TIME_LIMIT;
    if (hudTime) { hudTime.setText(fmtTime(timeLeft)).setColor("#102A43"); }
    drawTimeBar();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started || over) { return; }
      timeLeft--;
      if (hudTime) {
        hudTime.setText(fmtTime(Math.max(0, timeLeft)));
        if (timeLeft <= 15) { hudTime.setColor("#d64541"); sfx("tick"); }
      }
      drawTimeBar();
      if (timeLeft <= 0) { gameOver(scene); }
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function floatText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(28, color || "#0b6e99")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null; focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, cx: x, cy: y, cw: w, ch: h };
    cont.on("pointerdown", function () { ensureAudio(); onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched && started && !over) { cont.setScale(1.04); } });
    cont.on("pointerout", function () { cont.setScale(1); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || over || lockBoard || card.faceUp || card.matched) { return; }
    ensureAudio();
    flip(card, true);
    sfx("flip");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var frenzy = timeLeft <= 15 ? 2 : 1;
        var pts = (100 + (streak - 1) * 50) * frenzy;
        score += pts;
        hudPts.setText("Score: " + score);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 170, ease: "Back.easeOut" });
        scene.tweens.add({ targets: [a.view, card.view], angle: { from: -3, to: 3 }, yoyo: true, duration: 120, repeat: 1,
          onComplete: function () { a.view.setAngle(0); card.view.setAngle(0); } });
        sfx("match");
        var mx = (a.cx + card.cx) / 2, my = (a.cy + card.cy) / 2 - 40;
        floatText(scene, mx, my, "+" + pts, frenzy > 1 ? "#d64541" : "#0b6e99");
        burst(scene, mx, my, card.data.emoji);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        if (streak >= 2) {
          hudCombo.setText("\u{1F525} COMBO x" + streak + (frenzy > 1 ? "  FRENZY x2!" : "!"));
          scene.tweens.add({ targets: hudCombo, scale: { from: 1.35, to: 1 }, duration: 220, ease: "Back.easeOut" });
        } else {
          hudCombo.setText(frenzy > 1 ? "\u26A1 FRENZY x2 points!" : "");
        }
        hudMsg.setText(matches === 6 ? "You did it!" : (streak >= 2 ? "Combo x" + streak + "! \u{1F525}" : "Yay! A pair! \u{1F389}"));
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      hudCombo.setText("");
      hudMsg.setText("Miss! Combo lost \u{1F340}");
      sfx("miss");
      try { scene.cameras.main.shake(120, 0.004); } catch (e) {}
      scene.tweens.add({ targets: [a.view, card.view], x: "+=8", yoyo: true, repeat: 3, duration: 50,
        onComplete: function () {
          cards.forEach(function (c) { if (!c.matched) { c.view.setX(c.cx); } });
        } });
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function burst(scene, x, y, emoji) {
    for (var i = 0; i < 10; i++) {
      var p = scene.add.text(x, y, i % 3 === 0 ? emoji : "\u2B50", { fontSize: (16 + Math.random() * 18) + "px" }).setOrigin(0.5).setDepth(30);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-110, 110), y: y + Phaser.Math.Between(-90, 60),
        alpha: 0, angle: Phaser.Math.Between(-120, 120), duration: Phaser.Math.Between(500, 900), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function setupKeyboard(scene) {
    drawFocus(scene);
    function focusCard(idx) {
      if (!cards.length) { return; }
      focusIdx = ((idx % cards.length) + cards.length) % cards.length;
      drawFocus(scene);
    }
    function playFocused() {
      ensureAudio();
      if (startOverlay && startOverlay.visible) { beginGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      var card = cards[focusIdx];
      if (card) { onCard(scene, card); }
    }
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        ensureAudio();
        if (focusRing) { focusRing.setVisible(true); }
        var cols = 4, d = 0;
        if (e.key === "ArrowRight") { d = 1; }
        else if (e.key === "ArrowLeft") { d = -1; }
        else if (e.key === "ArrowDown") { d = cols; }
        else { d = -cols; }
        focusCard(focusIdx + d);
      } else if (e.key === "Enter" || e.key === " ") {
        var tag = (document.activeElement && document.activeElement.tagName) || "";
        if (tag !== "INPUT" && tag !== "TEXTAREA") {
          e.preventDefault();
          if (focusRing) { focusRing.setVisible(true); }
          playFocused();
        }
      }
    });
  }

  function drawFocus(scene) {
    if (!focusRing || !cards.length) { return; }
    var card = cards[focusIdx];
    if (!card) { return; }
    focusRing.clear();
    focusRing.lineStyle(5, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(card.cx - card.cw / 2 - 5, card.cy - card.ch / 2 - 5, card.cw + 10, card.ch + 10, 26);
  }

  function beginGame(scene) {
    ensureAudio();
    started = true; lockBoard = false; over = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    startTimer(scene);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -52, "ARCADE MODE: 90 seconds!\nFind all 6 pairs. Fast matches build combos!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { beginGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
  }

  function showWin(scene) {
    over = true;
    stopTimer();
    var bonus = Math.max(0, timeLeft) * 5;
    score += bonus;
    hudPts.setText("Score: " + score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs found! Time bonus +" + bonus +
      "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) +
      "\nScore: " + score + "   Best combo x" + Math.max(1, bestStreak));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    hudCombo.setText("");
    sfx("win");
    for (var i = 0; i < 70; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function gameOver(scene) {
    if (over || matches === 6) { return; }
    over = true; lockBoard = true;
    stopTimer();
    timeLeft = 0;
    if (hudTime) { hudTime.setText(fmtTime(0)).setColor("#d64541"); }
    drawTimeBar();
    sfx("over");
    try { scene.cameras.main.shake(200, 0.008); } catch (e) {}
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs!\nScore: " + score + "   Best combo x" + Math.max(1, bestStreak) + "\nBeat the clock next run!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Hit Play Again!");
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true; over = false;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: 0"); hudMsg.setText("Tap a card!"); hudCombo.setText("");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawFocus(scene);
    startTimer(scene);
  }

  function update() {}
})();
</script>
</body>
