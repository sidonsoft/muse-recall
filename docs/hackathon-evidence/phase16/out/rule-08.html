<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d6eaf8;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F422}", name: "Turtle" }
  ];
  var INK = "#102A43";
  var ACCENT = 0x4EA8DE;
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#d6eaf8",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, pairsGoal = 6;
  var score = 0, combo = 0, bestCombo = 0, level = 1, best = 0;
  var hudMoves, hudScore, hudMsg, hudLevel, hudPoints, hudCombo, endOverlay, endTitle, endDetail, startOverlay, endNextBg, endNextTx;
  var bubbles = [], focusIndex = 0, focusRing = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    makeBubbles(s);
    setupKeyboard(s);
    updateFocusRing();
  }

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // Cool ocean backdrop (gentle, no flashing).
    g.fillStyle(0xd6eaf8, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbcd9f5, 1); g.fillRect(0, 180, W, 290);
    g.fillStyle(0x9ac8e8, 1); g.fillRect(0, 330, W, 140);
    g.fillStyle(0x8fbfdf, 1); g.fillRect(0, 470, W, 230);
    // Soft sun + calm waves.
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.lineStyle(5, 0xffffff, 0.55);
    for (var wy = 500; wy <= 620; wy += 40) {
      for (var wx = 20; wx < W; wx += 120) {
        g.strokeCircle(wx, wy, 22);
      }
    }
    // Friendly dock posts instead of fence.
    g.lineStyle(8, 0x7a9bb5, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // Gentle shells / starfish dots along the sand.
    var cols = [0xffffff, 0xffe8a3, 0xffc8dd, 0xc8e7ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x6a9ab8, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0x4EA8DE, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function makeBubbles(scene) {
    for (var i = 0; i < 14; i++) {
      var b = scene.add.circle(
        20 + Math.random() * (W - 40),
        200 + Math.random() * 460,
        4 + Math.random() * 10,
        0xffffff, 0.35
      ).setDepth(-1);
      b.speed = 8 + Math.random() * 18;
      b.wobble = Math.random() * Math.PI * 2;
      bubbles.push(b);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || INK, fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34, INK)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22, INK));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22, INK));
    hudLevel = scene.add.text(24, 114, "Level: 1", textStyle(22, INK));
    hudPoints = scene.add.text(24, 142, "Score: 0  Best: 0", textStyle(22, INK));
    hudCombo = scene.add.text(W / 2, 168, "", textStyle(22, "#1b6f9e")).setOrigin(0.5);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, INK)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(ACCENT, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
  }

  function pairCountForLevel(lv) {
    return lv >= 2 ? 8 : 6;
  }

  function shuffledDeck(count) {
    var deck = [];
    for (var k = 0; k < count; k++) {
      var a = ANIMALS[k % ANIMALS.length];
      deck.push({ key: k, emoji: a.emoji, name: a.name });
      deck.push({ key: k, emoji: a.emoji, name: a.name });
    }
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    pairsGoal = pairCountForLevel(level);
    matches = 0;
    focusIndex = 0;
    var deck = shuffledDeck(pairsGoal);
    var cols = 4;
    var rows = Math.ceil(deck.length / cols);
    var cw = 185, ch = 118, gx = 62, gy = 195, padX = 22, padY = 14;
    if (rows >= 4) { ch = 108; gy = 192; padY = 12; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    hudScore.setText("Pairs: 0 / " + pairsGoal);
    updateFocusRing();
    announce("Level " + level + ". Find " + pairsGoal + " pairs. Score " + score + ".");
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(ACCENT, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "52px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xe8f4fc, 0xd6eaf8, 0xc8e7ff, 0xbcd9f5, 0xd8f3f0, 0xe4e9f7, 0xfff1a8, 0xffd6a5];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -16, data.emoji, { fontSize: "56px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(20, INK)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx };
    cont.on("pointerdown", function () { focusIndex = card.index; updateFocusRing(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function pointsForCombo(streak) {
    return 100 + Math.min(streak, 8) * 25;
  }

  function refreshScoreHud() {
    hudPoints.setText("Score: " + score + "  Best: " + best);
    hudLevel.setText("Level: " + level);
    hudMoves.setText("Moves: " + moves);
    if (combo >= 2) {
      hudCombo.setText("Combo x" + combo + "! Amazing!");
    } else if (combo === 1) {
      hudCombo.setText("Nice! Keep the streak going!");
    } else {
      hudCombo.setText("");
    }
  }

  function floatPoints(scene, x, y, text) {
    var t = scene.add.text(x, y - 60, text, textStyle(26, "#1b6f9e")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 110, alpha: 0.2, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) {
      firstPick = card;
      hudMsg.setText("One more!");
      announce("First card: " + card.data.name + ". Pick one more.");
      return;
    }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        // Gentle arcade celebration: smooth bounce only, no flashing.
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.1, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        matches++;
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        var gained = pointsForCombo(combo - 1);
        score += gained;
        if (score > best) { best = score; }
        refreshScoreHud();
        hudScore.setText("Pairs: " + matches + " / " + pairsGoal);
        floatPoints(scene, card.view.x, card.view.y, "+" + gained);
        if (matches === pairsGoal) {
          hudMsg.setText("You did it!");
          announce("You found all " + pairsGoal + " pairs. Score " + score + ".");
        } else {
          hudMsg.setText(combo >= 2 ? "Combo x" + combo + "! \u{1F389}" : "Yay! A pair! \u{1F389}");
          announce("Pair found: " + card.data.name + ". Plus " + gained + " points. " + (pairsGoal - matches) + " pairs left.");
        }
        lockBoard = false;
        if (matches === pairsGoal) { showWin(scene); }
      }, 350);
    } else {
      // No penalty: score stays, streak gently resets with encouragement.
      combo = 0;
      refreshScoreHud();
      hudMsg.setText("Good try! \u{1F340}");
      announce("Not a match. Try again. No points lost.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -195, 600, 390, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-300, -195, 600, 390, 30);
    var title = scene.add.text(0, -125, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38, INK)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Flip the cards and find\nall 6 animal pairs!\nMatches build your combo for bonus points!", Object.assign(textStyle(22, INK), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 75, "Mouse: click a card. Keyboard: arrows + Enter.", textStyle(16, INK)).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 95, 260, 64, 32);
    var btnTx = scene.add.text(0, 127, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 95, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    announce("Game started. Level " + level + ". Use arrow keys and Enter, or click a card.");
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -180, 600, 360, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(40, INK)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(23, INK), { align: "center" })).setOrigin(0.5);
    var againBg = scene.add.graphics();
    againBg.fillStyle(ACCENT, 1); againBg.fillRoundedRect(-270, 45, 250, 62, 31);
    var againTx = scene.add.text(-145, 76, "\u21BB Replay", textStyle(24, "#ffffff")).setOrigin(0.5);
    endNextBg = scene.add.graphics();
    endNextBg.fillStyle(0x1b9aaa, 1); endNextBg.fillRoundedRect(20, 45, 250, 62, 31);
    endNextTx = scene.add.text(145, 76, "Next Level \u25B6", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, againBg, againTx, endNextBg, endNextTx]);
    againBg.setInteractive(new Phaser.Geom.Rectangle(-270, 45, 250, 62), Phaser.Geom.Rectangle.Contains);
    againBg.on("pointerdown", function () { restart(scene); });
    endNextBg.setInteractive(new Phaser.Geom.Rectangle(20, 45, 250, 62), Phaser.Geom.Rectangle.Contains);
    endNextBg.on("pointerdown", function () { nextLevel(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endDetail.setText("Level " + level + " clear! " + pairsGoal + " pairs!\nScore: " + score + "  Best combo: x" + Math.max(bestCombo, 1) + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389} Press N for next level!");
    announce("Level " + level + " complete. Score " + score + ". Press N for next level, R to replay.");
    // Gentle celebration drift: slow falling shells, steady fade, no flashing.
    for (var i = 0; i < 30; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1600, 2600), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function resetRoundState(scene) {
    moves = 0; matches = 0; combo = 0; firstPick = null; lockBoard = false; started = true;
    refreshScoreHud();
    hudScore.setText("Pairs: 0 / " + pairCountForLevel(level));
    hudMsg.setText("Tap a card! Level " + level);
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function restart(scene) {
    resetRoundState(scene);
    announce("Level " + level + " restarted. Score kept at " + score + ".");
  }

  function nextLevel(scene) {
    level++;
    bestCombo = 0;
    resetRoundState(scene);
    announce("Now on level " + level + " with " + pairsGoal + " pairs. Good luck!");
  }

  function updateFocusRing() {
    var card = cards[focusIndex];
    if (!card) { return; }
    if (!focusRing) {
      var sc = card.view.scene;
      focusRing = sc.add.graphics().setDepth(5);
    }
    var scene = card.view.scene;
    focusRing.clear();
    focusRing.lineStyle(5, 0x1b9aaa, 1);
    focusRing.strokeRoundedRect(card.view.x - 98, card.view.y - 66, 196, 132, 22);
    scene.children.bringToTop(focusRing);
    if (endOverlay) { scene.children.bringToTop(endOverlay); }
    if (startOverlay && startOverlay.visible) { scene.children.bringToTop(startOverlay); }
  }

  function setupKeyboard(scene) {
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && startOverlay && startOverlay.visible) {
        startGame(scene);
        return;
      }
      if ((e.key === "n" || e.key === "N") && endOverlay && endOverlay.visible) {
        nextLevel(scene);
        return;
      }
      if (e.key === "r" || e.key === "R") {
        restart(scene);
        return;
      }
      if (!started || !cards.length) { return; }
      var cols = 4;
      var handled = true;
      if (e.key === "ArrowLeft") { focusIndex = (focusIndex + cards.length - 1) % cards.length; }
      else if (e.key === "ArrowRight") { focusIndex = (focusIndex + 1) % cards.length; }
      else if (e.key === "ArrowUp") { focusIndex = (focusIndex + cards.length - cols) % cards.length; }
      else if (e.key === "ArrowDown") { focusIndex = (focusIndex + cols) % cards.length; }
      else if (e.key === "Enter" || e.key === " ") { onCard(scene, cards[focusIndex]); }
      else { handled = false; }
      if (handled) {
        e.preventDefault();
        updateFocusRing();
      }
    });
    var canvas = document.querySelector("#game canvas");
    if (canvas) {
      canvas.setAttribute("tabindex", "0");
      canvas.setAttribute("role", "application");
      canvas.setAttribute("aria-label", "Farmyard memory match card game. Use arrow keys and Enter to flip cards.");
    }
  }

  function update(time, delta) {
    var dt = Math.min(delta / 1000, 0.05);
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.wobble += dt * 1.2;
      b.y -= b.speed * dt;
      b.x += Math.sin(b.wobble) * 12 * dt;
      if (b.y < 170) {
        b.y = 660;
        b.x = 20 + Math.random() * (W - 40);
      }
    }
  }
})();
</script>
</body>
</html>
