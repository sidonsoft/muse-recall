<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#dff1f8;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.25)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game"></div>
<p id="status" class="sr-only" aria-live="polite">Farmyard Match loaded. Press Enter to start.</p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;
  var TIME_START = 90, MATCH_BONUS_S = 4, MISS_PENALTY_S = 3, FRENZY_S = 15;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0, timeLeft = TIME_START, timerOn = false, over = false;
  var cursorIdx = 0, audioCtx = null, lastWholeSec = -1;
  var hudMoves, hudScore, hudPts, hudTime, hudCombo, hudMsg, endOverlay, endTitle, endDetail, startOverlay, cursorGfx, timeBar;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupA11y(s);
    drawCursor(s);
    announce("Farmyard Match loaded. Press Enter to start.");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbde0fe, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xcaf0f8, 1); g.fillEllipse(0, 620, 700, 260);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn in ocean palette
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x468faf, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0x4EA8DE, 0x48cae4, 0x90e0ef, 0x0096c7];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a6f97, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { audioCtx = new AC(); }
      }
      if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { audioCtx = null; }
  }

  function tone(freq, dur, type, vol, delay) {
    if (!audioCtx) { return; }
    try {
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.015);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  function sfxFlip() { tone(520, 0.08, "square", 0.05, 0); }
  function sfxMatch() { tone(660, 0.1, "square", 0.07, 0); tone(880, 0.12, "square", 0.07, 0.09); tone(1320, 0.16, "square", 0.06, 0.18); }
  function sfxMiss() { tone(220, 0.16, "sawtooth", 0.05, 0); tone(160, 0.2, "sawtooth", 0.05, 0.1); }
  function sfxWin() { var n = [523, 659, 784, 1047, 1319]; for (var i = 0; i < n.length; i++) { tone(n[i], 0.16, "square", 0.07, i * 0.11); } }
  function sfxLose() { var n2 = [400, 340, 280, 200]; for (var j = 0; j < n2.length; j++) { tone(n2[j], 0.2, "sawtooth", 0.06, j * 0.14); } }
  function sfxTick() { tone(980, 0.06, "square", 0.045, 0); }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(21));
    hudScore = scene.add.text(24, 76, "Pairs: 0 / 6", textStyle(21));
    hudPts = scene.add.text(24, 102, "Score: 0", textStyle(22, "#0a7aa8"));
    hudTime = scene.add.text(W / 2, 34, "\u23F1 90", textStyle(34)).setOrigin(0.5, 0);
    hudCombo = scene.add.text(W / 2, 72, "Streak x0  \u2022  Best x0", textStyle(19, "#0a7aa8")).setOrigin(0.5, 0);
    timeBar = scene.add.graphics();
    drawTimeBar();
    hudMsg = scene.add.text(W - 24, 48, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 108);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    btn.setData("role", "restart");
    scene.add.text(W / 2, 128, "Beat the clock! Pair = +4s   Miss = -3s   Streaks multiply!", textStyle(18, "#33566d")).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var bw = 260, bx = W / 2 - bw / 2, by = 100, bh = 12;
    timeBar.fillStyle(0x102A43, 0.15); timeBar.fillRoundedRect(bx, by, bw, bh, 6);
    var frac = Math.max(0, Math.min(1, timeLeft / TIME_START));
    var col = timeLeft <= 15 ? 0xe63946 : (timeLeft <= 30 ? 0xf4a261 : 0x4EA8DE);
    if (frac > 0) { timeBar.fillStyle(col, 1); timeBar.fillRoundedRect(bx, by, Math.max(12, bw * frac), bh, 6); }
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPts.setText("Score: " + score);
    hudTime.setText("\u23F1 " + Math.ceil(Math.max(0, timeLeft)));
    hudCombo.setText("Streak x" + streak + "  \u2022  Best x" + bestStreak + (timeLeft <= FRENZY_S && timerOn ? "  \u2022  FRENZY x2!" : ""));
    hudTime.setColor(timeLeft <= 15 ? "#c1121f" : "#102A43");
    drawTimeBar();
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4;
    var cw = 185, ch = 132, gx = 62, gy = 188, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.lineStyle(3, 0x2a7fad, 0.6);
    back.strokeRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0x48cae4, 0xbde0fe, 0xffddd2];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "58px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 42, data.name, textStyle(21)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, idx: idx };
    cont.on("pointerdown", function () { ensureAudio(); onCard(scene, card); });
    return card;
  }

  function drawCursor(scene) {
    if (!cursorGfx) { cursorGfx = scene.add.graphics().setDepth(5); }
    cursorGfx.clear();
    if (!started || over) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[cursorIdx];
    if (!card) { return; }
    var w = card.view.width || 185, h = card.view.height || 132;
    cursorGfx.lineStyle(4, 0x023e8a, 1);
    cursorGfx.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function moveCursor(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(cursorIdx / cols), c = cursorIdx % cols;
    c = (c + dx + cols) % cols;
    r = (r + dy + 3) % 3;
    cursorIdx = r * cols + c;
    drawCursor(scene);
    var nm = cards[cursorIdx] ? cards[cursorIdx].data.name : "";
    announce("Selected card " + (cursorIdx + 1) + " of 12.");
    tone(440, 0.05, "square", 0.03, 0);
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-LEFT", function () { moveCursor(scene, -1, 0); });
    kb.on("keydown-RIGHT", function () { moveCursor(scene, 1, 0); });
    kb.on("keydown-UP", function () { moveCursor(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveCursor(scene, 0, 1); });
    kb.on("keydown-ENTER", function () { ensureAudio(); activatePrimary(scene); });
    kb.on("keydown-SPACE", function () { ensureAudio(); activatePrimary(scene); });
    kb.on("keydown-R", function () { ensureAudio(); restart(scene); });
  }

  function activatePrimary(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    var card = cards[cursorIdx];
    if (card) { onCard(scene, card); }
  }

  function setupA11y(scene) {
    try {
      var cv = scene.sys.canvas;
      if (cv) {
        cv.setAttribute("tabindex", "0");
        cv.setAttribute("role", "application");
        cv.setAttribute("aria-label", "Farmyard Match memory game. Use arrow keys to choose a card, Enter to flip, R to restart.");
      }
    } catch (e) {}
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 120, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 120, onComplete: done || function () {} });
    }});
  }

  function floatText(scene, x, y, msg, color, size) {
    var t = scene.add.text(x, y, msg, textStyle(size || 26, color || "#0a7aa8")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y, big) {
    var glyphs = ["\u2B50", "\u2728", "\u{1F389}", "\u{1F30A}"];
    var n = big ? 14 : 8;
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(x, y, glyphs[i % glyphs.length], { fontSize: (18 + Math.random() * 22) + "px" }).setDepth(14);
      scene.tweens.add({
        targets: p,
        x: x + Phaser.Math.Between(-110, 110),
        y: y + Phaser.Math.Between(-90, 40),
        alpha: 0, duration: Phaser.Math.Between(500, 900), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p)
      });
    }
  }

  function onCard(scene, card) {
    if (!started || over || lockBoard || card.faceUp || card.matched) { return; }
    if (!timerOn) { timerOn = true; }
    cursorIdx = cards.indexOf(card);
    drawCursor(scene);
    flip(card, true);
    sfxFlip();
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var frenzy = timeLeft <= FRENZY_S ? 2 : 1;
        var gain = 100 * Math.max(1, streak) * frenzy;
        score += gain;
        timeLeft = Math.min(99, timeLeft + MATCH_BONUS_S);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.1, yoyo: true, duration: 150 });
        scene.cameras.main.shake(90, 0.003);
        burst(scene, card.view.x, card.view.y, streak >= 3);
        floatText(scene, card.view.x, card.view.y - 60, "+" + gain + (streak > 1 ? "  x" + streak : ""), frenzy === 2 ? "#e63946" : "#0a7aa8", streak >= 3 ? 30 : 26);
        sfxMatch();
        matches++;
        refreshHud();
        hudMsg.setText(matches === 6 ? "You did it!" : (streak >= 3 ? "ON FIRE! x" + streak + " \u{1F525}" : "Yay! +4s \u{1F389}"));
        announce("Pair found! " + matches + " of 6. Score " + score + ". Streak " + streak + ". " + Math.ceil(timeLeft) + " seconds left.");
        lockBoard = false;
        drawCursor(scene);
        if (matches === 6) { showWin(scene); }
      }, 330);
    } else {
      hudMsg.setText("Miss! -3s \u{1F340}");
      setTimeout(function () {
        streak = 0;
        score = Math.max(0, score - 20);
        timeLeft -= MISS_PENALTY_S;
        sfxMiss();
        scene.cameras.main.shake(120, 0.006);
        floatText(scene, card.view.x, card.view.y - 50, "-20  -3s", "#c1121f", 24);
        refreshHud();
        announce("No match. Score " + score + ". " + Math.ceil(Math.max(0, timeLeft)) + " seconds left.");
        flip(a, false); flip(card, false, function () { lockBoard = false; drawCursor(scene); });
      }, 650);
    }
    refreshHud();
  }

  function startGame(scene) {
    ensureAudio();
    started = true; lockBoard = false; timerOn = true; over = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Go! Beat the clock!");
    refreshHud();
    drawCursor(scene);
    announce("Game started. 90 seconds. Find 6 pairs.");
    tone(660, 0.1, "square", 0.06, 0); tone(990, 0.14, "square", 0.06, 0.1);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -195, 600, 390, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -195, 600, 390, 30);
    var title = scene.add.text(0, -128, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -58, "Find all 6 pairs before the clock runs out!\nPair +4s  \u2022  Miss -3s  \u2022  Streaks multiply!", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 22, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 58, "Arrows pick a card  \u2022  Enter flips  \u2022  R restarts", textStyle(16, "#33566d")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 82, 260, 70, 35);
    var btnTx = scene.add.text(0, 117, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 82, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
    btnBg.on("pointerover", function () { btnTx.setScale(1.06); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -175, 580, 350, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -175, 580, 350, 30);
    endTitle = scene.add.text(0, -105, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -25, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 60, 260, 70, 35);
    var btnTx = scene.add.text(0, 95, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 60, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    btnBg.on("pointerover", function () { btnTx.setScale(1.06); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
  }

  function showWin(scene) {
    timerOn = false; over = true;
    var timeBonus = Math.ceil(Math.max(0, timeLeft)) * 10;
    score += timeBonus;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nScore: " + score + " (time bonus +" + timeBonus + ")\nBest streak x" + Math.max(1, bestStreak) + "  " + "\u2B50".repeat(stars) + "\nEnter = again   R = restart");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    sfxWin();
    refreshHud();
    announce("You win! Score " + score + " in " + moves + " moves.");
    for (var i = 0; i < 46; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F30A}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showTimeUp(scene) {
    timerOn = false; over = true; lockBoard = true;
    sfxLose();
    scene.cameras.main.shake(200, 0.008);
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  \u2022  Best streak x" + bestStreak + "\nEnter = retry   R = restart");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again!");
    announce("Time is up. Score " + score + ". You found " + matches + " of 6 pairs. Press Enter to retry.");
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    score = 0; streak = 0; bestStreak = 0; timeLeft = TIME_START; timerOn = true; over = false;
    cursorIdx = 0; lastWholeSec = -1;
    refreshHud();
    hudMsg.setText("Go! Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawCursor(scene);
    announce("New game. 90 seconds. Score zero.");
  }

  function update(time, delta) {
    if (!started || !timerOn || over) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= (delta || 16.6) / 1000;
    if (timeLeft <= 10.5) {
      var whole = Math.ceil(Math.max(0, timeLeft));
      if (whole !== lastWholeSec && whole > 0) { lastWholeSec = whole; sfxTick(); }
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      refreshHud();
      showTimeUp(this);
      return;
    }
    refreshHud();
  }
})();
</script>
</body>
</html>
