<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to move, Enter to flip a card."></div>
<div id="live" aria-live="polite" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, combo = 0, bestCombo = 0, timeLeft = 60, gameOver = false, focusIdx = 0;
  var hudMoves, hudScore, hudMsg, hudPoints, hudCombo, hudTime, timeBarBg, timeBar, focusRing;
  var endOverlay, endTitle, endDetail, startOverlay;
  var audioCtx = null;

  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.setTargetAtTime(0.0001, audioCtx.currentTime + dur, 0.03);
      o.stop(audioCtx.currentTime + dur + 0.05);
    } catch (e) {}
  }
  function announce(msg) {
    try { document.getElementById("live").textContent = msg; } catch (e) {}
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    // Arcade HUD: score under pairs, big timer center-top with time bar, combo under message.
    hudPoints = scene.add.text(24, 122, "Score: 0", textStyle(24, "#7a4a2b"));
    hudTime = scene.add.text(W / 2, 30, "60", textStyle(44, "#c2410c")).setOrigin(0.5, 0);
    var barBg = scene.add.graphics();
    barBg.fillStyle(0x000000, 0.15); barBg.fillRoundedRect(W / 2 - 130, 84, 260, 14, 7);
    timeBarBg = barBg;
    timeBar = scene.add.graphics();
    drawTimeBar();
    hudCombo = scene.add.text(W - 24, 88, "", textStyle(22, "#c2410c")).setOrigin(1, 0.5);
    // Keyboard focus ring (hidden until keyboard used or always faintly on first card).
    focusRing = scene.add.graphics().setDepth(5);
    scene.add.text(W / 2, 190, "Arrows move \u2022 Enter flips \u2022 match fast for COMBO x2 x3!", textStyle(15, "#8a6a4a")).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var frac = Math.max(0, timeLeft / 60);
    var color = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xffb703 : 0xef476f);
    timeBar.fillStyle(color, 1);
    timeBar.fillRoundedRect(W / 2 - 130, 84, 260 * frac, 14, 7);
  }

  function setFocus(idx) {
    if (!cards.length) { return; }
    focusIdx = ((idx % cards.length) + cards.length) % cards.length;
    if (!focusRing) { return; }
    focusRing.clear();
    var c = cards[focusIdx];
    if (!c) { return; }
    var w = (c.w || 185) + 10, h = (c.h || 132) + 10;
    focusRing.lineStyle(5, 0xffb703, 1);
    focusRing.strokeRoundedRect(c.view.x - w / 2, c.view.y - h / 2, w, h, 24);
  }

  function popup(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(30, color || "#c2410c")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, scale: 1.3, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function setupKeyboard(scene) {
    setFocus(0);
    document.addEventListener("keydown", function (ev) {
      var k = ev.key;
      if (startOverlay && startOverlay.visible) {
        if (k === "Enter" || k === " ") { startGame(scene); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (k === "Enter" || k === " ") { restart(scene); }
        return;
      }
      if (!started || gameOver) { return; }
      var cols = 4;
      if (k === "ArrowLeft") { setFocus(focusIdx - 1); }
      else if (k === "ArrowRight") { setFocus(focusIdx + 1); }
      else if (k === "ArrowUp") { setFocus(focusIdx - cols); }
      else if (k === "ArrowDown") { setFocus(focusIdx + cols); }
      else if (k === "Enter" || k === " ") {
        var card = cards[focusIdx];
        if (card) { onCard(scene, card); }
      } else { return; }
      try { ev.preventDefault(); } catch (e) {}
    });
  }

  function startGame(scene) {
    started = true; lockBoard = false; gameOver = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Go! Beat the clock!");
    announce("Game started. 60 seconds. Find 6 pairs.");
    beep(523, 0.12, "square"); setTimeout(function () { beep(784, 0.15, "square"); }, 120);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 132, gx = 62, gy = 210, padX = 22, padY = 14;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { setFocus(cards.indexOf(card)); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    beep(660, 0.07, "square", 0.04);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (gameOver) { return; }
        a.matched = card.matched = true;
        combo++;
        if (combo > bestCombo) { bestCombo = combo; }
        var gained = 100 * combo + Math.max(0, Math.ceil(timeLeft));
        score += gained;
        hudPoints.setText("Score: " + score);
        hudCombo.setText(combo > 1 ? ("COMBO x" + combo + " \u{1F525}") : "");
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        scene.cameras.main.flash(120, 255, 240, 200);
        popup(scene, card.view.x, card.view.y - 70, "+" + gained + (combo > 1 ? "  x" + combo : ""), "#c2410c");
        beep(523 + combo * 90, 0.12, "square", 0.07);
        setTimeout(function () { beep(784 + combo * 90, 0.14, "square", 0.07); }, 90);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "You did it!" : ("Yay! +" + gained + " \u{1F389}"));
        announce("Pair found! Score " + score + ". " + matches + " of 6 pairs.");
        focusRing.clear();
        lockBoard = false;
        if (matches === 6) { showEnd(scene, true); }
      }, 350);
    } else {
      combo = 0;
      score = Math.max(0, score - 10);
      hudPoints.setText("Score: " + score);
      hudCombo.setText("");
      hudMsg.setText("Miss! -10 \u{1F340}");
      beep(180, 0.18, "sawtooth", 0.05);
      try { scene.cameras.main.shake(150, 0.004); } catch (e) {}
      // Arcade pressure: cards flip back faster as you clear pairs.
      var delay = Math.max(320, 700 - matches * 70);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; setFocus(focusIdx); });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "60 seconds! Find all 6 pairs!\nStreaks build COMBO x2 x3 for big points.\nMisses cost 10 pts. Enter = Start.", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showEnd(scene, won) {
    gameOver = true; lockBoard = true;
    var stars;
    if (won) {
      var bonus = Math.ceil(timeLeft) * 10;
      score += bonus;
      hudPoints.setText("Score: " + score);
      stars = (moves <= 10 && timeLeft >= 20) ? 3 : ((moves <= 16 && timeLeft >= 8) ? 2 : 1);
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("All 6 pairs! Time bonus +" + bonus + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  Best combo x" + Math.max(1, bestCombo));
      hudMsg.setText("You win! \u{1F389}");
      announce("You win! Score " + score + " in " + moves + " moves.");
      beep(523, 0.12, "square", 0.08);
      setTimeout(function () { beep(659, 0.12, "square", 0.08); }, 130);
      setTimeout(function () { beep(784, 0.25, "square", 0.08); }, 260);
    } else {
      endTitle.setText("\u23F0 Time's Up! \u23F0");
      endDetail.setText("You found " + matches + " / 6 pairs.\nMoves: " + moves + "  Score: " + score + "\nBest combo x" + Math.max(1, bestCombo) + "\nPress Enter to retry!");
      hudMsg.setText("Time's up!");
      announce("Time is up. You found " + matches + " of 6 pairs. Score " + score + ".");
      beep(220, 0.3, "sawtooth", 0.07);
      setTimeout(function () { beep(147, 0.4, "sawtooth", 0.07); }, 250);
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    var n = won ? 60 : 25;
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0;
    timeLeft = 60; gameOver = false; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: 0"); hudCombo.setText(""); hudMsg.setText("Go! Beat the clock!");
    hudTime.setText("60").setColor("#c2410c");
    drawTimeBar();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    setFocus(0);
    announce("New game. 60 seconds. Find 6 pairs.");
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var dt = (delta || 16.7) / 1000;
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      hudTime.setText("0");
      drawTimeBar();
      showEnd(this, false);
      return;
    }
    var secs = "" + Math.ceil(timeLeft);
    if (hudTime.text !== secs) { hudTime.setText(secs); }
    drawTimeBar();
    if (timeLeft <= 10) {
      hudTime.setColor("#ef476f");
      var pulse = 1 + 0.08 * Math.sin(time * 0.02);
      hudTime.setScale(pulse);
      if (Math.ceil(timeLeft) !== Math.ceil(timeLeft + dt)) { beep(880, 0.06, "square", 0.05); }
    } else {
      hudTime.setColor("#c2410c");
      hudTime.setScale(1);
    }
  }
})();
</script>
</body>
</html>
