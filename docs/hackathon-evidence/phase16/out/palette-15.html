<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false, gameOver = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0;
  var TOTAL_TIME = 75, timeLeft = TOTAL_TIME, paused = false;
  var hudMoves, hudScore, hudMsg, hudScore2, hudTime, hudCombo, cursorRing;
  var endOverlay, endTitle, endDetail, startOverlay;
  var cursorIndex = 0, audioCtx = null;

  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
      o.stop(audioCtx.currentTime + (dur || 0.12));
    } catch (e) {}
  }
  function sfxMatch() { beep(660, 0.1, "square"); setTimeout(function () { beep(880, 0.14, "square"); }, 90); }
  function sfxMiss() { beep(220, 0.16, "sawtooth", 0.05); }
  function sfxWin() { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, 0.16, "square"); }, i * 120); }); }
  function sfxLose() { [400, 300, 220].forEach(function (f, i) { setTimeout(function () { beep(f, 0.18, "sawtooth", 0.05); }, i * 150); }); }
  function sfxTick() { beep(1200, 0.05, "square", 0.03); }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    cursorRing = s.add.graphics().setDepth(5);
    drawCursor();
    // Full keyboard operation: arrows move, Enter/Space flips, R restarts, P pauses.
    s.input.keyboard.on("keydown", function (e) {
      if (startOverlay && startOverlay.visible) {
        if (e.code === "Enter" || e.code === "Space") { startGame(s); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.code === "Enter" || e.code === "Space" || e.code === "KeyR") { restart(s); }
        return;
      }
      if (e.code === "KeyR") { restart(s); return; }
      if (e.code === "KeyP") { togglePause(s); return; }
      if (!started || gameOver || paused) { return; }
      var cols = 4;
      if (e.code === "ArrowLeft") { cursorIndex = (cursorIndex + 11) % 12; drawCursor(); e.preventDefault(); }
      else if (e.code === "ArrowRight") { cursorIndex = (cursorIndex + 1) % 12; drawCursor(); e.preventDefault(); }
      else if (e.code === "ArrowUp") { cursorIndex = (cursorIndex + 8) % 12; drawCursor(); e.preventDefault(); }
      else if (e.code === "ArrowDown") { cursorIndex = (cursorIndex + 4) % 12; drawCursor(); e.preventDefault(); }
      else if (e.code === "Enter" || e.code === "Space") {
        e.preventDefault();
        if (cards[cursorIndex]) { onCard(s, cards[cursorIndex]); }
      }
    });
    // Click (not drag) selects the keyboard cursor too, so mouse + keyboard stay in sync.
    s.input.on("pointerdown", function (ptr) {
      for (var i = 0; i < cards.length; i++) {
        var b = cards[i].view.getBounds();
        if (b.contains(ptr.x, ptr.y)) { cursorIndex = i; drawCursor(); break; }
      }
    });
  }

  function drawCursor() {
    if (!cursorRing || !cards.length) { return; }
    cursorRing.clear();
    var c = cards[cursorIndex];
    if (!c || c.matched) { return; }
    var b = c.view.getBounds();
    // Ocean accent ring so keyboard focus is always visible.
    cursorRing.lineStyle(5, 0x4EA8DE, 1);
    cursorRing.strokeRoundedRect(b.x - 4, b.y - 4, b.width + 8, b.height + 8, 24);
  }

  function togglePause(scene) {
    if (!started || gameOver || (endOverlay && endOverlay.visible)) { return; }
    paused = !paused;
    hudMsg.setText(paused ? "Paused (P)" : "Tap a card!");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe6f4fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbfe3c3, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudScore2 = scene.add.text(24, 122, "Score: 0", textStyle(24, "#0b6e99"));
    hudTime = scene.add.text(W / 2, 40, "⏱ 75", textStyle(34, "#0b6e99")).setOrigin(0.5, 0);
    hudCombo = scene.add.text(W / 2, 80, "", textStyle(22, "#d2691e")).setOrigin(0.5, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#334e68")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Beat the clock! Match = +time, miss = -3s. Arrows+Enter work. (P pause, R restart)", textStyle(17, "#486581")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function floatText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(26, color || "#0b6e99")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y) {
    for (var i = 0; i < 10; i++) {
      var p = scene.add.text(x, y, ["✦", "★", "●"][i % 3], { fontSize: "22px", color: "#4EA8DE" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-90, 60), alpha: 0, duration: Phaser.Math.Between(400, 800), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onCard(scene, card) {
    if (!started || gameOver || paused || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    beep(500, 0.06, "square", 0.03);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.15, yoyo: true, duration: 160 });
        burst(scene, card.view.x, card.view.y);
        burst(scene, a.view.x, a.view.y);
        sfxMatch();
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 50 + Math.ceil(timeLeft);
        score += gained;
        timeLeft = Math.min(timeLeft + 4, 99);
        hudScore.setText("Pairs: " + matches + " / 6");
        hudScore2.setText("Score: " + score);
        hudCombo.setText(streak >= 2 ? "🔥 Combo x" + streak + "!" : "");
        floatText(scene, card.view.x, card.view.y - 60, "+" + gained + (streak >= 2 ? " x" + streak : ""));
        hudMsg.setText(matches === 6 ? "You did it!" : "Yay! +" + gained + " \u{1F389}");
        lockBoard = false;
        drawCursor();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      hudCombo.setText("");
      timeLeft = Math.max(timeLeft - 3, 0);
      hudMsg.setText("Miss! -3s \u{1F340}");
      sfxMiss();
      scene.cameras.main.shake(150, 0.006);
      floatText(scene, card.view.x, card.view.y - 60, "-3s", "#d64545");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 550);
    }
  }

  function startGame(scene) {
    started = true; gameOver = false; paused = false; lockBoard = false;
    timeLeft = TOTAL_TIME;
    startOverlay.setVisible(false);
    hudMsg.setText("Beat the clock!");
    beep(700, 0.1, "square");
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -125, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "ARCADE: 75 seconds!\nMatch = +4s & points. Miss = -3s.\nChain pairs for COMBO bonus!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    gameOver = true;
    var timeBonus = Math.ceil(timeLeft) * 10;
    score += timeBonus;
    var stars = (moves <= 10 && timeLeft >= 20) ? 3 : ((moves <= 16 || timeLeft >= 10) ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs! Time bonus +" + timeBonus + "\nScore: " + score + "  Moves: " + moves + "\nBest combo x" + Math.max(bestStreak, 1) + "  " + "\u2B50".repeat(stars));
    hudScore2.setText("Score: " + score);
    sfxWin();
    showEnd(scene, true);
  }

  function showGameOver(scene) {
    gameOver = true;
    lockBoard = true;
    endTitle.setText("⏱ Time Up!");
    endDetail.setText("You found " + matches + " / 6 pairs\nScore: " + score + "  Moves: " + moves + "\nBest combo x" + Math.max(bestStreak, 1) + "\nFaster matching = more time!");
    hudMsg.setText("Time up! Play again?");
    sfxLose();
    showEnd(scene, false);
  }

  function showEnd(scene, won) {
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText(won ? "You win! \u{1F389}" : "Time up! \u23F0");
    var icons = won ? ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"] : ["\u23F0", "\u{1F340}", "\u{1F404}"];
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, icons[i % icons.length], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false; paused = false;
    timeLeft = TOTAL_TIME; cursorIndex = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudScore2.setText("Score: 0"); hudCombo.setText("");
    hudTime.setText("⏱ " + TOTAL_TIME); hudTime.setColor("#0b6e99");
    hudMsg.setText("Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawCursor();
  }

  var lastTickSecond = -1;
  function update(time, delta) {
    if (!started || gameOver || paused) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      hudTime.setText("⏱ 0");
      var scene = hudTime.scene;
      showGameOver(scene);
      return;
    }
    var secs = Math.ceil(timeLeft);
    hudTime.setText("⏱ " + secs);
    if (timeLeft <= 10) {
      hudTime.setColor("#d64545");
      if (secs !== lastTickSecond) { lastTickSecond = secs; sfxTick(); }
    } else if (timeLeft <= 20) {
      hudTime.setColor("#d2691e");
    } else {
      hudTime.setColor("#0b6e99");
    }
  }
})();
</script>
</body>
</html>
