<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, combo = 0, bestCombo = 0, level = 1, timeLeft = 90, timeMax = 90, gameOver = false;
  var hudMoves, hudScore, hudMsg, hudTime, hudPoints, hudCombo, timeBarBg, timeBar, endOverlay, endTitle, endDetail, startOverlay, endNextBg, endNextTx;
  var timerEvent = null, cursorIndex = 0, cursorBox = null, liveEl = null;

  function announce(msg) {
    if (!liveEl) { liveEl = document.getElementById("live"); }
    if (liveEl) { liveEl.textContent = msg; }
  }

  function levelTime(lv) { return Math.max(45, 90 - (lv - 1) * 10); }
  function mismatchDelay() { return Math.max(380, 700 - (level - 1) * 60); }

  function create() {
    var s = this;
    timeMax = levelTime(level); timeLeft = timeMax;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    if (s.canvas) { s.canvas.setAttribute("aria-label", "Farmyard Match memory card game. Use arrow keys and Enter to play."); }
    else { var c = document.querySelector("canvas"); if (c) { c.setAttribute("aria-label", "Farmyard Match memory card game. Use arrow keys and Enter to play."); } }
    announce("Farmyard Match loaded. Press Enter to start.");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudPoints = scene.add.text(24, 122, "Score: 0  Lv 1", textStyle(24, "#b34700"));
    hudTime = scene.add.text(W - 24, 28, "⏱ 90", textStyle(28, "#7a4a2b")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 62, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    hudCombo = scene.add.text(W - 24, 90, "", textStyle(22, "#e07b00")).setOrigin(1, 0);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0x000000, 0.12); timeBarBg.fillRoundedRect(24, 152, W / 2 - 40, 14, 7);
    timeBar = scene.add.graphics();
    drawTimeBar();
    var btn = scene.add.container(W - 110, 124);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 172, "Match fast for COMBO bonus! +4s per pair!", textStyle(20, "#8a6a4a")).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var frac = Math.max(0, timeLeft / timeMax);
    var w = Math.round((W / 2 - 40) * frac);
    var col = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xffb703 : 0xe63946);
    timeBar.fillStyle(col, 1);
    if (w > 0) { timeBar.fillRoundedRect(24, 152, w, 14, 7); }
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPoints.setText("Score: " + score + "  Lv " + level);
    hudTime.setText("⏱ " + Math.ceil(timeLeft));
    hudTime.setColor(timeLeft <= 15 ? "#c1121f" : "#7a4a2b");
    hudCombo.setText(combo >= 2 ? ("🔥 COMBO x" + combo) : "");
    drawTimeBar();
  }

  function startTimer(scene) {
    stopTimer();
    timerEvent = scene.time.addEvent({ delay: 250, loop: true, callback: function () {
      if (!started || gameOver) { return; }
      timeLeft -= 0.25;
      if (timeLeft <= 10.25 && timeLeft > 0 && Math.abs(timeLeft % 1) < 0.26) {
        scene.tweens.add({ targets: hudTime, scale: { from: 1.25, to: 1 }, duration: 200 });
      }
      if (timeLeft <= 0) { timeLeft = 0; refreshHud(); showGameOver(scene); return; }
      refreshHud();
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function burst(scene, x, y, words) {
    var t = scene.add.text(x, y, words, textStyle(30, "#e07b00")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 70, alpha: 0, scale: 1.3, duration: 800, onComplete: function () { t.destroy(); } });
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c && c.view) { c.view.destroy(); } });
    cards = [];
    firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    cursorIndex = 0;
    drawCursor(scene);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () {
      var i = cards.indexOf(card);
      if (i >= 0) { cursorIndex = i; drawCursor(scene); }
      onCard(scene, card);
    });
    cont.on("pointerover", function () {
      var i = cards.indexOf(card);
      if (i >= 0) { cursorIndex = i; drawCursor(scene); }
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce(card.data.name + " turned. Pick one more card."); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        matches++;
        combo++;
        if (combo > bestCombo) { bestCombo = combo; }
        var pts = 100 + (combo - 1) * 50 + Math.ceil(timeLeft);
        score += pts;
        timeLeft = Math.min(timeMax, timeLeft + 4);
        burst(scene, card.view.x, card.view.y - 60, "+" + pts);
        if (combo >= 2) { burst(scene, W / 2, 260, "🔥 COMBO x" + combo + "!"); }
        hudMsg.setText(matches === 6 ? "You did it!" : ("Yay! A pair! \u{1F389} +4s"));
        announce("Pair found! " + card.data.name + ". Score " + score + ". " + matches + " of 6 pairs.");
        refreshHud();
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      timeLeft = Math.max(0.5, timeLeft - 2);
      hudMsg.setText("Miss! -2s \u{1F340}");
      announce("No match. Combo lost. 2 seconds penalty.");
      scene.cameras.main.shake(150, 0.004);
      refreshHud();
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, mismatchDelay());
    }
    refreshHud();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -52, "ARCADE: beat the clock!\n6 pairs, +4s per match, -2s per miss.\nStreaks build COMBO bonus points!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 32, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-265, 60, 250, 64, 32);
    var btnTx = scene.add.text(-140, 92, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endNextBg = scene.add.graphics();
    endNextBg.fillStyle(0xe07b00, 1); endNextBg.fillRoundedRect(15, 60, 250, 64, 32);
    endNextTx = scene.add.text(140, 92, "Next Level \u25B6", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, endNextBg, endNextTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-265, 60, 250, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    endNextBg.setInteractive(new Phaser.Geom.Rectangle(15, 60, 250, 64), Phaser.Geom.Rectangle.Contains);
    endNextBg.on("pointerdown", function () { nextLevel(scene); });
  }

  function showWin(scene) {
    stopTimer();
    gameOver = false;
    var timeBonus = Math.ceil(timeLeft) * 5;
    score += timeBonus;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} Level " + level + " Clear! \u{1F389}");
    endDetail.setText("6 pairs in " + moves + " moves!  " + "\u2B50".repeat(stars) + "\nScore: " + score + " (time bonus +" + timeBonus + ")\nBest combo x" + Math.max(bestCombo, 1) + "  •  Next: " + levelTime(level + 1) + "s!");
    endNextBg.setVisible(true); endNextTx.setVisible(true);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("Level " + level + " clear! Score " + score + ". Press N for next level, or Enter to play again.");
    refreshHud();
    for (var i = 0; i < 70; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "🔥"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showGameOver(scene) {
    if (gameOver) { return; }
    gameOver = true; lockBoard = true; firstPick = null;
    stopTimer();
    combo = 0;
    endTitle.setText("⏰ Time's Up!");
    endDetail.setText("Level " + level + " • Score: " + score + "\nPairs: " + matches + " / 6 in " + moves + " moves\nPress Enter to retry!");
    endNextBg.setVisible(false); endNextTx.setVisible(false);
    endOverlay.setVisible(true);
    scene.cameras.main.shake(250, 0.008);
    hudMsg.setText("Time's up! \u23F0");
    announce("Time is up. Score " + score + ". Press Enter to try again.");
    refreshHud();
  }

  function startGame(scene) {
    started = true; gameOver = false; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    if (endOverlay) { endOverlay.setVisible(false); }
    timeMax = levelTime(level); timeLeft = timeMax;
    refreshHud();
    hudMsg.setText("Go! Beat the clock!");
    announce("Level " + level + " started. " + Math.ceil(timeLeft) + " seconds. Find 6 pairs.");
    startTimer(scene);
  }

  function restart(scene) {
    level = 1; score = 0; combo = 0; bestCombo = 0;
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeMax = levelTime(level); timeLeft = timeMax;
    refreshHud(); hudMsg.setText("Go! Beat the clock!");
    announce("Game restarted. Level 1, " + timeMax + " seconds.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    startTimer(scene);
  }

  function nextLevel(scene) {
    level++;
    moves = 0; matches = 0; combo = 0; firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeMax = levelTime(level); timeLeft = timeMax;
    refreshHud(); hudMsg.setText("Level " + level + "! Faster!");
    announce("Level " + level + " started with " + timeMax + " seconds. Score kept: " + score + ".");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    startTimer(scene);
  }

  function drawCursor(scene) {
    if (!cards.length) { return; }
    if (cursorIndex < 0) { cursorIndex = 0; }
    if (cursorIndex >= cards.length) { cursorIndex = cards.length - 1; }
    if (cursorBox) { cursorBox.destroy(); cursorBox = null; }
    var card = cards[cursorIndex];
    cursorBox = scene.add.graphics().setDepth(5);
    cursorBox.lineStyle(6, 0xe07b00, 1);
    cursorBox.strokeRoundedRect(card.view.x - 99, card.view.y - 76, 198, 152, 24);
  }

  function moveCursor(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var i = cursorIndex + dx + dy * cols;
    var r = Math.floor(cursorIndex / cols), c = cursorIndex % cols;
    var nr = r + dy, nc = c + dx;
    if (nr < 0) { nr = 2; } if (nr > 2) { nr = 0; }
    if (nc < 0) { nc = 3; } if (nc > 3) { nc = 0; }
    cursorIndex = nr * cols + nc;
    drawCursor(scene);
    if (started && !endOverlay.visible) {
      announce("Card " + (cursorIndex + 1) + " of 12.");
    }
    void i;
  }

  function pressCursor(scene) {
    if (!cards.length) { return; }
    if (!started || (startOverlay && startOverlay.visible)) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) {
      if (endNextBg && endNextBg.visible) { nextLevel(scene); } else { restart(scene); }
      return;
    }
    onCard(scene, cards[cursorIndex]);
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-LEFT", function () { moveCursor(scene, -1, 0); });
    kb.on("keydown-A", function () { moveCursor(scene, -1, 0); });
    kb.on("keydown-RIGHT", function () { moveCursor(scene, 1, 0); });
    kb.on("keydown-D", function () { moveCursor(scene, 1, 0); });
    kb.on("keydown-UP", function () { moveCursor(scene, 0, -1); });
    kb.on("keydown-W", function () { moveCursor(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveCursor(scene, 0, 1); });
    kb.on("keydown-S", function () { moveCursor(scene, 0, 1); });
    kb.on("keydown-ENTER", function () { pressCursor(scene); });
    kb.on("keydown-SPACE", function () { pressCursor(scene); });
    kb.on("keydown-R", function () { restart(scene); });
    kb.on("keydown-N", function () { if (endOverlay && endOverlay.visible && endNextBg && endNextBg.visible) { nextLevel(scene); } });
  }

  function update() {
    if (cursorBox) {
      cursorBox.setScale(1 + Math.sin(Date.now() / 240) * 0.012);
    }
  }
})();
</script>
</body>
</html>
