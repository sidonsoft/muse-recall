<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to choose a card and Enter to flip it."></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var TIME_LIMIT = 60, timeLeft = 60, score = 0, combo = 0, bestCombo = 0, over = false;
  var lastTick = 0;
  var hudMoves, hudScore, hudMsg, hudTime, hudPts, hudHint, endOverlay, endTitle, endDetail, startOverlay;
  var timeBarG, selBox, selectedIdx = 0, comboFx = null, audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    addArcadeDecor(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    unlockAudio(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function addArcadeDecor(scene) {
    // Pulsing sun halo + drifting clouds for arcade energy (purely cosmetic).
    var halo = scene.add.graphics();
    halo.lineStyle(5, 0xffb703, 0.9);
    halo.strokeCircle(770, 110, 50);
    scene.tweens.add({ targets: halo, alpha: 0.25, scale: 1.12, yoyo: true, repeat: -1, duration: 700, ease: "Sine.easeInOut" });
    var c1 = scene.add.graphics();
    c1.fillStyle(0xffffff, 0.95);
    c1.fillEllipse(180, 110, 150, 48); c1.fillEllipse(240, 100, 120, 44);
    var c2 = scene.add.graphics();
    c2.fillStyle(0xffffff, 0.9);
    c2.fillEllipse(560, 80, 140, 44);
    scene.tweens.add({ targets: c1, x: 26, yoyo: true, repeat: -1, duration: 3600, ease: "Sine.easeInOut" });
    scene.tweens.add({ targets: c2, x: -30, yoyo: true, repeat: -1, duration: 4400, ease: "Sine.easeInOut" });
  }

  function unlockAudio(scene) {
    var go = function () {
      try {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
      } catch (e) { audioCtx = null; }
    };
    scene.input.on("pointerdown", go);
    var kb = scene.input.keyboard;
    if (kb) { kb.on("keydown", go); }
  }

  function beep(freq, dur, type, vol, when) {
    try {
      if (!audioCtx) { return; }
      var t = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + (dur || 0.12) + 0.02);
    } catch (e) {}
  }

  function sfxFlip() { beep(520, 0.08, "square", 0.05); }
  function sfxMatch(n) { beep(660, 0.1, "square", 0.07); beep(880, 0.12, "square", 0.07, 0.09); if (n >= 2) { beep(1320, 0.16, "square", 0.07, 0.18); } }
  function sfxMiss() { beep(180, 0.22, "sawtooth", 0.06); }
  function sfxTick() { beep(1100, 0.06, "square", 0.05); }
  function sfxWin() { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.16, "square", 0.07, i * 0.12); }); }
  function sfxLose() { [400, 320, 240, 160].forEach(function (f, i) { beep(f, 0.2, "sawtooth", 0.06, i * 0.14); }); }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudTime = scene.add.text(W / 2, 22, "Time: 60", textStyle(30, "#b23a2a")).setOrigin(0.5, 0);
    hudPts = scene.add.text(W / 2, 56, "Score: 0", textStyle(24, "#5b3a29")).setOrigin(0.5, 0);
    timeBarG = scene.add.graphics();
    drawTimeBar();
    scene.add.text(W / 2, 168, "Find the 6 animal pairs!  Match = +4s, miss = -3s", textStyle(20, "#8a6a4a")).setOrigin(0.5);
    hudHint = scene.add.text(W / 2, 668, "Arrows: choose  •  Enter: flip  •  R: restart", textStyle(16, "#7a5a3a")).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!timeBarG) { return; }
    timeBarG.clear();
    var bw = 300, bh = 14, bx = W / 2 - bw / 2, by = 122;
    var frac = Math.max(0, timeLeft / TIME_LIMIT);
    timeBarG.fillStyle(0x000000, 0.15); timeBarG.fillRoundedRect(bx, by, bw, bh, 7);
    var col = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xffb703 : 0xe63946);
    timeBarG.fillStyle(col, 1); timeBarG.fillRoundedRect(bx, by, Math.max(14, bw * frac), bh, 7);
    if (hudTime) {
      hudTime.setText("Time: " + Math.ceil(timeLeft));
      hudTime.setColor(frac > 0.25 ? "#b23a2a" : "#e63946");
    }
    if (hudPts) { hudPts.setText("Score: " + score); }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    if (selBox) { selBox.destroy(); selBox = null; }
    if (comboFx) { comboFx.destroy(); comboFx = null; }
    firstPick = null;
    cards = [];
    selectedIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    selBox = scene.add.graphics().setDepth(5);
    drawSelector();
  }

  function drawSelector() {
    if (!selBox || !cards.length) { return; }
    selBox.clear();
    if (!started || over) { return; }
    var card = cards[selectedIdx];
    if (!card || card.matched) { return; }
    var w = 185, h = 140;
    selBox.lineStyle(5, 0xffb703, 1);
    selBox.strokeRoundedRect(card.view.x - w / 2 - 5, card.view.y - h / 2 - 5, w + 10, h + 10, 26);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () {
      selectedIdx = cards.indexOf(card);
      drawSelector();
      onCard(scene, card);
    });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) { scene.tweens.add({ targets: cont, scale: 1.04, duration: 120 }); } });
    cont.on("pointerout", function () { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function comboPop(scene, text, big) {
    if (comboFx) { comboFx.destroy(); }
    comboFx = scene.add.text(W / 2, H / 2 - 40, text, textStyle(big ? 52 : 38, big ? "#e63946" : "#5da85f")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: comboFx, scale: { from: 0.5, to: 1.15 }, y: comboFx.y - 30, alpha: 0, duration: 900, ease: "Back.easeOut",
      onComplete: function () { if (comboFx) { comboFx.destroy(); comboFx = null; } } });
  }

  function burst(scene, x, y) {
    for (var i = 0; i < 10; i++) {
      var p = scene.add.text(x, y, ["\u2B50", "\u{1F389}", "\u{1F33B}"][i % 3], { fontSize: "26px" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-90, 60),
        alpha: 0, duration: Phaser.Math.Between(500, 900),
        onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onCard(scene, card) {
    if (!started || over || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    sfxFlip();
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (over) { return; }
        a.matched = card.matched = true;
        a.view.setScale(1); card.view.setScale(1);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.1, yoyo: true, duration: 150 });
        scene.cameras.main.flash(120, 255, 255, 255, false);
        burst(scene, card.view.x, card.view.y);
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        var pts = 100 + (combo - 1) * 50 + Math.ceil(timeLeft);
        score += pts;
        timeLeft = Math.min(TIME_LIMIT, timeLeft + 4);
        drawTimeBar();
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        sfxMatch(combo);
        if (combo >= 2) { comboPop(scene, "COMBO x" + combo + "! +" + pts, combo >= 3); }
        else { comboPop(scene, "+" + pts, false); }
        hudMsg.setText(matches === 6 ? "You did it!" : "Yay! +4s \u{1F389}");
        lockBoard = false;
        drawSelector();
        if (matches === 6) { showEnd(scene, true); }
      }, 350);
    } else {
      combo = 0;
      score = Math.max(0, score - 10);
      timeLeft = Math.max(0, timeLeft - 3);
      drawTimeBar();
      hudMsg.setText("Miss! -3s \u{1F340}");
      sfxMiss();
      scene.cameras.main.shake(150, 0.004);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { if (!over) { lockBoard = false; } drawSelector(); });
      }, 650);
    }
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    var move = function (dx, dy) {
      if (!started || over || !cards.length) { return; }
      var cols = 4;
      var next = selectedIdx + dx + dy * cols;
      var guard = 0;
      while (guard++ < 12) {
        if (next < 0) { next = cards.length - 1; }
        if (next >= cards.length) { next = 0; }
        if (!cards[next].matched) { break; }
        next += dx + dy * cols;
      }
      selectedIdx = next;
      drawSelector();
    };
    kb.on("keydown-LEFT", function () { move(-1, 0); });
    kb.on("keydown-RIGHT", function () { move(1, 0); });
    kb.on("keydown-UP", function () { move(0, -1); });
    kb.on("keydown-DOWN", function () { move(0, 1); });
    kb.on("keydown-ENTER", function () { activateSelected(scene); });
    kb.on("keydown-SPACE", function () { activateSelected(scene); });
    kb.on("keydown-R", function () { restart(scene); });
  }

  function activateSelected(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    var card = cards[selectedIdx];
    if (card && !card.matched) { onCard(scene, card); }
  }

  function startGame(scene) {
    started = true; over = false; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    selectedIdx = 0;
    drawSelector();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -125, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "60 seconds on the clock!\nFind all 6 pairs. Match = +4s, miss = -3s.\nChain pairs for COMBO bonus points!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showEnd(scene, won) {
    over = true; lockBoard = true;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    if (won) {
      var bonus = Math.ceil(timeLeft) * 10;
      score += bonus;
      drawTimeBar();
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("All 6 pairs! Time bonus +" + bonus + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  Best combo x" + Math.max(1, bestCombo));
      hudMsg.setText("You win! \u{1F389}");
      sfxWin();
    } else {
      endTitle.setText("\u23F0 Time's Up!");
      endDetail.setText("You found " + matches + " / 6 pairs\nMoves: " + moves + "\nScore: " + score + "  Best combo x" + Math.max(1, bestCombo));
      hudMsg.setText("Time's up! Try again!");
      sfxLose();
      scene.cameras.main.shake(250, 0.006);
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    if (selBox) { selBox.clear(); }
    var n = won ? 50 : 25;
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(Math.random() * W, -20, won ? ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4] : ["\u{1F340}", "\u23F0", "\u{1F404}"][i % 3], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0;
    timeLeft = TIME_LIMIT; over = false;
    firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    drawTimeBar();
    buildBoard(scene);
  }

  function update(time, delta) {
    if (!started || over) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 10.5 && Math.ceil(timeLeft) !== lastTick) {
      lastTick = Math.ceil(timeLeft);
      if (timeLeft > 0) { sfxTick(); }
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      drawTimeBar();
      var scene = this;
      firstPick = null;
      cards.forEach(function (c) { if (c.faceUp && !c.matched) { flip(c, false); } });
      showEnd(scene, matches === 6);
      return;
    }
    drawTimeBar();
  }
})();
</script>
</body>
