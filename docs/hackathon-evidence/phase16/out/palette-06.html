<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#dceef7;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to choose a card and Enter to flip it."></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#dff0f9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false, gameOver = false;
  var moves = 0, matches = 0, score = 0, combo = 0, bestCombo = 0, timeLeft = 90, cursorIndex = 0;
  var TIME_LIMIT = 90, TIME_BONUS = 4, FRENZY_AT = 15;
  var muted = false, audioCtx = null, timerEvent = null, cursorMarker = null;
  var hudMoves, hudScore, hudMsg, hudPoints, hudTime, hudCombo, endOverlay, endTitle, endDetail, startOverlay, startDetail;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xdff0f9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0x4EA8DE, 0.18); g.fillRect(0, 0, W, 470);
    g.fillStyle(0xbfe3cf, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function ensureAudio() {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { audioCtx = null; }
  }

  function beep(freq, dur, type, vol) {
    if (muted) { return; }
    ensureAudio();
    if (!audioCtx) { return; }
    try {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
      o.stop(audioCtx.currentTime + (dur || 0.12));
    } catch (e) {}
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(21));
    hudScore = scene.add.text(24, 76, "Pairs: 0 / 6", textStyle(21));
    hudPoints = scene.add.text(24, 102, "Score: 0", textStyle(22, "#0b5fa5"));
    hudCombo = scene.add.text(24, 128, "", textStyle(20, "#e76f51"));
    hudTime = scene.add.text(W / 2, 44, "\u23F1 90", textStyle(34, "#0b5fa5")).setOrigin(0.5, 0);
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(22, "#334e68")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 108);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    btn.setSize(172, 52);
    btn.setInteractive({ useHandCursor: true });
    btn.on("pointerdown", function () { ensureAudio(); restart(scene); });
    btn.on("pointerover", function () { btn.setScale(1.06); });
    btn.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Beat the clock! Match = +points & +4s", textStyle(20, "#486581")).setOrigin(0.5);
    scene.add.text(W - 24, 140, "Arrows + Enter \u2022 R restart \u2022 M sound", textStyle(15, "#486581")).setOrigin(1, 0.5);
    scene.input.keyboard.on("keydown", function (e) { onKey(scene, e); });
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    cursorIndex = 0; firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    drawCursor(scene);
  }

  function drawCursor(scene) {
    if (cursorMarker) { cursorMarker.destroy(); cursorMarker = null; }
    if (!cards.length || !started || gameOver) { return; }
    var card = cards[Math.max(0, Math.min(cursorIndex, cards.length - 1))];
    var w = card.view.width || 185, h = card.view.height || 140;
    cursorMarker = scene.add.graphics().setDepth(5);
    cursorMarker.lineStyle(5, 0xffb703, 1);
    cursorMarker.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
    if (!card.faceUp && !card.matched) {
      scene.tweens.add({ targets: cursorMarker, alpha: 0.35, yoyo: true, repeat: 2, duration: 120 });
    }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function frenzy() { return started && !gameOver && timeLeft <= FRENZY_AT && matches < 6; }

  function addTime(scene, secs) {
    timeLeft = Math.max(0, Math.min(99, timeLeft + secs));
    refreshTime(scene);
  }

  function refreshTime(scene) {
    if (!hudTime) { return; }
    hudTime.setText("\u23F1 " + timeLeft);
    hudTime.setColor(timeLeft <= FRENZY_AT ? "#d62828" : "#0b5fa5");
    if (timeLeft <= FRENZY_AT && started && !gameOver && matches < 6) {
      hudMsg.setText("FRENZY x2! \u26A1");
    }
  }

  function refreshScore() {
    hudPoints.setText("Score: " + score);
    hudCombo.setText(combo >= 2 ? ("Combo x" + combo + " \u{1F525}") : "");
  }

  function popText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(30, color || "#0b5fa5")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, scale: 1.25, duration: 800, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y, big) {
    var n = big ? 16 : 10;
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(x, y, ["\u2B50", "\u2728", "\u{1F33B}", "\u{1F389}"][i % 4], { fontSize: (big ? 30 : 22) + "px" }).setOrigin(0.5).setDepth(14);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-110, 110), y: y + Phaser.Math.Between(-90, 60), alpha: 0, duration: Phaser.Math.Between(450, 800), ease: "Cubic.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function startTimer(scene) {
    stopTimer();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started || gameOver) { return; }
      timeLeft--;
      refreshTime(scene);
      beep(timeLeft <= 10 ? 880 : 440, 0.07, "square", 0.04);
      if (timeLeft <= 0) { timeLeft = 0; refreshTime(scene); onTimeout(scene); }
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    ensureAudio();
    cursorIndex = Math.max(0, cards.indexOf(card));
    drawCursor(scene);
    beep(520, 0.07, "square", 0.05);
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (gameOver) { return; }
        a.matched = card.matched = true;
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        var mult = frenzy() ? 2 : 1;
        var gained = (100 + (combo - 1) * 50) * mult;
        score += gained;
        matches++;
        addTime(scene, TIME_BONUS);
        refreshScore();
        hudScore.setText("Pairs: " + matches + " / 6");
        popText(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2 - 40, "+" + gained + (mult === 2 ? " x2!" : "!"), mult === 2 ? "#d62828" : "#0b5fa5");
        burst(scene, card.view.x, card.view.y, combo >= 2);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        beep(combo >= 3 ? 880 : 660, 0.14, "square", 0.07);
        setTimeout(function () { beep(990, 0.12, "square", 0.06); }, 110);
        hudMsg.setText(matches === 6 ? "Amazing!" : (combo >= 3 ? ("Combo x" + combo + "! \u{1F525}") : "Yay! +" + gained + " \u{1F389}"));
        lockBoard = false;
        drawCursor(scene);
        if (matches === 6) { showWin(scene); }
      }, 320);
    } else {
      combo = 0; refreshScore();
      score = Math.max(0, score - 10);
      refreshScore();
      hudMsg.setText("Miss! -10 \u{1F340}");
      beep(180, 0.18, "sawtooth", 0.06);
      scene.cameras.main.shake(140, 0.006);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawCursor(scene); });
      }, Math.max(420, 680 - matches * 40));
    }
  }

  function onKey(scene, e) {
    if (!e || !e.key) { return; }
    var k = e.key;
    if (k === "m" || k === "M") { muted = !muted; hudMsg.setText(muted ? "Sound off (M)" : "Sound on (M)"); return; }
    if (k === "r" || k === "R") { ensureAudio(); restart(scene); return; }
    if (startOverlay && startOverlay.visible) {
      if (k === "Enter" || k === " ") { ensureAudio(); startGame(scene); }
      return;
    }
    if (endOverlay && endOverlay.visible) {
      if (k === "Enter" || k === " ") { ensureAudio(); restart(scene); }
      return;
    }
    if (!started || gameOver) { return; }
    var cols = 4, moved = false, next = cursorIndex;
    if (k === "ArrowLeft") { next = cursorIndex - 1; moved = true; }
    else if (k === "ArrowRight") { next = cursorIndex + 1; moved = true; }
    else if (k === "ArrowUp") { next = cursorIndex - cols; moved = true; }
    else if (k === "ArrowDown") { next = cursorIndex + cols; moved = true; }
    else if (k === "Enter" || k === " ") {
      var pick = cards[Math.max(0, Math.min(cursorIndex, cards.length - 1))];
      if (pick) { onCard(scene, pick); }
      return;
    } else { return; }
    if (moved) {
      next = (next + cards.length) % cards.length;
      cursorIndex = next;
      beep(330, 0.05, "square", 0.03);
      drawCursor(scene);
    }
  }

  function onTimeout(scene) {
    if (gameOver || matches === 6) { return; }
    gameOver = true; lockBoard = true; stopTimer();
    beep(140, 0.4, "sawtooth", 0.08);
    scene.cameras.main.shake(250, 0.01);
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("Pairs: " + matches + " / 6\nScore: " + score + "  Best combo x" + bestCombo + "\nMoves: " + moves);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time! Press R or Enter \u21BB");
  }

  function startGame(scene) {
    ensureAudio();
    started = true; gameOver = false; lockBoard = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    timeLeft = TIME_LIMIT;
    refreshTime(scene);
    startTimer(scene);
    drawCursor(scene);
    hudMsg.setText("Go! Beat the clock! \u26A1");
    beep(660, 0.12, "square", 0.07);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Arcade: 90 seconds on the clock!\nMatch pairs for points, streaks & +4s!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    startDetail = scene.add.text(0, 42, "Combo x2, x3 = bigger points \u2022 Last 15s = FRENZY x2\nMiss breaks combo (-10)", Object.assign(textStyle(17, "#486581"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, startDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
  }

  function showWin(scene) {
    gameOver = true; stopTimer();
    var timeBonus = timeLeft * 10;
    score += timeBonus;
    refreshScore();
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs! Time bonus +" + timeBonus + "\nScore: " + score + "  Best combo x" + bestCombo + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! Enter / R to replay \u{1F389}");
    beep(660, 0.12, "square", 0.07);
    setTimeout(function () { beep(880, 0.12, "square", 0.07); }, 130);
    setTimeout(function () { beep(1320, 0.25, "square", 0.07); }, 260);
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u26A1"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeLeft = TIME_LIMIT; cursorIndex = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    refreshScore(); refreshTime(scene);
    hudMsg.setText("Go! Beat the clock! \u26A1");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    if (cursorMarker) { cursorMarker.destroy(); cursorMarker = null; }
    buildBoard(scene);
    startTimer(scene);
    drawCursor(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
