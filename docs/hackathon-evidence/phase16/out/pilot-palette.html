<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to move between cards and Enter to flip a card." tabindex="0"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false, gameOver = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, bestScore = 0;
  var TIME_TOTAL = 75, timeLeft = 75;
  var focusIndex = 0, focusRing = null;
  var hudMoves, hudScore, hudMsg, hudScoreText, hudTimeText, hudTimeBarBg, hudTimeBar, hudCombo, endOverlay, endTitle, endDetail, startOverlay;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    drawFocusRing(s);
    setupKeyboard(s);
  }

  function drawFocusRing(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!started || gameOver || !cards.length) { return; }
    if (!startOverlay.visible && !endOverlay.visible) {
      var c = cards[Math.max(0, Math.min(cards.length - 1, focusIndex))];
      if (c && !c.matched) {
        focusRing = scene.add.graphics().setDepth(5);
        focusRing.lineStyle(5, 0xe76f51, 1);
        focusRing.strokeRoundedRect(c.cx - c.cw / 2 - 4, c.cy - c.ch / 2 - 4, c.cw + 8, c.ch + 8, 24);
      }
    }
  }

  function startGame(scene) {
    started = true; gameOver = false; lockBoard = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    drawFocusRing(scene);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      var k = (e.key || "").toLowerCase();
      if (k === "enter" || k === " ") {
        if (startOverlay.visible) { startGame(scene); return; }
        if (endOverlay.visible) { restart(scene); return; }
        var c = cards[focusIndex];
        if (c) { onCard(scene, c); }
        return;
      }
      if (!started || gameOver) { return; }
      var cols = 4;
      if (k === "arrowright" || k === "d") { focusIndex = (focusIndex + 1) % cards.length; drawFocusRing(scene); }
      else if (k === "arrowleft" || k === "a") { focusIndex = (focusIndex + cards.length - 1) % cards.length; drawFocusRing(scene); }
      else if (k === "arrowdown" || k === "s") { focusIndex = (focusIndex + cols) % cards.length; drawFocusRing(scene); }
      else if (k === "arrowup" || k === "w") { focusIndex = (focusIndex + cards.length - cols) % cards.length; drawFocusRing(scene); }
      else if (k === "r") { restart(scene); }
    });
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22));
    hudScoreText = scene.add.text(24, 114, "Score: 0", textStyle(22, "#0a5c7a"));
    hudMsg = scene.add.text(W - 24, 56, "Tap a card!", textStyle(24, "#102A43")).setOrigin(1, 0.5);
    hudTimeText = scene.add.text(W - 24, 86, "Time: 75", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    hudTimeBarBg = scene.add.graphics();
    hudTimeBarBg.fillStyle(0x102A43, 0.18); hudTimeBarBg.fillRoundedRect(W - 224, 106, 200, 14, 7);
    hudTimeBar = scene.add.graphics();
    drawTimeBar();
    hudCombo = scene.add.text(W / 2, 168, "", textStyle(24, "#e76f51")).setOrigin(0.5);
    var btn = scene.add.container(W - 110, 148);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    btn.setData("restartBtn", true);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2 - 120, 168, "Match fast for COMBOS! +4s per pair!", textStyle(20, "#0a5c7a")).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!hudTimeBar) { return; }
    hudTimeBar.clear();
    var frac = Math.max(0, timeLeft / TIME_TOTAL);
    var col = frac > 0.5 ? 0x4EA8DE : (frac > 0.25 ? 0xffb703 : 0xe63946);
    hudTimeBar.fillStyle(col, 1);
    hudTimeBar.fillRoundedRect(W - 224, 106, Math.max(14, 200 * frac), 14, 7);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIndex = 0; firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, cx: x, cy: y, cw: w, ch: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () {
      if (!card.faceUp && !card.matched && started && !lockBoard) { scene.tweens.add({ targets: cont, scale: 1.04, duration: 120 }); }
    });
    cont.on("pointerout", function () {
      if (!card.faceUp && !card.matched) { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); }
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function popupText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(26, color || "#0a5c7a")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 850, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function showCombo(scene) {
    if (streak >= 2) {
      hudCombo.setText(streak >= 4 ? "\u{1F525} MEGA COMBO x" + streak + "! \u{1F525}" : "\u26A1 COMBO x" + streak + "!");
      scene.tweens.killTweensOf(hudCombo);
      hudCombo.setScale(0.6).setAlpha(1);
      scene.tweens.add({ targets: hudCombo, scale: 1.15, duration: 160, yoyo: true });
    } else {
      hudCombo.setText("");
    }
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    focusIndex = cards.indexOf(card);
    drawFocusRing(scene);
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        matches++;
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        var gained = 100 + (streak - 1) * 50 + Math.ceil(timeLeft);
        score += gained;
        timeLeft = Math.min(TIME_TOTAL, timeLeft + 4);
        hudScore.setText("Pairs: " + matches + " / 6");
        hudScoreText.setText("Score: " + score);
        hudMsg.setText(matches === 6 ? "You did it!" : "Yay! +" + gained + " \u{1F389}");
        showCombo(scene);
        popupText(scene, card.cx, card.cy - 60, "+" + gained, "#0a5c7a");
        drawTimeBar();
        lockBoard = false;
        drawFocusRing(scene);
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      showCombo(scene);
      score = Math.max(0, score - 20);
      timeLeft = Math.max(0, timeLeft - 2);
      hudScoreText.setText("Score: " + score);
      hudMsg.setText("Miss! -2s \u{1F340}");
      drawTimeBar();
      scene.cameras.main.shake(180, 0.008);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocusRing(scene); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -132, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -62, "Find all 6 pairs before the clock runs out!\n+4s per pair \u2022 combos boost score \u2022 miss = -2s", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 52, "Click / tap, or arrows + Enter \u2022 R restarts", textStyle(17, "#0a5c7a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    gameOver = true; lockBoard = true;
    bestScore = Math.max(bestScore, score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var timeBonus = Math.ceil(timeLeft) * 5;
    score += timeBonus;
    hudScoreText.setText("Score: " + score);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nScore: " + score + " (time bonus +" + timeBonus + ")\n" + "\u2B50".repeat(stars) + "  Best: " + bestScore);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    hudCombo.setText(streak >= 2 ? "\u26A1 Final combo x" + streak + "!" : "");
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u26A1"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showGameOver(scene) {
    gameOver = true; lockBoard = true;
    bestScore = Math.max(bestScore, score);
    scene.cameras.main.shake(300, 0.012);
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  Best: " + bestScore + "\nTip: pairs give +4s — chain combos!");
    endOverlay.setVisible(true);
    hudMsg.setText("Time's up! Try again!");
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; timeLeft = TIME_TOTAL;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    focusIndex = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudScoreText.setText("Score: 0"); hudTimeText.setText("Time: " + TIME_TOTAL);
    hudCombo.setText(""); hudMsg.setText("Tap a card!");
    drawTimeBar();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    buildBoard(scene);
    drawFocusRing(scene);
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay.visible || endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      hudTimeText.setText("Time: 0");
      drawTimeBar();
      var s = this;
      if (firstPick) { flip(firstPick, false); firstPick = null; }
      showGameOver(s);
      return;
    }
    hudTimeText.setText("Time: " + Math.ceil(timeLeft));
    drawTimeBar();
    if (timeLeft < 10) {
      hudTimeText.setColor("#e63946");
      hudTimeBar.setAlpha(0.6 + 0.4 * Math.abs(Math.sin(time / 180)));
    } else {
      hudTimeText.setColor("#102A43");
      hudTimeBar.setAlpha(1);
    }
  }
})();
</script>
</body>
</html>
