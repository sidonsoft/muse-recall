<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d7ecf5;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" class="sr-only" role="status" aria-live="polite">Farmyard Match loaded. Press Enter to start.</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#dff2fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, level = 1;
  var hudMoves, hudScore, hudMsg, hudPoints, hudLevel, endOverlay, endTitle, endDetail, startOverlay;
  var selectedIdx = 0, cursor = null, audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    labelCanvas();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // cool ocean sky + sea (no flashing elements; slow drifting clouds below)
    g.fillStyle(0xdff2fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbde0fe, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xa9d6e5, 1); g.fillRect(0, 560, W, 140);
    g.fillStyle(0xffffff, 0.7);
    g.fillEllipse(180, 560, 220, 26); g.fillEllipse(480, 620, 260, 28); g.fillEllipse(760, 580, 200, 24);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    var c1 = scene.add.ellipse(180, 110, 150, 48, 0xffffff);
    var c2 = scene.add.ellipse(240, 100, 120, 44, 0xffffff);
    var c3 = scene.add.ellipse(560, 80, 140, 44, 0xffffff);
    // slow gentle drift (long smooth tweens, no flashing)
    scene.tweens.add({ targets: c1, x: 220, duration: 9000, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
    scene.tweens.add({ targets: c2, x: 280, duration: 11000, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
    scene.tweens.add({ targets: c3, x: 520, duration: 10000, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
    // boathouse in ocean palette
    g.fillStyle(0x4ea8de, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102a43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xeaf6fb, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xeaf6fb, 1);
    g.lineBetween(80, 330, 230, 330);
    // dock
    g.lineStyle(8, 0x5e7a8c, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers / bubbles
    var cols = [0x4ea8de, 0x90e0ef, 0x48cae4, 0xade8f4];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a7f9e, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 52, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 80, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 108, "Score: 0", textStyle(22, "#1b6ca8"));
    hudLevel = scene.add.text(W - 24, 26, "Level 1", textStyle(24, "#1b6ca8")).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 58, "Tap a card!", textStyle(22)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 112);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match pairs to score \u2014 clear the level!", textStyle(20, "#416074")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    selectedIdx = 0;
    drawCursor(scene);
  }

  function drawCursor(scene) {
    if (cursor) { cursor.destroy(); cursor = null; }
    if (!cards.length) { return; }
    var sel = cards[selectedIdx] || cards[0];
    var w = sel.view.width || 185, h = sel.view.height || 140;
    cursor = scene.add.graphics().setDepth(5);
    cursor.lineStyle(5, 0x102a43, 1);
    cursor.strokeRoundedRect(sel.view.x - w / 2 - 6, sel.view.y - h / 2 - 6, w + 12, h + 12, 24);
  }

  function moveCursor(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(selectedIdx / cols), c = selectedIdx % cols;
    r = (r + dy + 3) % 3; c = (c + dx + cols) % cols;
    selectedIdx = r * cols + c;
    drawCursor(scene);
    playTone(520, 0.05, "sine");
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0xbde0fe, 0xa2d2ff, 0xcfeefc];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function playTone(freq, dur, type) {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return; }
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = 0.08;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.12));
      o.stop(audioCtx.currentTime + (dur || 0.12));
    } catch (e) { /* sound is optional garnish */ }
  }

  function scorePop(scene, x, y, msg) {
    var t = scene.add.text(x, y, msg, textStyle(30, "#1b6ca8")).setOrigin(0.5).setDepth(8);
    scene.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 650, ease: "Sine.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    playTone(440, 0.08, "sine");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        // gentle victory bounce (smooth scale, no flashing)
        scene.tweens.add({ targets: [a.view, card.view], y: "-=10", yoyo: true, duration: 180, delay: 160 });
        matches++;
        score += 100;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPoints.setText("Score: " + score);
        scorePop(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2 - 60, "+100");
        playTone(660, 0.12, "triangle");
        setTimeout(function () { playTone(880, 0.15, "triangle"); }, 110);
        hudMsg.setText(matches === 6 ? "Level clear!" : "Yay! +100 \u{1F389}");
        announce("Pair found! " + matches + " of 6. Score " + score + ".");
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      // kind miss: no deduction, no penalty — just encouragement
      hudMsg.setText("So close \u2014 keep swimming! \u{1F41A}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function startGame(scene) {
    if (started && !startOverlay.visible) { return; }
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    announce("Level " + level + " started. Find all 6 pairs to score.");
    playTone(523, 0.1, "triangle");
    setTimeout(function () { playTone(784, 0.14, "triangle"); }, 100);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -200, 600, 400, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -200, 600, 400, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Score +100 per pair.\nClear all 6 pairs to dive to the next level!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 20, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "42px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 70, 260, 70, 35);
    var btnTx = scene.add.text(0, 105, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 168, "Click, or press Enter \u2022 Arrows + Enter flip cards", textStyle(17, "#416074")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 70, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} Level Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-140, 55, 280, 70, 35);
    var btnTx = scene.add.text(0, 90, "Next Level \u25B6", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 148, "Enter = next level \u2022 R = restart", textStyle(17, "#416074")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 55, 280, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { nextLevel(scene); });
    endOverlay.setData("nextBg", btnBg);
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    score += 200;
    hudPoints.setText("Score: " + score);
    endTitle.setText("\u{1F389} Level " + level + " Clear! \u{1F389}");
    endDetail.setText("All 6 pairs found! Level bonus +200\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Score: " + score + " \u{1F389}");
    announce("Level " + level + " clear! Score " + score + ". Press Enter for the next level.");
    [523, 659, 784, 1047].forEach(function (f, i) {
      setTimeout(function () { playTone(f, 0.16, "triangle"); }, i * 120);
    });
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F42C}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F41A}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1400, 2400), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function resetBoardState(scene, keepScore, keepLevel) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    if (!keepScore) { score = 0; }
    if (!keepLevel) { level = 1; }
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: " + score); hudLevel.setText("Level " + level);
    hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    announce("Level " + level + ". Score " + score + ". Find all 6 pairs.");
  }

  function restart(scene) {
    resetBoardState(scene, false, false);
  }

  function nextLevel(scene) {
    level++;
    resetBoardState(scene, true, true);
    playTone(523, 0.1, "triangle");
    setTimeout(function () { playTone(784, 0.14, "triangle"); }, 100);
  }

  function labelCanvas() {
    var canvas = document.querySelector("#game canvas");
    if (canvas) {
      canvas.setAttribute("tabindex", "0");
      canvas.setAttribute("role", "application");
      canvas.setAttribute("aria-label", "Farmyard Match card game. Use arrow keys to choose a card, Enter to flip it. Press R to restart.");
    }
  }

  function setupKeyboard(scene) {
    // explicit keydown listeners (no form submission handling)
    scene.input.keyboard.on("keydown", function (e) {
      var key = e.key;
      if (startOverlay && startOverlay.visible) {
        if (key === "Enter" || key === " ") { startGame(scene); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (key === "Enter" || key === " ") { nextLevel(scene); }
        else if (key === "r" || key === "R") { restart(scene); }
        return;
      }
      if (key === "ArrowLeft") { moveCursor(scene, -1, 0); }
      else if (key === "ArrowRight") { moveCursor(scene, 1, 0); }
      else if (key === "ArrowUp") { moveCursor(scene, 0, -1); }
      else if (key === "ArrowDown") { moveCursor(scene, 0, 1); }
      else if (key === "Enter" || key === " ") {
        var card = cards[selectedIdx];
        if (card) { onCard(scene, card); }
      } else if (key === "r" || key === "R") { restart(scene); }
    });
    // keep the keyboard cursor visible above freshly dealt cards
    scene.events.on("shutdown", function () {
      if (cursor) { cursor.destroy(); cursor = null; }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
