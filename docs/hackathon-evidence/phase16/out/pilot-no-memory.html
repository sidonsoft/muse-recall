<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<p class="visually-hidden" id="game-help">Farmyard Match memory game. Use Tab to reach the game, arrow keys to move between cards, Enter or Space to flip a card, and R to restart.</p>
<p class="visually-hidden" id="game-status" aria-live="polite"></p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0, gameOver = false, shuffleDone = false;
  var TOTAL_TIME = 90, timeLeft = TOTAL_TIME;
  var focusIdx = 0, focusVisible = false, focusBox = null;
  var hudMoves, hudScore, hudMsg, hudPts, hudCombo, hudTime, timeBarBg, timeBar, endOverlay, endTitle, endDetail, startOverlay;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    focusBox = s.add.graphics().setDepth(6).setVisible(false);
    setupKeyboard(s);
    setupA11y();
  }

  function announce(msg) {
    var el = document.getElementById("game-status");
    if (el) { el.textContent = msg; }
  }

  function setupA11y() {
    var c = document.querySelector("#game canvas");
    if (c) {
      c.setAttribute("tabindex", "0");
      c.setAttribute("role", "application");
      c.setAttribute("aria-label", "Farmyard Match memory game. Press Enter to start, arrow keys to choose a card, Enter to flip it.");
    }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function fmtTime(t) {
    t = Math.max(0, Math.ceil(t));
    return Math.floor(t / 60) + ":" + ("0" + (t % 60)).slice(-2);
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(21));
    hudScore = scene.add.text(24, 76, "Pairs: 0 / 6", textStyle(21));
    hudPts = scene.add.text(24, 102, "Score: 0", textStyle(21, "#7a4a2b"));
    hudCombo = scene.add.text(24, 128, "Combo: --", textStyle(21, "#b26a00"));
    hudTime = scene.add.text(W / 2, 26, "\u23F1 " + fmtTime(timeLeft), textStyle(30)).setOrigin(0.5, 0);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0x000000, 0.15); timeBarBg.fillRoundedRect(W / 2 - 110, 64, 220, 12, 6);
    timeBar = scene.add.graphics();
    drawTimeBar();
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match all 6 pairs before the clock runs out!", textStyle(21, "#8a6a4a")).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var frac = Math.max(0, timeLeft / TOTAL_TIME);
    var col = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xff9f1c : 0xe71d36);
    timeBar.fillStyle(col, 1);
    timeBar.fillRoundedRect(W / 2 - 110, 64, Math.max(1, Math.round(220 * frac)), 12, 6);
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPts.setText("Score: " + score);
    hudCombo.setText(streak > 1 ? "Combo: x" + streak + " \u{1F525}" : "Combo: --");
    hudTime.setText("\u23F1 " + fmtTime(timeLeft));
    hudTime.setColor(timeLeft <= 15 ? "#e71d36" : "#5b3a29");
    drawTimeBar();
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function popup(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(30, color || "#2b9348")).setOrigin(0.5).setDepth(8);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); drawFocus(); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 150 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var pts = 100 + (streak - 1) * 50;
        score += pts;
        popup(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2 - 60, "+" + pts, "#2b9348");
        if (streak >= 3) {
          popup(scene, W / 2, H / 2 - 60, "COMBO x" + streak + "! \u{1F525}", "#e71d36");
          hudMsg.setText("Combo x" + streak + "! \u{1F525}");
        } else {
          hudMsg.setText(matches === 6 ? "You did it!" : "Yay! A pair! \u{1F389}");
        }
        refreshHud();
        announce("Pair found! " + matches + " of 6. Score " + score + ".");
        lockBoard = false;
        drawFocus();
        if (matches === 6) { showWin(scene); }
      }, 320);
    } else {
      streak = 0;
      score = Math.max(0, score - 25);
      timeLeft = Math.max(0, timeLeft - 3);
      hudMsg.setText("Miss! -3s \u{1F340}");
      scene.cameras.main.shake(150, 0.008);
      popup(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2 - 60, "-3s", "#e71d36");
      refreshHud();
      announce("No match. 3 seconds lost.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 550);
    }
    refreshHud();
  }

  function shuffleUnmatched(scene) {
    var open = cards.filter(function (c) { return !c.matched; });
    if (open.length < 4) { return; }
    var spots = open.map(function (c) { return { x: c.view.x, y: c.view.y }; });
    for (var i = spots.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = spots[i]; spots[i] = spots[j]; spots[j] = t;
    }
    open.forEach(function (c, i) {
      var done = (i === open.length - 1) ? function () { drawFocus(); } : function () {};
      scene.tweens.add({ targets: c.view, x: spots[i].x, y: spots[i].y, duration: 350, ease: "Cubic.easeInOut", onComplete: done });
    });
    hudMsg.setText("Whoa! Shuffle! \u{1F300}");
    announce("Bonus challenge: unmatched cards shuffled!");
    drawFocus();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Beat the 90-second clock!\nPairs score, misses cost 3s.\nStreaks earn combo bonus!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(); });
    scene.tweens.add({ targets: btnTx, scale: 1.08, yoyo: true, repeat: -1, duration: 500 });
  }

  function startGame() {
    started = true; gameOver = false; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Tap a card!");
    announce("Game started. 90 seconds on the clock.");
    drawFocus();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function celebrate(scene, n) {
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showWin(scene) {
    gameOver = true; lockBoard = true;
    var bonus = Math.ceil(timeLeft) * 10;
    score += bonus;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nTime left: " + fmtTime(timeLeft) + " (+" + bonus + ")\nScore: " + score + "  " + "\u2B50".repeat(stars) + "\nBest combo: x" + Math.max(1, bestStreak));
    endOverlay.setVisible(true);
    if (focusBox) { focusBox.setVisible(false); }
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    refreshHud();
    announce("You win! Score " + score + " in " + moves + " moves.");
    celebrate(scene, 60);
  }

  function showLose(scene) {
    if (matches >= 6) { return; }
    gameOver = true; lockBoard = true;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nMoves: " + moves + "   Score: " + score + "\nPress Play Again to retry!");
    endOverlay.setVisible(true);
    if (focusBox) { focusBox.setVisible(false); }
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again!");
    announce("Time is up. You found " + matches + " of 6 pairs. Score " + score + ".");
    scene.cameras.main.shake(200, 0.01);
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    shuffleDone = false; timeLeft = TOTAL_TIME; focusIdx = 0;
    refreshHud();
    hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    announce("New game. 90 seconds on the clock.");
    drawFocus();
  }

  function drawFocus() {
    if (!focusBox || !cards.length) { return; }
    if (!started || gameOver || !focusVisible || !cards[focusIdx]) { focusBox.setVisible(false); return; }
    var c = cards[focusIdx];
    focusBox.clear();
    focusBox.lineStyle(5, 0xffb703, 1);
    focusBox.strokeRoundedRect(c.view.x - c.w / 2 - 4, c.view.y - c.h / 2 - 4, c.w + 8, c.h + 8, 24);
    focusBox.setVisible(true);
  }

  function moveFocus(scene, dx, dy) {
    var cols = 4;
    var r = Math.floor(focusIdx / cols), c = (focusIdx % cols);
    r = (r + dy + 3) % 3; c = (c + dx + cols) % cols;
    focusIdx = r * cols + c;
    focusVisible = true;
    drawFocus();
    if (cards[focusIdx] && !cards[focusIdx].matched) {
      announce("Focused card row " + (r + 1) + " column " + (c + 1) + ".");
    }
  }

  function setupKeyboard(scene) {
    window.addEventListener("keydown", function (e) {
      var k = e.key;
      if (startOverlay && startOverlay.visible && (k === "Enter" || k === " ")) { e.preventDefault(); startGame(); return; }
      if (endOverlay && endOverlay.visible && (k === "Enter" || k === " " || k === "r" || k === "R")) { e.preventDefault(); restart(scene); return; }
      if (!started || gameOver) { return; }
      if (k === "ArrowLeft") { e.preventDefault(); moveFocus(scene, -1, 0); }
      else if (k === "ArrowRight") { e.preventDefault(); moveFocus(scene, 1, 0); }
      else if (k === "ArrowUp") { e.preventDefault(); moveFocus(scene, 0, -1); }
      else if (k === "ArrowDown") { e.preventDefault(); moveFocus(scene, 0, 1); }
      else if (k === "Enter" || k === " ") { e.preventDefault(); focusVisible = true; if (cards[focusIdx]) { onCard(scene, cards[focusIdx]); } }
      else if (k === "r" || k === "R") { restart(scene); }
    });
  }

  function update(time, delta) {
    if (!started || gameOver || matches >= 6) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= (delta || 16.7) / 1000;
    if (!shuffleDone && timeLeft <= TOTAL_TIME / 2 && matches < 6) {
      shuffleDone = true;
      var sc = this;
      shuffleUnmatched(sc);
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      refreshHud();
      showLose(this);
      return;
    }
    refreshHud();
    if (timeLeft <= 15 && hudTime) {
      var pulse = 1 + 0.06 * Math.sin(time / 120);
      hudTime.setScale(pulse);
    } else if (hudTime) {
      hudTime.setScale(1);
    }
  }
})();
</script>
</body>
</html>
