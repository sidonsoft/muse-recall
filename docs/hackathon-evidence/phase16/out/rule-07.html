<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d8eef7;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#cdebf7",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, bestScore = 0, wave = 1;
  var selIndex = 0, selRing = null, waves = [], bubbles = [];
  var hudMoves, hudScore, hudMsg, hudPoints, hudCombo, hudBest, endOverlay, endTitle, endDetail, startOverlay;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    // Ocean seabed scene (slow drift only, no flashing).
    var g = scene.add.graphics();
    g.fillStyle(0xcdebf7, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xb5dff2, 1); g.fillRect(0, 300, W, 170);
    g.fillStyle(0xf4e6c2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.35);
    g.fillEllipse(180, 110, 150, 40); g.fillEllipse(240, 100, 120, 36);
    g.fillEllipse(560, 80, 140, 36);
    // sun through water
    g.fillStyle(0xfff6dd, 0.9); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 0.9); g.fillCircle(770, 110, 42);
    // treasure chest (barn shape, ocean friendly)
    g.fillStyle(0x8a5a3b, 1); g.fillRect(80, 340, 150, 130);
    g.fillStyle(0x6e4530, 1); g.fillTriangle(60, 340, 155, 265, 250, 340);
    g.fillStyle(0xffd166, 1); g.fillRect(135, 395, 40, 75);
    g.lineStyle(4, 0xffe8a3, 1);
    g.lineBetween(80, 340, 230, 340);
    // seaweed fence
    g.lineStyle(8, 0x2e8b9a, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // shells / starfish dots
    var cols = [0xf49ac1, 0xff9d76, 0x4ea8de, 0x9ad0f5];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2e8b9a, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // slow drifting wave bands + rising bubbles (ambient, gentle)
    waves = []; bubbles = [];
    for (var k = 0; k < 3; k++) {
      var w = scene.add.ellipse(150 + k * 300, 250 + k * 60, 220, 26, 0xffffff, 0.28);
      w.setData("baseX", w.x); w.setData("ph", k * 1.7);
      waves.push(w);
    }
    for (var b = 0; b < 12; b++) {
      var c = scene.add.circle(Math.random() * W, 200 + Math.random() * 420, 3 + Math.random() * 6, 0xffffff, 0.5);
      c.setData("spd", 8 + Math.random() * 14);
      bubbles.push(c);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 52, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 80, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 108, "Score: 0", textStyle(22));
    hudCombo = scene.add.text(24, 136, "Combo x0", textStyle(20, "#24617e")).setAlpha(0.95);
    hudBest = scene.add.text(W - 24, 14, "Best: 0", textStyle(20, "#24617e")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart (R)", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Wave " + wave + " \u2022 Find the 6 animal pairs \u2022 Arrows + Enter", textStyle(20, "#24617e")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c && c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd8f0fa, 0xcdebf7, 0xb5dff2, 0xd6ecf5, 0xc2e2f2, 0xe2f2fb];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function arcadePoints(chain) { return 100 + (chain - 1) * 25 + (chain >= 3 ? 50 : 0); }

  function floatScore(scene, x, y, str) {
    var t = scene.add.text(x, y, str, textStyle(30, "#0b5d7a")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 70, alpha: 0, duration: 900, ease: "Sine.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function bubbleBurst(scene, x, y) {
    for (var i = 0; i < 6; i++) {
      var c = scene.add.circle(x, y, 4 + Math.random() * 5, 0xffffff, 0.85).setDepth(14);
      var dx = (Math.random() - 0.5) * 120, dy = -40 - Math.random() * 70;
      scene.tweens.add({ targets: c, x: x + dx, y: y + dy, alpha: 0, duration: 700 + Math.random() * 300,
        ease: "Sine.easeOut", onComplete: (function (o) { return function () { o.destroy(); }; })(c) });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        // Gentle arcade celebration: slow bounce + bubbles (no flashing).
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.1, yoyo: true, duration: 320, ease: "Sine.easeInOut" });
        bubbleBurst(scene, a.view.x, a.view.y);
        bubbleBurst(scene, card.view.x, card.view.y);
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var pts = arcadePoints(streak);
        score += pts;
        floatScore(scene, card.view.x, card.view.y - 70, "+" + pts);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPoints.setText("Score: " + score);
        hudCombo.setText(streak >= 2 ? "Combo x" + streak + "! Splash Bonus!" : "Combo x" + streak);
        hudMsg.setText(matches === 6 ? "You did it!" : (streak >= 2 ? "Combo x" + streak + "! \u{1F30A}" : "Yay! A pair! \u{1F389}"));
        lockBoard = false;
        updateSelRing(scene);
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      // No penalty: score and streak display reset softly, misses cost nothing.
      hudMsg.setText("Good try — keep splashing! \u{1F340}");
      streak = 0;
      hudCombo.setText("Combo x0");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateSelRing(scene); });
      }, 700);
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    updateSelRing(scene);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102a43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -200, 600, 400, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -200, 600, 400, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Arcade splash: match pairs to score!\nCombos earn bonus points — misses are free.", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 20, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "42px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 62, "Arrows choose \u2022 Enter flips \u2022 R restarts", textStyle(18, "#24617e")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 82, 260, 70, 35);
    var btnTx = scene.add.text(0, 117, "\u25B6  Start (Enter)", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 82, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102a43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} Wave Cleared! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 60, 260, 70, 35);
    var btnTx = scene.add.text(0, 95, "\u21BB Next Wave (R)", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 60, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { nextWave(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var newBest = score > bestScore;
    if (newBest) { bestScore = score; hudBest.setText("Best: " + bestScore); }
    endDetail.setText("Wave " + wave + " cleared!\nScore: " + score + "  Best: " + bestScore +
      "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) +
      "\nBest combo: x" + Math.max(bestStreak, 1) + (newBest ? "\nNew best score! \u{1F30A}" : ""));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 300, ease: "Back.easeOut" });
    hudMsg.setText("Wave cleared! \u{1F389}");
    // Gentle celebration: slow falling shells/stars (no flashing, no strobe).
    for (var i = 0; i < 28; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F41A}"][i % 5], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1600, 2600), ease: "Sine.easeIn",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    selIndex = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: 0"); hudCombo.setText("Combo x0"); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    if (selRing) { selRing.destroy(); selRing = null; }
    buildBoard(scene);
    updateSelRing(scene);
  }

  function nextWave(scene) {
    wave++;
    if (score > bestScore) { bestScore = score; }
    hudBest.setText("Best: " + bestScore);
    moves = 0; matches = 0; score = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    selIndex = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: 0"); hudCombo.setText("Combo x0"); hudMsg.setText("Wave " + wave + " — tap a card!");
    endOverlay.setVisible(false);
    if (selRing) { selRing.destroy(); selRing = null; }
    buildBoard(scene);
    updateSelRing(scene);
    scene.tweens.add({ targets: hudMsg, scale: { from: 1.25, to: 1 }, duration: 400, ease: "Sine.easeOut" });
  }

  function updateSelRing(scene) {
    if (!cards.length || !started) { return; }
    var target = cards[selIndex % cards.length];
    if (!target) { return; }
    if (!selRing) {
      selRing = scene.add.graphics().setDepth(5);
    }
    selRing.clear();
    selRing.lineStyle(5, 0x0b5d7a, 1);
    selRing.strokeRoundedRect(target.view.x - 100, target.view.y - 77, 200, 154, 24);
  }

  function moveSel(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var n = cards.length;
    var row = Math.floor(selIndex / cols), col = selIndex % cols;
    col = (col + dx + cols) % cols;
    row = (row + dy + 3) % 3;
    selIndex = Math.min(row * cols + col, n - 1);
    updateSelRing(scene);
  }

  function setupKeyboard(scene) {
    function onKey(e) {
      if (e.key === "Enter" || e.key === " ") {
        if (startOverlay && startOverlay.visible) { startGame(scene); e.preventDefault(); return; }
        if (endOverlay && endOverlay.visible) { nextWave(scene); e.preventDefault(); return; }
        var card = cards[selIndex % cards.length];
        if (card) { onCard(scene, card); e.preventDefault(); }
      } else if (e.key === "ArrowLeft") { moveSel(scene, -1, 0); e.preventDefault(); }
      else if (e.key === "ArrowRight") { moveSel(scene, 1, 0); e.preventDefault(); }
      else if (e.key === "ArrowUp") { moveSel(scene, 0, -1); e.preventDefault(); }
      else if (e.key === "ArrowDown") { moveSel(scene, 0, 1); e.preventDefault(); }
      else if (e.key === "r" || e.key === "R") {
        if (endOverlay && endOverlay.visible) { nextWave(scene); }
        else { restart(scene); }
      }
    }
    document.addEventListener("keydown", onKey);
    if (scene.input.keyboard) {
      scene.input.keyboard.on("keydown-ENTER", function () {});
    }
  }

  function update(time) {
    var t = (time || 0) / 1000;
    for (var i = 0; i < waves.length; i++) {
      var wv = waves[i];
      if (wv && wv.active) { wv.x = wv.getData("baseX") + Math.sin(t * 0.5 + wv.getData("ph")) * 26; }
    }
    for (var j = 0; j < bubbles.length; j++) {
      var b = bubbles[j];
      if (b && b.active) {
        b.y -= b.getData("spd") * 0.016;
        if (b.y < 170) { b.y = 620; b.x = Math.random() * W; }
      }
    }
  }
})();
</script>
</body>
</html>
