<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #modeBar{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 12px;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #modeLabel{color:#102A43;font-weight:bold;font-size:18px}
  .mode-btn{font-family:inherit;font-size:16px;font-weight:bold;color:#102A43;background:#fff;border:3px solid #4EA8DE;border-radius:999px;padding:8px 18px;cursor:pointer}
  .mode-btn[aria-pressed="true"]{background:#4EA8DE;color:#fff}
  .mode-btn:focus-visible{outline:4px solid #102A43;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="modeBar" role="group" aria-label="Difficulty">
  <span id="modeLabel">Difficulty:</span>
  <button type="button" id="btnNormal" class="mode-btn" aria-pressed="true">Normal &middot; 6 pairs</button>
  <button type="button" id="btnChallenge" class="mode-btn" aria-pressed="false">Challenge &middot; 8 pairs &middot; 90s</button>
</div>
<p id="gameStatus" class="sr-only" aria-live="polite"></p>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var mode = "normal", totalPairs = 6, timeLeft = 0, timerEvent = null;
  var focusIndex = 0, focusRing = null;
  var hudMoves, hudScore, hudMsg, hudTime, hudSub, endOverlay, endTitle, endDetail, startOverlay;
  var modeButtons = {};
  var ALL_ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F436}", name: "Dog" }
  ];

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    focusRing = s.add.graphics().setDepth(6);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireModeBar(s);
    wireKeyboard(s);
  }

  function announce(msg) {
    var el = document.getElementById("gameStatus");
    if (el) { el.textContent = msg; }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudTime = scene.add.text(24, 122, "Time: 90", textStyle(24, "#102A43")).setVisible(false);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    var pool = (mode === "challenge") ? ALL_ANIMALS : ALL_ANIMALS.slice(0, 6);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = (mode === "challenge") ? 4 : 3;
    var cw = 185, ch = (mode === "challenge") ? 104 : 140;
    var gx = 62, gy = (mode === "challenge") ? 205 : 195, padX = 22, padY = (mode === "challenge") ? 12 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIndex = 0;
    drawFocus();
  }

  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || !cards.length) { return; }
    var card = cards[focusIndex % cards.length];
    if (!card || card.matched) { return; }
    var w = card.w || 185, h = card.h || 140;
    var cx = card.view.x, cy = card.view.y;
    focusRing.lineStyle(4, 0x102A43, 1);
    focusRing.strokeRoundedRect(cx - w / 2 - 4, cy - h / 2 - 4, w + 8, h + 8, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    var idx = cards.indexOf(card);
    if (idx >= 0) { focusIndex = idx; drawFocus(); }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("One card flipped. Pick one more."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    var matchDelay = (mode === "challenge") ? 250 : 350;
    var missDelay = (mode === "challenge") ? 450 : 700;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Pair found! " + matches + " of " + totalPairs + ".");
        lockBoard = false;
        drawFocus();
        if (matches === totalPairs) { showWin(scene); }
      }, matchDelay);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, missDelay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -225, 620, 450, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -225, 620, 450, 30);
    var title = scene.add.text(0, -165, "\u{1F33B} Farmyard Match \u{1F404}", Object.assign(textStyle(38, "#102A43"), {})).setOrigin(0.5);
    var sub = scene.add.text(0, -105, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(24, "#102A43"), { align: "center" })).setOrigin(0.5);
    sub.setName("startSub");
    var row = scene.add.text(0, -30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    row.setName("startRow");
    var normalBg = scene.add.graphics();
    var chalBg = scene.add.graphics();
    drawModeBtn(normalBg, -270, 15, 260, 56, mode !== "challenge");
    drawModeBtn(chalBg, 10, 15, 260, 56, mode === "challenge");
    var normalTx = scene.add.text(-140, 43, "Normal: 6 pairs", textStyle(20, mode !== "challenge" ? "#ffffff" : "#102A43")).setOrigin(0.5);
    var chalTx = scene.add.text(140, 43, "Challenge: 8 + 90s", textStyle(20, mode === "challenge" ? "#ffffff" : "#102A43")).setOrigin(0.5);
    modeButtons = { normalBg: normalBg, chalBg: chalBg, normalTx: normalTx, chalTx: chalTx };
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 95, 260, 70, 35);
    var btnTx = scene.add.text(0, 130, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 190, "Keys: arrows move \u00B7 Enter flips \u00B7 N / C mode", textStyle(16, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, normalBg, chalBg, normalTx, chalTx, btnBg, btnTx, hint]);
    normalBg.setInteractive(new Phaser.Geom.Rectangle(-270, 15, 260, 56), Phaser.Geom.Rectangle.Contains);
    chalBg.setInteractive(new Phaser.Geom.Rectangle(10, 15, 260, 56), Phaser.Geom.Rectangle.Contains);
    normalBg.on("pointerdown", function () { setMode("normal", scene); });
    chalBg.on("pointerdown", function () { setMode("challenge", scene); });
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 95, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function drawModeBtn(g, x, y, w, h, active) {
    g.clear();
    g.fillStyle(active ? 0x4EA8DE : 0xE6EEF5, 1);
    g.fillRoundedRect(x, y, w, h, 20);
    g.lineStyle(3, 0x4EA8DE, 1);
    g.strokeRoundedRect(x, y, w, h, 20);
  }

  function refreshModeButtons() {
    if (!modeButtons.normalBg) { return; }
    var isChal = (mode === "challenge");
    drawModeBtn(modeButtons.normalBg, -270, 15, 260, 56, !isChal);
    drawModeBtn(modeButtons.chalBg, 10, 15, 260, 56, isChal);
    modeButtons.normalTx.setColor(!isChal ? "#ffffff" : "#102A43");
    modeButtons.chalTx.setColor(isChal ? "#ffffff" : "#102A43");
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    startTimer(scene);
    hudMsg.setText(mode === "challenge" ? "Beat the clock!" : "Tap a card!");
    announce(mode === "challenge" ? "Challenge started. 8 pairs, 90 seconds." : "Game started. 6 pairs.");
    drawFocus();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function starCount() {
    if (mode === "challenge") {
      var bonus = timeLeft >= 30 ? -2 : 0;
      var m = moves + bonus;
      return m <= 14 ? 3 : (m <= 20 ? 2 : 1);
    }
    return moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
  }

  function showWin(scene) {
    stopTimer(scene);
    var stars = starCount();
    var label = (mode === "challenge") ? "Challenge cleared!" : "You found all " + totalPairs + " pairs!";
    var extra = (mode === "challenge") ? "\nTime left: " + timeLeft + "s" : "";
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText(label + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + extra);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onTimeout(scene) {
    lockBoard = true;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("Challenge failed.\nPairs: " + matches + " / " + totalPairs + " in " + moves + " moves.");
    endOverlay.setVisible(true);
    hudMsg.setText("Time's up! \u23F0");
    announce("Time is up. You found " + matches + " of " + totalPairs + " pairs.");
  }

  function stopTimer(scene) {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function startTimer(scene) {
    stopTimer(scene);
    if (mode !== "challenge") { hudTime.setVisible(false); return; }
    timeLeft = 90;
    hudTime.setColor("#102A43").setText("Time: 90").setVisible(true);
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      timeLeft--;
      hudTime.setText("Time: " + timeLeft);
      if (timeLeft <= 10) { hudTime.setColor("#d00000"); }
      if (timeLeft <= 0) { stopTimer(scene); onTimeout(scene); }
    }});
  }

  function setMode(next, scene) {
    if (next !== "normal" && next !== "challenge") { return; }
    mode = next;
    totalPairs = (mode === "challenge") ? 8 : 6;
    refreshModeButtons();
    syncModeBar();
    var sub = startOverlay ? startOverlay.getByName("startSub") : null;
    var row = startOverlay ? startOverlay.getByName("startRow") : null;
    if (sub) {
      sub.setText(mode === "challenge"
        ? "Challenge: 8 pairs, 90 seconds.\nCards hide faster!"
        : "Flip the cards and find\nall 6 animal pairs!");
    }
    if (row) {
      row.setText(mode === "challenge"
        ? "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F410} \u{1F436}"
        : "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}");
    }
    hudScore.setText("Pairs: 0 / " + totalPairs);
    hudSub.setText(mode === "challenge" ? "Challenge: 8 pairs in 90s!" : "Find the 6 animal pairs!");
    announce(mode === "challenge" ? "Challenge mode selected. 8 pairs, 90 seconds." : "Normal mode selected. 6 pairs.");
    if (started && scene) { restart(scene); }
    else if (scene) { moves = 0; matches = 0; firstPick = null; hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); buildBoard(scene); drawFocus(); }
  }

  function syncModeBar() {
    var bn = document.getElementById("btnNormal");
    var bc = document.getElementById("btnChallenge");
    if (bn) { bn.setAttribute("aria-pressed", mode === "normal" ? "true" : "false"); }
    if (bc) { bc.setAttribute("aria-pressed", mode === "challenge" ? "true" : "false"); }
  }

  function wireModeBar(scene) {
    syncModeBar();
    [["btnNormal", "normal"], ["btnChallenge", "challenge"]].forEach(function (pair) {
      var el = document.getElementById(pair[0]);
      if (!el) { return; }
      el.addEventListener("click", function () { setMode(pair[1], scene); });
      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setMode(pair[1], scene); }
      });
    });
  }

  function moveFocus(dCol, dRow, cols) {
    var n = cards.length;
    if (!n) { return; }
    var cur = ((focusIndex % n) + n) % n;
    var r = Math.floor(cur / cols), c = cur % cols;
    var rows = Math.ceil(n / cols);
    c = (c + dCol + cols) % cols;
    r = (r + dRow + rows) % rows;
    var next = Math.min(r * cols + c, n - 1);
    focusIndex = next;
    drawFocus();
  }

  function wireKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (ev) {
      var cols = (mode === "challenge") ? 4 : 4;
      if (!started) {
        if (ev.key === "n" || ev.key === "N" || ev.key === "1") { setMode("normal", scene); }
        else if (ev.key === "c" || ev.key === "C" || ev.key === "2") { setMode("challenge", scene); }
        else if (ev.key === "Enter" || ev.key === " ") { startGame(scene); }
        return;
      }
      if (ev.key === "ArrowLeft") { ev.preventDefault(); moveFocus(-1, 0, cols); }
      else if (ev.key === "ArrowRight") { ev.preventDefault(); moveFocus(1, 0, cols); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); moveFocus(0, -1, cols); }
      else if (ev.key === "ArrowDown") { ev.preventDefault(); moveFocus(0, 1, cols); }
      else if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        var card = cards[focusIndex % cards.length];
        if (card) { onCard(scene, card); }
      }
    });
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMsg.setText(mode === "challenge" ? "Beat the clock!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    announce(mode === "challenge" ? "Challenge restarted. 8 pairs, 90 seconds." : "Game restarted. 6 pairs.");
  }

  function update() {}
})();
</script>
</body>
