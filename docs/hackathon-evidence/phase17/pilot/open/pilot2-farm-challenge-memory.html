<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;padding:12px;box-sizing:border-box}
  #modeBar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#ffffff;border:2px solid #4EA8DE;border-radius:999px;box-shadow:0 4px 12px rgba(16,42,67,0.12);margin-bottom:10px;flex-wrap:wrap;justify-content:center}
  #modeBar span{color:#102A43;font-weight:bold;font-size:15px}
  .mode-btn{border:2px solid #4EA8DE;background:#EAF6FF;color:#102A43;padding:7px 14px;border-radius:999px;font-family:inherit;font-weight:bold;cursor:pointer;font-size:14px}
  .mode-btn.active{background:#4EA8DE;color:#ffffff}
  .mode-btn:focus{outline:3px solid #102A43;outline-offset:2px}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;flex-shrink:0}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,0.18)}
</style>
</head>
<body>
<div id="modeBar" role="group" aria-label="Game difficulty">
  <span id="modeLabel">Challenge Mode:</span>
  <button type="button" id="btnEasy" class="mode-btn active" aria-label="Easy mode, 6 pairs" aria-pressed="true">Easy (6 pairs)</button>
  <button type="button" id="btnHard" class="mode-btn" aria-label="Hard mode, 8 pairs" aria-pressed="false">Hard (8 pairs)</button>
</div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F413}", name: "Rooster" },
    { emoji: "\u{1FABF}", name: "Goose" },
    { emoji: "\u{1FACF}", name: "Donkey" }
  ];
  var W = 900, H = 700;
  var difficulty = "easy";
  var totalPairs = 6;
  var gameScene = null;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var hudModeEasyBg, hudModeHardBg, hudModeEasyTx, hudModeHardTx;
  var startSub, startRow, startModeEasyBg, startModeHardBg, startModeEasyTx, startModeHardTx;

  function getTotalPairs() {
    return difficulty === "hard" ? 8 : 6;
  }

  function getBoardLayout() {
    if (difficulty === "hard") {
      return { cols: 4, rows: 4, cw: 155, ch: 112, gx: 116, gy: 185, padX: 16, padY: 12 };
    } else {
      return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
    }
  }

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    updateAllUI();
    setupDomControls();
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xFFFFFF, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xA8D8EA, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2E86AB, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xFFFFFF, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x4EA8DE, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x85C1E9, 0xA9CCE3, 0xD6EAF8];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2E86AB, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFFFFF, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22, "#102A43"));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(22, "#102A43"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#2E86AB")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the animal pairs!", textStyle(20, "#102A43")).setOrigin(0.5);

    var modeTitle = scene.add.text(W - 260, 14, "Mode:", textStyle(16, "#102A43")).setOrigin(0, 0.5);
    var easyCont = scene.add.container(W - 190, 14);
    hudModeEasyBg = scene.add.graphics();
    var easyHit = new Phaser.Geom.Rectangle(0, 0, 70, 30);
    hudModeEasyBg.setInteractive(easyHit, Phaser.Geom.Rectangle.Contains);
    hudModeEasyTx = scene.add.text(35, 15, "Easy", textStyle(14, "#ffffff")).setOrigin(0.5);
    easyCont.add([hudModeEasyBg, hudModeEasyTx]);
    hudModeEasyBg.on("pointerdown", function () { applyDifficulty("easy"); });

    var hardCont = scene.add.container(W - 110, 14);
    hudModeHardBg = scene.add.graphics();
    var hardHit = new Phaser.Geom.Rectangle(0, 0, 70, 30);
    hudModeHardBg.setInteractive(hardHit, Phaser.Geom.Rectangle.Contains);
    hudModeHardTx = scene.add.text(35, 15, "Hard", textStyle(14, "#ffffff")).setOrigin(0.5);
    hardCont.add([hudModeHardBg, hudModeHardTx]);
    hudModeHardBg.on("pointerdown", function () { applyDifficulty("hard"); });
  }

  function updateHudModeVisual() {
    if (!hudModeEasyBg || !hudModeHardBg) { return; }
    hudModeEasyBg.clear();
    hudModeHardBg.clear();
    if (difficulty === "easy") {
      hudModeEasyBg.fillStyle(0x4EA8DE, 1); hudModeEasyBg.fillRoundedRect(0, 0, 70, 30, 15);
      hudModeHardBg.fillStyle(0xEAF6FF, 1); hudModeHardBg.fillRoundedRect(0, 0, 70, 30, 15);
      hudModeHardBg.lineStyle(2, 0x4EA8DE, 1); hudModeHardBg.strokeRoundedRect(0, 0, 70, 30, 15);
      hudModeEasyTx.setColor("#ffffff");
      hudModeHardTx.setColor("#102A43");
    } else {
      hudModeHardBg.fillStyle(0x4EA8DE, 1); hudModeHardBg.fillRoundedRect(0, 0, 70, 30, 15);
      hudModeEasyBg.fillStyle(0xEAF6FF, 1); hudModeEasyBg.fillRoundedRect(0, 0, 70, 30, 15);
      hudModeEasyBg.lineStyle(2, 0x4EA8DE, 1); hudModeEasyBg.strokeRoundedRect(0, 0, 70, 30, 15);
      hudModeHardTx.setColor("#ffffff");
      hudModeEasyTx.setColor("#102A43");
    }
  }

  function shuffledDeck() {
    var deck = [];
    var count = getTotalPairs();
    var pool = ANIMALS.slice(0, count);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var layout = getBoardLayout();
    var cols = layout.cols, cw = layout.cw, ch = layout.ch, gx = layout.gx, gy = layout.gy, padX = layout.padX, padY = layout.padY;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + getTotalPairs()); }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 14);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 11);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xD6EAF8, 0xB9E4F9, 0xA8D8EA, 0xE1F0FA, 0xC7E8FF, 0x85C1E9, 0xA9CCE3, 0xD4E6F1, 0xEBF5FB, 0xAED6F1];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 14);
    var emoSize = w < 170 ? "52px" : "62px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(18, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + getTotalPairs());
        hudMsg.setText(matches === getTotalPairs() ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === getTotalPairs()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38, "#102A43")).setOrigin(0.5);
    startSub = scene.add.text(0, -95, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    startRow = scene.add.text(0, -30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var modeLabel = scene.add.text(0, 18, "Choose challenge:", textStyle(18, "#102A43")).setOrigin(0.5);

    var easyCont = scene.add.container(-80, 55);
    startModeEasyBg = scene.add.graphics();
    startModeEasyTx = scene.add.text(60, 18, "Easy 3\u00D74", textStyle(18, "#ffffff")).setOrigin(0.5);
    easyCont.add([startModeEasyBg, startModeEasyTx]);
    startModeEasyBg.setInteractive(new Phaser.Geom.Rectangle(0, 0, 120, 36), Phaser.Geom.Rectangle.Contains);
    startModeEasyBg.on("pointerdown", function () { applyDifficulty("easy"); });

    var hardCont = scene.add.container(80, 55);
    startModeHardBg = scene.add.graphics();
    startModeHardTx = scene.add.text(60, 18, "Hard 4\u00D74", textStyle(18, "#ffffff")).setOrigin(0.5);
    hardCont.add([startModeHardBg, startModeHardTx]);
    startModeHardBg.setInteractive(new Phaser.Geom.Rectangle(0, 0, 120, 36), Phaser.Geom.Rectangle.Contains);
    startModeHardBg.on("pointerdown", function () { applyDifficulty("hard"); });

    var hardHint = scene.add.text(0, 100, "Hard: 8 pairs \u2022 more to remember!", textStyle(14, "#2E86AB")).setOrigin(0.5);

    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 120, 260, 60, 30);
    var btnTx = scene.add.text(0, 150, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, startSub, startRow, modeLabel, easyCont, hardCont, hardHint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 120, 260, 60), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
    });
  }

  function updateStartOverlayVisual() {
    if (!startModeEasyBg || !startModeHardBg) { return; }
    startModeEasyBg.clear();
    startModeHardBg.clear();
    if (difficulty === "easy") {
      startModeEasyBg.fillStyle(0x4EA8DE, 1); startModeEasyBg.fillRoundedRect(0, 0, 120, 36, 18);
      startModeHardBg.fillStyle(0xEAF6FF, 1); startModeHardBg.fillRoundedRect(0, 0, 120, 36, 18);
      startModeHardBg.lineStyle(2, 0x4EA8DE, 1); startModeHardBg.strokeRoundedRect(0, 0, 120, 36, 18);
      startModeEasyTx.setColor("#ffffff");
      startModeHardTx.setColor("#102A43");
    } else {
      startModeHardBg.fillStyle(0x4EA8DE, 1); startModeHardBg.fillRoundedRect(0, 0, 120, 36, 18);
      startModeEasyBg.fillStyle(0xEAF6FF, 1); startModeEasyBg.fillRoundedRect(0, 0, 120, 36, 18);
      startModeEasyBg.lineStyle(2, 0x4EA8DE, 1); startModeEasyBg.strokeRoundedRect(0, 0, 120, 36, 18);
      startModeHardTx.setColor("#ffffff");
      startModeEasyTx.setColor("#102A43");
    }
    if (startSub) {
      startSub.setText("Flip the cards and find\nall " + getTotalPairs() + " animal pairs!");
    }
    if (startRow) {
      if (difficulty === "hard") {
        startRow.setText("\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F410} \u{1F413}");
        startRow.setFontSize("32px");
      } else {
        startRow.setText("\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}");
        startRow.setFontSize("38px");
      }
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var tp = getTotalPairs();
    var stars;
    if (difficulty === "hard") {
      stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1);
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    var modeName = difficulty === "hard" ? "Hard" : "Easy";
    endDetail.setText("You found all " + tp + " pairs! (" + modeName + ")\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + getTotalPairs()); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function applyDifficulty(newDiff) {
    if (newDiff !== "easy" && newDiff !== "hard") { return; }
    difficulty = newDiff;
    totalPairs = getTotalPairs();
    updateAllUI();
    if (gameScene) {
      if (started) {
        restart(gameScene);
      } else {
        cards.forEach(function (c) { c.view.destroy(); });
        buildBoard(gameScene);
        lockBoard = true;
        if (startOverlay) { startOverlay.setVisible(true); }
      }
    }
  }

  function updateDomModeUI() {
    var bE = document.getElementById("btnEasy");
    var bH = document.getElementById("btnHard");
    if (!bE || !bH) { return; }
    if (difficulty === "easy") {
      bE.classList.add("active"); bE.setAttribute("aria-pressed", "true");
      bH.classList.remove("active"); bH.setAttribute("aria-pressed", "false");
    } else {
      bH.classList.add("active"); bH.setAttribute("aria-pressed", "true");
      bE.classList.remove("active"); bE.setAttribute("aria-pressed", "false");
    }
  }

  function updateAllUI() {
    totalPairs = getTotalPairs();
    updateDomModeUI();
    updateHudModeVisual();
    updateStartOverlayVisual();
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
  }

  function setupDomControls() {
    var bE = document.getElementById("btnEasy");
    var bH = document.getElementById("btnHard");
    if (bE) {
      bE.addEventListener("click", function () { applyDifficulty("easy"); });
      bE.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); applyDifficulty("easy"); } });
    }
    if (bH) {
      bH.addEventListener("click", function () { applyDifficulty("hard"); });
      bH.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); applyDifficulty("hard"); } });
    }
  }

  function setupKeyboard(scene) {
    window.addEventListener("keydown", function (e) {
      if (e.key === "r" || e.key === "R") { restart(scene); }
      if (e.key === "e" || e.key === "E") { applyDifficulty("easy"); }
      if (e.key === "h" || e.key === "H") { applyDifficulty("hard"); }
      if (e.key === "Enter" && startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        if (hudMsg) { hudMsg.setText("Tap a card!"); }
      }
    });
  }

  function update() {}
})();
</script>
</body>
