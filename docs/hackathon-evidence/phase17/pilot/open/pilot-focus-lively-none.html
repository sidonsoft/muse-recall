<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
    position: relative;
  }
  /* lively background */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(231,193,124,0.10), transparent 60%),
      radial-gradient(700px 500px at 85% 20%, rgba(231,193,124,0.07), transparent 60%),
      radial-gradient(800px 600px at 50% 100%, rgba(224,143,126,0.06), transparent 70%);
    pointer-events: none;
    z-index: -2;
    animation: bgShift 18s ease-in-out infinite alternate;
  }
  .bg-orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(28px);
    opacity: 0.35;
    animation: floatOrb 14s ease-in-out infinite;
  }
  .orb.one {
    width: 220px; height: 220px;
    background: rgba(231,193,124,0.18);
    top: 8%; left: 6%;
    animation-delay: 0s;
  }
  .orb.two {
    width: 320px; height: 320px;
    background: rgba(231,193,124,0.10);
    top: 55%; right: 4%;
    animation-delay: -4s;
  }
  .orb.three {
    width: 180px; height: 180px;
    background: rgba(224,143,126,0.12);
    bottom: 10%; left: 18%;
    animation-delay: -8s;
  }
  .app {
    width: 100%;
    max-width: 620px;
    animation: appIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    animation: gentleFloat 5s ease-in-out infinite;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    position: relative;
    overflow: hidden;
    animation: markPulse 2.8s ease-in-out infinite;
    box-shadow: 0 6px 18px rgba(231,193,124,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: markShine 3.5s ease-in-out infinite;
  }
  .brand:hover .mark {
    transform: rotate(-6deg) scale(1.06);
    box-shadow: 0 10px 24px rgba(231,193,124,0.35);
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
    position: relative;
    display: inline-block;
  }
  .subtitle::after {
    content: "✨";
    margin-left: 6px;
    display: inline-block;
    animation: sparkle 2.2s ease-in-out infinite;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(231,193,124,0.35), transparent);
    opacity: 0.9;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 50px rgba(0,0,0,0.45);
    border-color: rgba(231,193,124,0.28);
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
    background: #2b2722;
    box-shadow: 0 0 0 4px rgba(231,193,124,0.12);
  }
  #taskInput:hover {
    border-color: rgba(231,193,124,0.35);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease, color 0.2s ease;
  }
  #priorityInput:hover {
    border-color: var(--accent);
    color: var(--text);
    transform: translateY(-1px);
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 6px 16px rgba(231,193,124,0.22);
  }
  #addBtn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.32) 50%, transparent 80%);
    transform: translateX(-120%);
    transition: transform 0.6s ease;
  }
  #addBtn:hover {
    filter: brightness(1.06);
    transform: translateY(-1px) scale(1.01);
    box-shadow: 0 10px 22px rgba(231,193,124,0.30);
  }
  #addBtn:hover::before {
    transform: translateX(120%);
  }
  #addBtn:active {
    filter: brightness(0.96);
    transform: translateY(0) scale(0.98);
  }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .filter-btn:active {
    transform: translateY(0) scale(0.97);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 4px 12px rgba(231,193,124,0.18);
    transform: translateY(-1px);
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  #clearBtn:hover { color: var(--text); transform: translateY(-1px); }
  #clearBtn:active { transform: scale(0.97); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
    transform: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 12px 12px 10px;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .progress-wrap.has-progress {
    border-color: rgba(231,193,124,0.18);
    background: rgba(231,193,124,0.06);
  }
  .progress-wrap.celebrate {
    animation: celebratePop 0.6s cubic-bezier(0.34,1.56,0.64,1);
    border-color: rgba(231,193,124,0.45);
    background: rgba(231,193,124,0.10);
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; transition: transform 0.3s ease; }
  #progressPct {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent);
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
    position: relative;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #f0d49a);
    transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
    position: relative;
    overflow: hidden;
  }
  #progressBar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: translateX(-100%);
    animation: shimmer 2.2s ease-in-out infinite;
  }
  #progressBar.pulse {
    animation: barPulse 0.5s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    animation: taskIn 0.45s cubic-bezier(0.16,1,0.3,1) both;
    position: relative;
    overflow: hidden;
  }
  .task::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: transparent;
    transition: background 0.2s ease;
    border-radius: 11px 0 0 11px;
  }
  .task:hover {
    transform: translateY(-2px) scale(1.005);
    border-color: rgba(231,193,124,0.28);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    background: #2c2823;
  }
  .task:hover::before {
    background: var(--accent);
  }
  .task.completed { opacity: 0.82; }
  .task.completed::before { background: rgba(231,193,124,0.35); }
  .task.just-added {
    animation: taskPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .task.just-toggled {
    animation: taskWiggle 0.4s ease;
  }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
    animation: checkPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 4px 10px rgba(231,193,124,0.25);
  }
  .check:hover { background: var(--accent-soft); transform: scale(1.08); }
  .task.completed .check:hover { background: var(--accent); transform: scale(1.08); }
  .check:active { transform: scale(0.92); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
    transform: translateY(-1px);
  }
  .icon-btn:active { transform: scale(0.96); }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px) scale(1.02);
    background: rgba(231,193,124,0.08);
  }
  .priority-btn:active { transform: scale(0.96); }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 3px 10px rgba(231,193,124,0.15);
    animation: priorityGlow 1.8s ease-in-out infinite alternate;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.3s ease;
  }
  .priority-line.has-high {
    color: var(--accent);
    font-weight: 600;
  }
  .priority-line.has-high::before {
    content: "⚡";
    animation: zap 1.2s ease-in-out infinite;
  }
  #prioritySummary { color: inherit; }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.02);
    animation: emptyBreathe 3.2s ease-in-out infinite, taskIn 0.5s ease both;
    transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
  }
  .empty:hover {
    border-color: rgba(231,193,124,0.35);
    background: rgba(231,193,124,0.05);
    transform: translateY(-1px);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  .empty-icon {
    font-size: 1.6rem;
    display: block;
    margin-bottom: 8px;
    animation: gentleFloat 3s ease-in-out infinite;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
    opacity: 0.9;
  }
  /* toast stack */
  #toastStack {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    z-index: 50;
    width: min(90vw, 420px);
  }
  .toast {
    background: #2a2723;
    color: var(--text);
    border: 1px solid rgba(231,193,124,0.28);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 0.9rem;
    box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    animation: toastIn 0.45s cubic-bezier(0.16,1,0.3,1) both, toastOut 0.4s ease 2.2s both;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast strong { color: var(--accent); }
  /* confetti */
  #confettiLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 40;
  }
  .confetti {
    position: absolute;
    width: 8px;
    height: 12px;
    border-radius: 2px;
    top: -12px;
    animation: confettiFall linear forwards;
    opacity: 0.95;
  }
  .burst {
    position: absolute;
    pointer-events: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: burstOut 0.6s ease-out forwards;
  }
  /* ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  /* keyframes */
  @keyframes appIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes taskIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes taskPop {
    0% { transform: scale(0.96); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  @keyframes taskWiggle {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  @keyframes checkPop {
    0% { transform: scale(0.7); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  @keyframes barPulse {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.25); transform: scaleY(1.15); }
    100% { filter: brightness(1); transform: scaleY(1); }
  }
  @keyframes celebratePop {
    0% { transform: scale(1); }
    30% { transform: scale(1.02); }
    60% { transform: scale(0.99); }
    100% { transform: scale(1); }
  }
  @keyframes gentleFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes markPulse {
    0%,100% { transform: scale(1); box-shadow: 0 6px 18px rgba(231,193,124,0.25); }
    50% { transform: scale(1.04); box-shadow: 0 8px 22px rgba(231,193,124,0.32); }
  }
  @keyframes markShine {
    0% { transform: translateX(-100%); }
    60% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  @keyframes sparkle {
    0%,100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.2) rotate(8deg); opacity: 0.9; }
  }
  @keyframes bgShift {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(-2%, -1%) scale(1.02); }
  }
  @keyframes floatOrb {
    0%,100% { transform: translateY(0) translateX(0) scale(1); }
    33% { transform: translateY(-12px) translateX(8px) scale(1.03); }
    66% { transform: translateY(8px) translateX(-6px) scale(0.98); }
  }
  @keyframes emptyBreathe {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.01); }
  }
  @keyframes priorityGlow {
    from { box-shadow: 0 3px 10px rgba(231,193,124,0.15); }
    to { box-shadow: 0 5px 16px rgba(231,193,124,0.28); }
  }
  @keyframes zap {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-8px) scale(0.98); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg) translateX(0); }
    100% { transform: translateY(105vh) rotate(720deg) translateX(var(--drift, 0px)); }
  }
  @keyframes burstOut {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--bx), var(--by)) scale(0); opacity: 0; }
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true">
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
</div>
<div id="confettiLayer" aria-hidden="true"></div>
<div id="toastStack" aria-live="polite" aria-atomic="true"></div>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite" id="progressWrap">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";
  var lastPct = 0;
  var lastAddedId = null;
  var lastToggledId = null;

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var progressWrap = document.getElementById("progressWrap");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var toastStack = document.getElementById("toastStack");
  var confettiLayer = document.getElementById("confettiLayer");

  function showToast(message) {
    var toast = document.createElement("div");
    toast.className = "toast";
    toast.setAttribute("role", "status");
    toast.textContent = message;
    toastStack.appendChild(toast);
    window.setTimeout(function () {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 2600);
  }

  function burstConfetti(count, originX) {
    var colors = ["#e7c17c", "#f0d49a", "#e08f7e", "#f2ede3", "#b3a898", "#ffd27a"];
    for (var i = 0; i < count; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (originX !== undefined ? originX : (10 + Math.random() * 80)) + "%";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (0.9 + Math.random() * 1.1) + "s";
      c.style.animationDelay = (Math.random() * 0.25) + "s";
      c.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      c.style.transform = "rotate(" + Math.floor(Math.random() * 360) + "deg)";
      c.style.width = (6 + Math.random() * 6) + "px";
      c.style.height = (8 + Math.random() * 8) + "px";
      confettiLayer.appendChild(c);
      (function (el) {
        window.setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2200);
      })(c);
    }
  }

  function burstAtElement(el) {
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    for (var i = 0; i < 10; i++) {
      var b = document.createElement("div");
      b.className = "burst";
      b.style.left = cx + "px";
      b.style.top = cy + "px";
      b.style.background = i % 2 === 0 ? "#e7c17c" : "#e08f7e";
      var angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
      var dist = 18 + Math.random() * 22;
      b.style.setProperty("--bx", Math.cos(angle) * dist + "px");
      b.style.setProperty("--by", Math.sin(angle) * dist + "px");
      document.body.appendChild(b);
      (function (node) {
        window.setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 650);
      })(b);
    }
  }

  function createRipple(event) {
    var rect = addBtn.getBoundingClientRect();
    var ripple = document.createElement("span");
    ripple.className = "ripple";
    var size = Math.max(rect.width, rect.height) * 1.2;
    ripple.style.width = size + "px";
    ripple.style.height = size + "px";
    ripple.style.left = (event.clientX - rect.left - size / 2) + "px";
    ripple.style.top = (event.clientY - rect.top - size / 2) + "px";
    addBtn.appendChild(ripple);
    window.setTimeout(function () { if (ripple.parentNode) ripple.parentNode.removeChild(ripple); }, 600);
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      input.animate ? input.animate([{ transform: "translateX(0)" }, { transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "translateX(0)" }], { duration: 280, easing: "ease-out" }) : null;
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    var newTask = { id: nextId++, text: text, completed: false, priority: priority };
    tasks.push(newTask);
    lastAddedId = newTask.id;
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
    showToast(priority === "high" ? "⚡ High priority added!" : "✨ Task added — let's go!");
    if (priority === "high") {
      burstConfetti(10);
    }
  }

  function toggleTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].completed = !tasks[i].completed;
        lastToggledId = id;
        if (tasks[i].completed) {
          showToast("✅ Nice work! Completed");
        } else {
          showToast("↩︎ Back to active");
        }
        break;
      }
    }
    render();
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        showToast(tasks[i].priority === "high" ? "⚡ Marked as high priority" : "☆ Priority normalized");
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    var removed = null;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) { removed = tasks[i]; break; }
    }
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
    showToast(removed ? "🗑️ Removed: " + removed.text.slice(0, 24) : "🗑️ Task removed");
  }

  function clearCompleted() {
    var done = tasks.filter(function (t) { return t.completed; }).length;
    if (done === 0) return;
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
    showToast("🧹 Cleared " + done + " completed task" + (done === 1 ? "" : "s"));
    burstConfetti(14);
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    if (pct > 0) {
      progressWrap.classList.add("has-progress");
    } else {
      progressWrap.classList.remove("has-progress");
    }

    if (pct === 100 && total > 0 && lastPct !== 100) {
      progressWrap.classList.remove("celebrate");
      void progressWrap.offsetWidth;
      progressWrap.classList.add("celebrate");
      progressBar.classList.remove("pulse");
      void progressBar.offsetWidth;
      progressBar.classList.add("pulse");
      burstConfetti(28, 50);
      showToast("🎉 All done! Amazing focus!");
      window.setTimeout(function () { progressWrap.classList.remove("celebrate"); }, 800);
      window.setTimeout(function () { progressBar.classList.remove("pulse"); }, 600);
    } else if (pct > lastPct && pct < 100 && total > 0) {
      progressBar.classList.remove("pulse");
      void progressBar.offsetWidth;
      progressBar.classList.add("pulse");
      window.setTimeout(function () { progressBar.classList.remove("pulse"); }, 600);
      progressPct.animate ? progressPct.animate([{ transform: "scale(1)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }], { duration: 320, easing: "cubic-bezier(0.34,1.56,0.64,1)" }) : null;
    }
    lastPct = pct;

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    var priorityLine = document.querySelector(".priority-line");
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
      if (priorityLine) priorityLine.classList.remove("has-high");
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
      if (priorityLine) priorityLine.classList.add("has-high");
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
      if (priorityLine) priorityLine.classList.add("has-high");
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var icon = document.createElement("span");
      icon.className = "empty-icon";
      icon.setAttribute("aria-hidden", "true");
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        icon.textContent = "🌱";
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        icon.textContent = "🎈";
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        icon.textContent = "✨";
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        icon.textContent = "🔍";
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(icon);
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task, index) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      if (task.id === lastAddedId) li.classList.add("just-added");
      if (task.id === lastToggledId) li.classList.add("just-toggled");
      li.style.animationDelay = (index * 0.04) + "s";

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function (e) {
        burstAtElement(e.currentTarget);
        toggleTask(task.id);
      });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
    // reset one-time animation flags after render
    lastAddedId = null;
    window.setTimeout(function () { lastToggledId = null; }, 500);
  }

  addBtn.addEventListener("click", function (e) {
    if (e.clientX !== 0 || e.clientY !== 0) createRipple(e);
    addTask();
  });
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      btn.animate ? btn.animate([{ transform: "scale(0.96)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 280, easing: "cubic-bezier(0.34,1.56,0.64,1)" }) : null;
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
