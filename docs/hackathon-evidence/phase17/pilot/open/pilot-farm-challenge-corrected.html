<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  #mode-bar{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,0.96);padding:8px 14px;border-radius:24px;box-shadow:0 2px 12px rgba(16,42,67,0.12);border:1px solid #B9E0F5;flex-wrap:wrap;justify-content:center}
  #mode-bar span{font-size:13px;color:#102A43;font-weight:700;letter-spacing:0.3px}
  .mode-btn{border:2px solid #4EA8DE;background:#fff;color:#102A43;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s}
  .mode-btn.active{background:#4EA8DE;color:#fff;box-shadow:0 2px 8px rgba(78,168,222,0.35)}
  .mode-btn:focus{outline:3px solid #4EA8DE;outline-offset:2px}
  .mode-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(16,42,67,0.12)}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;outline:none}
  #game:focus{outline:3px solid #4EA8DE;outline-offset:2px;border-radius:18px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
</style>
</head>
<body>
<div id="mode-bar" role="group" aria-label="Game difficulty selection">
  <span>Mode:</span>
  <button type="button" id="btn-normal" class="mode-btn active" aria-label="Normal mode, 6 pairs, relaxed play" aria-pressed="true">Normal</button>
  <button type="button" id="btn-hard" class="mode-btn" aria-label="Hard challenge mode, 8 pairs with 75 second timer and shuffle twist" aria-pressed="false">Hard Challenge</button>
</div>
<div id="game" tabindex="0" aria-label="Ocean memory match game board. Use arrow keys to move focus and Enter to flip cards."></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1FABC}", name: "Jellyfish" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F420}", name: "Tropical Fish" },
    { emoji: "\u{2B50}", name: "Starfish" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, mismatchCount = 0;
  var hudMoves, hudScore, hudMsg, hudTimer, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = "normal", totalPairs = 6, timeLeft = 0, timerEvent = null, focusedIndex = -1, gameScene = null;

  function getPairsForDifficulty(diff) {
    return diff === "hard" ? 8 : 6;
  }
  function getTimeForDifficulty(diff) {
    return diff === "hard" ? 75 : 0;
  }
  function getGridConfig(diff) {
    if (diff === "hard") {
      return { cols: 4, rows: 4, cw: 165, ch: 115, gx: 70, gy: 185, padX: 18, padY: 12 };
    }
    return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
  }

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupDomModeButtons();
    updateModeUI();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 120, W, 360);
    g.fillStyle(0xB9E0F5, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xE8DCC6, 1); g.fillRect(0, 640, W, 60);
    g.fillStyle(0xFFFFFF, 0.18);
    g.fillTriangle(180, 0, 260, 0, 160, 470);
    g.fillTriangle(380, 0, 460, 0, 360, 470);
    g.fillTriangle(580, 0, 660, 0, 560, 470);
    g.fillStyle(0xFFFFFF, 0.75);
    for (var b = 0; b < 14; b++) {
      var bx = 30 + b * 64 + (b % 3) * 10;
      var by = 70 + (b % 4) * 22;
      var r = 5 + (b % 3) * 3;
      g.fillCircle(bx, by, r);
      g.fillStyle(0xFFFFFF, 0.35); g.fillCircle(bx - 2, by - 2, r * 0.45); g.fillStyle(0xFFFFFF, 0.75);
    }
    g.fillStyle(0x2A9D8F, 1);
    g.fillEllipse(110, 620, 44, 90); g.fillEllipse(135, 610, 30, 70); g.fillEllipse(90, 615, 28, 60);
    g.fillStyle(0x218380, 1); g.fillEllipse(125, 625, 18, 50);
    g.fillStyle(0xE76F51, 1); g.fillEllipse(760, 618, 52, 62); g.fillEllipse(785, 605, 36, 52); g.fillEllipse(735, 610, 30, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillEllipse(500, 628, 62, 38); g.fillEllipse(520, 620, 34, 26);
    g.fillStyle(0x8AA8B5, 1); g.fillEllipse(300, 632, 84, 32); g.fillEllipse(600, 636, 72, 26); g.fillEllipse(450, 640, 56, 22);
    g.fillStyle(0xFFB703, 1); g.fillCircle(200, 662, 10); g.fillCircle(650, 666, 8);
    g.fillStyle(0xFFFFFF, 1); g.fillCircle(400, 666, 9); g.fillCircle(550, 661, 7); g.fillCircle(320, 658, 6);
    g.fillStyle(0x4EA8DE, 0.12); g.fillEllipse(W / 2, 500, 900, 18);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Segoe UI",system-ui,-apple-system,sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudTimer = scene.add.text(24, 110, "", textStyle(20, "#014F86"));
    hudTimer.setVisible(false);
    hudMode = scene.add.text(W - 24, 22, "Mode: Normal", textStyle(16, "#2A6F97")).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(20, "#2A6F97")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find all pairs — Hard adds timer & shuffle!", textStyle(18, "#2A6F97")).setOrigin(0.5);
  }

  function shuffledDeck(pairCount) {
    var count = pairCount || totalPairs;
    var deck = [];
    for (var i = 0; i < count; i++) {
      var a = ANIMALS[i % ANIMALS.length];
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    }
    for (var k = deck.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var t = deck[k]; deck[k] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusedIndex = -1;
    var deck = shuffledDeck(totalPairs);
    var grid = getGridConfig(difficulty);
    var cols = grid.cols, cw = grid.cw, ch = grid.ch, gx = grid.gx, gy = grid.gy, padX = grid.padX, padY = grid.padY;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    if (started && cards.length > 0) {
      focusedIndex = 0;
      updateFocus();
    }
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    back.fillStyle(0xffffff, 0.22); back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 11);
    var paw = scene.add.text(0, -4, "\u{1F4A7}", { fontSize: "42px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xA9DEF9, 0xB9E0F5, 0x7EC8E3, 0xD6EAF8, 0xE0F2FB, 0xA0D2EB, 0x89CFF0, 0x5DADE2];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: w > 170 ? "54px" : "46px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 170 ? 18 : 16, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var focusRing = scene.add.graphics().setVisible(false);
    focusRing.lineStyle(4, 0x102A43, 1); focusRing.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 20);
    cont.add(focusRing);
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, focusRing: focusRing, index: idx, x: x, y: y, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function updateFocus() {
    cards.forEach(function (c, i) {
      if (c.focusRing) { c.focusRing.setVisible(i === focusedIndex && started && !c.matched); }
    });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    if (difficulty === "hard" && timeLeft > 0 && !timerEvent) { startTimer(scene); }
    var idx = cards.indexOf(card);
    if (idx !== -1) { focusedIndex = idx; updateFocus(); }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        updateFocus();
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      mismatchCount++;
      hudMsg.setText(difficulty === "hard" ? "No match! Watch the shuffle! \u{1F30A}" : "Try again! \u{1F340}");
      var delay = difficulty === "hard" ? 500 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () {
          lockBoard = false;
          updateFocus();
          if (difficulty === "hard" && mismatchCount % 3 === 0) {
            shuffleUnmatched(scene);
          }
        });
      }, delay);
    }
  }

  function shuffleUnmatched(scene) {
    var unmatched = cards.filter(function (c) { return !c.matched; });
    if (unmatched.length < 4) { return; }
    var positions = unmatched.map(function (c) { return { x: c.view.x, y: c.view.y }; });
    for (var i = positions.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = positions[i]; positions[i] = positions[j]; positions[j] = t;
    }
    hudMsg.setText("Shuffle! \u{1F300}");
    lockBoard = true;
    unmatched.forEach(function (c, idx) {
      scene.tweens.add({ targets: c.view, x: positions[idx].x, y: positions[idx].y, duration: 300, ease: "Power2" });
    });
    setTimeout(function () { lockBoard = false; }, 350);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -200, 640, 400, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-320, -200, 640, 400, 28);
    var title = scene.add.text(0, -135, "\u{1F30A} Ocean Match \u{1F419}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -85, "Flip cards and find all pairs!", textStyle(22, "#2A6F97")).setOrigin(0.5);
    var descNormal = scene.add.text(-150, -45, "Normal\n6 pairs\nRelaxed", Object.assign(textStyle(16, "#102A43"), { align: "center" })).setOrigin(0.5);
    var descHard = scene.add.text(150, -45, "Hard Challenge\n8 pairs + 75s timer\n+ shuffle twist!", Object.assign(textStyle(16, "#102A43"), { align: "center", fontStyle: "bold" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F419} \u{1F42C} \u{1F433} \u{1F988} \u{1F422} \u{1F980}", { fontSize: "36px" }).setOrigin(0.5);
    var btnNormalBg = scene.add.graphics();
    btnNormalBg.fillStyle(0xFFFFFF, 1); btnNormalBg.fillRoundedRect(-260, 50, 220, 60, 30);
    btnNormalBg.lineStyle(3, 0x4EA8DE, 1); btnNormalBg.strokeRoundedRect(-260, 50, 220, 60, 30);
    var btnNormalTx = scene.add.text(-150, 80, "\u25B6  Normal", textStyle(22, "#102A43")).setOrigin(0.5);
    var btnHardBg = scene.add.graphics();
    btnHardBg.fillStyle(0x4EA8DE, 1); btnHardBg.fillRoundedRect(40, 50, 220, 60, 30);
    var btnHardTx = scene.add.text(150, 80, "\u2605 Hard", textStyle(22, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 145, "Hard: faster flips, timer & every 3 misses shuffle!", textStyle(14, "#2A6F97")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, descNormal, descHard, row, btnNormalBg, btnNormalTx, btnHardBg, btnHardTx, hint]);
    btnNormalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 50, 220, 60), Phaser.Geom.Rectangle.Contains);
    btnHardBg.setInteractive(new Phaser.Geom.Rectangle(40, 50, 220, 60), Phaser.Geom.Rectangle.Contains);
    function startWith(diff) {
      difficulty = diff;
      totalPairs = getPairsForDifficulty(difficulty);
      timeLeft = getTimeForDifficulty(difficulty);
      updateModeUI();
      started = true; lockBoard = false; moves = 0; matches = 0; mismatchCount = 0;
      hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
      startOverlay.setVisible(false);
      buildBoard(scene);
      if (difficulty === "hard") { hudTimer.setVisible(true); updateTimerDisplay(); }
      else { hudTimer.setVisible(false); stopTimer(); }
      scene.time.delayedCall(100, function () { focusedIndex = 0; updateFocus(); document.getElementById("game").focus(); });
    }
    btnNormalBg.on("pointerdown", function () { startWith("normal"); });
    btnHardBg.on("pointerdown", function () { startWith("hard"); });
    btnNormalBg.on("pointerover", function () { btnNormalBg.setScale(1.03); });
    btnNormalBg.on("pointerout", function () { btnNormalBg.setScale(1); });
    btnHardBg.on("pointerover", function () { btnHardBg.setScale(1.03); });
    btnHardBg.on("pointerout", function () { btnHardBg.setScale(1); });
    scene._startWith = startWith;
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -180, 600, 360, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 28);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(38, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 60, 280, 64, 32);
    var btnTx = scene.add.text(0, 92, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    var btnModeBg = scene.add.graphics();
    btnModeBg.fillStyle(0xFFFFFF, 1); btnModeBg.fillRoundedRect(-140, 135, 280, 44, 22);
    btnModeBg.lineStyle(2, 0x4EA8DE, 1); btnModeBg.strokeRoundedRect(-140, 135, 280, 44, 22);
    var btnModeTx = scene.add.text(0, 157, "Switch Mode", textStyle(16, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, btnModeBg, btnModeTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnModeBg.setInteractive(new Phaser.Geom.Rectangle(-140, 135, 280, 44), Phaser.Geom.Rectangle.Contains);
    btnModeBg.on("pointerdown", function () {
      endOverlay.setVisible(false);
      stopTimer();
      started = false; lockBoard = true;
      startOverlay.setVisible(true);
    });
  }

  function showWin(scene) {
    stopTimer();
    var stars = 1;
    if (difficulty === "hard") {
      if (moves <= 14 && timeLeft > 20) { stars = 3; }
      else if (moves <= 20 && timeLeft > 8) { stars = 2; }
      else { stars = 1; }
      endTitle.setText("\u{1F389} Challenge Complete! \u{1F389}");
      endDetail.setText("Hard Mode: " + totalPairs + " pairs in " + moves + " moves!\nTime left: " + timeLeft + "s  " + "\u2B50".repeat(stars) + "\n" + (stars === 3 ? "Ocean Master!" : stars === 2 ? "Deep Diver!" : "Keep diving!"));
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("You found all " + totalPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    stopTimer();
    lockBoard = true;
    endTitle.setText("\u{23F0} Time's Up! \u{1F30A}");
    endDetail.setText("Hard Challenge failed!\nPairs: " + matches + " / " + totalPairs + "  Moves: " + moves + "\nTry again — you can do it!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
  }

  function restart(scene) {
    stopTimer();
    moves = 0; matches = 0; mismatchCount = 0; firstPick = null; lockBoard = false; started = true;
    timeLeft = getTimeForDifficulty(difficulty);
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    if (difficulty === "hard") { hudTimer.setVisible(true); updateTimerDisplay(); }
    else { hudTimer.setVisible(false); }
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateModeUI();
    focusedIndex = 0; updateFocus();
  }

  function startTimer(scene) {
    stopTimer();
    if (difficulty !== "hard" || timeLeft <= 0) { return; }
    updateTimerDisplay();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimerDisplay();
        showLose(scene);
      }
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function updateTimerDisplay() {
    if (difficulty !== "hard") { return; }
    hudTimer.setText("Time: " + timeLeft + "s");
    hudTimer.setVisible(true);
    if (timeLeft <= 10) { hudTimer.setColor("#E63946"); }
    else if (timeLeft <= 20) { hudTimer.setColor("#E76F51"); }
    else { hudTimer.setColor("#014F86"); }
  }

  function updateModeUI() {
    totalPairs = getPairsForDifficulty(difficulty);
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
    if (hudMode) { hudMode.setText(difficulty === "hard" ? "Mode: Hard \u2605 8 pairs" : "Mode: Normal"); }
    if (hudTimer) {
      if (difficulty === "hard" && started) { hudTimer.setVisible(true); updateTimerDisplay(); }
      else if (difficulty === "hard" && !started) { hudTimer.setText("Time: " + getTimeForDifficulty("hard") + "s"); hudTimer.setVisible(true); hudTimer.setColor("#014F86"); }
      else { hudTimer.setVisible(false); }
    }
    var btnN = document.getElementById("btn-normal");
    var btnH = document.getElementById("btn-hard");
    if (btnN && btnH) {
      if (difficulty === "normal") {
        btnN.classList.add("active"); btnN.setAttribute("aria-pressed", "true");
        btnH.classList.remove("active"); btnH.setAttribute("aria-pressed", "false");
      } else {
        btnH.classList.add("active"); btnH.setAttribute("aria-pressed", "true");
        btnN.classList.remove("active"); btnN.setAttribute("aria-pressed", "false");
      }
    }
  }

  function setDifficulty(newDiff) {
    if (newDiff !== "normal" && newDiff !== "hard") { return; }
    difficulty = newDiff;
    totalPairs = getPairsForDifficulty(difficulty);
    timeLeft = getTimeForDifficulty(difficulty);
    mismatchCount = 0;
    updateModeUI();
    if (gameScene) {
      if (started) {
        restart(gameScene);
      } else {
        if (hudScore) { hudScore.setText("Pairs: 0 / " + totalPairs); }
        buildBoard(gameScene);
        if (startOverlay && startOverlay.visible) {
          // keep start overlay visible, just update board behind
        }
      }
    }
  }

  function setupDomModeButtons() {
    var btnNormal = document.getElementById("btn-normal");
    var btnHard = document.getElementById("btn-hard");
    if (btnNormal) {
      btnNormal.addEventListener("click", function () { setDifficulty("normal"); });
      btnNormal.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("normal"); }
      });
    }
    if (btnHard) {
      btnHard.addEventListener("click", function () { setDifficulty("hard"); });
      btnHard.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("hard"); }
      });
    }
    var gameEl = document.getElementById("game");
    if (gameEl) {
      gameEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          if (startOverlay && startOverlay.visible) {
            e.preventDefault();
            if (gameScene && gameScene._startWith) { gameScene._startWith(difficulty); }
          }
        }
      });
    }
  }
