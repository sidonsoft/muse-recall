<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#eaf6fb;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;gap:10px;padding:10px;box-sizing:border-box}
  #modeBar{display:flex;align-items:center;gap:10px;background:#ffffff;border:2px solid #4EA8DE;border-radius:999px;padding:8px 14px;box-shadow:0 4px 12px rgba(16,42,67,.12);flex-wrap:wrap;justify-content:center}
  #modeBar span{color:#102A43;font-weight:700;font-size:15px}
  #modeBar button{border:none;border-radius:999px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s, background .12s}
  #modeBar button[aria-pressed="true"]{background:#4EA8DE;color:#fff;box-shadow:0 2px 8px rgba(78,168,222,.35)}
  #modeBar button[aria-pressed="false"]{background:#eaf6fb;color:#102A43;border:1px solid #cfe8f3}
  #modeBar button:focus-visible{outline:3px solid #102A43;outline-offset:2px}
  #modeBar button:hover{transform:translateY(-1px)}
  #game{width:100vw;height:100vh;max-width:900px;max-height:640px;flex-shrink:0}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="modeBar" role="group" aria-label="Difficulty mode">
  <span id="modeLabel">Mode: Calm Bay</span>
  <button type="button" id="btnNormal" aria-label="Play calm bay mode with 6 pairs" aria-pressed="true">Calm Bay (6 pairs)</button>
  <button type="button" id="btnHard" aria-label="Play deep dive hard mode with 8 pairs" aria-pressed="false">Deep Dive (8 pairs)</button>
</div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F407}", name: "Rabbit" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = "normal";
  var totalPairs = 6;
  var modeBtnLabel = null, modeBtnBg = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupHtmlControls(s);
    updateModeUI();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xd4eaf7, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xa9def9, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2a7fb8, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x7fb8d8, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x7ec8e3, 0xa9def9, 0xcfe8f3];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5a9bb5, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 122, "Mode: Calm Bay", textStyle(15, "#4EA8DE")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var mBtn = scene.add.container(W - 300, 116);
    var mBg = scene.add.graphics();
    mBg.fillStyle(0xffffff, 1); mBg.fillRoundedRect(-86, -26, 172, 52, 26);
    mBg.lineStyle(2, 0x4EA8DE, 1); mBg.strokeRoundedRect(-86, -26, 172, 52, 26);
    modeBtnLabel = scene.add.text(0, 0, "Deep Dive", textStyle(15, "#102A43")).setOrigin(0.5);
    mBtn.add([mBg, modeBtnLabel]);
    mBg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    mBg.on("pointerdown", function () {
      var newMode = difficulty === "hard" ? "normal" : "hard";
      setDifficulty(newMode, scene);
    });
    mBg.on("pointerover", function () { mBtn.setScale(1.06); });
    mBg.on("pointerout", function () { mBtn.setScale(1); });
    modeBtnBg = mBg;
    scene.add.text(W / 2, 168, "Find the animal pairs! Take your time, no rush.", textStyle(17, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var pool = difficulty === "hard" ? ANIMALS : ANIMALS.slice(0, 6);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (difficulty === "hard") {
      cols = 4; rows = 4;
      cw = 165; ch = 115; gx = 85; gy = 185; padX = 18; padY = 12;
      totalPairs = 8;
    } else {
      cols = 4; rows = 3;
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
      totalPairs = 6;
    }
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd4eaf7, 0xa9def9, 0xcfe8f3, 0xeaf6fb, 0xb8e0ea, 0x7ec8e3, 0x8ecae6, 0x4EA8DE];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -135, "\u{1F30A} Farmyard Match \u{1F404}", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -85, "Choose your voyage! No timers, no penalties.", Object.assign(textStyle(18), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -45, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var hint = scene.add.text(0, -10, "Take your time and enjoy the gentle waves.", textStyle(15, "#5a7a8a")).setOrigin(0.5);
    var btnNormalBg = scene.add.graphics();
    btnNormalBg.fillStyle(0xeaf6fb, 1); btnNormalBg.fillRoundedRect(-260, 30, 240, 64, 20);
    btnNormalBg.lineStyle(3, 0x4EA8DE, 1); btnNormalBg.strokeRoundedRect(-260, 30, 240, 64, 20);
    var btnNormalTx1 = scene.add.text(-140, 48, "Calm Bay", textStyle(20, "#102A43")).setOrigin(0.5);
    var btnNormalTx2 = scene.add.text(-140, 70, "6 pairs \u2022 gentle", textStyle(13, "#4EA8DE")).setOrigin(0.5);
    var btnHardBg = scene.add.graphics();
    btnHardBg.fillStyle(0x4EA8DE, 1); btnHardBg.fillRoundedRect(20, 30, 240, 64, 20);
    var btnHardTx1 = scene.add.text(140, 48, "Deep Dive", textStyle(20, "#ffffff")).setOrigin(0.5);
    var btnHardTx2 = scene.add.text(140, 70, "8 pairs \u2022 challenge", textStyle(13, "#ffffff")).setOrigin(0.5);
    var foot = scene.add.text(0, 135, "Tip: Press N for Calm Bay, H for Deep Dive", textStyle(13, "#5a7a8a")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnNormalBg, btnNormalTx1, btnNormalTx2, btnHardBg, btnHardTx1, btnHardTx2, foot]);
    btnNormalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 30, 240, 64), Phaser.Geom.Rectangle.Contains);
    btnHardBg.setInteractive(new Phaser.Geom.Rectangle(20, 30, 240, 64), Phaser.Geom.Rectangle.Contains);
    function startNormal() {
      difficulty = "normal"; totalPairs = 6;
      updateModeUI();
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      buildBoard(scene);
    }
    function startHard() {
      difficulty = "hard"; totalPairs = 8;
      updateModeUI();
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Deep Dive! Take your time!");
      buildBoard(scene);
    }
    btnNormalBg.on("pointerdown", startNormal);
    btnHardBg.on("pointerdown", startHard);
    btnNormalBg.on("pointerover", function () { btnNormalBg.setScale(1.03); });
    btnNormalBg.on("pointerout", function () { btnNormalBg.setScale(1); });
    btnHardBg.on("pointerover", function () { btnHardBg.setScale(1.03); });
    btnHardBg.on("pointerout", function () { btnHardBg.setScale(1); });
    scene.input.keyboard.on("keydown", function (e) {
      if (!startOverlay.visible) return;
      if (e.key === "n" || e.key === "N") { startNormal(); }
      if (e.key === "h" || e.key === "H") { startHard(); }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -180, 600, 360, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnAgainBg = scene.add.graphics();
    btnAgainBg.fillStyle(0x4EA8DE, 1); btnAgainBg.fillRoundedRect(-260, 50, 240, 60, 30);
    var btnAgainTx = scene.add.text(-140, 80, "\u21BB Play Again", textStyle(20, "#ffffff")).setOrigin(0.5);
    var btnSwitchBg = scene.add.graphics();
    btnSwitchBg.fillStyle(0xffffff, 1); btnSwitchBg.fillRoundedRect(20, 50, 240, 60, 30);
    btnSwitchBg.lineStyle(3, 0x4EA8DE, 1); btnSwitchBg.strokeRoundedRect(20, 50, 240, 60, 30);
    var btnSwitchTx = scene.add.text(140, 80, "\u21C4 Switch Mode", textStyle(18, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnAgainBg, btnAgainTx, btnSwitchBg, btnSwitchTx]);
    btnAgainBg.setInteractive(new Phaser.Geom.Rectangle(-260, 50, 240, 60), Phaser.Geom.Rectangle.Contains);
    btnSwitchBg.setInteractive(new Phaser.Geom.Rectangle(20, 50, 240, 60), Phaser.Geom.Rectangle.Contains);
    btnAgainBg.on("pointerdown", function () { restart(scene); });
    btnSwitchBg.on("pointerdown", function () {
      var newMode = difficulty === "hard" ? "normal" : "hard";
      setDifficulty(newMode, scene);
    });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var modeName = difficulty === "hard" ? "Deep Dive (8 pairs)" : "Calm Bay (6 pairs)";
    var encourage = difficulty === "hard" ? "Amazing deep sea explorer!" : "Try Deep Dive for 8 pairs next time!";
    endDetail.setText("You found all " + totalPairs + " pairs!\nMode: " + modeName + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\n" + encourage);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateModeUI();
  }

  function setDifficulty(mode, scene) {
    difficulty = mode;
    totalPairs = mode === "hard" ? 8 : 6;
    updateModeUI();
    if (scene) {
      restart(scene);
    }
  }

  function updateModeUI() {
    var isHard = difficulty === "hard";
    if (hudMode) {
      hudMode.setText(isHard ? "Mode: Deep Dive (8 pairs)" : "Mode: Calm Bay (6 pairs)");
    }
    if (hudScore) {
      hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    }
    if (modeBtnLabel) {
      modeBtnLabel.setText(isHard ? "Calm Bay" : "Deep Dive");
      modeBtnLabel.setColor(isHard ? "#ffffff" : "#102A43");
    }
    if (modeBtnBg) {
      modeBtnBg.clear();
      if (isHard) {
        modeBtnBg.fillStyle(0x4EA8DE, 1); modeBtnBg.fillRoundedRect(-86, -26, 172, 52, 26);
      } else {
        modeBtnBg.fillStyle(0xffffff, 1); modeBtnBg.fillRoundedRect(-86, -26, 172, 52, 26);
        modeBtnBg.lineStyle(2, 0x4EA8DE, 1); modeBtnBg.strokeRoundedRect(-86, -26, 172, 52, 26);
      }
    }
    var btnN = document.getElementById("btnNormal");
    var btnH = document.getElementById("btnHard");
    if (btnN && btnH) {
      btnN.setAttribute("aria-pressed", isHard ? "false" : "true");
      btnH.setAttribute("aria-pressed", isHard ? "true" : "false");
    }
    var modeLabel = document.getElementById("modeLabel");
    if (modeLabel) {
      modeLabel.textContent = isHard ? "Mode: Deep Dive" : "Mode: Calm Bay";
    }
  }

  function setupHtmlControls(scene) {
    var btnN = document.getElementById("btnNormal");
    var btnH = document.getElementById("btnHard");
    if (!btnN || !btnH) return;
    function activateNormal() { setDifficulty("normal", scene); }
    function activateHard() { setDifficulty("hard", scene); }
    btnN.addEventListener("click", activateNormal);
    btnH.addEventListener("click", activateHard);
    btnN.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        activateNormal();
      }
    });
    btnH.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        activateHard();
      }
    });
  }

  function setupKeyboard(scene) {
    if (!scene.input.keyboard) return;
    scene.input.keyboard.on("keydown", function (e) {
      if (e.key === "r" || e.key === "R") {
        restart(scene);
      } else if (e.key === "m" || e.key === "M") {
        var newMode = difficulty === "hard" ? "normal" : "hard";
        setDifficulty(newMode, scene);
      } else if (e.key === "n" || e.key === "N") {
        if (!started || startOverlay.visible) {
          setDifficulty("normal", scene);
        }
      } else if (e.key === "h" || e.key === "H") {
        if (!started || startOverlay.visible) {
          setDifficulty("hard", scene);
        }
      }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
