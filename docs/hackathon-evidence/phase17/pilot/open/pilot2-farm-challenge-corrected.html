<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #gameWrap{position:relative;width:100vw;height:100vh;max-width:900px;max-height:700px;display:flex;align-items:center;justify-content:center}
  #game{width:100%;height:100%}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  #modeBar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:999px;box-shadow:0 4px 16px rgba(16,42,67,.12);border:1px solid #B9D9EB}
  .modeBtn{appearance:none;border:2px solid #4EA8DE;background:#fff;color:#102A43;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .15s}
  .modeBtn[aria-pressed="true"]{background:#4EA8DE;color:#fff;border-color:#4EA8DE;box-shadow:0 2px 8px rgba(78,168,222,.35)}
  .modeBtn:focus{outline:3px solid #102A43;outline-offset:2px}
  .modeBtn:hover{transform:translateY(-1px)}
  @media (max-width:600px){#modeBar{top:8px;padding:4px 8px;gap:6px}.modeBtn{font-size:12px;padding:6px 10px}}
</style>
</head>
<body>
<div id="gameWrap">
  <div id="game"></div>
  <div id="modeBar" role="group" aria-label="Difficulty selection">
    <button type="button" id="btnNormal" class="modeBtn" aria-pressed="true" aria-label="Normal mode with 6 pairs">Normal • 6 Pairs</button>
    <button type="button" id="btnHard" class="modeBtn" aria-pressed="false" aria-label="Hard mode with 8 pairs for experienced players">Hard • 8 Pairs</button>
  </div>
</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F980}", name: "Crab" }
  ];
  var W = 900, H = 700;
  var difficulty = 'normal';
  var PAIRS_NORMAL = 6;
  var PAIRS_HARD = 8;
  var GRID_NORMAL = { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
  var GRID_HARD = { cols: 4, rows: 4, cw: 165, ch: 115, gx: 62, gy: 175, padX: 18, padY: 14 };

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#DCEEF8",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var btnNormalEl, btnHardEl;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    initModeBar(s);
    updateModeUI();
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xDCEEF8, 1); g.fillRect(0, 0, W, 180);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xB9D9EB, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(0, 520, W, 180);
    g.fillStyle(0x2A7F9E, 0.25); g.fillRect(0, 520, W, 180);
    g.lineStyle(3, 0xFFFFFF, 0.9);
    for (var wy = 540; wy < 700; wy += 28) {
      for (var wx = 0; wx < W; wx += 80) {
        g.beginPath();
        g.moveTo(wx, wy);
        g.lineTo(wx + 20, wy - 6);
        g.lineTo(wx + 40, wy);
        g.strokePath();
      }
    }
    g.fillStyle(0x102A43, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(90, 340, 130, 130);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(90, 360, 130, 18); g.fillRect(90, 400, 130, 18); g.fillRect(90, 440, 130, 18);
    g.fillStyle(0xFF6B6B, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xFFF3E0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(8, 0x102A43, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x7ED6DF, 0xB9D9EB, 0x102A43];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2A7F9E, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFFFFF, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }
  var drawFarm = drawOcean;

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 112, "Mode: Normal", textStyle(16, "#2A7F9E")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#2A7F9E")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find all pairs — try Hard for 8 pairs!", textStyle(18, "#2A7F9E")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var count = difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
    var pool = ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function getGrid() {
    return difficulty === 'hard' ? GRID_HARD : GRID_NORMAL;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var grid = getGrid();
    var cols = grid.cols, rows = grid.rows;
    var cw = grid.cw, ch = grid.ch, gx = grid.gx, gy = grid.gy, padX = grid.padX, padY = grid.padY;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    var total = difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + total);
    if (hudMode) hudMode.setText("Mode: " + (difficulty === 'hard' ? "Hard \u2022 8 Pairs" : "Normal"));
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    back.fillStyle(0xFFFFFF, 0.85);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 11);
    var paw = scene.add.text(0, -4, "\u{1F30A}", { fontSize: (w > 170 ? "48px" : "40px") }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xEAF6FB, 0xDCEEF8, 0xB9D9EB, 0x7ED6DF, 0xA8E6CF, 0xFFD6A5, 0xE4C1F9, 0xC8E7FF, 0xFFF1A8, 0xFFC8DD];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: (w > 170 ? "56px" : "48px") }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 170 ? 20 : 18)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        var total = difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
        hudScore.setText("Pairs: " + matches + " / " + total);
        hudMsg.setText(matches === total ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === total) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-310, -210, 620, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F30A} Ocean Match \u{1F419}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -95, "Flip the cards and find all pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -50, "\u{1F404} \u{1F437} \u{1F419} \u{1F433} \u{1F42C} \u{1F980}", { fontSize: "38px" }).setOrigin(0.5);
    var modeLabel = scene.add.text(0, -10, "Choose difficulty:", textStyle(18, "#2A7F9E")).setOrigin(0.5);
    var btnNormalBg = scene.add.graphics();
    btnNormalBg.fillStyle(0x4EA8DE, 1); btnNormalBg.fillRoundedRect(-260, 20, 240, 64, 32);
    var btnNormalTx = scene.add.text(-140, 52, "Normal \u2022 6 Pairs", textStyle(20, "#ffffff")).setOrigin(0.5);
    var btnNormalSub = scene.add.text(-140, 72, "4 \u00D7 3 \u2022 Relaxed", textStyle(13, "#EAF6FB")).setOrigin(0.5);
    var btnHardBg = scene.add.graphics();
    btnHardBg.fillStyle(0x102A43, 1); btnHardBg.fillRoundedRect(20, 20, 240, 64, 32);
    var btnHardTx = scene.add.text(140, 52, "Hard \u2022 8 Pairs", textStyle(20, "#ffffff")).setOrigin(0.5);
    var btnHardSub = scene.add.text(140, 72, "4 \u00D7 4 \u2022 Challenge", textStyle(13, "#B9D9EB")).setOrigin(0.5);
    var hint = scene.add.text(0, 115, "Hard mode: more cards, same fun!", textStyle(16, "#2A7F9E")).setOrigin(0.5);
    var startHint = scene.add.text(0, 145, "You can switch anytime with the top toggle", textStyle(13, "#5A7A8A")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, modeLabel, btnNormalBg, btnNormalTx, btnNormalSub, btnHardBg, btnHardTx, btnHardSub, hint, startHint]);
    btnNormalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 20, 240, 64), Phaser.Geom.Rectangle.Contains);
    btnHardBg.setInteractive(new Phaser.Geom.Rectangle(20, 20, 240, 64), Phaser.Geom.Rectangle.Contains);
    btnNormalBg.on("pointerdown", function () {
      difficulty = 'normal';
      updateModeUI();
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      restart(scene);
      startOverlay.setVisible(false);
      started = true; lockBoard = false;
    });
    btnHardBg.on("pointerdown", function () {
      difficulty = 'hard';
      updateModeUI();
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Hard mode! Tap a card!");
      restart(scene);
      startOverlay.setVisible(false);
      started = true; lockBoard = false;
    });
    btnNormalBg.on("pointerover", function () { btnNormalBg.setAlpha(0.9); });
    btnNormalBg.on("pointerout", function () { btnNormalBg.setAlpha(1); });
    btnHardBg.on("pointerover", function () { btnHardBg.setAlpha(0.9); });
    btnHardBg.on("pointerout", function () { btnHardBg.setAlpha(1); });
    scene.input.keyboard.on("keydown-N", function () {
      if (startOverlay.visible) { difficulty = 'normal'; updateModeUI(); started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card!"); restart(scene); startOverlay.setVisible(false); started = true; lockBoard = false; }
    });
    scene.input.keyboard.on("keydown-H", function () {
      if (startOverlay.visible) { difficulty = 'hard'; updateModeUI(); started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Hard mode! Tap a card!"); restart(scene); startOverlay.setVisible(false); started = true; lockBoard = false; }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var total = difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
    var stars;
    if (difficulty === 'hard') {
      stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1);
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    var modeName = difficulty === 'hard' ? "Hard (8 pairs)" : "Normal (6 pairs)";
    endDetail.setText("You found all " + total + " pairs!\nMode: " + modeName + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    var total = difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + total); hudMsg.setText(difficulty === 'hard' ? "Hard mode! Tap a card!" : "Tap a card!");
    if (hudMode) hudMode.setText("Mode: " + (difficulty === 'hard' ? "Hard \u2022 8 Pairs" : "Normal"));
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { if (c.view) c.view.destroy(); });
    buildBoard(scene);
  }

  function initModeBar(scene) {
    btnNormalEl = document.getElementById("btnNormal");
    btnHardEl = document.getElementById("btnHard");
    if (!btnNormalEl || !btnHardEl) return;
    function handleNormal() { setDifficulty(scene, 'normal'); }
    function handleHard() { setDifficulty(scene, 'hard'); }
    btnNormalEl.addEventListener("click", handleNormal);
    btnHardEl.addEventListener("click", handleHard);
    btnNormalEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleNormal(); }
    });
    btnHardEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleHard(); }
    });
    document.addEventListener("keydown", function (e) {
      if (!startOverlay || !startOverlay.visible) return;
      if (e.key === "Enter") {
        if (difficulty === 'hard') { handleHard(); } else { handleNormal(); }
      }
    });
  }

  function setDifficulty(scene, newDiff) {
    difficulty = newDiff;
    updateModeUI();
    if (started || (startOverlay && !startOverlay.visible)) {
      restart(scene);
    } else {
      cards.forEach(function (c) { if (c.view) c.view.destroy(); });
      buildBoard(scene);
      var total = difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
      hudScore.setText("Pairs: 0 / " + total);
    }
  }

  function updateModeUI() {
    if (!btnNormalEl || !btnHardEl) {
      btnNormalEl = document.getElementById("btnNormal");
      btnHardEl = document.getElementById("btnHard");
    }
    if (btnNormalEl && btnHardEl) {
      var isHard = difficulty === 'hard';
      btnNormalEl.setAttribute("aria-pressed", isHard ? "false" : "true");
      btnHardEl.setAttribute("aria-pressed", isHard ? "true" : "false");
    }
    if (hudMode) {
      hudMode.setText("Mode: " + (difficulty === 'hard' ? "Hard \u2022 8 Pairs" : "Normal"));
    }
    var total = difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + total);
  }

  function update() {}
})();
</script>
</body>
</html>
