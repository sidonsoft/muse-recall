<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-2: #f0d49a;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
    --glow: 0 8px 24px rgba(231,193,124,0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, rgba(231,193,124,0.12), transparent 60%), radial-gradient(900px 500px at 90% 0%, rgba(224,143,126,0.10), transparent 60%), var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    position: relative;
    overflow-x: hidden;
  }
  .bg-orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.55;
    animation: float 12s ease-in-out infinite;
  }
  .orb1 {
    width: 420px;
    height: 420px;
    background: radial-gradient(circle at 30% 30%, rgba(231,193,124,0.18), transparent 70%);
    top: -80px;
    left: -80px;
  }
  .orb2 {
    width: 360px;
    height: 360px;
    background: radial-gradient(circle at 50% 50%, rgba(224,143,126,0.14), transparent 70%);
    top: 38%;
    right: -60px;
    animation-delay: -4s;
  }
  .orb3 {
    width: 520px;
    height: 520px;
    background: radial-gradient(circle at 50% 50%, rgba(231,193,124,0.10), transparent 70%);
    bottom: -140px;
    left: 28%;
    animation-delay: -8s;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) translateX(0) scale(1); }
    50% { transform: translateY(-18px) translateX(10px) scale(1.05); }
  }
  .app {
    width: 100%;
    max-width: 620px;
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(231,193,124,0.35);
    animation: pulseMark 2.8s ease-in-out infinite;
  }
  @keyframes pulseMark {
    0%,100% { transform: scale(1) rotate(0deg); box-shadow: 0 4px 14px rgba(231,193,124,0.35); }
    50% { transform: scale(1.05) rotate(2deg); box-shadow: 0 6px 20px rgba(231,193,124,0.45); }
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.2);
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
    transition: color 0.3s ease, transform 0.3s ease;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(231,193,124,0.06);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(231,193,124,0.22), transparent 42%, rgba(224,143,126,0.14));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.7;
  }
  .add-row {
    display: flex;
    gap: 10px;
    position: relative;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(231,193,124,0.18);
    transform: translateY(-1px);
    background: #2b2824;
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  #priorityInput:hover { border-color: rgba(231,193,124,0.35); color: var(--text); }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(231,193,124,0.30);
    transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }
  #addBtn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(231,193,124,0.38); }
  #addBtn:active { filter: brightness(0.96); transform: translateY(0) scale(0.98); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  #addBtn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: left 0.5s ease;
  }
  #addBtn:hover::after { left: 100%; }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .filter-btn:active { transform: translateY(0) scale(0.97); }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(231,193,124,0.20);
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  #clearBtn:hover { color: var(--text); transform: translateY(-1px); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
    transform: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; transition: color 0.3s ease, transform 0.3s ease; }
  #progressLabel.all-done { color: var(--accent); animation: pulseText 1.2s ease infinite; }
  @keyframes pulseText {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  #progressPct {
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    color: var(--accent);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
    position: relative;
  }
  .progress-track::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
    animation: shimmerTrack 2.2s infinite;
    opacity: 0.6;
    pointer-events: none;
  }
  @keyframes shimmerTrack {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #f0d49a);
    box-shadow: 0 0 10px rgba(231,193,124,0.45);
    transition: width 0.45s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
  }
  #progressBar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    animation: slideIn 0.38s cubic-bezier(0.34,1.56,0.64,1) both;
    will-change: transform;
  }
  .task:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    border-color: rgba(231,193,124,0.32);
  }
  .task:active { transform: translateY(0); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .task.completed { opacity: 0.82; background: rgba(38,35,32,0.72); border-color: rgba(231,193,124,0.16); }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
    animation: pop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pop {
    0% { transform: scale(0.7); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .check:hover { background: var(--accent-soft); transform: scale(1.08); }
  .task.completed .check:hover { background: var(--accent); }
  .check:active { transform: scale(0.92); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    transition: color 0.2s ease;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
    transform: translateY(-1px);
  }
  .icon-btn:active { transform: scale(0.96); }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .priority-btn:active { transform: scale(0.96); }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 4px 12px rgba(231,193,124,0.18);
    animation: wiggle 0.4s ease;
  }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-1.5deg) scale(1.02); }
    75% { transform: rotate(1.5deg) scale(1.02); }
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); transition: color 0.2s ease; }
  #prioritySummary.has-high { color: var(--accent); font-weight: 600; }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(231,193,124,0.06), transparent 70%);
  }
  .empty::before {
    content: "✨";
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 18px;
    animation: twinkle 2s ease-in-out infinite;
    opacity: 0.7;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.5; transform: scale(1) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(8deg); }
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
    animation: fadeUp 0.7s ease 0.2s both;
  }
  #toastStack {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    z-index: 9999;
    pointer-events: none;
  }
  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(231,193,124,0.12);
    animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both, toastOut 0.35s ease 2.2s forwards;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-8px) scale(0.98); }
  }
  #confettiLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9998;
  }
  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confettiFall 900ms cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(220px) rotate(720deg) scale(0.8); opacity: 0; }
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><span class="orb orb1"></span><span class="orb orb2"></span><span class="orb orb3"></span></div>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>
<div id="toastStack" aria-live="polite" aria-atomic="true"></div>
<div id="confettiLayer" aria-hidden="true"></div>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var subtitle = document.querySelector(".subtitle");
  var toastStack = document.getElementById("toastStack");
  var confettiLayer = document.getElementById("confettiLayer");

  function showToast(message) {
    if (!toastStack) return;
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = message;
    toastStack.appendChild(t);
    setTimeout(function () {
      if (t.parentNode) t.parentNode.removeChild(t);
    }, 2600);
  }

  function burstConfetti(x, y) {
    if (!confettiLayer) return;
    var colors = ["#e7c17c", "#f0d49a", "#e08f7e", "#b3a898", "#ffffff"];
    for (var i = 0; i < 14; i++) {
      var c = document.createElement("span");
      c.className = "confetti";
      var offsetX = (Math.random() * 80 - 40);
      var offsetY = (Math.random() * 20 - 10);
      c.style.left = (x + offsetX) + "px";
      c.style.top = (y + offsetY) + "px";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      c.style.animationDelay = (Math.random() * 0.15) + "s";
      c.style.animationDuration = (0.7 + Math.random() * 0.5) + "s";
      if (Math.random() > 0.5) {
        c.style.borderRadius = "50%";
        c.style.width = "7px";
        c.style.height = "7px";
      }
      confettiLayer.appendChild(c);
      (function (el) {
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 1200);
      })(c);
    }
  }

  function updateSubtitle(total, done) {
    if (!subtitle) return;
    if (total === 0) {
      subtitle.textContent = "A calm place for today's tasks — let's add one! ✨";
    } else if (done === total && total > 0) {
      subtitle.textContent = "All done! You're on fire! 🎉";
    } else if (done / total >= 0.5) {
      subtitle.textContent = "Great momentum — keep going! 💫";
    } else if (done > 0) {
      subtitle.textContent = "Nice start — keep the flow! 🌿";
    } else {
      subtitle.textContent = "A calm place for today's tasks.";
    }
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
    if (priority === "high") {
      showToast("High priority added — you've got this! ⚡");
    } else {
      showToast("Added! Let's go ✨");
    }
    var rect = addBtn.getBoundingClientRect();
    burstConfetti(rect.left + rect.width / 2, rect.top + 8);
  }

  function toggleTask(id, evt) {
    var wasCompleted = false;
    var willCompleted = false;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        wasCompleted = tasks[i].completed;
        tasks[i].completed = !tasks[i].completed;
        willCompleted = tasks[i].completed;
        break;
      }
    }
    render();
    if (!wasCompleted && willCompleted) {
      showToast("Nice work! Completed ✓");
      if (evt && evt.currentTarget) {
        var r = evt.currentTarget.getBoundingClientRect();
        burstConfetti(r.left + r.width / 2, r.top + r.height / 2);
      } else {
        burstConfetti(window.innerWidth / 2, window.innerHeight / 2);
      }
      var total = tasks.length;
      var done = tasks.filter(function (t) { return t.completed; }).length;
      if (total > 0 && done === total) {
        setTimeout(function () {
          showToast("All tasks done! Celebrate! 🎉");
          burstConfetti(window.innerWidth / 2, 120);
          burstConfetti(window.innerWidth / 2 - 80, 140);
          burstConfetti(window.innerWidth / 2 + 80, 140);
        }, 180);
      }
    } else if (wasCompleted && !willCompleted) {
      showToast("Back to active — you got this!");
    }
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        var isHigh = tasks[i].priority === "high";
        showToast(isHigh ? "Marked as high priority ⭐" : "Priority cleared");
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
    showToast("Task removed");
  }

  function clearCompleted() {
    var done = tasks.filter(function (t) { return t.completed; }).length;
    if (done === 0) return;
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
    showToast("Cleared " + done + " completed task" + (done === 1 ? "" : "s") + " 🧹");
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));
    if (pct === 100 && total > 0) {
      progressLabel.classList.add("all-done");
    } else {
      progressLabel.classList.remove("all-done");
    }
    progressPct.style.transform = pct > 0 ? "scale(1.08)" : "scale(1)";
    setTimeout(function () { progressPct.style.transform = "scale(1)"; }, 220);

    updateSubtitle(total, done);

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
      prioritySummary.classList.remove("has-high");
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "⚡ 1 high-priority task remaining";
      prioritySummary.classList.add("has-high");
    } else {
      prioritySummary.textContent = "⚡ " + highRemaining + " high-priority tasks remaining";
      prioritySummary.classList.add("has-high");
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task, index) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      li.style.animationDelay = (index * 0.04) + "s";

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function (e) { toggleTask(task.id, e); });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
