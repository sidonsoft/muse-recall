<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
  }
  #addBtn:hover { filter: brightness(1.06); }
  #addBtn:active { filter: brightness(0.96); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #clearBtn:hover { color: var(--text); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
  }
  .task.completed { opacity: 0.82; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .check:hover { background: var(--accent-soft); }
  .task.completed .check:hover { background: var(--accent); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
  }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  /* Celebratory completion styles */
  .task.just-completed {
    animation: taskGlow 650ms ease;
    border-color: var(--accent);
  }
  .check.celebrate {
    animation: checkPop 520ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  #progressBar.celebrating {
    animation: progressPulse 650ms ease;
  }
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .confetti {
    position: absolute;
    top: -12px;
    border-radius: 2px;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    animation-fill-mode: forwards;
  }
  .burst-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 51;
    animation: burstOut 820ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  #celebrationToast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 750;
    font-size: 0.95rem;
    letter-spacing: 0.2px;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
    z-index: 60;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  #celebrationToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  @keyframes checkPop {
    0% { transform: scale(1); }
    25% { transform: scale(1.38); }
    50% { transform: scale(0.92); }
    75% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes taskGlow {
    0% { background: var(--surface-2); transform: scale(1); box-shadow: 0 0 0 rgba(231,193,124,0); }
    30% { background: rgba(231,193,124,0.18); transform: scale(1.015); box-shadow: 0 6px 18px rgba(231,193,124,0.18); }
    100% { background: var(--surface-2); transform: scale(1); box-shadow: 0 0 0 rgba(231,193,124,0); }
  }
  @keyframes progressPulse {
    0% { filter: brightness(1); box-shadow: 0 0 0 rgba(231,193,124,0); }
    35% { filter: brightness(1.18); box-shadow: 0 0 16px rgba(231,193,124,0.65); }
    100% { filter: brightness(1); box-shadow: 0 0 0 rgba(231,193,124,0); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(var(--drift, 0px)); opacity: 0; }
  }
  @keyframes burstOut {
    0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.7) rotate(720deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .task.just-completed,
    .check.celebrate,
    #progressBar.celebrating,
    .confetti,
    .burst-piece {
      animation: none !important;
    }
    #celebrationToast { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>
<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
<div id="celebrationToast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var confettiLayer = document.getElementById("confettiLayer");
  var celebrationToast = document.getElementById("celebrationToast");
  var toastTimer = null;
  var pendingCelebrateId = null;
  var lastPct = 0;

  function showCelebrationToast() {
    var messages = ["Nice work! ✨", "Task done! 🎉", "You're on fire! 🔥", "Keep it up! ⭐", "Celebrated! 🎊", "Lovely — done! 🌟"];
    var msg = messages[Math.floor(Math.random() * messages.length)];
    celebrationToast.textContent = msg;
    celebrationToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      celebrationToast.classList.remove("show");
    }, 2200);
  }

  function spawnFallingConfetti() {
    var colors = ["#e7c17c", "#f2ede3", "#d4a574", "#fff7e6", "#c9a86a", "#e8dcc6"];
    for (var i = 0; i < 18; i++) {
      var c = document.createElement("span");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 0.22) + "s";
      c.style.animationDuration = (700 + Math.random() * 500) + "ms";
      c.style.width = (6 + Math.random() * 7) + "px";
      c.style.height = (8 + Math.random() * 9) + "px";
      c.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
      c.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      if (Math.random() > 0.5) {
        c.style.borderRadius = "999px";
      }
      confettiLayer.appendChild(c);
      (function (el) {
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1300);
      })(c);
    }
  }

  function spawnBurstAt(x, y) {
    var burstColors = ["#e7c17c", "#f2ede3", "#d4a574", "#fff7e6", "#c9a86a"];
    for (var i = 0; i < 14; i++) {
      var p = document.createElement("span");
      p.className = "burst-piece";
      var angle = (Math.PI * 2 * i / 14) + (Math.random() * 0.5 - 0.25);
      var dist = 36 + Math.random() * 62;
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist - 12;
      p.style.setProperty("--tx", tx + "px");
      p.style.setProperty("--ty", ty + "px");
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = burstColors[Math.floor(Math.random() * burstColors.length)];
      p.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      if (i % 3 === 0) {
        p.style.borderRadius = "999px";
        p.style.width = "8px";
        p.style.height = "8px";
      }
      confettiLayer.appendChild(p);
      (function (el) {
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
      })(p);
    }
  }

  function triggerCelebration(cx, cy) {
    showCelebrationToast();
    spawnFallingConfetti();
    if (typeof cx === "number" && typeof cy === "number") {
      spawnBurstAt(cx, cy);
    }
    progressBar.classList.remove("celebrating");
    void progressBar.offsetWidth;
    progressBar.classList.add("celebrating");
    setTimeout(function () {
      progressBar.classList.remove("celebrating");
    }, 700);
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    if (total > 0 && done === total) {
      setTimeout(function () { spawnFallingConfetti(); }, 180);
      setTimeout(function () {
        celebrationToast.textContent = "All done! Amazing! 🎉";
        celebrationToast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { celebrationToast.classList.remove("show"); }, 2400);
      }, 320);
    }
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
  }

  function toggleTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].completed = !tasks[i].completed;
        break;
      }
    }
    render();
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    if (pct > lastPct && lastPct !== 0) {
      progressBar.classList.remove("celebrating");
      void progressBar.offsetWidth;
      progressBar.classList.add("celebrating");
      setTimeout(function () { progressBar.classList.remove("celebrating"); }, 700);
    }
    lastPct = pct;

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      if (pendingCelebrateId !== null && task.id === pendingCelebrateId && task.completed) {
        li.className += " just-completed";
      }

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      if (pendingCelebrateId !== null && task.id === pendingCelebrateId && task.completed) {
        check.className += " celebrate";
      }
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function (e) {
        var wasCompleted = task.completed;
        var rect = e.currentTarget.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        if (!wasCompleted) {
          pendingCelebrateId = task.id;
          toggleTask(task.id);
          triggerCelebration(cx, cy);
          setTimeout(function () {
            pendingCelebrateId = null;
          }, 700);
        } else {
          pendingCelebrateId = null;
          toggleTask(task.id);
        }
      });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
