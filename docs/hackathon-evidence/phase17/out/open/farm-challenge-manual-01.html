<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F4FA;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;position:relative}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;outline:none}
  #game:focus{box-shadow:0 0 0 4px #4EA8DE}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #mode-controls{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:5}
  #mode-controls button{border-radius:20px;padding:8px 16px;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;font-size:15px;cursor:pointer;transition:transform .15s, background .15s, color .15s}
  #mode-controls button:focus{outline:3px solid #102A43;outline-offset:2px}
  #mode-controls button:hover{transform:scale(1.04)}
</style>
</head>
<body>
<div id="mode-controls" role="group" aria-label="Difficulty selection">
  <button type="button" id="btn-easy-dom" aria-label="Select easy mode with 6 pairs" style="background:#4EA8DE;color:#ffffff;border:2px solid #4EA8DE;">Easy: 6 pairs</button>
  <button type="button" id="btn-hard-dom" aria-label="Select hard mode with 8 pairs" style="background:#ffffff;color:#102A43;border:2px solid #4EA8DE;">Hard: 8 pairs</button>
</div>
<div id="game" tabindex="0" aria-label="Ocean Memory Match game. Use arrow keys to move focus between cards and press Enter to flip. Press E for easy mode, H for hard mode, R to restart."></div>
<div id="live-region" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F433}", name: "Whale" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = "easy", totalPairs = 6, focusedIndex = 0, focusRing = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupDomControls(s);
    document.addEventListener("keydown", handleKeyDown);
    s.game.canvas.setAttribute("aria-label", "Ocean Memory Match board with " + totalPairs + " pairs");
    updateDomButtons();
    announce("Welcome to Ocean Match. Choose easy with 6 pairs or hard with 8 pairs, then press Start.");
  }

  function announce(msg) {
    var el = document.getElementById("live-region");
    if (el) { el.textContent = msg; }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xBAE6FD, 1); g.fillRect(0, 0, W, 130);
    g.fillStyle(0x7DD3FC, 1); g.fillRect(0, 130, W, 70);
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 200, W, 270);
    g.fillStyle(0xFEF9E7, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xFDE68A, 0.9); g.fillRect(0, 620, W, 80);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.lineStyle(3, 0xffffff, 0.9);
    g.strokeEllipse(200, 145, 220, 28); g.strokeEllipse(380, 155, 200, 24); g.strokeEllipse(560, 145, 180, 22);
    g.fillStyle(0x0E7490, 1);
    for (var i = 0; i < 5; i++) {
      var sx = 90 + i * 170;
      g.fillEllipse(sx, 590, 22, 90); g.fillEllipse(sx + 12, 570, 16, 70); g.fillEllipse(sx - 10, 575, 14, 60);
    }
    g.fillStyle(0x0891B2, 1);
    for (var i = 0; i < 5; i++) {
      var sx2 = 160 + i * 170;
      g.fillEllipse(sx2, 600, 18, 70); g.fillEllipse(sx2 + 8, 580, 12, 50);
    }
    g.fillStyle(0xffffff, 0.75);
    for (var b = 0; b < 14; b++) {
      var bx = 40 + b * 62 + (b % 3) * 10, by = 220 + (b % 4) * 45;
      g.fillCircle(bx, by, 5 + (b % 3) * 3);
      g.fillCircle(bx + 8, by - 12, 3);
    }
    g.fillStyle(0x4EA8DE, 0.15); g.fillEllipse(450, 500, 600, 18);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 114, "Mode: Easy", textStyle(17, "#4EA8DE")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#0E7490")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the animal pairs!", textStyle(20, "#0E7490")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var pool = ANIMALS.slice(0, totalPairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (difficulty === "hard") {
      cols = 4; rows = 4; cw = 185; ch = 105; gx = 62; gy = 185; padX = 22; padY = 12;
    } else {
      cols = 4; rows = 3; cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    if (started) { updateFocus(scene); }
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 11);
    back.fillCircle(-w / 5, h / 5, 4);
    var paw = scene.add.text(0, -6, "\u{1F30A}", { fontSize: (h > 120 ? "48px" : "36px") }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xBAE6FD, 0x7DD3FC, 0x38BDF8, 0x0EA5E9, 0x0284C7, 0x0369A1, 0x075985, 0xE0F7FA, 0xB3E5FC];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = h > 120 ? "62px" : "48px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nmSize = h > 120 ? 20 : 17;
    var nm = scene.add.text(0, h > 120 ? 42 : 32, data.name, textStyle(nmSize)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, idx: idx, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (card.idx !== undefined) { focusedIndex = cards.indexOf(card); updateFocus(scene); }
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce(card.data.name + " revealed, pick one more"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Match found! " + card.data.name + " pair. " + matches + " of " + totalPairs);
        lockBoard = false;
        updateFocus(scene);
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("Not a match, try again");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocus(scene); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -140, "\u{1F30A} Ocean Match \u{1F404}", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Flip the cards and find\nall the animal pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -20, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    var easyTx = scene.add.text(-140, 60, "Easy: 6 pairs", textStyle(19, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    var hardTx = scene.add.text(140, 60, "Hard: 8 pairs", textStyle(19, "#102A43")).setOrigin(0.5);
    scene.easyBg = easyBg; scene.hardBg = hardBg; scene.easyTx = easyTx; scene.hardTx = hardTx;
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-260, 30, 240, 60), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 30, 240, 60), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { setDifficulty(scene, "easy"); });
    hardBg.on("pointerdown", function () { setDifficulty(scene, "hard"); });
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 110, 260, 70, 35);
    var btnTx = scene.add.text(0, 145, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 190, "Press E for Easy, H for Hard, Enter to Start", textStyle(15, "#64748B")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, easyBg, easyTx, hardBg, hardTx, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 110, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText(difficulty === "hard" ? "Hard mode! Find 8 pairs!" : "Tap a card!");
      announce(difficulty === "hard" ? "Hard mode started with 8 pairs" : "Easy mode started with 6 pairs");
      updateFocus(scene);
    });
    updateDifficultyButtons(scene);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= Math.ceil(totalPairs * 1.7) ? 3 : (moves <= Math.ceil(totalPairs * 2.7) ? 2 : 1);
    endDetail.setText("You found all " + totalPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Found all " + totalPairs + " pairs in " + moves + " moves");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText(difficulty === "hard" ? "Hard mode! Find 8 pairs!" : "Tap a card!");
    hudMode.setText("Mode: " + (difficulty === "hard" ? "Hard (8 pairs)" : "Easy"));
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    buildBoard(scene);
    announce("Game restarted in " + difficulty + " mode");
  }

  function setDifficulty(scene, mode) {
    difficulty = mode;
    totalPairs = mode === "hard" ? 8 : 6;
    hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    hudMode.setText("Mode: " + (mode === "hard" ? "Hard (8 pairs)" : "Easy"));
    updateDifficultyButtons(scene);
    updateDomButtons();
    announce(mode === "hard" ? "Hard mode selected: 8 pairs on a 4 by 4 board" : "Easy mode selected: 6 pairs");
    if (started) {
      restart(scene);
    } else {
      cards.forEach(function (c) { c.view.destroy(); });
      if (focusRing) { focusRing.destroy(); focusRing = null; }
      buildBoard(scene);
    }
  }

  function updateDifficultyButtons(scene) {
    if (!scene.easyBg || !scene.hardBg) { return; }
    scene.easyBg.clear(); scene.hardBg.clear();
    if (difficulty === "easy") {
      scene.easyBg.fillStyle(0x4EA8DE, 1); scene.easyBg.fillRoundedRect(-260, 30, 240, 60, 20);
      scene.hardBg.fillStyle(0xffffff, 1); scene.hardBg.lineStyle(3, 0x4EA8DE, 1); scene.hardBg.strokeRoundedRect(20, 30, 240, 60, 20); scene.hardBg.fillRoundedRect(20, 30, 240, 60, 20);
      scene.easyTx.setColor("#ffffff"); scene.hardTx.setColor("#102A43");
    } else {
      scene.easyBg.fillStyle(0xffffff, 1); scene.easyBg.lineStyle(3, 0x4EA8DE, 1); scene.easyBg.strokeRoundedRect(-260, 30, 240, 60, 20); scene.easyBg.fillRoundedRect(-260, 30, 240, 60, 20);
      scene.hardBg.fillStyle(0x4EA8DE, 1); scene.hardBg.fillRoundedRect(20, 30, 240, 60, 20);
      scene.easyTx.setColor("#102A43"); scene.hardTx.setColor("#ffffff");
    }
  }

  function updateDomButtons() {
    var eBtn = document.getElementById("btn-easy-dom");
    var hBtn = document.getElementById("btn-hard-dom");
    if (!eBtn || !hBtn) { return; }
    if (difficulty === "easy") {
      eBtn.style.background = "#4EA8DE"; eBtn.style.color = "#ffffff";
      hBtn.style.background = "#ffffff"; hBtn.style.color = "#102A43";
      eBtn.setAttribute("aria-pressed", "true"); hBtn.setAttribute("aria-pressed", "false");
    } else {
      eBtn.style.background = "#ffffff"; eBtn.style.color = "#102A43";
      hBtn.style.background = "#4EA8DE"; hBtn.style.color = "#ffffff";
      eBtn.setAttribute("aria-pressed", "false"); hBtn.setAttribute("aria-pressed", "true");
    }
  }

  function setupDomControls(scene) {
    var eBtn = document.getElementById("btn-easy-dom");
    var hBtn = document.getElementById("btn-hard-dom");
    if (eBtn) {
      eBtn.addEventListener("click", function () { setDifficulty(scene, "easy"); });
      eBtn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { setDifficulty(scene, "easy"); e.preventDefault(); }
      });
    }
    if (hBtn) {
      hBtn.addEventListener("click", function () { setDifficulty(scene, "hard"); });
      hBtn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { setDifficulty(scene, "hard"); e.preventDefault(); }
      });
    }
  }

  function updateFocus(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length || !started) { return; }
    if (focusedIndex < 0) { focusedIndex = 0; }
    if (focusedIndex >= cards.length) { focusedIndex = cards.length - 1; }
    var card = cards[focusedIndex];
    if (!card) { return; }
    var w = card.w, h = card.h;
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 6, card.view.y - h / 2 - 6, w + 12, h + 12, 24);
  }

  function handleKeyDown(e) {
    var scene = null;
    if (Phaser.GAMES && Phaser.GAMES[0] && Phaser.GAMES[0].scene) {
      var scenes = Phaser.GAMES[0].scene.getScenes(true);
      if (scenes && scenes.length) { scene = scenes[0]; }
      else if (Phaser.GAMES[0].scene.scenes && Phaser.GAMES[0].scene.scenes[0]) { scene = Phaser.GAMES[0].scene.scenes[0]; }
    }
    if (!scene) { return; }
    if (startOverlay && startOverlay.visible) {
      if (e.key === "e" || e.key === "E") { setDifficulty(scene, "easy"); e.preventDefault(); return; }
      if (e.key === "h" || e.key === "H") { setDifficulty(scene, "hard"); e.preventDefault(); return; }
      if (e.key === "Enter" || e.key === " ") {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText(difficulty === "hard" ? "Hard mode! Find 8 pairs!" : "Tap a card!");
        announce(difficulty === "hard" ? "Hard mode started with 8 pairs" : "Easy mode started");
        updateFocus(scene);
        e.preventDefault(); return;
      }
    }
    if (!started) { return; }
    if (e.key === "ArrowLeft") {
      focusedIndex = (focusedIndex - 1 + cards.length) % cards.length;
      updateFocus(scene); e.preventDefault();
    } else if (e.key === "ArrowRight") {
      focusedIndex = (focusedIndex + 1) % cards.length;
      updateFocus(scene); e.preventDefault();
    } else if (e.key === "ArrowUp") {
      var cols = 4;
      focusedIndex = (focusedIndex - cols + cards.length) % cards.length;
      updateFocus(scene); e.preventDefault();
    } else if (e.key === "ArrowDown") {
      var cols2 = 4;
      focusedIndex = (focusedIndex + cols2) % cards.length;
      updateFocus(scene); e.preventDefault();
    } else if (e.key === "Enter" || e.key === " ") {
      var card = cards[focusedIndex];
      if (card) { onCard(scene, card); }
      e.preventDefault();
    } else if (e.key === "r" || e.key === "R") {
      restart(scene); e.preventDefault();
    }
  }

  function update() {}
})();
</script>
