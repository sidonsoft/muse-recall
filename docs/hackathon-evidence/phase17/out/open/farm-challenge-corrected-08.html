<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;flex-direction:column}
  #topControls{display:flex;gap:12px;align-items:center;justify-content:center;margin:10px 0 8px 0;flex-wrap:wrap}
  #topControls .mode-label{font-size:14px;color:#102A43;font-weight:700;letter-spacing:0.4px}
  #topControls button{appearance:none;border:2px solid #4EA8DE;background:#ffffff;color:#102A43;font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
  #topControls button[aria-pressed="true"]{background:#4EA8DE;color:#ffffff;box-shadow:0 4px 12px rgba(78,168,222,.35)}
  #topControls button:focus{outline:3px solid #102A43;outline-offset:2px}
  #topControls button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,42,67,.12)}
  #ariaLive{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="topControls" role="group" aria-label="Game difficulty">
  <span class="mode-label" id="modeLabel">Difficulty:</span>
  <button type="button" id="btnNormal" aria-label="Play normal mode with 6 pairs" aria-pressed="true">Normal • 6 Pairs</button>
  <button type="button" id="btnHard" aria-label="Play hard challenge mode with 8 pairs and 90 second timer" aria-pressed="false">Hard Challenge • 8 Pairs + Timer</button>
</div>
<div id="ariaLive" aria-live="polite" aria-atomic="true"></div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F988}", name: "Shark" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudTimer, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var isHardMode = false, totalPairs = 6, timeLeft = 90, timerEvent = null;
  var normalBtnG, hardBtnG, normalBtnLabel, hardBtnLabel, modeDescText;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupDomControls();
    setupKeyboard(s);
    updateModeUI();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EAF7, 1); g.fillRect(0, 0, W, 210);
    g.fillStyle(0xB9E1F0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xEAF6FB, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0x4EA8DE, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.95);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x4EA8DE, 0.9);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x7FBFE0, 0xA8D8EA, 0x102A43];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x4EA8DE, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
    g.fillStyle(0x4EA8DE, 0.18);
    g.fillEllipse(450, 600, 700, 40);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Segoe UI",system-ui,-apple-system,sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudMode = scene.add.text(24, 110, "Mode: Normal", textStyle(16, "#4EA8DE"));
    hudTimer = scene.add.text(24, 132, "Time: 90s", textStyle(20, "#102A43")).setVisible(false);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the animal pairs!", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    var pool = ANIMALS.slice(0, totalPairs);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (isHardMode) {
      cols = 4; rows = 4; cw = 165; ch = 108; gx = 78; gy = 188; padX = 18; padY = 12;
    } else {
      cols = 4; rows = 3; cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMode.setText(isHardMode ? "Mode: Hard Challenge" : "Mode: Normal");
    if (isHardMode) {
      hudTimer.setVisible(true);
      hudTimer.setText("Time: " + timeLeft + "s");
      hudTimer.setColor("#102A43");
    } else {
      hudTimer.setVisible(false);
    }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xEAF6FB, 0xD6EAF7, 0xB9E1F0, 0xA8D8EA, 0x7FBFE0, 0x4EA8DE, 0xEAF6FB, 0xD6EAF7];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = isHardMode ? "48px" : "62px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(isHardMode ? 18 : 22, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Card flipped, one more to match"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce(matches === totalPairs ? "Pair matched, all pairs found" : "Pair matched");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      var delay = isHardMode ? 500 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F30A} Ocean Match \u{1F404}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -105, "Flip the cards and find all pairs!", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -65, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);

    var modeTitle = scene.add.text(0, -22, "Choose Difficulty", textStyle(18, "#102A43")).setOrigin(0.5);

    var normalBg = scene.add.graphics();
    normalBg.fillStyle(0xffffff, 1); normalBg.fillRoundedRect(-260, 0, 240, 64, 18);
    normalBg.lineStyle(3, 0x4EA8DE, 1); normalBg.strokeRoundedRect(-260, 0, 240, 64, 18);
    normalBtnLabel = scene.add.text(-140, 32, "Normal\n6 Pairs • Relaxed", Object.assign(textStyle(15, "#102A43"), { align: "center" })).setOrigin(0.5);
    normalBtnG = normalBg;
    normalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 0, 240, 64), Phaser.Geom.Rectangle.Contains);
    normalBg.on("pointerdown", function () { setDifficulty(false, scene); });
    normalBg.on("pointerover", function () { if (!isHardMode) return; normalBg.clear(); normalBg.fillStyle(0xEAF6FB,1); normalBg.fillRoundedRect(-260,0,240,64,18); normalBg.lineStyle(3,0x4EA8DE,1); normalBg.strokeRoundedRect(-260,0,240,64,18); });
    normalBg.on("pointerout", function () { updateModeButtons(); });

    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xffffff, 1); hardBg.fillRoundedRect(20, 0, 240, 64, 18);
    hardBg.lineStyle(3, 0x4EA8DE, 1); hardBg.strokeRoundedRect(20, 0, 240, 64, 18);
    hardBtnLabel = scene.add.text(140, 32, "Hard Challenge\n8 Pairs • 90s • Fast Flip", Object.assign(textStyle(14, "#102A43"), { align: "center" })).setOrigin(0.5);
    hardBtnG = hardBg;
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 0, 240, 64), Phaser.Geom.Rectangle.Contains);
    hardBg.on("pointerdown", function () { setDifficulty(true, scene); });
    hardBg.on("pointerover", function () { if (isHardMode) return; hardBg.clear(); hardBg.fillStyle(0xEAF6FB,1); hardBg.fillRoundedRect(20,0,240,64,18); hardBg.lineStyle(3,0x4EA8DE,1); hardBg.strokeRoundedRect(20,0,240,64,18); });
    hardBg.on("pointerout", function () { updateModeButtons(); });

    modeDescText = scene.add.text(0, 82, "Normal: perfect for learning • Hard: for experienced players", textStyle(13, "#4EA8DE")).setOrigin(0.5);

    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 105, 260, 62, 31);
    var btnTx = scene.add.text(0, 136, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, modeTitle, normalBg, normalBtnLabel, hardBg, hardBtnLabel, modeDescText, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 105, 260, 62), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText(isHardMode ? "Hard mode! Go!" : "Tap a card!");
      if (isHardMode) startTimer(scene);
      announce(isHardMode ? "Hard challenge started" : "Game started");
    });
    updateModeButtons();
  }

  function updateModeButtons() {
    if (!normalBtnG || !hardBtnG) return;
    normalBtnG.clear();
    hardBtnG.clear();
    if (isHardMode) {
      normalBtnG.fillStyle(0xffffff, 1); normalBtnG.fillRoundedRect(-260, 0, 240, 64, 18);
      normalBtnG.lineStyle(3, 0xB9E1F0, 1); normalBtnG.strokeRoundedRect(-260, 0, 240, 64, 18);
      hardBtnG.fillStyle(0x4EA8DE, 1); hardBtnG.fillRoundedRect(20, 0, 240, 64, 18);
      hardBtnG.lineStyle(3, 0x102A43, 1); hardBtnG.strokeRoundedRect(20, 0, 240, 64, 18);
      if (normalBtnLabel) normalBtnLabel.setColor("#102A43");
      if (hardBtnLabel) hardBtnLabel.setColor("#ffffff");
      if (modeDescText) modeDescText.setText("Hard: 8 pairs, 90s timer, cards flip back faster!");
    } else {
      normalBtnG.fillStyle(0x4EA8DE, 1); normalBtnG.fillRoundedRect(-260, 0, 240, 64, 18);
      normalBtnG.lineStyle(3, 0x102A43, 1); normalBtnG.strokeRoundedRect(-260, 0, 240, 64, 18);
      hardBtnG.fillStyle(0xffffff, 1); hardBtnG.fillRoundedRect(20, 0, 240, 64, 18);
      hardBtnG.lineStyle(3, 0xB9E1F0, 1); hardBtnG.strokeRoundedRect(20, 0, 240, 64, 18);
      if (normalBtnLabel) normalBtnLabel.setColor("#ffffff");
      if (hardBtnLabel) hardBtnLabel.setColor("#102A43");
      if (modeDescText) modeDescText.setText("Normal: 6 pairs, no timer • Hard: for experienced players");
    }
  }

  function setDifficulty(hard, scene) {
    isHardMode = hard;
    totalPairs = hard ? 8 : 6;
    timeLeft = 90;
    updateModeButtons();
    updateModeUI();
    if (scene && started) {
      restart(scene);
    } else if (scene) {
      buildBoard(scene);
    }
    announce(hard ? "Hard challenge mode selected: 8 pairs with timer" : "Normal mode selected: 6 pairs");
  }

  function updateModeUI() {
    var n = document.getElementById("btnNormal");
    var h = document.getElementById("btnHard");
    if (n && h) {
      n.setAttribute("aria-pressed", String(!isHardMode));
      h.setAttribute("aria-pressed", String(isHardMode));
    }
    if (hudMode) hudMode.setText(isHardMode ? "Mode: Hard Challenge" : "Mode: Normal");
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    if (hudTimer) {
      if (isHardMode) { hudTimer.setVisible(true); hudTimer.setText("Time: " + timeLeft + "s"); }
      else hudTimer.setVisible(false);
    }
  }

  function setupDomControls() {
    var n = document.getElementById("btnNormal");
    var h = document.getElementById("btnHard");
    if (!n || !h) return;
    n.addEventListener("click", function () { setDifficulty(false, Phaser.GAMES[0].scene.scenes[0]); });
    h.addEventListener("click", function () { setDifficulty(true, Phaser.GAMES[0].scene.scenes[0]); });
    n.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); n.click(); }
      if (e.key === "ArrowRight") { h.focus(); }
    });
    h.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); h.click(); }
      if (e.key === "ArrowLeft") { n.focus(); }
    });
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (e.key === "n" || e.key === "N") { setDifficulty(false, scene); }
      if (e.key === "h" || e.key === "H") { setDifficulty(true, scene); }
      if (e.key === "Enter") {
        if (startOverlay && startOverlay.visible) {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText(isHardMode ? "Hard mode! Go!" : "Tap a card!");
          if (isHardMode) startTimer(scene);
        } else if (endOverlay && endOverlay.visible) {
          restart(scene);
        }
      }
      if (e.key === "r" || e.key === "R") { restart(scene); }
      if (e.key === "Escape" && endOverlay && endOverlay.visible) {
        endOverlay.setVisible(false);
        startOverlay.setVisible(true);
        started = false; lockBoard = true;
        stopTimer(scene);
      }
    });
  }

  function announce(msg) {
    var el = document.getElementById("ariaLive");
    if (el) { el.textContent = msg; }
  }

  function startTimer(scene) {
    stopTimer(scene);
    timeLeft = 90;
    hudTimer.setVisible(true);
    hudTimer.setText("Time: " + timeLeft + "s");
    hudTimer.setColor("#102A43");
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      timeLeft--;
      hudTimer.setText("Time: " + timeLeft + "s");
      if (timeLeft <= 10) hudTimer.setColor("#D32F2F");
      if (timeLeft <= 0) {
        stopTimer(scene);
        lockBoard = true;
        showLose(scene);
      }
    }});
  }

  function stopTimer(scene) {
    if (timerEvent) { scene.time.removeEvent(timerEvent); timerEvent = null; }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 50, 280, 62, 31);
    var btnTx = scene.add.text(0, 81, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var changeBg = scene.add.graphics();
    changeBg.fillStyle(0xffffff, 1); changeBg.fillRoundedRect(-140, 120, 280, 44, 22);
    changeBg.lineStyle(2, 0x4EA8DE, 1); changeBg.strokeRoundedRect(-140, 120, 280, 44, 22);
    var changeTx = scene.add.text(0, 142, "Change Difficulty", textStyle(16, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, changeBg, changeTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 50, 280, 62), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    changeBg.setInteractive(new Phaser.Geom.Rectangle(-140, 120, 280, 44), Phaser.Geom.Rectangle.Contains);
    changeBg.on("pointerdown", function () {
      endOverlay.setVisible(false);
      startOverlay.setVisible(true);
      started = false; lockBoard = true;
      stopTimer(scene);
      announce("Choose difficulty");
    });
  }

  function showWin(scene) {
    stopTimer(scene);
    var stars = 1;
    if (isHardMode) {
      if (moves <= 14 && timeLeft >= 30) stars = 3;
      else if (moves <= 20 && timeLeft >= 10) stars = 2;
      else stars = 1;
      endTitle.setText("\u{1F389} Challenge Complete! \u{1F389}");
      endDetail.setText("Hard Challenge cleared!\nPairs: " + totalPairs + " • Moves: " + moves + " • Time left: " + timeLeft + "s\n" + "\u2B50".repeat(stars) + (stars===3 ? "  Master!" : stars===2 ? "  Great!" : "  Good try!"));
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("You found all " + totalPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nTry Hard Challenge for 8 pairs + timer!");
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win with " + moves + " moves");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("Hard Challenge failed\nPairs: " + matches + " / " + totalPairs + " • Moves: " + moves + "\nTry again or switch to Normal mode");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    announce("Time is up, game over");
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    timeLeft = 90;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText(isHardMode ? "Hard mode! Go!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    stopTimer(scene);
    cards.forEach(function (c) { if (c.view) c.view.destroy(); });
    buildBoard(scene);
    if (isHardMode) startTimer(scene);
    announce("Game restarted in " + (isHardMode ? "hard" : "normal") + " mode");
  }

  function update() {}
})();
</script>
</body>
</html>
