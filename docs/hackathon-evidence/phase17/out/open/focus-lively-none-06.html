<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-2: #f0d49a;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
    --glow: 0 8px 32px rgba(231, 193, 124, 0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -20% -10% auto -10%;
    height: 70vh;
    background:
      radial-gradient(600px 400px at 20% 10%, rgba(231,193,124,0.10), transparent 60%),
      radial-gradient(700px 500px at 85% 15%, rgba(224,143,126,0.08), transparent 60%),
      radial-gradient(500px 400px at 50% 0%, rgba(231,193,124,0.06), transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  .bg-orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(32px);
    opacity: 0.55;
    animation: floatOrb 9s ease-in-out infinite;
  }
  .orb-1 {
    width: 280px;
    height: 280px;
    background: radial-gradient(circle at 30% 30%, rgba(231,193,124,0.18), transparent 70%);
    top: -40px;
    left: -40px;
  }
  .orb-2 {
    width: 360px;
    height: 360px;
    background: radial-gradient(circle at 30% 30%, rgba(231,193,124,0.10), transparent 70%);
    top: 10%;
    right: -80px;
    animation-delay: -3s;
  }
  .orb-3 {
    width: 420px;
    height: 420px;
    background: radial-gradient(circle at 30% 30%, rgba(224,143,126,0.07), transparent 70%);
    bottom: -80px;
    left: 20%;
    animation-delay: -6s;
  }
  @keyframes floatOrb {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(12px, -14px) scale(1.04); }
  }
  .app {
    width: 100%;
    max-width: 620px;
    position: relative;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
    animation: headerIn 0.6s ease both;
  }
  @keyframes headerIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 6px 18px rgba(231,193,124,0.35);
    animation: pulseMark 3.2s ease-in-out infinite;
    position: relative;
  }
  .mark::after {
    content: "✦";
    position: absolute;
    top: -8px;
    right: -8px;
    font-size: 12px;
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--border);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    animation: sparkleTwinkle 1.8s ease-in-out infinite;
  }
  @keyframes pulseMark {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.05) rotate(2deg); }
  }
  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
    50% { opacity: 0.85; transform: scale(1.18) rotate(12deg); }
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
    background: linear-gradient(180deg, #fff 30%, #e7c17c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,0.2));
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .subtitle span {
    color: var(--accent);
    font-weight: 600;
  }
  .card {
    background: linear-gradient(180deg, rgba(38,35,32,0.98), var(--surface));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35), var(--glow);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(231,193,124,0.35), transparent);
    opacity: 0.9;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(231,193,124,0.12);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  #priorityInput:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(231,193,124,0.28);
    transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
  }
  #addBtn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }
  #addBtn:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(231,193,124,0.32);
  }
  #addBtn:hover::after {
    transform: translateX(100%);
  }
  #addBtn:active {
    filter: brightness(0.96);
    transform: translateY(0) scale(0.98);
  }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hint::before {
    content: "↵";
    display: inline-grid;
    place-items: center;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    background: var(--accent-soft);
    border: 1px solid rgba(231,193,124,0.25);
    color: var(--accent);
    font-size: 11px;
    flex: none;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .filter-btn:active { transform: translateY(0) scale(0.97); }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 4px 12px rgba(231,193,124,0.18);
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s ease, transform 0.15s ease;
  }
  #clearBtn:hover { color: var(--text); transform: translateY(-1px); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
    transform: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
    background: rgba(0,0,0,0.14);
    border: 1px solid rgba(56,50,42,0.7);
    border-radius: 12px;
    padding: 12px 12px 10px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; }
  #progressPct {
    color: var(--accent);
    font-weight: 700;
    min-width: 36px;
    text-align: right;
    transition: transform 0.25s ease;
  }
  #progressPct.bump {
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
    position: relative;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #f0d49a);
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(231,193,124,0.35);
  }
  #progressBar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.38), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.9s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    60%, 100% { transform: translateX(100%); }
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .priority-line::before {
    content: "◆";
    color: var(--accent);
    font-size: 8px;
    opacity: 0.9;
  }
  #prioritySummary { color: var(--muted); }
  #prioritySummary.has-high {
    color: var(--accent);
    font-weight: 600;
  }
  .celebrate-banner {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(231,193,124,0.18), rgba(231,193,124,0.08));
    border: 1px solid rgba(231,193,124,0.28);
    color: var(--accent);
    font-weight: 650;
    font-size: 0.92rem;
    display: none;
    align-items: center;
    gap: 8px;
    animation: bannerIn 0.45s ease both;
  }
  .celebrate-banner.show {
    display: flex;
  }
  @keyframes bannerIn {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    animation: taskIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    position: relative;
  }
  @keyframes taskIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .task:hover {
    transform: translateY(-1px);
    border-color: rgba(231,193,124,0.28);
    box-shadow: 0 8px 20px rgba(0,0,0,0.22);
    background: #2b2823;
  }
  .task.completed { opacity: 0.82; }
  .task.completed:hover { opacity: 0.9; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .check:hover { background: var(--accent-soft); transform: scale(1.06); }
  .check:active { transform: scale(0.92); }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 4px 10px rgba(231,193,124,0.28);
    animation: checkPop 0.35s ease;
  }
  @keyframes checkPop {
    0% { transform: scale(0.7); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .task.completed .check:hover { background: var(--accent); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    transition: color 0.2s ease;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
    transform: translateY(-1px);
  }
  .icon-btn:active { transform: scale(0.96); }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.08);
  }
  .priority-btn:active { transform: scale(0.96); }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 4px 10px rgba(231,193,124,0.14);
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
    background: linear-gradient(180deg, rgba(231,193,124,0.06), transparent);
    animation: taskIn 0.4s ease both;
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  .empty .empty-icon {
    font-size: 22px;
    display: block;
    margin-bottom: 8px;
    animation: floatOrb 3s ease-in-out infinite;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  footer::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(231,193,124,0.6);
    animation: sparkleTwinkle 2s ease-in-out infinite;
    flex: none;
  }
  #confettiLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 20;
  }
  .confetti {
    position: absolute;
    top: -12px;
    width: 8px;
    height: 12px;
    border-radius: 3px;
    opacity: 0.95;
    animation: confettiFall 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) translateX(var(--drift, 0px)) rotate(720deg); opacity: 0; }
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>
<div id="confettiLayer" aria-hidden="true"></div>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks — <span>let's make progress feel good</span> ✨</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
      <div id="celebrateBanner" class="celebrate-banner" aria-live="polite">🎉 All done! Take a breath — you crushed it.</div>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";
  var lastPct = 0;

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var celebrateBanner = document.getElementById("celebrateBanner");
  var confettiLayer = document.getElementById("confettiLayer");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));

  function launchConfetti() {
    if (!confettiLayer) return;
    var colors = ["#e7c17c", "#f0d49a", "#e08f7e", "#f2ede3", "#d9b46a"];
    for (var i = 0; i < 22; i++) {
      var piece = document.createElement("span");
      piece.className = "confetti";
      piece.style.left = (Math.random() * 100) + "%";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.35) + "s";
      piece.style.animationDuration = (1.2 + Math.random() * 0.9) + "s";
      piece.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      piece.style.transform = "rotate(" + (Math.random() * 180) + "deg)";
      piece.style.width = (6 + Math.random() * 6) + "px";
      piece.style.height = (8 + Math.random() * 8) + "px";
      confettiLayer.appendChild(piece);
      (function (el) {
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2200);
      })(piece);
    }
  }

  function bumpPct() {
    progressPct.classList.remove("bump");
    void progressPct.offsetWidth;
    progressPct.classList.add("bump");
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
    if (addBtn) {
      addBtn.style.transform = "scale(0.96)";
      setTimeout(function () { addBtn.style.transform = ""; }, 140);
    }
  }

  function toggleTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].completed = !tasks[i].completed;
        break;
      }
    }
    render();
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    if (pct !== lastPct) {
      bumpPct();
    }

    if (pct === 100 && total > 0 && lastPct !== 100) {
      launchConfetti();
      if (celebrateBanner) celebrateBanner.classList.add("show");
    } else if (pct !== 100 || total === 0) {
      if (celebrateBanner) celebrateBanner.classList.remove("show");
    }
    lastPct = pct;

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
      prioritySummary.classList.remove("has-high");
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
      prioritySummary.classList.add("has-high");
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
      prioritySummary.classList.add("has-high");
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var icon = document.createElement("span");
      icon.className = "empty-icon";
      icon.setAttribute("aria-hidden", "true");
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        icon.textContent = "✨";
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        icon.textContent = "🌿";
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        icon.textContent = "🎯";
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        icon.textContent = "🔍";
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(icon);
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task, index) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      li.style.animationDelay = (index * 0.04) + "s";

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function () { toggleTask(task.id); });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
