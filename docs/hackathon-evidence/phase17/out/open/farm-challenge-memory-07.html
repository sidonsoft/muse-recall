<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#e6f2f8;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F422}", name: "Turtle" }
  ];
  var W = 900, H = 700;

  var difficulty = 'normal';
  var totalPairs = 6;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#e0f2fe",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay, modeButtons = [];

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe0f2fe, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xb8e0f0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xe6f7ff, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0x4EA8DE, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x4EA8DE, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x7ec8e3, 0x90c9e8, 0xa7d8f0];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5a9bb5, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Memory Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 112, "Mode: Calm Bay", textStyle(16, "#1a4a6b")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var modeBtn = scene.add.container(W - 110, 60);
    var modeBg = scene.add.graphics();
    modeBg.fillStyle(0xffffff, 1); modeBg.fillRoundedRect(-86, -18, 172, 36, 18);
    modeBg.lineStyle(2, 0x4EA8DE, 1); modeBg.strokeRoundedRect(-86, -18, 172, 36, 18);
    var modeLabel = scene.add.text(0, 0, "Switch to Deep Dive", textStyle(14, "#102A43")).setOrigin(0.5);
    modeBtn.add([modeBg, modeLabel]);
    modeBg.setInteractive(new Phaser.Geom.Rectangle(-86, -18, 172, 36), Phaser.Geom.Rectangle.Contains);
    modeBg.on("pointerdown", function () {
      var newMode = difficulty === 'normal' ? 'hard' : 'normal';
      setDifficulty(newMode, scene);
      restart(scene);
    });
    modeBg.on("pointerover", function () { modeBtn.setScale(1.04); });
    modeBg.on("pointerout", function () { modeBtn.setScale(1); });
    scene.modeToggleLabel = modeLabel;
    updateHudModeDisplay(scene);
    scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(20, "#102A43")).setOrigin(0.5).setName("instruction");
  }

  function updateHudModeDisplay(sceneRef) {
    if (!hudMode) return;
    if (difficulty === 'hard') {
      hudMode.setText("Mode: Deep Dive \u2022 8 pairs");
    } else {
      hudMode.setText("Mode: Calm Bay \u2022 6 pairs");
    }
    if (sceneRef && sceneRef.modeToggleLabel) {
      sceneRef.modeToggleLabel.setText(difficulty === 'hard' ? "Switch to Calm Bay" : "Switch to Deep Dive");
    }
  }

  function setDifficulty(mode, scene) {
    difficulty = mode;
    totalPairs = (mode === 'hard') ? 8 : 6;
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    updateHudModeDisplay(scene);
    var instr = scene ? scene.children.getByName("instruction") : null;
    if (instr) {
      instr.setText(mode === 'hard' ? "Find the 8 animal pairs!" : "Find the 6 animal pairs!");
    }
    updateModeButtonsVisual();
  }

  function updateModeButtonsVisual() {
    modeButtons.forEach(function (b) {
      if (b.mode === difficulty) {
        b.bg.clear(); b.bg.fillStyle(0x4EA8DE, 1); b.bg.fillRoundedRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h, 18);
        b.bg.lineStyle(2, 0x102A43, 1); b.bg.strokeRoundedRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h, 18);
        b.label.setColor("#ffffff");
        b.sub.setColor("#ffffff");
      } else {
        b.bg.clear(); b.bg.fillStyle(0xffffff, 1); b.bg.fillRoundedRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h, 18);
        b.bg.lineStyle(2, 0x4EA8DE, 1); b.bg.strokeRoundedRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h, 18);
        b.label.setColor("#102A43");
        b.sub.setColor("#102A43");
      }
    });
  }

  function shuffledDeck() {
    var pool = (difficulty === 'hard') ? ANIMALS : ANIMALS.slice(0, 6);
    var deck = [];
    pool.forEach(function (a) {
      var key = ANIMALS.indexOf(a);
      deck.push({ key: key, emoji: a.emoji, name: a.name });
      deck.push({ key: key, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var isHard = difficulty === 'hard';
    var cols = 4, rows = isHard ? 4 : 3;
    var cw = 185, ch = isHard ? 108 : 140, gx = 62, gy = isHard ? 185 : 195, padX = 22, padY = isHard ? 12 : 16;
    if (isHard) {
      cw = 175; ch = 108; gx = 72; gy = 185; padX = 18; padY = 12;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "48px" }).setOrigin(0.5);
    if (w < 180) paw.setFontSize("40px");
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd4eaf7, 0xb8e0f0, 0xa7d8f0, 0x7ec8e3, 0xe0f2fe, 0xc7e8f3, 0x90c9e8, 0x6bb6de];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = w < 180 ? "52px" : "62px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nmSize = w < 180 ? "18px" : "22px";
    var nm = scene.add.text(0, 38, data.name, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: nmSize, color: "#102A43", fontStyle: "bold" }).setOrigin(0.5);
    if (w < 180) { emo.y = -10; nm.y = 32; }
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F30A} Ocean Memory Match \u{1F419}", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -95, "Flip the cards and find\nall the animal pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -40, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var modeTitle = scene.add.text(0, 10, "Choose your challenge:", textStyle(18, "#102A43")).setOrigin(0.5);
    var btnW = 260, btnH = 52;
    var leftX = -140, rightX = 140, btnY = 50;
    var calmBg = scene.add.graphics();
    calmBg.fillStyle(0x4EA8DE, 1); calmBg.fillRoundedRect(leftX - btnW/2, btnY - btnH/2, btnW, btnH, 18);
    calmBg.lineStyle(2, 0x102A43, 1); calmBg.strokeRoundedRect(leftX - btnW/2, btnY - btnH/2, btnW, btnH, 18);
    var calmTx = scene.add.text(leftX, btnY, "\u{1F30A} Calm Bay", textStyle(18, "#ffffff")).setOrigin(0.5);
    var calmSub = scene.add.text(leftX, btnY + 18, "6 pairs \u2022 4x3", textStyle(12, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xffffff, 1); hardBg.fillRoundedRect(rightX - btnW/2, btnY - btnH/2, btnW, btnH, 18);
    hardBg.lineStyle(2, 0x4EA8DE, 1); hardBg.strokeRoundedRect(rightX - btnW/2, btnY - btnH/2, btnW, btnH, 18);
    var hardTx = scene.add.text(rightX, btnY, "\u{1F419} Deep Dive", textStyle(18, "#102A43")).setOrigin(0.5);
    var hardSub = scene.add.text(rightX, btnY + 18, "8 pairs \u2022 4x4", textStyle(12, "#102A43")).setOrigin(0.5);
    var hint = scene.add.text(0, 95, "Deep Dive has more cards to remember!", textStyle(14, "#1a4a6b")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 120, 260, 60, 30);
    var btnTx = scene.add.text(0, 150, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, modeTitle, calmBg, calmTx, calmSub, hardBg, hardTx, hardSub, hint, btnBg, btnTx]);
    modeButtons = [
      { mode: 'normal', bg: calmBg, label: calmTx, sub: calmSub, rect: { x: leftX - btnW/2, y: btnY - btnH/2, w: btnW, h: btnH } },
      { mode: 'hard', bg: hardBg, label: hardTx, sub: hardSub, rect: { x: rightX - btnW/2, y: btnY - btnH/2, w: btnW, h: btnH } }
    ];
    calmBg.setInteractive(new Phaser.Geom.Rectangle(leftX - btnW/2, btnY - btnH/2, btnW, btnH), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(rightX - btnW/2, btnY - btnH/2, btnW, btnH), Phaser.Geom.Rectangle.Contains);
    calmBg.on("pointerdown", function () { setDifficulty('normal', scene); });
    hardBg.on("pointerdown", function () { setDifficulty('hard', scene); });
    calmBg.on("pointerover", function () { calmTx.setScale(1.05); });
    calmBg.on("pointerout", function () { calmTx.setScale(1); });
    hardBg.on("pointerover", function () { hardTx.setScale(1.05); });
    hardBg.on("pointerout", function () { hardTx.setScale(1); });
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 120, 260, 60), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      buildBoard(scene);
      hudScore.setText("Pairs: 0 / " + totalPairs);
      var instr = scene.children.getByName("instruction");
      if (instr) instr.setText(totalPairs === 8 ? "Find the 8 animal pairs!" : "Find the 6 animal pairs!");
    });
    btnBg.on("pointerover", function () { btnTx.setScale(1.06); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
    updateModeButtonsVisual();
    scene.input.keyboard.on('keydown-LEFT', function () { setDifficulty('normal', scene); });
    scene.input.keyboard.on('keydown-RIGHT', function () { setDifficulty('hard', scene); });
    scene.input.keyboard.on('keydown-ENTER', function () {
      if (startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
        buildBoard(scene);
        hudScore.setText("Pairs: 0 / " + totalPairs);
        var instr2 = scene.children.getByName("instruction");
        if (instr2) instr2.setText(totalPairs === 8 ? "Find the 8 animal pairs!" : "Find the 6 animal pairs!");
      }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnBg.on("pointerover", function () { btnTx.setScale(1.05); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
  }

  function showWin(scene) {
    var stars = moves <= (totalPairs === 8 ? 14 : 10) ? 3 : (moves <= (totalPairs === 8 ? 20 : 16) ? 2 : 1);
    var modeName = difficulty === 'hard' ? "Deep Dive" : "Calm Bay";
    endDetail.setText("You found all " + totalPairs + " pairs!\nMode: " + modeName + " \u2022 Moves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    var instr = scene.children.getByName("instruction");
    if (instr) instr.setText(totalPairs === 8 ? "Find the 8 animal pairs!" : "Find the 6 animal pairs!");
    if (scene.modeToggleLabel) {
      scene.modeToggleLabel.setText(difficulty === 'hard' ? "Switch to Calm Bay" : "Switch to Deep Dive");
    }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on('keydown-ESC', function () {
      if (endOverlay.visible) { restart(scene); }
    });
    scene.input.keyboard.on('keydown-R', function () { restart(scene); });
    scene.input.keyboard.on('keydown-ENTER', function () {
      if (endOverlay.visible) { restart(scene); }
    });
    scene.input.keyboard.on('keydown-SPACE', function () {
      if (endOverlay.visible) { restart(scene); }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
