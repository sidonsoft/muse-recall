<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #difficultyControls{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5;pointer-events:auto}
  .mode-btn{font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;font-size:13px;font-weight:bold;padding:7px 14px;border-radius:20px;border:2px solid #5da85f;background:#fff;color:#5b3a29;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .mode-btn:focus{outline:3px solid #ffb703;outline-offset:2px}
  .mode-btn.active{background:#5da85f;color:#fff;border-color:#4a8a4e}
  .mode-btn.hard{border-color:#e76f51;color:#b34a3e}
  .mode-btn.hard.active{background:#e76f51;color:#fff;border-color:#c0392b}
  #announcer{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game">
  <div id="difficultyControls" role="group" aria-label="Difficulty selection">
    <button type="button" id="easyBtn" class="mode-btn active" aria-label="Easy mode: 6 pairs, relaxed play without timer" aria-pressed="true">Easy: 6 Pairs</button>
    <button type="button" id="hardBtn" class="mode-btn hard" aria-label="Hard challenge mode: 8 pairs with 60 second timer for experienced players" aria-pressed="false">Hard: 8 Pairs + Timer</button>
  </div>
  <div id="announcer" aria-live="polite" aria-atomic="true"></div>
</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F430}", name: "Bunny" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudInstruction, endOverlay, endTitle, endDetail, startOverlay, timerText, modeBadge;
  var modeToggleBg, modeToggleLabel, modeToggleContainer;
  var easyStartBg, hardStartBg, easyStartLabel, hardStartLabel;
  var difficulty = 'easy';
  var timeLeft = 60;
  var timerEvent = null;
  var focusedIndex = 0;
  var focusRect = null;
  var gameScene = null;

  function getTotalPairs() { return difficulty === 'hard' ? 8 : 6; }

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    createFocusIndicator(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    syncModeButtons();
    updateHudForDifficulty();
    updateStartOverlaySelection();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function announce(msg) {
    var a = document.getElementById('announcer');
    if (a) { a.textContent = msg; }
  }

  function syncModeButtons() {
    var easyBtn = document.getElementById('easyBtn');
    var hardBtn = document.getElementById('hardBtn');
    if (!easyBtn || !hardBtn) return;
    if (difficulty === 'easy') {
      easyBtn.classList.add('active'); easyBtn.setAttribute('aria-pressed','true');
      hardBtn.classList.remove('active'); hardBtn.setAttribute('aria-pressed','false');
    } else {
      hardBtn.classList.add('active'); hardBtn.setAttribute('aria-pressed','true');
      easyBtn.classList.remove('active'); easyBtn.setAttribute('aria-pressed','false');
    }
  }

  function updateHudForDifficulty() {
    var total = getTotalPairs();
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + total); }
    if (hudInstruction) {
      if (difficulty === 'hard') { hudInstruction.setText("Hard Mode: Find 8 pairs before time runs out!"); }
      else { hudInstruction.setText("Find the 6 animal pairs!"); }
    }
    if (timerText) {
      if (difficulty === 'hard' && started) {
        timerText.setVisible(true);
        timerText.setText("Time: " + timeLeft + "s");
        timerText.setColor(timeLeft <= 10 ? "#c0392b" : "#7a4a2b");
      } else if (difficulty === 'hard' && !started) {
        timerText.setVisible(true);
        timerText.setText("Time: 60s");
        timerText.setColor("#7a4a2b");
      } else {
        timerText.setVisible(false);
      }
    }
    if (modeBadge) {
      modeBadge.setText(difficulty === 'hard' ? "Hard Mode \u2605" : "Easy Mode");
    }
    if (modeToggleLabel) {
      modeToggleLabel.setText(difficulty === 'hard' ? "Easy Mode" : "Hard Mode");
    }
    if (modeToggleBg) {
      modeToggleBg.clear();
      if (difficulty === 'hard') {
        modeToggleBg.fillStyle(0x5da85f, 1); modeToggleBg.fillRoundedRect(-70, -16, 140, 32, 16);
      } else {
        modeToggleBg.fillStyle(0xe76f51, 1); modeToggleBg.fillRoundedRect(-70, -16, 140, 32, 16);
      }
    }
  }

  function updateStartOverlaySelection() {
    if (easyStartBg) {
      easyStartBg.clear();
      if (difficulty === 'easy') { easyStartBg.fillStyle(0x5da85f, 1); } else { easyStartBg.fillStyle(0xffffff, 1); }
      easyStartBg.fillRoundedRect(-160, 70, 140, 60, 20);
      easyStartBg.lineStyle(3, difficulty === 'easy' ? 0x4a8a4e : 0x5da85f, 1);
      easyStartBg.strokeRoundedRect(-160, 70, 140, 60, 20);
    }
    if (hardStartBg) {
      hardStartBg.clear();
      if (difficulty === 'hard') { hardStartBg.fillStyle(0xe76f51, 1); } else { hardStartBg.fillStyle(0xffffff, 1); }
      hardStartBg.fillRoundedRect(20, 70, 140, 60, 20);
      hardStartBg.lineStyle(3, difficulty === 'hard' ? 0xc0392b : 0xe76f51, 1);
      hardStartBg.strokeRoundedRect(20, 70, 140, 60, 20);
    }
    if (easyStartLabel) { easyStartLabel.setColor(difficulty === 'easy' ? "#ffffff" : "#5b3a29"); }
    if (hardStartLabel) { hardStartLabel.setColor(difficulty === 'hard' ? "#ffffff" : "#b34a3e"); }
  }

  function setDifficulty(mode, shouldRestart) {
    difficulty = mode;
    syncModeButtons();
    updateHudForDifficulty();
    updateStartOverlaySelection();
    if (shouldRestart && started && gameScene) {
      restart(gameScene);
      announce(mode === 'hard' ? "Switched to hard challenge mode: 8 pairs with 60 second timer" : "Switched to easy mode: 6 pairs relaxed play");
    } else {
      announce(mode === 'hard' ? "Hard challenge mode selected: 8 pairs with 60 second timer" : "Easy mode selected: 6 pairs relaxed play");
    }
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    timerText = scene.add.text(W - 24, 90, "Time: 60s", textStyle(20, "#7a4a2b")).setOrigin(1, 0.5).setVisible(false);
    modeBadge = scene.add.text(24, 122, "Easy Mode", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "14px", color: "#ffffff", backgroundColor: "#5da85f", padding: { left: 8, right: 8, top: 3, bottom: 3 } }).setOrigin(0, 0.5);
    modeBadge.setVisible(false);
    hudInstruction = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });

    modeToggleContainer = scene.add.container(W - 110, 152);
    modeToggleBg = scene.add.graphics();
    modeToggleBg.fillStyle(0xe76f51, 1); modeToggleBg.fillRoundedRect(-70, -16, 140, 32, 16);
    modeToggleLabel = scene.add.text(0, 0, "Hard Mode", textStyle(16, "#ffffff")).setOrigin(0.5);
    modeToggleContainer.add([modeToggleBg, modeToggleLabel]);
    modeToggleBg.setInteractive(new Phaser.Geom.Rectangle(-70, -16, 140, 32), Phaser.Geom.Rectangle.Contains);
    modeToggleBg.on("pointerdown", function () {
      var newMode = difficulty === 'easy' ? 'hard' : 'easy';
      setDifficulty(newMode, true);
    });
    modeToggleBg.on("pointerover", function () { modeToggleContainer.setScale(1.05); });
    modeToggleBg.on("pointerout", function () { modeToggleContainer.setScale(1); });
  }

  function createFocusIndicator(scene) {
    focusRect = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function updateFocusIndicator() {
    if (!focusRect || cards.length === 0) return;
    if (!started || (startOverlay && startOverlay.visible) || (endOverlay && endOverlay.visible)) { focusRect.setVisible(false); return; }
    var card = cards[focusedIndex];
    if (!card || card.matched || !card.view) { focusRect.setVisible(false); return; }
    var isHard = difficulty === 'hard';
    var hw = 92, hh = isHard ? 55 : 70;
    focusRect.clear();
    focusRect.lineStyle(4, 0xffb703, 1);
    focusRect.strokeRoundedRect(card.view.x - hw, card.view.y - hh, hw * 2, hh * 2, 22);
    focusRect.setVisible(true);
  }

  function shuffledDeck() {
    var total = getTotalPairs();
    var pool = ANIMALS.slice(0, total);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var isHard = difficulty === 'hard';
    var cols = 4, rows = isHard ? 4 : 3;
    var cw = 185, ch = isHard ? 110 : 140, gx = 62, gy = 195, padX = 22, padY = isHard ? 12 : 16;
    if (isHard) { gy = 188; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    updateFocusIndicator();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var pawSize = h < 120 ? "42px" : "56px";
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: pawSize }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xffb5a7, 0xb5ead7];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = h < 120 ? "48px" : "62px";
    var emo = scene.add.text(0, h < 120 ? -12 : -18, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nmSize = h < 120 ? 18 : 22;
    var nm = scene.add.text(0, h < 120 ? 32 : 44, data.name, textStyle(nmSize)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h, idx: idx };
    cont.on("pointerdown", function () {
      focusedIndex = idx;
      updateFocusIndicator();
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Card flipped: " + card.data.name); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    announce("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + getTotalPairs());
        var total = getTotalPairs();
        if (matches === total) {
          hudMsg.setText("You did it!");
        } else {
          hudMsg.setText("Yay! A pair! \u{1F389}");
        }
        announce("Pair found! " + matches + " of " + total);
        lockBoard = false;
        updateFocusIndicator();
        if (matches === total) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusIndicator(); });
      }, difficulty === 'hard' ? 600 : 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -70, "Flip the cards and find\nall animal pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var diffInfo = scene.add.text(0, -10, "Easy: 6 pairs  •  Hard: 8 pairs + 60s timer", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    var row = scene.add.text(0, 28, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F410} \u{1F430}", { fontSize: "32px" }).setOrigin(0.5);
    var choose = scene.add.text(0, 58, "Choose difficulty to start:", textStyle(18, "#5b3a29")).setOrigin(0.5);
    easyStartBg = scene.add.graphics();
    easyStartBg.fillStyle(0x5da85f, 1); easyStartBg.fillRoundedRect(-160, 70, 140, 60, 20);
    easyStartBg.lineStyle(3, 0x4a8a4e, 1); easyStartBg.strokeRoundedRect(-160, 70, 140, 60, 20);
    easyStartLabel = scene.add.text(-90, 100, "Easy", textStyle(22, "#ffffff")).setOrigin(0.5);
    var easySub = scene.add.text(-90, 118, "6 pairs", textStyle(14, "#ffffff")).setOrigin(0.5);
    hardStartBg = scene.add.graphics();
    hardStartBg.fillStyle(0xffffff, 1); hardStartBg.fillRoundedRect(20, 70, 140, 60, 20);
    hardStartBg.lineStyle(3, 0xe76f51, 1); hardStartBg.strokeRoundedRect(20, 70, 140, 60, 20);
    hardStartLabel = scene.add.text(90, 100, "Hard \u2605", textStyle(22, "#b34a3e")).setOrigin(0.5);
    var hardSub = scene.add.text(90, 118, "8 pairs + Timer", textStyle(14, "#b34a3e")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, diffInfo, row, choose, easyStartBg, easyStartLabel, easySub, hardStartBg, hardStartLabel, hardSub]);
    easyStartBg.setInteractive(new Phaser.Geom.Rectangle(-160, 70, 140, 60), Phaser.Geom.Rectangle.Contains);
    easyStartBg.on("pointerdown", function () {
      startGame(scene, 'easy');
    });
    easyStartBg.on("pointerover", function () { easyStartLabel.setScale(1.05); });
    easyStartBg.on("pointerout", function () { easyStartLabel.setScale(1); });
    hardStartBg.setInteractive(new Phaser.Geom.Rectangle(20, 70, 140, 60), Phaser.Geom.Rectangle.Contains);
    hardStartBg.on("pointerdown", function () {
      startGame(scene, 'hard');
    });
    hardStartBg.on("pointerover", function () { hardStartLabel.setScale(1.05); });
    hardStartBg.on("pointerout", function () { hardStartLabel.setScale(1); });
    updateStartOverlaySelection();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    var switchBg = scene.add.graphics();
    switchBg.fillStyle(0xffffff, 1); switchBg.fillRoundedRect(-110, 135, 220, 40, 20);
    switchBg.lineStyle(2, 0x5da85f, 1); switchBg.strokeRoundedRect(-110, 135, 220, 40, 20);
    var switchTx = scene.add.text(0, 155, "Switch Difficulty", textStyle(18, "#5b3a29")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, switchBg, switchTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    switchBg.setInteractive(new Phaser.Geom.Rectangle(-110, 135, 220, 40), Phaser.Geom.Rectangle.Contains);
    switchBg.on("pointerdown", function () {
      endOverlay.setVisible(false);
      startOverlay.setVisible(true);
      started = false;
      lockBoard = true;
      stopTimer();
      if (focusRect) focusRect.setVisible(false);
      announce("Choose difficulty");
    });
  }

  function startGame(scene, mode) {
    difficulty = mode;
    syncModeButtons();
    updateHudForDifficulty();
    updateStartOverlaySelection();
    started = true; lockBoard = false;
    moves = 0; matches = 0; firstPick = null;
    timeLeft = 60;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / " + getTotalPairs());
    hudMsg.setText("Tap a card!");
    if (startOverlay) startOverlay.setVisible(false);
    if (endOverlay) endOverlay.setVisible(false);
    stopTimer();
    buildBoard(scene);
    if (mode === 'hard') { startTimer(scene); }
    focusedIndex = 0;
    updateFocusIndicator();
    announce(mode === 'hard' ? "Hard challenge started: find 8 pairs in 60 seconds" : "Easy game started: find 6 pairs");
  }

  function startTimer(scene) {
    stopTimer();
    timeLeft = 60;
    if (timerText) {
      timerText.setVisible(true);
      timerText.setText("Time: " + timeLeft + "s");
      timerText.setColor("#7a4a2b");
    }
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      timeLeft--;
      if (timerText) {
        timerText.setText("Time: " + timeLeft + "s");
        if (timeLeft <= 10) {
          timerText.setColor("#c0392b");
          scene.tweens.add({ targets: timerText, scaleX: 1.1, scaleY: 1.1, yoyo: true, duration: 100 });
        }
      }
      announce("Time remaining " + timeLeft + " seconds");
      if (timeLeft <= 0) {
        stopTimer();
        lockBoard = true;
        showLose(scene);
      }
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(); timerEvent = null; }
  }

  function showWin(scene) {
    stopTimer();
    var total = getTotalPairs();
    var stars, detailMsg;
    if (difficulty === 'hard') {
      if (moves <= 14 && timeLeft >= 20) stars = 3;
      else if (moves <= 20 && timeLeft >= 10) stars = 2;
      else stars = 1;
      detailMsg = "Hard Mode Cleared!\nYou found all " + total + " pairs!\nMoves: " + moves + "  Time left: " + timeLeft + "s  " + "\u2B50".repeat(stars);
      endTitle.setText("\u{1F389} Hard Win! \u{1F389}");
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
      detailMsg = "You found all " + total + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars);
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
    }
    endDetail.setText(detailMsg);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Found all pairs in " + moves + " moves");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
    if (focusRect) focusRect.setVisible(false);
  }

  function showLose(scene) {
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("Hard Mode Challenge\nYou found " + matches + " / " + getTotalPairs() + " pairs\nTry again?");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    announce("Time is up. You found " + matches + " pairs");
    if (focusRect) focusRect.setVisible(false);
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    timeLeft = 60;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + getTotalPairs()); hudMsg.setText("Tap a card!");
    updateHudForDifficulty();
    if (difficulty === 'hard') { startTimer(scene); } else { stopTimer(); if (timerText) timerText.setVisible(false); }
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { if (c.view) c.view.destroy(); });
    buildBoard(scene);
    focusedIndex = 0;
    updateFocusIndicator();
    announce("Game restarted in " + difficulty + " mode");
  }

  function update() {}

  var easyBtnDom = document.getElementById('easyBtn');
  var hardBtnDom = document.getElementById('hardBtn');
  if (easyBtnDom) {
    easyBtnDom.addEventListener('click', function () {
      if (gameScene) {
        if (started && difficulty !== 'easy') { setDifficulty('easy', true); }
        else if (!started) { setDifficulty('easy', false); if (startOverlay && startOverlay.visible) { updateStartOverlaySelection(); } }
        else { setDifficulty('easy', false); }
      } else {
        difficulty = 'easy'; syncModeButtons();
      }
    });
    easyBtnDom.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); easyBtnDom.click(); }
    });
  }
  if (hardBtnDom) {
    hardBtnDom.addEventListener('click', function () {
      if (gameScene) {
        if (started && difficulty !== 'hard') { setDifficulty('hard', true); }
        else if (!started) { setDifficulty('hard', false); if (startOverlay && startOverlay.visible) { updateStartOverlaySelection(); } }
        else { setDifficulty('hard', false); }
      } else {
        difficulty = 'hard'; syncModeButtons();
      }
    });
    hardBtnDom.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hardBtnDom.click(); }
    });
  }

  window.addEventListener('keydown', function (e) {
    if (!gameScene) return;
    if (startOverlay && startOverlay.visible) {
      if (e.key === '1' || e.key.toLowerCase() === 'e') { e.preventDefault(); setDifficulty('easy', false); }
      if (e.key === '2' || e.key.toLowerCase() === 'h') { e.preventDefault(); setDifficulty('hard', false); }
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startGame(gameScene, difficulty);
      }
      return;
    }
    if (endOverlay && endOverlay.visible) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); restart(gameScene); }
      if (e.key === 'Escape') {
        e.preventDefault();
        endOverlay.setVisible(false);
        startOverlay.setVisible(true);
        started = false; lockBoard = true;
        stopTimer();
        if (focusRect) focusRect.setVisible(false);
      }
      return;
    }
    if (!started) return;
    var total = getTotalPairs() * 2;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      var cols = 4;
      if (e.key === 'ArrowLeft') { focusedIndex = (focusedIndex - 1 + total) % total; }
      if (e.key === 'ArrowRight') { focusedIndex = (focusedIndex + 1) % total; }
      if (e.key === 'ArrowUp') { focusedIndex = (focusedIndex - cols + total) % total; }
      if (e.key === 'ArrowDown') { focusedIndex = (focusedIndex + cols) % total; }
      updateFocusIndicator();
      announce("Focused on card " + (focusedIndex + 1) + " of " + total);
    }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var card = cards[focusedIndex];
      if (card) { onCard(gameScene, card); }
    }
    if (e.key.toLowerCase() === 'r') {
      e.preventDefault();
      restart(gameScene);
    }
  });

})();
</script>
</body>
</html>
