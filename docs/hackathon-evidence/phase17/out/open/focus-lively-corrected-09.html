<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
    position: relative;
  }
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(40px);
    z-index: -1;
    opacity: 0.55;
  }
  .bg-glow-1 {
    width: 680px;
    height: 680px;
    background: radial-gradient(circle at 30% 30%, rgba(231,193,124,0.14), rgba(231,193,124,0.06) 35%, transparent 70%);
    top: -180px;
    right: -160px;
    animation: bgShift 9s ease-in-out infinite;
  }
  .bg-glow-2 {
    width: 520px;
    height: 520px;
    background: radial-gradient(circle at 50% 50%, rgba(231,193,124,0.10), rgba(180,140,70,0.05) 40%, transparent 72%);
    bottom: -120px;
    left: -140px;
    animation: bgShift 11s ease-in-out infinite reverse;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
    animation: headerEnter 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    animation: floatMark 3.2s ease-in-out infinite;
    box-shadow: 0 6px 18px rgba(231,193,124,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .brand:hover .mark {
    transform: scale(1.06) rotate(4deg);
    box-shadow: 0 10px 24px rgba(231,193,124,0.35);
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
    animation: fadeIn 0.8s ease 0.2s both;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
    animation: cardEnter 0.6s cubic-bezier(0.22,1,0.36,1) 0.1s both;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(231,193,124,0.35), transparent);
    opacity: 0.7;
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
    background: #2b2722;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  #taskInput:hover {
    border-color: #4a4235;
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  #priorityInput:hover {
    border-color: var(--accent);
    color: var(--text);
    transform: translateY(-1px);
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(231,193,124,0.22);
  }
  #addBtn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.22) 50%, transparent 80%);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }
  #addBtn:hover {
    filter: brightness(1.06);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(231,193,124,0.32);
  }
  #addBtn:hover::after {
    transform: translateX(100%);
  }
  #addBtn:active {
    filter: brightness(0.96);
    transform: translateY(0) scale(0.98);
  }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  #addBtn.pulse {
    animation: pulseAmber 0.6s ease;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
    animation: fadeIn 0.6s ease 0.4s both;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.22s cubic-bezier(0.22,1,0.36,1);
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .filter-btn:active {
    transform: translateY(0) scale(0.97);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 4px 12px rgba(231,193,124,0.18);
    transform: translateY(-1px);
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  #clearBtn:hover { color: var(--text); transform: translateY(-1px); }
  #clearBtn:active { transform: scale(0.97); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
    transform: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
    animation: fadeIn 0.6s ease 0.3s both;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; transition: transform 0.2s ease; }
  #progressPct {
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    color: var(--accent);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    display: inline-block;
  }
  #progressPct.bump {
    animation: pctBump 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #f0d49a);
    transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(231,193,124,0.35);
  }
  #progressBar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: translateX(-100%);
    animation: shimmer 2.2s ease-in-out infinite;
  }
  #progressBar.celebrate {
    animation: progressCelebrate 0.6s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.25s ease;
    animation: taskEnter 0.45s cubic-bezier(0.22,1,0.36,1) both;
    position: relative;
    overflow: hidden;
  }
  .task::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transform: scaleY(0.6);
    transition: opacity 0.2s ease, transform 0.2s ease;
    border-radius: 11px 0 0 11px;
  }
  .task:hover {
    transform: translateY(-2px);
    border-color: #4a4235;
    box-shadow: 0 8px 20px rgba(0,0,0,0.22);
    background: #2e2a24;
  }
  .task:hover::before {
    opacity: 1;
    transform: scaleY(1);
  }
  .task.completed { opacity: 0.82; }
  .task.completed:hover { opacity: 0.9; }
  .task.just-added {
    animation: taskEnter 0.5s cubic-bezier(0.22,1,0.36,1) both, taskHighlight 1.2s ease 0.3s;
  }
  .task.removing {
    animation: taskExit 0.3s ease forwards;
  }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
    position: relative;
  }
  .check:hover { background: var(--accent-soft); transform: scale(1.08); }
  .check:active { transform: scale(0.92); }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
    animation: checkPop 0.38s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 3px 10px rgba(231,193,124,0.35);
  }
  .task.completed .check:hover { background: var(--accent); transform: scale(1.05); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .task:hover .task-text {
    transform: translateX(2px);
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
    transform: translateY(-1px) scale(1.02);
  }
  .icon-btn:active { transform: scale(0.96); }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.22s cubic-bezier(0.22,1,0.36,1);
    position: relative;
    overflow: hidden;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .priority-btn:active { transform: scale(0.96); }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 3px 10px rgba(231,193,124,0.18);
    animation: priorityPulse 2s ease-in-out infinite;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
    transition: all 0.3s ease;
  }
  #prioritySummary {
    color: var(--muted);
    display: inline-block;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  #prioritySummary.has-high {
    color: var(--accent);
    font-weight: 600;
    animation: gentlePulse 2.4s ease-in-out infinite;
  }
  #prioritySummary.pulse {
    animation: summaryBump 0.4s ease;
  }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
    animation: emptyEnter 0.5s cubic-bezier(0.22,1,0.36,1) both;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .empty:hover {
    border-color: rgba(231,193,124,0.35);
    background: rgba(231,193,124,0.04);
    transform: translateY(-1px);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  .empty-icon {
    font-size: 1.6rem;
    display: block;
    margin-bottom: 8px;
    animation: floatMark 3s ease-in-out infinite;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
    animation: fadeIn 0.6s ease 0.6s both;
  }
  #celebration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .confetti {
    position: absolute;
    top: -12px;
    width: 8px;
    height: 10px;
    border-radius: 2px;
    opacity: 0.95;
    animation: confettiFall linear forwards;
  }
  @keyframes headerEnter {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes taskEnter {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes taskExit {
    to { opacity: 0; transform: translateY(-8px) scale(0.96); height: 0; padding-top: 0; padding-bottom: 0; margin: 0; border-width: 0; }
  }
  @keyframes taskHighlight {
    0% { box-shadow: 0 0 0 0 rgba(231,193,124,0); border-color: var(--border); }
    30% { box-shadow: 0 0 0 4px rgba(231,193,124,0.18); border-color: rgba(231,193,124,0.5); }
    100% { box-shadow: 0 0 0 0 rgba(231,193,124,0); border-color: var(--border); }
  }
  @keyframes checkPop {
    0% { transform: scale(0.7); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  @keyframes pulseAmber {
    0% { box-shadow: 0 0 0 0 rgba(231,193,124,0.45); }
    70% { box-shadow: 0 0 0 10px rgba(231,193,124,0); }
    100% { box-shadow: 0 0 0 0 rgba(231,193,124,0); }
  }
  @keyframes floatMark {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(1.5deg); }
  }
  @keyframes bgShift {
    0%, 100% { opacity: 0.55; transform: scale(1) translate(0,0); }
    50% { opacity: 0.75; transform: scale(1.06) translate(6px, -6px); }
  }
  @keyframes pctBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes progressCelebrate {
    0% { transform: scaleY(1); }
    50% { transform: scaleY(1.35); filter: brightness(1.15); }
    100% { transform: scaleY(1); }
  }
  @keyframes priorityPulse {
    0%, 100% { box-shadow: 0 3px 10px rgba(231,193,124,0.18); }
    50% { box-shadow: 0 4px 16px rgba(231,193,124,0.32); }
  }
  @keyframes gentlePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
  @keyframes summaryBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes emptyEnter {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) translateX(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(720deg) scale(0.9); opacity: 0; }
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
    .bg-glow-1 { width: 420px; height: 420px; top: -100px; right: -100px; }
    .bg-glow-2 { width: 360px; height: 360px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="bg-glow bg-glow-1" aria-hidden="true"></div>
<div class="bg-glow bg-glow-2" aria-hidden="true"></div>
<div id="celebration" aria-hidden="true"></div>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";
  var lastPct = -1;
  var lastHighRemaining = -1;
  var justAddedId = null;

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var celebration = document.getElementById("celebration");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));

  function triggerCelebration() {
    if (!celebration) return;
    var colors = ["#e7c17c", "#f0d49a", "#d9a85a", "#fff1c9", "#c99a4a"];
    for (var i = 0; i < 22; i++) {
      var c = document.createElement("span");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (6 + Math.random() * 6) + "px";
      c.style.height = (8 + Math.random() * 8) + "px";
      c.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      c.style.animationDuration = (0.9 + Math.random() * 0.7) + "s";
      c.style.animationDelay = (Math.random() * 0.25) + "s";
      c.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      if (Math.random() > 0.5) c.style.borderRadius = "50%";
      celebration.appendChild(c);
      (function (el) {
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 1800);
      })(c);
    }
    progressBar.classList.remove("celebrate");
    void progressBar.offsetWidth;
    progressBar.classList.add("celebrate");
    setTimeout(function () { progressBar.classList.remove("celebrate"); }, 700);
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      input.animate ? input.animate([{ transform: "translateX(0)" }, { transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "translateX(0)" }], { duration: 280, easing: "ease" }) : null;
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    var newTask = { id: nextId++, text: text, completed: false, priority: priority };
    tasks.push(newTask);
    justAddedId = newTask.id;
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    addBtn.classList.remove("pulse");
    void addBtn.offsetWidth;
    addBtn.classList.add("pulse");
    setTimeout(function () { addBtn.classList.remove("pulse"); }, 650);
    render();
  }

  function toggleTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].completed = !tasks[i].completed;
        break;
      }
    }
    render();
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    var el = list.querySelector('[data-task-id="' + id + '"]');
    if (el && el.animate) {
      el.classList.add("removing");
      setTimeout(function () {
        tasks = tasks.filter(function (t) { return t.id !== id; });
        render();
      }, 260);
    } else {
      tasks = tasks.filter(function (t) { return t.id !== id; });
      render();
    }
  }

  function clearCompleted() {
    var hasCompleted = tasks.some(function (t) { return t.completed; });
    if (!hasCompleted) return;
    var completedEls = list.querySelectorAll(".task.completed");
    if (completedEls.length && completedEls[0].animate) {
      completedEls.forEach(function (el, idx) {
        el.style.animationDelay = (idx * 0.04) + "s";
        el.classList.add("removing");
      });
      setTimeout(function () {
        tasks = tasks.filter(function (t) { return !t.completed; });
        render();
      }, 320);
    } else {
      tasks = tasks.filter(function (t) { return !t.completed; });
      render();
    }
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    if (pct !== lastPct) {
      progressPct.classList.remove("bump");
      void progressPct.offsetWidth;
      progressPct.classList.add("bump");
      setTimeout(function () { progressPct.classList.remove("bump"); }, 420);
      if (pct === 100 && total > 0 && lastPct !== 100) {
        triggerCelebration();
      }
      lastPct = pct;
    }

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
      prioritySummary.classList.remove("has-high");
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
      prioritySummary.classList.add("has-high");
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
      prioritySummary.classList.add("has-high");
    }
    if (highRemaining !== lastHighRemaining) {
      prioritySummary.classList.remove("pulse");
      void prioritySummary.offsetWidth;
      prioritySummary.classList.add("pulse");
      setTimeout(function () { prioritySummary.classList.remove("pulse"); }, 450);
      lastHighRemaining = highRemaining;
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var icon = document.createElement("span");
      icon.className = "empty-icon";
      icon.setAttribute("aria-hidden", "true");
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        icon.textContent = "✦";
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        icon.textContent = "☀︎";
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        icon.textContent = "○";
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        icon.textContent = "—";
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(icon);
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task, index) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      if (justAddedId === task.id) li.classList.add("just-added");
      li.setAttribute("data-task-id", String(task.id));
      li.style.animationDelay = (index * 0.045) + "s";

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function () { toggleTask(task.id); });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
    justAddedId = null;
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
