<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
  }
  #addBtn:hover { filter: brightness(1.06); }
  #addBtn:active { filter: brightness(0.96); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #clearBtn:hover { color: var(--text); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
  }
  .task.completed { opacity: 0.82; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .check:hover { background: var(--accent-soft); }
  .task.completed .check:hover { background: var(--accent); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
  }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  /* Celebratory feedback */
  .task {
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .task.just-completed {
    animation: taskPop 0.55s ease;
    background: rgba(231, 193, 124, 0.10);
    border-color: rgba(231, 193, 124, 0.45);
  }
  @keyframes taskPop {
    0% { transform: scale(1); }
    25% { transform: scale(1.015); }
    50% { transform: scale(0.998); }
    100% { transform: scale(1); }
  }
  .check {
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .check.celebrate {
    animation: checkPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes checkPop {
    0% { transform: scale(0.85); }
    50% { transform: scale(1.28); box-shadow: 0 0 0 6px rgba(231, 193, 124, 0.28); }
    100% { transform: scale(1); }
  }
  .mark.celebrate {
    animation: markBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes markBounce {
    0% { transform: scale(1) rotate(0deg); }
    30% { transform: scale(1.18) rotate(-10deg); }
    55% { transform: scale(1.08) rotate(7deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  #progressBar {
    position: relative;
    overflow: hidden;
    transform-origin: left center;
  }
  #progressBar.bump {
    animation: progressBump 0.45s ease;
  }
  @keyframes progressBump {
    0% { transform: scaleY(1); filter: brightness(1); }
    40% { transform: scaleY(1.7); filter: brightness(1.25); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }
  #progressLabel.bump-text {
    animation: labelPop 0.4s ease;
  }
  @keyframes labelPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.07); color: var(--accent); }
    100% { transform: scale(1); }
  }
  #celebrationLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    opacity: 0.95;
    will-change: transform, opacity;
    animation: confettiFall var(--dur, 0.9s) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes confettiFall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); opacity: 1; }
    15% { opacity: 1; }
    100% { transform: translate3d(var(--x-end), var(--y-end), 0) rotate(var(--rot)) scale(0.9); opacity: 0; }
  }
  .burst-ring {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0.9;
    animation: burstRing 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes burstRing {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
  }
  .sparkle {
    position: absolute;
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    pointer-events: none;
    animation: sparklePop 0.85s ease-out forwards;
    text-shadow: 0 2px 10px rgba(231, 193, 124, 0.65);
  }
  @keyframes sparklePop {
    0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
    20% { opacity: 1; transform: translateY(-6px) scale(1.15) rotate(10deg); }
    100% { transform: translateY(-24px) scale(0.9) rotate(-10deg); opacity: 0; }
  }
  #celebrationToast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(18px);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 16px 10px 12px;
    border-radius: 999px;
    font-weight: 650;
    font-size: 0.95rem;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42), 0 0 0 4px rgba(231, 193, 124, 0.12);
    opacity: 0;
    pointer-events: none;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: calc(100vw - 24px);
    white-space: nowrap;
  }
  #celebrationToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #celebrationToast .toast-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 16px;
    flex: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .task.just-completed,
    .check.celebrate,
    .mark.celebrate,
    #progressBar.bump,
    #progressLabel.bump-text,
    .confetti-piece,
    .burst-ring,
    .sparkle,
    #celebrationToast {
      animation: none !important;
      transition: opacity 0.15s ease !important;
    }
    .confetti-piece { display: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>
<div id="celebrationLayer" aria-hidden="true"></div>
<div id="celebrationToast" role="status" aria-live="polite" aria-atomic="true"><span class="toast-icon" aria-hidden="true">✦</span><span id="toastText">Task completed!</span></div>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var celebrationLayer = document.getElementById("celebrationLayer");
  var celebrationToast = document.getElementById("celebrationToast");
  var toastText = document.getElementById("toastText");
  var toastTimer = null;
  var pendingCelebration = null;
  var prevPct = 0;
  var celebrationMessages = ["Nice work! \u2728", "Task done! \uD83C\uDF89", "You're on fire! \uD83D\uDD25", "Keep going! \uD83C\uDF1F", "Brilliant! \uD83D\uDCAB", "Completed! \u2705"];
  var celebrationIndex = 0;

  function playCelebrationSound() {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();
      var now = ctx.currentTime;
      function tone(freq, start, dur, vol) {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(vol, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, start + dur);
        o.start(start);
        o.stop(start + dur);
      }
      tone(880, now, 0.18, 0.18);
      tone(1108, now + 0.12, 0.22, 0.16);
      tone(1318, now + 0.24, 0.35, 0.12);
      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 900);
    } catch (e) {}
  }

  function spawnConfetti(x, y, intensity) {
    var count = intensity === "big" ? 32 : 22;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      count = Math.min(count, 8);
    }
    var colors = ["#e7c17c", "#f2ede3", "#e08f7e", "#d4a574", "#f5d6a0", "#c9a86a", "#fff1c1", "#e9b86b"];
    for (var i = 0; i < count; i++) {
      var el = document.createElement("span");
      el.className = "confetti-piece";
      var angle = Math.random() * Math.PI * 2;
      var distance = 50 + Math.random() * 140;
      var xEnd = Math.cos(angle) * distance;
      var yEnd = Math.sin(angle) * distance + 70 + Math.random() * 80;
      var rot = (Math.random() * 720 - 360) + "deg";
      var dur = (0.75 + Math.random() * 0.65) + "s";
      var delay = (Math.random() * 0.07) + "s";
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.setProperty("--x-end", xEnd + "px");
      el.style.setProperty("--y-end", yEnd + "px");
      el.style.setProperty("--rot", rot);
      el.style.setProperty("--dur", dur);
      el.style.animationDelay = delay;
      if (Math.random() > 0.55) el.style.borderRadius = "50%";
      if (Math.random() > 0.82) {
        el.style.width = "6px";
        el.style.height = "14px";
        el.style.borderRadius = "2px";
      }
      if (Math.random() > 0.88) {
        el.style.width = "9px";
        el.style.height = "9px";
        el.style.transform = "rotate(45deg)";
      }
      celebrationLayer.appendChild(el);
      (function (elem) {
        setTimeout(function () { if (elem.parentNode) elem.parentNode.removeChild(elem); }, 1500);
      })(el);
    }
    var ring = document.createElement("span");
    ring.className = "burst-ring";
    ring.style.left = x + "px";
    ring.style.top = y + "px";
    celebrationLayer.appendChild(ring);
    setTimeout(function () { if (ring.parentNode) ring.parentNode.removeChild(ring); }, 650);
    var sparkleCount = intensity === "big" ? 6 : 3;
    for (var j = 0; j < sparkleCount; j++) {
      var spark = document.createElement("span");
      spark.className = "sparkle";
      spark.textContent = Math.random() > 0.5 ? "\u2726" : "\u2727";
      spark.style.left = (x + (Math.random() * 80 - 40)) + "px";
      spark.style.top = (y + (Math.random() * 40 - 20)) + "px";
      spark.style.animationDelay = (Math.random() * 0.15) + "s";
      celebrationLayer.appendChild(spark);
      (function (s) {
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 900);
      })(spark);
    }
  }

  function showCelebrationToast(message) {
    toastText.textContent = message;
    celebrationToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { celebrationToast.classList.remove("show"); }, 2400);
  }

  function triggerCelebration(x, y, isAllDone) {
    var msg;
    if (isAllDone) {
      msg = "All done! Amazing work! \uD83C\uDF89";
      spawnConfetti(x, y, "big");
      setTimeout(function () {
        spawnConfetti(window.innerWidth / 2, window.innerHeight / 2 - 40, "big");
      }, 180);
    } else {
      msg = celebrationMessages[celebrationIndex % celebrationMessages.length];
      celebrationIndex++;
      spawnConfetti(x, y, "normal");
    }
    showCelebrationToast(msg);
    playCelebrationSound();
    var mark = document.querySelector(".mark");
    if (mark) {
      mark.classList.remove("celebrate");
      void mark.offsetWidth;
      mark.classList.add("celebrate");
      setTimeout(function () { mark.classList.remove("celebrate"); }, 700);
    }
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
  }

  function toggleTask(id, rect) {
    var wasCompleted = false;
    var taskText = "";
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        wasCompleted = tasks[i].completed;
        taskText = tasks[i].text;
        tasks[i].completed = !tasks[i].completed;
        break;
      }
    }
    if (!wasCompleted) {
      if (rect) {
        pendingCelebration = { id: id, x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, text: taskText };
      } else {
        pendingCelebration = { id: id, x: window.innerWidth / 2, y: window.innerHeight / 2, text: taskText };
      }
    } else {
      pendingCelebration = null;
    }
    render();
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      var prevPctLocalEmpty = prevPct;
      prevPct = pct;
      if (pendingCelebration) {
        var isAllDoneEmpty = total > 0 && done === total;
        triggerCelebration(pendingCelebration.x, pendingCelebration.y, isAllDoneEmpty);
        if (pct > prevPctLocalEmpty) {
          progressBar.classList.remove("bump");
          void progressBar.offsetWidth;
          progressBar.classList.add("bump");
          setTimeout(function () { progressBar.classList.remove("bump"); }, 500);
          progressLabel.classList.add("bump-text");
          setTimeout(function () { progressLabel.classList.remove("bump-text"); }, 500);
        }
        pendingCelebration = null;
      }
      return;
    }

    shown.forEach(function (task) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      li.setAttribute("data-id", String(task.id));

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function (e) {
        var r = e.currentTarget.getBoundingClientRect();
        toggleTask(task.id, r);
      });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });

    var prevPctLocal = prevPct;
    prevPct = pct;
    if (pendingCelebration) {
      var isAllDone = total > 0 && done === total;
      triggerCelebration(pendingCelebration.x, pendingCelebration.y, isAllDone);
      var completedLi = list.querySelector('[data-id="' + pendingCelebration.id + '"]');
      if (completedLi) {
        completedLi.classList.add("just-completed");
        var checkBtn = completedLi.querySelector(".check");
        if (checkBtn) {
          checkBtn.classList.add("celebrate");
          setTimeout(function () { checkBtn.classList.remove("celebrate"); }, 600);
        }
        setTimeout(function () { completedLi.classList.remove("just-completed"); }, 700);
      }
      if (pct > prevPctLocal) {
        progressBar.classList.remove("bump");
        void progressBar.offsetWidth;
        progressBar.classList.add("bump");
        setTimeout(function () { progressBar.classList.remove("bump"); }, 500);
        progressLabel.classList.add("bump-text");
        setTimeout(function () { progressLabel.classList.remove("bump-text"); }, 500);
      }
      pendingCelebration = null;
    }
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
