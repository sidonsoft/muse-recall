<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match - Arcade Reef</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F41A}", name: "Shell" },
    { emoji: "\u2B50", name: "Starfish" }
  ];
  var W = 900, H = 700;
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3 },
    { pairs: 8, cols: 4, rows: 4 },
    { pairs: 10, cols: 5, rows: 4 }
  ];

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, level = 0;
  var hudMoves, hudPairs, hudScore, hudLevel, hudMsg, hudCombo, endOverlay, endTitle, endDetail, endBtnBg, endBtnTx, startOverlay;
  var bubbles = [], waveOffset = 0, cardBases = [];

  function create() {
    var s = this;
    drawOcean(s);
    createBubbles(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 135, W, 340);
    g.fillStyle(0xB9E3FF, 1); g.fillRect(0, 475, W, 225);
    g.fillStyle(0xF0E6C8, 1); g.fillEllipse(450, 685, 920, 110);
    g.fillStyle(0xE8DCC3, 1); g.fillEllipse(220, 690, 420, 70);
    g.fillStyle(0xA9DEF9, 1);
    g.fillEllipse(180, 132, 380, 36); g.fillEllipse(520, 128, 420, 32); g.fillEllipse(780, 135, 300, 28);
    g.fillStyle(0xEAF6FB, 0.7);
    g.fillEllipse(160, 122, 280, 18); g.fillEllipse(500, 118, 320, 16); g.fillEllipse(760, 124, 220, 14);
    g.fillStyle(0x4EA8DE, 0.9);
    for (var x = 30; x < 900; x += 110) {
      g.fillEllipse(x, 620, 18, 78); g.fillEllipse(x + 14, 630, 14, 58);
    }
    g.fillStyle(0x2A9D8F, 0.95);
    for (var x = 75; x < 900; x += 130) {
      g.fillEllipse(x, 635, 12, 62);
    }
    g.fillStyle(0xFF9A8A, 1); g.fillCircle(860, 625, 28); g.fillCircle(835, 642, 20); g.fillCircle(875, 642, 18);
    g.fillStyle(0xFFB703, 1); g.fillCircle(110, 632, 16); g.fillCircle(95, 645, 10); g.fillCircle(125, 645, 10);
    g.fillStyle(0x48CAE4, 1); g.fillCircle(40, 640, 14); g.fillCircle(55, 650, 9);
    g.fillStyle(0xFFFFFF, 0.45);
    for (var i = 0; i < 10; i++) {
      var bx = 60 + i * 85, by = 210 + (i % 3) * 70;
      g.fillCircle(bx, by, 5); g.fillCircle(bx + 2, by - 2, 2);
    }
  }

  function createBubbles(scene) {
    for (var i = 0; i < 14; i++) {
      var b = scene.add.graphics();
      b.fillStyle(0xFFFFFF, 0.55);
      var r = 3 + Math.random() * 7;
      b.fillCircle(0, 0, r);
      b.fillStyle(0xFFFFFF, 0.9); b.fillCircle(1, -1, r * 0.35);
      b.x = 40 + Math.random() * 820;
      b.y = 180 + Math.random() * 380;
      b.setDepth(1);
      b.speed = 0.3 + Math.random() * 0.6;
      b.drift = (Math.random() - 0.5) * 0.4;
      b.r = r;
      bubbles.push(b);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match Arcade", textStyle(30, "#102A43")).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level 1 \u2022 Reef Explorer", textStyle(18, "#102A43"));
    hudMoves = scene.add.text(24, 76, "Moves: 0", textStyle(18, "#102A43"));
    hudPairs = scene.add.text(24, 98, "Pairs: 0 / 6", textStyle(18, "#102A43"));
    hudScore = scene.add.text(24, 120, "Score: 0", textStyle(20, "#102A43"));
    hudCombo = scene.add.text(W - 24, 38, "", textStyle(18, "#0077B6")).setOrigin(1, 0.5).setVisible(false);
    hudMsg = scene.add.text(W - 24, 62, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match pairs \u2022 Build streaks \u2022 Clear the reef!", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function getLayout(lvl) {
    var cfg = LEVELS[lvl];
    var cols = cfg.cols, rows = cfg.rows;
    var padX = 16, padY = 12;
    var availableW = 820, availableH = 390;
    var cw = Math.floor((availableW - (cols - 1) * padX) / cols);
    var ch = Math.floor((availableH - (rows - 1) * padY) / rows);
    cw = Math.min(cw, 185); ch = Math.min(ch, 140);
    if (lvl === 2) { cw = Math.min(cw, 150); ch = Math.min(ch, 120); }
    var totalW = cols * cw + (cols - 1) * padX;
    var totalH = rows * ch + (rows - 1) * padY;
    var gx = (W - totalW) / 2;
    var gy = 192;
    return { cols: cols, rows: rows, cw: cw, ch: ch, gx: gx, gy: gy, padX: padX, padY: padY, pairs: cfg.pairs };
  }

  function shuffledDeck(pairs) {
    var deck = [];
    for (var i = 0; i < pairs; i++) {
      var a = ANIMALS[i % ANIMALS.length];
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    }
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = []; cardBases = [];
    var layout = getLayout(level);
    var deck = shuffledDeck(layout.pairs);
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / layout.cols), c = idx % layout.cols;
      var cx = layout.gx + c * (layout.cw + layout.padX) + layout.cw / 2;
      var cy = layout.gy + r * (layout.ch + layout.padY) + layout.ch / 2;
      var cardObj = makeCard(scene, cx, cy, layout.cw, layout.ch, card, idx);
      cards.push(cardObj);
      cardBases.push({ y: cy, idx: idx });
    });
    hudPairs.setText("Pairs: 0 / " + layout.pairs);
    hudLevel.setText("Level " + (level + 1) + " \u2022 " + ["Reef Explorer", "Deep Dive", "Abyss Challenge"][level]);
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    back.fillStyle(0xA9DEF9, 1); back.fillRoundedRect(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 10);
    back.fillStyle(0xFFFFFF, 0.85);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 5, -2, 7); back.fillCircle(0, h / 4, 11);
    var paw = scene.add.text(0, -4, "\u{1F4A7}", { fontSize: (w > 160 ? "48px" : "36px") }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0xE1F5FE, 0xB9E3FF, 0xD6EAF8, 0xA9DEF9, 0x90E0EF, 0xEAF6FB, 0xD0EBFF, 0xB2EBF2, 0xCDEEF5];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    fg.lineStyle(3, 0x4EA8DE, 1); fg.strokeRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var emoSize = w > 160 ? "56px" : "44px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 160 ? 18 : 15, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, baseY: y, idx: idx };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) { scene.tweens.add({ targets: cont, scale: 1.04, duration: 120 }); } });
    cont.on("pointerout", function () { if (!card.matched) { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); } });
    scene.tweens.add({ targets: cont, y: y - 3, duration: 1200 + idx * 80, yoyo: true, repeat: -1, ease: "Sine.easeInOut", delay: idx * 60 });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function showScorePopup(scene, x, y, text, color) {
    var t = scene.add.text(x, y, text, textStyle(22, color || "#0077B6")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 800, ease: "Quad.easeOut", onComplete: function () { t.destroy(); } });
  }

  function burstBubbles(scene, x, y) {
    for (var i = 0; i < 8; i++) {
      var b = scene.add.graphics().setDepth(12);
      b.fillStyle(0xFFFFFF, 0.9); b.fillCircle(0, 0, 4 + Math.random() * 4);
      b.x = x; b.y = y;
      var tx = x + Phaser.Math.Between(-60, 60);
      var ty = y + Phaser.Math.Between(-50, -10);
      scene.tweens.add({ targets: b, x: tx, y: ty, alpha: 0, scale: 0.5, duration: 600 + Math.random() * 400, onComplete: (function (g) { return function () { g.destroy(); }; })(b) });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160, onComplete: function () { a.view.setScale(1); card.view.setScale(1); } });
        burstBubbles(scene, card.view.x, card.view.y);
        burstBubbles(scene, a.view.x, a.view.y);
        matches++;
        streak++;
        var basePts = 100;
        var bonus = streak > 1 ? (streak - 1) * 25 : 0;
        var gained = basePts + bonus;
        score += gained;
        hudScore.setText("Score: " + score);
        hudPairs.setText("Pairs: " + matches + " / " + getLayout(level).pairs);
        if (streak > 1) {
          hudCombo.setText("Streak x" + streak + " +" + gained + "!");
          hudCombo.setVisible(true);
          scene.tweens.add({ targets: hudCombo, scale: { from: 0.9, to: 1 }, duration: 150, yoyo: true });
          showScorePopup(scene, card.view.x, card.view.y - 50, "+" + gained, "#0077B6");
        } else {
          hudCombo.setVisible(false);
          showScorePopup(scene, card.view.x, card.view.y - 50, "+" + gained, "#0077B6");
        }
        var total = getLayout(level).pairs;
        if (streak === 1) { hudMsg.setText("Nice! \u{1F389}"); }
        else if (streak === 2) { hudMsg.setText("Great streak! \u2728"); }
        else if (streak >= 3) { hudMsg.setText("Amazing! \u{1F30A} x" + streak); }
        lockBoard = false;
        if (matches === total) { setTimeout(function () { showWin(scene); }, 400); }
      }, 350);
    } else {
      hudMsg.setText("So close! Try again \u{1F340}");
      hudCombo.setVisible(false);
      streak = 0;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-310, -200, 620, 400, 28);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 28);
    var title = scene.add.text(0, -130, "\u{1F30A} Ocean Match Arcade \u{1F419}", textStyle(36, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -70, "Dive in and find the pairs!\n3 reef levels \u2022 Build streaks for bonus points", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F419} \u{1F980} \u{1F422} \u{1F433} \u{1F42C} \u{1F420}", { fontSize: "38px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 50, "No timers \u2022 No penalties \u2022 Just pure fun", textStyle(16, "#4EA8DE")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Dive In", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
    });
    btnBg.on("pointerover", function () { btnBg.setAlpha(0.9); });
    btnBg.on("pointerout", function () { btnBg.setAlpha(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-300, -180, 600, 360, 28);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 28);
    endTitle = scene.add.text(0, -110, "\u{1F389} Reef Cleared! \u{1F389}", textStyle(38, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    endBtnBg = scene.add.graphics();
    endBtnBg.fillStyle(0x4EA8DE, 1); endBtnBg.fillRoundedRect(-140, 60, 280, 70, 35);
    endBtnTx = scene.add.text(0, 95, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, endBtnBg, endBtnTx]);
    endBtnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 70), Phaser.Geom.Rectangle.Contains);
    endBtnBg.on("pointerdown", function () {
      if (level < LEVELS.length - 1 && matches === getLayout(level).pairs) {
        nextLevel(scene);
      } else {
        restart(scene);
      }
    });
  }

  function showWin(scene) {
    var total = getLayout(level).pairs;
    var stars = moves <= total + 4 ? 3 : (moves <= total + 8 ? 2 : 1);
    var isLast = level === LEVELS.length - 1;
    if (isLast) {
      endTitle.setText("\u{1F3C6} Champion Diver! \u{1F3C6}");
      endDetail.setText("You cleared all 3 reef levels!\nScore: " + score + "  " + "\u2B50".repeat(stars) + "\nMoves: " + moves);
      endBtnTx.setText("\u21BB Play Again");
    } else {
      endTitle.setText("\u{1F389} Level " + (level + 1) + " Complete! \u{1F389}");
      endDetail.setText("Pairs: " + total + "/" + total + "  \u2022  Score: " + score + "  " + "\u2B50".repeat(stars) + "\nMoves: " + moves + "  \u2022  Streak best: x" + streak);
      endBtnTx.setText("\u25B6 Next Reef");
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText(isLast ? "You win! \u{1F389}" : "Reef cleared! \u2728");
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F4A7}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-70, 70), duration: Phaser.Math.Between(1400, 2400), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function nextLevel(scene) {
    level++;
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false;
    hudMoves.setText("Moves: 0");
    hudCombo.setVisible(false);
    hudMsg.setText("Level " + (level + 1) + "! Tap a card!");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    scene.tweens.add({ targets: scene.cameras.main, alpha: { from: 0.6, to: 1 }, duration: 300 });
  }

  function restart(scene) {
    level = 0; moves = 0; matches = 0; score = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudCombo.setVisible(false); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update() {
    waveOffset += 0.015;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed;
      b.x += Math.sin(waveOffset + i) * 0.3 + b.drift * 0.1;
      if (b.y < 120) { b.y = 480 + Math.random() * 80; b.x = 40 + Math.random() * 820; }
    }
  }
})();
</script>
</body>
</html>
