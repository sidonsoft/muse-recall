<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(900px 600px at 20% -10%, rgba(231,193,124,0.13), transparent 60%), radial-gradient(800px 500px at 90% 0%, rgba(142,197,166,0.10), transparent 60%), radial-gradient(700px 500px at 50% 120%, rgba(127,184,230,0.08), transparent 60%), var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  .app {
    width: 100%;
    max-width: 620px;
    animation: appIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    animation: floatMark 3s ease-in-out infinite;
    box-shadow: 0 6px 18px rgba(231,193,124,0.25);
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .vibe-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 600;
    letter-spacing: 0.1px;
    border: 1px solid var(--border);
    background: rgba(38,35,32,0.9);
    color: var(--text);
    backdrop-filter: blur(6px);
    transition: all 0.35s ease;
    animation: vibePop 0.5s ease both;
  }
  .vibe-pill.vibe-idle { border-color: var(--border); }
  .vibe-pill.vibe-start { border-color: rgba(231,193,124,0.35); background: rgba(231,193,124,0.12); color: var(--accent); }
  .vibe-pill.vibe-mid { border-color: rgba(142,197,166,0.35); background: rgba(142,197,166,0.14); color: #bfe8d0; }
  .vibe-pill.vibe-hot { border-color: rgba(231,193,124,0.5); background: rgba(231,193,124,0.18); color: var(--accent); box-shadow: 0 4px 16px rgba(231,193,124,0.18); }
  .vibe-pill.vibe-done { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px rgba(231,193,124,0.35); animation: vibePop 0.5s ease both, pulseRing 1.2s ease; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(600px 200px at 10% 0%, rgba(231,193,124,0.07), transparent 60%);
    pointer-events: none;
  }
  .add-row {
    display: flex;
    gap: 10px;
    position: relative;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(231,193,124,0.12);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  #priorityInput:hover { border-color: #4a4236; color: var(--text); }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 6px 16px rgba(231,193,124,0.22);
  }
  #addBtn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.35) 50%, transparent 80%);
    transform: translateX(-120%);
    transition: transform 0.6s ease;
  }
  #addBtn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(231,193,124,0.28); }
  #addBtn:hover::after { transform: translateX(120%); }
  #addBtn:active { filter: brightness(0.96); transform: translateY(0) scale(0.98); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hint-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.9;
    animation: pulseDot 1.8s ease-in-out infinite;
    flex: none;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .filter-btn:active { transform: scale(0.96); }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 4px 12px rgba(231,193,124,0.15);
    transform: translateY(-1px);
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s ease, transform 0.15s ease;
  }
  #clearBtn:hover { color: var(--text); transform: translateY(-1px); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
    transform: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
    background: rgba(38,35,32,0.6);
    border: 1px solid rgba(56,50,42,0.6);
    border-radius: 12px;
    padding: 12px 12px 10px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  #progressLabel::before {
    content: "◐";
    color: var(--accent);
    font-size: 0.9rem;
    animation: spinSlow 4s linear infinite;
    display: inline-block;
  }
  #progressPct {
    font-weight: 700;
    color: var(--accent);
    min-width: 36px;
    text-align: right;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  #progressPct.bump { transform: scale(1.18); }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
    position: relative;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #f0d9a0);
    transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
    position: relative;
    overflow: hidden;
  }
  #progressBar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: translateX(-100%);
    animation: shimmerBar 1.8s ease-in-out infinite;
  }
  #progressBar.pulse {
    box-shadow: 0 0 12px rgba(231,193,124,0.6);
    animation: barPulse 0.6s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    animation: slideIn 0.38s cubic-bezier(0.16,1,0.3,1) both;
  }
  .task:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.28);
    border-color: #4a4236;
    background: #2b2824;
  }
  .task.completed { opacity: 0.82; }
  .task.completed:hover { transform: translateY(-1px); }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
    transform: scale(1.05);
    box-shadow: 0 4px 10px rgba(231,193,124,0.25);
  }
  .check:hover { background: var(--accent-soft); transform: scale(1.08); }
  .task.completed .check:hover { background: var(--accent); transform: scale(1.08); }
  .check:active { transform: scale(0.92); }
  .check.pop { animation: checkPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    transition: color 0.2s ease;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
    transform: translateY(-1px);
  }
  .icon-btn:active { transform: scale(0.96); }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: var(--accent-soft);
  }
  .priority-btn:active { transform: scale(0.96); }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 3px 10px rgba(231,193,124,0.15);
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #prioritySummary { color: var(--muted); transition: color 0.3s ease; }
  #prioritySummary.has-high { color: var(--accent); font-weight: 600; }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
    background: rgba(38,35,32,0.4);
    animation: slideIn 0.4s ease both;
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  .empty-icon {
    font-size: 1.6rem;
    display: block;
    margin-bottom: 8px;
    animation: floatMark 2.6s ease-in-out infinite;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  footer::before, footer::after {
    content: "";
    height: 1px;
    flex: 1;
    max-width: 40px;
    background: var(--border);
    opacity: 0.6;
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%) translateY(12px);
    background: #f2ede3;
    color: #1e1c18;
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 650;
    box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    z-index: 50;
    white-space: nowrap;
    border: 1px solid rgba(0,0,0,0.06);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 40;
  }
  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 8px;
    height: 12px;
    border-radius: 2px;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: cubic-bezier(0.25,0.46,0.45,0.94);
    animation-fill-mode: forwards;
  }
  @keyframes appIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes floatMark {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-3px) rotate(1deg); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes checkPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1.05); }
  }
  @keyframes shimmerBar {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  @keyframes barPulse {
    0% { transform: scaleX(1); }
    50% { transform: scaleX(1.02); }
    100% { transform: scaleX(1); }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.9; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(231,193,124,0.45); }
    100% { box-shadow: 0 0 0 12px rgba(231,193,124,0); }
  }
  @keyframes vibePop {
    0% { transform: scale(0.92); }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(420px) rotate(720deg); opacity: 0; }
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
    <div id="vibePill" class="vibe-pill vibe-idle" aria-live="polite">✨ Let's flow — add your first task</div>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint"><span class="hint-dot" aria-hidden="true"></span> Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span aria-hidden="true">◆</span> <span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>
<div id="confetti" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var vibePill = document.getElementById("vibePill");
  var toast = document.getElementById("toast");
  var confettiRoot = document.getElementById("confetti");
  var lastPct = 0;
  var toastTimer = null;

  function showToast(message) {
    if (!toast) return;
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
    }, 2200);
  }

  function launchConfetti() {
    if (!confettiRoot) return;
    confettiRoot.innerHTML = "";
    var colors = ["#e7c17c", "#f2ede3", "#e08f7e", "#8ec5a6", "#7fb8e6", "#f7d774"];
    for (var i = 0; i < 20; i++) {
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = (Math.random() * 100) + "%";
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = (Math.random() * 0.35) + "s";
      piece.style.animationDuration = (0.9 + Math.random() * 0.7) + "s";
      piece.style.width = (6 + Math.random() * 6) + "px";
      piece.style.height = (8 + Math.random() * 8) + "px";
      piece.style.borderRadius = (Math.random() > 0.5 ? "999px" : "2px");
      confettiRoot.appendChild(piece);
    }
    setTimeout(function () {
      if (confettiRoot) confettiRoot.innerHTML = "";
    }, 1800);
  }

  function updateVibe(total, done, pct) {
    if (!vibePill) return;
    if (total === 0) {
      vibePill.textContent = "✨ Let's flow — add your first task";
      vibePill.className = "vibe-pill vibe-idle";
    } else if (pct === 100) {
      vibePill.textContent = "🎉 All done! You're on fire";
      vibePill.className = "vibe-pill vibe-done";
    } else if (pct >= 75) {
      vibePill.textContent = "🔥 Almost there — " + (total - done) + " to go";
      vibePill.className = "vibe-pill vibe-hot";
    } else if (pct >= 50) {
      vibePill.textContent = "⚡ Great momentum — keep going";
      vibePill.className = "vibe-pill vibe-mid";
    } else if (done > 0) {
      vibePill.textContent = "🌱 Nice start — " + done + " down";
      vibePill.className = "vibe-pill vibe-start";
    } else {
      vibePill.textContent = "💫 Ready when you are";
      vibePill.className = "vibe-pill vibe-idle";
    }
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      input.style.transform = "translateX(-2px)";
      setTimeout(function () { input.style.transform = ""; }, 160);
      setTimeout(function () { input.style.transform = "translateX(2px)"; }, 80);
      setTimeout(function () { input.style.transform = ""; }, 220);
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    if (priority === "high") {
      showToast("Added as high priority 🔥");
    } else {
      showToast("Added — let's go! ✨");
    }
    render();
    if (addBtn) {
      addBtn.style.transform = "scale(0.96)";
      setTimeout(function () { addBtn.style.transform = ""; }, 140);
    }
  }

  function toggleTask(id) {
    var toggled = null;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].completed = !tasks[i].completed;
        toggled = tasks[i];
        break;
      }
    }
    if (toggled) {
      if (toggled.completed) {
        showToast("Nice! One down 🎯");
      } else {
        showToast("Back to active ↩︎");
      }
    }
    render();
  }

  function togglePriority(id) {
    var changed = null;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        changed = tasks[i];
        break;
      }
    }
    if (changed) {
      showToast(changed.priority === "high" ? "High priority set 🔥" : "Priority eased");
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    showToast("Removed");
    render();
  }

  function clearCompleted() {
    var done = tasks.filter(function (t) { return t.completed; }).length;
    if (done === 0) return;
    tasks = tasks.filter(function (t) { return !t.completed; });
    showToast("Cleared " + done + " completed 🧹");
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    if (pct !== lastPct) {
      progressPct.classList.remove("bump");
      void progressPct.offsetWidth;
      progressPct.classList.add("bump");
      setTimeout(function () { progressPct.classList.remove("bump"); }, 400);
    }
    if (pct === 100 && total > 0) {
      progressBar.classList.add("pulse");
    } else {
      progressBar.classList.remove("pulse");
    }
    if (pct === 100 && lastPct !== 100 && total > 0) {
      launchConfetti();
      showToast("All tasks complete! 🎉");
    }
    lastPct = pct;
    updateVibe(total, done, pct);

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
      prioritySummary.className = "";
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
      prioritySummary.className = "has-high";
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
      prioritySummary.className = "has-high";
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var icon = document.createElement("span");
      icon.className = "empty-icon";
      icon.setAttribute("aria-hidden", "true");
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        icon.textContent = "✨";
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        icon.textContent = "🌿";
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        icon.textContent = "🎯";
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        icon.textContent = "🔍";
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(icon);
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task, index) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      li.style.animationDelay = (index * 45) + "ms";

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function () {
        check.classList.add("pop");
        setTimeout(function () { check.classList.remove("pop"); }, 400);
        toggleTask(task.id);
      });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
