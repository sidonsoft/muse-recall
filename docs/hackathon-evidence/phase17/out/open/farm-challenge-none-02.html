<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #difficulty-controls{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
  #difficulty-controls button{font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;padding:8px 16px;border-radius:20px;border:2px solid #5da85f;background:#fff;color:#5b3a29;cursor:pointer;font-weight:bold;font-size:14px}
  #difficulty-controls button[aria-pressed="true"]{background:#5da85f;color:#fff}
  #difficulty-controls button:focus{outline:3px solid #ffb703;outline-offset:2px}
  #a11y-status{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="difficulty-controls" role="group" aria-label="Game difficulty">
  <button type="button" id="btn-easy" aria-pressed="true" aria-label="Easy mode, 6 pairs">Easy</button>
  <button type="button" id="btn-hard" aria-pressed="false" aria-label="Hard challenge mode, 8 pairs with 60 second timer">Hard Challenge</button>
</div>
<div id="a11y-status" aria-live="polite" aria-atomic="true"></div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F430}", name: "Bunny" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudTimer, hudDifficulty, endOverlay, endTitle, endDetail, startOverlay;
  var isHardMode = false, timeLeft = 60, timerEvent = null;
  var hardToggleBtn, toggleBg, toggleLabel;
  var easyBtnBg, hardBtnBg, easyBtnLabel, hardBtnLabel;

  function getTotalPairs() { return isHardMode ? 8 : 6; }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    s.input.keyboard.on("keydown-H", function () {
      isHardMode = !isHardMode;
      updateHudDifficulty(s);
      updateStartDifficultyUI();
      updateDomButtons();
      announce("Difficulty set to " + (isHardMode ? "Hard Challenge" : "Easy"));
      if (started) { restart(s); }
    });
    s.input.keyboard.on("keydown-E", function () {
      if (!isHardMode) { return; }
      isHardMode = false;
      updateHudDifficulty(s);
      updateStartDifficultyUI();
      updateDomButtons();
      announce("Difficulty set to Easy");
      if (started) { restart(s); }
    });
    s.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
        if (isHardMode) { startTimer(s); }
        announce("Game started in " + (isHardMode ? "Hard Challenge mode" : "Easy mode"));
      } else if (endOverlay && endOverlay.visible) {
        restart(s);
      }
    });
    s.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
        if (isHardMode) { startTimer(s); }
      } else if (endOverlay && endOverlay.visible) {
        restart(s);
      }
    });
    setupDomControls(s);
  }

  function announce(msg) {
    var el = document.getElementById("a11y-status");
    if (el) { el.textContent = msg; }
  }

  function updateDomButtons() {
    var easy = document.getElementById("btn-easy");
    var hard = document.getElementById("btn-hard");
    if (!easy || !hard) { return; }
    easy.setAttribute("aria-pressed", isHardMode ? "false" : "true");
    hard.setAttribute("aria-pressed", isHardMode ? "true" : "false");
  }

  function setupDomControls(scene) {
    var easy = document.getElementById("btn-easy");
    var hard = document.getElementById("btn-hard");
    if (!easy || !hard) { return; }
    function setDifficulty(hardMode) {
      isHardMode = hardMode;
      updateHudDifficulty(scene);
      updateStartDifficultyUI();
      updateDomButtons();
      announce("Difficulty set to " + (isHardMode ? "Hard Challenge, 8 pairs with timer" : "Easy, 6 pairs"));
      if (started) { restart(scene); }
    }
    easy.addEventListener("click", function () { setDifficulty(false); });
    hard.addEventListener("click", function () { setDifficulty(true); });
    easy.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty(false); }
    });
    hard.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty(true); }
    });
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    hudTimer = scene.add.text(W - 24, 90, "\u23F1 Time: 60s", textStyle(22, "#c0392b")).setOrigin(1, 0.5).setVisible(false);
    hudDifficulty = scene.add.text(W / 2, 168, "Mode: Easy \u2022 6 pairs", textStyle(18, "#5b3a29")).setOrigin(0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hardToggleBtn = scene.add.container(W - 110, 170);
    toggleBg = scene.add.graphics();
    toggleBg.fillStyle(0x8e8e8e, 1); toggleBg.fillRoundedRect(-86, -22, 172, 44, 22);
    toggleLabel = scene.add.text(0, 0, "Hard: OFF", textStyle(18, "#ffffff")).setOrigin(0.5);
    hardToggleBtn.add([toggleBg, toggleLabel]);
    toggleBg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    toggleBg.on("pointerdown", function () {
      isHardMode = !isHardMode;
      updateHudDifficulty(scene);
      updateStartDifficultyUI();
      updateDomButtons();
      restart(scene);
      announce("Hard Challenge " + (isHardMode ? "enabled" : "disabled"));
    });
    toggleBg.on("pointerover", function () { hardToggleBtn.setScale(1.05); });
    toggleBg.on("pointerout", function () { hardToggleBtn.setScale(1); });
    scene.add.text(W / 2, 148, "Find the animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function updateHudDifficulty(scene) {
    var total = getTotalPairs();
    hudScore.setText("Pairs: " + matches + " / " + total);
    hudDifficulty.setText(isHardMode ? "Mode: Hard Challenge \u26A1 \u2022 8 pairs \u2022 60s" : "Mode: Easy \u2022 6 pairs");
    if (isHardMode) {
      toggleBg.clear(); toggleBg.fillStyle(0xe74c3c, 1); toggleBg.fillRoundedRect(-86, -22, 172, 44, 22);
      toggleLabel.setText("Hard: ON \u26A1");
      hudTimer.setVisible(started);
      if (started) { hudTimer.setText("\u23F1 Time: " + timeLeft + "s"); }
    } else {
      toggleBg.clear(); toggleBg.fillStyle(0x8e8e8e, 1); toggleBg.fillRoundedRect(-86, -22, 172, 44, 22);
      toggleLabel.setText("Hard: OFF");
      hudTimer.setVisible(false);
    }
  }

  function shuffledDeck() {
    var deck = [];
    var pairCount = getTotalPairs();
    for (var i = 0; i < pairCount; i++) {
      var a = ANIMALS[i];
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    }
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (isHardMode) {
      cols = 4; rows = 4;
      cw = 165; ch = 115; gx = 70; gy = 185; padX = 18; padY = 12;
    } else {
      cols = 4; rows = 3;
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xffb5a7, 0xb5ead7];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    announce("Moves " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        var total = getTotalPairs();
        hudScore.setText("Pairs: " + matches + " / " + total);
        hudMsg.setText(matches === total ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === total) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      var delay = isHardMode ? 500 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Flip the cards and find\nall animal pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var diffLabel = scene.add.text(0, 40, "Choose Difficulty:", textStyle(20, "#5b3a29")).setOrigin(0.5);
    easyBtnBg = scene.add.graphics();
    easyBtnBg.fillStyle(0x5da85f, 1); easyBtnBg.fillRoundedRect(-220, 60, 180, 56, 28);
    easyBtnLabel = scene.add.text(-130, 88, "Easy \u2022 6 pairs", textStyle(20, "#ffffff")).setOrigin(0.5);
    hardBtnBg = scene.add.graphics();
    hardBtnBg.fillStyle(0xffffff, 1); hardBtnBg.fillRoundedRect(40, 60, 180, 56, 28);
    hardBtnBg.lineStyle(3, 0xe74c3c, 1); hardBtnBg.strokeRoundedRect(40, 60, 180, 56, 28);
    hardBtnLabel = scene.add.text(130, 88, "Hard \u26A1 8 pairs", textStyle(18, "#c0392b")).setOrigin(0.5);
    var hardDesc = scene.add.text(0, 130, "Hard Challenge: 8 pairs + 60s timer + faster flip!", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 150, 260, 70, 35);
    var btnTx = scene.add.text(0, 185, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, diffLabel, easyBtnBg, easyBtnLabel, hardBtnBg, hardBtnLabel, hardDesc, btnBg, btnTx]);
    easyBtnBg.setInteractive(new Phaser.Geom.Rectangle(-220, 60, 180, 56), Phaser.Geom.Rectangle.Contains);
    hardBtnBg.setInteractive(new Phaser.Geom.Rectangle(40, 60, 180, 56), Phaser.Geom.Rectangle.Contains);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 150, 260, 70), Phaser.Geom.Rectangle.Contains);
    easyBtnBg.on("pointerdown", function () {
      isHardMode = false;
      updateStartDifficultyUI();
      updateHudDifficulty(scene);
      updateDomButtons();
    });
    hardBtnBg.on("pointerdown", function () {
      isHardMode = true;
      updateStartDifficultyUI();
      updateHudDifficulty(scene);
      updateDomButtons();
    });
    easyBtnBg.on("pointerover", function () { easyBtnLabel.setScale(1.05); });
    easyBtnBg.on("pointerout", function () { easyBtnLabel.setScale(1); });
    hardBtnBg.on("pointerover", function () { hardBtnLabel.setScale(1.05); });
    hardBtnBg.on("pointerout", function () { hardBtnLabel.setScale(1); });
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      updateHudDifficulty(scene);
      if (isHardMode) { startTimer(scene); }
      announce("Game started in " + (isHardMode ? "Hard Challenge mode" : "Easy mode"));
    });
    btnBg.on("pointerover", function () { btnTx.setScale(1.06); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
    updateStartDifficultyUI();
  }

  function updateStartDifficultyUI() {
    if (!easyBtnBg || !hardBtnBg) { return; }
    if (isHardMode) {
      easyBtnBg.clear(); easyBtnBg.fillStyle(0xffffff, 1); easyBtnBg.fillRoundedRect(-220, 60, 180, 56, 28);
      easyBtnBg.lineStyle(3, 0x5da85f, 1); easyBtnBg.strokeRoundedRect(-220, 60, 180, 56, 28);
      easyBtnLabel.setColor("#5b3a29");
      hardBtnBg.clear(); hardBtnBg.fillStyle(0xe74c3c, 1); hardBtnBg.fillRoundedRect(40, 60, 180, 56, 28);
      hardBtnLabel.setColor("#ffffff");
    } else {
      easyBtnBg.clear(); easyBtnBg.fillStyle(0x5da85f, 1); easyBtnBg.fillRoundedRect(-220, 60, 180, 56, 28);
      easyBtnLabel.setColor("#ffffff");
      hardBtnBg.clear(); hardBtnBg.fillStyle(0xffffff, 1); hardBtnBg.fillRoundedRect(40, 60, 180, 56, 28);
      hardBtnBg.lineStyle(3, 0xe74c3c, 1); hardBtnBg.strokeRoundedRect(40, 60, 180, 56, 28);
      hardBtnLabel.setColor("#c0392b");
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnBg.on("pointerover", function () { btnTx.setScale(1.05); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
  }

  function startTimer(scene) {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
    timeLeft = 60;
    hudTimer.setVisible(true);
    hudTimer.setText("\u23F1 Time: " + timeLeft + "s");
    hudTimer.setColor("#c0392b");
    timerEvent = scene.time.addEvent({
      delay: 1000,
      loop: true,
      callback: function () {
        timeLeft--;
        hudTimer.setText("\u23F1 Time: " + timeLeft + "s");
        if (timeLeft <= 10) { hudTimer.setColor("#e74c3c"); }
        announce("Time remaining " + timeLeft + " seconds");
        if (timeLeft <= 0) {
          if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
          handleTimeOut(scene);
        }
      }
    });
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
    if (hudTimer) { hudTimer.setVisible(false); }
  }

  function handleTimeOut(scene) {
    lockBoard = true;
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("Hard Mode Challenge Failed!\nPairs found: " + matches + " / 8\nMoves: " + moves);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again!");
    announce("Time's up! Challenge failed. Pairs found " + matches + " out of 8");
  }

  function showWin(scene) {
    stopTimer();
    var total = getTotalPairs();
    var stars;
    if (isHardMode) {
      if (moves <= 14 && timeLeft >= 20) { stars = 3; }
      else if (moves <= 20 && timeLeft >= 10) { stars = 2; }
      else { stars = 1; }
      endTitle.setText("\u{1F3C6} Hard Mode Win! \u{1F3C6}");
      endDetail.setText("You found all " + total + " pairs!\nMoves: " + moves + "  Time left: " + timeLeft + "s  " + "\u2B50".repeat(stars));
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("You found all " + total + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Found all " + total + " pairs in " + moves + " moves");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0");
    var total = getTotalPairs();
    hudScore.setText("Pairs: 0 / " + total);
    hudMsg.setText("Tap a card!");
    updateHudDifficulty(scene);
    updateDomButtons();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
    if (isHardMode) { startTimer(scene); } else { stopTimer(); }
    announce("Game restarted in " + (isHardMode ? "Hard Challenge mode" : "Easy mode"));
  }

  function update() {}
})();
</script>
</body>
</html>
