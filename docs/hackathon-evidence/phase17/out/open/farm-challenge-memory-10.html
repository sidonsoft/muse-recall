<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F4FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  .sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="game" role="application" aria-label="Ocean Memory Match game board. Use arrow keys to navigate cards and Enter to flip. Press E for Calm Waters and H for Deep Dive difficulty."></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F41A}", name: "Shell" }
  ];
  var W = 900, H = 700;
  var difficulty = "easy";
  function totalPairs() { return difficulty === "hard" ? 8 : 6; }

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudSubtitle, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var diffToggleEasyBg, diffToggleHardBg, diffToggleEasyLabel, diffToggleHardLabel;
  var startEasyBg, startHardBg, startEasyLabel, startHardLabel, startEasyCheck, startHardCheck;
  var focusRing = null, focusedIndex = 0, usingKeyboard = false;

  function announce(msg) {
    var el = document.getElementById("sr-live");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    createFocusRing(s, 185, 140);
    updateDifficultyUI();
    announce("Ocean Memory Match loaded. Choose Calm Waters with 6 pairs or Deep Dive with 8 pairs, then press Start.");
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xBEE9F7, 1); g.fillRect(0, 135, W, 380);
    g.fillStyle(0xA8D8EA, 1); g.fillRect(0, 300, W, 210);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE8A3, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xD4EAF7, 1); g.fillRect(0, 500, W, 200);
    g.fillStyle(0xE6F4FF, 1); g.fillRect(0, 500, W, 10);
    g.fillStyle(0xffffff, 0.9); g.fillRect(0, 510, W, 2);
    for (var x = 70; x <= 860; x += 110) {
      g.fillStyle(0x2A7CB6, 1);
      g.fillEllipse(x, 560, 18, 90);
      g.fillStyle(0x4EA8DE, 1);
      g.fillEllipse(x + 22, 570, 14, 70);
      g.fillStyle(0x7CC8E8, 1);
      g.fillEllipse(x - 18, 575, 10, 55);
    }
    var coralCols = [0x4EA8DE, 0x7CC8E8, 0x2A7CB6, 0xA8D8EA];
    for (var i = 0; i < 9; i++) {
      var fx = 35 + i * 98, fy = 625 + (i % 2) * 22;
      g.fillStyle(0x5DA8C5, 1); g.fillRect(fx - 2, fy - 28, 4, 28);
      g.fillStyle(coralCols[i % 4], 1);
      g.fillCircle(fx, fy - 32, 11);
      g.fillStyle(0xE0F2FE, 1); g.fillCircle(fx, fy - 32, 4);
      g.fillStyle(0xffffff, 0.5); g.fillCircle(fx - 3, fy - 35, 2);
    }
    g.fillStyle(0xffffff, 0.55);
    for (var b = 0; b < 14; b++) {
      var bx = 90 + (b * 67) % 760, by = 180 + (b % 3) * 70 + (b % 2) * 25;
      var br = 5 + (b % 4) * 2;
      g.fillCircle(bx, by, br);
      g.fillStyle(0xffffff, 0.25); g.fillCircle(bx - 2, by - 2, br * 0.5);
      g.fillStyle(0xffffff, 0.55);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22, "#102A43"));
    hudScore = scene.add.text(24, 88, "Pairs: 0 / 6", textStyle(22, "#102A43"));
    hudMode = scene.add.text(24, 116, "Mode: Calm Waters", textStyle(16, "#2A4A6B"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);

    var diffToggle = scene.add.container(W / 2, 116);
    var diffBg = scene.add.graphics();
    diffBg.fillStyle(0xffffff, 1); diffBg.fillRoundedRect(-92, -22, 184, 44, 22);
    diffBg.lineStyle(3, 0x4EA8DE, 1); diffBg.strokeRoundedRect(-92, -22, 184, 44, 22);
    diffToggleEasyBg = scene.add.graphics();
    diffToggleHardBg = scene.add.graphics();
    diffToggle.add([diffBg, diffToggleEasyBg, diffToggleHardBg]);

    diffToggleEasyLabel = scene.add.text(-46, 0, "Calm", textStyle(16, "#102A43")).setOrigin(0.5);
    diffToggleHardLabel = scene.add.text(46, 0, "Deep", textStyle(16, "#102A43")).setOrigin(0.5);
    var easyIcon = scene.add.text(-78, 0, "\u{1F30A}", { fontSize: "16px" }).setOrigin(0.5);
    var hardIcon = scene.add.text(78, 0, "\u{1F419}", { fontSize: "16px" }).setOrigin(0.5);
    diffToggle.add([diffToggleEasyLabel, diffToggleHardLabel, easyIcon, hardIcon]);

    diffToggleEasyBg.setInteractive(new Phaser.Geom.Rectangle(-92, -22, 92, 44), Phaser.Geom.Rectangle.Contains);
    diffToggleHardBg.setInteractive(new Phaser.Geom.Rectangle(0, -22, 92, 44), Phaser.Geom.Rectangle.Contains);
    diffToggleEasyBg.on("pointerdown", function () { setDifficulty(scene, "easy"); });
    diffToggleHardBg.on("pointerdown", function () { setDifficulty(scene, "hard"); });
    diffToggleEasyBg.on("pointerover", function () { diffToggle.setScale(1.03); });
    diffToggleEasyBg.on("pointerout", function () { diffToggle.setScale(1); });
    diffToggleHardBg.on("pointerover", function () { diffToggle.setScale(1.03); });
    diffToggleHardBg.on("pointerout", function () { diffToggle.setScale(1); });
    diffToggleEasyBg.input.cursor = "pointer";
    diffToggleHardBg.input.cursor = "pointer";

    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    bg.input.cursor = "pointer";

    hudSubtitle = scene.add.text(W / 2, 168, "Find the 6 ocean friends!", textStyle(20, "#2A4A6B")).setOrigin(0.5);
    var hint = scene.add.text(W / 2, 188, "Calm Waters: 6 pairs  \u2022  Deep Dive: 8 pairs for a bigger challenge", textStyle(14, "#4A6B8A")).setOrigin(0.5);
  }

  function setDifficulty(scene, newDiff) {
    if (difficulty === newDiff) { return; }
    difficulty = newDiff;
    focusedIndex = 0;
    updateDifficultyUI();
    if (started) {
      moves = 0; matches = 0; firstPick = null; lockBoard = false;
      hudMoves.setText("Moves: 0");
      hudScore.setText("Pairs: 0 / " + totalPairs());
      hudMsg.setText(difficulty === "hard" ? "Deep Dive! Tap a card!" : "Calm Waters! Tap a card!");
      announce(difficulty === "hard" ? "Switched to Deep Dive hard mode with 8 pairs." : "Switched to Calm Waters easy mode with 6 pairs.");
      cards.forEach(function (c) { c.view.destroy(); });
      buildBoard(scene);
      updateFocusRing();
    } else {
      announce(difficulty === "hard" ? "Deep Dive selected: 8 pairs, 16 cards. Press Start to begin." : "Calm Waters selected: 6 pairs, 12 cards. Press Start to begin.");
      updateFocusRing();
    }
  }

  function updateDifficultyUI() {
    var isHard = difficulty === "hard";
    if (diffToggleEasyBg) {
      diffToggleEasyBg.clear();
      diffToggleEasyBg.fillStyle(isHard ? 0xffffff : 0x4EA8DE, 1);
      diffToggleEasyBg.fillRoundedRect(-92, -22, 92, 44, { tl: 22, tr: 0, bl: 22, br: 0 });
      diffToggleHardBg.clear();
      diffToggleHardBg.fillStyle(isHard ? 0x4EA8DE : 0xffffff, 1);
      diffToggleHardBg.fillRoundedRect(0, -22, 92, 44, { tl: 0, tr: 22, bl: 0, br: 22 });
      diffToggleEasyLabel.setColor(isHard ? "#102A43" : "#ffffff");
      diffToggleHardLabel.setColor(isHard ? "#ffffff" : "#102A43");
    }
    if (startEasyBg) {
      startEasyBg.clear();
      startEasyBg.fillStyle(isHard ? 0xffffff : 0x4EA8DE, 1);
      startEasyBg.fillRoundedRect(-260, -10, 250, 64, 18);
      startEasyBg.lineStyle(3, 0x4EA8DE, 1); startEasyBg.strokeRoundedRect(-260, -10, 250, 64, 18);
      startHardBg.clear();
      startHardBg.fillStyle(isHard ? 0x4EA8DE : 0xffffff, 1);
      startHardBg.fillRoundedRect(10, -10, 250, 64, 18);
      startHardBg.lineStyle(3, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(10, -10, 250, 64, 18);
      startEasyLabel.setColor(isHard ? "#102A43" : "#ffffff");
      startHardLabel.setColor(isHard ? "#ffffff" : "#102A43");
      startEasyCheck.setVisible(!isHard);
      startHardCheck.setVisible(isHard);
    }
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs()); }
    if (hudMode) { hudMode.setText(isHard ? "Mode: Deep Dive \u2022 8 pairs" : "Mode: Calm Waters \u2022 6 pairs"); }
    if (hudSubtitle) { hudSubtitle.setText(isHard ? "Find the 8 ocean friends!" : "Find the 6 ocean friends!"); }
  }

  function shuffledDeck() {
    var pool = difficulty === "hard" ? OCEAN_ANIMALS : OCEAN_ANIMALS.slice(0, 6);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var isHard = difficulty === "hard";
    var cols = 4, rows = isHard ? 4 : 3;
    var cw = isHard ? 168 : 185, ch = isHard ? 112 : 140;
    var gx = isHard ? 68 : 62, gy = isHard ? 205 : 195;
    var padX = isHard ? 18 : 22, padY = isHard ? 14 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      var cardObj = makeCard(scene, cx, cy, cw, ch, card, idx);
      cards.push(cardObj);
    });
    createFocusRing(scene, cw, ch);
    if (started && cards.length > 0) {
      focusedIndex = Math.min(focusedIndex, cards.length - 1);
      updateFocusRing();
    }
  }

  function createFocusRing(scene, w, h) {
    if (focusRing) { focusRing.destroy(); }
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(-w / 2 - 6, -h / 2 - 6, w + 12, h + 12, 22);
  }

  function updateFocusRing() {
    if (!focusRing || !cards[focusedIndex]) { return; }
    var c = cards[focusedIndex].view;
    focusRing.setPosition(c.x, c.y);
    focusRing.setVisible(usingKeyboard && started);
    focusRing.setDepth(5);
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 11);
    var wave = scene.add.text(0, -4, "\u{1F30A}", { fontSize: isHardCard(w) ? "42px" : "52px" }).setOrigin(0.5);
    function isHardCard(cw) { return cw < 180; }
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xBEE9F7, 0xA8D8EA, 0xD4EAF7, 0xC7E8FF, 0xE6F6FF, 0xB8E0E6, 0xD0E8FF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    var emoSize = w < 180 ? "48px" : "58px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w < 180 ? 18 : 20, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, wave]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx };
    cont.on("pointerdown", function () {
      usingKeyboard = false;
      if (focusRing) { focusRing.setVisible(false); }
      focusedIndex = idx;
      onCard(scene, card);
    });
    cont.on("pointerover", function () { cont.setScale(1.02); });
    cont.on("pointerout", function () { cont.setScale(1); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    announce("Flipped " + card.data.name);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    announce("Move " + moves + ". Checking for a pair.");
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.06, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs());
        if (matches === totalPairs()) {
          hudMsg.setText("You did it!");
          announce("Yay! You found a pair! " + matches + " of " + totalPairs() + " pairs found.");
          lockBoard = false;
          showWin(scene);
        } else {
          hudMsg.setText("Yay! A pair! \u{1F389}");
          announce("Yay! A pair! " + card.data.name + " matched. " + matches + " of " + totalPairs() + " pairs found.");
          lockBoard = false;
          updateFocusRing();
        }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("Not a match. Try again.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 420, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 28);
    var title = scene.add.text(0, -150, "\u{1F30A} Ocean Match \u{1F419}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -105, "Flip the cards and find the ocean friends!", Object.assign(textStyle(20, "#2A4A6B"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -68, "\u{1F419} \u{1F433} \u{1F42C} \u{1F422} \u{1F980} \u{1F420}", { fontSize: "36px" }).setOrigin(0.5);

    var diffLabel = scene.add.text(0, -28, "Choose your challenge:", textStyle(18, "#102A43")).setOrigin(0.5);
    startEasyBg = scene.add.graphics();
    startHardBg = scene.add.graphics();
    var easyTitle = scene.add.text(-135, 8, "Calm Waters", textStyle(18, "#102A43")).setOrigin(0.5);
    var easySub = scene.add.text(-135, 28, "6 pairs \u2022 Relaxed", textStyle(13, "#102A43")).setOrigin(0.5);
    var easyEmoji = scene.add.text(-210, 18, "\u{1F30A}", { fontSize: "28px" }).setOrigin(0.5);
    var hardTitle = scene.add.text(135, 8, "Deep Dive", textStyle(18, "#102A43")).setOrigin(0.5);
    var hardSub = scene.add.text(135, 28, "8 pairs \u2022 Challenge", textStyle(13, "#102A43")).setOrigin(0.5);
    var hardEmoji = scene.add.text(85, 18, "\u{1F419}", { fontSize: "28px" }).setOrigin(0.5);
    startEasyLabel = scene.add.container(0, 0, [easyTitle, easySub]);
    startHardLabel = scene.add.container(0, 0, [hardTitle, hardSub]);
    startEasyCheck = scene.add.text(-35, -2, "\u2714", textStyle(18, "#ffffff")).setOrigin(0.5);
    startHardCheck = scene.add.text(235, -2, "\u2714", textStyle(18, "#ffffff")).setOrigin(0.5);

    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 78, 260, 64, 32);
    var btnTx = scene.add.text(0, 110, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    var kbHint = scene.add.text(0, 158, "Tip: Use arrow keys + Enter to play. Press E / H to switch difficulty.", textStyle(12, "#4A6B8A")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, diffLabel, startEasyBg, startHardBg, easyEmoji, hardEmoji, startEasyLabel, startHardLabel, startEasyCheck, startHardCheck, btnBg, btnTx, kbHint]);

    startEasyBg.setInteractive(new Phaser.Geom.Rectangle(-260, -10, 250, 64), Phaser.Geom.Rectangle.Contains);
    startHardBg.setInteractive(new Phaser.Geom.Rectangle(10, -10, 250, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 78, 260, 64), Phaser.Geom.Rectangle.Contains);
    startEasyBg.on("pointerdown", function () { setDifficulty(scene, "easy"); });
    startHardBg.on("pointerdown", function () { setDifficulty(scene, "hard"); });
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText(difficulty === "hard" ? "Deep Dive! Tap a card!" : "Tap a card!");
      announce(difficulty === "hard" ? "Game started in Deep Dive hard mode with 8 pairs. Good luck!" : "Game started in Calm Waters easy mode with 6 pairs. Good luck!");
      focusedIndex = 0; usingKeyboard = false;
      if (focusRing) { focusRing.setVisible(false); }
    });
    startEasyBg.input.cursor = "pointer";
    startHardBg.input.cursor = "pointer";
    btnBg.input.cursor = "pointer";
    btnBg.on("pointerover", function () { btnBg.setScale(1.02); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 28);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(40, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 64, 32);
    var btnTx = scene.add.text(0, 82, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnBg.input.cursor = "pointer";
    btnBg.on("pointerover", function () { btnBg.setScale(1.03); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); });
  }

  function showWin(scene) {
    var tp = totalPairs();
    var threshold = tp === 8 ? 14 : 10;
    var threshold2 = tp === 8 ? 20 : 16;
    var stars = moves <= threshold ? 3 : (moves <= threshold2 ? 2 : 1);
    endDetail.setText("You found all " + tp + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nMode: " + (difficulty === "hard" ? "Deep Dive" : "Calm Waters"));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! You found all " + tp + " pairs in " + moves + " moves. " + stars + " stars!");
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs()); hudMsg.setText(difficulty === "hard" ? "Deep Dive! Tap a card!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    focusedIndex = 0; usingKeyboard = false;
    if (focusRing) { focusRing.setVisible(false); }
    announce("Game restarted in " + (difficulty === "hard" ? "Deep Dive" : "Calm Waters") + " mode.");
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (event) {
      var key = event.key.toLowerCase();
      if (key === "e") { setDifficulty(scene, "easy"); return; }
      if (key === "h") { setDifficulty(scene, "hard"); return; }
      if (key === "r") { restart(scene); return; }
      if (!started) {
        if (key === "enter" || key === " ") {
          started = true; lockBoard = false;
          if (startOverlay) { startOverlay.setVisible(false); }
          hudMsg.setText(difficulty === "hard" ? "Deep Dive! Tap a card!" : "Tap a card!");
          announce("Game started.");
        }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (key === "enter" || key === " ") { restart(scene); }
        return;
      }
      var cols = 4;
      if (key === "arrowleft") { usingKeyboard = true; focusedIndex = (focusedIndex - 1 + cards.length) % cards.length; updateFocusRing(); event.preventDefault(); }
      else if (key === "arrowright") { usingKeyboard = true; focusedIndex = (focusedIndex + 1) % cards.length; updateFocusRing(); event.preventDefault(); }
      else if (key === "arrowup") { usingKeyboard = true; focusedIndex = (focusedIndex - cols + cards.length) % cards.length; updateFocusRing(); event.preventDefault(); }
      else if (key === "arrowdown") { usingKeyboard = true; focusedIndex = (focusedIndex + cols) % cards.length; updateFocusRing(); event.preventDefault(); }
      else if (key === "enter" || key === " " || key === "spacebar") {
        if (cards[focusedIndex]) { onCard(scene, cards[focusedIndex]); }
        event.preventDefault();
      }
    });
    scene.input.on("pointerdown", function () {
      if (usingKeyboard && focusRing) { focusRing.setVisible(false); }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
