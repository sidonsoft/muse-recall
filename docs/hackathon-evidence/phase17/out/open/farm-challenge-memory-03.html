<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;position:relative}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #a11y-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
  .a11y-btn{font-family:inherit;font-size:14px;padding:8px 14px;border-radius:20px;border:2px solid #4EA8DE;background:#fff;color:#102A43;cursor:pointer}
  .a11y-btn[aria-pressed="true"]{background:#4EA8DE;color:#fff}
  .a11y-btn:focus{outline:3px solid #102A43;outline-offset:2px}
  #live-region{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="a11y-bar" role="group" aria-label="Game difficulty">
  <button type="button" id="btn-easy" class="a11y-btn" aria-pressed="true" aria-label="Easy mode, 6 pairs">Easy (6 pairs)</button>
  <button type="button" id="btn-hard" class="a11y-btn" aria-pressed="false" aria-label="Challenge mode, 8 pairs, harder">Challenge (8 pairs)</button>
</div>
<div id="live-region" aria-live="polite" aria-atomic="true"></div>
<div id="game" role="main" aria-label="Ocean memory match game"></div>
<script>
(function () {
  var ANIMALS_ALL = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F430}", name: "Rabbit" }
  ];
  var W = 900, H = 700;
  var difficulty = "easy";
  var sceneRef = null;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;

  var btnEasy = document.getElementById("btn-easy");
  var btnHard = document.getElementById("btn-hard");
  var liveRegion = document.getElementById("live-region");

  function syncA11yButtons() {
    if (!btnEasy || !btnHard) { return; }
    btnEasy.setAttribute("aria-pressed", difficulty === "easy" ? "true" : "false");
    btnHard.setAttribute("aria-pressed", difficulty === "hard" ? "true" : "false");
  }
  function announce(msg) {
    if (liveRegion) { liveRegion.textContent = msg; }
  }
  function getBoardConfig(mode) {
    if (mode === "hard") {
      return { cols: 4, rows: 4, cw: 165, ch: 118, gx: 72, gy: 188, padX: 20, padY: 14 };
    } else {
      return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
    }
  }
  function setDifficulty(mode) {
    if (mode !== "easy" && mode !== "hard") { return; }
    difficulty = mode;
    syncA11yButtons();
    var total = mode === "hard" ? 8 : 6;
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + total); }
    if (hudMode) { hudMode.setText(mode === "hard" ? "Mode: Challenge" : "Mode: Easy"); }
    if (sceneRef && sceneRef._modeLabel) {
      sceneRef._modeLabel.setText(mode === "hard" ? "Easy" : "Challenge");
    }
    if (!started) {
      if (hudMsg) { hudMsg.setText(mode === "hard" ? "Challenge: 8 pairs!" : "Tap a card!"); }
      announce(mode === "hard" ? "Challenge mode selected, 8 pairs" : "Easy mode selected, 6 pairs");
      if (sceneRef && cards.length > 0) {
        cards.forEach(function (c) { c.view.destroy(); });
        buildBoard(sceneRef);
        lockBoard = true;
      }
      return;
    }
    if (started && endOverlay && endOverlay.visible) {
      announce(mode === "hard" ? "Challenge mode ready for next game" : "Easy mode ready for next game");
      return;
    }
    if (started) {
      moves = 0; matches = 0; firstPick = null; lockBoard = false;
      if (hudMoves) { hudMoves.setText("Moves: 0"); }
      if (hudScore) { hudScore.setText("Pairs: 0 / " + total); }
      if (hudMsg) { hudMsg.setText(mode === "hard" ? "Challenge: find 8 pairs!" : "Tap a card!"); }
      if (sceneRef) {
        cards.forEach(function (c) { c.view.destroy(); });
        buildBoard(sceneRef);
      }
      announce(mode === "hard" ? "Switched to Challenge mode, 8 pairs" : "Switched to Easy mode, 6 pairs");
    }
  }

  if (btnEasy) {
    btnEasy.addEventListener("click", function () { setDifficulty("easy"); });
    btnEasy.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("easy"); }
    });
  }
  if (btnHard) {
    btnHard.addEventListener("click", function () { setDifficulty("hard"); });
    btnHard.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("hard"); }
    });
  }

  function create() {
    var s = this;
    sceneRef = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    s.input.keyboard.on("keydown", function (e) {
      if (e.key === "1") { setDifficulty("easy"); }
      if (e.key === "2") { setDifficulty("hard"); }
      if (e.key.toLowerCase() === "m") { setDifficulty(difficulty === "easy" ? "hard" : "easy"); }
      if (e.key.toLowerCase() === "r") { restart(s); }
      if (e.key === "Enter" || e.key === " ") {
        if (startOverlay && startOverlay.visible) {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText(difficulty === "hard" ? "Challenge: find 8 pairs!" : "Tap a card!");
        } else if (endOverlay && endOverlay.visible) {
          restart(s);
        }
      }
    });
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, 180);
    g.fillStyle(0xFEF9E7, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xF9E79F, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xA9CCE3, 1); g.fillRect(0, 470, W, 28);
    g.lineStyle(4, 0xEBF5FB, 0.9);
    g.lineBetween(300, 505, 380, 505); g.lineBetween(400, 515, 480, 515); g.lineBetween(500, 505, 580, 505); g.lineBetween(600, 515, 680, 515); g.lineBetween(700, 505, 780, 505); g.lineBetween(800, 515, 880, 515);
    g.lineStyle(3, 0xD6EAF8, 0.7);
    g.lineBetween(320, 530, 400, 530); g.lineBetween(420, 540, 500, 540); g.lineBetween(520, 530, 600, 530); g.lineBetween(620, 540, 700, 540); g.lineBetween(720, 530, 800, 530);
    g.fillStyle(0xFEF9E7, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x1B4F72, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xEBF5FB, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xEBF5FB, 1);
    g.lineBetween(80, 330, 230, 330);
    g.fillStyle(0x102A43, 1); g.fillCircle(155, 285, 6);
    var cols = [0xAED6F1, 0x85C1E9, 0xD6EAF8, 0xFCF3CF];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x4EA8DE, 1); g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(cols[i % 4], 1); g.fillCircle(fx, fy - 8, 6);
      g.fillStyle(0xffffff, 0.9); g.fillCircle(fx - 2, fy - 10, 2);
    }
    g.fillStyle(0xffffff, 0.55);
    for (var b = 0; b < 10; b++) {
      var bx = 340 + b * 55, by = 485 + (b % 3) * 12;
      g.fillCircle(bx, by, 5); g.fillCircle(bx + 12, by - 8, 3);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22, "#102A43"));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22, "#102A43"));
    hudMode = scene.add.text(24, 112, "Mode: Easy", textStyle(16, "#1B4F72")).setOrigin(0, 0.5);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#1B4F72")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var modeBtn = scene.add.container(W - 110, 168);
    var modeBg = scene.add.graphics();
    modeBg.fillStyle(0x4EA8DE, 1); modeBg.fillRoundedRect(-86, -18, 172, 36, 18);
    var modeLabel = scene.add.text(0, 0, "Challenge", textStyle(16, "#ffffff")).setOrigin(0.5);
    modeBtn.add([modeBg, modeLabel]);
    modeBg.setInteractive(new Phaser.Geom.Rectangle(-86, -18, 172, 36), Phaser.Geom.Rectangle.Contains);
    modeBg.on("pointerdown", function () {
      var newMode = difficulty === "easy" ? "hard" : "easy";
      setDifficulty(newMode);
    });
    modeBg.on("pointerover", function () { modeBtn.setScale(1.05); });
    modeBg.on("pointerout", function () { modeBtn.setScale(1); });
    scene._modeLabel = modeLabel;
    scene.add.text(W / 2, 188, "Find the pairs! Easy 6 or Challenge 8", textStyle(18, "#1B4F72")).setOrigin(0.5);
  }

  function shuffledDeck(mode) {
    var pool = mode === "hard" ? ANIMALS_ALL : ANIMALS_ALL.slice(0, 6);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck(difficulty);
    var cfg = getBoardConfig(difficulty);
    var cols = cfg.cols, cw = cfg.cw, ch = cfg.ch, gx = cfg.gx, gy = cfg.gy, padX = cfg.padX, padY = cfg.padY;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 11);
    var paw = scene.add.text(0, -6, "\u{1F41A}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xD6EAF8, 0xAED6F1, 0xA9CCE3, 0x85C1E9, 0xEBF5FB, 0xD4E6F1, 0xFCF3CF, 0xEAF2F8];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "56px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        var total = difficulty === "hard" ? 8 : 6;
        hudScore.setText("Pairs: " + matches + " / " + total);
        hudMsg.setText(matches === total ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === total) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -135, "\u{1F30A} Ocean Match \u{1F41A}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -85, "Flip the cards and find all the pairs!", Object.assign(textStyle(22, "#1B4F72"), { align: "center" })).setOrigin(0.5);
    var prompt = scene.add.text(0, -40, "Choose your challenge:", textStyle(20, "#102A43")).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}  \u2728  \u{1F410} \u{1F430}", { fontSize: "28px" }).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x4EA8DE, 1); easyBg.fillRoundedRect(-260, 50, 240, 62, 31);
    var easyTx = scene.add.text(-140, 81, "\u25B6 Easy (6)", textStyle(22, "#ffffff")).setOrigin(0.5);
    var easySub = scene.add.text(-140, 102, "4 x 3 board", textStyle(13, "#EAF6FB")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x102A43, 1); hardBg.fillRoundedRect(20, 50, 240, 62, 31);
    var hardTx = scene.add.text(140, 81, "\u2605 Challenge (8)", textStyle(22, "#ffffff")).setOrigin(0.5);
    var hardSub = scene.add.text(140, 102, "4 x 4 board", textStyle(13, "#D6EAF8")).setOrigin(0.5);
    var hint = scene.add.text(0, 150, "Tip: Press 1 for Easy, 2 for Challenge  •  No timers, just fun!", textStyle(14, "#1B4F72")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, prompt, row, easyBg, easyTx, easySub, hardBg, hardTx, hardSub, hint]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-260, 50, 240, 62), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 50, 240, 62), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () {
      setDifficulty("easy");
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
    });
    hardBg.on("pointerdown", function () {
      setDifficulty("hard");
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Challenge: find 8 pairs!");
    });
    easyBg.on("pointerover", function () { easyBg.setAlpha(0.9); });
    easyBg.on("pointerout", function () { easyBg.setAlpha(1); });
    hardBg.on("pointerover", function () { hardBg.setAlpha(0.9); });
    hardBg.on("pointerout", function () { hardBg.setAlpha(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var total = difficulty === "hard" ? 8 : 6;
    var stars;
    if (difficulty === "hard") {
      stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1);
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    var modeLabel = difficulty === "hard" ? "Challenge" : "Easy";
    endDetail.setText("You found all " + total + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nMode: " + modeLabel);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F41A}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    var total = difficulty === "hard" ? 8 : 6;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + total); hudMsg.setText(difficulty === "hard" ? "Challenge: find 8 pairs!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
