<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Arcade Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E0F2FE;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean Arcade Memory game"></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{2B50}", name: "Starfish" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F41A}", name: "Shell" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, level = 1;
  var hudMoves, hudPairs, hudScore, hudLevel, hudMsg, endOverlay, endTitle, endDetail, startOverlay, endBtnText;
  var focusRing, focusIndex = 0, bubbles = [];

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    createBubbles(s);
    var gameEl = document.getElementById("game");
    if (gameEl) { gameEl.setAttribute("aria-label", "Ocean Arcade Memory game. Use arrow keys to move focus and Enter to flip cards. Find all pairs to advance levels."); }
    s.input.keyboard.on("keydown", function (e) {
      if (!started) { return; }
      if (endOverlay.visible || startOverlay.visible) { return; }
      var cfg = getLevelConfig(level);
      var cols = cfg.cols;
      if (e.key === "ArrowRight") { focusIndex = (focusIndex + 1) % cards.length; updateFocusRing(s); }
      else if (e.key === "ArrowLeft") { focusIndex = (focusIndex - 1 + cards.length) % cards.length; updateFocusRing(s); }
      else if (e.key === "ArrowDown") { focusIndex = (focusIndex + cols) % cards.length; updateFocusRing(s); }
      else if (e.key === "ArrowUp") { focusIndex = (focusIndex - cols + cards.length) % cards.length; updateFocusRing(s); }
      else if (e.key === "Enter" || e.key === " ") {
        var c = cards[focusIndex];
        if (c) { onCard(s, c); }
      }
    });
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xCAF0F8, 1); g.fillRect(0, 120, W, 90);
    g.fillStyle(0x90E0EF, 1); g.fillRect(0, 210, W, 60);
    g.fillStyle(0x7EC8E3, 0.35); g.fillRect(0, 270, W, 30);
    g.fillStyle(0xF0E6D3, 1); g.fillRect(0, 620, W, 80);
    g.fillStyle(0xE8DCC6, 1); g.fillRect(0, 620, W, 14);
    g.fillStyle(0x4EA8DE, 1);
    g.fillCircle(120, 42, 30); g.fillCircle(160, 56, 40); g.fillCircle(210, 46, 35);
    g.fillCircle(500, 36, 28); g.fillCircle(540, 52, 38); g.fillCircle(590, 42, 32);
    g.fillStyle(0x7EC8E3, 1);
    g.fillCircle(140, 62, 18); g.fillCircle(520, 57, 16);
    g.fillStyle(0xFFF6B5, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 32);
    g.fillStyle(0x5DA85F, 1);
    g.fillEllipse(40, 600, 18, 60); g.fillEllipse(60, 610, 14, 50);
    g.fillEllipse(840, 595, 20, 70); g.fillEllipse(860, 605, 16, 55);
    g.fillStyle(0x4A9D5E, 1);
    g.fillEllipse(50, 585, 10, 40); g.fillEllipse(850, 580, 12, 45);
    g.fillStyle(0xFFFFFF, 0.55);
    for (var i = 0; i < 12; i++) {
      var bx = 30 + i * 75 + Math.random() * 18;
      var by = 300 + Math.random() * 200;
      var br = 4 + Math.random() * 6;
      g.fillCircle(bx, by, br);
      g.fillStyle(0xFFFFFF, 0.32); g.fillCircle(bx - 2, by - 2, br * 0.4);
      g.fillStyle(0xFFFFFF, 0.55);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Arcade Match", textStyle(30)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level: 1", textStyle(20));
    hudMoves = scene.add.text(135, 52, "Moves: 0", textStyle(20));
    hudPairs = scene.add.text(255, 52, "Pairs: 0 / 6", textStyle(20));
    hudScore = scene.add.text(24, 80, "Score: 0", textStyle(22, "#4EA8DE"));
    hudMsg = scene.add.text(W - 24, 68, "Tap a card!", textStyle(20, "#4EA8DE")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 158, "Find all pairs to unlock the next level!", textStyle(18, "#5A7A8A")).setOrigin(0.5);
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function getLevelConfig(lvl) {
    if (lvl === 1) { return { pairs: 6, cols: 4, rows: 3, cw: 185, ch: 140, padX: 22, padY: 16, gx: 62, gy: 195 }; }
    if (lvl === 2) { return { pairs: 8, cols: 4, rows: 4, cw: 185, ch: 110, padX: 18, padY: 12, gx: 62, gy: 185 }; }
    if (lvl === 3) { return { pairs: 10, cols: 5, rows: 4, cw: 150, ch: 110, padX: 16, padY: 12, gx: 45, gy: 185 }; }
    return { pairs: 6, cols: 4, rows: 3, cw: 185, ch: 140, padX: 22, padY: 16, gx: 62, gy: 195 };
  }

  function shuffledDeck(pairCount) {
    var count = pairCount || 6;
    var pool = OCEAN_ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var cfg = getLevelConfig(level);
    var deck = shuffledDeck(cfg.pairs);
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cfg.cols), c = idx % cfg.cols;
      var cx = cfg.gx + c * (cfg.cw + cfg.padX) + cfg.cw / 2;
      var cy = cfg.gy + r * (cfg.ch + cfg.padY) + cfg.ch / 2;
      cards.push(makeCard(scene, cx, cy, cfg.cw, cfg.ch, card));
    });
    hudPairs.setText("Pairs: 0 / " + cfg.pairs);
    hudLevel.setText("Level: " + level);
    focusIndex = 0;
    updateFocusRing(scene);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 12);
    back.lineStyle(3, 0x7EC8E3, 0.6);
    back.beginPath(); back.moveTo(-w / 2 + 20, -h / 4); back.lineTo(w / 2 - 20, -h / 4 + 8); back.strokePath();
    back.beginPath(); back.moveTo(-w / 2 + 20, h / 4); back.lineTo(w / 2 - 20, h / 4 + 6); back.strokePath();
    var icon = scene.add.text(0, -4, "\u{1F30A}", { fontSize: "48px" }).setOrigin(0.5).setAlpha(0.95);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xCAF0F8, 0xB9E4FF, 0xA8DADC, 0x90E0EF, 0xADE8F4, 0xD6EAF8, 0xE8F8FF, 0xC7E8FF, 0xD4F1F9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    fg.fillStyle(0xffffff, 0.7); fg.fillCircle(-w / 3, -h / 3, 8);
    var emo = scene.add.text(0, -16, data.emoji, { fontSize: "56px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 42, data.name, textStyle(20)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, icon]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, onComplete: done || function () {} });
    }});
  }

  function showScorePopup(scene, x, y, text) {
    var t = scene.add.text(x, y, text, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "26px", color: "#102A43", stroke: "#ffffff", strokeThickness: 4 }).setOrigin(0.5).setDepth(20);
    scene.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 800, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u{1F30A}"); updateFocusRing(scene); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        score += 100;
        hudScore.setText("Score: " + score);
        showScorePopup(scene, card.view.x, card.view.y - 60, "+100");
        for (var i = 0; i < 6; i++) {
          var b = scene.add.text(a.view.x + Phaser.Math.Between(-30, 30), a.view.y, "\u{1FAE7}", { fontSize: "18px" }).setDepth(15).setAlpha(0.8);
          scene.tweens.add({ targets: b, y: b.y - 40 - Phaser.Math.Between(10, 30), x: b.x + Phaser.Math.Between(-20, 20), alpha: 0, duration: 900, onComplete: (function (t) { return function () { t.destroy(); }; })(b) });
        }
        matches++;
        var cfg = getLevelConfig(level);
        hudPairs.setText("Pairs: " + matches + " / " + cfg.pairs);
        hudMsg.setText(matches === cfg.pairs ? "Level clear! \u{1F389}" : "Great match! \u{2728}");
        lockBoard = false;
        updateFocusRing(scene);
        if (matches === cfg.pairs) {
          if (level < 3) { showLevelComplete(scene); } else { showFinalWin(scene); }
        }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F30A}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(scene); });
      }, 750);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F30A} Ocean Arcade \u{1F433}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Dive in and find all the pairs!\n3 arcade levels — no rush, just fun!", Object.assign(textStyle(20), { align: "center", lineSpacing: 6 })).setOrigin(0.5);
    var row = scene.add.text(0, 20, "\u{1F433} \u{1F419} \u{1F42C} \u{1F980} \u{1F422} \u{1F420}", { fontSize: "42px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 65, "Match pairs to earn points!", textStyle(18, "#5A7A8A")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 90, 260, 70, 35);
    var btnTx = scene.add.text(0, 125, "\u25B6  Dive In!", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 90, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      updateFocusRing(scene);
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
        updateFocusRing(scene);
      }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} Level Complete! \u{1F389}", textStyle(36)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center", lineSpacing: 6 })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 60, 280, 70, 35);
    var btnTx = scene.add.text(0, 95, "Next Level \u25B6", textStyle(26, "#ffffff")).setOrigin(0.5);
    endBtnText = btnTx;
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { if (level < 3) { nextLevel(scene); } else { restart(scene); } });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (endOverlay.visible) {
        if (level < 3) { nextLevel(scene); } else { restart(scene); }
      }
    });
  }

  function showLevelComplete(scene) {
    var cfg = getLevelConfig(level);
    var stars = moves <= cfg.pairs + 4 ? 3 : (moves <= cfg.pairs + 8 ? 2 : 1);
    endTitle.setText("\u2728 Level " + level + " Complete! \u2728");
    endDetail.setText("Score: " + score + "  " + "\u2B50".repeat(stars) + "\nPairs found: " + matches + " / " + cfg.pairs + "\nMoves: " + moves + "\nReady for the next challenge?");
    if (endBtnText) { endBtnText.setText("Next Level \u25B6"); }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("Amazing! \u{1F389}");
    for (var i = 0; i < 24; i++) {
      var p = scene.add.text(Phaser.Math.Between(40, W - 40), H + 20, ["\u{1FAE7}", "\u2B50", "\u{1F389}", "\u{1F433}"][i % 4], { fontSize: "24px" }).setDepth(30).setAlpha(0.9);
      scene.tweens.add({ targets: p, y: -20, x: p.x + Phaser.Math.Between(-40, 40), duration: Phaser.Math.Between(1400, 2200), ease: "Sine.easeInOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showFinalWin(scene) {
    var stars = moves <= 12 ? 3 : (moves <= 18 ? 2 : 1);
    endTitle.setText("\u{1F3C6} Arcade Champion! \u{1F3C6}");
    endDetail.setText("You conquered all 3 levels!\nFinal Score: " + score + "  " + "\u2B50".repeat(stars) + "\nTotal Moves: " + moves + "\nPlay again for more fun?");
    if (endBtnText) { endBtnText.setText("\u21BB Play Again"); }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, H + 20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F433}", "\u{1FAE7}"][i % 5], { fontSize: "26px" }).setDepth(30).setAlpha(0.9);
      scene.tweens.add({ targets: p, y: -20, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1400, 2400), ease: "Sine.easeInOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    level = 1; moves = 0; matches = 0; score = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateFocusRing(scene);
  }

  function nextLevel(scene) {
    level++; moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0");
    var cfg = getLevelConfig(level);
    hudPairs.setText("Pairs: 0 / " + cfg.pairs);
    hudLevel.setText("Level: " + level);
    hudMsg.setText("Level " + level + " — Go!");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function updateFocusRing(scene) {
    if (!focusRing || !cards.length || !started) { if (focusRing) { focusRing.setVisible(false); } return; }
    var cfg = getLevelConfig(level);
    var card = cards[focusIndex];
    if (!card || card.matched) {
      for (var i = 0; i < cards.length; i++) { if (!cards[i].matched) { focusIndex = i; card = cards[i]; break; } }
    }
    if (!card) { focusRing.setVisible(false); return; }
    focusRing.clear();
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(card.view.x - cfg.cw / 2 - 4, card.view.y - cfg.ch / 2 - 4, cfg.cw + 8, cfg.ch + 8, 24);
    focusRing.setVisible(true);
  }

  function createBubbles(scene) {
    bubbles = [];
    for (var i = 0; i < 10; i++) {
      var b = scene.add.text(Phaser.Math.Between(20, W - 20), Phaser.Math.Between(260, 600), "\u{1FAE7}", { fontSize: (12 + Math.random() * 14) + "px" }).setAlpha(0.45).setDepth(1);
      b.speed = 0.2 + Math.random() * 0.4;
      bubbles.push(b);
    }
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed;
      b.x += Math.sin(Date.now() * 0.001 + i) * 0.18;
      if (b.y < 180) { b.y = 620; b.x = Phaser.Math.Between(20, W - 20); }
    }
  }
})();
</script>
</body>
</html>
