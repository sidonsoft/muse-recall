<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F2F8;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18);display:block}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  #a11y-bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:95vw}
  .a11y-btn{background:#4EA8DE;color:#fff;border:none;border-radius:999px;padding:8px 14px;font-family:"Inter","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(16,42,67,.15);transition:transform .12s,background .12s}
  .a11y-btn:hover{background:#2A6F97;transform:translateY(-1px)}
  .a11y-btn:focus-visible{outline:3px solid #102A43;outline-offset:2px}
  .a11y-btn.hard{background:#102A43}
  .a11y-btn.hard:hover{background:#1A4D6E}
  .a11y-btn.restart{background:#fff;color:#102A43;border:2px solid #4EA8DE}
  .a11y-btn.restart:hover{background:#EAF6FB}
  .a11y-btn.active{outline:3px solid #102A43;outline-offset:2px}
</style>
</head>
<body>
<div id="a11y-bar" role="toolbar" aria-label="Game controls">
  <button type="button" class="a11y-btn" id="dom-normal" aria-label="Start normal mode with 6 pairs relaxed pace">Normal</button>
  <button type="button" class="a11y-btn hard" id="dom-hard" aria-label="Start hard challenge mode with 8 pairs and 75 second timer">Hard Challenge</button>
  <button type="button" class="a11y-btn restart" id="dom-restart" aria-label="Restart current game">Restart</button>
</div>
<div id="aria-live" aria-live="polite" aria-atomic="true" class="sr-only"></div>
<div id="game" role="application" aria-label="Farmyard Memory Match game board, use arrow keys and Enter to flip cards"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F98A}", name: "Fox" },
    { emoji: "\u{1F430}", name: "Rabbit" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudTimer, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = "normal", totalPairs = 6, timeLeft = 0, timerEvent = null, hardTimeLimit = 75;
  var focusedIndex = 0, focusIndicator = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupDomControls(s);
    announce("Farmyard Match loaded. Choose Normal or Hard Challenge to start. Use Tab to reach controls, arrow keys to move between cards, Enter to flip.");
    var c = document.querySelector("canvas");
    if (c) { c.setAttribute("aria-label", "Memory match board with " + totalPairs + " pairs. Use arrow keys and Enter."); c.setAttribute("tabindex", "0"); }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xB8E0F0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xFFFFFF, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xE6F2F8, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2A6F97, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xEAF6FB, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xEAF6FB, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x468FAF, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x2A6F97, 0x468FAF, 0xA9D6E5];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2A6F97, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xEAF6FB, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Inter","Segoe UI",system-ui,sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function announce(msg) {
    var el = document.getElementById("aria-live");
    if (el) { el.textContent = msg; }
  }

  function getBoardLayout() {
    if (difficulty === "hard") {
      return { cols: 4, rows: 4, cw: 165, ch: 115, gx: 62, gy: 195, padX: 18, padY: 12 };
    } else {
      return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
    }
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(20));
    hudTimer = scene.add.text(W - 24, 58, "", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    hudTimer.setVisible(false);
    hudMode = scene.add.text(W - 24, 82, "MODE: NORMAL", textStyle(13, "#2A6F97")).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 108, "Choose a mode!", textStyle(18, "#2A6F97")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 132);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -22, 172, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(18, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var modeBtn = scene.add.container(W - 110, 176);
    var mBg = scene.add.graphics();
    mBg.fillStyle(0x102A43, 1); mBg.fillRoundedRect(-86, -18, 172, 36, 18);
    var mLabel = scene.add.text(0, 0, "HARD: OFF", textStyle(14, "#ffffff")).setOrigin(0.5);
    modeBtn.add([mBg, mLabel]);
    mBg.setInteractive(new Phaser.Geom.Rectangle(-86, -18, 172, 36), Phaser.Geom.Rectangle.Contains);
    mBg.on("pointerdown", function () { toggleMode(scene); });
    mBg.on("pointerover", function () { modeBtn.setScale(1.05); });
    mBg.on("pointerout", function () { modeBtn.setScale(1); });
    scene._modeBtn = { bg: mBg, label: mLabel, container: modeBtn };
    scene.add.text(W / 2, 168, "Find the pairs! Arrow keys + Enter to play", textStyle(14, "#468FAF")).setOrigin(0.5);
    focusIndicator = scene.add.graphics().setDepth(5).setVisible(false);
    focusIndicator.lineStyle(4, 0x4EA8DE, 1);
    focusIndicator.strokeRoundedRect(-92, -70, 184, 140, 18);
  }

  function shuffledDeck() {
    var pool = difficulty === "hard" ? ANIMALS : ANIMALS.slice(0, 6);
    totalPairs = pool.length;
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var layout = getBoardLayout();
    var cols = layout.cols, cw = layout.cw, ch = layout.ch, gx = layout.gx, gy = layout.gy, padX = layout.padX, padY = layout.padY;
    totalPairs = difficulty === "hard" ? 8 : 6;
    hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMode.setText(difficulty === "hard" ? "MODE: HARD \u2022 75s" : "MODE: NORMAL");
    if (scene._modeBtn) { scene._modeBtn.label.setText(difficulty === "hard" ? "HARD: ON" : "HARD: OFF"); }
    updateDomButtons();
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusedIndex = 0;
    if (cards.length) { setFocus(0); }
    updateTimerDisplay();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 14);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 8); back.fillCircle(0, h / 4, 12);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xEAF6FB, 0xB8E0F0, 0xD6EAF8, 0xA9D6E5, 0x7FBCD6, 0x4EA8DE, 0x2A6F97, 0x468FAF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: "52px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(18)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, x: x, y: y, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function setFocus(idx) {
    if (!cards.length) { return; }
    focusedIndex = (idx + cards.length) % cards.length;
    var c = cards[focusedIndex];
    if (focusIndicator) {
      focusIndicator.setVisible(started);
      focusIndicator.setPosition(c.x, c.y);
      focusIndicator.clear();
      focusIndicator.lineStyle(4, 0x4EA8DE, 1);
      focusIndicator.strokeRoundedRect(-c.w / 2 - 4, -c.h / 2 - 4, c.w + 8, c.h + 8, 18);
    }
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    var idx = cards.indexOf(card);
    if (idx !== -1) { focusedIndex = idx; setFocus(focusedIndex); }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Flipped " + card.data.name + ", pick one more"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Match! " + card.data.name + " pair found. " + matches + " of " + totalPairs);
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("No match, try again");
      var delay = difficulty === "hard" ? 500 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, delay);
    }
  }

  function updateTimerDisplay() {
    if (!hudTimer) { return; }
    if (difficulty === "hard" && started) {
      hudTimer.setVisible(true);
      var m = Math.floor(timeLeft / 60);
      var s = timeLeft % 60;
      var txt = (m < 10 ? "0" + m : "" + m) + ":" + (s < 10 ? "0" + s : "" + s);
      hudTimer.setText("\u23F1 " + txt);
      if (timeLeft <= 10) { hudTimer.setStyle({ color: "#D90429" }); } else { hudTimer.setStyle({ color: "#102A43" }); }
    } else if (difficulty === "hard" && !started) {
      hudTimer.setVisible(true);
      hudTimer.setText("\u23F1 01:15");
      hudTimer.setStyle({ color: "#102A43" });
    } else {
      hudTimer.setVisible(false);
    }
  }

  function startTimer(scene) {
    stopTimer();
    if (difficulty !== "hard") { return; }
    timeLeft = hardTimeLimit;
    updateTimerDisplay();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        stopTimer();
        showLose(scene);
      }
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function startGame(scene, mode) {
    difficulty = mode || difficulty;
    totalPairs = difficulty === "hard" ? 8 : 6;
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMsg.setText(difficulty === "hard" ? "Hard mode! Beat the clock!" : "Tap a card!");
    if (startOverlay) { startOverlay.setVisible(false); }
    if (endOverlay) { endOverlay.setVisible(false); }
    buildBoard(scene);
    startTimer(scene);
    setFocus(0);
    announce((difficulty === "hard" ? "Hard challenge started. 8 pairs, 75 seconds. " : "Normal mode started. 6 pairs. ") + "Use arrow keys and Enter to play.");
    updateDomButtons();
  }

  function toggleMode(scene) {
    var newMode = difficulty === "hard" ? "normal" : "hard";
    difficulty = newMode;
    if (started) {
      restart(scene, newMode);
    } else {
      totalPairs = difficulty === "hard" ? 8 : 6;
      hudMode.setText(difficulty === "hard" ? "MODE: HARD \u2022 75s" : "MODE: NORMAL");
      if (scene._modeBtn) { scene._modeBtn.label.setText(difficulty === "hard" ? "HARD: ON" : "HARD: OFF"); }
      updateTimerDisplay();
      buildBoard(scene);
      hudMsg.setText(difficulty === "hard" ? "Hard: 8 pairs + timer!" : "Normal: 6 pairs");
      announce("Mode switched to " + difficulty);
      updateDomButtons();
    }
  }

  function updateDomButtons() {
    var n = document.getElementById("dom-normal");
    var h = document.getElementById("dom-hard");
    if (!n || !h) { return; }
    if (difficulty === "hard") { h.classList.add("active"); n.classList.remove("active"); } else { n.classList.add("active"); h.classList.remove("active"); }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -135, "Farmyard Match", textStyle(38)).setOrigin(0.5);
    var badge = scene.add.text(0, -100, "OCEAN EDITION \u2022 13+", textStyle(13, "#4EA8DE")).setOrigin(0.5);
    var sub = scene.add.text(0, -62, "Choose your challenge", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -22, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F98A} \u{1F430}", { fontSize: "32px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 12, "Normal = relaxed \u2022 Hard = 8 pairs + 75s timer + faster flips", textStyle(13, "#468FAF")).setOrigin(0.5);

    var nBg = scene.add.graphics();
    nBg.fillStyle(0x4EA8DE, 1); nBg.fillRoundedRect(-270, 36, 250, 64, 20);
    var nTitle = scene.add.text(-145, 56, "Normal", textStyle(20, "#ffffff")).setOrigin(0.5);
    var nSub = scene.add.text(-145, 76, "6 pairs \u2022 relaxed", textStyle(12, "#ffffff")).setOrigin(0.5);
    var hBg = scene.add.graphics();
    hBg.fillStyle(0x102A43, 1); hBg.fillRoundedRect(20, 36, 250, 64, 20);
    var hTitle = scene.add.text(145, 56, "Hard Challenge", textStyle(18, "#ffffff")).setOrigin(0.5);
    var hSub = scene.add.text(145, 76, "8 pairs \u2022 75s \u2022 \u26A1", textStyle(12, "#ffffff")).setOrigin(0.5);
    var keys = scene.add.text(0, 128, "Keys: N = Normal  |  H = Hard  |  Arrows + Enter to flip", textStyle(12, "#7A9AB5")).setOrigin(0.5);
    var foot = scene.add.text(0, 152, "You can switch mode anytime with the HARD toggle", textStyle(12, "#7A9AB5")).setOrigin(0.5);

    startOverlay.add([bg, panel, title, badge, sub, row, hint, nBg, nTitle, nSub, hBg, hTitle, hSub, keys, foot]);
    nBg.setInteractive(new Phaser.Geom.Rectangle(-270, 36, 250, 64), Phaser.Geom.Rectangle.Contains);
    hBg.setInteractive(new Phaser.Geom.Rectangle(20, 36, 250, 64), Phaser.Geom.Rectangle.Contains);
    nBg.on("pointerdown", function () { startGame(scene, "normal"); });
    hBg.on("pointerdown", function () { startGame(scene, "hard"); });
    nBg.on("pointerover", function () { nBg.clear(); nBg.fillStyle(0x2A6F97, 1); nBg.fillRoundedRect(-270, 36, 250, 64, 20); });
    nBg.on("pointerout", function () { nBg.clear(); nBg.fillStyle(0x4EA8DE, 1); nBg.fillRoundedRect(-270, 36, 250, 64, 20); });
    hBg.on("pointerover", function () { hBg.clear(); hBg.fillStyle(0x1A4D6E, 1); hBg.fillRoundedRect(20, 36, 250, 64, 20); });
    hBg.on("pointerout", function () { hBg.clear(); hBg.fillStyle(0x102A43, 1); hBg.fillRoundedRect(20, 36, 250, 64, 20); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    var switchTx = scene.add.text(0, 135, "Press H for Hard Challenge \u2022 N for Normal", textStyle(13, "#468FAF")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, switchTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    stopTimer();
    lockBoard = true;
    var isHard = difficulty === "hard";
    var stars = 3;
    if (isHard) {
      if (moves <= 14 && timeLeft >= 20) { stars = 3; } else if (moves <= 20 && timeLeft >= 5) { stars = 2; } else { stars = 1; }
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    var timeTxt = isHard ? "Time left: " + Math.floor(timeLeft/60) + ":" + (timeLeft%60 < 10 ? "0"+timeLeft%60 : timeLeft%60) + "  " : "";
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText((isHard ? "Hard Challenge cleared!\n" : "You found all " + totalPairs + " pairs!\n") + timeTxt + "Moves: " + moves + "  " + "\u2B50".repeat(stars) + (isHard ? "\nOcean Master!" : ""));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! " + matches + " pairs in " + moves + " moves. " + (isHard ? "Hard challenge completed with " + timeLeft + " seconds left." : ""));
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    lockBoard = true;
    started = false;
    if (focusIndicator) { focusIndicator.setVisible(false); }
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("Hard Challenge failed\nPairs: " + matches + " / " + totalPairs + "  Moves: " + moves + "\nTry again? Hard mode needs speed!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F1");
    announce("Time is up. You found " + matches + " of " + totalPairs + " pairs. Press Restart or H to try hard challenge again.");
  }

  function restart(scene, newDiff) {
    if (newDiff) { difficulty = newDiff; }
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + (difficulty === "hard" ? 8 : 6)); hudMsg.setText(difficulty === "hard" ? "Hard mode! Go!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    startTimer(scene);
    setFocus(0);
    announce("Game restarted in " + difficulty + " mode");
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown-N", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, "normal"); } else if (endOverlay && endOverlay.visible) { restart(scene, "normal"); } else { if (difficulty !== "normal") { toggleMode(scene); } }
    });
    scene.input.keyboard.on("keydown-H", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); } else if (endOverlay && endOverlay.visible) { restart(scene, "hard"); } else { if (difficulty !== "hard") { toggleMode(scene); } }
    });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, difficulty); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      if (!started || !cards.length) { return; }
      var card = cards[focusedIndex];
      if (card) { onCard(scene, card); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (!started || !cards.length) { return; }
      if (endOverlay && endOverlay.visible) { return; }
      var card = cards[focusedIndex];
      if (card) { onCard(scene, card); }
    });
    scene.input.keyboard.on("keydown-LEFT", function () {
      if (!started) { return; }
      var layout = getBoardLayout();
      setFocus(focusedIndex - 1);
    });
    scene.input.keyboard.on("keydown-RIGHT", function () {
      if (!started) { return; }
      setFocus(focusedIndex + 1);
    });
    scene.input.keyboard.on("keydown-UP", function () {
      if (!started) { return; }
      var layout = getBoardLayout();
      setFocus(focusedIndex - layout.cols);
    });
    scene.input.keyboard.on("keydown-DOWN", function () {
      if (!started) { return; }
      var layout = getBoardLayout();
      setFocus(focusedIndex + layout.cols);
    });
    scene.input.keyboard.on("keydown-ESC", function () {
      if (endOverlay && endOverlay.visible) { endOverlay.setVisible(false); if (startOverlay) { startOverlay.setVisible(true); } started = false; lockBoard = true; stopTimer(); if (focusIndicator) { focusIndicator.setVisible(false); } }
    });
  }

  function setupDomControls(scene) {
    var n = document.getElementById("dom-normal");
    var h = document.getElementById("dom-hard");
    var r = document.getElementById("dom-restart");
    function bind(btn, action) {
      if (!btn) { return; }
      btn.addEventListener("click", action);
      btn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          action();
        }
      });
    }
    bind(n, function () { startGame(scene, "normal"); });
    bind(h, function () { startGame(scene, "hard"); });
    bind(r, function () { restart(scene); });
    updateDomButtons();
  }

  function update() {}
})();
</script>
</body>
</html>
