<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#102A43}
  #appWrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:900px;padding:12px;box-sizing:border-box;height:100vh;justify-content:center}
  #controls{display:flex;align-items:center;justify-content:space-between;width:100%;background:#ffffff;border:2px solid #4EA8DE;border-radius:14px;padding:10px 14px;box-sizing:border-box;box-shadow:0 4px 16px rgba(16,42,67,0.08);flex-wrap:wrap;gap:8px}
  #difficultyGroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #diffLabel{font-weight:800;color:#102A43;font-size:13px;letter-spacing:0.06em;text-transform:uppercase}
  #controls button{appearance:none;border:2px solid #4EA8DE;background:#ffffff;color:#102A43;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:all 0.15s}
  #controls button[aria-pressed="true"]{background:#4EA8DE;color:#ffffff;box-shadow:0 2px 8px rgba(78,168,222,0.35)}
  #controls button:focus-visible{outline:3px solid #102A43;outline-offset:2px}
  #timerDisplay{font-weight:800;color:#102A43;min-width:110px;text-align:right;font-size:15px}
  #game{width:100%;height:70vh;max-height:620px;min-height:400px;outline:none}
  #game:focus-visible{outline:3px solid #4EA8DE;outline-offset:4px;border-radius:18px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,0.15);display:block}
  @media (max-width:600px){
    #controls{padding:8px 10px}
    #controls button{padding:6px 12px;font-size:13px}
    #timerDisplay{min-width:90px;font-size:14px}
  }
</style>
</head>
<body>
<div id="appWrap">
  <div id="controls" role="toolbar" aria-label="Game controls">
    <div id="difficultyGroup" role="group" aria-label="Difficulty selection">
      <span id="diffLabel">Difficulty</span>
      <button type="button" id="btnNormal" aria-pressed="true" aria-label="Play normal mode with 6 pairs">Normal</button>
      <button type="button" id="btnHard" aria-pressed="false" aria-label="Play hard challenge mode with 8 pairs and 75 second timer">Hard • 8 Pairs + Timer</button>
    </div>
    <div id="timerDisplay" aria-live="polite" aria-atomic="true" aria-label="Time remaining">Time: --</div>
  </div>
  <div id="game" tabindex="0" role="application" aria-label="Ocean memory match game board. Use arrow keys to navigate cards and Enter to flip."></div>
  <div id="a11yHelp" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;" aria-live="polite"></div>
</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F420}", name: "Tropical Fish" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F41A}", name: "Shell" },
    { emoji: "\u2B50", name: "Starfish" }
  ];
  var W = 900, H = 700;
  var difficulty = 'normal';
  var PAIRS_NORMAL = 6, PAIRS_HARD = 8;
  var HARD_TIME = 75;
  var timeLeft = HARD_TIME;
  var timerId = null;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudTimer, hudMode, hudSubtitle, endOverlay, endTitle, endDetail, startOverlay, startDetail, startRow;
  var focusedIndex = 0;
  var focusGfx = null;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupDomControls();
    setupKeyboard(s);
    updateDomDifficultyUI();
    updateTimerDisplay();
    lockBoard = true;
    started = false;
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 0, W, 180);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x2A7AB5, 1); g.fillRect(0, 470, W, 18);
    g.lineStyle(3, 0xFFFFFF, 0.9);
    for (var wx = 0; wx < W; wx += 80) {
      g.beginPath();
      g.moveTo(wx, 490);
      g.lineTo(wx + 20, 485);
      g.lineTo(wx + 40, 490);
      g.strokePath();
    }
    g.fillStyle(0xFDEEC9, 1); g.fillEllipse(155, 520, 220, 70);
    g.fillStyle(0xE6D5A8, 1); g.fillEllipse(155, 530, 180, 40);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 18);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xEAF6FF, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0x102A43, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x8B5A2B, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xFF6B9D, 0xFF9D76, 0x4EA8DE, 0x7ED6A8];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2A7AB5, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFF200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Inter","Segoe UI",system-ui,sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 110, "NORMAL", textStyle(13, "#4EA8DE")).setOrigin(0, 0);
    hudTimer = scene.add.text(W - 24, 90, "Time: --", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    hudTimer.setVisible(false);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSubtitle = scene.add.text(W / 2, 168, "Find the 6 ocean pairs!", textStyle(18, "#5A7A9A")).setOrigin(0.5);
  }

  function getPairsCount() {
    return difficulty === 'hard' ? PAIRS_HARD : PAIRS_NORMAL;
  }

  function shuffledDeck(count) {
    var shuffledAnimals = ANIMALS.slice();
    for (var i = shuffledAnimals.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = shuffledAnimals[i]; shuffledAnimals[i] = shuffledAnimals[j]; shuffledAnimals[j] = t;
    }
    var selected = shuffledAnimals.slice(0, count);
    var deck = [];
    selected.forEach(function (a, idx) {
      deck.push({ key: idx, emoji: a.emoji, name: a.name });
      deck.push({ key: idx, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var k = Math.floor(Math.random() * (i + 1));
      var tmp = deck[i]; deck[i] = deck[k]; deck[k] = tmp;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var count = getPairsCount();
    var deck = shuffledDeck(count);
    var cols = 4, rows = count === 6 ? 3 : 4;
    var cw = 185, ch = count === 6 ? 140 : 105, gx = 62, gy = 195, padX = 22, padY = count === 6 ? 16 : 12;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusedIndex = 0;
    hudScore.setText("Pairs: 0 / " + count);
    if (hudSubtitle) {
      hudSubtitle.setText(difficulty === 'hard' ? "Hard: Find 8 pairs before time runs out!" : "Find the 6 ocean pairs!");
    }
    if (hudMode) hudMode.setText(difficulty === 'hard' ? "HARD \u2022 75s" : "NORMAL");
    if (hudTimer) {
      hudTimer.setVisible(difficulty === 'hard');
      if (difficulty === 'hard') {
        hudTimer.setText("Time: " + timeLeft + "s");
        hudTimer.setColor(timeLeft <= 15 ? "#D32F2F" : "#102A43");
      }
    }
    updateFocusHighlight(scene);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xFFFFFF, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F30A}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xEAF6FF, 0xD6EAF8, 0xC8E7FF, 0xB8E6D8, 0xFFEEDD, 0xE4D5F7, 0xD1F0FF, 0xFFF0D6];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "56px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(18)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    var idx = cards.indexOf(card);
    if (idx !== -1) { focusedIndex = idx; updateFocusHighlight(scene); }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announceCard(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + getPairsCount());
        hudMsg.setText(matches === getPairsCount() ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        updateFocusHighlight(scene);
        announceCard();
        if (matches === getPairsCount()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F30A}");
      var delay = difficulty === 'hard' ? 500 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusHighlight(scene); announceCard(); });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -140, "\u{1F30A} Ocean Match \u{1F419}", textStyle(36)).setOrigin(0.5);
    startDetail = scene.add.text(0, -70, "", Object.assign(textStyle(18), { align: "center" })).setOrigin(0.5);
    startRow = scene.add.text(0, 10, "\u{1F419} \u{1F42C} \u{1F433} \u{1F988} \u{1F422} \u{1F980}", { fontSize: "38px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 50, "Use mouse or arrow keys + Enter", textStyle(14, "#5A7A9A")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    var diffNote = scene.add.text(0, 170, "Change difficulty above before starting", textStyle(13, "#5A7A9A")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, startDetail, startRow, hint, btnBg, btnTx, diffNote]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      if (difficulty === 'hard') startTimer(scene);
      updateFocusHighlight(scene);
      var gameEl = document.getElementById('game');
      if (gameEl) gameEl.focus();
    });
    updateStartOverlayText();
  }

  function updateStartOverlayText() {
    if (!startDetail) return;
    if (difficulty === 'hard') {
      startDetail.setText("HARD CHALLENGE MODE\nFind all 8 ocean pairs in 75 seconds!\nFaster flips \u2022 Every move counts");
      if (startRow) startRow.setText("\u{1F419} \u{1F42C} \u{1F433} \u{1F988} \u{1F422} \u{1F980} \u{1F420} \u{1F991}");
    } else {
      startDetail.setText("Flip the cards and find\nall 6 ocean pairs!\nRelaxed pace \u2014 perfect to learn");
      if (startRow) startRow.setText("\u{1F419} \u{1F42C} \u{1F433} \u{1F988} \u{1F422} \u{1F980}");
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    stopTimer();
    var count = getPairsCount();
    var stars;
    if (difficulty === 'hard') {
      if (moves <= 14 && timeLeft > 30) stars = 3;
      else if (moves <= 18 && timeLeft > 15) stars = 2;
      else stars = 1;
      endTitle.setText("\u{1F3C6} Challenge Complete! \u{1F3C6}");
      endDetail.setText("You found all " + count + " pairs!\nMoves: " + moves + " \u2022 Time left: " + timeLeft + "s  " + "\u2B50".repeat(stars) + "\nHard mode conquered!");
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("You found all " + count + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    lockBoard = true;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / " + getPairsCount() + " pairs\nMoves: " + moves + "\nTry again? Hard mode is tough!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again");
  }

  function restart(scene) {
    stopTimer();
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    timeLeft = HARD_TIME;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + getPairsCount()); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    if (focusGfx) { focusGfx.destroy(); focusGfx = null; }
    buildBoard(scene);
    if (difficulty === 'hard') startTimer(scene);
    updateTimerDisplay();
    updateFocusHighlight(scene);
    var gameEl = document.getElementById('game');
    if (gameEl) gameEl.focus();
  }

  function startTimer(scene) {
    stopTimer();
    timeLeft = HARD_TIME;
    updateTimerDisplay();
    if (hudTimer) {
      hudTimer.setText("Time: " + timeLeft + "s");
      hudTimer.setColor("#102A43");
    }
    timerId = setInterval(function () {
      timeLeft--;
      updateTimerDisplay();
      if (hudTimer) {
        hudTimer.setText("Time: " + timeLeft + "s");
        if (timeLeft <= 15) hudTimer.setColor("#D32F2F");
        else hudTimer.setColor("#102A43");
        if (timeLeft <= 10) {
          scene.tweens.add({ targets: hudTimer, scale: 1.15, yoyo: true, duration: 120 });
        }
      }
      if (timeLeft <= 0) {
        stopTimer();
        showLose(scene);
      }
    }, 1000);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function updateTimerDisplay() {
    var el = document.getElementById('timerDisplay');
    if (el) {
      if (difficulty === 'hard') {
        el.textContent = "Time: " + timeLeft + "s";
        el.style.color = timeLeft <= 15 ? "#D32F2F" : "#102A43";
      } else {
        el.textContent = "Time: --";
        el.style.color = "#102A43";
      }
    }
  }

  function setDifficulty(mode) {
    difficulty = mode;
    timeLeft = HARD_TIME;
    updateDomDifficultyUI();
    updateStartOverlayText();
    updateTimerDisplay();
    var scene = cards.length > 0 ? cards[0].view.scene : null;
    if (scene) {
      if (started || (startOverlay && !startOverlay.visible)) {
        restart(scene);
      } else {
        cards.forEach(function (c) { c.view.destroy(); });
        if (focusGfx) { focusGfx.destroy(); focusGfx = null; }
        buildBoard(scene);
        if (startOverlay) startOverlay.setVisible(true);
        lockBoard = true;
        started = false;
        stopTimer();
      }
    }
  }

  function setupDomControls() {
    var btnN = document.getElementById('btnNormal');
    var btnH = document.getElementById('btnHard');
    if (!btnN || !btnH) return;
    function handleNormalClick() { setDifficulty('normal'); }
    function handleHardClick() { setDifficulty('hard'); }
    btnN.addEventListener('click', handleNormalClick);
    btnH.addEventListener('click', handleHardClick);
    btnN.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleNormalClick();
      }
    });
    btnH.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleHardClick();
      }
    });
  }

  function updateDomDifficultyUI() {
    var btnN = document.getElementById('btnNormal');
    var btnH = document.getElementById('btnHard');
    if (btnN) btnN.setAttribute('aria-pressed', difficulty === 'normal' ? 'true' : 'false');
    if (btnH) btnH.setAttribute('aria-pressed', difficulty === 'hard' ? 'true' : 'false');
  }

  function updateFocusHighlight(scene) {
    if (focusGfx) { focusGfx.destroy(); focusGfx = null; }
    if (!scene || cards.length === 0) return;
    var card = cards[focusedIndex];
    if (!card) return;
    focusGfx = scene.add.graphics().setDepth(5);
    focusGfx.lineStyle(4, 0x102A43, 1);
    var w = card.view.width || 185, h = card.view.height || 140;
    focusGfx.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
    if (!started) focusGfx.setVisible(false);
  }

  function announceCard() {
    var el = document.getElementById('a11yHelp');
    var card = cards[focusedIndex];
    if (el && card) {
      var status = card.matched ? "matched" : card.faceUp ? "face up " + card.data.name : "face down";
      el.textContent = "Card " + (focusedIndex + 1) + " of " + cards.length + ", " + status + ".";
    }
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on('keydown', function (e) {
      if (!started && (e.key === 'Enter' || e.key === ' ')) {
        if (startOverlay && startOverlay.visible) {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Tap a card!");
          if (difficulty === 'hard') startTimer(scene);
          updateFocusHighlight(scene);
          var ge = document.getElementById('game');
          if (ge) ge.focus();
          return;
        }
        if (endOverlay && endOverlay.visible) {
          restart(scene);
          return;
        }
      }
      if (endOverlay && endOverlay.visible && (e.key === 'Enter' || e.key === ' ')) {
        restart(scene);
        return;
      }
      if (!started) return;
      if (e.key === 'ArrowRight') {
        focusedIndex = (focusedIndex + 1) % cards.length;
        updateFocusHighlight(scene); announceCard();
      } else if (e.key === 'ArrowLeft') {
        focusedIndex = (focusedIndex - 1 + cards.length) % cards.length;
        updateFocusHighlight(scene); announceCard();
      } else if (e.key === 'ArrowDown') {
        focusedIndex = (focusedIndex + 4) % cards.length;
        updateFocusHighlight(scene); announceCard();
      } else if (e.key === 'ArrowUp') {
        focusedIndex = (focusedIndex - 4 + cards.length) % cards.length;
        updateFocusHighlight(scene); announceCard();
      } else if (e.key === 'Enter' || e.key === ' ') {
        var card = cards[focusedIndex];
        if (card) onCard(scene, card);
      } else if (e.key === 'r' || e.key === 'R') {
        restart(scene);
      }
    });
    var gameEl = document.getElementById('game');
    if (gameEl) {
      gameEl.addEventListener('focus', function () { if (focusGfx) focusGfx.setVisible(true); updateFocusHighlight(scene); });
      gameEl.addEventListener('blur', function () { if (focusGfx) focusGfx.setVisible(false); });
      gameEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          if (startOverlay && startOverlay.visible) {
            e.preventDefault();
            started = true; lockBoard = false;
            startOverlay.setVisible(false);
            hudMsg.setText("Tap a card!");
            if (difficulty === 'hard') startTimer(scene);
            updateFocusHighlight(scene);
          } else if (endOverlay && endOverlay.visible) {
            e.preventDefault();
            restart(scene);
          }
        }
      });
    }
  }

  function update() {}
})();
</script>
</body>
</html>
