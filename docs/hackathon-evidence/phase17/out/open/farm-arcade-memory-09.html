<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F4FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F41A}", name: "Shell" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, level = 1;
  var hudMoves, hudScore, hudLevel, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var focusedIndex = 0;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xBAE6FD, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x7DD3FC, 0.9);
    g.fillEllipse(200, 485, 320, 28);
    g.fillEllipse(500, 495, 360, 30);
    g.fillEllipse(750, 485, 280, 26);
    g.fillStyle(0xE0F2FE, 0.95);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xFFF7CC, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE8A0, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 0.55);
    for (var i = 0; i < 12; i++) {
      var bx = 40 + i * 72 + (i % 3) * 10;
      var by = 540 + (i % 4) * 22;
      var r = 6 + (i % 3) * 3;
      g.fillCircle(bx, by, r);
      g.fillStyle(0xE0F2FE, 0.9); g.fillCircle(bx + 2, by - 2, 2);
      g.fillStyle(0xFFFFFF, 0.55);
    }
    g.fillStyle(0x4EA8DE, 0.12); g.fillEllipse(W / 2, 680, 820, 70);
    g.fillStyle(0x7DD3FC, 0.35);
    g.fillEllipse(120, 640, 90, 22); g.fillEllipse(780, 650, 110, 24);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Memory Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20));
    hudLevel = scene.add.text(24, 110, "Level: 1", textStyle(20, "#3A5A7A"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the pairs \u2014 level up for a bigger reef!", textStyle(20, "#3A5A7A")).setOrigin(0.5);
  }

  function shuffledDeck(count) {
    var pool = OCEAN_ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var pairCount = level === 1 ? 6 : 8;
    var cols = 4;
    var rows = pairCount === 6 ? 3 : 4;
    var cw = pairCount === 6 ? 185 : 170;
    var ch = pairCount === 6 ? 140 : 125;
    var gx = pairCount === 6 ? 62 : 70;
    var gy = pairCount === 6 ? 195 : 190;
    var padX = 22, padY = 16;
    var deck = shuffledDeck(pairCount);
    hudScore.setText("Pairs: 0 / " + pairCount);
    hudLevel.setText("Level: " + level);
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    highlightFocus();
  }

  function makeCard(scene, x, y, w, h, data, index) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.lineStyle(3, 0xE0F2FE, 0.9);
    back.beginPath();
    back.moveTo(-w / 2 + 18, -h / 4); back.lineTo(w / 2 - 18, -h / 4 + 8);
    back.moveTo(-w / 2 + 18, 0); back.lineTo(w / 2 - 18, 8);
    back.moveTo(-w / 2 + 18, h / 4); back.lineTo(w / 2 - 18, h / 4 + 8);
    back.strokePath();
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 12);
    var paw = scene.add.text(0, -6, "\u{1F41A}", { fontSize: "46px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xBAE6FD, 0x7DD3FC, 0xA5F3FC, 0xCFFAFE, 0xDBEAFE, 0xE0E7FF, 0xF0F9FF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "56px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: index };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { focusedIndex = index; highlightFocus(); });
    return card;
  }

  function highlightFocus() {
    cards.forEach(function (c, i) {
      if (!c.view) { return; }
      if (i === focusedIndex && started && !c.matched) {
        c.view.setScale(1.03);
      } else {
        c.view.setScale(1);
      }
    });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, ease: "Sine.easeInOut", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Sine.easeInOut", onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u{1F30A}"); highlightFocus(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        var midX = (a.view.x + card.view.x) / 2, midY = (a.view.y + card.view.y) / 2;
        for (var k = 0; k < 6; k++) {
          var b = scene.add.text(midX, midY, "\u{1FAE7}", { fontSize: "20px" }).setDepth(15).setOrigin(0.5);
          scene.tweens.add({ targets: b, y: midY - 60 - Phaser.Math.Between(0, 30), x: midX + Phaser.Math.Between(-40, 40), alpha: 0, duration: 700, onComplete: (function (t) { return function () { t.destroy(); }; })(b) });
        }
        matches++;
        var total = level === 1 ? 6 : 8;
        hudScore.setText("Pairs: " + matches + " / " + total);
        hudMsg.setText(matches === total ? "Amazing! \u{2728}" : "Great pair! \u2728");
        lockBoard = false;
        highlightFocus();
        if (matches === total) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("So close! Try again \u{1F420}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; highlightFocus(); });
      }, 750);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F30A} Ocean Memory Match \u{1F433}", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Flip cards to find matching sea friends!\nLevel 1: 6 pairs \u2192 Level 2: 8 pairs", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 20, "\u{1F433} \u{1F419} \u{1F42C} \u{1F422} \u{1F980} \u{1F420}", { fontSize: "42px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 62, "No rush \u2014 take your time & explore!", textStyle(16, "#3A5A7A")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 90, 260, 70, 35);
    var btnTx = scene.add.text(0, 125, "\u25B6  Dive In", textStyle(26, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 90, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      highlightFocus();
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -175, 580, 350, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -175, 580, 350, 30);
    endTitle = scene.add.text(0, -105, "\u{1F389} Reef Complete! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg1 = scene.add.graphics();
    btnBg1.fillStyle(0x4EA8DE, 1); btnBg1.fillRoundedRect(-140, 50, 280, 60, 30);
    var btnTx1 = scene.add.text(0, 80, "\u25B6 Next Level", textStyle(22, "#ffffff")).setOrigin(0.5);
    var btnBg2 = scene.add.graphics();
    btnBg2.fillStyle(0xffffff, 1); btnBg2.lineStyle(3, 0x4EA8DE, 1); btnBg2.strokeRoundedRect(-140, 125, 280, 50, 25); btnBg2.fillRoundedRect(-140, 125, 280, 50, 25);
    var btnTx2 = scene.add.text(0, 150, "\u21BB Play Again", textStyle(18, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg1, btnTx1, btnBg2, btnTx2]);
    btnBg1.setInteractive(new Phaser.Geom.Rectangle(-140, 50, 280, 60), Phaser.Geom.Rectangle.Contains);
    btnBg1.on("pointerdown", function () { nextLevel(scene); });
    btnBg2.setInteractive(new Phaser.Geom.Rectangle(-140, 125, 280, 50), Phaser.Geom.Rectangle.Contains);
    btnBg2.on("pointerdown", function () { level = 1; restart(scene); });
  }

  function showWin(scene) {
    var total = level === 1 ? 6 : 8;
    var stars = moves <= total + 4 ? 3 : (moves <= total + 8 ? 2 : 1);
    var msg = level === 1 ? "Ready for a bigger reef?" : "You mastered the ocean!";
    endDetail.setText("You found all " + total + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\n" + msg);
    endTitle.setText(level === 1 ? "\u{1F389} Reef Complete! \u{1F389}" : "\u{1F30A} Ocean Master! \u{1F30A}");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 300, ease: "Back.easeOut" });
    hudMsg.setText("You did it! \u{1F389}");
    for (var i = 0; i < 30; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1FAE7}", "\u2B50", "\u{1F389}", "\u{1F41A}"][i % 4], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1400, 2400), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    var total = level === 1 ? 6 : 8;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + total); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function nextLevel(scene) {
    if (level === 1) { level = 2; } else { level = 1; }
    restart(scene);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (e.key === "Enter" && startOverlay && startOverlay.visible) {
        started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card!"); highlightFocus(); return;
      }
      if (!started || !cards.length) { return; }
      if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        focusedIndex = (focusedIndex + 1) % cards.length; highlightFocus();
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        focusedIndex = (focusedIndex - 1 + cards.length) % cards.length; highlightFocus();
      } else if (e.key === "Enter" || e.key === " ") {
        var c = cards[focusedIndex];
        if (c) { onCard(scene, c); }
      } else if (e.key === "r" || e.key === "R") {
        restart(scene);
      }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
