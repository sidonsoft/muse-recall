<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match - Arcade Edition</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a0f2e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 0 0 4px #ffb703, 0 0 30px rgba(255,183,3,0.6), 0 8px 30px rgba(0,0,0,.4);display:block}
  #a11y{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Memory Match arcade game"></div>
<div id="a11y" aria-live="polite">Use arrow keys to move focus, Enter or Space to flip card, R to restart</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var timeLeft = 60, maxTime = 60, timerEvent = null, timerRunning = false;
  var score = 0, combo = 0, bestCombo = 0, bestScore = 0;
  var difficulty = "normal";
  var hudTimerText, hudTimerBar, hudTimerBarBg, hudScorePts, hudComboText, hudLevelText, hudBestText;
  var focusedIndex = 0;
  var audioCtx = null;
  var flashRect = null;

  function create() {
    var s = this;
    initAudio();
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    s.cameras.main.setBackgroundColor("#fdeec9");
  }

  function initAudio() {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  function resumeAudio() {
    if (audioCtx && audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
  }
  function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function sfxFlip() { playTone(650, 0.1, "sine", 0.18); playTone(900, 0.07, "triangle", 0.1); }
  function sfxMatch() { playTone(523, 0.14, "sine", 0.26); setTimeout(function(){ playTone(659, 0.14, "sine", 0.26); }, 90); setTimeout(function(){ playTone(784, 0.28, "sine", 0.32); }, 180); }
  function sfxMismatch() { playTone(180, 0.25, "sawtooth", 0.18); setTimeout(function(){ playTone(120, 0.35, "square", 0.14); }, 120); }
  function sfxCombo(n) { playTone(400 + n * 70, 0.18, "triangle", 0.22); setTimeout(function(){ playTone(600 + n * 70, 0.18, "sine", 0.18); }, 80); }
  function sfxTick() { playTone(1100, 0.06, "square", 0.12); }
  function sfxWin() { [0,2,4,7,9,12].forEach(function(semi,i){ setTimeout(function(){ playTone(440 * Math.pow(2, semi/12), 0.32, "sine", 0.28); }, i * 110); }); }
  function sfxLose() { playTone(280, 0.4, "sawtooth", 0.22); setTimeout(function(){ playTone(180, 0.6, "sawtooth", 0.22); }, 220); }
  function sfxTimeBonus() { playTone(800, 0.12, "sine", 0.2); setTimeout(function(){ playTone(1000, 0.12, "sine", 0.2); }, 100); }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    var arcade = scene.add.graphics().setDepth(2);
    arcade.lineStyle(4, 0xffb703, 0.9);
    arcade.strokeRoundedRect(6, 6, W - 12, H - 12, 18);
    arcade.lineStyle(2, 0xffffff, 0.35);
    arcade.strokeRoundedRect(10, 10, W - 20, H - 20, 16);
    for (var sx = 0; sx < W; sx += 28) {
      arcade.fillStyle(0xffffff, 0.04);
      arcade.fillRect(sx, 0, 1, H);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    scene.add.text(24, 44, "ARCADE", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "13px", color: "#ff006e", fontStyle: "bold", backgroundColor: "#fff0f5" }).setOrigin(0, 0).setPadding(6,2,6,2);
    hudMoves = scene.add.text(24, 68, "Moves: 0", textStyle(18));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(18));
    hudMsg = scene.add.text(W - 24, 48, "Tap a card!", textStyle(20, "#7a4a2b")).setOrigin(1, 0.5);
    hudScorePts = scene.add.text(W - 24, 72, "★ 0", Object.assign(textStyle(22), { color: "#ffb703", stroke: "#5b3a29", strokeThickness: 3 })).setOrigin(1, 0.5);
    hudComboText = scene.add.text(W - 24, 96, "", Object.assign(textStyle(16), { color: "#ff006e", backgroundColor: "#fff0f5" })).setOrigin(1, 0.5).setPadding(6,2,6,2).setVisible(false);
    hudLevelText = scene.add.text(W - 24, 118, "LVL 1", textStyle(14, "#5da85f")).setOrigin(1, 0.5);
    hudBestText = scene.add.text(24, 112, "Best: 0", textStyle(14, "#8a6a4a")).setOrigin(0, 0.5);
    var timerBg = scene.add.graphics();
    timerBg.fillStyle(0xffffff, 1); timerBg.fillRoundedRect(W/2 - 100, 148, 200, 18, 9);
    timerBg.lineStyle(2, 0x5b3a29, 1); timerBg.strokeRoundedRect(W/2 - 100, 148, 200, 18, 9);
    hudTimerBarBg = timerBg;
    hudTimerBar = scene.add.graphics();
    hudTimerBar.fillStyle(0x5da85f, 1); hudTimerBar.fillRoundedRect(W/2 - 98, 150, 196, 14, 7);
    hudTimerText = scene.add.text(W/2, 138, "⏱ 60s", textStyle(16, "#5b3a29")).setOrigin(0.5);
    var btn = scene.add.container(W - 110, 132);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-56, -18, 112, 36, 18);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(16, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-56, -18, 112, 36), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { resumeAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 172, "Find pairs fast! Combo = bonus! Don't let time run out!", textStyle(13, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    setFocus(0);
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    var focusRing = scene.add.graphics();
    focusRing.lineStyle(4, 0xffb703, 1); focusRing.strokeRoundedRect(-w/2 - 4, -h/2 - 4, w + 8, h + 8, 24);
    focusRing.setVisible(false);
    cont.add([focusRing, showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, focusRing: focusRing, idx: idx, x: x, y: y, w: w, h: h };
    cont.on("pointerdown", function () { resumeAudio(); onCard(scene, card); setFocus(idx); });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) cont.setScale(1.03); });
    cont.on("pointerout", function () { cont.setScale(1); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 110, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 110, onComplete: done || function () {} });
    }});
  }

  function startTimer(scene) {
    stopTimer(scene);
    if (difficulty === "easy") maxTime = 75;
    else if (difficulty === "hard") maxTime = 45;
    else maxTime = 60;
    timeLeft = maxTime;
    timerRunning = true;
    updateTimerHud();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!timerRunning || !started) return;
      timeLeft--;
      updateTimerHud();
      if (timeLeft <= 10 && timeLeft > 0) {
        sfxTick();
        if (scene.cameras.main) scene.cameras.main.shake(70, 0.004);
        doFlash(scene, 0xffb703);
      }
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimerHud();
        showGameOver(scene);
      }
    }});
  }

  function stopTimer() {
    timerRunning = false;
    if (timerEvent) { timerEvent.remove(); timerEvent = null; }
  }

  function updateTimerHud() {
    if (!hudTimerText) return;
    hudTimerText.setText("⏱ " + timeLeft + "s");
    var pct = Phaser.Math.Clamp(timeLeft / maxTime, 0, 1);
    if (hudTimerBar) {
      hudTimerBar.clear();
      var col = pct > 0.5 ? 0x5da85f : pct > 0.25 ? 0xffb703 : 0xe63946;
      hudTimerBar.fillStyle(col, 1);
      hudTimerBar.fillRoundedRect(W/2 - 98, 150, 196 * pct, 14, 7);
      if (pct < 0.25) {
        hudTimerBar.setAlpha(0.75 + Math.sin(Date.now()/140) * 0.25);
      } else {
        hudTimerBar.setAlpha(1);
      }
    }
    if (hudTimerText) {
      hudTimerText.setColor(timeLeft <= 10 ? "#e63946" : timeLeft <= 25 ? "#ff7b00" : "#5b3a29");
      hudTimerText.setScale(timeLeft <= 10 ? 1.15 : 1);
    }
  }

  function addTime(sec, scene, x, y) {
    var before = timeLeft;
    timeLeft = Phaser.Math.Clamp(timeLeft + sec, 0, maxTime);
    updateTimerHud();
    if (sec > 0) {
      showFloatingText(scene, "+" + sec + "s", x, y - 40, "#5da85f", 20);
      sfxTimeBonus();
      doFlash(scene, 0x5da85f);
    } else if (sec < 0) {
      showFloatingText(scene, sec + "s", x, y - 40, "#e63946", 20);
    }
  }

  function showFloatingText(scene, txt, x, y, color, size) {
    var t = scene.add.text(x, y, txt, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: (size || 24) + "px", color: color || "#fff", fontStyle: "bold", stroke: "#000", strokeThickness: 3 }).setOrigin(0.5).setDepth(25);
    scene.tweens.add({ targets: t, y: y - 55, alpha: 0, scale: 1.15, duration: 750, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function doShake(scene, intensity) {
    if (scene.cameras.main) scene.cameras.main.shake(140, intensity || 0.009);
  }

  function doFlash(scene, color) {
    var f = scene.add.graphics().setDepth(24);
    f.fillStyle(color || 0xffffff, 0.28);
    f.fillRect(0, 0, W, H);
    scene.tweens.add({ targets: f, alpha: 0, duration: 220, onComplete: function () { f.destroy(); } });
  }

  function createBurst(scene, x, y, emoji) {
    for (var i = 0; i < 10; i++) {
      var p = scene.add.text(x, y, emoji || ["\u2B50","✨","💥","🌟"][i % 4], { fontSize: "24px" }).setOrigin(0.5).setDepth(26);
      var ang = (i / 10) * Math.PI * 2 + Math.random() * 0.4;
      var dist = Phaser.Math.Between(45, 95);
      scene.tweens.add({ targets: p, x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist, alpha: 0, scale: 0.3, rotation: Phaser.Math.Between(-1,1), duration: Phaser.Math.Between(450, 750), ease: "Cubic.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function updateComboHud() {
    if (!hudComboText) return;
    if (combo >= 2) {
      var mult = (1 + Math.floor(combo / 2) * 0.5).toFixed(1);
      hudComboText.setText("🔥 COMBO x" + combo + " (" + mult + "x)");
      hudComboText.setVisible(true);
      hudComboText.setScale(1.25);
      if (hudComboText.scene) hudComboText.scene.tweens.add({ targets: hudComboText, scale: 1, duration: 220, ease: "Back.easeOut" });
    } else if (combo === 0) {
      hudComboText.setVisible(false);
    }
  }

  function setFocus(idx) {
    if (!cards.length) return;
    focusedIndex = Phaser.Math.Clamp(idx, 0, cards.length - 1);
    cards.forEach(function (c, i) {
      if (c.focusRing) c.focusRing.setVisible(i === focusedIndex && started && !c.matched && !endOverlay.visible);
    });
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (startOverlay && startOverlay.visible) {
        if (e.key === "Enter" || e.key === " ") {
          resumeAudio();
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Go! Go! Go!");
          startTimer(scene);
          setFocus(0);
          e.preventDefault();
        }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.key === "Enter" || e.key === " " || e.key === "r" || e.key === "R") {
          resumeAudio();
          restart(scene);
          e.preventDefault();
        }
        return;
      }
      if (!started) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        var next = focusedIndex + 1;
        if (next >= cards.length) next = 0;
        setFocus(next);
        e.preventDefault();
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        var prev = focusedIndex - 1;
        if (prev < 0) prev = cards.length - 1;
        setFocus(prev);
        e.preventDefault();
      } else if (e.key === "Enter" || e.key === " ") {
        var c = cards[focusedIndex];
        if (c) onCard(scene, c);
        e.preventDefault();
      } else if (e.key === "r" || e.key === "R") {
        restart(scene);
        e.preventDefault();
      }
    });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    resumeAudio();
    sfxFlip();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        a.focusRing.setVisible(false); card.focusRing.setVisible(false);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160, ease: "Back.easeOut" });
        matches++;
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        var base = 100 + (difficulty === "hard" ? 50 : difficulty === "easy" ? -20 : 0);
        var mult = 1 + Math.floor(combo / 2) * 0.5;
        var pts = Math.round(base * mult);
        score += pts;
        if (score > bestScore) bestScore = score;
        hudScorePts.setText("★ " + score);
        hudBestText.setText("Best: " + bestScore);
        hudScore.setText("Pairs: " + matches + " / 6");
        if (combo >= 2) {
          hudMsg.setText("COMBO x" + combo + "! +" + pts + " \u{1F525}");
          sfxCombo(combo);
          showFloatingText(scene, "COMBO x" + combo + "!", (a.x + card.x)/2, (a.y + card.y)/2 - 50, "#ff006e", 26);
        } else {
          hudMsg.setText("Yay! +" + pts + " \u{1F389}");
          sfxMatch();
        }
        updateComboHud();
        createBurst(scene, a.x, a.y, a.data.emoji);
        createBurst(scene, card.x, card.y, card.data.emoji);
        doFlash(scene, 0xfff1a8);
        addTime(4, scene, card.x, card.y);
        showFloatingText(scene, "+" + pts, card.x, card.y, mult > 1 ? "#ffb703" : "#5da85f", mult > 1 ? 28 : 24);
        if (hudLevelText) hudLevelText.setText("LVL " + (1 + Math.floor(matches/2)) + " | x" + mult.toFixed(1));
        lockBoard = false;
        var nextIdx = cards.findIndex(function(c){ return !c.matched; });
        if (nextIdx !== -1) setFocus(nextIdx);
        if (matches === 6) { showWin(scene); }
        else if (matches === 3) {
          hudMsg.setText("Halfway! Keep combo! \u26A1");
          scene.time.delayedCall(600, function(){ if (started) doShake(scene, 0.005); });
        }
      }, 320);
    } else {
      combo = 0;
      updateComboHud();
      hudMsg.setText("Miss! -3s \u{1F340}");
      sfxMismatch();
      doShake(scene, 0.012);
      doFlash(scene, 0xe63946);
      addTime(-3, scene, card.x, card.y);
      if (hudLevelText) hudLevelText.setText("COMBO LOST!");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; setFocus(card.idx); });
      }, 650);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.55); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 420, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 30);
    panel.lineStyle(3, 0xff006e, 0.9); panel.strokeRoundedRect(-304, -204, 608, 408, 26);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var arcadeBadge = scene.add.text(0, -118, "★ ARCADE EDITION ★", Object.assign(textStyle(16), { color: "#ff006e", backgroundColor: "#fff0f5" })).setOrigin(0.5).setPadding(8,4,8,4);
    var sub = scene.add.text(0, -70, "Beat the clock! Build combos!\nMatch fast for bonus points!", Object.assign(textStyle(20), { align: "center", color: "#5b3a29" })).setOrigin(0.5);
    var row = scene.add.text(0, -10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "42px" }).setOrigin(0.5);
    var feat = scene.add.text(0, 32, "⏱ 60s  •  🔥 Combo x2.5  •  +4s per pair  •  -3s on miss", textStyle(13, "#8a6a4a")).setOrigin(0.5);
    var diffLabel = scene.add.text(0, 62, "Choose difficulty:", textStyle(14, "#5b3a29")).setOrigin(0.5);
    var diffs = ["easy","normal","hard"];
    var diffNames = ["EASY 75s", "NORMAL 60s", "HARD 45s"];
    var diffBtns = [];
    diffs.forEach(function(d, i){
      var bx = -160 + i * 160;
      var b = scene.add.graphics();
      var isSel = d === difficulty;
      b.fillStyle(isSel ? 0xffb703 : 0xffffff, 1); b.fillRoundedRect(bx - 70, 80, 140, 36, 18);
      b.lineStyle(3, isSel ? 0xff006e : 0x5da85f, 1); b.strokeRoundedRect(bx - 70, 80, 140, 36, 18);
      var t = scene.add.text(bx, 98, diffNames[i], textStyle(13, isSel ? "#5b3a29" : "#5b3a29")).setOrigin(0.5);
      b.setInteractive(new Phaser.Geom.Rectangle(bx - 70, 80, 140, 36), Phaser.Geom.Rectangle.Contains);
      b.on("pointerdown", function(){
        difficulty = d;
        diffBtns.forEach(function(o, j){
          o.bg.clear();
          var sel = diffs[j] === difficulty;
          o.bg.fillStyle(sel ? 0xffb703 : 0xffffff, 1); o.bg.fillRoundedRect(-70, 80, 140, 36, 18);
          o.bg.lineStyle(3, sel ? 0xff006e : 0x5da85f, 1); o.bg.strokeRoundedRect(-70, 80, 140, 36, 18);
        });
        resumeAudio(); playTone(700, 0.08, "sine", 0.15);
      });
      diffBtns.push({bg: b, tx: t});
      startOverlay.add([b, t]);
    });
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 130, 260, 60, 30);
    btnBg.lineStyle(3, 0xffffff, 0.9); btnBg.strokeRoundedRect(-130, 130, 260, 60, 30);
    var btnTx = scene.add.text(0, 160, "\u25B6  START!", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 200, "Arrows + Enter to play  •  R to restart", textStyle(12, "#8a6a4a")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, arcadeBadge, sub, row, feat, diffLabel, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 130, 260, 60), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      resumeAudio();
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("GO! GO! GO! \u26A1");
      startTimer(scene);
      setFocus(0);
    });
    btnBg.on("pointerover", function(){ btnBg.setScale(1.04); });
    btnBg.on("pointerout", function(){ btnBg.setScale(1); });
    scene.tweens.add({ targets: arcadeBadge, scale: { from: 1, to: 1.08 }, duration: 600, yoyo: true, repeat: -1 });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.6); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    endTitle = scene.add.text(0, -120, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -20, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 70, 260, 60, 30);
    var btnTx = scene.add.text(0, 100, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint2 = scene.add.text(0, 150, "Press Enter or R to restart", textStyle(12, "#8a6a4a")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint2]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 70, 260, 60), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { resumeAudio(); restart(scene); });
    btnBg.on("pointerover", function(){ btnBg.setScale(1.05); });
    btnBg.on("pointerout", function(){ btnBg.setScale(1); });
  }

  function showWin(scene) {
    stopTimer(scene);
    var timeBonus = timeLeft * 10;
    var finalScore = score + timeBonus;
    if (finalScore > bestScore) bestScore = finalScore;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var rank = finalScore >= 900 ? "S" : finalScore >= 700 ? "A" : finalScore >= 500 ? "B" : "C";
    var rankColor = rank === "S" ? "GOLD!" : rank === "A" ? "Great!" : "Nice!";
    endTitle.setText("\u{1F389} ARCADE WIN! " + rank + " \u{1F389}");
    endDetail.setText(
      "Score: " + score + " + Time Bonus " + timeBonus + " = " + finalScore + "\n" +
      "Moves: " + moves + "  " + "\u2B50".repeat(stars) + "  |  Best Combo x" + bestCombo + "\n" +
      "Time left: " + timeLeft + "s  |  Rank: " + rank + " - " + rankColor + "\n" +
      "Difficulty: " + difficulty.toUpperCase()
    );
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 280, ease: "Back.easeOut" });
    hudMsg.setText("RANK " + rank + "! \u{1F389}");
    hudBestText.setText("Best: " + bestScore);
    sfxWin();
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "💥", "🔥"][i % 6], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-100, 100), rotation: Phaser.Math.Between(-2,2), duration: Phaser.Math.Between(1200, 2400), delay: i * 40, onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
    doFlash(scene, 0xffffff);
    doShake(scene, 0.006);
  }

  function showGameOver(scene) {
    stopTimer(scene);
    started = false; lockBoard = true;
    endTitle.setText("\u23F0 TIME'S UP!");
    endDetail.setText(
      "Out of time!\n" +
      "Score: " + score + "  |  Pairs: " + matches + " / 6\n" +
      "Best Combo x" + bestCombo + "  |  Moves: " + moves + "\n" +
      "Try again? Pick EASY for 75s!"
    );
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    sfxLose();
    doShake(scene, 0.015);
    doFlash(scene, 0xe63946);
    cards.forEach(function(c){
      if (!c.matched) {
        scene.tweens.add({ targets: c.view, angle: Phaser.Math.Between(-8,8), duration: 120, yoyo: true, repeat: 2 });
      }
    });
  }

  function restart(scene) {
    stopTimer(scene);
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    score = 0; combo = 0; bestCombo = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudMsg.setText("GO! GO! GO! \u26A1");
    hudScorePts.setText("★ 0"); hudComboText.setVisible(false); hudLevelText.setText("LVL 1");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    resumeAudio();
    sfxFlip();
  }

  function update() {
    if (timerRunning && started) {
      updateTimerHud();
    }
  }
})();
</script>
</body>
</html>
