<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E0F2FE;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  #aria-live{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game"></div>
<div id="aria-live" aria-live="polite" aria-atomic="true"></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F420}", name: "Tropical Fish" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F9AD}", name: "Seal" },
    { emoji: "\u{1F421}", name: "Blowfish" },
    { emoji: "\u{1F990}", name: "Shrimp" }
  ];
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3, name: "Coral Reef" },
    { pairs: 8, cols: 4, rows: 4, name: "Deep Blue" },
    { pairs: 10, cols: 5, rows: 4, name: "Abyss Zone" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, levelIndex = 0;
  var hudMoves, hudScore, hudLevel, hudStreak, hudMsg, hudProgress, endOverlay, endTitle, endDetail, startOverlay, levelOverlay, levelTitle, levelDetail;
  var focusRing = null, focusedIndex = 0;
  var bubbles = [], waveOffset = 0;
  var ariaLive = document.getElementById("aria-live");

  function announce(msg) {
    if (ariaLive) { ariaLive.textContent = msg; }
  }

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeLevelOverlay(s);
    makeEndOverlay(s);
    createBubbles(s);
    setupKeyboard(s);
    updateFocusRing();
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xBAE6FD, 1); g.fillRect(0, 0, W, 170);
    g.fillStyle(0x7DD3FC, 1); g.fillRect(0, 140, W, 40);
    g.fillStyle(0x4EA8DE, 1);
    g.fillEllipse(780, 95, 120, 70); g.fillEllipse(740, 105, 90, 50);
    g.fillStyle(0xFFFFFF, 0.9); g.fillEllipse(780, 95, 70, 36); g.fillEllipse(750, 85, 50, 28);
    g.fillStyle(0x0EA5E9, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x0284C7, 1); g.fillRect(0, 620, W, 80);
    g.fillStyle(0xFDE68A, 0.35); g.fillEllipse(200, 660, 300, 40); g.fillEllipse(650, 670, 400, 50);
    // coral and seaweed
    g.fillStyle(0xF472B6, 1);
    g.fillEllipse(90, 600, 40, 70); g.fillEllipse(110, 580, 30, 50); g.fillEllipse(70, 590, 28, 48);
    g.fillStyle(0xFB7185, 1);
    g.fillEllipse(820, 610, 50, 80); g.fillEllipse(845, 590, 34, 60);
    g.fillStyle(0x34D399, 1);
    g.fillRect(300, 540, 10, 80); g.fillRect(315, 520, 8, 100); g.fillRect(330, 550, 9, 70);
    g.fillRect(700, 530, 10, 90); g.fillRect(715, 510, 8, 110);
    // gentle waves lines
    g.lineStyle(3, 0xFFFFFF, 0.45);
    for (var wy = 180; wy <= 210; wy += 12) {
      g.beginPath();
      g.moveTo(0, wy);
      for (var x = 0; x <= W; x += 20) {
        g.lineTo(x, wy + Math.sin((x + wy * 3) * 0.02) * 6);
      }
      g.strokePath();
    }
    // sand details
    g.fillStyle(0xFFFFFF, 0.5);
    for (var i = 0; i < 12; i++) {
      g.fillCircle(40 + i * 78 + (i % 2) * 20, 640 + Math.sin(i) * 10, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Arcade Match", textStyle(30, "#102A43")).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level 1 \u2013 Coral Reef", textStyle(18, "#0EA5E9")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 76, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 100, "Score: 0", textStyle(20, "#102A43"));
    hudStreak = scene.add.text(24, 124, "Streak: 0  Best: 0", textStyle(16, "#334155"));
    hudProgress = scene.add.text(W - 24, 52, "Pairs: 0 / 6", textStyle(20, "#102A43")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 82, "Tap a card!", textStyle(18, "#0EA5E9")).setOrigin(1, 0.5);
    // progress dots
    var btn = scene.add.container(W - 110, 122);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -22, 172, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(18, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.05); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find pairs to power up your combo! No rush, just explore.", textStyle(16, "#475569")).setOrigin(0.5);
  }

  function getLevel() {
    return LEVELS[levelIndex] || LEVELS[LEVELS.length - 1];
  }

  function shuffledDeck() {
    var lvl = getLevel();
    var pool = OCEAN_ANIMALS.slice(0, lvl.pairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var lvl = getLevel();
    var deck = shuffledDeck();
    var cols = lvl.cols, rows = lvl.rows;
    var cw, ch, gx, gy, padX, padY;
    if (lvl.pairs === 6) { cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16; }
    else if (lvl.pairs === 8) { cw = 185; ch = 110; gx = 62; gy = 185; padX = 22; padY = 14; }
    else { cw = 150; ch = 105; gx = 48; gy = 185; padX = 16; padY = 12; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    updateFocusRing();
    hudProgress.setText("Pairs: 0 / " + lvl.pairs);
    hudLevel.setText("Level " + (levelIndex + 1) + " \u2013 " + lvl.name);
    announce("Level " + (levelIndex + 1) + " " + lvl.name + " with " + lvl.pairs + " pairs");
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    back.fillStyle(0xBAE6FD, 1); back.fillRoundedRect(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 12);
    back.fillStyle(0xFFFFFF, 0.9);
    back.fillCircle(-w / 5, -h / 6, 10); back.fillCircle(w / 6, h / 8, 7); back.fillCircle(0, h / 5, 11);
    back.fillStyle(0xFFFFFF, 0.55); back.fillCircle(-w / 8, h / 4, 4); back.fillCircle(w / 4, -h / 5, 5);
    var paw = scene.add.text(0, -4, "\u{2B50}", { fontSize: (w > 160 ? "42px" : "32px") }).setOrigin(0.5);
    paw.setAlpha(0.95);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xBAE6FD, 0x7DD3FC, 0xCFFAFE, 0xE0E7FF, 0xFEF3C7, 0xFCE7F3, 0xDCFCE7, 0xFFEDD5, 0xE0F2FE];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    fg.lineStyle(2, 0x4EA8DE, 0.25); fg.strokeRoundedRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14, 14);
    var emoSize = w > 160 ? "56px" : "44px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 160 ? 18 : 15, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () {
      if (!card.matched && !card.faceUp) {
        scene.tweens.add({ targets: cont, scale: 1.04, duration: 120, ease: "Sine.easeOut" });
      }
    });
    cont.on("pointerout", function () {
      scene.tweens.add({ targets: cont, scale: 1, duration: 120 });
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, ease: "Sine.easeIn", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Sine.easeOut", onComplete: done || function () {} });
    }});
  }

  function showComboPopup(scene, x, y, text, color) {
    var t = scene.add.text(x, y, text, textStyle(22, color || "#0EA5E9")).setOrigin(0.5).setDepth(15);
    t.setAlpha(0); t.setScale(0.7);
    scene.tweens.add({ targets: t, alpha: 1, scale: 1, y: y - 18, duration: 280, ease: "Back.easeOut", onComplete: function () {
      scene.tweens.add({ targets: t, alpha: 0, y: y - 36, duration: 400, delay: 500, onComplete: function () { t.destroy(); } });
    }});
  }

  function spawnBubbles(scene, x, y, count) {
    for (var i = 0; i < count; i++) {
      var b = scene.add.graphics().setDepth(12);
      var r = Phaser.Math.Between(6, 12);
      b.fillStyle(0xFFFFFF, 0.85); b.fillCircle(0, 0, r);
      b.fillStyle(0xBAE6FD, 0.5); b.fillCircle(0, 0, r - 3);
      b.x = x + Phaser.Math.Between(-30, 30); b.y = y;
      scene.tweens.add({ targets: b, y: y - Phaser.Math.Between(60, 100), x: b.x + Phaser.Math.Between(-20, 20), alpha: 0, scale: 1.2, duration: Phaser.Math.Between(700, 1100), ease: "Sine.easeOut", onComplete: (function (g) { return function () { g.destroy(); }; })(b) });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    focusedIndex = card.index;
    updateFocusRing();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u{1F30A}"); announce("Revealed " + card.data.name + ", pick another"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        scene.tweens.add({ targets: [a.view, card.view], angle: { from: -2, to: 2 }, yoyo: true, duration: 160 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var base = 100;
        var bonus = streak > 1 ? (streak - 1) * 30 : 0;
        var gained = base + bonus;
        score += gained;
        hudScore.setText("Score: " + score);
        hudStreak.setText("Streak: " + streak + "  Best: " + bestStreak);
        hudProgress.setText("Pairs: " + matches + " / " + getLevel().pairs);
        spawnBubbles(scene, card.view.x, card.view.y, 8);
        spawnBubbles(scene, a.view.x, a.view.y, 8);
        if (streak >= 2) {
          var comboText = streak === 2 ? "Nice Combo! +" + gained : streak === 3 ? "Super Combo! +" + gained : "Mega Wave! +" + gained;
          showComboPopup(scene, W / 2, 185, comboText, "#0EA5E9");
          hudMsg.setText(comboText + " \u2728");
        } else {
          hudMsg.setText("Yay! A pair! +" + gained + " \u{1F389}");
          showComboPopup(scene, card.view.x, card.view.y - 70, "+" + gained, "#0284C7");
        }
        announce("Match! " + card.data.name + " pair found, score " + score);
        lockBoard = false;
        if (matches === getLevel().pairs) {
          setTimeout(function () {
            if (levelIndex < LEVELS.length - 1) { showLevelComplete(scene); }
            else { showWin(scene); }
          }, 600);
        }
      }, 320);
    } else {
      hudMsg.setText("So close! Try again \u{1F340}");
      announce("Not a match, keep exploring");
      streak = 0;
      hudStreak.setText("Streak: " + streak + "  Best: " + bestStreak);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(); });
      }, 750);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-310, -200, 620, 400, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 28);
    var title = scene.add.text(0, -130, "\u{1F30A} Ocean Arcade Match", textStyle(36, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Dive in and find the ocean friends!", textStyle(20, "#0EA5E9")).setOrigin(0.5);
    var desc = scene.add.text(0, -30, "Match pairs to build your score and streak.\n3 arcade levels \u2014 Coral Reef to Abyss Zone!\nNo timers, no penalties \u2014 just pure fun.", Object.assign(textStyle(17, "#334155"), { align: "center", lineSpacing: 6 })).setOrigin(0.5);
    var row = scene.add.text(0, 45, "\u{1F419} \u{1F42C} \u{1F422} \u{1F980} \u{1F420} \u{1F433}", { fontSize: "38px" }).setOrigin(0.5);
    var dots = scene.add.text(0, 85, "\u25CF \u25CB \u25CB   Level 1 \u00B7 6 pairs", textStyle(14, "#64748B")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 110, 260, 62, 31);
    var btnTx = scene.add.text(0, 141, "\u25B6  Dive In!", textStyle(26, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, desc, row, dots, btnBg, btnTx]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-W / 2, -H / 2, W, H), Phaser.Geom.Rectangle.Contains);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 110, 260, 62), Phaser.Geom.Rectangle.Contains);
    function startGame() {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card! \u{1F30A}");
      announce("Game started, level 1 Coral Reef");
      updateFocusRing();
    }
    btnBg.on("pointerdown", startGame);
    bg.on("pointerdown", startGame);
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) { startGame(); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay.visible) { startGame(); }
    });
  }

  function makeLevelOverlay(scene) {
    levelOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-300, -180, 600, 360, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 28);
    levelTitle = scene.add.text(0, -110, "Level Complete! \u{1F30A}", textStyle(34, "#102A43")).setOrigin(0.5);
    levelDetail = scene.add.text(0, -40, "", Object.assign(textStyle(19, "#334155"), { align: "center", lineSpacing: 6 })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 70, 280, 62, 31);
    var btnTx = scene.add.text(0, 101, "Next Dive \u2192", textStyle(24, "#ffffff")).setOrigin(0.5);
    levelOverlay.add([bg, panel, levelTitle, levelDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 70, 280, 62), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { nextLevel(scene); });
    bg.setInteractive(new Phaser.Geom.Rectangle(-W / 2, -H / 2, W, H), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { nextLevel(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-310, -190, 620, 380, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -190, 620, 380, 28);
    endTitle = scene.add.text(0, -115, "\u{1F389} Arcade Champion! \u{1F389}", textStyle(32, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(19, "#334155"), { align: "center", lineSpacing: 6 })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 70, 280, 62, 31);
    var btnTx = scene.add.text(0, 101, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 70, 280, 62), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showLevelComplete(scene) {
    var lvl = getLevel();
    var bonus = 300 + streak * 20;
    score += bonus;
    hudScore.setText("Score: " + score);
    levelTitle.setText("Level " + (levelIndex + 1) + " Complete! \u2728");
    levelDetail.setText(lvl.name + " cleared!\nPairs: " + matches + "  Moves: " + moves + "\nLevel Bonus: +" + bonus + "  Total: " + score + "\n\nReady for " + LEVELS[levelIndex + 1].name + "?");
    levelOverlay.setVisible(true);
    scene.tweens.add({ targets: levelOverlay, scale: { from: 0.9, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("Amazing! Next level awaits \u{1F30A}");
    announce("Level " + (levelIndex + 1) + " complete, bonus " + bonus + " points");
    for (var i = 0; i < 24; i++) {
      var p = scene.add.text(Phaser.Math.Between(40, W - 40), -20, ["\u{1F30A}", "\u2B50", "\u{1F41A}", "\u2728"][i % 4], { fontSize: "24px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1400, 2200), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showWin(scene) {
    var stars = score >= 1800 ? 3 : (score >= 1200 ? 2 : 1);
    endDetail.setText("You conquered all 3 ocean zones!\nFinal Score: " + score + "  " + "\u2B50".repeat(stars) + "\nTotal Moves: " + moves + "  Best Streak: " + bestStreak + "\n\nYou are a true Ocean Explorer!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 280, ease: "Back.easeOut" });
    hudMsg.setText("Arcade Champion! \u{1F389}");
    announce("You win! Final score " + score);
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}", "\u2728"][i % 5], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1300, 2400), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function nextLevel(scene) {
    levelOverlay.setVisible(false);
    levelIndex++;
    matches = 0; firstPick = null; lockBoard = false;
    hudProgress.setText("Pairs: 0 / " + getLevel().pairs);
    hudMsg.setText("Level " + (levelIndex + 1) + "! Find the pairs \u{1F50D}");
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    scene.tweens.add({ targets: scene.cameras.main, alpha: { from: 0.6, to: 1 }, duration: 300 });
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0; firstPick = null; lockBoard = false; started = true; levelIndex = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudStreak.setText("Streak: 0  Best: 0"); hudMsg.setText("Tap a card! \u{1F30A}");
    endOverlay.setVisible(false);
    levelOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    announce("Game restarted");
  }

  function createBubbles(scene) {
    for (var i = 0; i < 14; i++) {
      var b = scene.add.graphics().setDepth(1);
      var r = Phaser.Math.Between(4, 9);
      b.fillStyle(0xFFFFFF, Phaser.Math.FloatBetween(0.35, 0.7)); b.fillCircle(0, 0, r);
      b.fillStyle(0xBAE6FD, 0.3); b.fillCircle(0, 0, r - 2);
      b.x = Phaser.Math.Between(20, W - 20); b.y = Phaser.Math.Between(200, H);
      b.speed = Phaser.Math.FloatBetween(0.3, 0.9);
      b.drift = Phaser.Math.FloatBetween(-0.4, 0.4);
      bubbles.push(b);
    }
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (!started) { return; }
      if (levelOverlay.visible || endOverlay.visible) {
        if (e.code === "Enter" || e.code === "Space") {
          if (levelOverlay.visible) { nextLevel(scene); }
          else if (endOverlay.visible) { restart(scene); }
        }
        return;
      }
      if (cards.length === 0) { return; }
      var lvl = getLevel();
      var cols = lvl.cols;
      if (e.code === "ArrowRight") { focusedIndex = (focusedIndex + 1) % cards.length; updateFocusRing(); }
      else if (e.code === "ArrowLeft") { focusedIndex = (focusedIndex - 1 + cards.length) % cards.length; updateFocusRing(); }
      else if (e.code === "ArrowDown") { focusedIndex = (focusedIndex + cols) % cards.length; updateFocusRing(); }
      else if (e.code === "ArrowUp") { focusedIndex = (focusedIndex - cols + cards.length) % cards.length; updateFocusRing(); }
      else if (e.code === "Enter" || e.code === "Space") {
        var c = cards[focusedIndex];
        if (c) { onCard(scene, c); }
      }
    });
    // focus ring graphics
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function updateFocusRing() {
    if (!focusRing || cards.length === 0) { return; }
    if (!started) { focusRing.setVisible(false); return; }
    var c = cards[focusedIndex];
    if (!c || c.matched) {
      // find next unmatched
      for (var i = 0; i < cards.length; i++) {
        var idx = (focusedIndex + i) % cards.length;
        if (!cards[idx].matched) { focusedIndex = idx; c = cards[idx]; break; }
      }
    }
    if (!c) { focusRing.setVisible(false); return; }
    focusRing.clear();
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(c.view.x - c.view.displayWidth / 2 - 6, c.view.y - c.view.displayHeight / 2 - 6, c.view.displayWidth + 12, c.view.displayHeight + 12, 20);
    focusRing.setVisible(true);
  }

  function update() {
    waveOffset += 0.02;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed;
      b.x += Math.sin(waveOffset + i) * 0.3 + b.drift * 0.1;
      if (b.y < 170) { b.y = H - 10; b.x = Phaser.Math.Between(20, W - 20); }
    }
    if (focusRing && focusRing.visible) {
      focusRing.setAlpha(0.85 + Math.sin(waveOffset * 2) * 0.15);
    }
  }
})();
</script>
</body>
</html>
