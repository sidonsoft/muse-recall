<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Memory Match game with easy and hard challenge modes"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F436}", name: "Dog" },
    { emoji: "\u{1F431}", name: "Cat" }
  ];
  var W = 900, H = 700;
  var difficulty = 'easy';
  var totalPairs = 6;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var easyBtnBg, hardBtnBg, easyBtnLabel, hardBtnLabel;
  var hudEasyBg, hudHardBg, hudEasyLabel, hudHardLabel;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xCAF0F8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE8A3, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xFFFFFF, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x457B9D, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x90E0EF, 0xADE8F4, 0x48CAE4];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x457B9D, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFE8A3, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudMode = scene.add.text(24, 112, "Mode: Easy \u2022 6 pairs", textStyle(16, "#1D3557"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#1D3557")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the animal pairs!", textStyle(20, "#1D3557")).setOrigin(0.5);
    var toggleY = 148;
    var toggleX = W - 110;
    var toggle = scene.add.container(toggleX, toggleY);
    hudEasyBg = scene.add.graphics();
    hudEasyBg.fillStyle(0x4EA8DE, 1); hudEasyBg.fillRoundedRect(-86, -16, 84, 32, 16);
    hudEasyBg.lineStyle(2, 0x4EA8DE, 1); hudEasyBg.strokeRoundedRect(-86, -16, 84, 32, 16);
    hudEasyLabel = scene.add.text(-44, 0, "Easy", textStyle(14, "#ffffff")).setOrigin(0.5);
    hudHardBg = scene.add.graphics();
    hudHardBg.fillStyle(0xFFFFFF, 1); hudHardBg.fillRoundedRect(2, -16, 84, 32, 16);
    hudHardBg.lineStyle(2, 0x4EA8DE, 1); hudHardBg.strokeRoundedRect(2, -16, 84, 32, 16);
    hudHardLabel = scene.add.text(44, 0, "Hard", textStyle(14, "#4EA8DE")).setOrigin(0.5);
    toggle.add([hudEasyBg, hudEasyLabel, hudHardBg, hudHardLabel]);
    hudEasyBg.setInteractive(new Phaser.Geom.Rectangle(-86, -16, 84, 32), Phaser.Geom.Rectangle.Contains);
    hudHardBg.setInteractive(new Phaser.Geom.Rectangle(2, -16, 84, 32), Phaser.Geom.Rectangle.Contains);
    hudEasyBg.on("pointerdown", function(){ handleHudDifficulty(scene, 'easy'); });
    hudHardBg.on("pointerdown", function(){ handleHudDifficulty(scene, 'hard'); });
    updateHudToggle();
  }

  function handleHudDifficulty(scene, mode){
    if(difficulty === mode && started) return;
    setDifficulty(mode);
    if(started){
      restart(scene);
    }
  }

  function setDifficulty(mode){
    difficulty = mode;
    totalPairs = (mode === 'hard' ? 8 : 6);
    if(hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    if(hudMode) hudMode.setText(mode === 'hard' ? "Mode: Hard \u2022 8 pairs" : "Mode: Easy \u2022 6 pairs");
    updateHudToggle();
    updateStartSelection();
  }

  function updateHudToggle(){
    if(!hudEasyBg || !hudHardBg) return;
    hudEasyBg.clear();
    hudHardBg.clear();
    if(difficulty === 'easy'){
      hudEasyBg.fillStyle(0x4EA8DE, 1); hudEasyBg.fillRoundedRect(-86, -16, 84, 32, 16);
      hudEasyBg.lineStyle(2, 0x4EA8DE, 1); hudEasyBg.strokeRoundedRect(-86, -16, 84, 32, 16);
      hudEasyLabel.setColor("#ffffff");
      hudHardBg.fillStyle(0xFFFFFF, 1); hudHardBg.fillRoundedRect(2, -16, 84, 32, 16);
      hudHardBg.lineStyle(2, 0x4EA8DE, 1); hudHardBg.strokeRoundedRect(2, -16, 84, 32, 16);
      hudHardLabel.setColor("#4EA8DE");
    } else {
      hudEasyBg.fillStyle(0xFFFFFF, 1); hudEasyBg.fillRoundedRect(-86, -16, 84, 32, 16);
      hudEasyBg.lineStyle(2, 0x4EA8DE, 1); hudEasyBg.strokeRoundedRect(-86, -16, 84, 32, 16);
      hudEasyLabel.setColor("#4EA8DE");
      hudHardBg.fillStyle(0x4EA8DE, 1); hudHardBg.fillRoundedRect(2, -16, 84, 32, 16);
      hudHardBg.lineStyle(2, 0x4EA8DE, 1); hudHardBg.strokeRoundedRect(2, -16, 84, 32, 16);
      hudHardLabel.setColor("#ffffff");
    }
  }

  function updateStartSelection(){
    if(!easyBtnBg || !hardBtnBg) return;
    easyBtnBg.clear();
    hardBtnBg.clear();
    if(difficulty === 'easy'){
      easyBtnBg.fillStyle(0x4EA8DE, 1); easyBtnBg.fillRoundedRect(-250, 70, 230, 60, 30);
      easyBtnBg.lineStyle(3, 0x102A43, 0.15); easyBtnBg.strokeRoundedRect(-250, 70, 230, 60, 30);
      easyBtnLabel.setColor("#ffffff");
      hardBtnBg.fillStyle(0xFFFFFF, 1); hardBtnBg.fillRoundedRect(20, 70, 230, 60, 30);
      hardBtnBg.lineStyle(3, 0x4EA8DE, 1); hardBtnBg.strokeRoundedRect(20, 70, 230, 60, 30);
      hardBtnLabel.setColor("#4EA8DE");
    } else {
      easyBtnBg.fillStyle(0xFFFFFF, 1); easyBtnBg.fillRoundedRect(-250, 70, 230, 60, 30);
      easyBtnBg.lineStyle(3, 0x4EA8DE, 1); easyBtnBg.strokeRoundedRect(-250, 70, 230, 60, 30);
      easyBtnLabel.setColor("#4EA8DE");
      hardBtnBg.fillStyle(0x4EA8DE, 1); hardBtnBg.fillRoundedRect(20, 70, 230, 60, 30);
      hardBtnBg.lineStyle(3, 0x102A43, 0.15); hardBtnBg.strokeRoundedRect(20, 70, 230, 60, 30);
      hardBtnLabel.setColor("#ffffff");
    }
  }

  function shuffledDeck() {
    var pool = ANIMALS.slice(0, totalPairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var layout = difficulty === 'hard' ? { cols:4, rows:4, cw:170, ch:115, gx:62, gy:185, padX:18, padY:12 } : { cols:4, rows:3, cw:185, ch:140, gx:62, gy:195, padX:22, padY:16 };
    var cols = layout.cols, cw = layout.cw, ch = layout.ch, gx = layout.gx, gy = layout.gy, padX = layout.padX, padY = layout.padY;
    var deck = shuffledDeck();
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xFFFFFF, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0x90E0EF, 0xADE8F4, 0x48CAE4, 0xBEE9E8, 0xD6EAF8, 0xA8DADC, 0xEAF6FF];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(36, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -95, "Flip the cards and find\nall the animal pairs!", Object.assign(textStyle(20, "#1D3557"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var choose = scene.add.text(0, 30, "Choose your challenge:", textStyle(18, "#102A43")).setOrigin(0.5);
    var easyDesc = scene.add.text(-135, 155, "6 pairs \u2022 Easy", textStyle(14, "#1D3557")).setOrigin(0.5);
    var hardDesc = scene.add.text(135, 155, "8 pairs \u2022 Hard", textStyle(14, "#1D3557")).setOrigin(0.5);
    var hint = scene.add.text(0, 185, "Hard has more cards to remember \u2014 same gentle fun!", textStyle(14, "#457B9D")).setOrigin(0.5);
    easyBtnBg = scene.add.graphics();
    easyBtnBg.fillStyle(0x4EA8DE, 1); easyBtnBg.fillRoundedRect(-250, 70, 230, 60, 30);
    easyBtnLabel = scene.add.text(-135, 100, "\u25B6 Easy", textStyle(22, "#ffffff")).setOrigin(0.5);
    hardBtnBg = scene.add.graphics();
    hardBtnBg.fillStyle(0xFFFFFF, 1); hardBtnBg.fillRoundedRect(20, 70, 230, 60, 30);
    hardBtnBg.lineStyle(3, 0x4EA8DE, 1); hardBtnBg.strokeRoundedRect(20, 70, 230, 60, 30);
    hardBtnLabel = scene.add.text(135, 100, "\u2605 Hard", textStyle(22, "#4EA8DE")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, choose, easyBtnBg, easyBtnLabel, hardBtnBg, hardBtnLabel, easyDesc, hardDesc, hint]);
    easyBtnBg.setInteractive(new Phaser.Geom.Rectangle(-250, 70, 230, 60), Phaser.Geom.Rectangle.Contains);
    hardBtnBg.setInteractive(new Phaser.Geom.Rectangle(20, 70, 230, 60), Phaser.Geom.Rectangle.Contains);
    easyBtnBg.on("pointerdown", function () { setDifficulty('easy'); startGame(scene); });
    hardBtnBg.on("pointerdown", function () { setDifficulty('hard'); startGame(scene); });
    easyBtnBg.on("pointerover", function(){ easyBtnBg.setScale(1.02); });
    easyBtnBg.on("pointerout", function(){ easyBtnBg.setScale(1); });
    hardBtnBg.on("pointerover", function(){ hardBtnBg.setScale(1.02); });
    hardBtnBg.on("pointerout", function(){ hardBtnBg.setScale(1); });
    updateStartSelection();
  }

  function startGame(scene){
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText(difficulty === 'hard' ? "Hard mode! Find 8 pairs!" : "Tap a card!");
    buildBoard(scene);
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + totalPairs);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars;
    if(totalPairs === 6){ stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1); }
    else { stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1); }
    endDetail.setText("You found all " + totalPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\n" + (difficulty === 'hard' ? "Amazing! Hard mode cleared!" : "Great job!"));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText(difficulty === 'hard' ? "Hard mode! Find 8 pairs!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
  }

  function setupKeyboard(scene){
    if(scene.input && scene.input.keyboard){
      scene.input.keyboard.on('keydown-ENTER', function(){ if(startOverlay && startOverlay.visible){ startGame(scene); } });
      scene.input.keyboard.on('keydown-SPACE', function(){ if(startOverlay && startOverlay.visible){ startGame(scene); } });
      scene.input.keyboard.on('keydown-E', function(){ setDifficulty('easy'); });
      scene.input.keyboard.on('keydown-H', function(){ setDifficulty('hard'); });
      scene.input.keyboard.on('keydown-R', function(){ restart(scene); });
    }
    document.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && startOverlay && startOverlay.visible){
        startGame(scene);
      }
      if(e.key.toLowerCase() === 'e' && startOverlay && startOverlay.visible){ setDifficulty('easy'); }
      if(e.key.toLowerCase() === 'h' && startOverlay && startOverlay.visible){ setDifficulty('hard'); }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
