<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F4FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F433}", name: "Whale" }
  ];
  var W = 900, H = 700;
  var difficulty = "normal";
  var totalPairs = 6;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var modeLabel, modeBg;
  var startNormalBg, startHardBg, startNormalBtn, startHardBtn;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xCAF0F8, 1); g.fillRect(0, 0, W, 320);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44); g.fillEllipse(620, 70, 100, 36);
    g.fillStyle(0x90E0EF, 1); g.fillRect(0, 300, W, 180);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(0, 340, W, 140);
    g.fillStyle(0x0077B6, 1); g.fillRect(0, 420, W, 60);
    g.fillStyle(0xFFFFFF, 0.9);
    for (var wx = 0; wx < W; wx += 80) {
      g.fillEllipse(wx + 40, 340, 80, 18);
      g.fillEllipse(wx + 20, 360, 60, 14);
    }
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xCAF0F8, 1); g.fillEllipse(W / 2, 680, 900, 120);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(90, 300, 50, 170);
    g.fillStyle(0xFF6B6B, 1); g.fillRect(90, 330, 50, 18); g.fillRect(90, 365, 50, 18); g.fillRect(90, 400, 50, 18);
    g.fillStyle(0x102A43, 1); g.fillTriangle(70, 300, 115, 250, 160, 300);
    g.fillStyle(0xFFD166, 1); g.fillCircle(115, 270, 12);
    g.fillStyle(0x8B5A2B, 1);
    for (var x = 320; x <= 860; x += 60) { g.fillRect(x - 6, 500, 12, 70); }
    g.fillStyle(0xA67C52, 1); g.fillRect(300, 515, W - 300, 14); g.fillRect(300, 545, W - 300, 14);
    var cols = [0xFF9AA2, 0xFFB7B2, 0xFFDAC1, 0xE2F0CB];
    for (var i = 0; i < 8; i++) {
      var fx = 40 + i * 110, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x4EA8DE, 0.15); g.fillCircle(fx, fy - 10, 18);
      g.fillStyle(cols[i % 4], 1); g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFE066, 1); g.fillCircle(fx, fy - 8, 4);
    }
    g.fillStyle(0xFFFFFF, 0.5);
    g.fillCircle(200, 380, 8); g.fillCircle(220, 360, 5); g.fillCircle(500, 400, 10); g.fillCircle(650, 350, 6); g.fillCircle(750, 390, 7);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(22));
    hudMode = scene.add.text(24, 118, "Mode: Normal (6 pairs)", textStyle(16, "#0077B6")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#0077B6")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var mBtn = scene.add.container(W - 300, 116);
    modeBg = scene.add.graphics();
    modeBg.fillStyle(0x4EA8DE, 1); modeBg.fillRoundedRect(-86, -26, 172, 52, 26);
    modeLabel = scene.add.text(0, 0, "Hard Mode", textStyle(18, "#ffffff")).setOrigin(0.5);
    mBtn.add([modeBg, modeLabel]);
    modeBg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    modeBg.on("pointerdown", function () { toggleDifficulty(scene); });
    modeBg.on("pointerover", function () { mBtn.setScale(1.06); });
    modeBg.on("pointerout", function () { mBtn.setScale(1); });
    scene.add.text(W / 2, 168, "Find all pairs! Normal: 6 pairs \u2022 Hard: 8 pairs", textStyle(18, "#0077B6")).setOrigin(0.5);
    if (scene.input.keyboard) {
      scene.input.keyboard.on("keydown-R", function () { restart(scene); });
      scene.input.keyboard.on("keydown-M", function () { toggleDifficulty(scene); });
      scene.input.keyboard.on("keydown-H", function () { toggleDifficulty(scene); });
    }
  }

  function updateHudMode() {
    if (hudMode) {
      hudMode.setText(difficulty === "hard" ? "Mode: Hard Challenge (8 pairs)" : "Mode: Normal (6 pairs)");
    }
    if (hudScore) {
      hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    }
    if (modeLabel) {
      modeLabel.setText(difficulty === "hard" ? "Normal Mode" : "Hard Mode");
    }
    updateStartOverlayMode();
  }

  function toggleDifficulty(scene) {
    difficulty = difficulty === "normal" ? "hard" : "normal";
    totalPairs = difficulty === "hard" ? 8 : 6;
    updateHudMode();
    if (started) {
      restart(scene);
    }
  }

  function setDifficulty(scene, diff) {
    difficulty = diff;
    totalPairs = diff === "hard" ? 8 : 6;
    updateHudMode();
  }

  function shuffledDeck() {
    var count = totalPairs;
    var poolShuffled = ANIMALS.slice();
    for (var i = poolShuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = poolShuffled[i]; poolShuffled[i] = poolShuffled[j]; poolShuffled[j] = t;
    }
    var selected = poolShuffled.slice(0, count);
    var deck = [];
    selected.forEach(function (a, idx) {
      deck.push({ key: idx, emoji: a.emoji, name: a.name });
      deck.push({ key: idx, emoji: a.emoji, name: a.name });
    });
    for (var k = deck.length - 1; k > 0; k--) {
      var r = Math.floor(Math.random() * (k + 1));
      var tmp = deck[k]; deck[k] = deck[r]; deck[r] = tmp;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (difficulty === "hard") {
      cols = 4; rows = 4; cw = 185; ch = 108; gx = 62; gy = 185; padX = 22; padY = 12;
    } else {
      cols = 4; rows = 3; cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xFFFFFF, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F41A}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0xADE8F4, 0x90E0EF, 0x48CAE4, 0xE0FBFC, 0xB9FBC0, 0xFFD6A5, 0xE4C1F9, 0xFFC8DD, 0xD8F3B8];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "56px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F41A}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F30A} Ocean Match \u{1F419}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -90, "Flip the cards and find all pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -40, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F419} \u{1F422}", { fontSize: "36px" }).setOrigin(0.5);
    var hint = scene.add.text(0, -5, "Choose your challenge:", textStyle(18, "#0077B6")).setOrigin(0.5);
    startNormalBg = scene.add.graphics();
    startNormalBg.fillStyle(0x4EA8DE, 1); startNormalBg.fillRoundedRect(-260, 20, 240, 60, 30);
    startNormalBg.lineStyle(4, 0xFFFFFF, 1); startNormalBg.strokeRoundedRect(-260, 20, 240, 60, 30);
    var normalTx = scene.add.text(-140, 50, "Normal \u2022 6 pairs", textStyle(18, "#ffffff")).setOrigin(0.5);
    var normalSub = scene.add.text(-140, 68, "4 \u00D7 3 board", textStyle(12, "#ffffff")).setOrigin(0.5);
    startHardBg = scene.add.graphics();
    startHardBg.fillStyle(0xFFFFFF, 1); startHardBg.fillRoundedRect(20, 20, 240, 60, 30);
    startHardBg.lineStyle(4, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(20, 20, 240, 60, 30);
    var hardTx = scene.add.text(140, 50, "Hard \u2022 8 pairs", textStyle(18, "#102A43")).setOrigin(0.5);
    var hardSub = scene.add.text(140, 68, "4 \u00D7 4 challenge", textStyle(12, "#102A43")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 110, 260, 70, 35);
    var btnTx = scene.add.text(0, 145, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    var help = scene.add.text(0, 195, "Press M to toggle Hard Mode \u2022 R to restart \u2022 Enter to start", textStyle(13, "#0077B6")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, startNormalBg, normalTx, normalSub, startHardBg, hardTx, hardSub, btnBg, btnTx, help]);
    startNormalBtn = { bg: startNormalBg, tx: normalTx, sub: normalSub };
    startHardBtn = { bg: startHardBg, tx: hardTx, sub: hardSub };
    startNormalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 20, 240, 60), Phaser.Geom.Rectangle.Contains);
    startNormalBg.on("pointerdown", function () { setDifficulty(scene, "normal"); });
    startHardBg.setInteractive(new Phaser.Geom.Rectangle(20, 20, 240, 60), Phaser.Geom.Rectangle.Contains);
    startHardBg.on("pointerdown", function () { setDifficulty(scene, "hard"); });
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 110, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      buildBoard(scene);
      updateHudMode();
    });
    btnBg.on("pointerover", function () { btnBg.setScale(1.02); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); });
    if (scene.input.keyboard) {
      scene.input.keyboard.on("keydown-ENTER", function () {
        if (startOverlay.visible) {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Tap a card!");
          buildBoard(scene);
          updateHudMode();
        }
      });
      scene.input.keyboard.on("keydown-SPACE", function () {
        if (startOverlay.visible) {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Tap a card!");
          buildBoard(scene);
          updateHudMode();
        }
      });
    }
    updateStartOverlayMode();
  }

  function updateStartOverlayMode() {
    if (!startNormalBg || !startHardBg) { return; }
    if (difficulty === "normal") {
      startNormalBg.clear(); startNormalBg.fillStyle(0x4EA8DE, 1); startNormalBg.fillRoundedRect(-260, 20, 240, 60, 30); startNormalBg.lineStyle(4, 0xFFFFFF, 1); startNormalBg.strokeRoundedRect(-260, 20, 240, 60, 30);
      startHardBg.clear(); startHardBg.fillStyle(0xFFFFFF, 1); startHardBg.fillRoundedRect(20, 20, 240, 60, 30); startHardBg.lineStyle(4, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(20, 20, 240, 60, 30);
      if (startNormalBtn) { startNormalBtn.tx.setColor("#ffffff"); startNormalBtn.sub.setColor("#ffffff"); }
      if (startHardBtn) { startHardBtn.tx.setColor("#102A43"); startHardBtn.sub.setColor("#102A43"); }
    } else {
      startNormalBg.clear(); startNormalBg.fillStyle(0xFFFFFF, 1); startNormalBg.fillRoundedRect(-260, 20, 240, 60, 30); startNormalBg.lineStyle(4, 0x4EA8DE, 1); startNormalBg.strokeRoundedRect(-260, 20, 240, 60, 30);
      startHardBg.clear(); startHardBg.fillStyle(0x4EA8DE, 1); startHardBg.fillRoundedRect(20, 20, 240, 60, 30); startHardBg.lineStyle(4, 0xFFFFFF, 1); startHardBg.strokeRoundedRect(20, 20, 240, 60, 30);
      if (startNormalBtn) { startNormalBtn.tx.setColor("#102A43"); startNormalBtn.sub.setColor("#102A43"); }
      if (startHardBtn) { startHardBtn.tx.setColor("#ffffff"); startHardBtn.sub.setColor("#ffffff"); }
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var modeHint = scene.add.text(0, 135, "Press M for Hard Challenge", textStyle(14, "#0077B6")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, modeHint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var threshold1 = Math.ceil(totalPairs * 1.7);
    var threshold2 = Math.ceil(totalPairs * 2.6);
    var stars = moves <= threshold1 ? 3 : (moves <= threshold2 ? 2 : 1);
    var modeText = difficulty === "hard" ? "Hard Challenge \u2022 8 pairs" : "Normal \u2022 6 pairs";
    endDetail.setText("You found all " + totalPairs + " pairs!\n" + modeText + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateHudMode();
  }

  function update() {}
})();
</script>
</body>
</html>
