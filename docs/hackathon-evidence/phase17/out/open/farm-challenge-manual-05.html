<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #gameWrap{position:relative;width:100vw;height:100vh;max-width:900px;max-height:700px;display:flex;align-items:center;justify-content:center}
  #game{width:100%;height:100%}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #a11yBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
  #a11yBar button{font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;font-size:14px;font-weight:700;padding:8px 14px;border-radius:20px;border:2px solid transparent;cursor:pointer;transition:transform .15s, background .15s, border-color .15s}
  #a11yBar button:focus{outline:3px solid #102A43;outline-offset:2px}
  #domEasy{background:#4EA8DE;color:#fff;border-color:#4EA8DE}
  #domHard{background:#fff;color:#102A43;border-color:#4EA8DE}
  #a11yBar button[aria-pressed="true"]{background:#4EA8DE;color:#fff;border-color:#102A43;transform:scale(1.03)}
  #a11yBar button[aria-pressed="false"]{background:#fff;color:#102A43}
</style>
</head>
<body>
<div id="gameWrap">
  <div id="game"></div>
  <div id="a11yBar" role="toolbar" aria-label="Choose challenge level">
    <button type="button" id="domEasy" aria-pressed="true" aria-label="Calm Bay easy mode with 6 pairs">Calm Bay · 6 pairs</button>
    <button type="button" id="domHard" aria-pressed="false" aria-label="Deep Dive hard mode with 8 pairs">Deep Dive · 8 pairs</button>
  </div>
  <div id="liveRegion" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;"></div>
</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F419}", name: "Octo" },
    { emoji: "\u{1F422}", name: "Turtle" }
  ];
  var W = 900, H = 700;
  var DIFFICULTIES = {
    easy: { pairs: 6, cols: 4, rows: 3, label: "Calm Bay", desc: "6 pairs" },
    hard: { pairs: 8, cols: 4, rows: 4, label: "Deep Dive", desc: "8 pairs" }
  };
  var currentDifficulty = "easy";

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FB",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var focusRing = null, focusedIndex = 0, gameScene = null;
  var modeToggleBtn = null, modeToggleLabel = null;

  function create() {
    var s = this;
    gameScene = s;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    if (s.game.canvas) {
      s.game.canvas.setAttribute("tabindex", "0");
      s.game.canvas.setAttribute("aria-label", "Farmyard Memory Match game board. Use arrow keys and Enter to flip cards. Press 1 for Calm Bay, 2 for Deep Dive.");
    }
    syncDomButtons();
    announce("Welcome to Farmyard Memory Match. Choose Calm Bay with 6 pairs or Deep Dive with 8 pairs. No timers, no penalties.");
    setupDomButtons();
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FB, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 0, W, 470);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44); g.fillEllipse(620, 95, 100, 36);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x8ECAE6, 1); g.fillRect(0, 470, W, 18);
    g.lineStyle(4, 0xB8E0F0, 1);
    for (var wy = 490; wy < 560; wy += 18) {
      for (var wx = 0; wx < W; wx += 80) {
        g.beginPath(); g.moveTo(wx, wy); g.lineTo(wx + 20, wy - 6); g.lineTo(wx + 40, wy); g.strokePath();
      }
    }
    g.fillStyle(0xFFFFFF, 1); g.fillRect(80, 330, 90, 140);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 360, 90, 18); g.fillRect(80, 400, 90, 18); g.fillRect(80, 440, 90, 18);
    g.fillStyle(0x102A43, 1); g.fillRect(105, 390, 40, 80);
    g.fillStyle(0xFFB703, 1); g.fillCircle(125, 340, 22);
    g.fillStyle(0xFFFFFF, 1); g.fillCircle(125, 340, 12);
    g.fillStyle(0x4EA8DE, 1); g.fillTriangle(60, 330, 125, 250, 190, 330);
    g.fillStyle(0xE9C46A, 1); g.fillEllipse(420, 500, 120, 28);
    g.fillStyle(0xFFFFFF, 1); g.fillTriangle(420, 500, 380, 440, 460, 440);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(418, 440, 4, 60);
    g.fillStyle(0x2A9D8F, 1);
    for (var i = 0; i < 6; i++) {
      var sx = 300 + i * 110;
      g.fillEllipse(sx, 640, 18, 50); g.fillEllipse(sx + 12, 650, 14, 40);
    }
    var cols = [0xF49AC1, 0xFF9D76, 0x9AD0F5, 0xC5A3FF, 0xFFE08A];
    for (var j = 0; j < 10; j++) {
      var fx = 30 + j * 88, fy = 620 + (j % 2) * 30;
      g.fillStyle(0x5DA85F, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[j % cols.length], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFF200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    g.fillStyle(0xF0E6D3, 1); g.fillCircle(700, 660, 10); g.fillCircle(750, 670, 8); g.fillCircle(820, 655, 9);
  }

  function drawFarm(scene) { drawOcean(scene); }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 110, "Mode: Calm Bay \u00B7 6 pairs", textStyle(16, "#4EA8DE")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var modeBtn = scene.add.container(W - 300, 116);
    var modeBg = scene.add.graphics();
    modeBg.fillStyle(0xFFFFFF, 1); modeBg.fillRoundedRect(-86, -26, 172, 52, 26);
    modeBg.lineStyle(3, 0x4EA8DE, 1); modeBg.strokeRoundedRect(-86, -26, 172, 52, 26);
    var modeLabel = scene.add.text(0, 0, "Try Deep Dive", textStyle(16, "#102A43")).setOrigin(0.5);
    modeBtn.add([modeBg, modeLabel]);
    modeBg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    modeBg.on("pointerdown", function () {
      var next = currentDifficulty === "easy" ? "hard" : "easy";
      setDifficulty(scene, next, true);
    });
    modeBg.on("pointerover", function () { modeBtn.setScale(1.04); });
    modeBg.on("pointerout", function () { modeBtn.setScale(1); });
    modeToggleBtn = modeBg;
    modeToggleLabel = modeLabel;
    updateHudMode();
    scene.add.text(W / 2, 168, "Find the pairs — no timers, no penalties, just gentle fun!", textStyle(18, "#4A6A8A")).setOrigin(0.5);
  }

  function updateHudMode() {
    var cfg = DIFFICULTIES[currentDifficulty];
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + cfg.pairs); }
    if (hudMode) { hudMode.setText("Mode: " + cfg.label + " \u00B7 " + cfg.desc); }
    if (modeToggleLabel) {
      modeToggleLabel.setText(currentDifficulty === "easy" ? "Try Deep Dive" : "Calm Bay");
    }
    syncDomButtons();
  }

  function syncDomButtons() {
    var easyBtn = document.getElementById("domEasy");
    var hardBtn = document.getElementById("domHard");
    if (!easyBtn || !hardBtn) { return; }
    var isEasy = currentDifficulty === "easy";
    easyBtn.setAttribute("aria-pressed", isEasy ? "true" : "false");
    hardBtn.setAttribute("aria-pressed", isEasy ? "false" : "true");
  }

  function shuffledDeck() {
    var cfg = DIFFICULTIES[currentDifficulty];
    var pool = ANIMALS.slice(0, cfg.pairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cfg = DIFFICULTIES[currentDifficulty];
    var cols = cfg.cols, rows = cfg.rows;
    var cw, ch, gx, gy, padX, padY;
    if (currentDifficulty === "hard") {
      cw = 170; ch = 110; gx = 70; gy = 185; padX = 18; padY = 12;
    } else {
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    focusRing = scene.add.graphics().setDepth(5);
    updateFocusRing();
    updateHudMode();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xFFFFFF, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var pawSize = w < 180 ? "44px" : "56px";
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: pawSize }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xEAF6FB, 0xD6EAF8, 0xB8E0F0, 0xA8DADC, 0xFFE8A8, 0xE4C1F9, 0xC8E7FF, 0xD8F3B8];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = w < 180 ? "52px" : "62px";
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nameSize = w < 180 ? 18 : 22;
    var nm = scene.add.text(0, 44, data.name, textStyle(nameSize)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx };
    cont.on("pointerdown", function () { setFocusedCard(idx); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Flipped " + card.data.name + ". Find its pair."); updateFocusRing(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        var cfg = DIFFICULTIES[currentDifficulty];
        hudScore.setText("Pairs: " + matches + " / " + cfg.pairs);
        hudMsg.setText(matches === cfg.pairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce(matches === cfg.pairs ? "You found a pair! " + matches + " of " + cfg.pairs + " pairs found." : "Nice! You found a pair of " + card.data.name + "s. " + matches + " of " + cfg.pairs + " pairs.");
        lockBoard = false;
        updateFocusRing();
        if (matches === cfg.pairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("So close! Try again! \u{1F340}");
      announce("Not a match. Try again. No worries, keep exploring!");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -90, "Flip the cards and find the pairs!\nNo timers, no penalties — just gentle fun.", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 10, "Choose your adventure:", textStyle(18, "#4A6A8A")).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x4EA8DE, 1); easyBg.fillRoundedRect(-260, 30, 240, 70, 20);
    var easyTx = scene.add.text(-140, 60, "Calm Bay\n6 pairs \u00B7 Easy", Object.assign(textStyle(18, "#ffffff"), { align: "center" })).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xFFFFFF, 1); hardBg.fillRoundedRect(20, 30, 240, 70, 20);
    hardBg.lineStyle(3, 0x4EA8DE, 1); hardBg.strokeRoundedRect(20, 30, 240, 70, 20);
    var hardTx = scene.add.text(140, 60, "Deep Dive\n8 pairs \u00B7 Hard", Object.assign(textStyle(18, "#102A43"), { align: "center" })).setOrigin(0.5);
    var hardBadge = scene.add.text(140, 85, "More cards, same calm play", textStyle(12, "#4A6A8A")).setOrigin(0.5);
    var startBtnBg = scene.add.graphics();
    startBtnBg.fillStyle(0x2A9D8F, 1); startBtnBg.fillRoundedRect(-130, 120, 260, 60, 30);
    var startBtnTx = scene.add.text(0, 150, "\u25B6  Start", textStyle(26, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, easyBg, easyTx, hardBg, hardTx, hardBadge, startBtnBg, startBtnTx]);
    function refreshModeButtons() {
      if (currentDifficulty === "easy") {
        easyBg.clear(); easyBg.fillStyle(0x4EA8DE, 1); easyBg.fillRoundedRect(-260, 30, 240, 70, 20);
        hardBg.clear(); hardBg.fillStyle(0xFFFFFF, 1); hardBg.fillRoundedRect(20, 30, 240, 70, 20); hardBg.lineStyle(3, 0x4EA8DE, 1); hardBg.strokeRoundedRect(20, 30, 240, 70, 20);
        easyTx.setColor("#ffffff"); hardTx.setColor("#102A43"); hardBadge.setColor("#4A6A8A");
      } else {
        easyBg.clear(); easyBg.fillStyle(0xFFFFFF, 1); easyBg.fillRoundedRect(-260, 30, 240, 70, 20); easyBg.lineStyle(3, 0x4EA8DE, 1); easyBg.strokeRoundedRect(-260, 30, 240, 70, 20);
        hardBg.clear(); hardBg.fillStyle(0x4EA8DE, 1); hardBg.fillRoundedRect(20, 30, 240, 70, 20);
        easyTx.setColor("#102A43"); hardTx.setColor("#ffffff"); hardBadge.setColor("#EAF6FB");
      }
    }
    refreshModeButtons();
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-260, 30, 240, 70), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 30, 240, 70), Phaser.Geom.Rectangle.Contains);
    startBtnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 120, 260, 60), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { setDifficulty(scene, "easy", false); refreshModeButtons(); announce("Calm Bay selected. 6 pairs. Gentle and cozy."); });
    hardBg.on("pointerdown", function () { setDifficulty(scene, "hard", false); refreshModeButtons(); announce("Deep Dive selected. 8 pairs. More to explore, no timers, no penalties."); });
    startBtnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      var cfg = DIFFICULTIES[currentDifficulty];
      announce("Game started in " + cfg.label + " mode. Find " + cfg.pairs + " pairs. Use arrow keys and Enter, or tap.");
      setFocusedCard(0);
    });
    startOverlay.refreshModeButtons = refreshModeButtons;
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var switchBg = scene.add.graphics();
    switchBg.fillStyle(0xFFFFFF, 1); switchBg.fillRoundedRect(-130, 130, 260, 50, 25);
    switchBg.lineStyle(2, 0x4EA8DE, 1); switchBg.strokeRoundedRect(-130, 130, 260, 50, 25);
    var switchTx = scene.add.text(0, 155, "Change Mode", textStyle(18, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, switchBg, switchTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    switchBg.setInteractive(new Phaser.Geom.Rectangle(-130, 130, 260, 50), Phaser.Geom.Rectangle.Contains);
    switchBg.on("pointerdown", function () {
      endOverlay.setVisible(false);
      startOverlay.setVisible(true);
      started = false; lockBoard = true;
      if (startOverlay.refreshModeButtons) { startOverlay.refreshModeButtons(); }
      announce("Choose a mode. Calm Bay or Deep Dive.");
    });
  }

  function showWin(scene) {
    var cfg = DIFFICULTIES[currentDifficulty];
    var stars = moves <= (cfg.pairs + 4) ? 3 : (moves <= (cfg.pairs + 10) ? 2 : 1);
    endDetail.setText("You found all " + cfg.pairs + " pairs in " + cfg.label + "!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nNo rush, no penalties — great exploring!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! You found all " + cfg.pairs + " pairs in " + moves + " moves in " + cfg.label + " mode.");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    var cfg = DIFFICULTIES[currentDifficulty];
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + cfg.pairs); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    setFocusedCard(0);
    announce("New game started in " + cfg.label + " mode with " + cfg.pairs + " pairs.");
  }

  function setDifficulty(scene, diff, shouldRestart) {
    if (!DIFFICULTIES[diff]) { return; }
    currentDifficulty = diff;
    updateHudMode();
    if (startOverlay && startOverlay.refreshModeButtons) { startOverlay.refreshModeButtons(); }
    if (shouldRestart) {
      moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
      var cfg = DIFFICULTIES[currentDifficulty];
      hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + cfg.pairs); hudMsg.setText("Tap a card!");
      endOverlay.setVisible(false);
      if (startOverlay) { startOverlay.setVisible(false); }
      cards.forEach(function (c) { c.view.destroy(); });
      buildBoard(scene);
      setFocusedCard(0);
      announce("Switched to " + cfg.label + " mode with " + cfg.pairs + " pairs. No timers, no penalties, just more friends to find.");
    }
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "ArrowDown") {
        if (!started || cards.length === 0) { return; }
        var cfg = DIFFICULTIES[currentDifficulty];
        var cols = cfg.cols;
        var next = focusedIndex;
        if (e.key === "ArrowRight") { next = (focusedIndex + 1) % cards.length; }
        if (e.key === "ArrowLeft") { next = (focusedIndex - 1 + cards.length) % cards.length; }
        if (e.key === "ArrowUp") { next = (focusedIndex - cols + cards.length) % cards.length; }
        if (e.key === "ArrowDown") { next = (focusedIndex + cols) % cards.length; }
        setFocusedCard(next);
      } else if (e.key === "Enter" || e.key === " ") {
        if (!started && startOverlay && startOverlay.visible) {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Tap a card!");
          setFocusedCard(0);
          announce("Game started.");
          return;
        }
        if (cards[focusedIndex]) { onCard(scene, cards[focusedIndex]); }
      } else if (e.key === "1") {
        setDifficulty(scene, "easy", !startOverlay.visible);
      } else if (e.key === "2") {
        setDifficulty(scene, "hard", !startOverlay.visible);
      } else if (e.key === "r" || e.key === "R") {
        restart(scene);
      }
    });
  }

  function setFocusedCard(idx) {
    if (idx < 0 || idx >= cards.length) { return; }
    focusedIndex = idx;
    updateFocusRing();
  }

  function updateFocusRing() {
    if (!focusRing || cards.length === 0) { return; }
    focusRing.clear();
    var card = cards[focusedIndex];
    if (!card) { return; }
    if (card.matched) {
      for (var i = 0; i < cards.length; i++) {
        var c = cards[(focusedIndex + i) % cards.length];
        if (!c.matched) { card = c; focusedIndex = (focusedIndex + i) % cards.length; break; }
      }
    }
    if (!card || card.matched) { return; }
    var w = card.view.width, h = card.view.height;
    var x = card.view.x, y = card.view.y;
    focusRing.lineStyle(4, 0x102A43, 1);
    focusRing.strokeRoundedRect(x - w / 2 - 6, y - h / 2 - 6, w + 12, h + 12, 26);
    focusRing.lineStyle(2, 0xFFFFFF, 1);
    focusRing.strokeRoundedRect(x - w / 2 - 4, y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function announce(text) {
    var el = document.getElementById("liveRegion");
    if (el) { el.textContent = text; }
  }

  function setupDomButtons() {
    var domEasy = document.getElementById("domEasy");
    var domHard = document.getElementById("domHard");
    if (domEasy) {
      domEasy.addEventListener("click", function () {
        if (gameScene) { setDifficulty(gameScene, "easy", true); } else { currentDifficulty = "easy"; syncDomButtons(); }
      });
      domEasy.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.click(); }
      });
    }
    if (domHard) {
      domHard.addEventListener("click", function () {
        if (gameScene) { setDifficulty(gameScene, "hard", true); } else { currentDifficulty = "hard"; syncDomButtons(); }
      });
      domHard.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.click(); }
      });
    }
  }

  function update() {}
})();
</script>
</body>
</html>
