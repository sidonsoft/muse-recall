<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Arcade Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F4FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;outline:none}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  #live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game" tabindex="0" aria-label="Ocean arcade memory game. Use mouse or arrow keys and Enter to flip cards. Find matching ocean animal pairs. No timers, no penalties."></div>
<div id="live" aria-live="polite"></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "🐙", name: "Octopus" },
    { emoji: "🐳", name: "Whale" },
    { emoji: "🐬", name: "Dolphin" },
    { emoji: "🐢", name: "Turtle" },
    { emoji: "🦀", name: "Crab" },
    { emoji: "🐠", name: "Fish" },
    { emoji: "🦈", name: "Shark" },
    { emoji: "🐚", name: "Shell" },
    { emoji: "⭐", name: "Starfish" },
    { emoji: "🦑", name: "Squid" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, level = 1, score = 0, combo = 0, totalPairs = 6;
  var hudMoves, hudScore, hudLevel, hudPairs, hudMsg, hudCombo, endOverlay, endTitle, endDetail, endBtnLabel, startOverlay;
  var selectedIndex = 0, focusRect = null, bubbles = [];

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    createBubbles(s);
    setupKeyboard(s);
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xB9E6FE, 1); g.fillRect(0, 0, W, 180);
    g.fillStyle(0x7CC4FA, 1); g.fillRect(0, 140, W, 40);
    g.fillStyle(0x4EA8DE, 1);
    g.fillEllipse(150, 170, 300, 40); g.fillEllipse(400, 165, 280, 36); g.fillEllipse(650, 172, 320, 38); g.fillEllipse(850, 168, 200, 30);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 190, W, 380);
    g.fillStyle(0xA8D8F0, 0.55); g.fillRect(0, 190, W, 380);
    g.fillStyle(0xE8F1F5, 1); g.fillRect(0, 570, W, 130);
    g.fillStyle(0xD0E8F2, 1); g.fillEllipse(200, 590, 400, 30); g.fillEllipse(600, 610, 500, 40); g.fillEllipse(750, 585, 300, 24);
    g.fillStyle(0x7FB8A0, 0.65);
    g.fillEllipse(40, 620, 20, 80); g.fillEllipse(60, 630, 16, 60); g.fillEllipse(860, 625, 18, 70); g.fillEllipse(840, 635, 14, 50);
    g.lineStyle(2, 0xFFFFFF, 0.14);
    for (var i = 0; i < 4; i++) { g.lineBetween(100 + i * 200, 190, 60 + i * 200, 570); }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "🌊 Ocean Arcade Match", textStyle(32)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level 1", textStyle(20));
    hudMoves = scene.add.text(24, 78, "Moves: 0", textStyle(18));
    hudPairs = scene.add.text(24, 102, "Pairs: 0 / 6", textStyle(18));
    hudScore = scene.add.text(W - 24, 52, "Score: 0", textStyle(20, "#102A43")).setOrigin(1, 0);
    hudCombo = scene.add.text(W - 24, 78, "", textStyle(16, "#4EA8DE")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 108, "Tap a card!", textStyle(18, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 136);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "↻ Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find pairs to level up! No rush, no penalties.", textStyle(16, "#5A7A94")).setOrigin(0.5);
    focusRect = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function shuffledDeck(pairCount) {
    var pool = OCEAN_ANIMALS.slice(0, pairCount);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    if (level === 1) { totalPairs = 6; }
    else if (level === 2) { totalPairs = 8; }
    else { totalPairs = 10; }
    var deck = shuffledDeck(totalPairs);
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (totalPairs === 6) { cols = 4; rows = 3; cw = 185; ch = 120; gx = 62; gy = 195; padX = 22; padY = 14; }
    else if (totalPairs === 8) { cols = 4; rows = 4; cw = 185; ch = 100; gx = 62; gy = 185; padX = 22; padY = 12; }
    else { cols = 5; rows = 4; cw = 150; ch = 100; gx = 45; gy = 185; padX = 16; padY = 12; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    hudPairs.setText("Pairs: 0 / " + totalPairs);
    hudLevel.setText("Level " + level);
    selectedIndex = 0;
    updateFocus();
    announce("Level " + level + " with " + totalPairs + " pairs. Board ready.");
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    back.fillStyle(0x7CC4FA, 0.9);
    back.fillEllipse(-w / 6, -h / 6, w / 2, 18); back.fillEllipse(w / 6, h / 8, w / 2.2, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 5, 8); back.fillCircle(w / 5, 0, 6); back.fillCircle(0, h / 4, 10);
    var paw = scene.add.text(0, -4, "🌊", { fontSize: "36px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xB9E6FE, 0xD6EAF8, 0xE8F1F5, 0xA8D8F0, 0xC2E8FF, 0xE0F6FF, 0xB0D9F0, 0xD4EAF7, 0xA0D2F0];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: "48px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 36, data.name, textStyle(16)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, ease: "Sine.easeInOut", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Sine.easeInOut", onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Flipped " + card.data.name); updateFocus(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.06, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        matches++;
        combo++;
        var pts = 100 + (combo - 1) * 20;
        score += pts;
        hudScore.setText("Score: " + score);
        hudPairs.setText("Pairs: " + matches + " / " + totalPairs);
        if (combo > 1) {
          hudCombo.setText("Combo x" + combo + "! +" + pts);
          hudMsg.setText("Great streak! 🌟");
        } else {
          hudCombo.setText("");
          hudMsg.setText("Nice pair! 🎉");
        }
        announce("Match! " + card.data.name + " pair found. Score " + score);
        lockBoard = false;
        updateFocus();
        if (matches === totalPairs) {
          if (level < 3) { showLevelComplete(scene); } else { showWin(scene); }
        }
      }, 350);
    } else {
      hudMsg.setText("So close! Try again 🌊");
      combo = 0; hudCombo.setText("");
      announce("Not a match. Keep exploring.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocus(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 28);
    var title = scene.add.text(0, -120, "🌊 Ocean Arcade Match", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Flip cards to find ocean pairs!\n3 arcade levels — more pairs each time.\nNo timers, no penalties — just fun!", Object.assign(textStyle(18), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 20, "🐙 🐳 🐬 🐢 🦀 🐠", { fontSize: "38px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 60, "Use mouse or arrow keys + Enter", textStyle(14, "#5A7A94")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 90, 260, 64, 32);
    var btnTx = scene.add.text(0, 122, "▶  Start Dive", textStyle(26, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 90, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      announce("Game started. Level 1");
      document.getElementById("game").focus();
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 28);
    endTitle = scene.add.text(0, -100, "🎉 Level Complete!", textStyle(36)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 60, 280, 64, 32);
    endBtnLabel = scene.add.text(0, 92, "➡ Next Level", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnLabel]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { if (level < 3) { nextLevel(scene); } else { restart(scene); } });
  }

  function showLevelComplete(scene) {
    var stars = moves <= totalPairs + 4 ? 3 : (moves <= totalPairs + 8 ? 2 : 1);
    endTitle.setText("🌊 Level " + level + " Complete!");
    endDetail.setText("Pairs found: " + matches + " / " + totalPairs + "\nMoves: " + moves + "  " + "⭐".repeat(stars) + "\nScore: " + score);
    endBtnLabel.setText("➡ Next Level");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.9, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Level " + level + " done! 🎉");
    announce("Level " + level + " complete. Score " + score);
    for (var i = 0; i < 20; i++) {
      var p = scene.add.text(Phaser.Math.Between(40, W - 40), H + 20, ["🫧", "⭐", "🐚", "🌊"][i % 4], { fontSize: "22px" }).setDepth(30).setAlpha(0.9);
      scene.tweens.add({ targets: p, y: -20, x: p.x + Phaser.Math.Between(-40, 40), duration: Phaser.Math.Between(1600, 2400), ease: "Sine.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showWin(scene) {
    var stars = score >= 1800 ? 3 : (score >= 1200 ? 2 : 1);
    endTitle.setText("🏆 Arcade Champion! 🏆");
    endDetail.setText("You cleared all 3 levels!\nTotal Score: " + score + "  " + "⭐".repeat(stars) + "\nTotal Moves: " + moves);
    endBtnLabel.setText("↻ Play Again");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.9, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! Amazing! 🎉");
    announce("You win! Total score " + score);
    for (var i = 0; i < 30; i++) {
      var p = scene.add.text(Math.random() * W, H + 20, ["🫧", "⭐", "🎉", "🐙", "🐬"][i % 5], { fontSize: "24px" }).setDepth(30).setAlpha(0.9);
      scene.tweens.add({ targets: p, y: -20, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1800, 2600), ease: "Sine.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    level = 1; moves = 0; matches = 0; score = 0; combo = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudCombo.setText(""); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    announce("Game restarted. Level 1");
  }

  function nextLevel(scene) {
    level++; moves = 0; matches = 0; combo = 0; firstPick = null; lockBoard = false;
    hudMoves.setText("Moves: 0"); hudCombo.setText(""); hudMsg.setText("Level " + level + "! Go!");
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function createBubbles(scene) {
    for (var i = 0; i < 12; i++) {
      var b = scene.add.text(Phaser.Math.Between(20, W - 20), Phaser.Math.Between(200, 560), "🫧", { fontSize: Phaser.Math.Between(14, 22) + "px" }).setAlpha(0.5).setDepth(1);
      b.speed = Phaser.Math.FloatBetween(0.3, 0.8);
      b.drift = Phaser.Math.FloatBetween(-0.3, 0.3);
      bubbles.push(b);
    }
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown-LEFT", function () {
      if (!started || endOverlay.visible) { return; }
      selectedIndex = (selectedIndex - 1 + cards.length) % cards.length;
      updateFocus();
    });
    scene.input.keyboard.on("keydown-RIGHT", function () {
      if (!started || endOverlay.visible) { return; }
      selectedIndex = (selectedIndex + 1) % cards.length;
      updateFocus();
    });
    scene.input.keyboard.on("keydown-UP", function () {
      if (!started || endOverlay.visible) { return; }
      var cols = totalPairs === 10 ? 5 : 4;
      selectedIndex = (selectedIndex - cols + cards.length) % cards.length;
      updateFocus();
    });
    scene.input.keyboard.on("keydown-DOWN", function () {
      if (!started || endOverlay.visible) { return; }
      var cols = totalPairs === 10 ? 5 : 4;
      selectedIndex = (selectedIndex + cols) % cards.length;
      updateFocus();
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (endOverlay.visible) { if (level < 3) { nextLevel(scene); } else { restart(scene); } return; }
      if (startOverlay && startOverlay.visible) { started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card!"); return; }
      if (!started) { return; }
      var card = cards[selectedIndex];
      if (card) { onCard(scene, card); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (endOverlay.visible) { if (level < 3) { nextLevel(scene); } else { restart(scene); } return; }
      if (startOverlay && startOverlay.visible) { started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card!"); return; }
      if (!started) { return; }
      var card = cards[selectedIndex];
      if (card) { onCard(scene, card); }
    });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
    document.getElementById("game").addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (startOverlay && startOverlay.visible) { started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card!"); }
        else if (endOverlay.visible) { if (level < 3) { nextLevel(scene); } else { restart(scene); } }
        else { var card = cards[selectedIndex]; if (card) { onCard(scene, card); } }
      }
    });
  }

  function updateFocus() {
    if (!cards.length || !focusRect) { return; }
    var card = cards[selectedIndex];
    if (!card || card.matched) {
      for (var i = 0; i < cards.length; i++) { if (!cards[i].matched) { selectedIndex = i; card = cards[i]; break; } }
    }
    if (!card) { return; }
    focusRect.clear();
    focusRect.lineStyle(4, 0x4EA8DE, 1);
    focusRect.strokeRoundedRect(card.view.x - card.view.width / 2 - 4, card.view.y - card.view.height / 2 - 4, card.view.width + 8, card.view.height + 8, 20);
    focusRect.setVisible(started && !endOverlay.visible);
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed;
      b.x += b.drift * 0.2;
      if (b.y < 180) { b.y = 560 + Math.random() * 20; b.x = Phaser.Math.Between(20, W - 20); }
    }
  }
})();
</script>
</body>
</html>
