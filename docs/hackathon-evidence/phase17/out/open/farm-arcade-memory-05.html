<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E0F2FE;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;color:#102A43}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15);display:block}
  #live{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" aria-live="polite" aria-atomic="true"></div>
<script>
(function () {
  // Design decisions: cool ocean palette #4EA8DE accent, #102A43 text
  // Children's game: no flashing effects, no countdown timers, no penalties for mistakes - only positive reinforcement
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F9AD}", name: "Seal" },
    { emoji: "\u{1F41A}", name: "Shell" },
    { emoji: "\u{2B50}", name: "Starfish" }
  ];
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3, label: "Reef Explorer" },
    { pairs: 8, cols: 4, rows: 4, label: "Deep Diver" },
    { pairs: 10, cols: 5, rows: 4, label: "Ocean Master" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E0F2FE",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, levelIndex = 0;
  var hudMoves, hudScore, hudMsg, hudLevel, hudPairs, endOverlay, endTitle, endDetail, startOverlay;
  var focusedIndex = 0;
  var waveGraphics = [];

  function announce(text) {
    var live = document.getElementById("live");
    if (live) { live.textContent = text; }
  }

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    // gentle ambient bubbles - slow, no flashing
    s.time.addEvent({ delay: 900, loop: true, callback: function () { if (started) spawnBubble(s); } });
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE0F2FE, 1); g.fillRect(0, 0, W, H);
    // sky gradient soft
    g.fillStyle(0xB8E6FE, 1); g.fillRect(0, 0, W, 150);
    g.fillStyle(0xD6EAF8, 1); g.fillEllipse(180, 90, 160, 50); g.fillEllipse(240, 80, 130, 44);
    g.fillStyle(0xFFFFFF, 0.9); g.fillEllipse(560, 70, 140, 40); g.fillEllipse(620, 85, 100, 30);
    // distant ocean
    g.fillStyle(0x7EC8E3, 1); g.fillRect(0, 150, W, 40);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(0, 470, W, 230);
    // sand bottom
    g.fillStyle(0xF0E6D3, 1); g.fillRect(0, 620, W, 80);
    g.fillStyle(0xE8DCC6, 1); g.fillEllipse(200, 640, 180, 30); g.fillEllipse(650, 650, 220, 36);
    // gentle waves - static soft shapes, no flashing
    g.fillStyle(0xA8D8F0, 1);
    g.fillEllipse(150, 175, 220, 22); g.fillEllipse(400, 180, 260, 18); g.fillEllipse(700, 172, 200, 20);
    g.fillStyle(0x8ECAE6, 1);
    g.fillEllipse(300, 190, 180, 14); g.fillEllipse(600, 188, 200, 16);
    // seaweed
    g.fillStyle(0x5FA8B5, 1);
    g.fillEllipse(40, 600, 18, 60); g.fillEllipse(55, 590, 14, 50);
    g.fillEllipse(840, 605, 16, 55); g.fillEllipse(860, 595, 12, 45);
    g.fillStyle(0x7FB069, 1);
    g.fillEllipse(30, 610, 10, 40); g.fillEllipse(870, 615, 10, 38);
    // decorative shells on sand
    g.fillStyle(0xFFD6A5, 1); g.fillCircle(120, 635, 8); g.fillCircle(750, 640, 7);
    g.fillStyle(0xFFC8DD, 1); g.fillCircle(500, 645, 6);
  }

  function spawnBubble(scene) {
    var x = Phaser.Math.Between(40, 860);
    var y = 620;
    var size = Phaser.Math.Between(6, 14);
    var b = scene.add.graphics();
    b.fillStyle(0xFFFFFF, 0.55); b.fillCircle(0, 0, size);
    b.lineStyle(2, 0x4EA8DE, 0.35); b.strokeCircle(0, 0, size);
    b.setPosition(x, y);
    b.setDepth(1);
    scene.tweens.add({
      targets: b,
      y: 160 + Math.random() * 40,
      x: x + Phaser.Math.Between(-30, 30),
      alpha: 0,
      duration: Phaser.Math.Between(3500, 5500),
      ease: "Sine.easeOut",
      onComplete: function () { b.destroy(); }
    });
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Arcade", textStyle(32, "#102A43")).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level 1 \u2014 Reef Explorer", textStyle(18, "#102A43"));
    hudMoves = scene.add.text(24, 78, "Moves: 0", textStyle(20, "#102A43"));
    hudPairs = scene.add.text(24, 102, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 126, "Score: 0", textStyle(20, "#102A43"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var comboBg = scene.add.graphics();
    comboBg.fillStyle(0x4EA8DE, 0.12); comboBg.fillRoundedRect(W - 220, 78, 196, 28, 14);
    scene.add.text(W - 122, 92, "Find pairs \u2022 Earn waves!", textStyle(14, "#102A43")).setOrigin(0.5);

    var btn = scene.add.container(W - 110, 128);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -22, 172, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.04); });
    bg.on("pointerout", function () { btn.setScale(1); });
    // accessible keyboard for restart
    bg.setData("role", "button");
    bg.setData("label", "Restart game");

    scene.add.text(W / 2, 168, "Match ocean friends \u2022 Level up for bigger reefs!", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var level = LEVELS[levelIndex];
    var pool = OCEAN_ANIMALS.slice(0, level.pairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var level = LEVELS[levelIndex];
    var cols = level.cols, rows = level.rows;
    var total = level.pairs * 2;
    // responsive grid centered
    var cw = cols === 5 ? 150 : 185;
    var ch = rows === 4 ? 110 : 140;
    var padX = 16, padY = 14;
    var gridW = cols * cw + (cols - 1) * padX;
    var gridH = rows * ch + (rows - 1) * padY;
    var gx = (W - gridW) / 2;
    var gy = 195;
    // adjust gy if grid tall
    if (rows === 4) { gy = 185; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    updateFocusVisual();
    hudPairs.setText("Pairs: " + matches + " / " + level.pairs);
    hudLevel.setText("Level " + (levelIndex + 1) + " \u2014 " + level.label);
    announce("Level " + (levelIndex + 1) + " " + level.label + " with " + level.pairs + " pairs");
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    // gentle wave pattern on back - no flashing
    back.fillStyle(0xffffff, 0.22);
    back.fillEllipse(-w / 6, -h / 6, 40, 18); back.fillEllipse(w / 5, h / 8, 36, 14);
    back.fillStyle(0xffffff, 0.18); back.fillCircle(0, h / 4, 10);
    var paw = scene.add.text(0, -4, "\u{1F30A}", { fontSize: w > 160 ? "48px" : "40px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xD6EAF8, 0xFFF6D5, 0xD8F3DC, 0xE0E7FF, 0xFFE4EC, 0xD1F0E0, 0xE8F8FF, 0xFFF0C9, 0xE0F7FA];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: w > 160 ? "54px" : "46px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 160 ? 18 : 16, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    // focus ring - subtle, not flashing
    var focusRing = scene.add.graphics();
    focusRing.lineStyle(4, 0x4EA8DE, 0); focusRing.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 20);
    cont.add([showBack, face, focusRing]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, focusRing: focusRing, data: data, matched: false, faceUp: false, index: idx, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    // keyboard activation via explicit handler
    cont.on("pointerover", function () { focusedIndex = idx; updateFocusVisual(); });
    return card;
  }

  function updateFocusVisual() {
    cards.forEach(function (c, i) {
      if (!c.focusRing) return;
      c.focusRing.clear();
      if (i === focusedIndex && !c.matched) {
        c.focusRing.lineStyle(4, 0x4EA8DE, 1); c.focusRing.strokeRoundedRect(-c.w / 2 - 4, -c.h / 2 - 4, c.w + 8, c.h + 8, 20);
      } else {
        c.focusRing.lineStyle(4, 0x4EA8DE, 0); c.focusRing.strokeRoundedRect(-c.w / 2 - 4, -c.h / 2 - 4, c.w + 8, c.h + 8, 20);
      }
    });
  }

  function setupKeyboard(scene) {
    document.addEventListener("keydown", function (e) {
      if (!started) {
        if (e.key === "Enter" || e.key === " ") {
          if (startOverlay && startOverlay.visible) {
            e.preventDefault();
            started = true; lockBoard = false;
            startOverlay.setVisible(false);
            hudMsg.setText("Tap a card!");
            announce("Game started");
          }
        }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          restart(scene);
        }
        return;
      }
      if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        e.preventDefault();
        focusedIndex = (focusedIndex + 1) % cards.length;
        updateFocusVisual();
        announce("Focused " + cards[focusedIndex].data.name);
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        focusedIndex = (focusedIndex - 1 + cards.length) % cards.length;
        updateFocusVisual();
        announce("Focused " + cards[focusedIndex].data.name);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        var card = cards[focusedIndex];
        if (card) onCard(scene, card);
      } else if (e.key.toLowerCase() === "r") {
        e.preventDefault();
        restart(scene);
      }
    });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, ease: "Sine.easeInOut", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Sine.easeInOut", onComplete: done || function () {} });
    }});
  }

  function showScorePopup(scene, x, y, text, color) {
    var t = scene.add.text(x, y, text, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "22px", color: color || "#102A43", fontStyle: "bold", stroke: "#ffffff", strokeThickness: 4 }).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 50, alpha: 0, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    announce(card.data.name + " revealed");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u{1F30A}"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        // gentle bounce - no flashing
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.06, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        matches++;
        streak++;
        // arcade scoring - only positive, no penalties
        var base = 100;
        var bonus = 0;
        if (streak >= 2) { bonus = 20 * streak; }
        // extra wave bonus every 2 pairs
        if (matches % 2 === 0) { bonus += 30; }
        score += base + bonus;
        hudScore.setText("Score: " + score);
        hudPairs.setText("Pairs: " + matches + " / " + LEVELS[levelIndex].pairs);
        if (bonus > 0) {
          hudMsg.setText("Wave Bonus! +" + (base + bonus) + " \u2728");
          showScorePopup(scene, card.view.x, card.view.y - 70, "+" + (base + bonus), "#102A43");
        } else {
          hudMsg.setText("Splash! You found a pair! \u{1F389}");
          showScorePopup(scene, card.view.x, card.view.y - 70, "+" + base, "#102A43");
        }
        announce("Match! " + card.data.name + " pair found. Score " + score);
        // gentle bubble celebration - slow, no flashing
        for (var i = 0; i < 6; i++) {
          (function (idx) {
            var bx = (a.view.x + card.view.x) / 2 + Phaser.Math.Between(-40, 40);
            var by = (a.view.y + card.view.y) / 2;
            var bub = scene.add.graphics().setDepth(12);
            bub.fillStyle(0x4EA8DE, 0.9); bub.fillCircle(0, 0, 5);
            bub.setPosition(bx, by);
            scene.tweens.add({ targets: bub, y: by - 60 - idx * 10, alpha: 0, scale: 1.4, duration: 800 + idx * 80, onComplete: function () { bub.destroy(); } });
          })(i);
        }
        lockBoard = false;
        updateFocusVisual();
        if (matches === LEVELS[levelIndex].pairs) {
          setTimeout(function () { handleLevelComplete(scene); }, 600);
        }
      }, 320);
    } else {
      // no penalty - encouraging message only, streak stays (no deduction)
      hudMsg.setText("Keep exploring! \u{1F30A}");
      announce("Not a match, keep trying");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusVisual(); });
      }, 750);
    }
  }

  function handleLevelComplete(scene) {
    if (levelIndex < LEVELS.length - 1) {
      // level up - arcade excitement without timers or flashing
      levelIndex++;
      matches = 0;
      streak = 0;
      hudMsg.setText("Level Up! \u{1F30A} Next reef!");
      announce("Level up to " + LEVELS[levelIndex].label);
      // gentle level transition
      var overlay = scene.add.container(W / 2, H / 2).setDepth(18);
      var bg = scene.add.graphics();
      bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
      var panel = scene.add.graphics();
      panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-260, -110, 520, 220, 24);
      panel.lineStyle(4, 0x4EA8DE, 1); panel.strokeRoundedRect(-260, -110, 520, 220, 24);
      var t1 = scene.add.text(0, -60, "\u{1F30A} Level Up!", textStyle(36, "#102A43")).setOrigin(0.5);
      var t2 = scene.add.text(0, -10, LEVELS[levelIndex].label, textStyle(24, "#4EA8DE")).setOrigin(0.5);
      var t3 = scene.add.text(0, 30, LEVELS[levelIndex].pairs + " pairs \u2022 " + LEVELS[levelIndex].cols + "x" + LEVELS[levelIndex].rows + " reef", textStyle(18, "#102A43")).setOrigin(0.5);
      var btnBg = scene.add.graphics();
      btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-90, 60, 180, 44, 22);
      var btnTx = scene.add.text(0, 82, "Dive In \u25B6", textStyle(20, "#ffffff")).setOrigin(0.5);
      overlay.add([bg, panel, t1, t2, t3, btnBg, btnTx]);
      btnBg.setInteractive(new Phaser.Geom.Rectangle(-90, 60, 180, 44), Phaser.Geom.Rectangle.Contains);
      var goNext = function () {
        overlay.destroy();
        buildBoard(scene);
        hudMsg.setText("Find the pairs!");
        lockBoard = false;
      };
      btnBg.on("pointerdown", goNext);
      // also allow keyboard Enter
      var keyHandler = function (e) { if (e.key === "Enter" || e.key === " ") { document.removeEventListener("keydown", keyHandler); goNext(); } };
      // use timeout to avoid immediate trigger
      setTimeout(function () { document.addEventListener("keydown", keyHandler); }, 300);
      scene.tweens.add({ targets: overlay, scale: { from: 0.92, to: 1 }, duration: 220, ease: "Sine.easeOut" });
    } else {
      showWin(scene);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.35); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 28);
    var title = scene.add.text(0, -120, "\u{1F30A} Ocean Arcade \u{1F42C}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Dive through 3 reefs!\nMatch ocean friends and earn wave bonuses", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F42C} \u{1F419} \u{1F433} \u{1F422} \u{1F980} \u{1F420}", { fontSize: "38px" }).setOrigin(0.5);
    var detail = scene.add.text(0, 50, "No timers \u2022 No penalties \u2022 Just waves of fun!", textStyle(16, "#4EA8DE")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 64, 32);
    var btnTx = scene.add.text(0, 112, "\u25B6  Dive In", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 155, "Use mouse or arrow keys + Enter", textStyle(14, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, detail, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      announce("Game started, level 1 Reef Explorer");
    });
    // keyboard accessible
    btnBg.setData("label", "Start game");
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 28);
    endTitle = scene.add.text(0, -100, "\u{1F389} Ocean Master! \u{1F389}", textStyle(36, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 64, 32);
    var btnTx = scene.add.text(0, 82, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint2 = scene.add.text(0, 130, "Press Enter or click to play again", textStyle(14, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint2]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 18 ? 3 : (moves <= 28 ? 2 : 1);
    var totalPairs = LEVELS.reduce(function (a, l) { return a + l.pairs; }, 0);
    endDetail.setText("You explored all 3 reefs!\nScore: " + score + " \u2022 Moves: " + moves + "\n" + "\u2B50".repeat(stars) + "  Ocean Master!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.88, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Score " + score + " with " + stars + " stars");
    // gentle celebration - slow falling bubbles and shells, no flashing
    for (var i = 0; i < 32; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F42C}", "\u{2728}"][i % 5], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1600, 2600), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; levelIndex = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudPairs.setText("Pairs: 0 / 6"); hudMsg.setText("Tap a card!");
    hudLevel.setText("Level 1 \u2014 Reef Explorer");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    announce("Game restarted");
  }

  function update() {}
})();
</script>
</body>
</html>
