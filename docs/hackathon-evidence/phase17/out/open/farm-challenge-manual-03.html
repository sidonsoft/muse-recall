<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS_ALL = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F413}", name: "Rooster" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = "easy";
  var hudEasyBg, hudHardBg, hudEasyTx, hudHardTx;
  var startEasyBg, startHardBg, startEasyTx, startHardTx, startBtnBg, startBtnTx;

  function getTotalPairs() { return difficulty === "hard" ? 8 : 6; }
  function getAnimals() { return difficulty === "hard" ? ANIMALS_ALL : ANIMALS_ALL.slice(0, 6); }

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    updateHudModeButtons();
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xBEE9FF, 1); g.fillRect(0, 470, W, 150);
    g.fillStyle(0xE0FBFC, 1); g.fillRect(0, 620, W, 80);
    g.fillStyle(0xFFF6DD, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x4EA8DE, 1);
    g.fillRect(80, 360, 150, 16); g.fillRect(80, 395, 150, 16); g.fillRect(80, 430, 150, 16);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(155, 285, 16);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xFFFFFF, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x4EA8DE, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x90E0EF, 0x48CAE4, 0x90E0EF];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 640 + (i % 2) * 20;
      g.fillStyle(0x90E0EF, 1); g.fillRect(fx - 2, fy, 5, 12);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFE08A, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#4EA8DE")).setOrigin(1, 0.5);

    var modeLabel = scene.add.text(24, 118, "Mode:", textStyle(16, "#102A43")).setOrigin(0, 0.5);
    void modeLabel;

    var easyCont = scene.add.container(110, 118);
    hudEasyBg = scene.add.graphics();
    hudEasyTx = scene.add.text(0, 0, "Easy", textStyle(16, "#ffffff")).setOrigin(0.5);
    easyCont.add([hudEasyBg, hudEasyTx]);
    hudEasyBg.setInteractive(new Phaser.Geom.Rectangle(-36, -16, 72, 32), Phaser.Geom.Rectangle.Contains);
    hudEasyBg.on("pointerdown", function () { setDifficulty("easy", scene); });
    hudEasyBg.on("pointerover", function () { easyCont.setScale(1.05); });
    hudEasyBg.on("pointerout", function () { easyCont.setScale(1); });

    var hardCont = scene.add.container(190, 118);
    hudHardBg = scene.add.graphics();
    hudHardTx = scene.add.text(0, 0, "Hard", textStyle(16, "#ffffff")).setOrigin(0.5);
    hardCont.add([hudHardBg, hudHardTx]);
    hudHardBg.setInteractive(new Phaser.Geom.Rectangle(-36, -16, 72, 32), Phaser.Geom.Rectangle.Contains);
    hudHardBg.on("pointerdown", function () { setDifficulty("hard", scene); });
    hudHardBg.on("pointerover", function () { hardCont.setScale(1.05); });
    hudHardBg.on("pointerout", function () { hardCont.setScale(1); });

    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });

    scene.add.text(W / 2, 168, "Find the matching pairs — no rush, just explore!", textStyle(18, "#4EA8DE")).setOrigin(0.5);
  }

  function updateHudModeButtons() {
    if (!hudEasyBg) { return; }
    hudEasyBg.clear();
    hudHardBg.clear();
    if (difficulty === "easy") {
      hudEasyBg.fillStyle(0x4EA8DE, 1); hudEasyBg.fillRoundedRect(-36, -16, 72, 32, 16);
      hudEasyTx.setColor("#ffffff");
      hudHardBg.fillStyle(0xFFFFFF, 1); hudHardBg.fillRoundedRect(-36, -16, 72, 32, 16);
      hudHardBg.lineStyle(2, 0x4EA8DE, 1); hudHardBg.strokeRoundedRect(-36, -16, 72, 32, 16);
      hudHardTx.setColor("#102A43");
    } else {
      hudHardBg.fillStyle(0x4EA8DE, 1); hudHardBg.fillRoundedRect(-36, -16, 72, 32, 16);
      hudHardTx.setColor("#ffffff");
      hudEasyBg.fillStyle(0xFFFFFF, 1); hudEasyBg.fillRoundedRect(-36, -16, 72, 32, 16);
      hudEasyBg.lineStyle(2, 0x4EA8DE, 1); hudEasyBg.strokeRoundedRect(-36, -16, 72, 32, 16);
      hudEasyTx.setColor("#102A43");
    }
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + getTotalPairs()); }
  }

  function updateStartModeButtons() {
    if (!startEasyBg) { return; }
    startEasyBg.clear();
    startHardBg.clear();
    if (difficulty === "easy") {
      startEasyBg.fillStyle(0x4EA8DE, 1); startEasyBg.fillRoundedRect(-110, -22, 220, 44, 22);
      startEasyTx.setColor("#ffffff");
      startHardBg.fillStyle(0xFFFFFF, 1); startHardBg.fillRoundedRect(-110, -22, 220, 44, 22);
      startHardBg.lineStyle(3, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(-110, -22, 220, 44, 22);
      startHardTx.setColor("#102A43");
    } else {
      startHardBg.fillStyle(0x4EA8DE, 1); startHardBg.fillRoundedRect(-110, -22, 220, 44, 22);
      startHardTx.setColor("#ffffff");
      startEasyBg.fillStyle(0xFFFFFF, 1); startEasyBg.fillRoundedRect(-110, -22, 220, 44, 22);
      startEasyBg.lineStyle(3, 0x4EA8DE, 1); startEasyBg.strokeRoundedRect(-110, -22, 220, 44, 22);
      startEasyTx.setColor("#102A43");
    }
  }

  function setDifficulty(mode, scene) {
    difficulty = mode;
    updateHudModeButtons();
    updateStartModeButtons();
    if (started) {
      restart(scene);
    }
  }

  function shuffledDeck() {
    var animals = getAnimals();
    var deck = [];
    animals.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var isHard = difficulty === "hard";
    var cols = 4, rows = isHard ? 4 : 3;
    var cw = 185, ch = isHard ? 110 : 140, gx = 62, gy = isHard ? 185 : 195, padX = 22, padY = isHard ? 12 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xFFFFFF, 0.9);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 8); back.fillCircle(0, h / 4, 12);
    var paw = scene.add.text(0, -4, "\u{1F43E}", { fontSize: h > 120 ? "48px" : "40px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0x90E0EF, 0xADE8F4, 0xBEE9FF, 0xE0FBFC, 0xD6EAF8, 0xA9D6E5, 0xEAF6FF];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = h > 120 ? "62px" : "48px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, h > 120 ? 44 : 34, data.name, textStyle(h > 120 ? 20 : 18, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + getTotalPairs());
        hudMsg.setText(matches === getTotalPairs() ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === getTotalPairs()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -135, "\u{1F30A} Ocean Match \u{1F404}", textStyle(36, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -85, "Flip the cards and find all the pairs!\nTake your time — no timer, no penalties.", Object.assign(textStyle(18, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var choose = scene.add.text(0, 18, "Choose your challenge:", textStyle(18, "#102A43")).setOrigin(0.5);

    var easyCont = scene.add.container(-135, 62);
    startEasyBg = scene.add.graphics();
    startEasyTx = scene.add.text(0, 0, "Easy \u2022 6 pairs", textStyle(18, "#ffffff")).setOrigin(0.5);
    easyCont.add([startEasyBg, startEasyTx]);
    startEasyBg.setInteractive(new Phaser.Geom.Rectangle(-110, -22, 220, 44), Phaser.Geom.Rectangle.Contains);
    startEasyBg.on("pointerdown", function () { setDifficulty("easy", scene); });
    startEasyBg.on("pointerover", function () { easyCont.setScale(1.04); });
    startEasyBg.on("pointerout", function () { easyCont.setScale(1); });

    var hardCont = scene.add.container(135, 62);
    startHardBg = scene.add.graphics();
    startHardTx = scene.add.text(0, 0, "Hard \u2022 8 pairs", textStyle(18, "#ffffff")).setOrigin(0.5);
    hardCont.add([startHardBg, startHardTx]);
    startHardBg.setInteractive(new Phaser.Geom.Rectangle(-110, -22, 220, 44), Phaser.Geom.Rectangle.Contains);
    startHardBg.on("pointerdown", function () { setDifficulty("hard", scene); });
    startHardBg.on("pointerover", function () { hardCont.setScale(1.04); });
    startHardBg.on("pointerout", function () { hardCont.setScale(1); });

    var hardHint = scene.add.text(135, 92, "4 \u00D7 4 board", textStyle(14, "#4EA8DE")).setOrigin(0.5);
    var easyHint = scene.add.text(-135, 92, "4 \u00D7 3 board", textStyle(14, "#4EA8DE")).setOrigin(0.5);

    var btnCont = scene.add.container(0, 135);
    startBtnBg = scene.add.graphics();
    startBtnBg.fillStyle(0x4EA8DE, 1); startBtnBg.fillRoundedRect(-130, -28, 260, 56, 28);
    startBtnTx = scene.add.text(0, 0, "\u25B6  Start", textStyle(26, "#ffffff")).setOrigin(0.5);
    btnCont.add([startBtnBg, startBtnTx]);
    startBtnBg.setInteractive(new Phaser.Geom.Rectangle(-130, -28, 260, 56), Phaser.Geom.Rectangle.Contains);
    startBtnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
    });
    startBtnBg.on("pointerover", function () { btnCont.setScale(1.05); });
    startBtnBg.on("pointerout", function () { btnCont.setScale(1); });

    var keyHint = scene.add.text(0, 172, "Tip: Press E for Easy, H for Hard, Enter to Start", textStyle(13, "#4EA8DE")).setOrigin(0.5);

    startOverlay.add([bg, panel, title, sub, row, choose, easyCont, hardCont, easyHint, hardHint, btnCont, keyHint]);
    updateStartModeButtons();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var total = getTotalPairs();
    var stars = moves <= (total === 8 ? 14 : 10) ? 3 : (moves <= (total === 8 ? 20 : 16) ? 2 : 1);
    var modeName = difficulty === "hard" ? "Hard (8 pairs)" : "Easy (6 pairs)";
    endDetail.setText("You found all " + total + " pairs!\n" + modeName + "  \u2022  Moves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + getTotalPairs()); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateHudModeButtons();
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
      } else if (endOverlay && endOverlay.visible) {
        restart(scene);
      }
    });
    scene.input.keyboard.on("keydown-E", function () { setDifficulty("easy", scene); });
    scene.input.keyboard.on("keydown-H", function () { setDifficulty("hard", scene); });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
      }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
