<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Rush — Arcade Memory</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a1e33;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 0 28px rgba(78,168,222,.45),0 12px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean Rush arcade memory match game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F40B}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F420}", name: "Tropic Fish" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#102A43",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, combo = 0, timeLeft = 60, maxTime = 60, difficulty = "arcade";
  var hudMoves, hudScore, hudPairs, hudTime, hudCombo, hudMsg, timerBar, timerBg, endOverlay, endTitle, endDetail, endSub, startOverlay;
  var focusIndex = 0, bubbles = [], audioCtx = null;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupAudio();
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillGradientStyle(0x102A43, 0x102A43, 0x0f3a5a, 0x1a6a8a, 1);
    g.fillRect(0, 0, W, H);
    g.lineStyle(2, 0x4EA8DE, 0.14);
    for (var y = 200; y < 520; y += 26) {
      g.beginPath();
      g.moveTo(0, y);
      for (var x = 0; x <= W; x += 18) {
        g.lineTo(x, y + Math.sin(x * 0.015 + y * 0.01) * 7);
      }
      g.strokePath();
    }
    g.lineStyle(1, 0x4EA8DE, 0.07);
    for (var gx = 0; gx < W; gx += 45) { g.lineBetween(gx, 0, gx, H); }
    for (var gy = 0; gy < H; gy += 45) { g.lineBetween(0, gy, W, gy); }
    var glow = scene.add.graphics();
    glow.fillStyle(0x4EA8DE, 0.07);
    glow.fillCircle(W / 2, H / 2 + 30, 280);
    glow.fillStyle(0x4EA8DE, 0.04);
    glow.fillCircle(W / 2, H / 2 + 30, 380);
    for (var i = 0; i < 18; i++) {
      var bx = Math.random() * W, by = Math.random() * H, r = 4 + Math.random() * 10;
      var b = scene.add.graphics();
      b.fillStyle(0xffffff, 0.09);
      b.fillCircle(0, 0, r);
      b.lineStyle(1, 0xffffff, 0.14);
      b.strokeCircle(0, 0, r);
      b.x = bx; b.y = by;
      b.setData("r", r);
      b.setData("speed", 0.35 + Math.random() * 0.7);
      b.setData("drift", (Math.random() - 0.5) * 0.5);
      bubbles.push(b);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Segoe UI",Roboto,Helvetica,Arial,sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }
  function monoStyle(size, color) {
    return { fontFamily: '"Courier New",Courier,monospace', fontSize: size + "px", color: color || "#4EA8DE", fontStyle: "bold" };
  }

  function makeHud(scene) {
    var bar = scene.add.graphics();
    bar.fillStyle(0x0a1e33, 0.96);
    bar.fillRoundedRect(12, 12, W - 24, 78, 14);
    bar.lineStyle(2, 0x4EA8DE, 0.95);
    bar.strokeRoundedRect(12, 12, W - 24, 78, 14);
    scene.add.text(28, 20, "OCEAN RUSH", monoStyle(22, "#4EA8DE")).setOrigin(0, 0);
    scene.add.text(28, 44, "ARCADE MEMORY", textStyle(11, "#7fb8d8")).setOrigin(0, 0);
    hudScore = scene.add.text(200, 26, "SCORE 0000", monoStyle(18, "#ffffff")).setOrigin(0, 0);
    hudTime = scene.add.text(200, 50, "TIME 60", monoStyle(16, "#4EA8DE")).setOrigin(0, 0);
    hudCombo = scene.add.text(360, 26, "COMBO x1", monoStyle(16, "#ffd166")).setOrigin(0, 0);
    hudPairs = scene.add.text(360, 50, "PAIRS 0 / 6", monoStyle(14, "#a0d2f0")).setOrigin(0, 0);
    hudMoves = scene.add.text(520, 26, "MOVES 0", monoStyle(14, "#a0d2f0")).setOrigin(0, 0);
    hudMsg = scene.add.text(520, 50, "READY?", monoStyle(13, "#4EA8DE")).setOrigin(0, 0);
    timerBg = scene.add.graphics();
    timerBg.fillStyle(0x102A43, 1);
    timerBg.fillRoundedRect(200, 74, 380, 8, 4);
    timerBar = scene.add.graphics();
    updateTimerBar();
    var btn = scene.add.container(W - 90, 50);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1);
    bg.fillRoundedRect(-70, -22, 140, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB RESTART", textStyle(14, "#102A43")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-70, -22, 140, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); playTone(600, 0.08, "square"); });
    bg.on("pointerover", function () { btn.setScale(1.05); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 108, "MATCH ALL PAIRS BEFORE TIME RUNS OUT — BUILD COMBOS!", textStyle(12, "#4EA8DE")).setOrigin(0.5).setAlpha(0.95);
  }

  function updateTimerBar() {
    if (!timerBar) { return; }
    timerBar.clear();
    var pct = Math.max(0, timeLeft / maxTime);
    var w = 380 * pct;
    var col = pct > 0.4 ? 0x4EA8DE : (pct > 0.2 ? 0xffb703 : 0xff3b30);
    timerBar.fillStyle(col, 1);
    timerBar.fillRoundedRect(200, 74, w, 8, 4);
    if (pct < 0.25) {
      timerBar.fillStyle(0xff3b30, 0.22);
      timerBar.fillRoundedRect(200, 74, w, 8, 4);
    }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 175, ch = 132, gx = 62, gy = 135, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2 + 10;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusIndex = 0;
    updateFocus();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var shadow = scene.add.graphics();
    shadow.fillStyle(0x000000, 0.28);
    shadow.fillRoundedRect(-w / 2 + 4, -h / 2 + 6, w, h, 18);
    var backG = scene.add.graphics();
    backG.fillStyle(0x0f2f4a, 1);
    backG.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    backG.lineStyle(3, 0x4EA8DE, 1);
    backG.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
    backG.lineStyle(2, 0x4EA8DE, 0.32);
    for (var i = -h / 2 + 18; i < h / 2; i += 14) {
      backG.beginPath();
      backG.moveTo(-w / 2 + 12, i);
      for (var px = -w / 2 + 12; px < w / 2 - 12; px += 10) {
        backG.lineTo(px, i + Math.sin(px * 0.08) * 4);
      }
      backG.strokePath();
    }
    backG.lineStyle(1, 0x4EA8DE, 0.5);
    backG.strokeCircle(0, 0, 22);
    backG.strokeCircle(0, 0, 36);
    var sonarDot = scene.add.graphics();
    sonarDot.fillStyle(0x4EA8DE, 1);
    sonarDot.fillCircle(0, 0, 6);
    var qMark = scene.add.text(0, 2, "?", textStyle(34, "#4EA8DE")).setOrigin(0.5).setAlpha(0.95);
    var focusRing = scene.add.graphics();
    focusRing.lineStyle(3, 0xffd166, 1);
    focusRing.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 20);
    focusRing.setVisible(false);
    var backCont = scene.add.container(0, 0, [shadow, backG, sonarDot, qMark]);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    fg.fillStyle(0xffffff, 1);
    fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.lineStyle(3, 0x4EA8DE, 1);
    fg.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
    var palette = [0xe0f2ff, 0xd0f0ff, 0xc8e7ff, 0xb8e0ff, 0xd6f5ff, 0xe8f8ff];
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 12);
    fg.fillStyle(0xffffff, 0.55);
    fg.fillRoundedRect(-w / 2 + 10, -h / 2 + 10, w - 20, 18, 8);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: "54px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(13, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [backCont]);
    cont.add([showBack, face, focusRing]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, focusRing: focusRing, data: data, matched: false, faceUp: false, idx: idx };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched && !card.faceUp) { cont.setScale(1.03); } });
    cont.on("pointerout", function () { cont.setScale(1); });
    return card;
  }

  function updateFocus() {
    cards.forEach(function (c, i) {
      if (c.focusRing) { c.focusRing.setVisible(i === focusIndex && started && !c.matched); }
    });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 110, ease: "Quad.easeIn", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 110, ease: "Quad.easeOut", onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    playTone(820, 0.06, "sine");
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("ONE MORE!"); updateFocus(); return; }
    moves++;
    hudMoves.setText("MOVES " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        combo++;
        var mult = Math.min(combo, 5);
        var timeBonus = Math.floor(timeLeft * 12);
        var gained = 1000 * mult + timeBonus;
        score += gained;
        hudScore.setText("SCORE " + String(score).padStart(4, "0"));
        hudCombo.setText("COMBO x" + mult);
        hudCombo.setScale(1.3);
        scene.tweens.add({ targets: hudCombo, scale: 1, duration: 200, ease: "Back.easeOut" });
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 140, ease: "Quad.easeOut" });
        scene.cameras.main.flash(120, 78, 168, 222, false);
        spawnBurst(scene, a.view.x, a.view.y, 0x4EA8DE);
        spawnBurst(scene, card.view.x, card.view.y, 0xffd166);
        showFloating(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2, "+" + gained, "#4EA8DE");
        if (combo >= 2) {
          showFloating(scene, W / 2, 138, "COMBO x" + mult + "!", "#ffd166");
          playTone(900 + combo * 80, 0.12, "square");
        } else {
          playTone(1020, 0.12, "sine");
        }
        matches++;
        hudPairs.setText("PAIRS " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "CLEAR!" : "NICE! +" + gained);
        lockBoard = false;
        updateFocus();
        if (matches === 6) { showWin(scene); }
      }, 300);
    } else {
      combo = 0;
      hudCombo.setText("COMBO x1");
      hudMsg.setText("MISS! -3s");
      score = Math.max(0, score - 150);
      hudScore.setText("SCORE " + String(score).padStart(4, "0"));
      timeLeft = Math.max(0, timeLeft - 3);
      updateTimerBar();
      hudTime.setText("TIME " + timeLeft);
      scene.cameras.main.shake(180, 0.008);
      scene.cameras.main.flash(120, 255, 59, 48, false);
      playTone(170, 0.18, "sawtooth");
      showFloating(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2, "-3s  -150", "#ff3b30");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocus(); });
      }, 550);
    }
  }

  function spawnBurst(scene, x, y, color) {
    for (var i = 0; i < 8; i++) {
      var p = scene.add.graphics();
      p.fillStyle(color, 1);
      p.fillCircle(0, 0, 4);
      p.x = x; p.y = y;
      p.setDepth(15);
      var ang = Math.random() * Math.PI * 2;
      var dist = 30 + Math.random() * 40;
      scene.tweens.add({ targets: p, x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist, alpha: 0, scale: 0.2, duration: 400 + Math.random() * 200, onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showFloating(scene, x, y, txt, color) {
    var t = scene.add.text(x, y, txt, textStyle(20, color)).setOrigin(0.5).setDepth(20);
    t.setStroke("#102A43", 4);
    scene.tweens.add({ targets: t, y: y - 42, alpha: 0, duration: 700, ease: "Quad.easeOut", onComplete: function () { t.destroy(); } });
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.78); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -210, 640, 420, 24);
    panel.lineStyle(4, 0x4EA8DE, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 24);
    var accent = scene.add.graphics();
    accent.fillStyle(0x4EA8DE, 1); accent.fillRoundedRect(-320, -210, 640, 10, 4);
    var title = scene.add.text(0, -150, "OCEAN RUSH", monoStyle(42, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -110, "ARCADE MEMORY CHALLENGE", textStyle(13, "#4EA8DE")).setOrigin(0.5);
    var desc = scene.add.text(0, -60, "Match all 6 pairs before the timer hits zero.\nChain matches for COMBO multipliers.\nMisses cost time & points!", Object.assign(textStyle(16, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -10, "\u{1F419}  \u{1F988}  \u{1F40B}  \u{1F42C}  \u{1F991}  \u{1F420}", { fontSize: "36px" }).setOrigin(0.5);
    var btn1Bg = scene.add.graphics();
    btn1Bg.fillStyle(0x4EA8DE, 1); btn1Bg.fillRoundedRect(-260, 40, 240, 64, 16);
    var btn1Tx = scene.add.text(-140, 62, "ARCADE 60s", textStyle(16, "#ffffff")).setOrigin(0.5);
    var btn1Sub = scene.add.text(-140, 78, "NORMAL", textStyle(11, "#e0f2ff")).setOrigin(0.5);
    var btn2Bg = scene.add.graphics();
    btn2Bg.fillStyle(0x102A43, 1); btn2Bg.fillRoundedRect(20, 40, 240, 64, 16);
    btn2Bg.lineStyle(2, 0x4EA8DE, 1); btn2Bg.strokeRoundedRect(20, 40, 240, 64, 16);
    var btn2Tx = scene.add.text(140, 62, "RUSH 35s", textStyle(16, "#4EA8DE")).setOrigin(0.5);
    var btn2Sub = scene.add.text(140, 78, "HARDCORE", textStyle(11, "#4EA8DE")).setOrigin(0.5);
    var hint = scene.add.text(0, 135, "Use mouse or arrow keys + Enter  •  Chain combos for high score!", textStyle(12, "#6a8ca8")).setOrigin(0.5);
    startOverlay.add([bg, panel, accent, title, sub, desc, row, btn1Bg, btn1Tx, btn1Sub, btn2Bg, btn2Tx, btn2Sub, hint]);
    btn1Bg.setInteractive(new Phaser.Geom.Rectangle(-260, 40, 240, 64), Phaser.Geom.Rectangle.Contains);
    btn1Bg.on("pointerdown", function () { startGame(scene, "arcade"); });
    btn1Bg.on("pointerover", function () { btn1Bg.clear(); btn1Bg.fillStyle(0x3a9ad0, 1); btn1Bg.fillRoundedRect(-260, 40, 240, 64, 16); });
    btn1Bg.on("pointerout", function () { btn1Bg.clear(); btn1Bg.fillStyle(0x4EA8DE, 1); btn1Bg.fillRoundedRect(-260, 40, 240, 64, 16); });
    btn2Bg.setInteractive(new Phaser.Geom.Rectangle(20, 40, 240, 64), Phaser.Geom.Rectangle.Contains);
    btn2Bg.on("pointerdown", function () { startGame(scene, "rush"); });
    btn2Bg.on("pointerover", function () { btn2Bg.clear(); btn2Bg.fillStyle(0x1a3a5a, 1); btn2Bg.fillRoundedRect(20, 40, 240, 64, 16); btn2Bg.lineStyle(2, 0x4EA8DE, 1); btn2Bg.strokeRoundedRect(20, 40, 240, 64, 16); });
    btn2Bg.on("pointerout", function () { btn2Bg.clear(); btn2Bg.fillStyle(0x102A43, 1); btn2Bg.fillRoundedRect(20, 40, 240, 64, 16); btn2Bg.lineStyle(2, 0x4EA8DE, 1); btn2Bg.strokeRoundedRect(20, 40, 240, 64, 16); });
  }

  function startGame(scene, mode) {
    difficulty = mode;
    maxTime = mode === "rush" ? 35 : 60;
    timeLeft = maxTime;
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("GO!");
    updateTimerBar();
    hudTime.setText("TIME " + timeLeft);
    hudTime.setColor("#4EA8DE");
    if (scene.timerEvent) { scene.timerEvent.remove(); }
    scene.timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started) { return; }
      timeLeft--;
      hudTime.setText("TIME " + timeLeft);
      updateTimerBar();
      if (timeLeft <= 10) {
        hudTime.setColor("#ff3b30");
        scene.tweens.add({ targets: hudTime, scaleX: 1.12, scaleY: 1.12, yoyo: true, duration: 120 });
        if (timeLeft <= 5) { playTone(300, 0.08, "square"); }
      } else {
        hudTime.setColor("#4EA8DE");
      }
      if (timeLeft <= 0) {
        timeLeft = 0;
        showLose(scene);
      }
    }});
    if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    updateFocus();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.82); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -190, 620, 380, 24);
    panel.lineStyle(4, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -190, 620, 380, 24);
    var accent = scene.add.graphics();
    accent.fillStyle(0x4EA8DE, 1); accent.fillRoundedRect(-310, -190, 620, 10, 4);
    endTitle = scene.add.text(0, -120, "", monoStyle(34, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -60, "", Object.assign(textStyle(18, "#102A43"), { align: "center" })).setOrigin(0.5);
    endSub = scene.add.text(0, 10, "", Object.assign(monoStyle(13, "#4EA8DE"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-150, 60, 300, 64, 32);
    var btnTx = scene.add.text(0, 92, "\u21BB PLAY AGAIN", textStyle(18, "#ffffff")).setOrigin(0.5);
    var hint2 = scene.add.text(0, 145, "Press R or Enter to restart", textStyle(12, "#6a8ca8")).setOrigin(0.5);
    endOverlay.add([bg, panel, accent, endTitle, endDetail, endSub, btnBg, btnTx, hint2]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-150, 60, 300, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnBg.on("pointerover", function () { endOverlay.setScale(1.02); });
    btnBg.on("pointerout", function () { endOverlay.setScale(1); });
  }

  function showWin(scene) {
    started = false;
    if (scene.timerEvent) { scene.timerEvent.remove(); }
    var timeBonus = timeLeft * 25;
    var finalScore = score + timeBonus;
    var stars = finalScore >= 8000 ? 3 : (finalScore >= 5000 ? 2 : 1);
    if (moves <= 10) { stars = Math.min(3, stars + 1); }
    endTitle.setText("\u2605 MISSION CLEAR \u2605");
    endTitle.setColor("#102A43");
    endDetail.setText("All pairs matched!\nScore: " + score + " + Time Bonus " + timeBonus + " = " + finalScore + "\nMoves: " + moves + "  \u2022  Best Combo x" + Math.min(combo, 5) + "  " + "\u2B50".repeat(stars));
    endSub.setText(timeLeft > 20 ? "PERFECT RUN! ARCADE MASTER!" : (combo >= 3 ? "COMBO CRUSHER!" : "NICE WORK! TRY RUSH MODE!"));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 300, ease: "Back.easeOut" });
    hudMsg.setText("CLEAR! " + finalScore);
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}", "\u2728"][i % 5], { fontSize: "22px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-100, 100), duration: Phaser.Math.Between(1200, 2200), delay: i * 30, onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
    playTone(800, 0.2, "sine"); setTimeout(function () { playTone(1000, 0.2, "sine"); }, 150); setTimeout(function () { playTone(1200, 0.4, "sine"); }, 300);
  }

  function showLose(scene) {
    started = false; lockBoard = true;
    if (scene.timerEvent) { scene.timerEvent.remove(); }
    endTitle.setText("\u25FC TIME'S UP \u25FC");
    endTitle.setColor("#ff3b30");
    endDetail.setText("Out of time!\nPairs: " + matches + " / 6  \u2022  Score: " + score + "\nMoves: " + moves);
    endSub.setText(matches >= 4 ? "SO CLOSE! ONE MORE TRY!" : "KEEP YOUR FOCUS — BUILD COMBOS!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("GAME OVER");
    scene.cameras.main.shake(400, 0.012);
    playTone(150, 0.5, "sawtooth");
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; firstPick = null; lockBoard = false; started = true;
    maxTime = difficulty === "rush" ? 35 : 60;
    timeLeft = maxTime;
    hudMoves.setText("MOVES 0");
    hudScore.setText("SCORE 0000");
    hudCombo.setText("COMBO x1");
    hudPairs.setText("PAIRS 0 / 6");
    hudTime.setText("TIME " + timeLeft);
    hudTime.setColor("#4EA8DE");
    hudMsg.setText("GO!");
    updateTimerBar();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    if (scene.timerEvent) { scene.timerEvent.remove(); }
    scene.timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started) { return; }
      timeLeft--;
      hudTime.setText("TIME " + timeLeft);
      updateTimerBar();
      if (timeLeft <= 10) {
        hudTime.setColor("#ff3b30");
        scene.tweens.add({ targets: hudTime, scaleX: 1.12, scaleY: 1.12, yoyo: true, duration: 120 });
        if (timeLeft <= 5) { playTone(300, 0.08, "square"); }
      }
      if (timeLeft <= 0) { timeLeft = 0; showLose(scene); }
    }});
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown-LEFT", function () { if (!started) { return; } focusIndex = (focusIndex - 1 + cards.length) % cards.length; updateFocus(); });
    scene.input.keyboard.on("keydown-RIGHT", function () { if (!started) { return; } focusIndex = (focusIndex + 1) % cards.length; updateFocus(); });
    scene.input.keyboard.on("keydown-UP", function () { if (!started) { return; } focusIndex = (focusIndex - 4 + cards.length) % cards.length; updateFocus(); });
    scene.input.keyboard.on("keydown-DOWN", function () { if (!started) { return; } focusIndex = (focusIndex + 4) % cards.length; updateFocus(); });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) { startGame(scene, "arcade"); return; }
      if (endOverlay.visible) { restart(scene); return; }
      if (!started) { return; }
      var c = cards[focusIndex]; if (c) { onCard(scene, c); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () { if (!started) { return; } var c = cards[focusIndex]; if (c) { onCard(scene, c); } });
    scene.input.keyboard.on("keydown-R", function () { if (endOverlay.visible || started) { restart(scene); } });
  }

  function setupAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { audioCtx = new AC(); }
    } catch (e) {}
  }
  function playTone(freq, dur, type) {
    if (!audioCtx) { return; }
    try {
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.getData("speed");
      b.x += b.getData("drift") * 0.5;
      if (b.y < -20) { b.y = H + 20; b.x = Math.random() * W; }
      if (b.x < 0) { b.x = W; } if (b.x > W) { b.x = 0; }
    }
    if (timerBar) {
      if (timeLeft <= 10 && started) {
        timerBar.setAlpha(0.7 + Math.sin(Date.now() * 0.015) * 0.3);
      } else {
        timerBar.setAlpha(1);
      }
    }
  }
})();
</script>
</body>
</html>
