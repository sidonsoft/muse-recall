<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #live{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean Memory Arcade - match sea friends"></div>
<div id="live" aria-live="polite"></div>
<script>
(function () {
  var SEA = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F420}", name: "Tropical Fish" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F9AD}", name: "Seal" },
    { emoji: "\u{2B50}", name: "Starfish" }
  ];
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3, title: "Coral Reef" },
    { pairs: 8, cols: 4, rows: 4, title: "Deep Blue" },
    { pairs: 10, cols: 5, rows: 4, title: "Ocean Depths" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, levelIndex = 0, focusedIndex = 0;
  var hudMoves, hudScore, hudPairs, hudMsg, hudLevel, endOverlay, endTitle, endDetail, endBtnLabel, startOverlay, progressGroup, focusRing;
  var mainScene = null;

  function create() {
    var s = this;
    mainScene = s;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    spawnBubbles(s);
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, 180);
    g.fillStyle(0xD6EAF8, 1); g.fillRect(0, 180, W, 120);
    g.fillStyle(0xBFEFFF, 1); g.fillRect(0, 300, W, 170);
    g.fillStyle(0xA8D8EA, 1); g.fillRect(0, 470, W, 170);
    g.fillStyle(0xF5E6C8, 1); g.fillRect(0, 640, W, 60);
    g.fillStyle(0xE8D5A3, 1); g.fillEllipse(200, 650, 180, 30); g.fillEllipse(600, 660, 220, 28); g.fillEllipse(400, 655, 140, 22);
    g.fillStyle(0xFFF6B5, 1); g.fillCircle(770, 110, 48);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 36);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xffffff, 0.95);
    for (var i = 0; i < 3; i++) {
      var wy = 300 + i * 18;
      g.fillEllipse(150 + i * 200, wy, 300, 22);
      g.fillEllipse(350 + i * 180, wy + 8, 280, 18);
    }
    g.fillStyle(0x5DBE8A, 1);
    g.fillEllipse(40, 620, 18, 60); g.fillEllipse(55, 630, 14, 50);
    g.fillEllipse(860, 625, 20, 70); g.fillEllipse(845, 635, 14, 50);
    g.fillEllipse(120, 635, 12, 40);
    g.fillStyle(0xffffff, 0.45);
    for (var b = 0; b < 12; b++) {
      var bx = 100 + b * 70 + Math.random() * 20, by = 400 + Math.random() * 200;
      g.fillCircle(bx, by, 4 + Math.random() * 6);
      g.fillCircle(bx + 6, by - 10, 2);
    }
  }

  function spawnBubbles(scene) {
    scene.time.addEvent({ delay: 900, loop: true, callback: function () {
      if (!started) { return; }
      var x = Phaser.Math.Between(30, W - 30);
      var bub = scene.add.text(x, H + 20, "\u{1FAE7}", { fontSize: "18px" }).setOrigin(0.5).setAlpha(0.7).setDepth(2);
      scene.tweens.add({ targets: bub, y: 320, x: x + Phaser.Math.Between(-20, 20), alpha: 0, duration: Phaser.Math.Between(3000, 5000), ease: "Sine.easeInOut", onComplete: function () { bub.destroy(); } });
    }});
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function announce(msg) {
    var live = document.getElementById("live");
    if (live) { live.textContent = msg; }
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Arcade", textStyle(32)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level 1 \u2014 Coral Reef", textStyle(18, "#4EA8DE")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 78, "Moves: 0", textStyle(20));
    hudPairs = scene.add.text(24, 102, "Pairs: 0 / 6", textStyle(20));
    hudScore = scene.add.text(W - 24, 52, "Score: 0", textStyle(22, "#102A43")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 82, "Tap a card!", textStyle(18, "#4EA8DE")).setOrigin(1, 0);
    progressGroup = scene.add.container(24, 132);
    var btn = scene.add.container(W - 110, 118);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find all pairs to dive deeper! No rush, just fun!", textStyle(16, "#5A7D9A")).setOrigin(0.5);
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function shuffledDeckForLevel(lvl) {
    var deck = [];
    var pool = SEA.slice(0, lvl.pairs);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var lvl = LEVELS[levelIndex];
    var deck = shuffledDeckForLevel(lvl);
    var cols = lvl.cols, rows = lvl.rows;
    var cw, ch, gx, gy, padX, padY;
    if (cols === 4 && rows === 3) { cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16; }
    else if (cols === 4 && rows === 4) { cw = 185; ch = 105; gx = 62; gy = 195; padX = 22; padY = 14; }
    else { cw = 150; ch = 105; gx = 45; gy = 195; padX = 18; padY = 14; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    hudPairs.setText("Pairs: 0 / " + lvl.pairs);
    hudLevel.setText("Level " + (levelIndex + 1) + " \u2014 " + lvl.title);
    updateProgress();
    focusedIndex = 0;
    setFocus(0);
    if (!scene._keysBound) {
      scene.input.keyboard.on("keydown", function (e) {
        if (!started) { return; }
        if (e.key === "ArrowRight") { setFocus((focusedIndex + 1) % cards.length); }
        else if (e.key === "ArrowLeft") { setFocus((focusedIndex - 1 + cards.length) % cards.length); }
        else if (e.key === "ArrowDown") { setFocus((focusedIndex + cols) % cards.length); }
        else if (e.key === "ArrowUp") { setFocus((focusedIndex - cols + cards.length) % cards.length); }
        else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); var card = cards[focusedIndex]; if (card) { onCard(scene, card); } }
        else if (e.key === "r" || e.key === "R") { restart(scene); }
      });
      scene._keysBound = true;
    }
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    back.fillStyle(0xffffff, 0.95);
    back.fillEllipse(-w * 0.2, -h * 0.15, w * 0.5, h * 0.18);
    back.fillEllipse(w * 0.15, h * 0.1, w * 0.4, h * 0.15);
    back.lineStyle(2, 0xffffff, 0.6); back.strokeRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var icon = scene.add.text(0, -4, "\u{1F41A}", { fontSize: "42px" }).setOrigin(0.5);
    var showBack = scene.add.container(0, 0, [back, icon]);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE6F7FF, 0xD4F1F9, 0xCDEEF9, 0xE0F6FF, 0xF0FAFF, 0xBFEFFF, 0xEAF6FF, 0xD6EAF8, 0xFFF6B5, 0xE6F7FF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1); fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    fg.lineStyle(3, 0x4EA8DE, 1); fg.strokeRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var emo = scene.add.text(0, -16, data.emoji, { fontSize: (w > 160 ? "56px" : "48px") }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 160 ? 18 : 16)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx, w: w, h: h, baseX: x, baseY: y };
    cont.on("pointerdown", function () { setFocus(idx); onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched) { cont.setScale(1.03); } });
    cont.on("pointerout", function () { cont.setScale(1); });
    return card;
  }

  function setFocus(idx) {
    if (cards.length === 0) { return; }
    focusedIndex = idx;
    var card = cards[idx];
    if (!card) { return; }
    focusRing.setVisible(true);
    focusRing.clear();
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(card.view.x - card.w / 2 - 4, card.view.y - card.h / 2 - 4, card.w + 8, card.h + 8, 20);
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, ease: "Sine.easeInOut", onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Sine.easeInOut", onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u2728"); announce("One more to find a pair"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        var pts = 100;
        if (moves <= LEVELS[levelIndex].pairs + 2) { pts += 20; }
        score += pts;
        hudScore.setText("Score: " + score);
        showScorePopup(scene, card.view.x, card.view.y - 60, "+" + pts);
        matches++;
        hudPairs.setText("Pairs: " + matches + " / " + LEVELS[levelIndex].pairs);
        updateProgress();
        hudMsg.setText(matches === LEVELS[levelIndex].pairs ? "Amazing! \u{1F389}" : "Yay! A pair! \u{1FAE7}");
        announce(matches === LEVELS[levelIndex].pairs ? "Level complete" : "Yay a pair found");
        for (var i = 0; i < 6; i++) {
          var b = scene.add.text(a.view.x + Phaser.Math.Between(-20, 20), a.view.y, "\u{1FAE7}", { fontSize: "18px" }).setDepth(30).setOrigin(0.5);
          scene.tweens.add({ targets: b, y: b.y - 60 - Phaser.Math.Between(0, 30), x: b.x + Phaser.Math.Between(-30, 30), alpha: 0, scale: 1.4, duration: 800, ease: "Sine.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(b) });
        }
        lockBoard = false;
        if (matches === LEVELS[levelIndex].pairs) {
          if (levelIndex < LEVELS.length - 1) { showLevelComplete(scene); }
          else { showFinalWin(scene); }
        }
      }, 350);
    } else {
      hudMsg.setText("So close! Try again! \u{1F30A}");
      announce("Try again");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function showScorePopup(scene, x, y, text) {
    var t = scene.add.text(x, y, text, textStyle(22, "#4EA8DE")).setOrigin(0.5).setDepth(20);
    t.setStroke("#ffffff", 4);
    scene.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 700, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function updateProgress() {
    if (!progressGroup || !mainScene) { return; }
    progressGroup.removeAll(true);
    var lvl = LEVELS[levelIndex];
    for (var i = 0; i < lvl.pairs; i++) {
      var dot = mainScene.add.graphics();
      var filled = i < matches;
      dot.fillStyle(filled ? 0x4EA8DE : 0xffffff, 1);
      dot.lineStyle(2, 0x4EA8DE, 1);
      dot.fillCircle(i * 28, 0, 10);
      dot.strokeCircle(i * 28, 0, 10);
      progressGroup.add(dot);
      if (filled) {
        var check = mainScene.add.text(i * 28, 0, "\u2713", { fontSize: "12px", color: "#ffffff" }).setOrigin(0.5);
        progressGroup.add(check);
      }
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 28);
    var title = scene.add.text(0, -130, "\u{1F30A} Ocean Memory Arcade \u{1F419}", textStyle(34)).setOrigin(0.5);
    var sub = scene.add.text(0, -70, "Dive in and find the matching sea friends!\n3 exciting levels \u2014 no rush, just fun!", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -10, "\u{1F419} \u{1F433} \u{1F42C} \u{1F420} \u{1F988} \u{1F980} \u{1F422} \u{1F991}", { fontSize: "38px" }).setOrigin(0.5);
    var feat = scene.add.text(0, 40, "\u2728 Match pairs \u2022 Earn points \u2022 Unlock new depths \u2728", textStyle(16, "#5A7D9A")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-135, 80, 270, 64, 32);
    var btnTx = scene.add.text(0, 112, "\u25B6  Dive In!", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 170, "Use mouse, tap, or arrow keys + Enter  \u2022  R to restart", textStyle(14, "#7A9AB5")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, feat, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-135, 80, 270, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Find a pair! \u{1FAE7}");
      announce("Game started, find a pair");
      setFocus(0);
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) { started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Find a pair! \u{1FAE7}"); setFocus(0); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay.visible) { started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Find a pair! \u{1FAE7}"); setFocus(0); }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -180, 600, 360, 28);
    panel.lineStyle(5, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 28);
    endTitle = scene.add.text(0, -110, "\u{1F389} Level Complete! \u{1F389}", textStyle(32)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-140, 60, 280, 64, 32);
    var btnTx = scene.add.text(0, 92, "\u27A4 Next Dive", textStyle(24, "#ffffff")).setOrigin(0.5);
    endBtnLabel = btnTx;
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      if (levelIndex < LEVELS.length - 1) { nextLevel(scene); }
      else { restart(scene); }
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (endOverlay.visible) {
        if (levelIndex < LEVELS.length - 1) { nextLevel(scene); }
        else { restart(scene); }
      }
    });
  }

  function showLevelComplete(scene) {
    var lvl = LEVELS[levelIndex];
    var stars = moves <= lvl.pairs + 4 ? 3 : (moves <= lvl.pairs + 8 ? 2 : 1);
    endTitle.setText("\u{1F30A} Level " + (levelIndex + 1) + " Complete!");
    endDetail.setText("You found all " + lvl.pairs + " pairs!\nMoves: " + moves + "   Score: " + score + "   " + "\u2B50".repeat(stars) + "\n\nReady for " + LEVELS[levelIndex + 1].title + "?");
    endBtnLabel.setText("\u27A4 Next Dive");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.9, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("Level complete! \u{1F389}");
    announce("Level " + (levelIndex + 1) + " complete, score " + score);
    for (var i = 0; i < 24; i++) {
      var em = ["\u{1FAE7}", "\u2B50", "\u{1F41A}", "\u{1F30A}"][i % 4];
      var p = scene.add.text(Phaser.Math.Between(40, W - 40), -20, em, { fontSize: "22px" }).setDepth(30).setOrigin(0.5);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1400, 2200), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showFinalWin(scene) {
    var stars = score >= 800 ? 3 : (score >= 500 ? 2 : 1);
    endTitle.setText("\u{1F3C6} Ocean Champion! \u{1F3C6}");
    endDetail.setText("You explored all 3 depths!\nFinal Score: " + score + "   Moves: " + moves + "   " + "\u2B50".repeat(stars) + "\n\nYou're a true arcade diver!");
    endBtnLabel.setText("\u21BB Play Again");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.9, to: 1 }, duration: 260, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F3C6}");
    announce("Ocean Champion, final score " + score);
    for (var i = 0; i < 30; i++) {
      var em2 = ["\u{1FAE7}", "\u2B50", "\u{1F389}", "\u{1F419}", "\u{1F433}"][i % 5];
      var p2 = scene.add.text(Phaser.Math.Between(40, W - 40), -20, em2, { fontSize: "24px" }).setDepth(30).setOrigin(0.5);
      scene.tweens.add({ targets: p2, y: H + 40, x: p2.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1400, 2400), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p2) });
    }
  }

  function restart(scene) {
    levelIndex = 0; score = 0; moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Score: 0"); hudPairs.setText("Pairs: 0 / 6"); hudMsg.setText("Find a pair! \u{1FAE7}");
    announce("Game restarted");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    focusRing.setVisible(true);
  }

  function nextLevel(scene) {
    levelIndex++;
    moves = 0; matches = 0; firstPick = null; lockBoard = false;
    hudMoves.setText("Moves: 0");
    hudPairs.setText("Pairs: 0 / " + LEVELS[levelIndex].pairs);
    hudMsg.setText("New depth unlocked! \u{1F30A}");
    announce("Level " + (levelIndex + 1) + " " + LEVELS[levelIndex].title);
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update(time) {
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (c && !c.matched) {
        c.view.y = c.baseY + Math.sin(time * 0.001 + i * 0.7) * 3;
      }
    }
  }
})();
</script>
</body>
</html>
