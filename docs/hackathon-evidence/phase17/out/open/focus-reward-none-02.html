<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
  }
  #addBtn:hover { filter: brightness(1.06); }
  #addBtn:active { filter: brightness(0.96); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #clearBtn:hover { color: var(--text); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
  }
  .task.completed { opacity: 0.82; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .check:hover { background: var(--accent-soft); }
  .task.completed .check:hover { background: var(--accent); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
  }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  /* Celebration enhancements */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  #celebrationLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 90;
  }
  .confetti {
    position: fixed;
    top: -12px;
    width: 8px;
    height: 12px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 99;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes confettiFall {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(105vh) translateX(var(--drift, 0px)) rotate(720deg);
      opacity: 0;
    }
  }
  #celebrationToast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(16px) scale(0.96);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 12px 18px;
    border-radius: 999px;
    font-weight: 750;
    font-size: 0.95rem;
    letter-spacing: 0.2px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.12) inset;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: min(92vw, 420px);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #celebrationToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  #celebrationToast.all-done {
    background: linear-gradient(135deg, #e7c17c 0%, #fff2c2 50%, #e7c17c 100%);
    box-shadow: 0 16px 40px rgba(231,193,124,0.35), 0 0 0 1px rgba(255,255,255,0.2) inset;
  }
  .task.just-completed {
    animation: taskCelebrate 0.62s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft), 0 10px 28px rgba(231,193,124,0.22);
    position: relative;
    overflow: visible;
  }
  @keyframes taskCelebrate {
    0% { transform: scale(1); }
    25% { transform: scale(1.025); }
    50% { transform: scale(0.985); }
    75% { transform: scale(1.012); }
    100% { transform: scale(1); }
  }
  .task.just-completed .check {
    animation: checkPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes checkPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.35); }
    55% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  .sparkle {
    position: absolute;
    pointer-events: none;
    font-size: 14px;
    line-height: 1;
    animation: sparklePop 0.7s ease-out forwards;
    filter: drop-shadow(0 2px 6px rgba(231,193,124,0.5));
  }
  .sparkle.s1 { left: -6px; top: -8px; animation-delay: 0s; }
  .sparkle.s2 { right: -4px; top: -10px; animation-delay: 0.08s; font-size: 12px; }
  .sparkle.s3 { left: 18px; top: -12px; animation-delay: 0.12s; font-size: 10px; }
  @keyframes sparklePop {
    0% { transform: translateY(6px) scale(0) rotate(0deg); opacity: 0; }
    40% { opacity: 1; transform: translateY(0) scale(1.15) rotate(12deg); }
    100% { transform: translateY(-10px) scale(0.9) rotate(-8deg); opacity: 0; }
  }
  #progressBar.complete {
    background: linear-gradient(90deg, var(--accent) 0%, #fff6d0 50%, var(--accent) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.1s ease infinite;
    box-shadow: 0 0 12px rgba(231,193,124,0.45);
  }
  @keyframes shimmer {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }
  .burst {
    position: fixed;
    pointer-events: none;
    z-index: 98;
    font-size: 18px;
    animation: burstUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  }
  @keyframes burstUp {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -90px) scale(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .task.just-completed,
    .task.just-completed .check,
    #progressBar.complete,
    .confetti,
    .sparkle,
    .burst,
    #celebrationToast {
      animation: none !important;
      transition: opacity 0.2s ease !important;
    }
    .task.just-completed {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>
<div id="celebrationLayer" aria-hidden="true"></div>
<div id="celebrationToast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="celebrationLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var celebrationLayer = document.getElementById("celebrationLayer");
  var celebrationToast = document.getElementById("celebrationToast");
  var celebrationLive = document.getElementById("celebrationLive");
  var lastCompletedId = null;
  var toastTimer = null;
  var clearCelebrationTimer = null;
  var celebrationMessages = ["Nice work!", "Great job!", "You did it!", "Amazing!", "Keep shining!", "So satisfying!"];

  function getRandomMessage() {
    return celebrationMessages[Math.floor(Math.random() * celebrationMessages.length)];
  }

  function showToast(text, isAllDone, isHigh) {
    var msg = getRandomMessage();
    var display = text.length > 32 ? text.slice(0, 32) + "…" : text;
    if (isAllDone) {
      celebrationToast.textContent = "✨ All done! " + msg + " ✨";
      celebrationToast.className = "show all-done";
    } else if (isHigh) {
      celebrationToast.textContent = "🔥 " + msg + " High-priority done: " + display;
      celebrationToast.className = "show";
    } else {
      celebrationToast.textContent = "🎉 " + msg + " Completed: " + display;
      celebrationToast.className = "show";
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      celebrationToast.classList.remove("show");
      celebrationToast.classList.remove("all-done");
    }, isAllDone ? 2800 : 2200);
  }

  function announceCelebration(text, isAllDone) {
    celebrationLive.textContent = "";
    setTimeout(function () {
      if (isAllDone) {
        celebrationLive.textContent = "Amazing! All tasks completed. " + text + " completed. Great job!";
      } else {
        celebrationLive.textContent = "Completed: " + text + ". " + getRandomMessage();
      }
    }, 30);
  }

  function createBurstEmoji(x, y, emoji) {
    var b = document.createElement("span");
    b.className = "burst";
    b.textContent = emoji;
    b.style.left = x + "px";
    b.style.top = y + "px";
    b.style.fontSize = (16 + Math.random() * 10) + "px";
    document.body.appendChild(b);
    setTimeout(function () { b.remove(); }, 950);
  }

  function launchConfetti(isHigh, isAllDone) {
    var colors = ["#e7c17c", "#f2ede3", "#e08f7e", "#a8d8a8", "#8ecae6", "#ffd166", "#ff9f9f", "#c9b6ff"];
    var count = isAllDone ? 42 : isHigh ? 34 : 26;
    for (var i = 0; i < count; i++) {
      var c = document.createElement("span");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (0.9 + Math.random() * 0.9) + "s";
      c.style.animationDelay = (Math.random() * 0.18) + "s";
      c.style.setProperty("--drift", (Math.random() * 160 - 80) + "px");
      c.style.width = (6 + Math.random() * 9) + "px";
      c.style.height = (7 + Math.random() * 10) + "px";
      c.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
      c.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      if (Math.random() > 0.7) {
        c.style.height = "3px";
        c.style.width = (10 + Math.random() * 10) + "px";
      }
      celebrationLayer.appendChild(c);
      (function (el) {
        setTimeout(function () { el.remove(); }, 2200);
      })(c);
    }
    if (isAllDone) {
      var centerX = window.innerWidth / 2;
      var centerY = window.innerHeight / 2;
      var emojis = ["🎉", "✨", "🎊", "🌟", "💫"];
      for (var j = 0; j < 6; j++) {
        (function (idx) {
          setTimeout(function () {
            createBurstEmoji(centerX + (Math.random() * 120 - 60), centerY + (Math.random() * 40 - 20), emojis[idx % emojis.length]);
          }, idx * 90);
        })(j);
      }
    } else {
      var burstEmojis = isHigh ? ["🔥", "⭐", "💥"] : ["🎉", "✨", "👏"];
      var bx = window.innerWidth / 2;
      var by = window.innerHeight * 0.45;
      createBurstEmoji(bx, by, burstEmojis[Math.floor(Math.random() * burstEmojis.length)]);
    }
  }

  function triggerCelebration(text, isHigh, isAllDone) {
    launchConfetti(isHigh, isAllDone);
    showToast(text, isAllDone, isHigh);
    announceCelebration(text, isAllDone);
    clearTimeout(clearCelebrationTimer);
    clearCelebrationTimer = setTimeout(function () {
      lastCompletedId = null;
      render();
    }, 900);
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
  }

  function toggleTask(id) {
    var shouldCelebrate = false;
    var celebratedText = "";
    var isHigh = false;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        var wasCompleted = tasks[i].completed;
        tasks[i].completed = !tasks[i].completed;
        if (!wasCompleted && tasks[i].completed) {
          shouldCelebrate = true;
          celebratedText = tasks[i].text;
          isHigh = tasks[i].priority === "high";
          lastCompletedId = id;
        } else {
          lastCompletedId = null;
        }
        break;
      }
    }
    render();
    if (shouldCelebrate) {
      var total = tasks.length;
      var done = tasks.filter(function (t) { return t.completed; }).length;
      var allDone = total > 0 && done === total;
      triggerCelebration(celebratedText, isHigh, allDone);
    }
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));
    if (pct === 100 && total > 0) {
      progressBar.classList.add("complete");
    } else {
      progressBar.classList.remove("complete");
    }

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task) {
      var li = document.createElement("li");
      var isJustCompleted = task.id === lastCompletedId && task.completed;
      li.className = "task" + (task.completed ? " completed" : "") + (isJustCompleted ? " just-completed" : "");

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function () { toggleTask(task.id); });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      if (isJustCompleted) {
        var s1 = document.createElement("span");
        s1.className = "sparkle s1";
        s1.setAttribute("aria-hidden", "true");
        s1.textContent = "✨";
        var s2 = document.createElement("span");
        s2.className = "sparkle s2";
        s2.setAttribute("aria-hidden", "true");
        s2.textContent = "🎉";
        var s3 = document.createElement("span");
        s3.className = "sparkle s3";
        s3.setAttribute("aria-hidden", "true");
        s3.textContent = "⭐";
        li.appendChild(s1);
        li.appendChild(s2);
        li.appendChild(s3);
      }
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
