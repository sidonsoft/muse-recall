<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #controls{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:10px;flex-wrap:wrap;justify-content:center;max-width:900px;width:calc(100vw - 20px);box-sizing:border-box}
  #controls-label{font-weight:bold;color:#5b3a29;font-size:15px}
  #controls button{font-family:inherit;font-size:14px;padding:8px 14px;border-radius:20px;border:2px solid #5da85f;background:#fff;color:#5b3a29;cursor:pointer;transition:all .15s}
  #controls button.active{background:#5da85f;color:#fff;border-color:#5da85f}
  #controls button.hard.active{background:#e76f51;color:#fff;border-color:#e76f51}
  #controls button:focus{outline:3px solid #ffb703;outline-offset:2px}
  #mode-desc{font-size:12px;color:#8a6a4a;flex-basis:100%;text-align:center;margin-top:2px}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;flex-shrink:0}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="controls" role="group" aria-label="Difficulty selection">
  <span id="controls-label">Challenge Mode:</span>
  <button type="button" id="btn-normal" class="active" aria-pressed="true" aria-label="Play normal mode with 6 pairs, relaxed pace">Normal</button>
  <button type="button" id="btn-hard" class="hard" aria-pressed="false" aria-label="Play hard challenge mode with 8 pairs and 60 second timer">Hard Challenge</button>
  <button type="button" id="btn-restart" aria-label="Restart current game">↻ Restart</button>
  <span id="mode-desc" aria-live="polite">Normal mode: 6 pairs, relaxed pace</span>
</div>
<div id="game" role="application" aria-label="Farmyard Memory Match game board"></div>
<div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F430}", name: "Rabbit" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudTimer, hudDifficulty, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = "normal", totalPairs = 6, timeLeft = 60, timerEvent = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupDifficultyControls(s);
    setupKeyboard(s);
    updateHudForDifficulty(s);
    updateLiveRegion();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudTimer = scene.add.text(24, 122, "Time: 60s", textStyle(20, "#c0392b")).setVisible(false);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    hudDifficulty = scene.add.text(W / 2, 148, "Mode: Normal", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    var diffBtn = scene.add.container(W - 300, 116);
    var diffBg = scene.add.graphics();
    diffBg.fillStyle(0x8ecae6, 1); diffBg.fillRoundedRect(-86, -26, 172, 52, 26);
    var diffLabel = scene.add.text(0, 0, "Hard: OFF", textStyle(18, "#ffffff")).setOrigin(0.5);
    diffBtn.add([diffBg, diffLabel]);
    diffBg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    diffBg.on("pointerdown", function () { handleDifficultySelect(scene, difficulty === "hard" ? "normal" : "hard"); });
    diffBg.on("pointerover", function () { diffBtn.setScale(1.06); });
    diffBg.on("pointerout", function () { diffBtn.setScale(1); });
    scene.diffBtn = diffBtn;
    scene.diffBg = diffBg;
    scene.diffLabel = diffLabel;
  }

  function shuffledDeck() {
    var pool = difficulty === "hard" ? ANIMALS : ANIMALS.slice(0, 6);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) c.view.destroy(); else if (c.destroy) c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (difficulty === "hard") {
      cols = 4; rows = 4;
      cw = 175; ch = 108; gx = 62; gy = 185; padX = 18; padY = 12;
    } else {
      cols = 4; rows = 3;
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xffb5a7, 0xb5ead7];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = difficulty === "hard" ? "48px" : "62px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nmSize = difficulty === "hard" ? 18 : 22;
    var nm = scene.add.text(0, 36, data.name, textStyle(nmSize)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); updateLiveRegion(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        updateLiveRegion();
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      updateLiveRegion();
      var delay = difficulty === "hard" ? 500 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Flip the cards and find\nall animal pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var diffLabel = scene.add.text(0, 48, "Choose your challenge:", textStyle(18, "#5b3a29")).setOrigin(0.5);
    var normalBg = scene.add.graphics();
    normalBg.fillStyle(0x5da85f, 1); normalBg.fillRoundedRect(-260, 70, 220, 60, 30);
    var normalTx = scene.add.text(-150, 100, "Normal", textStyle(20, "#ffffff")).setOrigin(0.5);
    var normalSub = scene.add.text(-150, 118, "6 pairs", textStyle(12, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xe76f51, 1); hardBg.fillRoundedRect(40, 70, 220, 60, 30);
    var hardTx = scene.add.text(150, 100, "Hard \u2605", textStyle(20, "#ffffff")).setOrigin(0.5);
    var hardSub = scene.add.text(150, 118, "8 pairs + 60s", textStyle(12, "#ffffff")).setOrigin(0.5);
    var info = scene.add.text(0, 155, "Hard: faster flips & ticking clock!", textStyle(14, "#8a6a4a")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, diffLabel, normalBg, normalTx, normalSub, hardBg, hardTx, hardSub, info]);
    scene.startDesc = info;
    normalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 70, 220, 60), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(40, 70, 220, 60), Phaser.Geom.Rectangle.Contains);
    normalBg.on("pointerdown", function () { startGame(scene, "normal"); });
    hardBg.on("pointerdown", function () { startGame(scene, "hard"); });
    normalBg.on("pointerover", function () { normalTx.setScale(1.06); });
    normalBg.on("pointerout", function () { normalTx.setScale(1); });
    hardBg.on("pointerover", function () { hardTx.setScale(1.06); });
    hardBg.on("pointerout", function () { hardTx.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnBg.on("pointerover", function () { btnTx.setScale(1.05); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
  }

  function showWin(scene) {
    stopTimer(scene);
    var stars, detail;
    if (difficulty === "hard") {
      stars = moves <= 12 ? 3 : (moves <= 18 ? 2 : 1);
      var timeBonus = timeLeft > 30 ? " Lightning fast! \u26A1" : (timeLeft > 10 ? " Great time!" : " Just in time!");
      detail = "Hard Challenge Complete!\nPairs: " + totalPairs + "  Moves: " + moves + "  Time: " + timeLeft + "s\n" + "\u2B50".repeat(stars) + timeBonus;
      endTitle.setText("\u{1F3C6} Hard Mode Win! \u{1F3C6}");
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
      detail = "You found all " + totalPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars);
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
    }
    endDetail.setText(detail);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText(difficulty === "hard" ? "Hard mode cleared! \u{1F3C6}" : "You win! \u{1F389}");
    updateLiveRegion(detail);
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function handleTimeout(scene) {
    lockBoard = true;
    started = false;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / " + totalPairs + " pairs\nHard mode is tough! Try again?");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again!");
    updateLiveRegion("Time's up! You found " + matches + " out of " + totalPairs + " pairs");
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    stopTimer(scene);
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText(difficulty === "hard" ? "Hard mode! Go!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    buildBoard(scene);
    updateHudForDifficulty(scene);
    if (difficulty === "hard") { startTimer(scene); }
    updateLiveRegion();
  }

  function startGame(scene, diff) {
    difficulty = diff;
    totalPairs = diff === "hard" ? 8 : 6;
    started = true; lockBoard = false;
    moves = 0; matches = 0; firstPick = null;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMsg.setText(diff === "hard" ? "Hard mode! Go!" : "Tap a card!");
    if (startOverlay) startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    buildBoard(scene);
    updateHudForDifficulty(scene);
    if (diff === "hard") startTimer(scene);
    else stopTimer(scene);
    updateLiveRegion();
  }

  function handleDifficultySelect(scene, diff) {
    if (difficulty === diff && startOverlay && !startOverlay.visible && started) {
      restart(scene);
      return;
    }
    difficulty = diff;
    totalPairs = diff === "hard" ? 8 : 6;
    updateHudForDifficulty(scene);
    if (scene.startDesc) {
      scene.startDesc.setText(diff === "hard" ? "Hard: 8 pairs + 60s timer! Faster flips!" : "Hard: faster flips & ticking clock!");
    }
    if (!startOverlay.visible) {
      restart(scene);
    }
    updateLiveRegion();
  }

  function updateHudForDifficulty(scene) {
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    if (hudDifficulty) hudDifficulty.setText(difficulty === "hard" ? "\u2605 Hard Challenge \u2605" : "Mode: Normal");
    if (hudTimer) {
      if (difficulty === "hard" && started) {
        hudTimer.setVisible(true);
        updateTimerDisplay();
      } else {
        hudTimer.setVisible(false);
      }
    }
    if (scene && scene.diffLabel && scene.diffBg) {
      scene.diffLabel.setText(difficulty === "hard" ? "Hard: ON" : "Hard: OFF");
      scene.diffBg.clear();
      scene.diffBg.fillStyle(difficulty === "hard" ? 0xe76f51 : 0x8ecae6, 1);
      scene.diffBg.fillRoundedRect(-86, -26, 172, 52, 26);
    }
    var btnNormal = document.getElementById("btn-normal");
    var btnHard = document.getElementById("btn-hard");
    var desc = document.getElementById("mode-desc");
    if (btnNormal && btnHard) {
      btnNormal.setAttribute("aria-pressed", difficulty === "normal" ? "true" : "false");
      btnHard.setAttribute("aria-pressed", difficulty === "hard" ? "true" : "false");
      if (difficulty === "normal") { btnNormal.classList.add("active"); btnHard.classList.remove("active"); }
      else { btnHard.classList.add("active"); btnNormal.classList.remove("active"); }
    }
    if (desc) {
      desc.textContent = difficulty === "hard" ? "Hard Challenge: 8 pairs, 60s timer, faster flips!" : "Normal mode: 6 pairs, relaxed pace";
    }
  }

  function startTimer(scene) {
    stopTimer(scene);
    timeLeft = 60;
    updateTimerDisplay();
    if (hudTimer) hudTimer.setVisible(true);
    timerEvent = scene.time.addEvent({
      delay: 1000,
      loop: true,
      callback: function () {
        timeLeft--;
        updateTimerDisplay();
        updateLiveRegion();
        if (timeLeft <= 10 && hudTimer) {
          scene.tweens.add({ targets: hudTimer, scaleX: 1.15, scaleY: 1.15, yoyo: true, duration: 120 });
        }
        if (timeLeft <= 0) {
          stopTimer(scene);
          handleTimeout(scene);
        }
      }
    });
  }

  function stopTimer(scene) {
    if (timerEvent) { timerEvent.remove(); timerEvent = null; }
    if (hudTimer && difficulty !== "hard") hudTimer.setVisible(false);
  }

  function updateTimerDisplay() {
    if (!hudTimer) return;
    hudTimer.setText("Time: " + timeLeft + "s");
    if (timeLeft <= 10) hudTimer.setStyle({ color: "#c0392b" });
    else hudTimer.setStyle({ color: "#7a4a2b" });
  }

  function setupDifficultyControls(scene) {
    var btnNormal = document.getElementById("btn-normal");
    var btnHard = document.getElementById("btn-hard");
    var btnRestart = document.getElementById("btn-restart");
    if (btnNormal) {
      btnNormal.addEventListener("click", function () { handleDifficultySelect(scene, "normal"); });
      btnNormal.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleDifficultySelect(scene, "normal"); } });
    }
    if (btnHard) {
      btnHard.addEventListener("click", function () { handleDifficultySelect(scene, "hard"); });
      btnHard.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleDifficultySelect(scene, "hard"); } });
    }
    if (btnRestart) {
      btnRestart.addEventListener("click", function () { restart(scene); });
      btnRestart.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); restart(scene); } });
    }
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown-N", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "normal"); } });
    scene.input.keyboard.on("keydown-H", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); } });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
  }

  function updateLiveRegion(msg) {
    var el = document.getElementById("live-region");
    if (!el) return;
    if (msg) { el.textContent = msg; return; }
    el.textContent = "Moves " + moves + ", Pairs " + matches + " of " + totalPairs + (difficulty === "hard" && started ? ", Time " + timeLeft + " seconds, Hard mode" : ", " + difficulty + " mode");
  }

  function update() {}
})();
</script>
</body>
</html>
