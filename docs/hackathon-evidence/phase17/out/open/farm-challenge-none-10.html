<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F430}", name: "Bunny" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, hudTimer, endOverlay, endTitle, endDetail, endHint, startOverlay;
  var modeBtn, modeBtnLabel;
  var difficulty = "normal";
  var totalPairs = 6;
  var elapsed = 0;
  var timerEvent = null;
  var gameScene = null;

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    updateModeUI();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function getPairCount() {
    return difficulty === "hard" ? 8 : 6;
  }

  function getGridConfig() {
    if (difficulty === "hard") {
      return { cols: 4, rows: 4, cw: 168, ch: 118, gx: 76, gy: 188, padX: 18, padY: 12 };
    }
    return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22));
    hudMode = scene.add.text(24, 112, "Mode: Normal", textStyle(16, "#7a4a2b")).setOrigin(0, 0);
    hudTimer = scene.add.text(24, 134, "Time: 0s", textStyle(18, "#b34a3e")).setOrigin(0, 0).setVisible(false);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#7a4a2b")).setOrigin(1, 0.5);

    // Mode toggle button
    modeBtn = scene.add.container(W - 300, 116);
    var modeBg = scene.add.graphics();
    modeBg.fillStyle(0xfff6dd, 1); modeBg.fillRoundedRect(-86, -26, 172, 52, 26);
    modeBg.lineStyle(3, 0x5da85f, 1); modeBg.strokeRoundedRect(-86, -26, 172, 52, 26);
    modeBtnLabel = scene.add.text(0, 0, "Hard: OFF", textStyle(18, "#5b3a29")).setOrigin(0.5);
    modeBtn.add([modeBg, modeBtnLabel]);
    modeBg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    modeBg.on("pointerdown", function () { toggleDifficulty(); });
    modeBg.on("pointerover", function () { modeBtn.setScale(1.06); });
    modeBg.on("pointerout", function () { modeBtn.setScale(1); });

    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the animal pairs!", textStyle(20, "#8a6a4a")).setOrigin(0.5).setName("hudHint");
  }

  function updateModeUI() {
    totalPairs = getPairCount();
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
    if (hudMode) {
      if (difficulty === "hard") {
        hudMode.setText("Mode: Hard \u2605 8 pairs \u2022 Faster flips!");
        hudMode.setStyle(textStyle(16, "#b34a3e"));
      } else {
        hudMode.setText("Mode: Normal \u2022 6 pairs");
        hudMode.setStyle(textStyle(16, "#7a4a2b"));
      }
    }
    if (modeBtnLabel) {
      modeBtnLabel.setText(difficulty === "hard" ? "Hard: ON \u2605" : "Hard: OFF");
    }
    if (hudTimer) {
      hudTimer.setVisible(difficulty === "hard");
      hudTimer.setText("Time: " + elapsed + "s");
    }
    if (hudMsg) {
      if (!started) {
        hudMsg.setText(difficulty === "hard" ? "Hard Mode Ready!" : "Tap a card!");
      }
    }
  }

  function shuffledDeck(pairCount) {
    var count = pairCount || getPairCount();
    var pool = ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cfg = getGridConfig();
    var cols = cfg.cols, cw = cfg.cw, ch = cfg.ch, gx = cfg.gx, gy = cfg.gy, padX = cfg.padX, padY = cfg.padY;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var pawSize = w < 175 ? "44px" : "56px";
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: pawSize }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xffb5a7, 0xb5ead7];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = w < 175 ? "48px" : "62px";
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nmSize = w < 175 ? 18 : 22;
    var nm = scene.add.text(0, 44, data.name, textStyle(nmSize)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText(difficulty === "hard" ? "Find its match!" : "One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText(difficulty === "hard" ? "No match!" : "Try again! \u{1F340}");
      var delay = difficulty === "hard" ? 500 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -95, "Choose your challenge!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -50, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);

    // Normal button
    var normalBg = scene.add.graphics();
    normalBg.fillStyle(0x5da85f, 1); normalBg.fillRoundedRect(-260, 10, 240, 64, 32);
    var normalTx = scene.add.text(-140, 42, "\u25B6  Normal", textStyle(24, "#ffffff")).setOrigin(0.5);
    var normalSub = scene.add.text(-140, 78, "6 pairs \u2022 Relaxed", textStyle(14, "#ffffff")).setOrigin(0.5);

    // Hard button
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xb34a3e, 1); hardBg.fillRoundedRect(20, 10, 240, 64, 32);
    var hardTx = scene.add.text(140, 42, "\u2605 Hard", textStyle(24, "#ffffff")).setOrigin(0.5);
    var hardSub = scene.add.text(140, 78, "8 pairs \u2022 Faster flips!", textStyle(14, "#ffffff")).setOrigin(0.5);

    var hint = scene.add.text(0, 125, "Hard Mode: 4\u00D74 grid + timer challenge", textStyle(15, "#8a6a4a")).setOrigin(0.5);
    var keys = scene.add.text(0, 150, "Tip: Press N for Normal, H for Hard, R to Restart", textStyle(13, "#a08060")).setOrigin(0.5);

    startOverlay.add([bg, panel, title, sub, row, normalBg, normalTx, normalSub, hardBg, hardTx, hardSub, hint, keys]);

    normalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 10, 240, 64), Phaser.Geom.Rectangle.Contains);
    normalBg.on("pointerdown", function () { startGame(scene, "normal"); });
    normalBg.on("pointerover", function () { normalBg.parentContainer.setScale(1.02); });
    normalBg.on("pointerout", function () { normalBg.parentContainer.setScale(1); });

    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 10, 240, 64), Phaser.Geom.Rectangle.Contains);
    hardBg.on("pointerdown", function () { startGame(scene, "hard"); });
    hardBg.on("pointerover", function () { hardBg.parentContainer.setScale(1.02); });
    hardBg.on("pointerout", function () { hardBg.parentContainer.setScale(1); });

    // keyboard focus helpers
    normalBg.setName("normalStartBtn");
    hardBg.setName("hardStartBtn");
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    endTitle = scene.add.text(0, -115, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -45, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    endHint = scene.add.text(0, 15, "", Object.assign(textStyle(16), { align: "center", color: "#b34a3e" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var switchBg = scene.add.graphics();
    switchBg.fillStyle(0xfff6dd, 1); switchBg.fillRoundedRect(-130, 130, 260, 44, 22);
    switchBg.lineStyle(3, 0x5da85f, 1); switchBg.strokeRoundedRect(-130, 130, 260, 44, 22);
    var switchTx = scene.add.text(0, 152, "Switch Difficulty", textStyle(16, "#5b3a29")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, endHint, btnBg, btnTx, switchBg, switchTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    switchBg.setInteractive(new Phaser.Geom.Rectangle(-130, 130, 260, 44), Phaser.Geom.Rectangle.Contains);
    switchBg.on("pointerdown", function () {
      toggleDifficulty();
      restart(scene);
    });
  }

  function showWin(scene) {
    stopTimer();
    var isHard = difficulty === "hard";
    var stars;
    if (isHard) {
      stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1);
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    var modeLabel = isHard ? "Hard Mode \u2605" : "Normal Mode";
    var timeText = isHard ? "\nTime: " + elapsed + "s" : "";
    endDetail.setText("You found all " + totalPairs + " pairs!\n" + modeLabel + " \u2022 Moves: " + moves + timeText + "  " + "\u2B50".repeat(stars));
    if (!isHard) {
      endHint.setText("Loved it? Try Hard Mode: 8 pairs + faster flips!");
    } else {
      var msg = stars === 3 ? "Amazing! You mastered the farm!" : (stars === 2 ? "Great job, farmer!" : "You beat Hard Mode!");
      endHint.setText(msg + " Try again for 3 stars!");
    }
    endTitle.setText(isHard ? "\u{1F389} Hard Win! \u{1F389}" : "\u{1F389} You Win! \u{1F389}");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function startGame(scene, chosenDifficulty) {
    if (chosenDifficulty) { difficulty = chosenDifficulty; }
    totalPairs = getPairCount();
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    elapsed = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMsg.setText(difficulty === "hard" ? "Hard Mode! Go!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    updateModeUI();
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    buildBoard(scene);
    startTimer(scene);
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    elapsed = 0;
    totalPairs = getPairCount();
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText(difficulty === "hard" ? "Hard Mode! Go!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    updateModeUI();
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    buildBoard(scene);
    startTimer(scene);
  }

  function toggleDifficulty() {
    difficulty = difficulty === "hard" ? "normal" : "hard";
    totalPairs = getPairCount();
    updateModeUI();
    if (started) {
      // if game already started, restart with new difficulty
      if (gameScene) {
        restart(gameScene);
      }
    } else {
      // if on start screen, rebuild board preview behind overlay
      if (gameScene) {
        cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
        buildBoard(gameScene);
      }
    }
  }

  function startTimer(scene) {
    stopTimer();
    elapsed = 0;
    if (hudTimer) { hudTimer.setText("Time: 0s"); }
    if (difficulty !== "hard") { return; }
    timerEvent = scene.time.addEvent({
      delay: 1000,
      loop: true,
      callback: function () {
        elapsed++;
        if (hudTimer) { hudTimer.setText("Time: " + elapsed + "s"); }
      }
    });
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function setupKeyboard(scene) {
    document.addEventListener("keydown", function (e) {
      var key = e.key.toLowerCase();
      if (key === "r") {
        if (started || (endOverlay && endOverlay.visible)) {
          restart(scene);
        } else if (startOverlay && startOverlay.visible) {
          startGame(scene, difficulty);
        }
      }
      if (key === "h") {
        if (startOverlay && startOverlay.visible) {
          startGame(scene, "hard");
        } else {
          if (difficulty !== "hard") { toggleDifficulty(); }
          else if (!started) { startGame(scene, "hard"); }
        }
      }
      if (key === "n") {
        if (startOverlay && startOverlay.visible) {
          startGame(scene, "normal");
        } else {
          if (difficulty !== "normal") { toggleDifficulty(); }
        }
      }
      if (key === "m") {
        toggleDifficulty();
      }
      if (e.key === "Enter" || e.key === " ") {
        if (startOverlay && startOverlay.visible) {
          // Enter defaults to current difficulty selection, Space toggles
          if (e.key === "Enter") {
            startGame(scene, difficulty);
          }
        } else if (endOverlay && endOverlay.visible) {
          if (e.key === "Enter") { restart(scene); }
        }
      }
      if (e.key === "Escape") {
        if (endOverlay && endOverlay.visible) {
          endOverlay.setVisible(false);
        }
      }
    });
    // Phaser keyboard for focus inside canvas
    if (scene.input && scene.input.keyboard) {
      scene.input.keyboard.on("keydown-ENTER", function () {
        if (startOverlay && startOverlay.visible) { startGame(scene, difficulty); }
        else if (endOverlay && endOverlay.visible) { restart(scene); }
      });
      scene.input.keyboard.on("keydown-SPACE", function () {
        if (startOverlay && startOverlay.visible) { toggleDifficulty(); }
      });
    }
  }

  function update() {}
})();
