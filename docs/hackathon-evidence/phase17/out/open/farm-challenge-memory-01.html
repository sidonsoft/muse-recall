<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #modeBar{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0 8px 0;flex-wrap:wrap}
  .mode-label{color:#102A43;font-size:17px;font-weight:bold;letter-spacing:0.2px}
  .mode-btn{padding:9px 16px;border-radius:24px;border:2px solid #4EA8DE;background:#ffffff;color:#102A43;font-family:inherit;font-size:15px;font-weight:bold;cursor:pointer;transition:all .15s ease}
  .mode-btn[aria-pressed="true"]{background:#4EA8DE;color:#ffffff;border-color:#4EA8DE;box-shadow:0 2px 8px rgba(78,168,222,.35)}
  .mode-btn:focus{outline:3px solid #102A43;outline-offset:2px}
  .mode-btn:hover{transform:translateY(-1px)}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="modeBar" role="group" aria-label="Difficulty selection">
  <span class="mode-label" id="modeLabel">Challenge:</span>
  <button type="button" class="mode-btn" id="btnEasy" aria-pressed="true" aria-label="Easy mode, 6 pairs">Easy · 6 pairs</button>
  <button type="button" class="mode-btn" id="btnHard" aria-pressed="false" aria-label="Hard mode, 8 pairs">Hard · 8 pairs</button>
</div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F415}", name: "Dog" },
    { emoji: "\u{1F431}", name: "Cat" },
    { emoji: "\u{1F430}", name: "Rabbit" },
    { emoji: "\u{1F98A}", name: "Fox" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F983}", name: "Turkey" }
  ];
  var W = 900, H = 700;
  var difficulty = "easy";
  var totalPairs = 6;
  var gameScene = null;
  var focusedIndex = 0;
  var focusRect = null;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E6F4FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudSubtitle, endOverlay, endTitle, endDetail, startOverlay;
  var hudModeEasyBg, hudModeHardBg, hudModeEasyTx, hudModeHardTx;
  var startModeEasyBg, startModeHardBg, startModeEasyTx, startModeHardTx;

  function getPairsCount() {
    return difficulty === "hard" ? 8 : 6;
  }
  function getGridConfig() {
    if (difficulty === "hard") {
      return { cols: 4, rows: 4, cw: 165, ch: 115, gx: 62, gy: 185, padX: 18, padY: 12 };
    } else {
      return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
    }
  }

  function create() {
    var s = this;
    gameScene = s;
    totalPairs = getPairsCount();
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    createFocusRect(s);
    setupKeyboard(s);
    syncModeButtons();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE6F4FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xB8E0F6, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xD9ECF8, 1); g.fillRect(0, 560, W, 140);
    g.fillStyle(0xFFFFFF, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xE1F5FE, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0x4EA8DE, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xFFFFFF, 0.9); g.fillCircle(755, 100, 10); g.fillCircle(785, 115, 7);
    // barn recolored to ocean palette - lighthouse style
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2A6CB6, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xFFFFFF, 1); g.fillRect(135, 390, 40, 80);
    g.fillStyle(0x102A43, 1); g.fillRect(145, 410, 20, 20);
    g.lineStyle(4, 0xFFFFFF, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence / waves
    g.lineStyle(8, 0x4EA8DE, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea elements - bubbles and shells
    var cols = [0x4EA8DE, 0x7EC8E3, 0xA8D8EA, 0xB8E0F6];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2A9D8F, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFE066, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // gentle waves
    g.lineStyle(3, 0x7EC8E3, 0.9);
    for (var wy = 485; wy <= 505; wy += 8) {
      for (var wx = 310; wx < 870; wx += 40) {
        g.beginPath();
        g.moveTo(wx, wy);
        g.lineTo(wx + 20, wy - 4);
        g.lineTo(wx + 40, wy);
        g.strokePath();
      }
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22, "#102A43"));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / " + getPairsCount(), textStyle(22, "#102A43"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    hudSubtitle = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(20, "#102A43")).setOrigin(0.5);

    // Restart button
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });

    // HUD mode toggle - two pill buttons
    var modeContainer = scene.add.container(W - 110, 176);
    var modeLabel = scene.add.text(-110, 0, "Mode:", textStyle(16, "#102A43")).setOrigin(0, 0.5);
    // Easy button
    hudModeEasyBg = scene.add.graphics();
    hudModeEasyTx = scene.add.text(-55, 0, "Easy", textStyle(15, "#ffffff")).setOrigin(0.5);
    var easyHit = scene.add.graphics();
    easyHit.fillStyle(0x000000, 0); easyHit.fillRoundedRect(-85, -16, 60, 32, 16);
    easyHit.setInteractive(new Phaser.Geom.Rectangle(-85, -16, 60, 32), Phaser.Geom.Rectangle.Contains);
    easyHit.on("pointerdown", function () { setDifficulty("easy"); });
    easyHit.on("pointerover", function () { modeContainer.setScale(1.02); });
    easyHit.on("pointerout", function () { modeContainer.setScale(1); });
    // Hard button
    hudModeHardBg = scene.add.graphics();
    hudModeHardTx = scene.add.text(15, 0, "Hard", textStyle(15, "#ffffff")).setOrigin(0.5);
    var hardHit = scene.add.graphics();
    hardHit.fillStyle(0x000000, 0); hardHit.fillRoundedRect(-15, -16, 60, 32, 16);
    hardHit.setInteractive(new Phaser.Geom.Rectangle(-15, -16, 60, 32), Phaser.Geom.Rectangle.Contains);
    hardHit.on("pointerdown", function () { setDifficulty("hard"); });
    modeContainer.add([modeLabel, hudModeEasyBg, hudModeEasyTx, easyHit, hudModeHardBg, hudModeHardTx, hardHit]);
    // keyboard handling for HUD mode buttons via explicit keydown on scene
    easyHit.setInteractive().on("pointerdown", function(){ setDifficulty("easy"); });
    hardHit.setInteractive().on("pointerdown", function(){ setDifficulty("hard"); });
  }

  function updateHudModeButtons() {
    if (!hudModeEasyBg) return;
    hudModeEasyBg.clear();
    hudModeHardBg.clear();
    if (difficulty === "easy") {
      hudModeEasyBg.fillStyle(0x4EA8DE, 1); hudModeEasyBg.fillRoundedRect(-85, -16, 60, 32, 16);
      hudModeEasyBg.lineStyle(2, 0x102A43, 1); hudModeEasyBg.strokeRoundedRect(-85, -16, 60, 32, 16);
      hudModeHardBg.fillStyle(0xFFFFFF, 1); hudModeHardBg.fillRoundedRect(-15, -16, 60, 32, 16);
      hudModeHardBg.lineStyle(2, 0x4EA8DE, 1); hudModeHardBg.strokeRoundedRect(-15, -16, 60, 32, 16);
      hudModeEasyTx.setColor("#ffffff");
      hudModeHardTx.setColor("#102A43");
    } else {
      hudModeEasyBg.fillStyle(0xFFFFFF, 1); hudModeEasyBg.fillRoundedRect(-85, -16, 60, 32, 16);
      hudModeEasyBg.lineStyle(2, 0x4EA8DE, 1); hudModeEasyBg.strokeRoundedRect(-85, -16, 60, 32, 16);
      hudModeHardBg.fillStyle(0x4EA8DE, 1); hudModeHardBg.fillRoundedRect(-15, -16, 60, 32, 16);
      hudModeHardBg.lineStyle(2, 0x102A43, 1); hudModeHardBg.strokeRoundedRect(-15, -16, 60, 32, 16);
      hudModeEasyTx.setColor("#102A43");
      hudModeHardTx.setColor("#ffffff");
    }
  }

  function shuffledDeck(count) {
    var deck = [];
    var pool = ANIMALS.slice(0, count);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    totalPairs = getPairsCount();
    var deck = shuffledDeck(totalPairs);
    var cfg = getGridConfig();
    var cols = cfg.cols, cw = cfg.cw, ch = cfg.ch, gx = cfg.gx, gy = cfg.gy, padX = cfg.padX, padY = cfg.padY;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    if (hudSubtitle) hudSubtitle.setText("Find the " + totalPairs + " animal pairs!" + (difficulty === "hard" ? "  \u2022 Hard" : ""));
    focusedIndex = 0;
    updateFocus();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xFFFFFF, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xFFFFFF, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE6F4FF, 0xB8E0F6, 0xA8D8EA, 0xD4EAF7, 0xC1E7F3, 0xE1F5FE, 0xD6EAF8, 0xEBF5FB, 0xEAF6FF, 0xB8E0F6, 0xA8D8EA, 0xD4EAF7];
    fg.fillStyle(0xFFFFFF, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = w > 170 ? "62px" : "52px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nmSize = w > 170 ? 20 : 18;
    var nm = scene.add.text(0, 38, data.name, textStyle(nmSize, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    focusedIndex = card.index;
    updateFocus();
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -90, "Flip the cards and find all the pairs!", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -45, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var choose = scene.add.text(0, -5, "Choose your challenge:", textStyle(18, "#102A43")).setOrigin(0.5);

    // Mode buttons in start overlay
    startModeEasyBg = scene.add.graphics();
    startModeEasyTx = scene.add.text(-90, 38, "Easy\n6 pairs \u2022 4x3", Object.assign(textStyle(16, "#102A43"), { align: "center" })).setOrigin(0.5);
    var easyHit = scene.add.graphics();
    easyHit.fillStyle(0x000000, 0); easyHit.fillRoundedRect(-170, 10, 160, 56, 18);
    easyHit.setInteractive(new Phaser.Geom.Rectangle(-170, 10, 160, 56), Phaser.Geom.Rectangle.Contains);
    easyHit.on("pointerdown", function () { setDifficulty("easy"); });
    easyHit.on("pointerover", function () { startOverlay.setScale(1.01); });
    easyHit.on("pointerout", function () { startOverlay.setScale(1); });

    startModeHardBg = scene.add.graphics();
    startModeHardTx = scene.add.text(90, 38, "Hard\n8 pairs \u2022 4x4", Object.assign(textStyle(16, "#102A43"), { align: "center" })).setOrigin(0.5);
    var hardHit = scene.add.graphics();
    hardHit.fillStyle(0x000000, 0); hardHit.fillRoundedRect(10, 10, 160, 56, 18);
    hardHit.setInteractive(new Phaser.Geom.Rectangle(10, 10, 160, 56), Phaser.Geom.Rectangle.Contains);
    hardHit.on("pointerdown", function () { setDifficulty("hard"); });

    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 90, 260, 70, 35);
    var btnTx = scene.add.text(0, 125, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 175, "Tip: Hard mode has 16 cards to remember!", textStyle(14, "#4EA8DE")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, choose, startModeEasyBg, startModeEasyTx, easyHit, startModeHardBg, startModeHardTx, hardHit, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 90, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      focusedIndex = 0;
      updateFocus();
    });
    // keyboard support for start overlay buttons
    scene.input.keyboard.on("keydown", function(e){
      if (!startOverlay.visible) return;
      if (e.key === "ArrowLeft") { setDifficulty("easy"); }
      if (e.key === "ArrowRight") { setDifficulty("hard"); }
      if (e.key === "Enter" || e.key === " ") {
        if (document.activeElement && document.activeElement.id === "btnEasy") { setDifficulty("easy"); }
        if (document.activeElement && document.activeElement.id === "btnHard") { setDifficulty("hard"); }
      }
    });
    updateStartModeButtons();
  }

  function updateStartModeButtons() {
    if (!startModeEasyBg) return;
    startModeEasyBg.clear();
    startModeHardBg.clear();
    if (difficulty === "easy") {
      startModeEasyBg.fillStyle(0x4EA8DE, 1); startModeEasyBg.fillRoundedRect(-170, 10, 160, 56, 18);
      startModeEasyBg.lineStyle(3, 0x102A43, 1); startModeEasyBg.strokeRoundedRect(-170, 10, 160, 56, 18);
      startModeHardBg.fillStyle(0xFFFFFF, 1); startModeHardBg.fillRoundedRect(10, 10, 160, 56, 18);
      startModeHardBg.lineStyle(2, 0x4EA8DE, 1); startModeHardBg.strokeRoundedRect(10, 10, 160, 56, 18);
      startModeEasyTx.setColor("#ffffff");
      startModeHardTx.setColor("#102A43");
    } else {
      startModeEasyBg.fillStyle(0xFFFFFF, 1); startModeEasyBg.fillRoundedRect(-170, 10, 160, 56, 18);
      startModeEasyBg.lineStyle(2, 0x4EA8DE, 1); startModeEasyBg.strokeRoundedRect(-170, 10, 160, 56, 18);
      startModeHardBg.fillStyle(0x4EA8DE, 1); startModeHardBg.fillRoundedRect(10, 10, 160, 56, 18);
      startModeHardBg.lineStyle(3, 0x102A43, 1); startModeHardBg.strokeRoundedRect(10, 10, 160, 56, 18);
      startModeEasyTx.setColor("#102A43");
      startModeHardTx.setColor("#ffffff");
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xFFFFFF, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var modeLabel = difficulty === "hard" ? "Hard \u2022 8 pairs" : "Easy \u2022 6 pairs";
    endDetail.setText("You found all " + totalPairs + " pairs!\n" + modeLabel + "  \u2022  Moves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    totalPairs = getPairsCount();
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    if (hudSubtitle) hudSubtitle.setText("Find the " + totalPairs + " animal pairs!" + (difficulty === "hard" ? "  \u2022 Hard" : ""));
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    focusedIndex = 0;
    updateFocus();
  }

  function createFocusRect(scene) {
    focusRect = scene.add.graphics().setDepth(5).setVisible(false);
  }

  function updateFocus() {
    if (!focusRect || !cards.length) return;
    if (!started) { focusRect.setVisible(false); return; }
    var card = cards[focusedIndex];
    if (!card) return;
    focusRect.clear();
    focusRect.lineStyle(4, 0x102A43, 1);
    var w = card.view.width || 185;
    var h = card.view.height || 140;
    // use actual card size from grid config
    var cfg = getGridConfig();
    w = cfg.cw; h = cfg.ch;
    focusRect.strokeRoundedRect(card.view.x - w/2 - 4, card.view.y - h/2 - 4, w + 8, h + 8, 22);
    focusRect.setVisible(true);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (!started || !cards.length) return;
      var cfg = getGridConfig();
      var cols = cfg.cols;
      var total = cards.length;
      var handled = false;
      if (e.key === "ArrowLeft") {
        focusedIndex = (focusedIndex - 1 + total) % total;
        handled = true;
      } else if (e.key === "ArrowRight") {
        focusedIndex = (focusedIndex + 1) % total;
        handled = true;
      } else if (e.key === "ArrowUp") {
        focusedIndex = (focusedIndex - cols + total) % total;
        handled = true;
      } else if (e.key === "ArrowDown") {
        focusedIndex = (focusedIndex + cols) % total;
        handled = true;
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        var card = cards[focusedIndex];
        if (card) onCard(scene, card);
        handled = true;
      }
      if (handled) {
        updateFocus();
      }
    });
  }

  function setDifficulty(mode) {
    difficulty = mode;
    totalPairs = getPairsCount();
    syncModeButtons();
    if (gameScene) {
      if (hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs);
      if (hudSubtitle) hudSubtitle.setText("Find the " + totalPairs + " animal pairs!" + (difficulty === "hard" ? "  \u2022 Hard" : ""));
      // if game already started, rebuild board for new challenge
      if (started) {
        moves = 0; matches = 0; firstPick = null; lockBoard = false;
        if (hudMoves) hudMoves.setText("Moves: 0");
        if (hudScore) hudScore.setText("Pairs: 0 / " + totalPairs);
        if (hudMsg) hudMsg.setText("Tap a card!");
        if (endOverlay) endOverlay.setVisible(false);
        cards.forEach(function (c) { c.view.destroy(); });
        buildBoard(gameScene);
      } else {
        // not started yet, just rebuild preview board
        if (cards.length) {
          cards.forEach(function (c) { c.view.destroy(); });
          buildBoard(gameScene);
        }
      }
    }
  }

  function syncModeButtons() {
    var easyBtn = document.getElementById("btnEasy");
    var hardBtn = document.getElementById("btnHard");
    if (easyBtn && hardBtn) {
      easyBtn.setAttribute("aria-pressed", difficulty === "easy" ? "true" : "false");
      hardBtn.setAttribute("aria-pressed", difficulty === "hard" ? "true" : "false");
    }
    updateHudModeButtons();
    updateStartModeButtons();
  }

  // DOM mode bar listeners with explicit click and keydown
  document.getElementById("btnEasy").addEventListener("click", function () { setDifficulty("easy"); });
  document.getElementById("btnEasy").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("easy"); }
  });
  document.getElementById("btnHard").addEventListener("click", function () { setDifficulty("hard"); });
  document.getElementById("btnHard").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("hard"); }
  });

  function update() {}
})();
</script>
</body>
</html>
