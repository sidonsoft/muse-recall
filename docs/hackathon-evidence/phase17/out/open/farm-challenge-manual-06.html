<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#e6f3fb;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Memory Match game. Use mouse or keyboard arrows and Enter to play. Choose Easy or Hard Challenge."></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F407}", name: "Rabbit" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#e0f2fe",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = 'easy', totalPairs = 6;
  var focusedIndex = 0, focusRing = null;
  var modeToggleLabel = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    focusRing = s.add.graphics().setDepth(5).setVisible(false);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    s.input.keyboard.on('keydown', function(event) {
      if (startOverlay && startOverlay.visible) {
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          s.startFocusIndex = s.startFocusIndex === 0 ? 1 : 0;
          s.startUpdateFocus();
        } else if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          if (s.startFocusIndex === 0) {
            setDifficulty('easy'); started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card!"); buildBoard(s); updateModeHud(s); updateFocusRing(s);
          } else {
            setDifficulty('hard'); started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Hard mode! Find 8 pairs!"); buildBoard(s); updateModeHud(s); updateFocusRing(s);
          }
        } else if (event.key.toLowerCase() === 'e') {
          setDifficulty('easy'); started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Tap a card!"); buildBoard(s); updateModeHud(s); updateFocusRing(s);
        } else if (event.key.toLowerCase() === 'h') {
          setDifficulty('hard'); started = true; lockBoard = false; startOverlay.setVisible(false); hudMsg.setText("Hard mode! Find 8 pairs!"); buildBoard(s); updateModeHud(s); updateFocusRing(s);
        }
      } else if (started && endOverlay && !endOverlay.visible) {
        if (event.key === 'ArrowLeft') {
          focusedIndex = (focusedIndex - 1 + cards.length) % cards.length;
          updateFocusRing(s);
        } else if (event.key === 'ArrowRight') {
          focusedIndex = (focusedIndex + 1) % cards.length;
          updateFocusRing(s);
        } else if (event.key === 'ArrowUp') {
          var cols = 4;
          focusedIndex = (focusedIndex - cols + cards.length) % cards.length;
          updateFocusRing(s);
        } else if (event.key === 'ArrowDown') {
          var cols2 = 4;
          focusedIndex = (focusedIndex + cols2) % cards.length;
          updateFocusRing(s);
        } else if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          var card = cards[focusedIndex];
          if (card) { onCard(s, card); }
        } else if (event.key === 'Tab') {
          event.preventDefault();
          focusedIndex = (focusedIndex + 1) % cards.length;
          updateFocusRing(s);
        }
      } else if (endOverlay && endOverlay.visible) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          restart(s);
        }
      }
    });
    updateModeHud(s);
    updateFocusRing(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe0f2fe, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcaf0f8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0x90e0ef, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2a7fb8, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x4EA8DE, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x90e0ef, 0xcaf0f8, 0xa8d8ea];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x4EA8DE, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function updateModeHud(scene) {
    if (hudMode) {
      hudMode.setText("Mode: " + (difficulty === 'hard' ? "Hard (8 pairs)" : "Easy (6 pairs)"));
    }
    var label = modeToggleLabel || (scene && scene.modeToggleLabel);
    if (label) {
      label.setText(difficulty === 'hard' ? "\u2190 Easy Mode" : "Hard Mode \u2192");
    }
  }

  function setDifficulty(mode) {
    difficulty = mode;
    totalPairs = mode === 'hard' ? 8 : 6;
  }

  function toggleDifficulty(scene) {
    setDifficulty(difficulty === 'hard' ? 'easy' : 'hard');
    restart(scene);
    if (startOverlay && startOverlay.visible) {
      hudMsg.setText(difficulty === 'hard' ? "Hard mode! Find 8 pairs!" : "Tap a card!");
    }
    updateModeHud(scene);
  }

  function updateFocusRing(scene) {
    if (!focusRing) { return; }
    if (!started || (startOverlay && startOverlay.visible) || (endOverlay && endOverlay.visible) || cards.length === 0) {
      focusRing.setVisible(false);
      return;
    }
    var card = cards[focusedIndex];
    if (!card) { focusRing.setVisible(false); return; }
    var tries = 0;
    while (card && card.matched && tries < cards.length) {
      focusedIndex = (focusedIndex + 1) % cards.length;
      card = cards[focusedIndex];
      tries++;
    }
    if (!card || card.matched) { focusRing.setVisible(false); return; }
    focusRing.clear();
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    var w = card.w || 185;
    var h = card.h || 140;
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 22);
    focusRing.setVisible(true);
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 110, "Mode: Easy (6 pairs)", textStyle(14, "#4EA8DE")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var modeBtn = scene.add.container(W - 110, 168);
    var modeBg = scene.add.graphics();
    modeBg.fillStyle(0xffffff, 1); modeBg.fillRoundedRect(-86, -18, 172, 36, 18);
    modeBg.lineStyle(3, 0x4EA8DE, 1); modeBg.strokeRoundedRect(-86, -18, 172, 36, 18);
    modeToggleLabel = scene.add.text(0, 0, "Hard Mode \u2192", textStyle(14, "#102A43")).setOrigin(0.5);
    scene.modeToggleLabel = modeToggleLabel;
    modeBtn.add([modeBg, modeToggleLabel]);
    modeBg.setInteractive(new Phaser.Geom.Rectangle(-86, -18, 172, 36), Phaser.Geom.Rectangle.Contains);
    modeBg.on("pointerdown", function () { toggleDifficulty(scene); });
    modeBg.on("pointerover", function () { modeBtn.setScale(1.05); });
    modeBg.on("pointerout", function () { modeBtn.setScale(1); });
    scene.add.text(W / 2, 148, "Find the animal pairs!", textStyle(16, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    var pool = ANIMALS.slice(0, totalPairs);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    if (difficulty === 'hard') {
      cols = 4; rows = 4; cw = 170; ch = 115; gx = 62; gy = 185; padX = 18; padY = 12;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
    focusedIndex = 0;
    if (scene) { updateFocusRing(scene); }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xa8d8ea, 0x90e0ef, 0xe0f2fe, 0xdbeafe, 0xb8e6fe, 0xcaf0f8, 0xa8d8ea];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    updateFocusRing(scene);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        updateFocusRing(scene);
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(scene); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -95, "Flip the cards and find\nall the animal pairs!", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -40, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 2, "Choose your challenge \u2014 no timers, no penalties!", Object.assign(textStyle(15, "#4EA8DE"), { align: "center" })).setOrigin(0.5);
    var hint2 = scene.add.text(0, 22, "Hard mode has 8 pairs for experienced players.", Object.assign(textStyle(13, "#102A43"), { align: "center" })).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x4EA8DE, 1); easyBg.fillRoundedRect(-260, 50, 240, 70, 20);
    var easyTx = scene.add.text(-140, 78, "\u25B6  Easy", textStyle(20, "#ffffff")).setOrigin(0.5);
    var easySub = scene.add.text(-140, 98, "6 pairs \u00B7 relaxed", textStyle(13, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xffffff, 1); hardBg.fillRoundedRect(20, 50, 240, 70, 20);
    hardBg.lineStyle(4, 0x4EA8DE, 1); hardBg.strokeRoundedRect(20, 50, 240, 70, 20);
    var hardTx = scene.add.text(140, 78, "\u2605 Hard Challenge", textStyle(18, "#102A43")).setOrigin(0.5);
    var hardSub = scene.add.text(140, 98, "8 pairs \u00B7 more to find!", textStyle(13, "#102A43")).setOrigin(0.5);
    var easyFocus = scene.add.graphics();
    easyFocus.lineStyle(4, 0x102A43, 1); easyFocus.strokeRoundedRect(-260, 50, 240, 70, 20);
    easyFocus.setVisible(false);
    var hardFocus = scene.add.graphics();
    hardFocus.lineStyle(4, 0x102A43, 1); hardFocus.strokeRoundedRect(20, 50, 240, 70, 20);
    hardFocus.setVisible(false);
    var kbHint = scene.add.text(0, 145, "Click or press Enter \u00B7 Use \u2190 \u2192 to choose \u00B7 E / H keys", textStyle(12, "#5a7a8a")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, hint2, easyBg, easyTx, easySub, hardBg, hardTx, hardSub, easyFocus, hardFocus, kbHint]);
    scene.startEasyBg = easyBg; scene.startHardBg = hardBg;
    scene.startEasyFocus = easyFocus; scene.startHardFocus = hardFocus;
    scene.startFocusIndex = 0;
    function updateStartFocus() {
      easyFocus.setVisible(scene.startFocusIndex === 0);
      hardFocus.setVisible(scene.startFocusIndex === 1);
    }
    scene.startUpdateFocus = updateStartFocus;
    updateStartFocus();
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-260, 50, 240, 70), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 50, 240, 70), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () {
      setDifficulty('easy'); started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      buildBoard(scene); updateModeHud(scene); updateFocusRing(scene);
    });
    hardBg.on("pointerdown", function () {
      setDifficulty('hard'); started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Hard mode! Find 8 pairs!");
      buildBoard(scene); updateModeHud(scene); updateFocusRing(scene);
    });
    easyBg.on("pointerover", function () { scene.startFocusIndex = 0; updateStartFocus(); });
    hardBg.on("pointerover", function () { scene.startFocusIndex = 1; updateStartFocus(); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars;
    if (difficulty === 'hard') {
      stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1);
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    var modeText = difficulty === 'hard' ? "Hard Challenge (8 pairs)" : "Easy (6 pairs)";
    endDetail.setText("You found all " + totalPairs + " pairs!\n" + modeText + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    if (focusRing) { focusRing.setVisible(false); }
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText(difficulty === 'hard' ? "Hard mode! Find 8 pairs!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateModeHud(scene);
    updateFocusRing(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
