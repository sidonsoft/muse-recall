<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match - Arcade Edition</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a1207;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 0 0 4px #ffb703, 0 0 30px rgba(255,183,3,.7), 0 8px 30px rgba(0,0,0,.4)}
  @keyframes arcadePulse{0%,100%{box-shadow:0 0 0 4px #ffb703, 0 0 25px rgba(255,183,3,.6)}50%{box-shadow:0 0 0 4px #ffbe0b, 0 0 40px rgba(255,183,3,.95)}}
  canvas{animation:arcadePulse 1.2s infinite}
</style>
</head>
<body>
<div id="game" role="main" aria-label="Farmyard Memory Match Arcade Game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var timeLeft = 60, maxTime = 60, timerEvent = null, score = 0, combo = 0, bestCombo = 0, level = 1, difficulty = "normal";
  var hudTime, hudScoreVal, hudCombo, hudLevel, timerBar, timerBarBg, focusIndex = 0;
  var DIFFICULTY_TIME = { easy: 75, normal: 55, hard: 35 };
  var DIFFICULTY_LABEL = { easy: "EASY", normal: "NORMAL", hard: "HARD" };
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
  }
  function playTone(freq, duration, type, vol, slideTo) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.value = vol || 0.18;
      o.start();
      if (slideTo) { o.frequency.linearRampToValueAtTime(slideTo, audioCtx.currentTime + duration); }
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      o.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }
  function playMatchSound() { ensureAudio(); playTone(440, 0.12, "square", 0.2); setTimeout(function(){ playTone(660, 0.18, "square", 0.2); }, 90); setTimeout(function(){ playTone(880, 0.25, "sine", 0.15); }, 180); }
  function playMismatchSound() { ensureAudio(); playTone(180, 0.25, "sawtooth", 0.15, 120); }
  function playTickSound() { ensureAudio(); playTone(900, 0.08, "square", 0.08); }
  function playComboSound(c) { ensureAudio(); playTone(500 + c * 80, 0.15, "square", 0.18); }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    var arcadeG = scene.add.graphics();
    arcadeG.lineStyle(3, 0xffb703, 0.9);
    arcadeG.strokeRoundedRect(6, 6, W - 12, H - 12, 16);
    arcadeG.lineStyle(2, 0xffffff, 0.35);
    arcadeG.strokeRoundedRect(10, 10, W - 20, H - 20, 14);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(30)).setOrigin(0, 0);
    var arcadeBadge = scene.add.text(260, 18, "ARCADE", { fontFamily: '"Comic Sans MS",sans-serif', fontSize: "14px", color: "#ffffff", backgroundColor: "#e63946", padding: { left: 8, right: 8, top: 3, bottom: 3 }, fontStyle: "bold" }).setOrigin(0, 0);
    arcadeBadge.setStroke("#7a0000", 2);
    hudMoves = scene.add.text(24, 52, "Moves: 0", textStyle(18));
    hudScore = scene.add.text(24, 76, "Pairs: 0 / 6", textStyle(18));
    hudLevel = scene.add.text(24, 100, "LVL 1", Object.assign(textStyle(16, "#e63946"), { fontStyle: "bold" }));
    hudTime = scene.add.text(W / 2, 52, "\u23F1 60s", Object.assign(textStyle(28, "#5b3a29"), { fontStyle: "bold" })).setOrigin(0.5);
    hudTime.setStroke("#ffffff", 4);
    hudScoreVal = scene.add.text(W - 24, 52, "\u2B50 0", Object.assign(textStyle(26, "#ffb703"), { fontStyle: "bold" })).setOrigin(1, 0);
    hudScoreVal.setStroke("#5b3a29", 4);
    hudCombo = scene.add.text(W / 2, 88, "", Object.assign(textStyle(20, "#e63946"), { fontStyle: "bold" })).setOrigin(0.5).setVisible(false);
    hudCombo.setStroke("#ffffff", 4);
    hudMsg = scene.add.text(W - 24, 88, "Tap a card!", textStyle(16, "#7a4a2b")).setOrigin(1, 0.5);
    timerBarBg = scene.add.graphics();
    timerBarBg.fillStyle(0x000000, 0.15); timerBarBg.fillRoundedRect(24, 122, W - 48, 14, 7);
    timerBarBg.lineStyle(2, 0xffffff, 0.9); timerBarBg.strokeRoundedRect(24, 122, W - 48, 14, 7);
    timerBar = scene.add.graphics();
    timerBar.fillStyle(0x5da85f, 1); timerBar.fillRoundedRect(24, 122, W - 48, 14, 7);
    var btn = scene.add.container(W - 90, 118);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-70, -20, 140, 40, 20);
    bg.lineStyle(2, 0xffffff, 1); bg.strokeRoundedRect(-70, -20, 140, 40, 20);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(16, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-70, -20, 140, 40), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 150, "Find pairs fast! Combo = bonus! Mismatch = -3s!", textStyle(14, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 132, gx = 62, gy = 175, padX = 22, padY = 14;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIndex = 0;
    updateFocusVisual();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function updateFocusVisual() {
    cards.forEach(function (c, i) {
      if (c.view) {
        if (i === focusIndex && started && !c.matched) {
          c.view.setScale(1.02);
        } else {
          c.view.setScale(1);
        }
      }
    });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 110, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 110, onComplete: done || function () {} });
    }});
  }

  function startTimer(scene) {
    stopTimer(scene);
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started) return;
      timeLeft--;
      if (timeLeft < 0) timeLeft = 0;
      updateTimerHud(scene);
      if (timeLeft <= 10 && timeLeft > 0) {
        playTickSound();
        scene.cameras.main.shake(80, 0.003);
        hudTime.setScale(1.2);
        scene.tweens.add({ targets: hudTime, scale: 1, duration: 150 });
      }
      if (timeLeft <= 0) {
        gameOver(scene);
      }
    }});
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(); timerEvent = null; }
  }

  function updateTimerHud(scene) {
    if (hudTime) {
      hudTime.setText("\u23F1 " + timeLeft + "s");
      if (timeLeft <= 10) { hudTime.setColor("#e63946"); }
      else if (timeLeft <= 20) { hudTime.setColor("#ffb703"); }
      else { hudTime.setColor("#5b3a29"); }
    }
    if (timerBar) {
      timerBar.clear();
      var pct = Phaser.Math.Clamp(timeLeft / maxTime, 0, 1);
      var col = pct > 0.5 ? 0x5da85f : pct > 0.25 ? 0xffb703 : 0xe63946;
      timerBar.fillStyle(col, 1);
      timerBar.fillRoundedRect(24, 122, (W - 48) * pct, 14, 7);
      if (pct <= 0.25 && scene) {
        var a = 0.7 + Math.sin(scene.time.now * 0.015) * 0.3;
        timerBar.setAlpha(a);
      } else {
        timerBar.setAlpha(1);
      }
    }
  }

  function addScore(pts, scene, x, y) {
    score += pts;
    if (hudScoreVal) {
      hudScoreVal.setText("\u2B50 " + score);
      scene.tweens.add({ targets: hudScoreVal, scale: 1.25, duration: 120, yoyo: true });
    }
    if (x !== undefined && scene) {
      var pop = scene.add.text(x, y, "+" + pts, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "26px", color: "#ffbe0b", stroke: "#5b3a29", strokeThickness: 4, fontStyle: "bold" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({ targets: pop, y: y - 55, alpha: 0, scale: 1.2, duration: 700, ease: "Cubic.easeOut", onComplete: function () { pop.destroy(); } });
    }
  }

  function updateComboHud(scene) {
    if (!hudCombo) return;
    if (combo > 1) {
      hudCombo.setVisible(true);
      hudCombo.setText("\u26A1 x" + combo + " COMBO! +" + (combo * 50) + " BONUS");
      hudCombo.setScale(1.4);
      scene.tweens.add({ targets: hudCombo, scale: 1, duration: 220, ease: "Back.easeOut" });
      if (combo > bestCombo) bestCombo = combo;
    } else if (combo <= 1) {
      hudCombo.setVisible(false);
    }
  }

  function screenShake(scene, intensity) {
    scene.cameras.main.shake(120, intensity || 0.008);
  }

  function spawnParticles(scene, x, y, emoji) {
    for (var i = 0; i < 8; i++) {
      var p = scene.add.text(x, y, emoji || "\u2B50", { fontSize: "22px" }).setDepth(25).setOrigin(0.5);
      var tx = x + Phaser.Math.Between(-90, 90);
      var ty = y + Phaser.Math.Between(-90, 40);
      scene.tweens.add({ targets: p, x: tx, y: ty, alpha: 0, scale: 0.2, duration: Phaser.Math.Between(500, 800), ease: "Cubic.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    ensureAudio();
    playTone(600, 0.08, "sine", 0.12);
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u26A1"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160, ease: "Back.easeOut" });
        matches++;
        combo++;
        var base = 200;
        var comboBonus = combo > 1 ? combo * 50 : 0;
        var timeBonus = timeLeft > 30 ? 50 : 0;
        var total = base + comboBonus + timeBonus;
        addScore(total, scene, card.view.x, card.view.y - 70);
        if (combo > 1) { playComboSound(combo); } else { playMatchSound(); }
        spawnParticles(scene, card.view.x, card.view.y, "\u{1F389}");
        spawnParticles(scene, a.view.x, a.view.y, "\u2B50");
        timeLeft = Math.min(maxTime, timeLeft + 2);
        updateTimerHud(scene);
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "You did it! \u2728" : "Yay! +" + total + " \u{1F389}");
        updateComboHud(scene);
        scene.cameras.main.flash(120, 255, 255, 180, false);
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 320);
    } else {
      combo = 0;
      updateComboHud(scene);
      hudMsg.setText("Miss! -3s \u{1F340}");
      playMismatchSound();
      screenShake(scene, 0.01);
      timeLeft = Math.max(0, timeLeft - 3);
      updateTimerHud(scene);
      scene.tweens.add({ targets: [a.view, card.view], x: a.view.x + 6, yoyo: true, repeat: 2, duration: 60 });
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; if (timeLeft <= 0) gameOver(scene); });
      }, 650);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.55); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(3, 0xffb703, 1); panel.strokeRoundedRect(-314, -204, 628, 408, 24);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(36)).setOrigin(0.5);
    var arcadeTitle = scene.add.text(0, -115, "ARCADE RUSH \u26A1", Object.assign(textStyle(22, "#e63946"), { fontStyle: "bold" })).setOrigin(0.5);
    arcadeTitle.setStroke("#ffb703", 2);
    var sub = scene.add.text(0, -70, "Beat the clock! Match fast for combos!\nMismatch = -3s  |  Match = +2s + bonus!", Object.assign(textStyle(16), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -20, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var diffLabel = scene.add.text(0, 22, "CHOOSE DIFFICULTY:", textStyle(14, "#8a6a4a")).setOrigin(0.5);
    var btnEasyBg = scene.add.graphics();
    btnEasyBg.fillStyle(0x8ecae6, 1); btnEasyBg.fillRoundedRect(-200, 45, 120, 50, 16);
    btnEasyBg.lineStyle(2, 0xffffff, 1); btnEasyBg.strokeRoundedRect(-200, 45, 120, 50, 16);
    var btnEasyTx = scene.add.text(-140, 70, "EASY\n75s", Object.assign(textStyle(14, "#ffffff"), { align: "center" })).setOrigin(0.5);
    var btnNormBg = scene.add.graphics();
    btnNormBg.fillStyle(0xffb703, 1); btnNormBg.fillRoundedRect(-60, 45, 120, 50, 16);
    btnNormBg.lineStyle(3, 0xffffff, 1); btnNormBg.strokeRoundedRect(-60, 45, 120, 50, 16);
    var btnNormTx = scene.add.text(0, 70, "NORMAL\n55s \u2605", Object.assign(textStyle(14, "#ffffff"), { align: "center" })).setOrigin(0.5);
    var btnHardBg = scene.add.graphics();
    btnHardBg.fillStyle(0xe63946, 1); btnHardBg.fillRoundedRect(80, 45, 120, 50, 16);
    btnHardBg.lineStyle(2, 0xffffff, 1); btnHardBg.strokeRoundedRect(80, 45, 120, 50, 16);
    var btnHardTx = scene.add.text(140, 70, "HARD\n35s \u26A1", Object.assign(textStyle(14, "#ffffff"), { align: "center" })).setOrigin(0.5);
    var hint = scene.add.text(0, 125, "Keys: 1/2/3 = difficulty  |  Arrows + Enter to play  |  R = restart", textStyle(11, "#8a6a4a")).setOrigin(0.5);
    var startBtnBg = scene.add.graphics();
    startBtnBg.fillStyle(0x5da85f, 1); startBtnBg.fillRoundedRect(-130, 145, 260, 50, 25);
    startBtnBg.lineStyle(2, 0xffffff, 1); startBtnBg.strokeRoundedRect(-130, 145, 260, 50, 25);
    var startBtnTx = scene.add.text(0, 170, "\u25B6  START RUSH!", textStyle(20, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, arcadeTitle, sub, row, diffLabel, btnEasyBg, btnEasyTx, btnNormBg, btnNormTx, btnHardBg, btnHardTx, hint, startBtnBg, startBtnTx]);
    function selectDiff(d) {
      difficulty = d;
      maxTime = DIFFICULTY_TIME[d];
      timeLeft = maxTime;
      btnEasyBg.clear(); btnEasyBg.fillStyle(d === "easy" ? 0x5da85f : 0x8ecae6, 1); btnEasyBg.fillRoundedRect(-200, 45, 120, 50, 16); btnEasyBg.lineStyle(2, 0xffffff, 1); btnEasyBg.strokeRoundedRect(-200, 45, 120, 50, 16);
      btnNormBg.clear(); btnNormBg.fillStyle(d === "normal" ? 0x5da85f : 0xffb703, 1); btnNormBg.fillRoundedRect(-60, 45, 120, 50, 16); btnNormBg.lineStyle(d === "normal" ? 3 : 2, 0xffffff, 1); btnNormBg.strokeRoundedRect(-60, 45, 120, 50, 16);
      btnHardBg.clear(); btnHardBg.fillStyle(d === "hard" ? 0x5da85f : 0xe63946, 1); btnHardBg.fillRoundedRect(80, 45, 120, 50, 16); btnHardBg.lineStyle(2, 0xffffff, 1); btnHardBg.strokeRoundedRect(80, 45, 120, 50, 16);
      startBtnTx.setText("\u25B6  START " + DIFFICULTY_LABEL[d] + "!");
      ensureAudio();
      playTone(500, 0.08, "square", 0.12);
    }
    btnEasyBg.setInteractive(new Phaser.Geom.Rectangle(-200, 45, 120, 50), Phaser.Geom.Rectangle.Contains);
    btnNormBg.setInteractive(new Phaser.Geom.Rectangle(-60, 45, 120, 50), Phaser.Geom.Rectangle.Contains);
    btnHardBg.setInteractive(new Phaser.Geom.Rectangle(80, 45, 120, 50), Phaser.Geom.Rectangle.Contains);
    startBtnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 145, 260, 50), Phaser.Geom.Rectangle.Contains);
    btnEasyBg.on("pointerdown", function () { selectDiff("easy"); });
    btnNormBg.on("pointerdown", function () { selectDiff("normal"); });
    btnHardBg.on("pointerdown", function () { selectDiff("hard"); });
    startBtnBg.on("pointerdown", function () { startGame(scene); });
    btnEasyBg.on("pointerover", function () { scene.tweens.add({ targets: btnEasyTx, scale: 1.08, duration: 100, yoyo: true }); });
    btnNormBg.on("pointerover", function () { scene.tweens.add({ targets: btnNormTx, scale: 1.08, duration: 100, yoyo: true }); });
    btnHardBg.on("pointerover", function () { scene.tweens.add({ targets: btnHardTx, scale: 1.08, duration: 100, yoyo: true }); });
    startBtnBg.on("pointerover", function () { startOverlay.setScale(1.02); });
    startBtnBg.on("pointerout", function () { startOverlay.setScale(1); });
    scene._selectDiff = selectDiff;
    selectDiff("normal");
  }

  function startGame(scene) {
    ensureAudio();
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("GO! \u26A1 Find pairs!");
    timeLeft = maxTime;
    updateTimerHud(scene);
    startTimer(scene);
    playTone(440, 0.1, "square", 0.2); setTimeout(function(){ playTone(660, 0.15, "square", 0.2); }, 100);
    scene.tweens.add({ targets: scene.cameras.main, zoom: 1.03, duration: 120, yoyo: true });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.6); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(3, 0xe63946, 1); panel.strokeRoundedRect(-294, -184, 588, 368, 26);
    endTitle = scene.add.text(0, -120, "\u{1F389} You Win! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(18), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 90, 260, 60, 30);
    btnBg.lineStyle(2, 0xffffff, 1); btnBg.strokeRoundedRect(-130, 90, 260, 60, 30);
    var btnTx = scene.add.text(0, 120, "\u21BB Play Again", textStyle(22, "#ffffff")).setOrigin(0.5);
    var hint2 = scene.add.text(0, 165, "Press R or Enter to restart", textStyle(12, "#8a6a4a")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint2]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 90, 260, 60), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    btnBg.on("pointerover", function () { endOverlay.setScale(1.02); });
    btnBg.on("pointerout", function () { endOverlay.setScale(1); });
  }

  function showWin(scene) {
    stopTimer();
    started = false;
    lockBoard = true;
    var timeBonus = timeLeft * 10;
    var movePenalty = moves * 5;
    var finalScore = score + timeBonus - movePenalty;
    if (finalScore < 0) finalScore = score;
    var stars = 1;
    if (finalScore >= 1200 && timeLeft >= 15) stars = 3;
    else if (finalScore >= 800 || timeLeft >= 8) stars = 2;
    var rank = stars === 3 ? "ARCADE MASTER \u{1F451}" : stars === 2 ? "STAR PLAYER \u2B50" : "FARM HAND \u{1F33B}";
    endTitle.setText(stars === 3 ? "\u{1F451} PERFECT! \u{1F451}" : "\u{1F389} YOU WIN! \u{1F389}");
    endDetail.setText(
      rank + "\n" +
      "Score: " + finalScore + "  " + "\u2B50".repeat(stars) + "\n" +
      "Base: " + score + " + Time Bonus: +" + timeBonus + "\n" +
      "Moves: " + moves + "  |  Time Left: " + timeLeft + "s\n" +
      "Best Combo: x" + bestCombo + "  |  Level: " + level + " (" + DIFFICULTY_LABEL[difficulty] + ")"
    );
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.7, to: 1 }, duration: 350, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389} Score " + finalScore);
    playTone(523, 0.15, "square", 0.2); setTimeout(function(){ playTone(659, 0.15, "square", 0.2); }, 140); setTimeout(function(){ playTone(784, 0.3, "square", 0.2); }, 280); setTimeout(function(){ playTone(1046, 0.4, "sine", 0.18); }, 450);
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u26A1", "\u{1F451}"][i % 6], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-100, 100), angle: Phaser.Math.Between(-180, 180), duration: Phaser.Math.Between(1200, 2400), delay: i * 40, onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
    scene.cameras.main.flash(200, 255, 215, 0, false);
  }

  function gameOver(scene) {
    stopTimer();
    started = false;
    lockBoard = true;
    endTitle.setText("\u{1F480} TIME'S UP! \u{1F480}");
    endTitle.setColor("#e63946");
    var stars = matches >= 4 ? 2 : matches >= 2 ? 1 : 0;
    endDetail.setText(
      "ARCADE OVER\n" +
      "Score: " + score + "  " + "\u2B50".repeat(stars) + "\n" +
      "Pairs: " + matches + " / 6  |  Moves: " + moves + "\n" +
      "Best Combo: x" + bestCombo + "  |  Level " + level + "\n" +
      "Try " + DIFFICULTY_LABEL[difficulty] + " again?"
    );
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.7, to: 1 }, duration: 300, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F1");
    playTone(200, 0.4, "sawtooth", 0.2, 80); setTimeout(function(){ playTone(150, 0.5, "sawtooth", 0.2); }, 300);
    scene.cameras.main.shake(400, 0.012);
    scene.cameras.main.flash(300, 230, 57, 70, false);
  }

  function restart(scene) {
    stopTimer();
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    score = 0; combo = 0; bestCombo = 0;
    timeLeft = maxTime;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudMsg.setText("GO! \u26A1");
    hudScoreVal.setText("\u2B50 0"); hudCombo.setVisible(false); hudTime.setColor("#5b3a29");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateTimerHud(scene);
    startTimer(scene);
    scene.cameras.main.flash(150, 255, 255, 255, false);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (e.key === "1") { if (startOverlay.visible) { scene._selectDiff("easy"); } }
      if (e.key === "2") { if (startOverlay.visible) { scene._selectDiff("normal"); } }
      if (e.key === "3") { if (startOverlay.visible) { scene._selectDiff("hard"); } }
      if (e.key === "Enter" || e.key === " ") {
        if (startOverlay.visible) { startGame(scene); return; }
        if (endOverlay.visible) { restart(scene); return; }
        if (started && cards[focusIndex] && !cards[focusIndex].matched) {
          onCard(scene, cards[focusIndex]);
        }
      }
      if (e.key.toLowerCase() === "r") {
        if (!startOverlay.visible) { restart(scene); }
      }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "ArrowDown") {
        if (!started) return;
        var cols = 4;
        if (e.key === "ArrowRight") focusIndex = (focusIndex + 1) % cards.length;
        if (e.key === "ArrowLeft") focusIndex = (focusIndex - 1 + cards.length) % cards.length;
        if (e.key === "ArrowDown") focusIndex = (focusIndex + cols) % cards.length;
        if (e.key === "ArrowUp") focusIndex = (focusIndex - cols + cards.length) % cards.length;
        updateFocusVisual();
        e.preventDefault();
      }
    });
    scene.input.on("pointerdown", function () { ensureAudio(); });
  }

  function update() {
    if (started && timerBar && timeLeft <= 10 && timeLeft > 0) {
      var s = this;
      var pulse = 0.95 + Math.sin(s.time.now * 0.02) * 0.05;
      if (hudTime) hudTime.setScale(pulse + 0.2);
    }
  }
})();
</script>
</body>
</html>
