<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(900px 420px at 50% -8%, rgba(231,193,124,0.10), transparent 62%), radial-gradient(700px 500px at 92% 12%, rgba(231,193,124,0.06), transparent 60%), var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(600px 300px at 20% 20%, rgba(231,193,124,0.04), transparent 70%);
    opacity: 1;
  }
  .app {
    width: 100%;
    max-width: 620px;
    animation: appIn 0.6s ease-out both;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
    animation: headerIn 0.55s cubic-bezier(0.16,1,0.3,1) 0.08s both;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    animation: floatMark 3.2s ease-in-out infinite;
    box-shadow: 0 6px 18px rgba(231,193,124,0.28);
    position: relative;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 55%);
    opacity: 0.9;
    pointer-events: none;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
    animation: subtitleIn 0.5s ease 0.25s both;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
    animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.14s both;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(231,193,124,0.35), transparent);
    opacity: 0.9;
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(231,193,124,0.12);
    transform: translateY(-1px);
  }
  #taskInput.shake {
    animation: shake 0.32s ease;
    border-color: var(--danger);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease, color 0.2s ease;
  }
  #priorityInput:hover {
    border-color: rgba(231,193,124,0.45);
    transform: translateY(-1px);
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(231,193,124,0.18);
  }
  #addBtn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(231,193,124,0.28); }
  #addBtn:active { filter: brightness(0.96); transform: translateY(0) scale(0.98); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  #addBtn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 62%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.32), transparent);
    transform: skewX(-18deg);
    transition: left 0.55s ease;
    pointer-events: none;
  }
  #addBtn:hover::after { left: 130%; }
  #addBtn.pulse {
    animation: addPulse 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .filter-btn:active { transform: translateY(0) scale(0.97); }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 0 0 3px rgba(231,193,124,0.12);
    transform: translateY(-1px);
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  #clearBtn:hover { color: var(--text); transform: translateY(-1px); }
  #clearBtn:active { transform: translateY(0) scale(0.98); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
    transform: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; transition: transform 0.25s ease; }
  #progressLabel.bump { animation: labelBump 0.35s ease; }
  #progressPct {
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease, transform 0.3s ease;
    font-weight: 650;
  }
  #progressPct.celebrate {
    color: var(--accent);
    transform: scale(1.12);
  }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
  }
  .progress-track.celebrate {
    animation: trackGlow 0.9s ease;
    box-shadow: 0 0 0 3px rgba(231,193,124,0.18), inset 0 1px 3px rgba(0,0,0,0.35);
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
    position: relative;
    overflow: hidden;
  }
  #progressBar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.32), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.9s ease-in-out infinite;
  }
  #progressBar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.0), rgba(255,255,255,0.18), rgba(255,255,255,0.0));
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .progress-track.celebrate #progressBar::before { opacity: 1; }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
    animation: taskIn 0.42s cubic-bezier(0.16,1,0.3,1) both;
    transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease, opacity 0.22s ease;
    position: relative;
    overflow: hidden;
  }
  .task::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
    transition: background 0.25s ease;
    border-radius: 11px 0 0 11px;
  }
  .task:hover {
    transform: translateY(-2px);
    border-color: rgba(231,193,124,0.34);
    box-shadow: 0 10px 24px rgba(0,0,0,0.28), 0 2px 8px rgba(231,193,124,0.08);
    background: #2b2722;
  }
  .task:hover::before { background: rgba(231,193,124,0.55); }
  .task.completed { opacity: 0.82; }
  .task.completed::before { background: rgba(231,193,124,0.22); }
  .task.just-added {
    animation: taskIn 0.48s cubic-bezier(0.16,1,0.3,1) both, taskHighlight 0.9s ease 0.1s;
  }
  .task.removing {
    animation: taskOut 0.28s ease forwards;
  }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: transform 0.16s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, color 0.15s ease;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 3px 10px rgba(231,193,124,0.28);
    animation: checkPop 0.38s cubic-bezier(0.34,1.56,0.64,1);
  }
  .check:hover { background: var(--accent-soft); transform: scale(1.06); box-shadow: 0 2px 10px rgba(231,193,124,0.18); }
  .task.completed .check:hover { background: var(--accent); transform: scale(1.06); }
  .check:active { transform: scale(0.88); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    transition: color 0.22s ease, transform 0.22s ease;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: transform 0.16s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
    transform: translateY(-1px);
  }
  .icon-btn:active { transform: scale(0.96); }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
    background: rgba(231,193,124,0.06);
  }
  .priority-btn:active { transform: scale(0.96); }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
    box-shadow: 0 2px 10px rgba(231,193,124,0.14);
    animation: priorityPulse 0.5s ease;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary {
    color: var(--muted);
    display: inline-block;
    transition: color 0.25s ease, transform 0.25s ease;
    padding: 2px 8px;
    border-radius: 999px;
    background: transparent;
  }
  #prioritySummary.has-high {
    color: var(--accent);
    background: rgba(231,193,124,0.10);
    border: 1px solid rgba(231,193,124,0.22);
    animation: summaryBounce 0.5s ease;
  }
  #prioritySummary.pulse {
    animation: summaryBounce 0.45s ease;
  }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
    animation: emptyIn 0.45s ease both;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(231,193,124,0.04), transparent);
  }
  .empty::before {
    content: "✦";
    display: block;
    font-size: 1.35rem;
    color: var(--accent);
    opacity: 0.9;
    margin-bottom: 6px;
    animation: sparkle 2.2s ease-in-out infinite;
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
    animation: footerIn 0.5s ease 0.4s both;
  }
  /* Lively keyframes */
  @keyframes appIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes headerIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes subtitleIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes footerIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes floatMark {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(1.5deg); }
  }
  @keyframes taskIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes taskHighlight {
    0% { background: var(--surface-2); border-color: var(--border); }
    30% { background: rgba(231,193,124,0.14); border-color: rgba(231,193,124,0.45); box-shadow: 0 8px 20px rgba(231,193,124,0.12); }
    100% { background: var(--surface-2); border-color: var(--border); }
  }
  @keyframes taskOut {
    to { opacity: 0; transform: translateX(12px) scale(0.96); height: 0; padding-top: 0; padding-bottom: 0; margin: 0; border-width: 0; }
  }
  @keyframes checkPop {
    0% { transform: scale(0.7); }
    45% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes addPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes labelBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes trackGlow {
    0% { box-shadow: 0 0 0 0 rgba(231,193,124,0.0), inset 0 1px 3px rgba(0,0,0,0.35); }
    50% { box-shadow: 0 0 0 4px rgba(231,193,124,0.22), inset 0 1px 3px rgba(0,0,0,0.35); }
    100% { box-shadow: 0 0 0 3px rgba(231,193,124,0.14), inset 0 1px 3px rgba(0,0,0,0.35); }
  }
  @keyframes priorityPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes summaryBounce {
    0% { transform: translateY(0) scale(1); }
    35% { transform: translateY(-2px) scale(1.03); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes emptyIn {
    from { opacity: 0; transform: scale(0.97) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
    50% { transform: scale(1.18) rotate(8deg); opacity: 1; }
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(420px) rotate(720deg) scale(0.9); opacity: 0; }
  }
  @keyframes celebratePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  /* Staggered entrance for tasks */
  ul#taskList .task:nth-child(1) { animation-delay: 0.02s; }
  ul#taskList .task:nth-child(2) { animation-delay: 0.06s; }
  ul#taskList .task:nth-child(3) { animation-delay: 0.10s; }
  ul#taskList .task:nth-child(4) { animation-delay: 0.14s; }
  ul#taskList .task:nth-child(5) { animation-delay: 0.18s; }
  ul#taskList .task:nth-child(6) { animation-delay: 0.22s; }
  ul#taskList .task:nth-child(n+7) { animation-delay: 0.24s; }

  .confetti {
    position: fixed;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    top: -10px;
    animation: confettiFall 900ms cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }

  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .mark { animation: none; }
    #progressBar::after { animation: none; display: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";
  var lastPct = 0;
  var lastHighRemaining = 0;

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));

  function triggerShake() {
    input.classList.remove("shake");
    void input.offsetWidth;
    input.classList.add("shake");
    input.addEventListener("animationend", function handler() {
      input.classList.remove("shake");
      input.removeEventListener("animationend", handler);
    });
  }

  function celebrate() {
    var colors = ["#e7c17c", "#f2d49b", "#d9a85a", "#fff1c9", "#e8b86a"];
    for (var i = 0; i < 18; i++) {
      var c = document.createElement("span");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 0.25) + "s";
      c.style.animationDuration = (700 + Math.random() * 500) + "ms";
      c.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      c.style.width = (6 + Math.random() * 7) + "px";
      c.style.height = (6 + Math.random() * 7) + "px";
      document.body.appendChild(c);
      (function (el) {
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
      })(c);
    }
    progressTrack.classList.remove("celebrate");
    void progressTrack.offsetWidth;
    progressTrack.classList.add("celebrate");
    progressPct.classList.add("celebrate");
    setTimeout(function () {
      progressTrack.classList.remove("celebrate");
      progressPct.classList.remove("celebrate");
    }, 900);
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      triggerShake();
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    addBtn.classList.remove("pulse");
    void addBtn.offsetWidth;
    addBtn.classList.add("pulse");
    addBtn.addEventListener("animationend", function h() {
      addBtn.classList.remove("pulse");
      addBtn.removeEventListener("animationend", h);
    });
    render(true);
  }

  function toggleTask(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].completed = !tasks[i].completed;
        break;
      }
    }
    render(false);
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render(false);
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render(false);
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render(false);
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render(isNewTask) {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    if (pct !== lastPct) {
      progressLabel.classList.remove("bump");
      void progressLabel.offsetWidth;
      progressLabel.classList.add("bump");
      progressLabel.addEventListener("animationend", function handler() {
        progressLabel.classList.remove("bump");
        progressLabel.removeEventListener("animationend", handler);
      });
      if (pct === 100 && total > 0 && lastPct !== 100) {
        celebrate();
      }
      lastPct = pct;
    }

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
      prioritySummary.classList.remove("has-high");
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
      prioritySummary.classList.add("has-high");
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
      prioritySummary.classList.add("has-high");
    }
    if (highRemaining !== lastHighRemaining) {
      prioritySummary.classList.remove("pulse");
      void prioritySummary.offsetWidth;
      prioritySummary.classList.add("pulse");
      prioritySummary.addEventListener("animationend", function h2() {
        prioritySummary.classList.remove("pulse");
        prioritySummary.removeEventListener("animationend", h2);
      });
      lastHighRemaining = highRemaining;
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task, index) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");
      if (isNewTask && index === shown.length - 1 && filter === "all") {
        li.classList.add("just-added");
      }
      // keep staggered delay via inline style for lively cascade
      li.style.animationDelay = (index * 0.04) + "s";

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function () { toggleTask(task.id); });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render(false);
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render(false);
  input.focus();
})();
</script>
</body>
</html>
