<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:10;background:rgba(255,255,255,0.96);padding:6px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,0.13);border:2px solid #5da85f;max-width:94vw;flex-wrap:wrap;justify-content:center}
  #topbar-label{font-size:13px;color:#5b3a29;font-weight:bold;margin-right:2px;white-space:nowrap}
  .diff-btn{font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;font-size:13px;font-weight:bold;padding:7px 14px;border-radius:999px;border:2px solid transparent;cursor:pointer;transition:all 0.15s;white-space:nowrap}
  .diff-btn[aria-pressed="true"]{background:#5da85f;color:#fff;border-color:#4a9a4e;transform:scale(1.04)}
  .diff-btn.hard[aria-pressed="true"]{background:#e76f51;border-color:#d65a3c}
  .diff-btn[aria-pressed="false"]{background:#fff;color:#5b3a29;border-color:#e0d5c0}
  .diff-btn:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
  .diff-btn:hover{transform:scale(1.05)}
  @media(max-width:600px){#topbar{top:6px;padding:5px 8px} .diff-btn{font-size:12px;padding:6px 10px}}
</style>
</head>
<body>
<div id="topbar" role="group" aria-label="Difficulty selection">
  <span id="topbar-label">Difficulty:</span>
  <button type="button" id="btn-normal" class="diff-btn" aria-label="Play normal mode with 6 pairs, relaxed pace" aria-pressed="true">Normal • 6 pairs</button>
  <button type="button" id="btn-hard" class="diff-btn hard" aria-label="Play hard challenge mode with 8 pairs and 75 second timer" aria-pressed="false">Hard Challenge ★</button>
</div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F436}", name: "Dog" },
    { emoji: "\u{1F431}", name: "Cat" },
    { emoji: "\u{1F430}", name: "Bunny" },
    { emoji: "\u{1F410}", name: "Goat" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudTimer, hudDiffBadge, hudHint, endOverlay, endTitle, endDetail, startOverlay;
  var difficulty = "normal";
  var totalPairs = 6;
  var timeLeft = 0;
  var timerEvent = null;
  var isGameOver = false;
  var gameScene = null;
  var badgeBg = null;

  function getTotalPairs() { return difficulty === "hard" ? 8 : 6; }
  function getTimeForDifficulty() { return 75; }
  function getFlipBackDelay() { return difficulty === "hard" ? 550 : 700; }

  function create() {
    var s = this;
    gameScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupHtmlControls(s);
    setupKeyboard(s);
    setDifficulty(difficulty);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    badgeBg = scene.add.graphics();
    badgeBg.fillStyle(0x5da85f, 1); badgeBg.fillRoundedRect(W - 210, 8, 186, 28, 14);
    hudDiffBadge = scene.add.text(W - 117, 22, "NORMAL • 6 pairs", textStyle(13, "#ffffff")).setOrigin(0.5);
    hudTimer = scene.add.text(W / 2, 118, "", textStyle(26, "#c0392b")).setOrigin(0.5).setVisible(false);
    hudHint = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
  }

  function updateHudForDifficulty() {
    totalPairs = getTotalPairs();
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    if (hudHint) hudHint.setText(difficulty === "hard" ? "Hard Challenge: Find the 8 pairs before time runs out!" : "Find the 6 animal pairs!");
    if (hudDiffBadge && badgeBg) {
      badgeBg.clear();
      if (difficulty === "hard") {
        badgeBg.fillStyle(0xe76f51, 1);
        hudDiffBadge.setText("HARD • 8 pairs • 75s");
      } else {
        badgeBg.fillStyle(0x5da85f, 1);
        hudDiffBadge.setText("NORMAL • 6 pairs");
      }
      badgeBg.fillRoundedRect(W - 210, 8, 186, 28, 14);
    }
    if (hudTimer) {
      if (difficulty === "hard" && started && !isGameOver) {
        hudTimer.setVisible(true);
      } else if (difficulty !== "hard") {
        hudTimer.setVisible(false);
      }
    }
  }

  function setDifficulty(newDiff) {
    difficulty = newDiff;
    totalPairs = getTotalPairs();
    var btnN = document.getElementById("btn-normal");
    var btnH = document.getElementById("btn-hard");
    if (btnN && btnH) {
      btnN.setAttribute("aria-pressed", difficulty === "normal" ? "true" : "false");
      btnH.setAttribute("aria-pressed", difficulty === "hard" ? "true" : "false");
    }
    updateHudForDifficulty();
    if (started && gameScene && !isGameOver) {
      // if game already started, changing difficulty restarts with new mode
    }
  }

  function setupHtmlControls(scene) {
    var btnN = document.getElementById("btn-normal");
    var btnH = document.getElementById("btn-hard");
    if (!btnN || !btnH) return;
    btnN.addEventListener("click", function () {
      var wasStarted = started;
      setDifficulty("normal");
      if (wasStarted) restart(scene);
      else if (startOverlay && startOverlay.visible) updateStartOverlayForDifficulty();
    });
    btnH.addEventListener("click", function () {
      var wasStarted = started;
      setDifficulty("hard");
      if (wasStarted) restart(scene);
      else if (startOverlay && startOverlay.visible) updateStartOverlayForDifficulty();
    });
    btnN.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btnN.click(); }
    });
    btnH.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btnH.click(); }
    });
  }

  function setupKeyboard(scene) {
    document.addEventListener("keydown", function (e) {
      if (e.key === "n" || e.key === "N") {
        setDifficulty("normal");
        if (startOverlay && startOverlay.visible) updateStartOverlayForDifficulty();
      }
      if (e.key === "h" || e.key === "H") {
        setDifficulty("hard");
        if (startOverlay && startOverlay.visible) updateStartOverlayForDifficulty();
      }
      if (e.key === "r" || e.key === "R") {
        if (started) restart(scene);
      }
      if (e.key === "Enter") {
        if (startOverlay && startOverlay.visible) {
          started = true; lockBoard = false; isGameOver = false;
          startOverlay.setVisible(false);
          hudMsg.setText(difficulty === "hard" ? "Hard mode! Go!" : "Tap a card!");
          totalPairs = getTotalPairs();
          buildBoard(scene);
          startTimer(scene);
          updateHudForDifficulty();
        } else if (endOverlay && endOverlay.visible) {
          restart(scene);
        }
      }
      if (e.key === "Escape") {
        if (endOverlay && endOverlay.visible) {
          endOverlay.setVisible(false);
          if (startOverlay) startOverlay.setVisible(true);
          started = false; lockBoard = true; isGameOver = false;
          stopTimer();
        }
      }
    });
  }

  function shuffledDeck() {
    var count = getTotalPairs();
    var pool = ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (difficulty === "hard") {
      cols = 4; rows = 4;
      cw = 185; ch = 108; gx = 62; gy = 175; padX = 22; padY = 12;
    } else {
      cols = 4; rows = 3;
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    updateHudForDifficulty();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var isSmall = h < 120;
    var pawSize = isSmall ? "44px" : "56px";
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: pawSize }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xffb5a7, 0xb5ead7, 0xc7ceea, 0xe2f0cb];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = isSmall ? "48px" : "62px";
    var emoY = isSmall ? -14 : -18;
    var emo = scene.add.text(0, emoY, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nmSize = isSmall ? 18 : 22;
    var nmY = isSmall ? 32 : 44;
    var nm = scene.add.text(0, nmY, data.name, textStyle(nmSize)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched || isGameOver) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, getFlipBackDelay());
    }
  }

  function startTimer(scene) {
    stopTimer();
    if (difficulty !== "hard") {
      if (hudTimer) hudTimer.setVisible(false);
      return;
    }
    timeLeft = getTimeForDifficulty();
    if (hudTimer) {
      hudTimer.setText("\u23F1 " + timeLeft + "s");
      hudTimer.setVisible(true);
      hudTimer.setColor("#c0392b");
    }
    timerEvent = scene.time.addEvent({
      delay: 1000,
      loop: true,
      callback: function () {
        timeLeft--;
        if (hudTimer) {
          hudTimer.setText("\u23F1 " + timeLeft + "s");
          if (timeLeft <= 10) {
            hudTimer.setColor("#e74c3c");
            scene.tweens.add({ targets: hudTimer, scale: 1.15, yoyo: true, duration: 150, onComplete: function(){ hudTimer.setScale(1); } });
          }
        }
        if (timeLeft <= 0) {
          stopTimer();
          triggerTimeout(scene);
        }
      }
    });
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function triggerTimeout(scene) {
    if (isGameOver) return;
    isGameOver = true;
    lockBoard = true;
    hudMsg.setText("Time's up! \u23F0");
    showEnd(scene, false, true);
  }

  var startTitle, startSub, startSub2, startRow, startBtnNormalBg, startBtnNormalTx, startBtnHardBg, startBtnHardTx, startDescNormal, startDescHard, startHintKeys;

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    startTitle = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    startSub = scene.add.text(0, -70, "Flip the cards and find all pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    startSub2 = scene.add.text(0, -38, "Choose your challenge:", textStyle(18, "#8a6a4a")).setOrigin(0.5);
    startRow = scene.add.text(0, 8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    startBtnNormalBg = scene.add.graphics();
    startBtnNormalBg.fillStyle(0x5da85f, 1); startBtnNormalBg.fillRoundedRect(-260, 50, 240, 60, 30);
    startBtnNormalTx = scene.add.text(-140, 80, "\u25B6 Normal", textStyle(22, "#ffffff")).setOrigin(0.5);
    startBtnHardBg = scene.add.graphics();
    startBtnHardBg.fillStyle(0xe76f51, 1); startBtnHardBg.fillRoundedRect(20, 50, 240, 60, 30);
    startBtnHardTx = scene.add.text(140, 80, "\u2605 Hard", textStyle(22, "#ffffff")).setOrigin(0.5);
    startDescNormal = scene.add.text(-140, 128, "6 pairs \u2022 Relaxed", textStyle(14, "#5b3a29")).setOrigin(0.5);
    startDescHard = scene.add.text(140, 128, "8 pairs \u2022 75s \u2022 Fast flip", textStyle(14, "#5b3a29")).setOrigin(0.5);
    startHintKeys = scene.add.text(0, 162, "Press N / H or use top bar • Enter to start", textStyle(12, "#8a6a4a")).setOrigin(0.5);
    startOverlay.add([bg, panel, startTitle, startSub, startSub2, startRow, startBtnNormalBg, startBtnNormalTx, startBtnHardBg, startBtnHardTx, startDescNormal, startDescHard, startHintKeys]);
    startBtnNormalBg.setInteractive(new Phaser.Geom.Rectangle(-260, 50, 240, 60), Phaser.Geom.Rectangle.Contains);
    startBtnHardBg.setInteractive(new Phaser.Geom.Rectangle(20, 50, 240, 60), Phaser.Geom.Rectangle.Contains);
    startBtnNormalBg.on("pointerdown", function () {
      setDifficulty("normal");
      started = true; lockBoard = false; isGameOver = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      totalPairs = getTotalPairs();
      buildBoard(scene);
      startTimer(scene);
      updateHudForDifficulty();
    });
    startBtnHardBg.on("pointerdown", function () {
      setDifficulty("hard");
      started = true; lockBoard = false; isGameOver = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Hard mode! Go! \u23F1");
      totalPairs = getTotalPairs();
      buildBoard(scene);
      startTimer(scene);
      updateHudForDifficulty();
    });
    startBtnNormalBg.on("pointerover", function () { startBtnNormalBg.setScale(1.03); startBtnNormalTx.setScale(1.03); });
    startBtnNormalBg.on("pointerout", function () { startBtnNormalBg.setScale(1); startBtnNormalTx.setScale(1); });
    startBtnHardBg.on("pointerover", function () { startBtnHardBg.setScale(1.03); startBtnHardTx.setScale(1.03); });
    startBtnHardBg.on("pointerout", function () { startBtnHardBg.setScale(1); startBtnHardTx.setScale(1); });
    updateStartOverlayForDifficulty();
  }

  function updateStartOverlayForDifficulty() {
    if (!startRow) return;
    if (difficulty === "hard") {
      startRow.setText("\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F436} \u{1F431}");
      startSub.setText("Hard Challenge: 8 pairs on a 4×4 board!");
      startSub.setColor("#c0392b");
    } else {
      startRow.setText("\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}");
      startSub.setText("Flip the cards and find all pairs!");
      startSub.setColor("#5b3a29");
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 135, "Tip: Switch difficulty with top bar or N / H keys", textStyle(12, "#8a6a4a")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnBg.on("pointerover", function () { btnBg.setScale(1.04); btnTx.setScale(1.04); });
    btnBg.on("pointerout", function () { btnBg.setScale(1); btnTx.setScale(1); });
  }

  function showWin(scene) {
    stopTimer();
    isGameOver = true;
    var stars;
    if (difficulty === "hard") {
      if (moves <= 14 && timeLeft >= 20) stars = 3;
      else if (moves <= 20 && timeLeft >= 5) stars = 2;
      else stars = 1;
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    var modeLabel = difficulty === "hard" ? "Hard Challenge" : "Normal";
    var timeInfo = difficulty === "hard" ? " • Time left: " + timeLeft + "s" : "";
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("You found all " + totalPairs + " pairs!\nMode: " + modeLabel + " • Moves: " + moves + timeInfo + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showEnd(scene, isWin, isTimeout) {
    if (isWin) { showWin(scene); return; }
    stopTimer();
    isGameOver = true;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("Hard Challenge failed!\nYou found " + matches + " / " + totalPairs + " pairs in " + getTimeForDifficulty() + "s.\nMoves: " + moves + " • Try again?");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; isGameOver = false;
    totalPairs = getTotalPairs();
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText(difficulty === "hard" ? "Hard mode! Go! \u23F1" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    updateHudForDifficulty();
  }

  function update() {}
})();
</script>
</body>
</html>
