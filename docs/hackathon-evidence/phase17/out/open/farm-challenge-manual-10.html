<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#eaf6ff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #difficultyForm{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.92);padding:6px 14px;border-radius:24px;border:2px solid #4EA8DE;z-index:10;box-shadow:0 2px 8px rgba(16,42,67,.12)}
  #difficultyForm fieldset{border:none;margin:0;padding:0;display:flex;gap:10px;align-items:center}
  #difficultyForm legend{font-weight:bold;color:#102A43;margin-right:6px;padding:0;font-size:14px}
  #difficultyForm label{display:flex;align-items:center;gap:5px;cursor:pointer;color:#102A43;font-weight:bold;font-size:14px;padding:4px 10px;border-radius:16px;transition:background .15s}
  #difficultyForm label:has(input:checked){background:#4EA8DE;color:#fff}
  #difficultyForm input{accent-color:#4EA8DE}
  #ariaLive{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game"></div>
<form id="difficultyForm" aria-label="Difficulty selection">
  <fieldset>
    <legend>Mode:</legend>
    <label><input type="radio" name="difficulty" value="easy" checked aria-label="Easy mode, 6 pairs, 4 by 3 grid"> Easy · 6 pairs</label>
    <label><input type="radio" name="difficulty" value="hard" aria-label="Hard mode, 8 pairs, 4 by 4 grid, harder challenge"> Hard · 8 pairs</label>
  </fieldset>
</form>
<div id="ariaLive" aria-live="polite" aria-atomic="true"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F983}", name: "Turkey" }
  ];
  var W = 900, H = 700;
  var difficulty = "easy";
  var totalPairs = 6;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#e0f2fe",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var modeEasyBg, modeHardBg, modeEasyTx, modeHardTx;
  var focusedIndex = 0;
  var focusRect = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupDifficultyForm();
    updateModeVisuals();
    updateAriaLive("Farmyard Memory Match loaded. Easy mode selected. 6 pairs.");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe0f2fe, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbae6fd, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(0, 520, W, 180);
    for (var wy = 540; wy < 600; wy += 18) {
      g.lineStyle(2, 0x7dd3fc, 0.6);
      g.beginPath();
      g.moveTo(0, wy);
      for (var wx = 0; wx <= W; wx += 40) {
        g.lineTo(wx, wy + Math.sin(wx * 0.02) * 6);
      }
      g.strokePath();
    }
    g.fillStyle(0xfef9c3, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xfde68a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0xffffff, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 360, 150, 18); g.fillRect(80, 400, 150, 18); g.fillRect(80, 440, 150, 18);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfde68a, 1); g.fillCircle(155, 285, 14);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x7fbcd6, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0xfbcfe8, 0xbae6fd, 0xa5f3fc, 0xddd6fe];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x7dd3fc, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0x4EA8DE, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 84, "Pairs: 0 / 6", textStyle(20));
    hudMode = scene.add.text(24, 108, "Mode: Easy", textStyle(16, "#4EA8DE")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var modeContainer = scene.add.container(360, 116);
    modeEasyBg = scene.add.graphics();
    modeEasyBg.fillStyle(0x102A43, 1); modeEasyBg.fillRoundedRect(-70, -18, 68, 36, 18);
    modeEasyTx = scene.add.text(-36, 0, "Easy", textStyle(16, "#ffffff")).setOrigin(0.5);
    modeHardBg = scene.add.graphics();
    modeHardBg.fillStyle(0x4EA8DE, 1); modeHardBg.fillRoundedRect(6, -18, 68, 36, 18);
    modeHardTx = scene.add.text(40, 0, "Hard", textStyle(16, "#ffffff")).setOrigin(0.5);
    modeContainer.add([modeEasyBg, modeEasyTx, modeHardBg, modeHardTx]);
    modeEasyBg.setInteractive(new Phaser.Geom.Rectangle(-70, -18, 68, 36), Phaser.Geom.Rectangle.Contains);
    modeHardBg.setInteractive(new Phaser.Geom.Rectangle(6, -18, 68, 36), Phaser.Geom.Rectangle.Contains);
    modeEasyBg.on("pointerdown", function(){ setDifficulty("easy", scene); });
    modeHardBg.on("pointerdown", function(){ setDifficulty("hard", scene); });
    modeEasyBg.on("pointerover", function(){ modeContainer.setScale(1.04); });
    modeHardBg.on("pointerover", function(){ modeContainer.setScale(1.04); });
    modeEasyBg.on("pointerout", function(){ modeContainer.setScale(1); });
    modeHardBg.on("pointerout", function(){ modeContainer.setScale(1); });
    scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(20, "#4EA8DE")).setOrigin(0.5).setName("instructionText");
  }

  function getAnimalsForDifficulty() {
    if (difficulty === "hard") { return ANIMALS; }
    return ANIMALS.slice(0, 6);
  }

  function shuffledDeck() {
    var pool = getAnimalsForDifficulty();
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (difficulty === "hard") {
      cols = 4; rows = 4;
      cw = 165; ch = 115; gx = 62; gy = 185; padX = 18; padY = 12;
    } else {
      cols = 4; rows = 3;
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusedIndex = 0;
    updateFocusVisual(scene);
    var instr = scene.children.getByName("instructionText");
    if (instr) { instr.setText("Find the " + totalPairs + " animal pairs!" + (difficulty==="hard" ? "  \u2B50 Hard" : "")); }
    hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    hudMode.setText("Mode: " + (difficulty==="hard" ? "Hard \u00B7 8 pairs" : "Easy \u00B7 6 pairs"));
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xe0f2fe, 0xbae6fd, 0x7dd3fc, 0xdbeafe, 0xc7d2fe, 0xa5f3fc, 0xbfdbfe, 0xe0e7ff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "56px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(20)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); updateAriaLive("Card revealed. One more to find a pair."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        updateAriaLive(matches === totalPairs ? "You found a pair! All pairs found!" : "Yay! You found a pair! " + matches + " of " + totalPairs);
        lockBoard = false;
        updateFocusVisual(scene);
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      updateAriaLive("Not a match. Try again.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusVisual(scene); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F30A} Farmyard Match \u{1F404}", textStyle(36)).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Flip the cards and find\nall the animal pairs!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 42, "Choose your challenge to begin", textStyle(16, "#4EA8DE")).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x4EA8DE, 1); easyBg.fillRoundedRect(-260, 70, 240, 70, 35);
    var easyTx = scene.add.text(-140, 105, "Easy", textStyle(22, "#ffffff")).setOrigin(0.5);
    var easySub = scene.add.text(-140, 125, "6 pairs  3\u00D74", textStyle(14, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x102A43, 1); hardBg.fillRoundedRect(20, 70, 240, 70, 35);
    var hardTx = scene.add.text(140, 105, "Hard", textStyle(22, "#ffffff")).setOrigin(0.5);
    var hardSub = scene.add.text(140, 125, "8 pairs  4\u00D74", textStyle(14, "#ffffff")).setOrigin(0.5);
    var foot = scene.add.text(0, 165, "Hard mode has more cards to remember!", textStyle(13, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, easyBg, easyTx, easySub, hardBg, hardTx, hardSub, foot]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-260, 70, 240, 70), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 70, 240, 70), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () {
      setDifficulty("easy", scene);
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      updateAriaLive("Easy mode started. Find 6 pairs.");
      buildBoard(scene);
    });
    hardBg.on("pointerdown", function () {
      setDifficulty("hard", scene);
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Hard mode! Tap a card!");
      updateAriaLive("Hard mode started. Find 8 pairs. More cards to remember!");
      buildBoard(scene);
    });
    var kbHint = scene.add.text(0, 148, "Press E for Easy  \u00B7  H for Hard", textStyle(12, "#4EA8DE")).setOrigin(0.5);
    startOverlay.add(kbHint);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars;
    if (difficulty === "hard") {
      stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1);
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    endDetail.setText("You found all " + totalPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nMode: " + (difficulty==="hard" ? "Hard" : "Easy"));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    updateAriaLive("You win! You found all " + totalPairs + " pairs in " + moves + " moves. " + stars + " stars.");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateAriaLive("Game restarted. " + totalPairs + " pairs to find. Mode " + difficulty);
  }

  function setDifficulty(mode, scene) {
    difficulty = mode;
    totalPairs = mode === "hard" ? 8 : 6;
    updateModeVisuals();
    var form = document.getElementById("difficultyForm");
    if (form) {
      var radios = form.querySelectorAll('input[name="difficulty"]');
      for (var i=0;i<radios.length;i++){ radios[i].checked = radios[i].value===mode; }
    }
    if (scene) {
      if (started) {
        moves = 0; matches = 0; firstPick = null; lockBoard = false;
        hudMoves.setText("Moves: 0");
        hudScore.setText("Pairs: 0 / " + totalPairs);
        hudMsg.setText(mode==="hard" ? "Hard mode! Tap a card!" : "Tap a card!");
        cards.forEach(function (c) { c.view.destroy(); });
        buildBoard(scene);
        updateAriaLive("Switched to " + mode + " mode. " + totalPairs + " pairs.");
      } else {
        var instr = scene.children.getByName("instructionText");
        if (instr) { instr.setText("Find the " + totalPairs + " animal pairs!" + (mode==="hard" ? "  \u2B50 Hard" : "")); }
        hudScore.setText("Pairs: 0 / " + totalPairs);
        hudMode.setText("Mode: " + (mode==="hard" ? "Hard \u00B7 8 pairs" : "Easy \u00B7 6 pairs"));
      }
    }
  }

  function updateModeVisuals() {
    if (!modeEasyBg || !modeHardBg) return;
    modeEasyBg.clear(); modeHardBg.clear();
    if (difficulty === "easy") {
      modeEasyBg.fillStyle(0x102A43, 1); modeEasyBg.fillRoundedRect(-70, -18, 68, 36, 18);
      modeHardBg.fillStyle(0x4EA8DE, 1); modeHardBg.fillRoundedRect(6, -18, 68, 36, 18);
    } else {
      modeEasyBg.fillStyle(0x4EA8DE, 1); modeEasyBg.fillRoundedRect(-70, -18, 68, 36, 18);
      modeHardBg.fillStyle(0x102A43, 1); modeHardBg.fillRoundedRect(6, -18, 68, 36, 18);
    }
  }

  function setupDifficultyForm() {
    var form = document.getElementById("difficultyForm");
    if (!form) return;
    var radios = form.querySelectorAll('input[name="difficulty"]');
    for (var i=0;i<radios.length;i++) {
      (function(radio){
        radio.addEventListener("click", function(){ 
          var scene = getActiveScene();
          setDifficulty(this.value, scene); 
        });
        radio.addEventListener("keydown", function(e){
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            this.checked = true;
            var scene2 = getActiveScene();
            setDifficulty(this.value, scene2);
          }
        });
      })(radios[i]);
    }
  }

  function getActiveScene() {
    if (cards.length && cards[0].view && cards[0].view.scene) return cards[0].view.scene;
    return null;
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function(e){
      if (e.key === "e" || e.key === "E") {
        if (startOverlay && startOverlay.visible) {
          setDifficulty("easy", scene);
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Tap a card!");
          buildBoard(scene);
        } else {
          setDifficulty("easy", scene);
        }
      }
      if (e.key === "h" || e.key === "H") {
        if (startOverlay && startOverlay.visible) {
          setDifficulty("hard", scene);
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Hard mode! Tap a card!");
          buildBoard(scene);
        } else {
          setDifficulty("hard", scene);
        }
      }
      if (e.key === "r" || e.key === "R") {
        restart(scene);
      }
      if (e.key === "Enter" || e.key === " ") {
        if (endOverlay && endOverlay.visible) {
          restart(scene);
          return;
        }
        if (startOverlay && startOverlay.visible) {
          setDifficulty(difficulty, scene);
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          buildBoard(scene);
          return;
        }
        if (cards[focusedIndex] && !lockBoard && started) {
          onCard(scene, cards[focusedIndex]);
        }
      }
      if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].indexOf(e.key) !== -1) {
        if (!started || !cards.length) return;
        e.preventDefault();
        var cols = 4;
        var rows = difficulty==="hard" ? 4 : 3;
        var total = cols * rows;
        if (e.key === "ArrowLeft") { focusedIndex = (focusedIndex - 1 + total) % total; }
        if (e.key === "ArrowRight") { focusedIndex = (focusedIndex + 1) % total; }
        if (e.key === "ArrowUp") { focusedIndex = (focusedIndex - cols + total) % total; }
        if (e.key === "ArrowDown") { focusedIndex = (focusedIndex + cols) % total; }
        updateFocusVisual(scene);
      }
    });
  }

  function updateFocusVisual(scene) {
    if (!scene) return;
    if (focusRect) { focusRect.destroy(); focusRect = null; }
    if (!started || !cards.length || lockBoard) return;
    var card = cards[focusedIndex];
    if (!card || card.matched) return;
    var b = card.view.getBounds();
    focusRect = scene.add.graphics().setDepth(5);
    focusRect.lineStyle(4, 0x102A43, 1);
    focusRect.strokeRoundedRect(b.x - 4, b.y - 4, b.width + 8, b.height + 8, 22);
  }

  function updateAriaLive(msg) {
    var el = document.getElementById("ariaLive");
    if (el) { el.textContent = msg; }
  }

  function update() {}
})();
</script>
