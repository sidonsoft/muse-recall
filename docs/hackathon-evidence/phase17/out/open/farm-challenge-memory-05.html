<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FB;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #modeBar{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0 6px 0;flex-wrap:wrap}
  .mode-btn{appearance:none;border:2px solid #4EA8DE;border-radius:999px;padding:9px 16px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;background:#ffffff;color:#102A43;transition:transform .15s,background .15s,color .15s,filter .15s}
  .mode-btn[aria-pressed="true"]{background:#4EA8DE;color:#ffffff;box-shadow:0 4px 12px rgba(78,168,222,.35)}
  .mode-btn:focus-visible{outline:3px solid #102A43;outline-offset:2px}
  .mode-label{font-size:14px;color:#102A43;font-weight:700;letter-spacing:.02em}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Ocean memory match game board"></div>
<div id="modeBar" role="group" aria-label="Difficulty selection">
  <span class="mode-label" id="modeLabel">Challenge:</span>
  <button type="button" class="mode-btn" id="btnEasy" aria-pressed="true" aria-label="Easy mode, 6 pairs on a 4 by 3 board">Easy • 6 pairs</button>
  <button type="button" class="mode-btn" id="btnHard" aria-pressed="false" aria-label="Hard mode, 8 pairs on a 4 by 4 board">Hard • 8 pairs</button>
</div>
<div id="liveRegion" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F421}", name: "Blowfish" },
    { emoji: "\u2B50", name: "Starfish" }
  ];
  var W = 900, H = 700;
  var difficulty = "easy";
  var totalPairs = 6;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E6F4FA",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var startEasyBg, startHardBg, startEasyTx, startHardTx;
  var gameScene = null;
  var focusedIndex = 0;
  var focusRect = null;

  function announce(msg) {
    var el = document.getElementById("liveRegion");
    if (el) { el.textContent = msg; }
  }

  function updateModeButtons() {
    var e = document.getElementById("btnEasy");
    var h = document.getElementById("btnHard");
    if (!e || !h) { return; }
    e.setAttribute("aria-pressed", difficulty === "easy" ? "true" : "false");
    h.setAttribute("aria-pressed", difficulty === "hard" ? "true" : "false");
  }

  function getBoardConfig() {
    if (difficulty === "hard") {
      return { cols: 4, rows: 4, cw: 160, ch: 115, gx: 62, gy: 188, padX: 18, padY: 14 };
    }
    return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
  }

  function setDifficulty(mode) {
    difficulty = mode;
    totalPairs = (mode === "hard" ? 8 : 6);
    updateModeButtons();
    refreshStartModeVisuals();
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
    if (hudMode) { hudMode.setText(mode === "hard" ? "Mode: Hard • 8 pairs" : "Mode: Easy • 6 pairs"); }
    if (hudMsg) { hudMsg.setText(mode === "hard" ? "Hard mode: 8 pairs!" : "Easy mode: 6 pairs!"); }
    announce(mode === "hard" ? "Hard mode selected, 8 pairs on a 4 by 4 board" : "Easy mode selected, 6 pairs on a 4 by 3 board");
    if (gameScene) {
      if (started) {
        restart(gameScene);
      } else {
        buildBoard(gameScene);
        focusedIndex = 0;
        updateFocus();
      }
    }
  }

  function refreshStartModeVisuals() {
    if (!startEasyBg || !startHardBg) { return; }
    startEasyBg.clear();
    startHardBg.clear();
    if (difficulty === "easy") {
      startEasyBg.fillStyle(0x4EA8DE, 1); startEasyBg.fillRoundedRect(-140, 18, 130, 44, 22);
      startHardBg.fillStyle(0xffffff, 1); startHardBg.fillRoundedRect(10, 18, 130, 44, 22);
      startHardBg.lineStyle(2, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(10, 18, 130, 44, 22);
    } else {
      startHardBg.fillStyle(0x4EA8DE, 1); startHardBg.fillRoundedRect(10, 18, 130, 44, 22);
      startEasyBg.fillStyle(0xffffff, 1); startEasyBg.fillRoundedRect(-140, 18, 130, 44, 22);
      startEasyBg.lineStyle(2, 0x4EA8DE, 1); startEasyBg.strokeRoundedRect(-140, 18, 130, 44, 22);
    }
    if (startEasyTx) { startEasyTx.setColor(difficulty === "easy" ? "#ffffff" : "#102A43"); }
    if (startHardTx) { startHardTx.setColor(difficulty === "hard" ? "#ffffff" : "#102A43"); }
  }

  function create() {
    var s = this;
    gameScene = s;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    updateModeButtons();
    var btnEasy = document.getElementById("btnEasy");
    var btnHard = document.getElementById("btnHard");
    if (btnEasy) {
      btnEasy.addEventListener("click", function () { setDifficulty("easy"); });
      btnEasy.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { setDifficulty("easy"); } });
    }
    if (btnHard) {
      btnHard.addEventListener("click", function () { setDifficulty("hard"); });
      btnHard.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { setDifficulty("hard"); } });
    }
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE6F4FA, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xD4EAF7, 1); g.fillRect(0, 0, W, 420);
    g.fillStyle(0xC7E8F3, 1); g.fillRect(0, 120, W, 200);
    g.fillStyle(0xBFE4F0, 1); g.fillRect(0, 260, W, 160);
    g.fillStyle(0xF0F8FF, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xE6F0F7, 1); g.fillEllipse(W / 2, 620, 900, 120);
    g.fillStyle(0xFFF6DD, 0.95); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE8A8, 0.95); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.9);
    for (var i = 0; i < 18; i++) {
      var bx = 40 + (i * 47) % 860;
      var by = 80 + (i % 3) * 90 + (i % 5) * 6;
      var br = 6 + (i % 4) * 4;
      g.fillCircle(bx, by, br);
      g.fillStyle(0xffffff, 0.5); g.fillCircle(bx + 3, by - 3, br * 0.4);
      g.fillStyle(0xffffff, 0.9);
    }
    g.fillStyle(0x7FB069, 1);
    for (var s = 0; s < 5; s++) {
      var sx = 90 + s * 170;
      g.fillEllipse(sx, 560, 22, 90);
      g.fillEllipse(sx + 12, 540, 18, 70);
      g.fillEllipse(sx - 10, 550, 16, 60);
    }
    g.fillStyle(0x5DA8A8, 1);
    for (var s2 = 0; s2 < 5; s2++) {
      var sx2 = 160 + s2 * 170;
      g.fillEllipse(sx2, 570, 18, 80);
    }
    g.fillStyle(0xFF9A8A, 1); g.fillCircle(120, 600, 18); g.fillCircle(135, 590, 14); g.fillCircle(105, 590, 12);
    g.fillStyle(0xFFB085, 1); g.fillCircle(780, 610, 16); g.fillCircle(795, 595, 12); g.fillCircle(765, 595, 10);
    g.fillStyle(0x4EA8DE, 0.14);
    g.fillEllipse(300, 140, 40, 18); g.fillTriangle(280, 140, 270, 130, 270, 150);
    g.fillEllipse(600, 200, 36, 16); g.fillTriangle(582, 200, 572, 192, 572, 208);
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22, "#102A43"));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22, "#102A43"));
    hudMode = scene.add.text(24, 112, "Mode: Easy \u2022 6 pairs", textStyle(16, "#4EA8DE")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the ocean pairs! Use arrow keys + Enter too.", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var pool = ANIMALS.slice(0, totalPairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    if (focusRect) { focusRect.destroy(); focusRect = null; }
    var deck = shuffledDeck();
    var cfg = getBoardConfig();
    var cols = cfg.cols, cw = cfg.cw, ch = cfg.ch, gx = cfg.gx, gy = cfg.gy, padX = cfg.padX, padY = cfg.padY;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusedIndex = 0;
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.9);
    back.fillCircle(-w / 4, -h / 4, 10); back.fillCircle(w / 4, 0, 7); back.fillCircle(0, h / 4, 11);
    back.fillStyle(0xffffff, 0.55); back.fillCircle(-w / 5, h / 5, 5);
    var paw = scene.add.text(0, -6, "\u{1F4A7}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE0F2FE, 0xD0EBF5, 0xBFE4F0, 0xA8D8EA, 0xC7E8F3, 0xE6F4FA, 0xD6EAF8, 0xEBF5FB];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -16, data.emoji, { fontSize: w > 170 ? "58px" : "48px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 170 ? 20 : 18, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { focusedIndex = cards.indexOf(card); updateFocus(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Revealed " + card.data.name + ", pick one more"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    announce("Move " + moves + ", checking pair");
    var a = firstPick; firstPick = null; lockBoard = true;
    if (focusRect) { focusRect.setVisible(false); }
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce(matches === totalPairs ? "Pair found! All pairs completed" : "Pair found! " + matches + " of " + totalPairs);
        lockBoard = false;
        updateFocus();
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F4A7}");
      announce("Not a match, try again");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocus(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F30A} Ocean Memory Match \u{1F419}", textStyle(36, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -105, "Flip the cards and find all the ocean pairs!", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -62, "\u{1F419} \u{1F980} \u{1F433} \u{1F422} \u{1F42C} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var choose = scene.add.text(0, -18, "Choose challenge:", textStyle(18, "#102A43")).setOrigin(0.5);
    startEasyBg = scene.add.graphics();
    startHardBg = scene.add.graphics();
    startEasyTx = scene.add.text(-75, 40, "Easy • 6", textStyle(18, "#ffffff")).setOrigin(0.5);
    startHardTx = scene.add.text(75, 40, "Hard • 8", textStyle(18, "#102A43")).setOrigin(0.5);
    var hint = scene.add.text(0, 72, "Hard: 4×4 board, 8 pairs to remember!", textStyle(15, "#4EA8DE")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 98, 260, 64, 32);
    var btnTx = scene.add.text(0, 130, "\u25B6  Start", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, choose, startEasyBg, startHardBg, startEasyTx, startHardTx, hint, btnBg, btnTx]);
    refreshStartModeVisuals();
    startEasyBg.setInteractive(new Phaser.Geom.Rectangle(-140, 18, 130, 44), Phaser.Geom.Rectangle.Contains);
    startHardBg.setInteractive(new Phaser.Geom.Rectangle(10, 18, 130, 44), Phaser.Geom.Rectangle.Contains);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 98, 260, 64), Phaser.Geom.Rectangle.Contains);
    startEasyBg.on("pointerdown", function () { setDifficulty("easy"); });
    startHardBg.on("pointerdown", function () { setDifficulty("hard"); });
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card! Arrow keys + Enter works too.");
      focusedIndex = 0; updateFocus();
      announce("Game started in " + difficulty + " mode");
    });
    startEasyBg.on("pointerover", function () { startOverlay.setScale(1.01); });
    startEasyBg.on("pointerout", function () { startOverlay.setScale(1); });
    startHardBg.on("pointerover", function () { startOverlay.setScale(1.01); });
    startHardBg.on("pointerout", function () { startOverlay.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= (totalPairs + 4) ? 3 : (moves <= (totalPairs + 10) ? 2 : 1);
    var modeLabel = difficulty === "hard" ? "Hard • 8 pairs" : "Easy • 6 pairs";
    endDetail.setText("You found all " + totalPairs + " pairs!\n" + modeLabel + "  •  Moves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Found all " + totalPairs + " pairs in " + moves + " moves");
    if (focusRect) { focusRect.setVisible(false); }
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F419}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    if (hudMode) { hudMode.setText(difficulty === "hard" ? "Mode: Hard \u2022 8 pairs" : "Mode: Easy \u2022 6 pairs"); }
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    focusedIndex = 0;
    updateFocus();
    announce("New game started, " + totalPairs + " pairs");
  }

  function updateFocus() {
    if (focusRect) { focusRect.destroy(); focusRect = null; }
    if (!gameScene || cards.length === 0) { return; }
    if (!started || lockBoard) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusedIndex];
    if (!card) { return; }
    var w = card.view.width || 160;
    var h = card.view.height || 115;
    if (!w || w === 0) {
      var cfg = getBoardConfig();
      w = cfg.cw; h = cfg.ch;
    }
    focusRect = gameScene.add.graphics().setDepth(5);
    focusRect.lineStyle(4, 0x102A43, 1);
    focusRect.strokeRoundedRect(card.view.x - w / 2 - 6, card.view.y - h / 2 - 6, w + 12, h + 12, 18);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (!started) {
        if (e.key === "Enter" || e.key === " ") {
          if (startOverlay && startOverlay.visible) {
            started = true; lockBoard = false;
            startOverlay.setVisible(false);
            hudMsg.setText("Tap a card! Arrow keys + Enter works too.");
            focusedIndex = 0; updateFocus();
            announce("Game started");
          }
        }
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          var newMode = (e.key === "ArrowRight" ? "hard" : "easy");
          setDifficulty(newMode);
        }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.key === "Enter" || e.key === " ") {
          restart(scene);
        }
        return;
      }
      var cfg = getBoardConfig();
      var cols = cfg.cols;
      if (e.key === "ArrowRight") {
        focusedIndex = (focusedIndex + 1) % cards.length;
        updateFocus();
        announce("Focused card " + (focusedIndex + 1) + " of " + cards.length);
      } else if (e.key === "ArrowLeft") {
        focusedIndex = (focusedIndex - 1 + cards.length) % cards.length;
        updateFocus();
        announce("Focused card " + (focusedIndex + 1) + " of " + cards.length);
      } else if (e.key === "ArrowDown") {
        focusedIndex = (focusedIndex + cols) % cards.length;
        updateFocus();
        announce("Focused card " + (focusedIndex + 1) + " of " + cards.length);
      } else if (e.key === "ArrowUp") {
        focusedIndex = (focusedIndex - cols + cards.length) % cards.length;
        updateFocus();
        announce("Focused card " + (focusedIndex + 1) + " of " + cards.length);
      } else if (e.key === "Enter" || e.key === " ") {
        var card = cards[focusedIndex];
        if (card) { onCard(scene, card); }
      }
    });
  }

  function update() {}
})();
</script>
</body>
