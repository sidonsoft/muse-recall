<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
  }
  #addBtn:hover { filter: brightness(1.06); }
  #addBtn:active { filter: brightness(0.96); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #clearBtn:hover { color: var(--text); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
  }
  .task.completed { opacity: 0.82; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .check:hover { background: var(--accent-soft); }
  .task.completed .check:hover { background: var(--accent); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
  }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  /* Celebratory completion styles */
  #celebrationLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .confetti-piece {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    opacity: 0;
    will-change: transform, opacity;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .confetti-piece.circle {
    border-radius: 50%;
  }
  @keyframes confettiBurst {
    0% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    15% { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.9); opacity: 0; }
  }
  @keyframes checkPop {
    0% { transform: scale(0.7); }
    40% { transform: scale(1.32); }
    70% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  @keyframes taskCelebrate {
    0% { transform: scale(1); background: var(--surface-2); border-color: var(--border); box-shadow: none; }
    28% { transform: scale(1.025); background: rgba(231,193,124,0.16); border-color: rgba(231,193,124,0.55); box-shadow: 0 0 0 3px rgba(231,193,124,0.18), 0 10px 28px rgba(231,193,124,0.22); }
    100% { transform: scale(1); background: var(--surface-2); border-color: var(--border); box-shadow: none; }
  }
  @keyframes progressPulse {
    0% { transform: scaleY(1); filter: brightness(1); }
    45% { transform: scaleY(1.45); filter: brightness(1.18); box-shadow: 0 0 14px rgba(231,193,124,0.65); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }
  @keyframes progressShine {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes sparklePop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(12deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--sx), var(--sy)) scale(0.85) rotate(40deg); }
  }
  .task.just-completed {
    animation: taskCelebrate 680ms cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .task.just-completed .check {
    animation: checkPop 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #progressBar.celebrating {
    animation: progressPulse 620ms ease;
    position: relative;
    overflow: hidden;
  }
  #progressBar.celebrating::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.38) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: progressShine 900ms ease;
  }
  .celebrate-toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(16px) scale(0.96);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 11px 18px;
    border-radius: 999px;
    font-weight: 750;
    font-size: 0.95rem;
    letter-spacing: 0.1px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.45), 0 0 0 1px rgba(231,193,124,0.6), 0 4px 12px rgba(231,193,124,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 280ms ease, transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    max-width: calc(100vw - 32px);
    justify-content: center;
  }
  .celebrate-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .sparkle {
    position: absolute;
    pointer-events: none;
    font-size: 14px;
    color: var(--accent);
    text-shadow: 0 1px 6px rgba(231,193,124,0.85);
    animation: sparklePop 700ms ease forwards;
    z-index: 2;
  }
  @media (prefers-reduced-motion: reduce) {
    .task.just-completed,
    .task.just-completed .check,
    #progressBar.celebrating,
    .confetti-piece,
    .sparkle {
      animation: none !important;
    }
    .celebrate-toast { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>
<div id="celebrationLayer" aria-hidden="true"></div>
<div id="celebrateToast" class="celebrate-toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var celebrationLayer = document.getElementById("celebrationLayer");
  var celebrateToast = document.getElementById("celebrateToast");
  var justCompletedId = null;
  var toastTimeout = null;
  var progressCelebrateTimeout = null;
  var celebrationMessages = ["Nice work! \u2728", "Task done! \uD83C\uDF89", "You're on fire! \uD83D\uDD25", "Keep it up! \u2B50", "Boom! Completed! \uD83D\uDCAB", "Beautiful! \uD83C\uDF1F"];
  var messageIndex = 0;

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
  }

  function getNextMessage(isAllDone) {
    if (isAllDone) return "All done! Incredible! \uD83C\uDF89";
    var msg = celebrationMessages[messageIndex % celebrationMessages.length];
    messageIndex += 1;
    return msg;
  }

  function showToast(message) {
    if (!celebrateToast) return;
    celebrateToast.textContent = message;
    celebrateToast.classList.add("show");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function () {
      celebrateToast.classList.remove("show");
    }, 2200);
  }

  function launchConfettiBurst(x, y, isBig) {
    if (!celebrationLayer) return;
    var count = isBig ? 28 : 18;
    var colors = ["#e7c17c", "#f2ede3", "#d4a574", "#fff8e7", "#c9a86a", "#ffe4a3", "#e8c99a"];
    for (var i = 0; i < count; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      if (Math.random() > 0.7) piece.classList.add("circle");
      var color = colors[Math.floor(Math.random() * colors.length)];
      piece.style.background = color;
      piece.style.left = x + "px";
      piece.style.top = y + "px";
      var dx = (Math.random() - 0.5) * (isBig ? 260 : 180);
      var dy = (Math.random() * (isBig ? 220 : 160) - (isBig ? 60 : 40));
      if (Math.random() > 0.5) dy = dy + 40;
      var rot = (Math.random() * 720 - 360) + "deg";
      var duration = 700 + Math.random() * 600;
      var delay = Math.random() * 80;
      piece.style.setProperty("--dx", dx + "px");
      piece.style.setProperty("--dy", dy + "px");
      piece.style.setProperty("--rot", rot);
      piece.style.animation = "confettiBurst " + duration + "ms cubic-bezier(0.25,0.46,0.45,0.94) " + delay + "ms forwards";
      var size = 6 + Math.random() * 6;
      piece.style.width = size + "px";
      piece.style.height = (size * 0.7) + "px";
      if (piece.classList.contains("circle")) {
        piece.style.width = size + "px";
        piece.style.height = size + "px";
      }
      celebrationLayer.appendChild(piece);
      (function (el, d) {
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, d + 100);
      })(piece, duration + delay);
    }
    var sparkleCount = isBig ? 6 : 4;
    var sparkles = ["\u2726", "\u2727", "\u2605", "\u2728", "\u2B50"];
    for (var s = 0; s < sparkleCount; s++) {
      var sp = document.createElement("span");
      sp.className = "sparkle";
      sp.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
      sp.style.left = x + "px";
      sp.style.top = y + "px";
      var sx = (Math.random() - 0.5) * 100;
      var sy = (Math.random() - 0.5) * 80 - 10;
      sp.style.setProperty("--sx", sx + "px");
      sp.style.setProperty("--sy", sy + "px");
      sp.style.animationDelay = (Math.random() * 100) + "ms";
      celebrationLayer.appendChild(sp);
      (function (el) {
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 800);
      })(sp);
    }
  }

  function triggerTaskCelebration(taskId, isAllDone) {
    var x;
    var y;
    var li = list.querySelector('[data-task-id="' + taskId + '"]');
    if (li) {
      var rect = li.getBoundingClientRect();
      x = rect.left + rect.width * 0.22;
      y = rect.top + rect.height / 2;
      var checkEl = li.querySelector(".check");
      if (checkEl) {
        var cRect = checkEl.getBoundingClientRect();
        x = cRect.left + cRect.width / 2;
        y = cRect.top + cRect.height / 2;
      }
    } else {
      var trackRect = progressTrack.getBoundingClientRect();
      x = trackRect.left + trackRect.width / 2;
      y = trackRect.top + trackRect.height / 2;
    }
    launchConfettiBurst(x, y, isAllDone);
    var msg = getNextMessage(isAllDone);
    showToast(msg);
    progressBar.classList.remove("celebrating");
    void progressBar.offsetWidth;
    progressBar.classList.add("celebrating");
    clearTimeout(progressCelebrateTimeout);
    progressCelebrateTimeout = setTimeout(function () {
      progressBar.classList.remove("celebrating");
    }, 900);
  }

  function toggleTask(id) {
    var wasCompleted = false;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        wasCompleted = tasks[i].completed;
        break;
      }
    }
    for (var j = 0; j < tasks.length; j++) {
      if (tasks[j].id === id) {
        tasks[j].completed = !tasks[j].completed;
        break;
      }
    }
    if (!wasCompleted) {
      justCompletedId = id;
    } else {
      justCompletedId = null;
    }
    render();
    if (!wasCompleted) {
      var total = tasks.length;
      var done = tasks.filter(function (t) { return t.completed; }).length;
      var isAllDone = total > 0 && done === total;
      triggerTaskCelebration(id, isAllDone);
      setTimeout(function () {
        justCompletedId = null;
        var completedLi = list.querySelector('[data-task-id="' + id + '"]');
        if (completedLi) completedLi.classList.remove("just-completed");
      }, 700);
    }
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "") + (task.id === justCompletedId ? " just-completed" : "");
      li.setAttribute("data-task-id", String(task.id));

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function () { toggleTask(task.id); });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
