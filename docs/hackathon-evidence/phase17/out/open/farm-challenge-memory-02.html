<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#EAF6FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;flex-direction:column}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;position:relative}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  #topBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:10;background:rgba(255,255,255,.92);padding:6px 12px;border-radius:999px;box-shadow:0 4px 16px rgba(16,42,67,.12);border:2px solid #4EA8DE}
  .modeBtn{appearance:none;border:2px solid #4EA8DE;background:#fff;color:#102A43;font-family:inherit;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;transition:transform .12s, background .12s, color .12s}
  .modeBtn[aria-pressed="true"]{background:#4EA8DE;color:#fff;box-shadow:0 4px 12px rgba(78,168,222,.35)}
  .modeBtn:focus-visible{outline:3px solid #102A43;outline-offset:2px}
  .modeBtn:hover{transform:translateY(-1px)}
  #modeStatus{font-size:13px;color:#102A43;font-weight:700;white-space:nowrap}
  @media(max-width:600px){#topBar{top:4px;padding:4px 8px;gap:6px} .modeBtn{font-size:12px;padding:6px 10px} #modeStatus{font-size:11px}}
</style>
</head>
<body>
<div id="topBar" role="group" aria-label="Difficulty selection">
  <span id="modeStatus" aria-live="polite">Mode: Calm Waters (Easy)</span>
  <button type="button" class="modeBtn" id="btnEasy" aria-pressed="true" aria-label="Switch to Easy mode with 6 pairs">Calm Waters · Easy</button>
  <button type="button" class="modeBtn" id="btnHard" aria-pressed="false" aria-label="Switch to Hard mode with 8 pairs">Deep Dive · Hard</button>
</div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F42C}", name: "Dolphin" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#EAF6FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var currentMode = "easy", totalPairs = 6, focusedIndex = 0, focusRing = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupModeButtons(s);
    setMode("easy", s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xEAF6FF, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xB8E0F6, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xE6F4FF, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0x4EA8DE, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xEAF6FF, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xEAF6FF, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x4EA8DE, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x7EC8E3, 0xA8D8EA, 0x90E0EF];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x4EA8DE, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xEAF6FF, 1); g.fillCircle(fx, fy - 8, 4);
    }
    g.lineStyle(3, 0xffffff, 0.9);
    for (var wy = 500; wy < 560; wy += 18) {
      for (var wx = 320; wx < 880; wx += 40) {
        g.beginPath(); g.moveTo(wx, wy); g.lineTo(wx + 20, wy - 6); g.lineTo(wx + 40, wy); g.strokePath();
      }
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F30A} Ocean Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the pairs! Choose your challenge.", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var count = totalPairs;
    var pool = ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    var deck = shuffledDeck();
    var cols, rows, cw, ch, gx, gy, padX, padY;
    if (currentMode === "hard") {
      cols = 4; rows = 4;
      cw = 165; ch = 115; gx = 70; gy = 185; padX = 18; padY = 12;
    } else {
      cols = 4; rows = 3;
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusedIndex = 0;
    if (started) { updateFocusRing(scene); }
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE6F4FF, 0xB8E0F6, 0xA8D8EA, 0xD6EAF8, 0xC1E7FF, 0xEAF6FF, 0x90E0EF, 0x7EC8E3, 0xB8E0F6, 0xE6F4FF];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { focusedIndex = cards.indexOf(card); updateFocusRing(scene); onCard(scene, card); });
    return card;
  }

  function updateFocusRing(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length || !started) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusedIndex];
    if (!card || card.matched) {
      for (var i = 0; i < cards.length; i++) {
        var idx = (focusedIndex + i) % cards.length;
        if (!cards[idx].matched) { focusedIndex = idx; card = cards[idx]; break; }
      }
    }
    if (!card) { return; }
    var w = card.view.width || 185, h = card.view.height || 140;
    if (currentMode === "hard") { w = 165; h = 115; }
    focusRing = scene.add.graphics();
    focusRing.lineStyle(4, 0x102A43, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 18);
    focusRing.setDepth(5);
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); updateFocusRing(scene); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        updateFocusRing(scene);
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(scene); });
      }, 700);
    }
  }

  function setMode(mode, scene) {
    currentMode = mode;
    totalPairs = (mode === "hard" ? 8 : 6);
    var btnEasy = document.getElementById("btnEasy");
    var btnHard = document.getElementById("btnHard");
    var status = document.getElementById("modeStatus");
    if (btnEasy && btnHard) {
      btnEasy.setAttribute("aria-pressed", mode === "easy" ? "true" : "false");
      btnHard.setAttribute("aria-pressed", mode === "hard" ? "true" : "false");
    }
    if (status) {
      status.textContent = mode === "hard" ? "Mode: Deep Dive (Hard · 8 pairs)" : "Mode: Calm Waters (Easy · 6 pairs)";
    }
    updateStartOverlayModeVisual();
    if (scene) {
      if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
      if (started) {
        restart(scene);
      } else {
        buildBoard(scene);
      }
    }
  }

  function updateStartOverlayModeVisual() {
    if (!startOverlay || !startOverlay.easyBg) { return; }
    var s = startOverlay;
    s.easyBg.clear();
    s.hardBg.clear();
    if (currentMode === "easy") {
      s.easyBg.fillStyle(0x4EA8DE, 1); s.easyBg.fillRoundedRect(-260, 30, 240, 70, 20);
      s.hardBg.fillStyle(0xffffff, 1); s.hardBg.fillRoundedRect(20, 30, 240, 70, 20);
      s.hardBg.lineStyle(3, 0x4EA8DE, 1); s.hardBg.strokeRoundedRect(20, 30, 240, 70, 20);
      s.easyTx.setColor("#ffffff");
      s.hardTx.setColor("#102A43");
    } else {
      s.easyBg.fillStyle(0xffffff, 1); s.easyBg.fillRoundedRect(-260, 30, 240, 70, 20);
      s.easyBg.lineStyle(3, 0x4EA8DE, 1); s.easyBg.strokeRoundedRect(-260, 30, 240, 70, 20);
      s.hardBg.fillStyle(0x4EA8DE, 1); s.hardBg.fillRoundedRect(20, 30, 240, 70, 20);
      s.easyTx.setColor("#102A43");
      s.hardTx.setColor("#ffffff");
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card! Use arrows + Enter to play.");
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / " + totalPairs);
    buildBoard(scene);
    updateFocusRing(scene);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F30A} Ocean Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -70, "Flip the cards and find\nall the animal pairs!", Object.assign(textStyle(20), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -20, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x4EA8DE, 1); easyBg.fillRoundedRect(-260, 30, 240, 70, 20);
    var easyTx = scene.add.text(-140, 65, "Calm Waters\n6 pairs \u00B7 Easy", Object.assign(textStyle(16, "#ffffff"), { align: "center" })).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xffffff, 1); hardBg.fillRoundedRect(20, 30, 240, 70, 20);
    hardBg.lineStyle(3, 0x4EA8DE, 1); hardBg.strokeRoundedRect(20, 30, 240, 70, 20);
    var hardTx = scene.add.text(140, 65, "Deep Dive\n8 pairs \u00B7 Hard", Object.assign(textStyle(16, "#102A43"), { align: "center" })).setOrigin(0.5);
    var hint = scene.add.text(0, 135, "Hard mode adds 2 extra pairs for a bigger challenge!", textStyle(14, "#102A43")).setOrigin(0.5);
    var keys = scene.add.text(0, 160, "Tip: Use arrow keys + Enter, or press 1 / 2 to choose mode", textStyle(12, "#4EA8DE")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, easyBg, easyTx, hardBg, hardTx, hint, keys]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-260, 30, 240, 70), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 30, 240, 70), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { setMode("easy", scene); startGame(scene); });
    hardBg.on("pointerdown", function () { setMode("hard", scene); startGame(scene); });
    easyBg.on("pointerover", function () { easyBg.setScale(1.02); });
    easyBg.on("pointerout", function () { easyBg.setScale(1); });
    hardBg.on("pointerover", function () { hardBg.setScale(1.02); });
    hardBg.on("pointerout", function () { hardBg.setScale(1); });
    startOverlay.easyBg = easyBg; startOverlay.hardBg = hardBg; startOverlay.easyTx = easyTx; startOverlay.hardTx = hardTx;
    updateStartOverlayModeVisual();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars;
    if (totalPairs === 8) {
      stars = moves <= 14 ? 3 : (moves <= 20 ? 2 : 1);
    } else {
      stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    }
    endDetail.setText("You found all " + totalPairs + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nMode: " + (currentMode === "hard" ? "Deep Dive" : "Calm Waters"));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    buildBoard(scene);
  }

  function setupModeButtons(scene) {
    var btnEasy = document.getElementById("btnEasy");
    var btnHard = document.getElementById("btnHard");
    if (btnEasy) {
      btnEasy.addEventListener("click", function () { setMode("easy", scene); });
      btnEasy.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setMode("easy", scene); } });
    }
    if (btnHard) {
      btnHard.addEventListener("click", function () { setMode("hard", scene); });
      btnHard.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setMode("hard", scene); } });
    }
  }

  function setupKeyboard(scene) {
    window.addEventListener("keydown", function (e) {
      if (!started) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          startGame(scene);
        } else if (e.key === "1") {
          setMode("easy", scene);
        } else if (e.key === "2") {
          setMode("hard", scene);
        }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          restart(scene);
        }
        return;
      }
      var cols = 4;
      var total = totalPairs * 2;
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        focusedIndex = (focusedIndex - 1 + total) % total;
        updateFocusRing(scene);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        focusedIndex = (focusedIndex + 1) % total;
        updateFocusRing(scene);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        focusedIndex = (focusedIndex - cols + total) % total;
        updateFocusRing(scene);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        focusedIndex = (focusedIndex + cols) % total;
        updateFocusRing(scene);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        var card = cards[focusedIndex];
        if (card) { onCard(scene, card); }
      } else if (e.key === "r" || e.key === "R") {
        restart(scene);
      }
    });
  }

  function update() {}
})();
</script>
