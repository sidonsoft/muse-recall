<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocean Memory Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#E6F4FF;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  #live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" aria-live="polite" aria-atomic="true"></div>
<script>
(function () {
  var OCEAN_ANIMALS = [
    { emoji: "\u{1F433}", name: "Whale" },
    { emoji: "\u{1F42C}", name: "Dolphin" },
    { emoji: "\u{1F419}", name: "Octopus" },
    { emoji: "\u{1F988}", name: "Shark" },
    { emoji: "\u{1F420}", name: "Fish" },
    { emoji: "\u{1F980}", name: "Crab" },
    { emoji: "\u{1F422}", name: "Turtle" },
    { emoji: "\u{1F991}", name: "Squid" },
    { emoji: "\u{1F41A}", name: "Shell" },
    { emoji: "\u2B50", name: "Star" }
  ];
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3, name: "Coral Reef" },
    { pairs: 8, cols: 4, rows: 4, name: "Deep Blue" },
    { pairs: 10, cols: 5, rows: 4, name: "Ocean Master" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#E6F4FF",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, levelIndex = 0;
  var hudMoves, hudScore, hudLevel, hudStreak, hudMsg, endOverlay, endTitle, endDetail, startOverlay, levelOverlay;
  var progressDots = [], bubbles = [], focusIndex = -1;

  function create() {
    var s = this;
    drawOcean(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeLevelOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    for (var i = 0; i < 8; i++) {
      var b = s.add.graphics();
      b.fillStyle(0xffffff, 0.6);
      b.fillCircle(0, 0, 3 + Math.random() * 4);
      b.setPosition(Phaser.Math.Between(20, W - 20), Phaser.Math.Between(180, 560));
      b.speed = 0.3 + Math.random() * 0.6;
      b.drift = (Math.random() - 0.5) * 0.4;
      bubbles.push(b);
    }
  }

  function drawOcean(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xE6F4FF, 1);
    g.fillRect(0, 0, W, H);
    g.fillStyle(0xD0EBF7, 1);
    g.fillRect(0, 140, W, 430);
    g.fillStyle(0xB3E5FC, 1);
    g.fillRect(0, 560, W, 140);
    g.lineStyle(4, 0x4EA8DE, 0.35);
    for (var y = 170; y < 200; y += 12) {
      g.beginPath();
      for (var x = 0; x < W; x += 20) {
        var wy = y + Math.sin(x * 0.02) * 6;
        if (x === 0) {
          g.moveTo(x, wy);
        } else {
          g.lineTo(x, wy);
        }
      }
      g.strokePath();
    }
    g.fillStyle(0xE1F5FE, 1);
    g.fillEllipse(120, 620, 180, 40);
    g.fillEllipse(750, 640, 200, 36);
    g.fillStyle(0x4EA8DE, 0.22);
    g.fillEllipse(40, 580, 30, 80);
    g.fillEllipse(860, 590, 28, 70);
    g.fillStyle(0xffffff, 0.7);
    for (var i = 0; i < 12; i++) {
      var bx = 60 + i * 75 + (i % 2) * 20;
      var by = 200 + (i % 3) * 30;
      g.fillCircle(bx, by, 3 + (i % 3) * 2);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    var bar = scene.add.graphics();
    bar.fillStyle(0xffffff, 0.92);
    bar.fillRoundedRect(12, 8, W - 24, 110, 18);
    bar.lineStyle(3, 0x4EA8DE, 1);
    bar.strokeRoundedRect(12, 8, W - 24, 110, 18);
    scene.add.text(28, 18, "\u{1F30A} Ocean Arcade", textStyle(30)).setOrigin(0, 0);
    hudLevel = scene.add.text(28, 52, "Wave 1 \u2013 Coral Reef", textStyle(18, "#4EA8DE")).setOrigin(0, 0);
    hudMoves = scene.add.text(28, 76, "Moves: 0", textStyle(18)).setOrigin(0, 0);
    hudScore = scene.add.text(28, 96, "Score: 0", textStyle(18)).setOrigin(0, 0);
    hudStreak = scene.add.text(W - 28, 52, "Streak: 0 \u2728", textStyle(18, "#4EA8DE")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 28, 80, "Find the pairs! \u{1F420}", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    for (var i = 0; i < 10; i++) {
      var dot = scene.add.graphics();
      dot.fillStyle(0xE1F5FE, 1);
      dot.fillCircle(0, 0, 8);
      dot.lineStyle(2, 0x4EA8DE, 1);
      dot.strokeCircle(0, 0, 8);
      dot.setPosition(28 + i * 22, 132);
      dot.setVisible(false);
      progressDots.push(dot);
    }
    var btn = scene.add.container(W - 110, 108);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1);
    bg.fillRoundedRect(-86, -22, 172, 44, 22);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.05); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 148, "Match all pairs to ride the next wave!", textStyle(18, "#5A7A9A")).setOrigin(0.5);
  }

  function shuffledDeckForLevel(lvl) {
    var deck = [];
    var needed = LEVELS[lvl].pairs;
    var pool = OCEAN_ANIMALS.slice(0, needed);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i];
      deck[i] = deck[j];
      deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var lvl = LEVELS[levelIndex];
    var deck = shuffledDeckForLevel(levelIndex);
    var cols = lvl.cols, rows = lvl.rows;
    var cw, ch, gx, gy, padX, padY;
    if (lvl.pairs === 6) { cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16; }
    else if (lvl.pairs === 8) { cw = 185; ch = 105; gx = 62; gy = 175; padX = 22; padY = 12; }
    else { cw = 150; ch = 105; gx = 45; gy = 175; padX = 14; padY = 12; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    progressDots.forEach(function (d, i) {
      d.setVisible(i < lvl.pairs);
      d.clear();
      d.fillStyle(0xE1F5FE, 1);
      d.fillCircle(0, 0, 8);
      d.lineStyle(2, 0x4EA8DE, 1);
      d.strokeCircle(0, 0, 8);
    });
    focusIndex = -1;
    updateLive("Wave " + (levelIndex + 1) + " " + lvl.name + ". Find " + lvl.pairs + " pairs.");
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1);
    back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    back.fillStyle(0x4EA8DE, 1);
    back.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    back.lineStyle(3, 0xffffff, 0.9);
    for (var wy = -h / 4; wy < h / 4; wy += 14) {
      back.beginPath();
      back.moveTo(-w / 2 + 18, wy);
      back.lineTo(-w / 2 + 30, wy - 6);
      back.lineTo(-w / 2 + 42, wy);
      back.lineTo(-w / 2 + 54, wy - 6);
      back.strokePath();
    }
    back.fillStyle(0xffffff, 0.95);
    back.fillCircle(0, h / 4, 10);
    var paw = scene.add.text(0, -4, "\u{1F30A}", { fontSize: "42px" }).setOrigin(0.5);
    paw.setAlpha(0.95);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xE1F5FE, 0xB3E5FC, 0xA9DEF9, 0xD0EBF7, 0xE6F4FF, 0x81D4FA, 0xB2EBF2, 0xC8E6FF, 0xE0F7FA, 0xBBDEFB];
    fg.fillStyle(0xffffff, 1);
    fg.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 14);
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: w > 160 ? "56px" : "48px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(w > 160 ? 20 : 18)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var focusRing = scene.add.graphics();
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 20);
    focusRing.setVisible(false);
    cont.add(focusRing);
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx, focusRing: focusRing, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched) { scene.tweens.add({ targets: cont, scale: 1.03, duration: 120 }); } });
    cont.on("pointerout", function () { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 140, ease: "Quad.easeIn", onComplete: function () {
      card.back.setVisible(!show);
      card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 140, ease: "Quad.easeOut", onComplete: done || function () {} });
    }});
  }

  function setFocus(idx) {
    if (focusIndex >= 0 && cards[focusIndex]) { cards[focusIndex].focusRing.setVisible(false); }
    focusIndex = idx;
    if (cards[focusIndex]) { cards[focusIndex].focusRing.setVisible(true); }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    setFocus(card.index);
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more! \u{1F420}"); updateLive("First card " + card.data.name + ". Pick another."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick;
    firstPick = null;
    lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        streak++;
        var base = 100;
        var bonus = streak > 1 ? (streak - 1) * 20 : 0;
        var gained = base + bonus;
        score += gained;
        hudScore.setText("Score: " + score);
        hudStreak.setText("Streak: " + streak + " \u2728");
        matches++;
        var dot = progressDots[matches - 1];
        if (dot) {
          dot.clear();
          dot.fillStyle(0x4EA8DE, 1);
          dot.fillCircle(0, 0, 8);
          dot.lineStyle(2, 0x102A43, 1);
          dot.strokeCircle(0, 0, 8);
          scene.tweens.add({ targets: dot, scale: { from: 1.4, to: 1 }, duration: 200 });
        }
        var popup = scene.add.text(card.view.x, card.view.y - 60, "+" + gained + (bonus ? " \u2728" : ""), textStyle(22, "#102A43")).setOrigin(0.5).setDepth(5);
        scene.tweens.add({ targets: popup, y: popup.y - 30, alpha: 0, duration: 800, onComplete: function () { popup.destroy(); } });
        for (var i = 0; i < 6; i++) {
          var b = scene.add.graphics();
          b.fillStyle(0xffffff, 0.9);
          b.fillCircle(0, 0, 4);
          b.setPosition(card.view.x, card.view.y);
          b.setDepth(4);
          (function (gfx) {
            scene.tweens.add({ targets: gfx, y: gfx.y - 40 - Math.random() * 20, x: gfx.x + Phaser.Math.Between(-30, 30), alpha: 0, duration: 700, onComplete: function () { gfx.destroy(); } });
          })(b);
        }
        hudMsg.setText(matches === LEVELS[levelIndex].pairs ? "Wave clear! \u{1F389}" : "Great match! \u{1F30A}");
        updateLive("Match! " + card.data.name + " pair found. Score " + score);
        lockBoard = false;
        if (matches === LEVELS[levelIndex].pairs) {
          if (levelIndex < LEVELS.length - 1) {
            setTimeout(function () { showLevelComplete(scene); }, 600);
          } else {
            showWin(scene);
          }
        }
      }, 320);
    } else {
      hudMsg.setText("So close! Try again \u{1F30A}");
      updateLive("Not a match. Keep exploring!");
      setTimeout(function () {
        scene.tweens.add({ targets: [a.view, card.view], x: a.view.x + 4, yoyo: true, duration: 80, repeat: 1 });
        flip(a, false);
        flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45);
    bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1);
    panel.fillRoundedRect(-310, -200, 620, 400, 28);
    panel.lineStyle(5, 0x4EA8DE, 1);
    panel.strokeRoundedRect(-310, -200, 620, 400, 28);
    var title = scene.add.text(0, -130, "\u{1F30A} Ocean Arcade \u{1F420}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -70, "Dive in and find the pairs!\nRide 3 waves of increasing challenge.", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -10, "\u{1F433} \u{1F42C} \u{1F419} \u{1F980} \u{1F422} \u{1F420}", { fontSize: "42px" }).setOrigin(0.5);
    var feat = scene.add.text(0, 40, "No timers \u2022 No penalties \u2022 Just fun!", textStyle(18, "#5A7A9A")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1);
    btnBg.fillRoundedRect(-130, 80, 260, 64, 32);
    var btnTx = scene.add.text(0, 112, "\u25B6  Dive In", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 160, "Use mouse, tap, or keyboard \u2192 Enter", textStyle(16, "#5A7A9A")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, feat, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true;
      lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Find the pairs! \u{1F30A}");
      updateLive("Game started. Wave 1 Coral Reef. Find 6 pairs.");
      if (focusIndex < 0 && cards.length) { setFocus(0); }
    });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) {
        started = true;
        lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Find the pairs! \u{1F30A}");
        updateLive("Game started.");
        if (focusIndex < 0 && cards.length) { setFocus(0); }
      }
    });
  }

  function makeLevelOverlay(scene) {
    levelOverlay = scene.add.container(W / 2, H / 2).setDepth(15).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5);
    bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1);
    panel.fillRoundedRect(-300, -170, 600, 340, 28);
    panel.lineStyle(5, 0x4EA8DE, 1);
    panel.strokeRoundedRect(-300, -170, 600, 340, 28);
    var title = scene.add.text(0, -90, "\u{1F30A} Wave Clear!", textStyle(36)).setOrigin(0.5);
    var detail = scene.add.text(0, -30, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1);
    btnBg.fillRoundedRect(-140, 50, 280, 64, 32);
    var btnTx = scene.add.text(0, 82, "Next Wave \u2192", textStyle(26, "#ffffff")).setOrigin(0.5);
    levelOverlay.add([bg, panel, title, detail, btnBg, btnTx]);
    levelOverlay.detailText = detail;
    levelOverlay.titleText = title;
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 50, 280, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { nextLevel(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5);
    bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1);
    panel.fillRoundedRect(-310, -190, 620, 380, 28);
    panel.lineStyle(5, 0x4EA8DE, 1);
    panel.strokeRoundedRect(-310, -190, 620, 380, 28);
    endTitle = scene.add.text(0, -110, "\u{1F389} Ocean Master! \u{1F389}", textStyle(38)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1);
    btnBg.fillRoundedRect(-140, 60, 280, 64, 32);
    var btnTx = scene.add.text(0, 92, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 60, 280, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showLevelComplete(scene) {
    var lvl = LEVELS[levelIndex];
    levelOverlay.detailText.setText("You found all " + lvl.pairs + " pairs!\nScore: " + score + "  \u2022  Moves: " + moves + "\nReady for " + LEVELS[levelIndex + 1].name + "?");
    levelOverlay.setVisible(true);
    scene.tweens.add({ targets: levelOverlay, scale: { from: 0.9, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Wave clear! \u2728");
    updateLive("Wave " + (levelIndex + 1) + " complete! Score " + score + ". Press Next Wave.");
    for (var i = 0; i < 24; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2728", "\u{1F420}", "\u{1F433}"][i % 4], { fontSize: "24px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1400, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showWin(scene) {
    var stars = moves <= 18 ? 3 : (moves <= 28 ? 2 : 1);
    endDetail.setText("You conquered all 3 waves!\nFinal Score: " + score + "  " + "\u2B50".repeat(stars) + "\nTotal Moves: " + moves);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 280, ease: "Back.easeOut" });
    hudMsg.setText("Ocean Master! \u{1F389}");
    updateLive("You win! Final score " + score + ". You are an Ocean Master!");
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F30A}", "\u2B50", "\u{1F389}", "\u{1F420}"][i % 4], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1300, 2300), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function nextLevel(scene) {
    levelIndex++;
    moves = 0;
    matches = 0;
    firstPick = null;
    lockBoard = false;
    streak = 0;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Score: " + score);
    hudLevel.setText("Wave " + (levelIndex + 1) + " \u2013 " + LEVELS[levelIndex].name);
    hudStreak.setText("Streak: " + streak + " \u2728");
    hudMsg.setText("New wave! Find " + LEVELS[levelIndex].pairs + " pairs!");
    levelOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateLive("Wave " + (levelIndex + 1) + " " + LEVELS[levelIndex].name + ". Find " + LEVELS[levelIndex].pairs + " pairs.");
    if (cards.length) { setFocus(0); }
  }

  function restart(scene) {
    levelIndex = 0;
    moves = 0;
    matches = 0;
    score = 0;
    streak = 0;
    firstPick = null;
    lockBoard = false;
    started = true;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Score: 0");
    hudLevel.setText("Wave 1 \u2013 Coral Reef");
    hudStreak.setText("Streak: 0 \u2728");
    hudMsg.setText("Find the pairs! \u{1F30A}");
    endOverlay.setVisible(false);
    if (levelOverlay) { levelOverlay.setVisible(false); }
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    updateLive("Game restarted. Wave 1 Coral Reef.");
    if (cards.length) { setFocus(0); }
  }

  function updateLive(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown", function (e) {
      if (!started) { return; }
      if (e.key === "Tab") {
        e.preventDefault();
        var dir = e.shiftKey ? -1 : 1;
        var next = focusIndex + dir;
        if (next < 0) { next = cards.length - 1; }
        if (next >= cards.length) { next = 0; }
        setFocus(next);
      } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        e.preventDefault();
        var n = (focusIndex + 1) % cards.length;
        setFocus(n);
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        var p = (focusIndex - 1 + cards.length) % cards.length;
        setFocus(p);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (focusIndex >= 0 && cards[focusIndex]) {
          onCard(scene, cards[focusIndex]);
        }
      } else if (e.key === "r" || e.key === "R") {
        restart(scene);
      }
    });
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.speed;
      b.x += b.drift;
      if (b.y < 150) { b.y = 560; b.x = Phaser.Math.Between(20, 880); }
      if (b.x < 10 || b.x > 890) { b.drift *= -1; }
    }
  }
})();
</script>
