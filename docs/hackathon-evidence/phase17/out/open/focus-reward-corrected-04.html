<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
  }
  #addBtn:hover { filter: brightness(1.06); }
  #addBtn:active { filter: brightness(0.96); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #clearBtn:hover { color: var(--text); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
  }
  .task.completed { opacity: 0.82; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .check:hover { background: var(--accent-soft); }
  .task.completed .check:hover { background: var(--accent); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
  }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
  /* Celebratory enhancements */
  .celebration-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .confetti-piece {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    opacity: 0;
    will-change: transform, opacity;
    animation: confettiFall var(--dur, 900ms) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  .confetti-piece.dot {
    border-radius: 50%;
    width: 8px;
    height: 8px;
  }
  .confetti-piece.ribbon {
    width: 10px;
    height: 14px;
    border-radius: 2px;
  }
  @keyframes confettiFall {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      opacity: 1;
    }
    15% {
      opacity: 1;
    }
    100% {
      transform: translate3d(var(--drift, 0px), var(--fall, 420px), 0) rotate(var(--rot, 720deg)) scale(0.9);
      opacity: 0;
    }
  }
  @keyframes checkPop {
    0% { transform: scale(1); }
    35% { transform: scale(1.35); }
    65% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  @keyframes taskCelebrate {
    0% { transform: scale(1); border-color: var(--border); }
    25% { transform: scale(1.015); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 24px rgba(231,193,124,0.18); }
    100% { transform: scale(1); border-color: var(--border); box-shadow: none; }
  }
  @keyframes burstRing {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
  }
  @keyframes progressPulse {
    0% { box-shadow: 0 0 0 0 rgba(231,193,124,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(231,193,124,0); }
    100% { box-shadow: 0 0 0 0 rgba(231,193,124,0); }
  }
  @keyframes shimmerSweep {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .task.just-completed {
    animation: taskCelebrate 520ms ease;
  }
  .task.just-completed .check {
    animation: checkPop 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .burst-ring {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: 44px;
    height: 44px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0;
    animation: burstRing 520ms ease-out forwards;
  }
  #progressBar.is-complete {
    background: linear-gradient(90deg, var(--accent) 0%, #f5d6a0 50%, var(--accent) 100%);
    background-size: 200% 100%;
    animation: shimmerSweep 1.2s ease infinite, progressPulse 1.6s ease infinite;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 16px) scale(0.96);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 12px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(231,193,124,0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 60;
    white-space: nowrap;
    max-width: calc(100vw - 32px);
    text-align: center;
    transition: opacity 220ms ease, transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .task.just-completed,
    .task.just-completed .check,
    #progressBar.is-complete,
    .confetti-piece,
    .burst-ring,
    .toast {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>
<div id="celebrationLayer" class="celebration-layer" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var celebrationLayer = document.getElementById("celebrationLayer");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  var prevPct = 0;
  var justCompletedId = null;
  var justCompletedTimer = null;
  var celebrationMessages = ["Nice work! \uD83C\uDF89", "Task completed! \u2728", "Keep the momentum! \uD83D\uDD25", "Done and dusted! \u2705", "You're on fire! \u2B50", "Great job! \uD83C\uDF1F"];
  var allDoneMessages = ["All done! Amazing work! \uD83C\uDF89", "Inbox zero! Celebrate! \u2728", "You cleared everything! \uD83C\uDFC6", "Perfect finish! \u2B50"];

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function showToast(message) {
    if (!toastEl) return;
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2200);
  }

  function randomBetween(min, max) {
    return Math.random() * (max - min) + min;
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function createBurstRing(x, y) {
    if (!celebrationLayer || prefersReducedMotion()) return;
    var ring = document.createElement("span");
    ring.className = "burst-ring";
    ring.style.setProperty("--x", x + "px");
    ring.style.setProperty("--y", y + "px");
    celebrationLayer.appendChild(ring);
    setTimeout(function () {
      if (ring.parentNode) ring.parentNode.removeChild(ring);
    }, 600);
  }

  function burstConfettiAt(x, y, count, isGrand) {
    if (!celebrationLayer || prefersReducedMotion()) return;
    var colors = ["#e7c17c", "#f5d6a0", "#f2ede3", "#e08f7e", "#d4a574", "#fff1c9", "#c9a86a"];
    var shapes = ["", "dot", "ribbon"];
    for (var i = 0; i < count; i++) {
      var piece = document.createElement("span");
      var shape = shapes[Math.floor(Math.random() * shapes.length)];
      piece.className = "confetti-piece" + (shape ? " " + shape : "");
      var color = colors[Math.floor(Math.random() * colors.length)];
      var drift = randomBetween(isGrand ? -180 : -90, isGrand ? 180 : 90);
      var fall = randomBetween(isGrand ? 320 : 220, isGrand ? 520 : 380);
      var rot = randomBetween(360, 900) * (Math.random() > 0.5 ? 1 : -1);
      var dur = randomBetween(isGrand ? 900 : 700, isGrand ? 1400 : 1100);
      var delay = randomBetween(0, isGrand ? 120 : 80);
      var startX = x + randomBetween(-8, 8);
      var startY = y + randomBetween(-6, 6);
      piece.style.left = startX + "px";
      piece.style.top = startY + "px";
      piece.style.background = color;
      piece.style.setProperty("--drift", drift + "px");
      piece.style.setProperty("--fall", fall + "px");
      piece.style.setProperty("--rot", rot + "deg");
      piece.style.setProperty("--dur", dur + "ms");
      piece.style.animationDelay = delay + "ms";
      piece.style.animationDuration = dur + "ms";
      if (shape === "ribbon") {
        piece.style.transform = "rotate(" + randomBetween(-30, 30) + "deg)";
      }
      celebrationLayer.appendChild(piece);
      (function (el, d) {
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, d + 600);
      })(piece, dur + delay);
    }
  }

  function celebrateCompletion(sourceRect) {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var isAllDone = total > 0 && done === total;
    var x;
    var y;
    if (sourceRect) {
      x = sourceRect.left + sourceRect.width / 2;
      y = sourceRect.top + sourceRect.height / 2;
    } else {
      x = window.innerWidth / 2;
      y = window.innerHeight * 0.45;
    }
    createBurstRing(x, y);
    if (isAllDone) {
      burstConfettiAt(x, y, 28, true);
      setTimeout(function () { burstConfettiAt(window.innerWidth * 0.25, y - 20, 14, true); }, 80);
      setTimeout(function () { burstConfettiAt(window.innerWidth * 0.75, y - 20, 14, true); }, 140);
      showToast(pickRandom(allDoneMessages));
    } else {
      burstConfettiAt(x, y, 16, false);
      setTimeout(function () { burstConfettiAt(x + randomBetween(-30, 30), y, 6, false); }, 90);
      showToast(pickRandom(celebrationMessages));
    }
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
  }

  function toggleTask(id, sourceRect) {
    var wasCompleted = false;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        wasCompleted = tasks[i].completed;
        tasks[i].completed = !tasks[i].completed;
        break;
      }
    }
    if (!wasCompleted) {
      justCompletedId = id;
      clearTimeout(justCompletedTimer);
      justCompletedTimer = setTimeout(function () {
        justCompletedId = null;
      }, 700);
    } else {
      justCompletedId = null;
    }
    render();
    if (!wasCompleted) {
      celebrateCompletion(sourceRect);
    }
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    if (pct === 100 && total > 0) {
      progressBar.classList.add("is-complete");
    } else {
      progressBar.classList.remove("is-complete");
    }
    prevPct = pct;

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "") + (task.id === justCompletedId ? " just-completed" : "");

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", function () {
        var rect = check.getBoundingClientRect();
        toggleTask(task.id, rect);
      });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
