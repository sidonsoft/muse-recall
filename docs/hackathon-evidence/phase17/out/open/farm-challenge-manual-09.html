<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#e0f2fe;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif;position:relative}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px;outline:none}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.15)}
  .mode-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.94);padding:8px 14px;border-radius:999px;box-shadow:0 4px 16px rgba(16,42,67,.12);z-index:10;font-size:14px;color:#102A43}
  .mode-bar span{font-weight:bold}
  .mode-btn{border:2px solid #4EA8DE;background:#fff;color:#102A43;padding:6px 14px;border-radius:999px;font-weight:bold;cursor:pointer;font-family:inherit;font-size:14px}
  .mode-btn[aria-pressed="true"]{background:#4EA8DE;color:#fff}
  .mode-btn:focus{outline:3px solid #102A43;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="mode-bar" role="group" aria-label="Choose difficulty">
  <span id="modeLabel">Mode:</span>
  <button type="button" id="btnEasy" class="mode-btn" aria-pressed="true" aria-label="Easy mode, 6 pairs, calm play">Easy • 6 pairs</button>
  <button type="button" id="btnHard" class="mode-btn" aria-pressed="false" aria-label="Hard mode, 8 pairs, more to remember, no time limit">Hard • 8 pairs</button>
</div>
<div id="game" tabindex="0" aria-label="Farmyard Memory Match game board"></div>
<div id="liveRegion" aria-live="polite" class="sr-only"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F413}", name: "Rooster" }
  ];
  var W = 900, H = 700;
  var difficulty = "easy";
  function totalPairs() { return difficulty === "hard" ? 8 : 6; }

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#e0f2fe",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay, mainScene;
  var focusedIndex = 0, focusRing, currentCw = 185, currentCh = 140;
  var startEasyBg, startHardBg, startEasyTx, startHardTx, startSub;

  function create() {
    var s = this;
    mainScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    focusRing = s.add.graphics().setDepth(5).setVisible(false);
    updateFocus();
    s.input.keyboard.on("keydown", function (e) {
      if (!startOverlay) return;
      if (startOverlay.visible) {
        if (e.key === "e" || e.key === "E") { setDifficulty("easy", s); updateStartOverlayButtons(s); }
        if (e.key === "h" || e.key === "H") { setDifficulty("hard", s); updateStartOverlayButtons(s); }
        if (e.key === "Enter") {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Tap a card!");
          announce("Game started in " + difficulty + " mode");
          updateFocus();
        }
        return;
      }
      if (e.key === "r" || e.key === "R") { restart(s); return; }
      if (!started) return;
      if (e.key === "ArrowRight") { focusedIndex = (focusedIndex + 1) % cards.length; updateFocus(); announce("Focused " + cards[focusedIndex].data.name); }
      if (e.key === "ArrowLeft") { focusedIndex = (focusedIndex - 1 + cards.length) % cards.length; updateFocus(); announce("Focused " + cards[focusedIndex].data.name); }
      if (e.key === "ArrowUp") { focusedIndex = (focusedIndex - 4 + cards.length) % cards.length; updateFocus(); announce("Focused " + cards[focusedIndex].data.name); }
      if (e.key === "ArrowDown") { focusedIndex = (focusedIndex + 4) % cards.length; updateFocus(); announce("Focused " + cards[focusedIndex].data.name); }
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        var card = cards[focusedIndex];
        if (card && !card.matched && !card.faceUp) { onCard(s, card); }
      }
    });
    var be = document.getElementById("btnEasy");
    var bh = document.getElementById("btnHard");
    if (be) {
      be.addEventListener("click", function () { setDifficulty("easy", mainScene); updateStartOverlayButtons(mainScene); });
      be.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("easy", mainScene); updateStartOverlayButtons(mainScene); } });
    }
    if (bh) {
      bh.addEventListener("click", function () { setDifficulty("hard", mainScene); updateStartOverlayButtons(mainScene); });
      bh.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setDifficulty("hard", mainScene); updateStartOverlayButtons(mainScene); } });
    }
    var gameEl = document.getElementById("game");
    if (gameEl) {
      gameEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && startOverlay && startOverlay.visible) {
          started = true; lockBoard = false;
          startOverlay.setVisible(false);
          hudMsg.setText("Tap a card!");
        }
      });
    }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe0f2fe, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbae6fd, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xfde68a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102A43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    g.lineStyle(8, 0x4EA8DE, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    var cols = [0x4EA8DE, 0x7dd3ce, 0xa5b4fc, 0x38bdf8];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x0e7490, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(20, "#102A43"));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(20, "#102A43"));
    hudMode = scene.add.text(24, 112, "Mode: Easy \u2022 6 pairs", textStyle(16, "#4EA8DE")).setOrigin(0, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(20, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the pairs — no timer, just calm fun!", textStyle(18, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var count = totalPairs();
    var pool = ANIMALS.slice(0, count);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = difficulty === "hard" ? 4 : 3;
    var cw, ch, gx, gy, padX, padY;
    if (difficulty === "hard") {
      cw = 165; ch = 115; gx = 62; gy = 185; padX = 16; padY = 12;
    } else {
      cw = 185; ch = 140; gx = 62; gy = 195; padX = 22; padY = 16;
    }
    currentCw = cw; currentCh = ch;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    focusedIndex = 0;
    updateFocus();
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + totalPairs());
    if (hudMode) hudMode.setText("Mode: " + (difficulty === "hard" ? "Hard \u2022 8 pairs" : "Easy \u2022 6 pairs"));
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "48px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xe0f2fe, 0xbae6fd, 0x7dd3ce, 0xa5d8ff, 0xc4b5fd, 0xfef9c3, 0xd1fae5, 0xfbcfe8];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = difficulty === "hard" ? "52px" : "62px";
    var emo = scene.add.text(0, -14, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, 38, data.name, textStyle(18, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: idx };
    cont.on("pointerdown", function () {
      focusedIndex = idx;
      updateFocus();
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    announce(card.data.name + " revealed");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs());
        hudMsg.setText(matches === totalPairs() ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Pair found! " + matches + " of " + totalPairs());
        lockBoard = false;
        updateFocus();
        if (matches === totalPairs()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("Not a match, try again");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocus(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(36, "#102A43")).setOrigin(0.5);
    startSub = scene.add.text(0, -70, "Flip the cards and find\nall 6 animal pairs!\nTake your time, no rush!", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 10, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    var hint = scene.add.text(0, -10, "Choose your challenge — no timers, no penalties", textStyle(14, "#4EA8DE")).setOrigin(0.5);
    startEasyBg = scene.add.graphics();
    startEasyBg.fillStyle(0x4EA8DE, 1); startEasyBg.fillRoundedRect(-140, 40, 130, 50, 16);
    startEasyBg.lineStyle(3, 0x4EA8DE, 1); startEasyBg.strokeRoundedRect(-140, 40, 130, 50, 16);
    startEasyTx = scene.add.text(-75, 65, "Easy \u2022 6", textStyle(18, "#ffffff")).setOrigin(0.5);
    startHardBg = scene.add.graphics();
    startHardBg.fillStyle(0xffffff, 1); startHardBg.fillRoundedRect(10, 40, 130, 50, 16);
    startHardBg.lineStyle(3, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(10, 40, 130, 50, 16);
    startHardTx = scene.add.text(75, 65, "Hard \u2022 8", textStyle(18, "#102A43")).setOrigin(0.5);
    var easyHit = scene.add.graphics();
    easyHit.fillStyle(0xffffff, 0); easyHit.fillRect(-140, 40, 130, 50);
    var hardHit = scene.add.graphics();
    hardHit.fillStyle(0xffffff, 0); hardHit.fillRect(10, 40, 130, 50);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 110, 260, 60, 30);
    var btnTx = scene.add.text(0, 140, "\u25B6  Start", textStyle(26, "#ffffff")).setOrigin(0.5);
    var keyHint = scene.add.text(0, 185, "Press E for Easy, H for Hard, Enter to start", textStyle(12, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, startSub, hint, row, startEasyBg, startEasyTx, startHardBg, startHardTx, easyHit, hardHit, btnBg, btnTx, keyHint]);
    easyHit.setInteractive(new Phaser.Geom.Rectangle(-140, 40, 130, 50), Phaser.Geom.Rectangle.Contains);
    hardHit.setInteractive(new Phaser.Geom.Rectangle(10, 40, 130, 50), Phaser.Geom.Rectangle.Contains);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 110, 260, 60), Phaser.Geom.Rectangle.Contains);
    easyHit.on("pointerdown", function () { setDifficulty("easy", scene); updateStartOverlayButtons(scene); });
    hardHit.on("pointerdown", function () { setDifficulty("hard", scene); updateStartOverlayButtons(scene); });
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      announce("Game started");
      updateFocus();
    });
    updateStartOverlayButtons(scene);
  }

  function updateStartOverlayButtons(scene) {
    if (!startEasyBg || !startHardBg) return;
    startEasyBg.clear();
    startHardBg.clear();
    if (difficulty === "easy") {
      startEasyBg.fillStyle(0x4EA8DE, 1); startEasyBg.fillRoundedRect(-140, 40, 130, 50, 16);
      startEasyBg.lineStyle(3, 0x4EA8DE, 1); startEasyBg.strokeRoundedRect(-140, 40, 130, 50, 16);
      startEasyTx.setColor("#ffffff");
      startHardBg.fillStyle(0xffffff, 1); startHardBg.fillRoundedRect(10, 40, 130, 50, 16);
      startHardBg.lineStyle(3, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(10, 40, 130, 50, 16);
      startHardTx.setColor("#102A43");
      if (startSub) startSub.setText("Flip the cards and find\nall 6 animal pairs!\nTake your time, no rush!");
    } else {
      startHardBg.fillStyle(0x4EA8DE, 1); startHardBg.fillRoundedRect(10, 40, 130, 50, 16);
      startHardBg.lineStyle(3, 0x4EA8DE, 1); startHardBg.strokeRoundedRect(10, 40, 130, 50, 16);
      startHardTx.setColor("#ffffff");
      startEasyBg.fillStyle(0xffffff, 1); startEasyBg.fillRoundedRect(-140, 40, 130, 50, 16);
      startEasyBg.lineStyle(3, 0x4EA8DE, 1); startEasyBg.strokeRoundedRect(-140, 40, 130, 50, 16);
      startEasyTx.setColor("#102A43");
      if (startSub) startSub.setText("Find all 8 pairs!\nMore to remember, same calm pace.\nNo timer \u2014 take your time!");
    }
  }

  function setDifficulty(mode, scene) {
    difficulty = mode;
    var total = totalPairs();
    if (hudScore) hudScore.setText("Pairs: " + matches + " / " + total);
    if (hudMode) hudMode.setText("Mode: " + (mode === "hard" ? "Hard \u2022 8 pairs" : "Easy \u2022 6 pairs"));
    var be = document.getElementById("btnEasy");
    var bh = document.getElementById("btnHard");
    if (be) be.setAttribute("aria-pressed", mode === "easy" ? "true" : "false");
    if (bh) bh.setAttribute("aria-pressed", mode === "hard" ? "true" : "false");
    if (scene) updateStartOverlayButtons(scene);
    if (scene && cards.length) {
      if (!started || (moves === 0 && matches === 0)) {
        cards.forEach(function (c) { c.view.destroy(); });
        buildBoard(scene);
        focusedIndex = 0;
        updateFocus();
      }
    }
    announce("Mode set to " + (mode === "hard" ? "hard, 8 pairs" : "easy, 6 pairs"));
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(38, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(22, "#102A43"), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var total = totalPairs();
    var modeLine = difficulty === "hard" ? "\nHard mode mastered! \u{1F30A}" : "\nTry Hard mode for 8 pairs next!";
    endDetail.setText("You found all " + total + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + modeLine);
    endTitle.setText(difficulty === "hard" ? "\u{1F389} Ocean Star! \u{1F389}" : "\u{1F389} You Win! \u{1F389}");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Found all " + total + " pairs in " + moves + " moves");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs()); hudMsg.setText("Tap a card!");
    if (hudMode) hudMode.setText("Mode: " + (difficulty === "hard" ? "Hard \u2022 8 pairs" : "Easy \u2022 6 pairs"));
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    focusedIndex = 0;
    updateFocus();
    announce("New game started");
  }

  function updateFocus() {
    if (!focusRing || !cards.length) return;
    if (!started) { focusRing.setVisible(false); return; }
    var c = cards[focusedIndex];
    if (!c) return;
    focusRing.clear();
    focusRing.lineStyle(4, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(-currentCw / 2 - 6, -currentCh / 2 - 6, currentCw + 12, currentCh + 12, 18);
    focusRing.setPosition(c.view.x, c.view.y);
    focusRing.setVisible(true);
  }

  function announce(msg) {
    var el = document.getElementById("liveRegion");
    if (el) el.textContent = msg;
  }

  function update() {}
})();
</script>
</body>
</html>
