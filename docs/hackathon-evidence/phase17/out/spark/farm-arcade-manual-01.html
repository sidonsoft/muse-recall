<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#eaf6fb;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" aria-live="polite" role="status"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, round = 1;
  var hudMoves, hudScore, hudMsg, hudSub, endOverlay, endTitle, endDetail, startOverlay, endBtnTx, soundTx;
  var focusIndex = 0, focusRing = null, soundOn = true, audioCtx = null, liveRegion = null;
  var INK = "#102A43", ACCENT = 0x4EA8DE, ACCENT_DARK = 0x2C7DA0;

  function create() {
    var s = this;
    liveRegion = document.getElementById("live");
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    updateHudRound();
    try { s.game.canvas.setAttribute("tabindex", "0"); } catch (e) {}
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xc9e9f2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn (ocean palette)
    g.fillStyle(ACCENT, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(ACCENT_DARK, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x7fb3d5, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2c7da0, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // gentle rising bubbles (slow drift, constant soft alpha: no flashing)
    for (var b = 0; b < 12; b++) {
      var bx = 20 + Math.random() * (W - 40);
      var by = 200 + Math.random() * 420;
      var br = 4 + Math.random() * 9;
      var bub = scene.add.graphics();
      bub.lineStyle(2, ACCENT_DARK, 0.35);
      bub.strokeCircle(0, 0, br);
      bub.x = bx; bub.y = by; bub.alpha = 0.5;
      scene.tweens.add({ targets: bub, y: by - 120 - Math.random() * 80, duration: 6000 + Math.random() * 4000, repeat: -1, yoyo: true, delay: Math.random() * 4000, ease: "Sine.easeInOut" });
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || INK, fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0   Score: 0", textStyle(22));
    hudScore = scene.add.text(24, 88, "Pairs: 0 / 6   Combo x0", textStyle(22));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(ACCENT, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene, false); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    soundTx = scene.add.text(W - 110, 150, "\u{1F50A} Sound: on (M)", textStyle(16)).setOrigin(0.5);
    soundTx.setInteractive({ useHandCursor: true });
    soundTx.on("pointerdown", function () { toggleSound(scene); });
    hudSub = scene.add.text(W / 2, 172, "Find the 6 animal pairs! Chain combos for bonus!", textStyle(20)).setOrigin(0.5);
    focusRing = scene.add.graphics().setDepth(5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(ACCENT, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd8f3ff, 0xcaf0f8, 0xade8f4, 0xbde0fe, 0xc8e7ff, 0xa2d2ff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { ensureAudio(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    focusIndex = cards.indexOf(card);
    drawFocus();
    flip(card, true);
    playFlip();
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("Card flipped. Pick one more."); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        scene.tweens.add({ targets: [a.view, card.view], y: "-=12", yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 25;
        score += gained;
        hudMoves.setText("Moves: " + moves + "   Score: " + score);
        hudScore.setText("Pairs: " + matches + " / 6   Combo x" + streak);
        playMatch();
        if (matches === 6) {
          hudMsg.setText("You did it!");
          announce("You found all 6 pairs! Score " + score + ".");
          lockBoard = false;
          showWin(scene);
        } else if (streak >= 2) {
          hudMsg.setText("Combo x" + streak + "! +" + gained + " \u{1F389}");
          announce("Combo times " + streak + "! Plus " + gained + " points.");
          lockBoard = false;
          drawFocus();
          if (matches === 2 || matches === 4) { setTimeout(function () { tideShuffle(scene); }, 650); }
        } else {
          hudMsg.setText("Yay! A pair! +" + gained + " \u{1F389}");
          announce("A pair! Plus " + gained + " points. Score " + score + ".");
          lockBoard = false;
          drawFocus();
          if (matches === 2 || matches === 4) { setTimeout(function () { tideShuffle(scene); }, 650); }
        }
      }, 350);
    } else {
      streak = 0;
      hudMoves.setText("Moves: " + moves + "   Score: " + score);
      hudScore.setText("Pairs: " + matches + " / 6   Combo x" + streak);
      hudMsg.setText("Try again! \u{1F340}");
      announce("Not a match. No points lost. Try again!");
      playMismatch();
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 700);
    }
  }

  function tideShuffle(scene) {
    if (!started || matches >= 6) { return; }
    var open = cards.filter(function (c) { return !c.matched; });
    if (open.length <= 2) { return; }
    var pts = open.map(function (c) { return { x: c.view.x, y: c.view.y }; });
    for (var i = pts.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pts[i]; pts[i] = pts[j]; pts[j] = t;
    }
    lockBoard = true;
    hudMsg.setText("Tide Shuffle! Cards drifted! \u{1F33A}");
    announce("Tide shuffle! The remaining cards drifted to new spots. No rush!");
    open.forEach(function (c, k) {
      scene.tweens.add({ targets: c.view, x: pts[k].x, y: pts[k].y, duration: 450, ease: "Sine.easeInOut" });
    });
    setTimeout(function () { lockBoard = false; drawFocus(); }, 520);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -128, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -58, "Flip cards, find pairs, chain COMBOS\nfor bonus points! Gentle tides may\ndrift the cards. No rush, just fun!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 28, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 72, 260, 66, 33);
    var btnTx = scene.add.text(0, 105, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 162, "Mouse/touch: tap a card \u2022 Keys: arrows move, Enter flips, R restarts", textStyle(15)).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 72, 260, 66), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} Tide Cleared! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-140, 48, 280, 68, 34);
    endBtnTx = scene.add.text(0, 82, "\u25B6 Next Tide", textStyle(28, "#ffffff")).setOrigin(0.5);
    var endHint = scene.add.text(0, 132, "Enter: next tide \u2022 R: replay this tide", textStyle(15)).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnTx, endHint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 48, 280, 68), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); nextRound(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endDetail.setText("Tide " + round + " clear! You found all 6 pairs!\nScore: " + score + "  Moves: " + moves + "\nBest combo x" + Math.max(bestStreak, 1) + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Tide " + round + " cleared! \u{1F389}");
    announce("Tide " + round + " cleared! Score " + score + " in " + moves + " moves.");
    playWin();
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1FAA7}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1600, 2600), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false; focusIndex = 0;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    announce("Game started. Tide " + round + ". Find all 6 animal pairs. Use arrow keys and Enter to play with the keyboard.");
    updateHudRound();
    drawFocus();
  }

  function nextRound(scene) {
    restart(scene, true);
  }

  function restart(scene, advance) {
    if (advance) { round++; }
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    firstPick = null; lockBoard = false; started = true; focusIndex = 0;
    hudMoves.setText("Moves: 0   Score: 0"); hudScore.setText("Pairs: 0 / 6   Combo x0"); hudMsg.setText("Tap a card!");
    updateHudRound();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawFocus();
    announce(advance ? ("Tide " + round + " started! Fresh board, combos reset. Have fun!") : ("Board reshuffled. Tide " + round + ". Score reset. Have fun!"));
  }

  function updateHudRound() {
    if (hudSub) { hudSub.setText("Tide " + round + " \u2022 Find the 6 pairs! Chain combos for bonus!"); }
  }

  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started) { return; }
    if ((endOverlay && endOverlay.visible) || (startOverlay && startOverlay.visible)) { return; }
    var c = cards[focusIndex];
    if (!c || c.matched) { return; }
    focusRing.lineStyle(4, 0x102a43, 1);
    focusRing.strokeRoundedRect(c.view.x - c.w / 2 - 6, c.view.y - c.h / 2 - 6, c.w + 12, c.h + 12, 26);
  }

  function toggleSound(scene) {
    soundOn = !soundOn;
    if (soundTx) { soundTx.setText(soundOn ? "\u{1F50A} Sound: on (M)" : "\u{1F508} Sound: off (M)"); }
    announce(soundOn ? "Sound on." : "Sound off.");
  }

  function announce(msg) {
    if (liveRegion) { liveRegion.textContent = msg; }
  }

  function ensureAudio() {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) {}
  }

  function tone(freq, dur, type, vol, when) {
    if (!soundOn) { return; }
    try {
      ensureAudio();
      if (!audioCtx) { return; }
      var t = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function playFlip() { tone(520, 0.12, "sine", 0.07); }
  function playMatch() { tone(523.25, 0.14, "triangle", 0.11); tone(659.25, 0.16, "triangle", 0.11, 0.10); tone(783.99, 0.22, "triangle", 0.11, 0.20); }
  function playMismatch() { tone(330, 0.16, "sine", 0.05); }
  function playWin() { [523, 587, 659, 784, 880].forEach(function (f, i) { tone(f, 0.2, "triangle", 0.11, i * 0.12); }); }

  function setupKeyboard(scene) {
    window.addEventListener("keydown", function (ev) {
      var k = ev.key;
      if (startOverlay && startOverlay.visible) {
        if (k === "Enter" || k === " " || k === "s" || k === "S") { ensureAudio(); startGame(scene); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (k === "Enter" || k === " " || k === "n" || k === "N") { ensureAudio(); nextRound(scene); }
        else if (k === "r" || k === "R") { ensureAudio(); restart(scene, false); }
        else if (k === "m" || k === "M") { toggleSound(scene); }
        return;
      }
      if (!started) { return; }
      var cols = 4;
      if (k === "ArrowRight") { focusIndex = (focusIndex + 1) % cards.length; drawFocus(); }
      else if (k === "ArrowLeft") { focusIndex = (focusIndex + cards.length - 1) % cards.length; drawFocus(); }
      else if (k === "ArrowDown") { focusIndex = (focusIndex + cols) % cards.length; drawFocus(); }
      else if (k === "ArrowUp") { focusIndex = (focusIndex + cards.length - cols) % cards.length; drawFocus(); }
      else if (k === "Enter" || k === " ") { var c = cards[focusIndex]; if (c) { ensureAudio(); onCard(scene, c); } }
      else if (k === "r" || k === "R") { ensureAudio(); restart(scene, false); }
      else if (k === "m" || k === "M") { toggleSound(scene); }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
