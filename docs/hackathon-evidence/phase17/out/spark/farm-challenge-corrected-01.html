<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var mode = "easy", totalPairs = 6, timeLeft = 0, gameOver = false;
  var focusIdx = 0, focusRing = null;
  var hudMoves, hudScore, hudMsg, hudTimer, hudSub, endOverlay, endTitle, endDetail, startOverlay, endMenuBg;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeys(s);
    labelCanvas(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudTimer = scene.add.text(24, 122, "", textStyle(24, "#4EA8DE"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#4a6b8a")).setOrigin(0.5);
  }

  var HARD_ANIMALS = [
    { emoji: "🐐", name: "Goat" },
    { emoji: "🐰", name: "Rabbit" }
  ];

  function fullAnimalSet() {
    if (mode === "hard") { return ANIMALS.concat(HARD_ANIMALS); }
    return ANIMALS;
  }

  function shuffledDeck() {
    var deck = [];
    fullAnimalSet().forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards = [];
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    var deck = shuffledDeck();
    var cols = 4;
    var hard = (mode === "hard");
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    if (hard) { cw = 185; ch = 108; gy = 192; padY = 12; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIdx = 0;
    drawFocus(scene);
  }

  function drawFocus(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length || !started || gameOver) { return; }
    var target = cards[Math.min(focusIdx, cards.length - 1)];
    if (!target) { return; }
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(4, 0x4ea8de, 1);
    var w = target.view.width + 10, h = target.view.height + 10;
    focusRing.strokeRoundedRect(target.view.x - w / 2, target.view.y - h / 2, w, h, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var small = h < 120;
    var emo = scene.add.text(0, small ? -16 : -18, data.emoji, { fontSize: small ? "46px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, small ? 32 : 44, data.name, textStyle(small ? 19 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { focusIdx = cards.indexOf(card); drawFocus(scene); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function startGame(scene, nextMode) {
    if (nextMode) { mode = nextMode; }
    totalPairs = (mode === "hard") ? 8 : 6;
    moves = 0; matches = 0; firstPick = null; gameOver = false;
    lockBoard = false; started = true; focusIdx = 0;
    timeLeft = (mode === "hard") ? 90 : 0;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / " + totalPairs);
    hudMsg.setText(mode === "hard" ? "Hard: 8 pairs, 90 seconds!" : "Tap a card!");
    hudTimer.setText(mode === "hard" ? "Time: 90" : "");
    hudSub.setText(mode === "hard" ? "Hard: find all 8 pairs in 90 seconds!" : "Find the 6 animal pairs!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawFocus(scene);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -52, "Easy: 6 pairs, relaxed. Hard: 8 pairs, 90 sec.\nPress E for Easy, H for Hard!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x4ea8de, 1); easyBg.fillRoundedRect(-275, 70, 255, 64, 32);
    var easyTx = scene.add.text(-147, 102, "Easy", textStyle(28, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x102a43, 1); hardBg.fillRoundedRect(20, 70, 255, 64, 32);
    var hardTx = scene.add.text(147, 102, "Hard", textStyle(28, "#ffffff")).setOrigin(0.5);
    easyTx.setName("easyBtn"); hardTx.setName("hardBtn");
    var btnTx = null; //"\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, easyBg, easyTx, hardBg, hardTx]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-275, 70, 255, 64), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 70, 255, 64), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { startGame(scene, "easy"); });
    hardBg.on("pointerdown", function () { startGame(scene, "hard"); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    endMenuBg = scene.add.graphics();
    endMenuBg.fillStyle(0x102a43, 1); endMenuBg.fillRoundedRect(-130, 122, 260, 40, 20);
    var menuTx = scene.add.text(0, 142, "Change mode", textStyle(22, "#ffffff")).setOrigin(0.5);
    endOverlay.add([endMenuBg, menuTx]);
    endMenuBg.setInteractive(new Phaser.Geom.Rectangle(-130, 122, 260, 40), Phaser.Geom.Rectangle.Contains);
    endMenuBg.on("pointerdown", function () { showMenu(scene); });
  }

  function showWin(scene) {
    var stars = mode === "hard"
      ? (moves <= 14 ? 3 : (moves <= 22 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    endTitle.setText("🎉 You Win! 🎉");
    endDetail.setText("You found all " + totalPairs + " pairs!" + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    gameOver = true;
    if (mode === "hard") { hudTimer.setText("Time left: " + Math.ceil(timeLeft)); }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    gameOver = true; lockBoard = true; firstPick = null;
    endTitle.setText("Time's Up!");
    endDetail.setText("You found " + matches + " of " + totalPairs + " pairs.\nTry Hard mode again!");
    hudTimer.setText("Time: 0");
    hudMsg.setText("Time's up! Try again!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
  }

  function showMenu(scene) {
    gameOver = false; started = false; lockBoard = true; firstPick = null;
    endOverlay.setVisible(false);
    startOverlay.setVisible(true);
  }

  function restart(scene) {
    startGame(scene);
  }

  function setupKeys(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-E", function () { if (startOverlay.visible) { startGame(scene, "easy"); } });
    kb.on("keydown-H", function () { if (startOverlay.visible) { startGame(scene, "hard"); } });
    kb.on("keydown-R", function () { restart(scene); });
    kb.on("keydown-M", function () { if (started) { showMenu(scene); } });
    kb.on("keydown-LEFT", function () { moveFocus(scene, -1); });
    kb.on("keydown-RIGHT", function () { moveFocus(scene, 1); });
    kb.on("keydown-UP", function () { moveFocus(scene, -4); });
    kb.on("keydown-DOWN", function () { moveFocus(scene, 4); });
    kb.on("keydown-ENTER", function () { pressFocused(scene); });
    kb.on("keydown-SPACE", function () { pressFocused(scene); });
  }

  function moveFocus(scene, step) {
    if (!started || gameOver || !cards.length) { return; }
    focusIdx = (focusIdx + step + cards.length * 4) % cards.length;
    drawFocus(scene);
  }

  function pressFocused(scene) {
    if (startOverlay.visible) { startGame(scene, "easy"); return; }
    if (endOverlay.visible) { restart(scene); return; }
    var card = cards[focusIdx];
    if (card) { onCard(scene, card); }
  }

  function labelCanvas(scene) {
    var cv = scene.game.canvas;
    if (!cv) { return; }
    cv.setAttribute("tabindex", "0");
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", "Farmyard Match memory game. Easy mode has 6 pairs. Hard mode has 8 pairs and a 90 second timer. Use arrow keys to move, Enter to flip a card, E for easy, H for hard, R to restart.");
  }

  function update(time, delta) {
    if (!started || gameOver || mode !== "hard") { return; }
    if (matches === totalPairs) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      showLose(this);
      return;
    }
    hudTimer.setText("Time: " + Math.ceil(timeLeft));
  }
})();
</script>
</body>
</html>
