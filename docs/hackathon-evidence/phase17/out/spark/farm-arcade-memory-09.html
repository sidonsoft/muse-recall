<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d4ebf7;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #live{position:absolute;left:12px;bottom:10px;max-width:640px;font-size:13px;color:#102A43;background:rgba(255,255,255,.85);border-radius:10px;padding:6px 10px}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard memory match game. Use arrow keys to move between cards and Enter to flip a card."></div>
<div id="live" aria-live="polite">Welcome to Farmyard Match. Press Start, then flip cards to find pairs.</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#d4ebf7",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, level = 1, focusIdx = 0;
  var hudMoves, hudScore, hudPts, hudMsg, hudLevel, endOverlay, endTitle, endDetail, endBtnTx, startOverlay;
  var bubbles = [], focusRing = null;

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }
  function peekDelay() { return Math.max(420, 720 - (level - 1) * 60); }
  function levelBonus() { return (level - 1) * 50; }

  function create() {
    var s = this;
    drawFarm(s);
    makeBubbles(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    bindKeys(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // Cool ocean backdrop: sky water gradient bands + sandy floor detail kept calm (no flashing).
    g.fillStyle(0xd4ebf7, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, 200);
    g.fillStyle(0xbfe3f2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x9fd4e8, 1);
    for (var w = 0; w < 4; w++) {
      g.fillEllipse(120 + w * 220, 486 + (w % 2) * 8, 220, 22);
    }
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn (kept, cooled slightly)
    g.fillStyle(0xd97a6c, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xa84a44, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence over the water-meadow line
    g.lineStyle(8, 0x7fb6cc, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // shells / pebbles instead of bright flowers (calm ocean floor)
    var cols = [0xffffff, 0xcaf0f8, 0xade8f4, 0x90e0ef];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x4EA8DE, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0x4EA8DE, 1); g.fillCircle(fx, fy - 8, 3);
    }
  }

  function makeBubbles(scene) {
    bubbles = [];
    for (var i = 0; i < 16; i++) {
      var bx = Math.random() * W, by = Math.random() * H;
      var br = 4 + Math.random() * 10;
      var c = scene.add.circle(bx, by, br).setStrokeStyle(2, 0x4EA8DE, 0.45).setFillStyle(0xffffff, 0.18).setDepth(-1);
      c.setData("speed", 8 + Math.random() * 18);
      c.setData("drift", Math.random() * Math.PI * 2);
      bubbles.push(c);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 74, "Pairs: 0 / 6", textStyle(20));
    hudPts = scene.add.text(24, 98, "Score: 0", textStyle(20));
    hudMsg = scene.add.text(W - 24, 56, "Tap a card!", textStyle(20, "#33475b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 110);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -24, 172, 48, 24);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -24, 172, 48), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene, { fresh: true }); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudLevel = scene.add.text(W / 2, 164, "Tide 1 \u2022 Find the 6 animal pairs! \u2022 Streak bonus, no points lost", textStyle(18, "#33475b")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c && c.view) { c.view.destroy(); } });
    cards = [];
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd4f0fc, 0xcaf0f8, 0xbde0fe, 0xa2d2ff, 0xcdeac0, 0xe0fbfc];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function splashRing(scene, x, y) {
    // Single slow-expanding ring: celebratory but calm, never flashing.
    var r = scene.add.circle(x, y, 12).setStrokeStyle(5, 0x4EA8DE, 0.8).setDepth(5);
    scene.tweens.add({ targets: r, radius: 70, alpha: 0, duration: 650, ease: "Cubic.easeOut",
      onComplete: function () { r.destroy(); } });
  }
  function floatPoints(scene, x, y, label) {
    var t = scene.add.text(x, y - 60, label, textStyle(26, "#102A43")).setOrigin(0.5).setDepth(6);
    scene.tweens.add({ targets: t, y: y - 110, alpha: 0, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { t.destroy(); } });
  }
  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) {
      firstPick = card;
      hudMsg.setText("One more!");
      announce("First card: " + card.data.name + ". Pick one more.");
      return;
    }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        splashRing(scene, card.view.x, card.view.y);
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var pts = 100 + (streak - 1) * 25 + levelBonus();
        score += pts;
        floatPoints(scene, card.view.x, card.view.y, "+" + pts);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPts.setText("Score: " + score);
        if (matches === 6) {
          hudMsg.setText("You did it! Tide " + level + " clear!");
        } else if (streak >= 2) {
          hudMsg.setText("Splash Streak x" + streak + "! +" + pts + " \u{1F30A}");
        } else {
          hudMsg.setText("Yay! A pair! +" + pts + " \u{1F389}");
        }
        announce("Pair found: " + card.data.name + ". " + matches + " of 6 pairs. Score " + score + ". Streak " + streak + ". No points are ever lost for trying.");
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      // Kind mismatch: streak restarts, but score is kept — trying is never punished.
      streak = 0;
      hudMsg.setText("Nice try! No points lost \u{1F340}");
      announce("Those were " + a.data.name + " and " + card.data.name + ". Nice try, no points lost.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, peekDelay());
    }
  }

  function startGame(scene) {
    if (started && startOverlay && !startOverlay.visible) { return; }
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Tap a card! Arrows + Enter work too.");
    announce("Tide " + level + " started. Find all 6 pairs. Score " + score + ". Use arrow keys and Enter, or tap a card.");
    drawFocus(scene);
  }
  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var hype = scene.add.text(0, 2, "Arcade tides! Score + Splash Streaks!", textStyle(19, "#4EA8DE")).setOrigin(0.5);
    var row = scene.add.text(0, 42, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 88, 260, 66, 33);
    var btnTx = scene.add.text(0, 121, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, hype, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 88, 260, 66), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-150, 50, 300, 70, 35);
    endBtnTx = scene.add.text(0, 85, "\u21BB Next Tide", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-150, 50, 300, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene, { next: true }); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    // Stars celebrate efficiency; fewer moves never takes anything away.
    endTitle.setText("\u{1F30A} Tide " + level + " Clear! \u{1F389}");
    endDetail.setText("All 6 pairs found!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  \u2022  Best streak: x" + Math.max(bestStreak, 1) + "\nNext tide peeks back a little faster!");
    if (endBtnTx) { endBtnTx.setText("\u21BB Next Tide (Tide " + (level + 1) + ")"); }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Tide " + level + " clear! \u{1F389}");
    announce("Tide " + level + " clear. Score " + score + ", best streak " + bestStreak + ". Press Enter for the next tide.");
    for (var i = 0; i < 32; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F30A}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1400, 2400), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPts.setText("Score: " + score);
    if (hudLevel) { hudLevel.setText("Tide " + level + " \u2022 Find the 6 animal pairs! \u2022 Streak bonus, no points lost"); }
  }

  function restart(scene, opts) {
    opts = opts || {};
    if (opts.next) {
      level++;
      moves = 0; matches = 0; firstPick = null; streak = 0; focusIdx = 0;
      lockBoard = false; started = true;
    } else if (opts.fresh) {
      level = 1; score = 0; bestStreak = 0;
      moves = 0; matches = 0; firstPick = null; streak = 0; focusIdx = 0;
      lockBoard = false; started = true;
    } else {
      moves = 0; matches = 0; firstPick = null; streak = 0; focusIdx = 0;
      lockBoard = false; started = true;
    }
    refreshHud();
    hudMsg.setText("Tide " + level + ": tap a card!");
    announce("Tide " + level + " started. Score " + score + ". Find all 6 pairs. Trying never loses points.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    drawFocus(scene);
  }

  function drawFocus(scene) {
    if (!scene) { return; }
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!started || !cards.length) { return; }
    var idx = Math.max(0, Math.min(focusIdx, cards.length - 1));
    focusIdx = idx;
    var target = cards[idx];
    focusRing = scene.add.graphics().setDepth(7);
    focusRing.lineStyle(5, 0x102A43, 1);
    focusRing.strokeRoundedRect(target.view.x - 99, target.view.y - 74, 198, 148, 24);
    focusRing.lineStyle(2, 0xffffff, 1);
    focusRing.strokeRoundedRect(target.view.x - 94, target.view.y - 69, 188, 138, 20);
  }

  function moveFocus(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var next = focusIdx + dx + dy * cols;
    if (next < 0) { next = 0; }
    if (next > cards.length - 1) { next = cards.length - 1; }
    focusIdx = next;
    drawFocus(scene);
    var c = cards[focusIdx];
    if (c) { announce("Focused card " + (focusIdx + 1) + " of " + cards.length + (c.matched ? ", already paired " + c.data.name + "." : ".")); }
  }

  function pressFocused(scene) {
    if (!started) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene, { next: true }); return; }
    var c = cards[focusIdx];
    if (c) { onCard(scene, c); }
  }

  function bindKeys(scene) {
    // Explicit keydown handling (no form submission): arrows move, Enter/Space flips, R restarts.
    document.addEventListener("keydown", function (ev) {
      var key = ev.key;
      if (key === "ArrowLeft") { moveFocus(scene, -1, 0); }
      else if (key === "ArrowRight") { moveFocus(scene, 1, 0); }
      else if (key === "ArrowUp") { moveFocus(scene, 0, -1); }
      else if (key === "ArrowDown") { moveFocus(scene, 0, 1); }
      else if (key === "Enter" || key === " ") {
        ev.preventDefault();
        pressFocused(scene);
      }
      else if (key === "r" || key === "R") { restart(scene, { fresh: true }); }
    });
    // Mouse users get a focus ring too: clicking a card moves keyboard focus there.
    scene.input.on("pointerdown", function (pointer) {
      var best = -1, bestD = 1e9;
      cards.forEach(function (c, i) {
        var d = Math.abs(c.view.x - pointer.x) + Math.abs(c.view.y - pointer.y);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best >= 0) { focusIdx = best; drawFocus(scene); }
    });
  }

  function update(time, delta) {
    var dt = Math.min((delta || 16) / 1000, 0.05);
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      if (!b || !b.active) { continue; }
      var sp = b.getData("speed") || 12;
      var dr = (b.getData("drift") || 0) + dt * 0.6;
      b.setData("drift", dr);
      b.y -= sp * dt;
      b.x += Math.sin(dr) * 12 * dt;
      if (b.y < -30) {
        b.y = H + 24;
        b.x = Math.random() * W;
      }
    }
  }
})();
</script>
</body>
</html>
