<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b2c42;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Verdana,sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#d9eefb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, combo = 0, bestCombo = 0;
  var timeLeft = 60, maxTime = 60, lastTick = 0, gameOver = false;
  var hudMoves, hudScore, hudMsg, hudScorePts, hudTime, hudCombo, timerBar, timerBarBg;
  var endOverlay, endTitle, endDetail, startOverlay;
  var focusIdx = 0, focusRing = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // cool ocean backdrop: pale surface up top, deep teal "floor" below
    g.fillStyle(0xd9eefb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xb6ddf2, 1); g.fillRect(0, 0, W, 190);
    g.fillStyle(0x4ea8de, 0.25); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x2a7ca8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 110, 150, 40); g.fillEllipse(240, 100, 120, 36);
    g.fillEllipse(560, 80, 140, 36);
    // sun-bleached buoy hut instead of barn (keeps the skyline anchor)
    g.fillStyle(0x48a9d6, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x1d6a93, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xeaf7ff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xeaf7ff, 1);
    g.lineBetween(80, 330, 230, 330);
    // pier rails instead of fence
    g.lineStyle(8, 0x7fb8d9, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // bubbles + sea flowers along the floor
    var cols = [0xcaf0f8, 0x90e0ef, 0x4ea8de, 0xbde0fe];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x1d6a93, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx - 3, fy - 11, 3);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Segoe UI",Verdana,sans-serif', fontSize: size + "px", color: color || "#102a43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match: Arcade Rush", textStyle(30)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(21));
    hudScore = scene.add.text(24, 76, "Pairs: 0 / 6", textStyle(21));
    hudScorePts = scene.add.text(24, 102, "Score: 0", textStyle(21));
    hudCombo = scene.add.text(24, 128, "", textStyle(20, "#1d6a93"));
    hudMsg = scene.add.text(W - 24, 44, "Tap a card!", textStyle(22, "#1d6a93")).setOrigin(1, 0.5);
    hudTime = scene.add.text(W - 24, 72, "Time: 60", textStyle(24)).setOrigin(1, 0.5);
    timerBarBg = scene.add.graphics();
    timerBarBg.fillStyle(0x102a43, 0.18); timerBarBg.fillRoundedRect(W - 224, 92, 200, 12, 6);
    timerBar = scene.add.graphics();
    drawTimerBar();
    var btn = scene.add.container(W - 110, 128);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart (R)", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
    scene.add.text(W / 2, 168, "60s on the clock: pairs +4s, misses -2s!", textStyle(20, "#1d6a93")).setOrigin(0.5);
    focusRing = scene.add.graphics().setDepth(5);
  }
  function drawTimerBar() {
    if (!timerBar) { return; }
    timerBar.clear();
    var frac = Math.max(0, timeLeft / maxTime);
    var col = frac > 0.5 ? 0x4ea8de : (frac > 0.25 ? 0xffb703 : 0xef476f);
    timerBar.fillStyle(col, 1);
    timerBar.fillRoundedRect(W - 224, 92, Math.max(8, 200 * frac), 12, 6);
    if (hudTime) { hudTime.setText("Time: " + Math.ceil(timeLeft)); }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0x48cae4, 0xbde0fe, 0xa2d2ff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    var myIdx = cards.length;
    cont.on("pointerdown", function () { focusIdx = myIdx; onCard(scene, card); });
    cont.on("pointerover", function () { focusIdx = myIdx; drawFocus(); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function scorePopup(scene, x, y, txt, color) {
    var p = scene.add.text(x, y, txt, textStyle(26, color || "#102a43")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: p, y: y - 60, alpha: 0, duration: 900, ease: "Cubic.easeOut",
      onComplete: function () { p.destroy(); } });
  }
  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); drawFocus(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (gameOver) { return; }
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        matches++;
        combo++;
        if (combo > bestCombo) { bestCombo = combo; }
        var pts = 100 + (combo - 1) * 40 + Math.ceil(timeLeft / 10) * 5;
        score += pts;
        timeLeft = Math.min(maxTime, timeLeft + 4);
        hudScore.setText("Pairs: " + matches + " / 6");
        hudScorePts.setText("Score: " + score);
        hudCombo.setText(combo > 1 ? "Combo x" + combo + " \u{1F525}" : "");
        hudMsg.setText(matches === 6 ? "Full clear!" : ("+" + pts + "! \u{1F389}"));
        scorePopup(scene, card.view.x, card.view.y - 60, "+" + pts, "#1d6a93");
        drawTimerBar(); drawFocus();
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      hudCombo.setText("");
      timeLeft = Math.max(0, timeLeft - 2);
      drawTimerBar();
      hudMsg.setText("Miss! -2s \u{1F340}");
      scene.cameras.main.shake(120, 0.004);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 650);
    }
  }

  function startGame(scene) {
    if (started && startOverlay && !startOverlay.visible) { return; }
    started = true; lockBoard = false; gameOver = false; lastTick = 0;
    timeLeft = maxTime;
    drawTimerBar();
    startOverlay.setVisible(false);
    hudMsg.setText("Go! Chain pairs for combos!");
    drawFocus();
  }
  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102a43, 0.55); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -195, 600, 390, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -195, 600, 390, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var tag = scene.add.text(0, -88, "ARCADE RUSH \u26A1 60 seconds", textStyle(22, "#1d6a93")).setOrigin(0.5);
    var sub = scene.add.text(0, -30, "Clear all 6 pairs before the clock dies.\nPairs +4s \u2022 misses -2s \u2022 streaks boost score.", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 52, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 92, 260, 70, 35);
    var btnTx = scene.add.text(0, 127, "\u25B6  Start (Enter)", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, tag, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 92, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) { startGame(scene); }
      else if (endOverlay.visible) { restart(scene); }
      else if (started && !gameOver) { onCard(scene, cards[focusIdx]); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay.visible) { startGame(scene); }
      else if (endOverlay.visible) { restart(scene); }
      else if (started && !gameOver) { onCard(scene, cards[focusIdx]); }
    });
    scene.input.keyboard.on("keydown-LEFT", function () { moveFocus(-1, 0); });
    scene.input.keyboard.on("keydown-RIGHT", function () { moveFocus(1, 0); });
    scene.input.keyboard.on("keydown-UP", function () { moveFocus(0, -1); });
    scene.input.keyboard.on("keydown-DOWN", function () { moveFocus(0, 1); });
  }
  function moveFocus(dx, dy) {
    if (!started || gameOver) { return; }
    if (startOverlay.visible || endOverlay.visible) { return; }
    var cols = 4;
    var r = Math.floor(focusIdx / cols), c = focusIdx % cols;
    c = Math.min(cols - 1, Math.max(0, c + dx));
    r = Math.min(2, Math.max(0, r + dy));
    focusIdx = r * cols + c;
    drawFocus();
  }
  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || gameOver) { return; }
    if (startOverlay.visible || endOverlay.visible) { return; }
    var card = cards[focusIdx];
    if (!card || card.matched) { return; }
    var w = 185, h = 140;
    focusRing.lineStyle(5, 0x102a43, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 26);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102a43, 0.6); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -25, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 60, 260, 70, 35);
    var btnTx = scene.add.text(0, 95, "\u21BB Play Again (Enter)", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 60, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function rankFor(s) {
    if (s >= 900) { return "S \u{1F3C6}"; }
    if (s >= 750) { return "A \u26A1"; }
    if (s >= 600) { return "B"; }
    return "C";
  }

  function showWin(scene) {
    gameOver = true; lockBoard = true;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var timeBonus = Math.ceil(timeLeft) * 10;
    score += timeBonus;
    hudScorePts.setText("Score: " + score);
    endTitle.setText("\u{1F389} Full Clear! \u{1F389}");
    endDetail.setText("All 6 pairs cleared!\nScore: " + score + " (time bonus +" + timeBonus + ", rank " + rankFor(score) + ")\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "  Best combo x" + Math.max(1, bestCombo));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Full clear! Rank " + rankFor(score));
    if (focusRing) { focusRing.clear(); }
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u26A1"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    gameOver = true; lockBoard = true;
    endTitle.setText("\u23F1 Time Up!");
    endDetail.setText("The clock beat you at " + matches + " / 6 pairs.\nScore: " + score + "  Best combo x" + Math.max(0, bestCombo) + "\nTip: chain pairs without misses for combos.");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time up! Hit Restart!");
    if (focusRing) { focusRing.clear(); }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeLeft = maxTime; focusIdx = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudScorePts.setText("Score: 0"); hudCombo.setText("");
    hudMsg.setText("Go! Chain pairs for combos!");
    drawTimerBar();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawFocus();
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay.visible || endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 10 && timeLeft > 0) {
      var s = this;
      if (Math.floor(timeLeft * 4) !== Math.floor((timeLeft + delta / 1000) * 4)) {
        s.tweens.add({ targets: hudTime, scale: { from: 1.25, to: 1 }, duration: 120 });
      }
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      drawTimerBar();
      showLose(this);
      return;
    }
    drawTimerBar();
  }
})();
</script>
</body>
</html>
