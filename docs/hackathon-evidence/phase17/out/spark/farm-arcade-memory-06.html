<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#eaf6fb;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard memory match card game"></div>
<div id="status" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, best = 0, level = 1, streak = 0;
  var focusIdx = 0, focusRing = null;
  var hudMoves, hudScore, hudPoints, hudWave, hudMsg, endOverlay, endTitle, endDetail, startOverlay, nextBtnBg, replayBtnBg;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    drawFocus(s);
    startBubbles(s);
    setupKeyboard(s);
    var cv = s.game.canvas;
    if (cv) {
      cv.setAttribute("tabindex", "0");
      cv.setAttribute("role", "application");
      cv.setAttribute("aria-label", "Farmyard memory match. Use arrow keys to choose a card and Enter to flip it. Press R to restart.");
    }
    announce("Farmyard Match loaded. Press Enter to start.");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcaf0f8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x90e0ef, 0.55); g.fillRect(0, 470, W, 14);
    g.lineStyle(4, 0x4ea8de, 0.7);
    g.strokeEllipse(450, 477, 900, 26);
    g.fillStyle(0xffffff, 1);
    g.fillCircle(770, 110, 55);
    g.fillStyle(0x90e0ef, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(758, 98, 12);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn in ocean palette
    g.fillStyle(0x4ea8de, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x1d6a96, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xeaf6fb, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xeaf6fb, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x1d6a96, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers in cool tones
    var cols = [0x90e0ef, 0x48cae4, 0xade8f4, 0xbde0fe];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x1d6a96, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102a43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 12, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 54, "Moves: 0", textStyle(21));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(21));
    hudPoints = scene.add.text(24, 110, "Score: 0", textStyle(21));
    hudWave = scene.add.text(W / 2, 168, "Wave 1 \u2022 Find the 6 animal pairs!", textStyle(22, "#1d6a96")).setOrigin(0.5);
    hudMsg = scene.add.text(W - 24, 56, "Tap a card!", textStyle(24, "#1d6a96")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 114);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0x90e0ef, 0xade8f4, 0xbde0fe, 0xe0fbfc, 0xc8e7ff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, cx: x, cy: y, cw: w, ch: h };
    cont.on("pointerdown", function () { focusIdx = cards.indexOf(card); drawFocus(scene); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("One card up. Pick one more."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      streak++;
      var gained = 100 + (streak - 1) * 25;
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        score += gained;
        if (score > best) { best = score; }
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPoints.setText("Score: " + score);
        popPoints(scene, card.cx, card.cy - 70, "+" + gained);
        if (streak >= 2 && matches < 6) { bubbleBurst(scene, card.cx, card.cy); }
        hudMsg.setText(matches === 6 ? "You did it!" : (streak >= 2 ? "Combo x" + streak + "! Splash-tastic! \u{1F389}" : "Yay! A pair! \u{1F389}"));
        announce(streak >= 2 ? "Combo times " + streak + ". Plus " + gained + " points. " + matches + " of 6 pairs." : "A pair. Plus " + gained + " points. " + matches + " of 6 pairs.");
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      hudMsg.setText("So close \u2014 try again! \u{1FAB2}");
      announce("So close, try again. No points lost.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -45, "Flip the cards and find all 6 pairs!\nScore points, build a combo, clear wave after wave!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "42px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      announce("Wave 1. Tap a card, or use arrow keys and Enter.");
      drawFocus(scene);
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -195, 620, 390, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-310, -195, 620, 390, 30);
    endTitle = scene.add.text(0, -125, "\u{1F389} Wave Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    nextBtnBg = scene.add.graphics();
    nextBtnBg.fillStyle(0x4ea8de, 1); nextBtnBg.fillRoundedRect(-275, 70, 260, 66, 33);
    var nextTx = scene.add.text(-145, 103, "\u25B6 Next Wave", textStyle(25, "#ffffff")).setOrigin(0.5);
    replayBtnBg = scene.add.graphics();
    replayBtnBg.fillStyle(0xffffff, 1); replayBtnBg.fillRoundedRect(15, 70, 260, 66, 33);
    replayBtnBg.lineStyle(4, 0x4ea8de, 1); replayBtnBg.strokeRoundedRect(15, 70, 260, 66, 33);
    var replayTx = scene.add.text(145, 103, "\u21BB Replay", textStyle(25, "#102a43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, nextBtnBg, nextTx, replayBtnBg, replayTx]);
    nextBtnBg.setInteractive(new Phaser.Geom.Rectangle(-275, 70, 260, 66), Phaser.Geom.Rectangle.Contains);
    nextBtnBg.on("pointerdown", function () { nextWave(scene); });
    replayBtnBg.setInteractive(new Phaser.Geom.Rectangle(15, 70, 260, 66), Phaser.Geom.Rectangle.Contains);
    replayBtnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var bonus = 200 + level * 50;
    score += bonus;
    if (score > best) { best = score; }
    hudPoints.setText("Score: " + score);
    endTitle.setText("\u{1F389} Wave " + level + " Clear! \u{1F389}");
    endDetail.setText("All 6 pairs found! Wave bonus +" + bonus + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  \u2022  Best: " + best);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Wave " + level + " clear! \u{1F389}");
    announce("Wave " + level + " clear. Score " + score + ". Best " + best + ". Press Enter for the next wave.");
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1FAB2}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F41A}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1600, 2800), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; level = 1; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudPoints.setText("Score: 0");
    hudWave.setText("Wave 1 \u2022 Find the 6 animal pairs!");
    hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    drawFocus(scene);
    announce("Fresh start. Wave 1. Score zero.");
  }

  function nextWave(scene) {
    level++;
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudWave.setText("Wave " + level + " \u2022 Find the 6 animal pairs!");
    hudMsg.setText("Wave " + level + " \u2014 tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    drawFocus(scene);
    announce("Wave " + level + ". Score carries on at " + score + ".");
  }

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function popPoints(scene, x, y, label) {
    var t = scene.add.text(x, y, label, textStyle(28, "#1d6a96")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 46, alpha: 0.2, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function bubbleBurst(scene, x, y) {
    for (var i = 0; i < 6; i++) {
      var b = scene.add.text(x + Phaser.Math.Between(-50, 50), y + Phaser.Math.Between(-20, 20), "\u{1FAB2}", { fontSize: "22px" }).setDepth(15).setAlpha(0.9);
      scene.tweens.add({ targets: b, y: y - Phaser.Math.Between(90, 150), alpha: 0.1, duration: Phaser.Math.Between(800, 1200), ease: "Sine.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(b) });
    }
  }

  function startBubbles(scene) {
    scene.time.addEvent({ delay: 1600, loop: true, callback: function () {
      if (!started) { return; }
      var b = scene.add.text(Phaser.Math.Between(20, W - 20), H + 20, "\u{1FAB2}", { fontSize: "18px" }).setAlpha(0.45).setDepth(1);
      scene.tweens.add({ targets: b, y: 180, duration: 6000, onComplete: function () { b.destroy(); } });
    } });
  }

  function drawFocus(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!started || !cards.length) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIdx];
    if (!card) { return; }
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, 0x102a43, 1);
    focusRing.strokeRoundedRect(card.cx - card.cw / 2 - 5, card.cy - card.ch / 2 - 5, card.cw + 10, card.ch + 10, 26);
  }

  function moveFocus(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(focusIdx / cols), c = focusIdx % cols;
    c = (c + dx + cols) % cols;
    r = (r + dy + 3) % 3;
    focusIdx = r * cols + c;
    drawFocus(scene);
  }

  function setupKeyboard(scene) {
    scene.input.keyboard.on("keydown-ENTER", function () { handleKey(scene, "enter"); });
    scene.input.keyboard.on("keydown-SPACE", function () { handleKey(scene, "enter"); });
    scene.input.keyboard.on("keydown-UP", function () { moveFocus(scene, 0, -1); });
    scene.input.keyboard.on("keydown-DOWN", function () { moveFocus(scene, 0, 1); });
    scene.input.keyboard.on("keydown-LEFT", function () { moveFocus(scene, -1, 0); });
    scene.input.keyboard.on("keydown-RIGHT", function () { moveFocus(scene, 1, 0); });
    scene.input.keyboard.on("keydown-R", function () { if (started) { restart(scene); } });
  }

  function handleKey(scene, kind) {
    if (kind !== "enter") { return; }
    if (startOverlay && startOverlay.visible) {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      announce("Wave 1. Use arrow keys and Enter, or tap a card.");
      drawFocus(scene);
      return;
    }
    if (endOverlay && endOverlay.visible) { nextWave(scene); return; }
    var card = cards[focusIdx];
    if (card) { onCard(scene, card); }
  }

  function update() {}
})();
</script>
</body>
</html>
