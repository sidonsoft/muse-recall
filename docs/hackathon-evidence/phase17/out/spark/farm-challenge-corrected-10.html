<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<p id="live" class="visually-hidden" aria-live="polite">Farmyard Match loaded. Choose a difficulty to start.</p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var EXTRA_ANIMALS = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F986}", name: "Duck" }
  ];
  var MODES = {
    easy: { pairs: 6, cols: 4, rows: 3, flipDelay: 700, time: 0, label: "Classic" },
    hard: { pairs: 8, cols: 4, rows: 4, flipDelay: 500, time: 90, label: "Challenge" }
  };
  var mode = "easy";
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, timeLeft = 0, timerId = null, focusIndex = 0, modeButton = null, modeLabel = null;
  var hudMoves, hudScore, hudMsg, hudTime, endOverlay, endTitle, endDetail, startOverlay, focusRing;
  function pairCount() { return MODES[mode].pairs; }
  function allAnimals() { return ANIMALS.concat(EXTRA_ANIMALS); }
  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard(s);
    var c = s.game.canvas;
    if (c) {
      c.setAttribute("tabindex", "0");
      c.setAttribute("role", "application");
      c.setAttribute("aria-label", "Farmyard Match memory game. Arrow keys choose a card, Enter flips it, R restarts, M changes difficulty.");
    }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudTime = scene.add.text(24, 122, "", textStyle(24, "#4EA8DE"));
    modeLabel = scene.add.text(W / 2, 168, "Classic: find the 6 animal pairs!", textStyle(22, "#486581")).setOrigin(0.5);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#486581")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    modeButton = scene.add.container(W - 300, 116);
    varmbg = scene.add.graphics();
    varmbg.fillStyle(0xffffff, 1); varmbg.fillRoundedRect(-86, -26, 172, 52, 26);
    varmbg.lineStyle(3, 0x4EA8DE, 1); varmbg.strokeRoundedRect(-86, -26, 172, 52, 26);
    var mlabel = scene.add.text(0, 0, "Mode: Classic", textStyle(20, "#102A43")).setOrigin(0.5);
    modeButton.add([varmbg, mlabel]);
    modeButton.setData("label", mlabel);
    varmbg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    varmbg.on("pointerdown", function () { openModeSelect(scene); });
    varmbg.on("pointerover", function () { modeButton.setScale(1.06); });
    varmbg.on("pointerout", function () { modeButton.setScale(1); });
  }
  function refreshModeHud() {
    hudScore.setText("Pairs: " + matches + " / " + pairCount());
    var mlabel = modeButton ? modeButton.getData("label") : null;
    if (mlabel) { mlabel.setText("Mode: " + MODES[mode].label); }
    if (modeLabel) {
      modeLabel.setText(mode === "hard"
        ? "Challenge: 8 pairs, 90 seconds!"
        : "Classic: find the 6 animal pairs!");
    }
    if (hudTime) {
      hudTime.setText(mode === "hard" ? ("Time: " + timeLeft) : "");
    }
  }

  function shuffledDeck() {
    var deck = [];
    var pool = allAnimals().slice(0, pairCount());
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(true); });
    cards = [];
    firstPick = null;
    focusIndex = 0;
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    var deck = shuffledDeck();
    var cfg = MODES[mode];
    var cols = cfg.cols, rows = cfg.rows;
    var cw = 185, ch = rows > 3 ? 106 : 140, gx = 62, gy = rows > 3 ? 190 : 195, padX = 22, padY = rows > 3 ? 10 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var ci = cards.indexOf(card);
    if (ci >= 0) { focusIndex = ci; drawFocus(scene); }
    flip(card, true);
    announce(card.data.name + " flipped.");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    var delay = MODES[mode].flipDelay;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (!a.view.scene) { return; }
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + pairCount());
        announce("Pair found! " + matches + " of " + pairCount() + ".");
        hudMsg.setText(matches === pairCount() ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === pairCount()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -210, 640, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-320, -210, 640, 420, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Classic: 6 pairs, relaxed.\nChallenge: 8 pairs, 90 seconds, faster flip-back!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 0, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0xffffff, 1); easyBg.fillRoundedRect(-280, 60, 260, 64, 32);
    easyBg.lineStyle(4, 0x4EA8DE, 1); easyBg.strokeRoundedRect(-280, 60, 260, 64, 32);
    var easyTx = scene.add.text(-150, 92, "\u25B6 Classic", textStyle(26)).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x4EA8DE, 1); hardBg.fillRoundedRect(20, 60, 260, 64, 32);
    var hardTx = scene.add.text(150, 92, "\u26A1 Challenge", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 160, "Keys: 1 Classic, 2 Challenge, Enter Start", textStyle(17, "#486581")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, easyBg, easyTx, hardBg, hardTx, hint]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-280, 60, 260, 64), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 60, 260, 64), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { startGame(scene, "easy"); });
    hardBg.on("pointerdown", function () { startGame(scene, "hard"); });
    easyBg.on("pointerover", function () { easyTx.setScale(1.06); });
    easyBg.on("pointerout", function () { easyTx.setScale(1); });
    hardBg.on("pointerover", function () { hardTx.setScale(1.06); });
    hardBg.on("pointerout", function () { hardTx.setScale(1); });
  }
  function startGame(scene, nextMode) {
    mode = nextMode;
    moves = 0; matches = 0; firstPick = null;
    timeLeft = MODES[mode].time;
    hudMoves.setText("Moves: 0");
    refreshModeHud();
    hudMsg.setText(mode === "hard" ? "Challenge: go!" : "Tap a card!");
    announce(mode === "hard"
      ? "Challenge mode: 8 pairs, 90 seconds."
      : "Classic mode: 6 pairs.");
    if (endOverlay) { endOverlay.setVisible(false); }
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(true); });
    buildBoard(scene);
    drawFocus(scene);
    started = true; lockBoard = false;
    startTimer(scene);
  }
  function openModeSelect(scene) {
    stopTimer();
    started = false; lockBoard = true;
    if (endOverlay) { endOverlay.setVisible(false); }
    startOverlay.setVisible(true);
    hudMsg.setText("Pick a mode!");
    announce("Choose Classic or Challenge mode.");
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    stopTimer();
    var need = pairCount();
    var limit3 = mode === "hard" ? 14 : 10;
    var limit2 = mode === "hard" ? 22 : 16;
    var stars = moves <= limit3 ? 3 : (moves <= limit2 ? 2 : 1);
    var head = mode === "hard" ? "\u{1F389} Challenge Clear! \u{1F389}" : "\u{1F389} You Win! \u{1F389}";
    endTitle.setText(head);
    var extra = mode === "hard" ? "\nTime left: " + timeLeft + "s" : "";
    endDetail.setText("You found all " + need + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + extra);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! All " + need + " pairs found in " + moves + " moves.");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showTimeout(scene) {
    stopTimer();
    lockBoard = true;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("Challenge failed.\nYou found " + matches + " / " + pairCount() + " pairs.\nPress Play Again (R).");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    announce("Time is up. You found " + matches + " of " + pairCount() + " pairs.");
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }
  function startTimer(scene) {
    stopTimer();
    if (mode !== "hard") { return; }
    refreshModeHud();
    timerId = setInterval(function () {
      timeLeft--;
      if (hudTime) { hudTime.setText("Time: " + Math.max(timeLeft, 0)); }
      if (timeLeft <= 0) {
        stopTimer();
        showTimeout(scene);
      }
    }, 1000);
  }

  function drawFocus(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length || !started) { return; }
    if (focusIndex < 0) { focusIndex = 0; }
    if (focusIndex >= cards.length) { focusIndex = cards.length - 1; }
    var card = cards[focusIndex];
    var w = card.view.width || 185, h = card.view.height || 140;
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, 0x102A43, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function flipFocused(scene) {
    if (!cards.length) { return; }
    var card = cards[focusIndex];
    if (card) { onCard(scene, card); }
  }

  function moveFocus(scene, dx, dy) {
    var cols = MODES[mode].cols;
    var n = cards.length;
    var next = focusIndex + dx + dy * cols;
    if (next < 0 || next >= n) { return; }
    focusIndex = next;
    drawFocus(scene);
    var c = cards[focusIndex];
    if (c && !c.matched) { announce("Selected " + (focusIndex + 1) + " of " + n + (c.faceUp ? ", face up." : ".")); }
  }

  function wireKeyboard(scene) {
    var kb = scene.input && scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, mode); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      flipFocused(scene);
    });
    kb.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, mode); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      flipFocused(scene);
    });
    kb.on("keydown-ONE", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "easy"); } });
    kb.on("keydown-TWO", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); } });
    kb.on("keydown-E", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "easy"); } });
    kb.on("keydown-H", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); } });
    kb.on("keydown-C", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); } });
    kb.on("keydown-R", function () { restart(scene); });
    kb.on("keydown-M", function () { openModeSelect(scene); });
    kb.on("keydown-LEFT", function () { moveFocus(scene, -1, 0); });
    kb.on("keydown-RIGHT", function () { moveFocus(scene, 1, 0); });
    kb.on("keydown-UP", function () { moveFocus(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveFocus(scene, 0, 1); });
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" && ev.key !== " ") { return; }
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") { return; }
      if (scene.game && scene.game.canvas && document.activeElement === scene.game.canvas) {
        ev.preventDefault();
      }
    });
  }

  function restart(scene) {
    stopTimer();
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    timeLeft = MODES[mode].time;
    hudMoves.setText("Moves: 0");
    refreshModeHud();
    hudMsg.setText(mode === "hard" ? "Challenge: go!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(true); });
    buildBoard(scene);
    drawFocus(scene);
    startTimer(scene);
    announce("Restarted in " + MODES[mode].label + " mode.");
  }

  function update() {}
})();
