<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusFlow — Task Planner</title>
<style>
  :root {
    --bg: #141311;
    --surface: #1e1c18;
    --surface-2: #262320;
    --border: #38322a;
    --text: #f2ede3;
    --muted: #b3a898;
    --accent: #e7c17c;
    --accent-ink: #241b08;
    --accent-soft: rgba(231, 193, 124, 0.14);
    --danger: #e08f7e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 620px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  .add-row {
    display: flex;
    gap: 10px;
  }
  #taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1rem;
  }
  #taskInput::placeholder { color: #8d8375; }
  #taskInput:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  #priorityInput {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.92rem;
    cursor: pointer;
  }
  #priorityInput:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #addBtn {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
  }
  #addBtn:hover { filter: brightness(1.06); }
  #addBtn:active { filter: brightness(0.96); }
  #addBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .hint {
    margin: 8px 2px 0;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .filter-btn:focus-visible,
  .icon-btn:focus-visible,
  .check:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #clearBtn {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #clearBtn:hover { color: var(--text); }
  #clearBtn:disabled {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
  }
  .progress-wrap {
    margin: 4px 0 12px;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progressLabel { color: var(--text); font-weight: 600; }
  .progress-track {
    height: 10px;
    border-radius: 999px;
    background: #322d25;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  ul#taskList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 11px;
  }
  .task.completed { opacity: 0.82; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: transparent;
    color: transparent;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .task.completed .check {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .check:hover { background: var(--accent-soft); }
  .task.completed .check:hover { background: var(--accent); }
  .task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .task.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .icon-btn {
    flex: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .icon-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: rgba(224, 143, 126, 0.10);
  }
  .priority-btn {
    flex: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .priority-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .priority-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }
  .priority-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .priority-line {
    margin: 8px 0 0;
    font-size: 0.84rem;
    color: var(--muted);
  }
  #prioritySummary { color: var(--muted); }
  .empty {
    text-align: center;
    padding: 28px 12px;
    border: 1px dashed var(--border);
    border-radius: 11px;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
    font-size: 1.02rem;
  }
  .cheer {
    margin: 0 0 10px;
    min-height: 1.6em;
    text-align: center;
    font-size: 0.92rem;
    font-weight: 650;
    color: var(--accent);
    opacity: 0;
    transform: translateY(4px) scale(0.98);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .cheer.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .task.just-completed {
    animation: completePop 0.45s ease;
    border-color: var(--accent);
  }
  @keyframes completePop {
    0% { transform: scale(1); }
    35% { transform: scale(1.025); background: var(--accent-soft); }
    100% { transform: scale(1); }
  }
  #progressBar.bump {
    animation: barBump 0.45s ease;
  }
  @keyframes barBump {
    0% { filter: brightness(1); }
    40% { filter: brightness(1.35); }
    100% { filter: brightness(1); }
  }
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 60;
  }
  .confetti-piece {
    position: absolute;
    border-radius: 2px;
    animation: confettiFall 0.9s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx, 0px), 130px) rotate(260deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .task.just-completed,
    #progressBar.bump,
    .confetti-piece {
      animation: none;
    }
    .cheer { transition: none; }
  }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.84rem;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px 36px; }
    .card { padding: 14px; }
    .add-row { flex-direction: column; }
    #addBtn { width: 100%; }
    #priorityInput { width: 100%; }
    .toolbar { align-items: flex-start; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">◐</span>
      <h1>FocusFlow</h1>
    </div>
    <p class="subtitle">A calm place for today's tasks.</p>
  </header>

  <section class="card" aria-label="Task planner">
    <div class="add-row">
      <input
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Add a new task…"
        aria-label="New task"
        autocomplete="off" />
      <select id="priorityInput" aria-label="Task priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p class="hint">Press Enter or choose Add task. Tasks stay for this session only.</p>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clearBtn" type="button">Clear completed</button>
    </div>

    <div class="progress-wrap" aria-live="polite">
      <div class="progress-text">
        <span id="progressLabel">0 of 0 completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <p class="priority-line"><span id="prioritySummary">No high-priority tasks remaining</span></p>
    </div>

    <p id="cheer" class="cheer" role="status" aria-live="polite"></p>
    <ul id="taskList" aria-live="polite" aria-label="Tasks"></ul>
    <div id="confetti" aria-hidden="true"></div>
  </section>

  <footer>FocusFlow keeps tasks in memory for this session.</footer>
</main>

<script>
(function () {
  "use strict";
  var tasks = [];
  var nextId = 1;
  var filter = "all";

  var input = document.getElementById("taskInput");
  var priorityInput = document.getElementById("priorityInput");
  var prioritySummary = document.getElementById("prioritySummary");
  var addBtn = document.getElementById("addBtn");
  var list = document.getElementById("taskList");
  var progressLabel = document.getElementById("progressLabel");
  var progressPct = document.getElementById("progressPct");
  var progressBar = document.getElementById("progressBar");
  var progressTrack = document.getElementById("progressTrack");
  var clearBtn = document.getElementById("clearBtn");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));
  var cheer = document.getElementById("cheer");
  var confetti = document.getElementById("confetti");
  var cheerTimer = null;
  var cheerIndex = 0;
  var cheerMessages = [
    "Nice work — task complete!",
    "Well done! One more checked off.",
    "Great focus — keep it going!",
    "Done and dusted. Lovely work!"
  ];

  function addTask() {
    var text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    var priority = priorityInput.value === "high" ? "high" : "normal";
    tasks.push({ id: nextId++, text: text, completed: false, priority: priority });
    input.value = "";
    priorityInput.value = "normal";
    input.focus();
    render();
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function showCheer(text) {
    cheer.textContent = text;
    cheer.classList.remove("show");
    // Re-trigger the fade/pop transition so repeated completions replay it.
    void cheer.offsetWidth;
    cheer.classList.add("show");
    if (cheerTimer) {
      window.clearTimeout(cheerTimer);
    }
    cheerTimer = window.setTimeout(function () {
      cheer.classList.remove("show");
    }, 2600);
  }

  function burst(x, y) {
    if (!confetti || prefersReducedMotion()) {
      return;
    }
    var colors = ["#e7c17c", "#f4d9a0", "#d9a94e", "#fff3d6", "#c98f3d"];
    var originX = (typeof x === "number") ? x : window.innerWidth / 2;
    var originY = (typeof y === "number") ? y : window.innerHeight * 0.35;
    for (var i = 0; i < 22; i++) {
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      var size = 5 + Math.round(Math.random() * 5);
      piece.style.width = size + "px";
      piece.style.height = (Math.random() < 0.4 ? size : Math.round(size * 0.45)) + "px";
      piece.style.left = originX + "px";
      piece.style.top = originY + "px";
      piece.style.background = colors[i % colors.length];
      piece.style.setProperty("--dx", Math.round((Math.random() - 0.5) * 220) + "px");
      if (Math.random() < 0.35) {
        piece.style.borderRadius = "50%";
      }
      confetti.appendChild(piece);
      (function (el) {
        window.setTimeout(function () {
          if (el.parentNode === confetti) {
            confetti.removeChild(el);
          }
        }, 1000);
      })(piece);
    }
  }

  function toggleTask(id, x, y) {
    var completedText = "";
    var becameCompleted = false;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].completed = !tasks[i].completed;
        becameCompleted = tasks[i].completed;
        completedText = tasks[i].text;
        break;
      }
    }
    render(becameCompleted ? id : null);
    if (becameCompleted) {
      var remaining = tasks.filter(function (t) { return !t.completed; }).length;
      var message;
      if (remaining === 0 && tasks.length > 1) {
        message = "All tasks complete — enjoy the calm!";
      } else {
        message = cheerMessages[cheerIndex % cheerMessages.length];
        cheerIndex++;
      }
      showCheer(message + (completedText ? " (" + completedText + ")" : ""));
      burst(x, y);
      progressBar.classList.remove("bump");
      if (!prefersReducedMotion()) {
        void progressBar.offsetWidth;
        progressBar.classList.add("bump");
      }
    }
  }

  function togglePriority(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) {
        tasks[i].priority = tasks[i].priority === "high" ? "normal" : "high";
        break;
      }
    }
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function clearCompleted() {
    tasks = tasks.filter(function (t) { return !t.completed; });
    render();
  }

  function visibleTasks() {
    if (filter === "active") {
      return tasks.filter(function (t) { return !t.completed; });
    }
    if (filter === "completed") {
      return tasks.filter(function (t) { return t.completed; });
    }
    return tasks;
  }

  function filterLabel() {
    if (filter === "active") return "active";
    if (filter === "completed") return "completed";
    return "all";
  }

  function render(celebratedId) {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.completed; }).length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);

    progressLabel.textContent = done + " of " + total + " completed";
    progressPct.textContent = pct + "%";
    progressBar.style.width = pct + "%";
    progressTrack.setAttribute("aria-valuenow", String(pct));

    var highRemaining = tasks.filter(function (t) { return !t.completed && t.priority === "high"; }).length;
    if (highRemaining === 0) {
      prioritySummary.textContent = "No high-priority tasks remaining";
    } else if (highRemaining === 1) {
      prioritySummary.textContent = "1 high-priority task remaining";
    } else {
      prioritySummary.textContent = highRemaining + " high-priority tasks remaining";
    }

    clearBtn.disabled = done === 0;

    filterBtns.forEach(function (btn) {
      var active = btn.getAttribute("data-filter") === filter;
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });

    list.innerHTML = "";
    var shown = visibleTasks();

    if (shown.length === 0) {
      var empty = document.createElement("li");
      empty.className = "empty";
      var title = document.createElement("strong");
      var body = document.createElement("span");
      if (total === 0) {
        title.textContent = "No tasks yet";
        body.textContent = "Add your first task above to begin.";
      } else if (filter === "active") {
        title.textContent = "All clear";
        body.textContent = "No active tasks. Enjoy the calm.";
      } else if (filter === "completed") {
        title.textContent = "Nothing completed yet";
        body.textContent = "Completed tasks will appear here.";
      } else {
        title.textContent = "Nothing here";
        body.textContent = "Try a different filter.";
      }
      empty.appendChild(title);
      empty.appendChild(body);
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (task) {
      var li = document.createElement("li");
      li.className = "task" + (task.completed ? " completed" : "");

      var check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.setAttribute("aria-label", task.completed ? "Mark active: " + task.text : "Mark complete: " + task.text);
      check.setAttribute("aria-pressed", task.completed ? "true" : "false");
      check.textContent = task.completed ? "✓" : "";
      if (celebratedId === task.id && task.completed) {
        li.classList.add("just-completed");
      }
      check.addEventListener("click", function (event) {
        var x = event && typeof event.clientX === "number" ? event.clientX : undefined;
        var y = event && typeof event.clientY === "number" ? event.clientY : undefined;
        toggleTask(task.id, x, y);
      });

      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = task.text;

      var isHigh = task.priority === "high";
      var prio = document.createElement("button");
      prio.type = "button";
      prio.className = "priority-btn";
      prio.setAttribute("aria-pressed", isHigh ? "true" : "false");
      prio.setAttribute("aria-label", (isHigh ? "Mark normal priority: " : "Mark high priority: ") + task.text);
      prio.textContent = isHigh ? "High" : "Mark high";
      prio.addEventListener("click", function () { togglePriority(task.id); });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.setAttribute("aria-label", "Delete task: " + task.text);
      del.textContent = "Delete";
      del.addEventListener("click", function () { deleteTask(task.id); });

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(prio);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addTask();
    }
  });
  clearBtn.addEventListener("click", clearCompleted);
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter") || "all";
      render();
    });
  });

  // Seed with two gentle examples so progress text is visible on first load.
  tasks.push({ id: nextId++, text: "Plan today's top three tasks", completed: true, priority: "normal" });
  tasks.push({ id: nextId++, text: "Take a short focus break", completed: false, priority: "high" });
  render();
  input.focus();
})();
</script>
</body>
</html>
