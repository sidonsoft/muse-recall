<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Match — Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b2c4a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Verdana,system-ui,sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match arcade memory game. Use arrow keys to move, Enter to flip a card." tabindex="0"></div>
<p id="sr-status" class="sr-only" aria-live="polite"></p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  srStatus = document.getElementById("sr-status");
  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#0b2c4a",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false, gameOver = false;
  var moves = 0, matches = 0, score = 0, combo = 0, bestCombo = 0;
  var TOTAL_TIME = 90, timeLeft = TOTAL_TIME, lastTick = 0, timeUp = false;
  var hudMoves, hudScore, hudPts, hudMsg, hudTime, timeBarBg, timeBar, endOverlay, endTitle, endDetail, startOverlay;
  var cursorIdx = 0, cursorBox = null, srStatus = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeCursor(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    bindKeys(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // cool ocean arcade backdrop, farm silhouettes kept
    g.fillStyle(0x0b2c4a, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0x12395b, 1); g.fillRect(0, 0, W, 190);
    g.fillStyle(0x1b4f72, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x4ea8de, 0.25); g.fillRect(0, 185, W, 6);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.85);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn silhouette in deep ocean tones
    g.fillStyle(0x274c63, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x1a3447, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0x4ea8de, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0x4ea8de, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x2e6f8e, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // glowing buoys along the bottom
    var cols = [0x4ea8de, 0x72efdd, 0xffd166, 0x80ffdb];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x0e3a5d, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Segoe UI",Verdana,system-ui,sans-serif', fontSize: size + "px", color: color || "#102a43", fontStyle: "bold" };
  }

  function announce(msg) {
    if (srStatus) { srStatus.textContent = msg; }
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32, "#ffffff")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(22, "#d6edff"));
    hudScore = scene.add.text(24, 78, "Pairs: 0 / 6", textStyle(22, "#d6edff"));
    hudPts = scene.add.text(24, 106, "Score: 0", textStyle(22, "#ffd166"));
    hudTime = scene.add.text(24, 134, "Time: 90", textStyle(22, "#80ffdb"));
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0x0e3a5d, 1); timeBarBg.fillRoundedRect(130, 136, 220, 18, 9);
    timeBar = scene.add.graphics();
    drawTimeBar();
    hudMsg = scene.add.text(W - 24, 56, "Tap a card!", textStyle(24, "#ffffff")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 112);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match all 6 pairs before the clock runs out! Miss = -3s", textStyle(20, "#d6edff")).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var frac = Math.max(0, timeLeft / TOTAL_TIME);
    var w = Math.round(212 * frac);
    var col = frac > 0.5 ? 0x4ea8de : (frac > 0.2 ? 0xffd166 : 0xff595e);
    timeBar.fillStyle(col, 1);
    if (w > 0) { timeBar.fillRoundedRect(134, 139, w, 12, 6); }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c && c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0x102a43, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd6edff, 0xcaf0f8, 0xade8f4, 0x90e0ef, 0x80ffdb, 0xffd166];
    fg.fillStyle(0x102a43, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function floatText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(26, color || "#ffd166")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 900, onComplete: function () { t.destroy(); } });
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    selectCursor(cards.indexOf(card));
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more…"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (gameOver) { return; }
        a.matched = card.matched = true;
        combo++;
        if (combo > bestCombo) { bestCombo = combo; }
        var gained = 100 * combo + Math.ceil(timeLeft);
        score += gained;
        hudPts.setText("Score: " + score);
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.1, yoyo: true, duration: 160 });
        floatText(scene, (a.view.x + card.view.x) / 2, a.view.y - 60, "+" + gained + (combo > 1 ? "  COMBO x" + combo : ""), "#80ffdb");
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "All pairs found!" : (combo > 1 ? "Streak x" + combo + "! Keep going!" : "Nice match! \u{1F389}"));
        announce("Pair found. " + matches + " of 6. Score " + score + ".");
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      timeLeft = Math.max(0, timeLeft - 3);
      drawTimeBar();
      hudTime.setText("Time: " + Math.ceil(timeLeft));
      hudMsg.setText("Miss! -3s \u{1F340}");
      if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(140, 0.008); }
      announce("No match. 3 second penalty.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 650);
    }
  }

  function startGame(scene) {
    started = true; gameOver = false; timeUp = false; lockBoard = false;
    lastTick = 0;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Go! Beat the clock!");
    announce("Game started. 90 seconds. Match all 6 pairs.");
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.55); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -128, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -58, "ARCADE: find all 6 pairs in 90s!\nMatch streaks boost score. Miss = -3s.", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 26, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "42px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function rankFor(s, mv, best) {
    if (s >= 1400 && mv <= 12) { return "S — Barn Burner!"; }
    if (s >= 1000) { return "A — Arcade Star!"; }
    if (s >= 700) { return "B — Solid Run!"; }
    return "C — Warm-Up!";
  }

  function showWin(scene) {
    gameOver = true;
    var timeBonus = Math.ceil(timeLeft) * 5;
    score += timeBonus;
    hudPts.setText("Score: " + score);
    endTitle.setText("\u{1F389} Clear! Rank " + rankFor(score, moves, bestCombo).split(" ")[0] + " \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nScore: " + score + " (time bonus +" + timeBonus + ")\nBest streak: x" + Math.max(1, bestCombo) + "  Rank: " + rankFor(score, moves, bestCombo));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Cleared! " + score + " pts!");
    announce("You win. Score " + score + " in " + moves + " moves.");
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u26A1"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showTimeUp(scene) {
    gameOver = true; timeUp = true; lockBoard = true;
    endTitle.setText("\u23F1 Time Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  Moves: " + moves + "\nPress Play Again (or Enter) for another run!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time up! Hit Restart!");
    announce("Time up. You found " + matches + " of 6 pairs. Score " + score + ".");
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0;
    timeLeft = TOTAL_TIME; lastTick = 0; gameOver = false; timeUp = false;
    firstPick = null; lockBoard = false; started = true; cursorIdx = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: 0"); hudTime.setText("Time: " + TOTAL_TIME); drawTimeBar();
    hudMsg.setText("Go! Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    selectCursor(0);
    announce("New game. 90 seconds on the clock.");
  }

  function makeCursor(scene) {
    cursorBox = scene.add.graphics().setDepth(5);
    selectCursor(0);
  }

  function selectCursor(idx) {
    if (!cards.length) { return; }
    cursorIdx = ((idx % cards.length) + cards.length) % cards.length;
    if (!cursorBox) { return; }
    var c = cards[cursorIdx];
    cursorBox.clear();
    if (!c || c.matched) { return; }
    cursorBox.lineStyle(4, 0xffd166, 1);
    cursorBox.strokeRoundedRect(c.view.x - 100, c.view.y - 78, 200, 156, 22);
  }

  function bindKeys(scene) {
    function flipCurrent() {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      if (cards[cursorIdx]) { onCard(scene, cards[cursorIdx]); }
    }
    scene.input.keyboard.on("keydown-ENTER", flipCurrent);
    scene.input.keyboard.on("keydown-SPACE", flipCurrent);
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
    scene.input.keyboard.on("keydown-LEFT", function () { selectCursor(cursorIdx - 1); });
    scene.input.keyboard.on("keydown-RIGHT", function () { selectCursor(cursorIdx + 1); });
    scene.input.keyboard.on("keydown-UP", function () { selectCursor(cursorIdx - 4); });
    scene.input.keyboard.on("keydown-DOWN", function () { selectCursor(cursorIdx + 4); });
    document.getElementById("game").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); flipCurrent(); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); selectCursor(cursorIdx - 1); }
      else if (ev.key === "ArrowRight") { ev.preventDefault(); selectCursor(cursorIdx + 1); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); selectCursor(cursorIdx - 4); }
      else if (ev.key === "ArrowDown") { ev.preventDefault(); selectCursor(cursorIdx + 4); }
      else if (ev.key === "r" || ev.key === "R") { restart(scene); }
    });
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 10 && timeLeft > 0) {
      hudTime.setText("Time: " + Math.ceil(timeLeft) + "!");
    } else {
      hudTime.setText("Time: " + Math.ceil(Math.max(0, timeLeft)));
    }
    drawTimeBar();
    if (timeLeft <= 0) {
      timeLeft = 0;
      drawTimeBar();
      hudTime.setText("Time: 0");
      showTimeUp(this);
    }
  }
})();
</script>
</body>
</html>
