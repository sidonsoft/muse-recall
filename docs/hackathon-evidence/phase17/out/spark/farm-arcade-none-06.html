<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard memory match card game. Use arrow keys to choose a card, Enter or Space to flip it, R to restart."></div>
<p class="sr-only">Keyboard: arrow keys move between cards. Enter or Space flips the chosen card or activates Start / Play Again. R restarts. Match all 6 pairs before the 90 second timer runs out. Mismatches cost 2 seconds, matches earn bonus time and combo points.</p>
<p class="sr-only" aria-live="polite" id="live"></p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0, matchesWon = 0;
  var TIME_START = 90, timeLeft = 90, gameOver = false, elapsed = 0;
  var lastMatchAt = -99, lastTickSecond = -1;
  var selected = 0, keyboardUsed = false;
  var hudMoves, hudScore, hudMsg, hudPoints, hudTime, hudStreak, timerBar, selector, endOverlay, endTitle, endDetail, startOverlay;
  var audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeSelector(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { audioCtx = new AC(); }
      }
      if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { audioCtx = null; }
  }
  function beep(freq, dur, type, vol, delay) {
    if (!audioCtx) { return; }
    try {
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }
  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudPoints = scene.add.text(24, 122, "Score: 0", textStyle(24, "#b3541e"));
    hudTime = scene.add.text(W / 2, 42, "90", textStyle(36, "#b3541e")).setOrigin(0.5);
    timerBar = scene.add.graphics();
    drawTimer();
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    hudStreak = scene.add.text(W - 24, 90, "", textStyle(20, "#e07b00")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Beat the clock: find 6 pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function drawTimer() {
    if (!timerBar) { return; }
    timerBar.clear();
    var bw = 300, bh = 14, bx = W / 2 - bw / 2, by = 66;
    timerBar.fillStyle(0x000000, 0.12);
    timerBar.fillRoundedRect(bx, by, bw, bh, 7);
    var frac = Math.max(0, timeLeft / TIME_START);
    var col = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xe9a817 : 0xd64545);
    timerBar.fillStyle(col, 1);
    timerBar.fillRoundedRect(bx, by, Math.max(14, bw * frac), bh, 7);
  }
  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPoints.setText("Score: " + score);
    hudTime.setText("" + Math.ceil(timeLeft));
    hudStreak.setText(streak >= 2 ? ("Combo x" + streak) : "");
    drawTimer();
  }
  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    flip(card, true);
    ensureAudio();
    beep(520, 0.09, "square", 0.07);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); drawSelector(); return; }
    moves++;
    beep(440, 0.07, "square", 0.06);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      var speedBonus = (elapsed - lastMatchAt < 6 && lastMatchAt > 0) ? 50 : 0;
      var gained = 100 + streak * 25 + speedBonus;
      setTimeout(function () {
        if (gameOver) { return; }
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        score += gained;
        lastMatchAt = elapsed;
        timeLeft = Math.min(TIME_START, timeLeft + 3);
        beep(660, 0.12, "square", 0.1);
        beep(880 + streak * 60, 0.16, "square", 0.1, 0.09);
        burst(scene, a.view.x, a.view.y);
        burst(scene, card.view.x, card.view.y);
        popup(scene, card.view.x, card.view.y - 70, "+" + gained);
        if (speedBonus > 0) { popup(scene, W / 2, H / 2 - 60, "SPEED +50!"); }
        if (streak >= 2) {
          hudMsg.setText("Combo x" + streak + "! " + "\u{1F389}");
          popup(scene, W / 2, H / 2, "COMBO x" + streak + "!");
          scene.cameras.main.shake(80, 0.002);
        } else {
          hudMsg.setText(matches === 6 ? "You did it!" : "Yay! A pair! \u{1F389}");
        }
        announce("Pair found! Score " + score + ". " + matches + " of 6 pairs.");
        refreshHud();
        lockBoard = false;
        if (matches === 6) { showEnd(scene, true); }
      }, 350);
    } else {
      hudMsg.setText("Try again! -2s \u{1F340}");
      streak = 0;
      timeLeft = Math.max(0, timeLeft - 2);
      beep(220, 0.18, "sawtooth", 0.09);
      beep(150, 0.22, "sawtooth", 0.09, 0.1);
      scene.cameras.main.shake(150, 0.008);
      refreshHud();
      var flipBackDelay = Math.max(380, 700 - matches * 60);
      setTimeout(function () {
        if (gameOver) { return; }
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, flipBackDelay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "ARCADE: 90 seconds on the clock!\nMatch fast for combos. Miss = -2s, match = +3s!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      ensureAudio();
      started = true; lockBoard = false; gameOver = false;
      timeLeft = TIME_START; elapsed = 0; lastMatchAt = -99; lastTickSecond = -1;
      startOverlay.setVisible(false);
      hudMsg.setText("Go! Match fast!");
      refreshHud();
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showEnd(scene, won) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    if (won) {
      score += Math.ceil(timeLeft) * 10;
      endTitle.setText("\u{1F389} You Win! \u{1F389}");
      endDetail.setText("All 6 pairs! Time left: " + Math.ceil(timeLeft) + "s\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  Best combo x" + Math.max(1, bestStreak));
      [523, 659, 784, 1046].forEach(function (f, i) { beep(f, 0.18, "square", 0.1, i * 0.12); });
    } else {
      endTitle.setText("\u23F0 Time's Up! \u23F0");
      endDetail.setText("You found " + matches + " / 6 pairs.\nMoves: " + moves + "  Score: " + score + "\nBest combo x" + Math.max(1, bestStreak) + " — go again!");
      [400, 320, 240, 160].forEach(function (f, i) { beep(f, 0.2, "sawtooth", 0.09, i * 0.13); });
    }
    refreshHud();
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText(won ? "You win! \u{1F389}" : "Time's up!");
    announce(won ? ("You win! Score " + score) : ("Time's up! Score " + score));
    var n = won ? 40 : 18;
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    score = 0; streak = 0; bestStreak = 0;
    timeLeft = TIME_START; gameOver = false; elapsed = 0;
    lastMatchAt = -99; lastTickSecond = -1;
    selected = 0;
    ensureAudio();
    hudMsg.setText("Go! Match fast!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    refreshHud();
    drawSelector();
    announce("New game. 90 seconds. Good luck!");
  }

  function popup(scene, x, y, msg) {
    var t = scene.add.text(x, y, msg, textStyle(30, "#e07b00")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 900, onComplete: function () { t.destroy(); } });
  }
  function burst(scene, x, y) {
    var icons = ["\u2B50", "\u2728", "\u{1F389}"];
    for (var i = 0; i < 8; i++) {
      var p = scene.add.text(x, y, icons[i % 3], { fontSize: "26px" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-90, 60), alpha: 0, duration: Phaser.Math.Between(450, 800), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }
  function makeSelector(scene) {
    selector = scene.add.graphics().setDepth(5).setVisible(false);
    drawSelector();
  }
  function drawSelector() {
    if (!selector || !cards.length) { return; }
    selector.clear();
    if (!keyboardUsed || gameOver) { selector.setVisible(false); return; }
    var c = cards[selected];
    if (!c || c.matched) { selector.setVisible(false); return; }
    selector.setVisible(true);
    selector.lineStyle(5, 0xff6f00, 1);
    selector.strokeRoundedRect(c.view.x - 100, c.view.y - 77, 200, 154, 24);
  }
  function moveSelection(dx, dy) {
    keyboardUsed = true;
    var cols = 4;
    var r = Math.floor(selected / cols), c = Math.floor(selected % cols);
    c = (c + dx + cols) % cols;
    r = (r + dy + 3) % 3;
    selected = r * cols + c;
    beep(700, 0.05, "square", 0.05);
    drawSelector();
  }
  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-LEFT", function () { moveSelection(-1, 0); });
    kb.on("keydown-A", function () { moveSelection(-1, 0); });
    kb.on("keydown-RIGHT", function () { moveSelection(1, 0); });
    kb.on("keydown-D", function () { moveSelection(1, 0); });
    kb.on("keydown-UP", function () { moveSelection(0, -1); });
    kb.on("keydown-W", function () { moveSelection(0, -1); });
    kb.on("keydown-DOWN", function () { moveSelection(0, 1); });
    kb.on("keydown-S", function () { moveSelection(0, 1); });
    kb.on("keydown-ENTER", function () { pressSelected(scene); });
    kb.on("keydown-SPACE", function () { pressSelected(scene); });
    kb.on("keydown-R", function () { ensureAudio(); restart(scene); });
  }
  function pressSelected(scene) {
    ensureAudio();
    if (startOverlay && startOverlay.visible) {
      started = true; lockBoard = false; gameOver = false;
      timeLeft = TIME_START; elapsed = 0; lastMatchAt = -99; lastTickSecond = -1;
      startOverlay.setVisible(false);
      hudMsg.setText("Go! Match fast!");
      refreshHud();
      return;
    }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    keyboardUsed = true;
    if (cards[selected]) { onCard(scene, cards[selected]); }
    drawSelector();
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if ((startOverlay && startOverlay.visible) || (endOverlay && endOverlay.visible)) { return; }
    var dt = (delta || 16.7) / 1000;
    elapsed += dt;
    timeLeft -= dt;
    if (timeLeft <= 10 && timeLeft > 0) {
      var sec = Math.ceil(timeLeft);
      if (sec !== lastTickSecond) {
        lastTickSecond = sec;
        beep(1100, 0.06, "square", 0.06);
        if (hudTime) { hudTime.setScale(1.25); }
      }
      if (hudTime && hudTime.scaleX > 1) { hudTime.setScale(Math.max(1, hudTime.scaleX - 0.04)); }
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver = true;
      lockBoard = true;
      firstPick = null;
      refreshHud();
      showEnd(this, false);
      return;
    }
    refreshHud();
  }
})();
</script>
