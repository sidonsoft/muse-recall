<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory game. Use arrow keys to move between cards and Enter or Space to flip a card. Press R to restart."></div>
<div id="status" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudTime, hudPoints, endOverlay, endTitle, endDetail, startOverlay;
  var TIME_LIMIT = 60, MISS_PENALTY = 3;
  var timeLeft = TIME_LIMIT, score = 0, streak = 0, bestStreak = 0, gameOver = false;
  var timerEvent = null, cursorIdx = 0, cursorBox = null;
  var actx = null;

  function announce(msg) {
    try { document.getElementById("status").textContent = msg; } catch (e) {}
  }

  function beep(freq, dur, type, vol) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.04;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    cursorBox = s.add.graphics().setDepth(5);
    drawCursor();
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeys(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    hudTime = scene.add.text(24, 122, "Time: " + TIME_LIMIT, textStyle(24, "#b3541e"));
    hudPoints = scene.add.text(24, 154, "Score: 0", textStyle(24, "#1d6f42"));
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Beat the clock! Miss = -3s \u2022 Arrows + Enter works too", textStyle(20, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    cursorIdx = 0;
    drawCursor();
  }

  function drawCursor() {
    if (!cursorBox) { return; }
    cursorBox.clear();
    if (!started || gameOver || !cards.length) { return; }
    if ((startOverlay && startOverlay.visible) || (endOverlay && endOverlay.visible)) { return; }
    var card = cards[cursorIdx];
    if (!card) { return; }
    var w = card.view.width || 185, h = card.view.height || 140;
    cursorBox.lineStyle(5, 0xffb703, 1);
    cursorBox.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function moveCursor(dRow, dCol) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(cursorIdx / cols), c = cursorIdx % cols;
    r = (r + dRow + 3) % 3; c = (c + dCol + cols) % cols;
    cursorIdx = r * cols + c;
    beep(520, 0.06, "square", 0.02);
    drawCursor();
  }

  function setupKeys(scene) {
    scene.input.keyboard.on("keydown-LEFT", function () { if (started && !gameOver) { moveCursor(0, -1); } });
    scene.input.keyboard.on("keydown-A", function () { if (started && !gameOver) { moveCursor(0, -1); } });
    scene.input.keyboard.on("keydown-RIGHT", function () { if (started && !gameOver) { moveCursor(0, 1); } });
    scene.input.keyboard.on("keydown-D", function () { if (started && !gameOver) { moveCursor(0, 1); } });
    scene.input.keyboard.on("keydown-UP", function () { if (started && !gameOver) { moveCursor(-1, 0); } });
    scene.input.keyboard.on("keydown-W", function () { if (started && !gameOver) { moveCursor(-1, 0); } });
    scene.input.keyboard.on("keydown-DOWN", function () { if (started && !gameOver) { moveCursor(1, 0); } });
    scene.input.keyboard.on("keydown-S", function () { if (started && !gameOver) { moveCursor(1, 0); } });
    scene.input.keyboard.on("keydown-ENTER", function () { onKeyConfirm(scene); });
    scene.input.keyboard.on("keydown-SPACE", function () { onKeyConfirm(scene); });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
  }

  function onKeyConfirm(scene) {
    if (startOverlay && startOverlay.visible) {
      started = true; gameOver = false; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      startTimer(scene);
      drawCursor();
      announce("Game started. " + TIME_LIMIT + " seconds. Find all 6 pairs.");
      return;
    }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    if (cards[cursorIdx]) { onCard(scene, cards[cursorIdx]); }
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { cursorIdx = idx; drawCursor(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function popup(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "30px", color: color || "#1d6f42", fontStyle: "bold" }).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 800, onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y) {
    for (var i = 0; i < 10; i++) {
      var p = scene.add.text(x, y, ["\u2B50", "\u{1F389}", "\u2728"][i % 3], { fontSize: "24px" }).setOrigin(0.5).setDepth(15);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-70, 30), alpha: 0, duration: Phaser.Math.Between(500, 800), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    beep(440, 0.08, "square", 0.03);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (gameOver) { return; }
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        var frenzy = timeLeft <= 10;
        var pts = 100 + (streak - 1) * 25 + (frenzy ? 100 : 0);
        score += pts;
        hudPoints.setText("Score: " + score);
        var midX = (a.view.x + card.view.x) / 2, midY = (a.view.y + card.view.y) / 2;
        burst(scene, midX, midY);
        popup(scene, midX, midY - 40, "+" + pts + (streak > 1 ? "  x" + streak + " COMBO!" : "") + (frenzy ? " FRENZY!" : ""), frenzy ? "#d00000" : "#1d6f42");
        beep(660, 0.1, "square", 0.04);
        setTimeout(function () { beep(880, 0.12, "square", 0.04); }, 90);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "You did it!" : "Yay! +" + pts + " \u{1F389}");
        announce("Pair found! " + matches + " of 6. Score " + score + ". " + timeLeft + " seconds left.");
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      score = Math.max(0, score - 10);
      hudPoints.setText("Score: " + score);
      timeLeft = Math.max(0, timeLeft - MISS_PENALTY);
      hudTime.setText("Time: " + timeLeft);
      hudMsg.setText("Miss! -" + MISS_PENALTY + "s \u{1F340}");
      announce("No match. Minus " + MISS_PENALTY + " seconds. " + timeLeft + " seconds left.");
      beep(160, 0.2, "sawtooth", 0.04);
      try { scene.cameras.main.shake(150, 0.004); } catch (e) {}
      if (timeLeft <= 0) {
        flip(a, false); flip(card, false);
        lockBoard = false;
        showLose(scene);
        return;
      }
      var delay = matches >= 4 ? 450 : 700;
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawCursor(); });
      }, delay);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "\u23F1 60 seconds on the clock!\nPairs score, combos multiply,\nmisses cost 3s. Go!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () {
      started = true; gameOver = false; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      startTimer(scene);
      drawCursor();
      announce("Game started. " + TIME_LIMIT + " seconds. Find all 6 pairs.");
    });
  }

  function startTimer(scene) {
    stopTimer(scene);
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started || gameOver) { return; }
      if (startOverlay && startOverlay.visible) { return; }
      if (endOverlay && endOverlay.visible) { return; }
      timeLeft--;
      hudTime.setText("Time: " + Math.max(0, timeLeft));
      if (timeLeft === 10) {
        hudTime.setColor("#d00000");
        hudMsg.setText("FRENZY! +100 bonus per pair! \u{1F525}");
        announce("Ten seconds left. Frenzy bonus active.");
        beep(980, 0.15, "square", 0.05);
        try { scene.cameras.main.shake(200, 0.005); } catch (e) {}
      } else if (timeLeft <= 5 && timeLeft > 0) {
        beep(980, 0.08, "square", 0.05);
        scene.tweens.add({ targets: hudTime, scale: 1.4, yoyo: true, duration: 120 });
      }
      if (timeLeft <= 0) {
        timeLeft = 0;
        hudTime.setText("Time: 0");
        showLose(scene);
      }
    }});
  }

  function stopTimer(scene) {
    if (timerEvent) { try { timerEvent.remove(false); } catch (e) {} timerEvent = null; }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    stopTimer(scene);
    gameOver = true; lockBoard = true;
    var bonus = timeLeft * 10;
    score += bonus;
    hudPoints.setText("Score: " + score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("Score: " + score + " (time bonus +" + bonus + ")\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nBest combo: x" + Math.max(1, bestStreak));
    endOverlay.setVisible(true);
    drawCursor();
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Final score " + score + " in " + moves + " moves.");
    beep(660, 0.12, "square", 0.05);
    setTimeout(function () { beep(880, 0.12, "square", 0.05); }, 120);
    setTimeout(function () { beep(1320, 0.2, "square", 0.05); }, 240);
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    if (gameOver && endOverlay.visible) { return; }
    stopTimer(scene);
    gameOver = true; lockBoard = true; firstPick = null;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("Pairs: " + matches + " / 6   Score: " + score + "\nSo close! Hit Play Again (or R)!");
    endOverlay.setVisible(true);
    drawCursor();
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    announce("Time's up. You found " + matches + " of 6 pairs. Score " + score + ".");
    beep(330, 0.2, "sawtooth", 0.05);
    setTimeout(function () { beep(220, 0.3, "sawtooth", 0.05); }, 200);
    try { scene.cameras.main.shake(250, 0.006); } catch (e) {}
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; gameOver = false;
    timeLeft = TIME_LIMIT; score = 0; streak = 0; bestStreak = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudMsg.setText("Tap a card!");
    hudTime.setText("Time: " + TIME_LIMIT); hudTime.setColor("#b3541e");
    hudPoints.setText("Score: 0");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    drawCursor();
    announce("New game. " + TIME_LIMIT + " seconds. Find all 6 pairs.");
  }

  function update() {}
