<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#dbeef7;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  #hint{max-width:900px;margin:6px 12px 0;font-size:13px;color:#102A43;text-align:center}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game"></div>
<p id="hint">Keyboard: arrow keys choose a card, Enter or Space flips it, R restarts, M toggles sound.</p>
<div id="status" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0, level = 1;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, endBtnTx, startOverlay;
  var hudPts, hudStreak, hudLevel, soundTx;
  var focusIndex = 0, focusRing = null;
  var audioCtx = null, soundOn = true;
  var drifters = [];

  function mismatchDelay() { return Math.max(450, 750 - (level - 1) * 75); }

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function ensureAudio() {
    if (!soundOn) { return null; }
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return null; }
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      return audioCtx;
    } catch (e) { return null; }
  }

  function playTone(freq, dur, type, when) {
    var ctx = ensureAudio();
    if (!ctx) { return; }
    try {
      var t0 = ctx.currentTime + (when || 0);
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  function playFlip() { playTone(520, 0.12, "sine", 0); }
  function playMatch() { playTone(523, 0.14, "sine", 0); playTone(659, 0.16, "sine", 0.1); playTone(784, 0.22, "sine", 0.2); }
  function playMiss() { playTone(330, 0.16, "sine", 0); playTone(294, 0.2, "sine", 0.12); }
  function playWin() {
    var notes = [523, 659, 784, 1047];
    notes.forEach(function (f, i) { playTone(f, 0.22, "triangle", i * 0.14); });
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    drifters = [];
    var g = scene.add.graphics();
    // Cool ocean lagoon backdrop (calm, no flashing).
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdebf7, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // Sun.
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    // Boathouse (same layout as the barn, ocean palette).
    g.fillStyle(0x4ea8de, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102a43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    // Dock rails.
    g.lineStyle(8, 0x2c7da0, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // Gentle lagoon waves.
    g.fillStyle(0xffffff, 0.75);
    var w1 = scene.add.graphics();
    w1.fillStyle(0xffffff, 0.75);
    w1.fillEllipse(220, 505, 220, 26);
    w1.fillEllipse(620, 520, 260, 26);
    drifters.push({ obj: w1, baseX: 0, amp: 10, speed: 0.25, phase: 0 });
    // Coral dots along the bottom (still shapes; motion comes from slow tweens only).
    var cols = [0x90e0ef, 0x48cae4, 0xade8f4, 0xcaf0f8];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a9d8f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // Slow-drifting bubbles for arcade atmosphere (slow, smooth, no blinking).
    for (var b = 0; b < 8; b++) {
      var bub = scene.add.text(60 + b * 110, 420 + (b % 3) * 40, "\u25CB", { fontSize: "22px", color: "#ffffff" }).setAlpha(0.7).setDepth(1);
      drifters.push({ obj: bub, baseX: bub.x, baseY: bub.y, amp: 8, speed: 0.4 + (b % 3) * 0.15, phase: b * 0.8, vertical: true });
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPts.setText("Score: " + score);
    hudStreak.setText(streak >= 2 ? ("Streak x" + streak + "!") : (bestStreak >= 2 ? ("Best streak x" + bestStreak) : "Match 2 in a row!"));
    hudLevel.setText("Lagoon Lv." + level);
  }

  function makeHud(scene) {
    scene.add.text(24, 12, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 54, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(22));
    hudPts = scene.add.text(24, 110, "Score: 0", textStyle(22));
    hudStreak = scene.add.text(24, 138, "Match 2 in a row!", textStyle(20, "#2c7da0"));
    hudLevel = scene.add.text(W - 24, 30, "Lagoon Lv.1", textStyle(22, "#2c7da0")).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 58, "Tap a card!", textStyle(22)).setOrigin(1, 0.5);
    soundTx = scene.add.text(W - 24, 86, "\u{1F50A} Sound: On", textStyle(18, "#2c7da0")).setOrigin(1, 0.5);
    soundTx.setInteractive({ useHandCursor: true });
    soundTx.on("pointerdown", function () { toggleSound(scene); });
    var btn = scene.add.container(W - 110, 124);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene, false); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the 6 animal pairs! Chain matches for streak bonus!", textStyle(20)).setOrigin(0.5);
  }

  function toggleSound(scene) {
    soundOn = !soundOn;
    if (!soundOn && audioCtx) { try { audioCtx.suspend(); } catch (e) {} }
    soundTx.setText(soundOn ? "\u{1F50A} Sound: On" : "\u{1F507} Sound: Off");
    announce(soundOn ? "Sound on." : "Sound off.");
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (!focusRing) {
      focusRing = scene.add.graphics().setDepth(5);
    }
    drawFocus();
  }

  function drawFocus() {
    if (!focusRing || !cards.length) { return; }
    focusRing.clear();
    if (!started) { return; }
    var card = cards[focusIndex];
    if (!card || card.matched) { return; }
    focusRing.lineStyle(5, 0x102a43, 1);
    focusRing.strokeRoundedRect(card.x - 100, card.y - 77, 200, 154, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0xbde0fe, 0xa2d2ff, 0xc8b6ff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, x: x, y: y, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { ensureAudio(); focusIndex = cards.indexOf(card); drawFocus(); onCard(scene, card); });
    return card;
  }

  function scorePopup(scene, x, y, msg) {
    var t = scene.add.text(x, y - 70, msg, textStyle(26, "#102A43")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 120, alpha: 0, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    playFlip();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("One card flipped. Pick one more."); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        // Gentle arcade celebration: one soft bounce, no flashing.
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        scene.tweens.add({ targets: [a.view, card.view], y: "-=10", yoyo: true, duration: 180, ease: "Sine.easeInOut" });
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 * level + (streak - 1) * 25;
        score += gained;
        matches++;
        scorePopup(scene, card.x, card.y, "+" + gained);
        if (streak >= 2) { scorePopup(scene, (a.x + card.x) / 2, Math.min(a.y, card.y) - 40, "Streak x" + streak + "!"); }
        playMatch();
        hudMsg.setText(matches === 6 ? "You did it!" : (streak >= 2 ? ("Streak x" + streak + "! +" + gained) : ("Yay! A pair! +" + gained)));
        refreshHud();
        announce("Pair found! Score " + score + ". " + matches + " of 6 pairs.");
        drawFocus();
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      // No penalty: score and streak bonus pause, nothing is taken away.
      streak = 0;
      hudMsg.setText("Nice try! Keep going! \u{1F340}");
      playMiss();
      refreshHud();
      announce("Not a match. Try again.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, mismatchDelay());
    }
    refreshHud();
  }

  function startGame(scene) {
    ensureAudio();
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    announce("Game started. Find all 6 pairs.");
    refreshHud();
    drawFocus();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-320, -195, 640, 390, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-320, -195, 640, 390, 30);
    var title = scene.add.text(0, -125, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Flip the cards and find all 6 animal pairs!\nChain pairs for streak bonus points!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 25, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 75, 260, 70, 35);
    var btnTx = scene.add.text(0, 110, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var keys = scene.add.text(0, 165, "Mouse/touch or arrows + Enter  •  R restarts  •  M sound", textStyle(16, "#2c7da0")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx, keys]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 75, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -180, 600, 360, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} Lagoon Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-170, 60, 340, 70, 35);
    endBtnTx = scene.add.text(0, 95, "\u25B6 Next Lagoon", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-170, 60, 340, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene, true); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var bonus = Math.max(0, 18 - moves) * 10 * level;
    score += bonus;
    refreshHud();
    playWin();
    endTitle.setText("\u{1F389} Lagoon Lv." + level + " Clear! \u{1F389}");
    endDetail.setText("All 6 pairs found!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + " (clear bonus +" + bonus + ")\nBest streak: x" + bestStreak + "\nNext lagoon hides cards faster!");
    endBtnTx.setText("\u25B6 Next Lagoon (Lv." + (level + 1) + ")");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Lagoon clear! \u{1F389}");
    announce("You win! Score " + score + " with best streak " + bestStreak + ".");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F420}", "\u{1F41A}"][i % 6], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1600, 2600), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene, nextLevel) {
    if (nextLevel) { level++; }
    else { level = 1; score = 0; bestStreak = 0; }
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    refreshHud();
    hudMsg.setText("Tap a card!");
    announce(nextLevel ? ("Lagoon level " + level + ". Cards hide faster.") : "Game restarted. Level 1, score 0.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function moveFocus(delta, cols) {
    if (!cards.length) { return; }
    var next = focusIndex;
    for (var i = 0; i < cards.length; i++) {
      next = (next + delta + cards.length) % cards.length;
      if (!cards[next].matched) { break; }
    }
    focusIndex = next;
    drawFocus();
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-ENTER", function () { ensureAudio(); activateFocused(scene); });
    kb.on("keydown-SPACE", function () { ensureAudio(); activateFocused(scene); });
    kb.on("keydown-LEFT", function () { moveFocus(-1, 4); });
    kb.on("keydown-RIGHT", function () { moveFocus(1, 4); });
    kb.on("keydown-UP", function () { moveFocus(-4, 4); });
    kb.on("keydown-DOWN", function () { moveFocus(4, 4); });
    kb.on("keydown-R", function () { restart(scene, false); });
    kb.on("keydown-M", function () { toggleSound(scene); });
    kb.on("keydown", function (e) {
      if (e.key === " " && startOverlay && startOverlay.visible) { ensureAudio(); startGame(scene); }
    });
  }

  function activateFocused(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene, true); return; }
    var card = cards[focusIndex];
    if (card && !card.matched) { onCard(scene, card); }
  }

  function update(time) {
    // Slow ambient drift only (roughly one gentle sway every few seconds).
    for (var i = 0; i < drifters.length; i++) {
      var d = drifters[i];
      var t = (time / 1000) * d.speed + d.phase;
      if (d.vertical) { d.obj.y = d.baseY + Math.sin(t) * d.amp; }
      else { d.obj.x = d.baseX + Math.sin(t) * d.amp; }
    }
  }
})();
</script>
</body>
</html>
