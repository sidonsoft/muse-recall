<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0;
  var TIME_LIMIT = 90, timeLeft = 90, timerRunning = false, gameOver = false;
  var cursor = 0, focusRing = null, lastMatchAt = 0;
  var hudMoves, hudScore, hudMsg, hudPts, hudTime, hudCombo, endOverlay, endTitle, endDetail, startOverlay;
  var timeBarBg, timeBarFill, timeBarW = 220;
  var INK = "#102A43", ACCENT = 0x4EA8DE, ACCENT_DARK = 0x3486B8;

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard(s);
    if (s.game && s.game.canvas) { s.game.canvas.setAttribute("tabindex", "0"); }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || INK, fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    scene.add.text(24, 52, "ARCADE", { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "14px", color: "#ffffff", fontStyle: "bold", backgroundColor: "#E63946", padding: { x: 8, y: 2 } }).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 78, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 104, "Pairs: 0 / 6", textStyle(20));
    hudPts = scene.add.text(24, 130, "Score: 0", textStyle(22));
    hudCombo = scene.add.text(250, 130, "", textStyle(20, "#E63946"));
    hudTime = scene.add.text(W - 24, 34, "⏱ 90", textStyle(30)).setOrigin(1, 0.5);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0x102A43, 0.18); timeBarBg.fillRoundedRect(W - 24 - timeBarW, 52, timeBarW, 12, 6);
    timeBarFill = scene.add.graphics();
    drawTimeBar();
    hudMsg = scene.add.text(W - 24, 88, "Tap a card!", textStyle(20, INK)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 130);
    var bg = scene.add.graphics();
    bg.fillStyle(ACCENT, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match fast! Streaks multiply your score. +4s per pair, -2s per miss.", textStyle(18, INK)).setOrigin(0.5);
  }

  function drawTimeBar() {
    if (!timeBarFill) { return; }
    timeBarFill.clear();
    var frac = Math.max(0, Math.min(1, timeLeft / TIME_LIMIT));
    var col = frac < 0.25 ? 0xE63946 : ACCENT;
    timeBarFill.fillStyle(col, 1);
    timeBarFill.fillRoundedRect(W - 24 - timeBarW, 52, Math.max(12, timeBarW * frac), 12, 6);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    cursor = 0; firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function setCursor(scene, idx) {
    if (!cards.length) { return; }
    cursor = (idx + cards.length) % cards.length;
    if (!focusRing) {
      focusRing = scene.add.graphics().setDepth(5);
    }
    focusRing.clear();
    var c = cards[cursor];
    if (c && !c.matched) {
      focusRing.lineStyle(5, ACCENT, 1);
      focusRing.strokeRoundedRect(c.view.x - 99, c.view.y - 76, 198, 152, 24);
    }
    announce("Card " + (cursor + 1) + " of " + cards.length + (c && c.data ? ", " + c.data.name : ""));
  }

  function wireKeyboard(scene) {
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "r" || ev.key === "R") { restart(scene); return; }
      if ((!started || gameOver) && (ev.key === "Enter" || ev.key === " ")) {
        ev.preventDefault();
        if (!started && startOverlay && startOverlay.visible) { startGame(scene); return; }
        if (gameOver && endOverlay && endOverlay.visible) { restart(scene); return; }
      }
      if (!started || lockBoard || gameOver) { return; }
      var cols = 4;
      if (ev.key === "ArrowRight") { ev.preventDefault(); setCursor(scene, cursor + 1); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); setCursor(scene, cursor - 1); }
      else if (ev.key === "ArrowDown") { ev.preventDefault(); setCursor(scene, cursor + cols); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); setCursor(scene, cursor - cols); }
      else if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        var card = cards[cursor];
        if (card) { onCard(scene, card); }
      }
    });
  }

  function addScore(n) {
    score = Math.max(0, score + n);
    hudPts.setText("Score: " + score);
  }

  function setStreak(n) {
    streak = n;
    bestStreak = Math.max(bestStreak, streak);
    hudCombo.setText(streak >= 2 ? "🔥 Combo x" + streak : "");
  }

  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    var ci = cards.indexOf(card);
    if (ci >= 0) { setCursor(scene, ci); }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("First card: " + card.data.name); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        var now = Date.now();
        var fast = (now - lastMatchAt) < 8000 && lastMatchAt !== 0;
        lastMatchAt = now;
        setStreak(streak + 1);
        var gained = 100 * Math.max(1, streak) + (fast ? 25 : 0) + Math.ceil(timeLeft);
        addScore(gained);
        timeLeft = Math.min(TIME_LIMIT + 30, timeLeft + 4);
        hudTime.setText("⏱ " + Math.ceil(timeLeft));
        drawTimeBar();
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        scene.cameras.main.flash(120, 78, 168, 222);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        var msg = matches === 6 ? "You did it!" : ("+" + gained + "! Streak x" + Math.max(1, streak) + " \u{1F389}");
        hudMsg.setText(msg);
        announce("Pair found! " + card.data.name + ". " + gained + " points. " + matches + " of 6 pairs.");
        lockBoard = false;
        setCursor(scene, cursor);
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      setStreak(0);
      addScore(-15);
      timeLeft = Math.max(0, timeLeft - 2);
      hudTime.setText("⏱ " + Math.ceil(timeLeft));
      drawTimeBar();
      hudMsg.setText("Miss! -2s \u{1F340}");
      announce("No match. Minus 2 seconds.");
      scene.cameras.main.shake(180, 0.008);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; setCursor(scene, cursor); });
      }, 650);
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false; gameOver = false;
    timerRunning = true; lastMatchAt = 0;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Go! Match fast!");
    setCursor(scene, 0);
    announce("Game started. 90 seconds. Find all 6 pairs. Use arrow keys and Enter.");
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -195, 620, 390, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-310, -195, 620, 390, 30);
    var title = scene.add.text(0, -125, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "ARCADE: 90 seconds, 6 pairs!\nStreaks multiply points. +4s per pair, -2s per miss.\nArrows + Enter work too. Press R to restart.", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 85, 260, 70, 35);
    var btnTx = scene.add.text(0, 120, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 168, "Enter also starts", textStyle(16)).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 85, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function arcadeGrade() {
    if (score >= 1200 && moves <= 12) { return "S"; }
    if (score >= 900 && moves <= 16) { return "A"; }
    if (moves <= 16) { return "B"; }
    return "C";
  }

  function showWin(scene) {
    timerRunning = false; gameOver = true; lockBoard = true;
    var timeBonus = Math.ceil(timeLeft) * 5;
    addScore(timeBonus);
    endTitle.setText("\u{1F3C6} ARCADE CLEAR! \u{1F3C6}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nScore: " + score + "  (time bonus +" + timeBonus + ")\nBest combo x" + Math.max(1, bestStreak) + "  •  Rank " + arcadeGrade() + "\nEnter or Play Again for another run");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win. Score " + score + ". Rank " + arcadeGrade() + ".");
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showGameOver(scene) {
    timerRunning = false; gameOver = true; lockBoard = true;
    endTitle.setText("⏱ TIME UP!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + "  •  Best combo x" + Math.max(0, bestStreak) + "\nEnter or Play Again to retry!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time up! Try again!");
    announce("Time up. You found " + matches + " of 6 pairs. Score " + score + ".");
    scene.cameras.main.shake(300, 0.012);
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    timeLeft = TIME_LIMIT; timerRunning = true; gameOver = false;
    firstPick = null; lockBoard = false; started = true; lastMatchAt = 0;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: 0"); hudCombo.setText("");
    hudTime.setText("⏱ " + TIME_LIMIT); drawTimeBar();
    hudMsg.setText("Go! Match fast!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    if (focusRing) { focusRing.clear(); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    setCursor(scene, 0);
    announce("New arcade run. 90 seconds. Find all 6 pairs.");
  }

  function update(time, delta) {
    if (!timerRunning || !started || gameOver) { return; }
    timeLeft -= (delta || 16.7) / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      hudTime.setText("⏱ 0");
      drawTimeBar();
      showGameOver(this);
      return;
    }
    hudTime.setText("⏱ " + Math.ceil(timeLeft));
    drawTimeBar();
    if (timeLeft < 15) {
      var pulse = 1 + 0.06 * Math.sin(time / 120);
      hudTime.setScale(pulse);
    } else {
      hudTime.setScale(1);
    }
  }
})();
</script>
</body>
</html>
