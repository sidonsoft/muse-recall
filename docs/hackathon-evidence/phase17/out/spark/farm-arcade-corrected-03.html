<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a2239;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 24px rgba(78,168,222,.45)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match arcade memory game. Use arrow keys to move, Enter to flip a card, R to restart."></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#0e3554",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0, timeLeft = 60, TIME_MAX = 60, gameOver = false;
  var selected = 0, cursorG = null, lastTickSecond = -1;
  var hudMoves, hudScore, hudMsg, hudPts, hudTime, hudCombo, timeBarBg, timeBar, endOverlay, endTitle, endDetail, startOverlay;
  var audioCtx = null;

  function live(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { audioCtx = new AC(); }
      }
      if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { audioCtx = null; }
  }

  function beep(freq, dur, type, vol, when) {
    if (!audioCtx) { return; }
    try {
      var t = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + (dur || 0.12) + 0.02);
    } catch (e) {}
  }

  function sndFlip() { ensureAudio(); beep(520, 0.08, "square", 0.05); }
  function sndMatch(st) {
    ensureAudio();
    var base = 520 + Math.min(st, 6) * 90;
    beep(base, 0.1, "square", 0.07, 0);
    beep(base * 1.335, 0.14, "square", 0.07, 0.09);
  }
  function sndMiss() { ensureAudio(); beep(160, 0.22, "sawtooth", 0.07); beep(110, 0.22, "sawtooth", 0.06, 0.05); }
  function sndTick() { ensureAudio(); beep(880, 0.06, "square", 0.05); }
  function sndWin() {
    ensureAudio();
    var notes = [523, 659, 784, 1047, 784, 1047];
    notes.forEach(function (f, i) { beep(f, 0.14, "square", 0.07, i * 0.11); });
  }
  function sndLose() {
    ensureAudio();
    var notes = [392, 330, 262, 196];
    notes.forEach(function (f, i) { beep(f, 0.18, "sawtooth", 0.06, i * 0.14); });
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    updateCursor();
    live("Farmyard Match arcade. Press Enter to start. 60 seconds, match pairs to score.");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // ocean arcade sky + sea
    g.fillStyle(0xe8f6fd, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0x4ea8de, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0x2f7fb8, 1); g.fillRect(0, 470, W, 14);
    g.fillStyle(0xffffff, 0.55);
    for (var w = 0; w < 6; w++) { g.fillEllipse(90 + w * 150, 500, 110, 20); }
    g.fillStyle(0xffffff, 0.35);
    for (var w2 = 0; w2 < 6; w2++) { g.fillEllipse(160 + w2 * 150, 640, 130, 22); }
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn on the shore
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102a43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    // pier fence
    g.lineStyle(8, 0x7a5a3a, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // bubbles
    g.fillStyle(0xffffff, 0.7);
    for (var i = 0; i < 12; i++) {
      var fx = 30 + i * 74, fy = 600 + (i % 3) * 28;
      g.fillCircle(fx, fy, 3 + (i % 3));
    }
    // arcade marquee strip
    g.fillStyle(0x102a43, 1); g.fillRect(0, 0, W, 8);
    g.fillStyle(0x4ea8de, 1);
    for (var d = 10; d < W; d += 40) { g.fillCircle(d, 4, 5); }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Trebuchet MS","Segoe UI",Verdana,sans-serif', fontSize: size + "px", color: color || "#102a43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match ARCADE", textStyle(30)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 52, "Moves: 0", textStyle(20));
    hudScore = scene.add.text(24, 78, "Pairs: 0 / 6", textStyle(20));
    hudPts = scene.add.text(24, 104, "Score: 0", textStyle(22, "#0b5fa5"));
    hudCombo = scene.add.text(24, 130, "", textStyle(20, "#d35400"));
    hudTime = scene.add.text(W / 2, 52, "60", textStyle(40, "#0b5fa5")).setOrigin(0.5, 0);
    timeBarBg = scene.add.graphics();
    timeBarBg.fillStyle(0x102a43, 1); timeBarBg.fillRoundedRect(W / 2 - 130, 100, 260, 14, 7);
    timeBar = scene.add.graphics();
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(20, "#102a43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 100, 108);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-76, -24, 152, 48, 24);
    bg.lineStyle(3, 0x102a43, 1); bg.strokeRoundedRect(-76, -24, 152, 48, 24);
    var label = scene.add.text(0, 0, "\u21BB Restart (R)", textStyle(20, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-76, -24, 152, 48), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 132, "60s clock \u2022 +3s per pair \u2022 miss costs 2s \u2022 streaks boost score!", textStyle(17, "#16425b")).setOrigin(0.5);
    scene.add.text(W / 2, 156, "Arrows / WASD move \u2022 Enter flips \u2022 R restarts", textStyle(15, "#33566d")).setOrigin(0.5);
    cursorG = scene.add.graphics().setDepth(5);
    drawTimeBar();
  }

  function drawTimeBar() {
    if (!timeBar) { return; }
    timeBar.clear();
    var frac = Math.max(0, timeLeft / TIME_MAX);
    var col = frac > 0.5 ? 0x4ea8de : (frac > 0.2 ? 0xf4a259 : 0xe63946);
    timeBar.fillStyle(col, 1);
    timeBar.fillRoundedRect(W / 2 - 126, 103, Math.max(8, 252 * frac), 8, 4);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    selected = 0; firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 200, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    updateCursor();
  }

  function cardCenter(i) {
    if (!cards[i]) { return null; }
    return { x: cards[i].view.x, y: cards[i].view.y };
  }

  function updateCursor() {
    if (!cursorG) { return; }
    cursorG.clear();
    if (!started || gameOver || !cards.length) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var c = cards[selected];
    if (!c || c.matched) { return; }
    cursorG.lineStyle(5, 0xffb703, 1);
    cursorG.strokeRoundedRect(c.view.x - 100, c.view.y - 77, 200, 154, 24);
    cursorG.lineStyle(2, 0xffffff, 1);
    cursorG.strokeRoundedRect(c.view.x - 94, c.view.y - 71, 188, 142, 20);
  }

  function advanceSelection() {
    for (var i = 0; i < cards.length; i++) {
      selected = (selected + 1) % cards.length;
      if (!cards[selected].matched) { return; }
    }
  }

  function moveCursor(dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var r = Math.floor(selected / cols), c = selected % cols;
    var rows = Math.ceil(cards.length / cols);
    c = (c + dx + cols) % cols;
    r = (r + dy + rows) % rows;
    selected = Math.min(r * cols + c, cards.length - 1);
    updateCursor();
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0x102a43, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0xffd6a5, 0xffadad, 0xcaffbf];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, idx: idx };
    cont.on("pointerdown", function () { ensureAudio(); selected = idx; updateCursor(); onCard(scene, card); });
    cont.on("pointerover", function () { if (!card.matched) { selected = idx; updateCursor(); } });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function scorePopup(scene, x, y, msg, color) {
    var t = scene.add.text(x, y - 70, msg, textStyle(30, color || "#d35400")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 130, alpha: 0, scale: 1.25, duration: 900, ease: "Cubic.easeOut", onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y) {
    for (var i = 0; i < 10; i++) {
      var p = scene.add.circle(x, y, 4 + Math.random() * 4, [0x4ea8de, 0xffb703, 0xffffff, 0x90e0ef][i % 4]).setDepth(15);
      scene.tweens.add({
        targets: p,
        x: x + Phaser.Math.Between(-90, 90),
        y: y + Phaser.Math.Between(-90, 60),
        alpha: 0, duration: Phaser.Math.Between(400, 750), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p)
      });
    }
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPts.setText("Score: " + score);
    hudCombo.setText(streak >= 2 ? ("COMBO x" + streak + " \u{1F525}") : "");
    hudTime.setText(String(Math.ceil(timeLeft)));
    drawTimeBar();
  }

  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    sndFlip();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); updateCursor(); return; }
    if (card === firstPick) { return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        burst(scene, card.view.x, card.view.y);
        burst(scene, a.view.x, a.view.y);
        matches++;
        streak++;
        bestStreak = Math.max(bestStreak, streak);
        var gained = 100 + (streak - 1) * 50;
        score += gained;
        timeLeft = Math.min(TIME_MAX, timeLeft + 3);
        scorePopup(scene, card.view.x, card.view.y, "+" + gained + (streak >= 2 ? "  x" + streak + "!" : ""), streak >= 3 ? "#d35400" : "#0b5fa5");
        sndMatch(streak);
        hudMsg.setText(matches === 6 ? "You did it!" : (streak >= 3 ? "ON FIRE! x" + streak + " \u{1F525}" : (streak >= 2 ? "Combo x" + streak + "! \u{1F389}" : "Pair! +3s \u{1F389}")));
        live("Pair found! Score " + score + ". " + matches + " of 6 pairs. " + Math.ceil(timeLeft) + " seconds left.");
        refreshHud();
        lockBoard = false;
        advanceSelection();
        updateCursor();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      timeLeft = Math.max(0, timeLeft - 2);
      sndMiss();
      if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(140, 0.006); }
      hudMsg.setText("Miss! -2s \u{1F340}");
      live("No match. 2 seconds lost. " + Math.ceil(timeLeft) + " seconds left.");
      refreshHud();
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateCursor(); });
      }, 700);
    }
    refreshHud();
  }

  function startGame(scene) {
    ensureAudio();
    started = true; lockBoard = false; gameOver = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Go! Match fast!");
    live("Go! 60 seconds. Match pairs fast for combo points.");
    updateCursor();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -200, 620, 400, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-310, -200, 620, 400, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard ARCADE \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "60 seconds! Find all 6 pairs!\n+3s per pair \u2022 miss costs 2s\nBack-to-back pairs build COMBO points!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 75, "Click, or Arrows / WASD + Enter \u2022 R restarts", textStyle(17, "#33566d")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 95, 260, 70, 35);
    btnBg.lineStyle(3, 0x102a43, 1); btnBg.strokeRoundedRect(-130, 95, 260, 70, 35);
    var btnTx = scene.add.text(0, 130, "\u25B6  Start (Enter)", textStyle(28, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 95, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -25, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var hint = scene.add.text(0, 55, "Enter / click: play again", textStyle(17, "#33566d")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-150, 75, 300, 70, 35);
    btnBg.lineStyle(3, 0x102a43, 1); btnBg.strokeRoundedRect(-150, 75, 300, 70, 35);
    var btnTx = scene.add.text(0, 110, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-150, 75, 300, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); restart(scene); });
  }

  function showWin(scene) {
    gameOver = true;
    var timeBonus = Math.ceil(timeLeft) * 10;
    score += timeBonus;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    sndWin();
    refreshHud();
    endTitle.setText("\u{1F389} YOU CLEAR IT! \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nScore: " + score + " (time bonus +" + timeBonus + ")\nBest combo x" + Math.max(bestStreak, 1) + "  " + "\u2B50".repeat(stars) + "\nPress Enter or click Play Again!");
    endOverlay.setVisible(true);
    updateCursor();
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    live("You win! Score " + score + " in " + moves + " moves.");
    for (var i = 0; i < 50; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    gameOver = true;
    lockBoard = true;
    sndLose();
    if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(250, 0.01); }
    endTitle.setText("\u23F0 TIME UP!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nScore: " + score + " \u2022 Best combo x" + Math.max(bestStreak, 1) + "\nPress Enter or click to try again!");
    endOverlay.setVisible(true);
    updateCursor();
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time up! Try again!");
    live("Time up. You found " + matches + " of 6 pairs. Score " + score + ". Press Enter to play again.");
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    timeLeft = TIME_MAX; lastTickSecond = -1;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    hudMsg.setText("Go! Match fast!");
    refreshHud();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    live("New arcade round. 60 seconds. Score 0.");
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-ENTER", function () {
      ensureAudio();
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      var card = cards[selected];
      if (card) { onCard(scene, card); }
    });
    kb.on("keydown-SPACE", function () {
      ensureAudio();
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      var card = cards[selected];
      if (card) { onCard(scene, card); }
    });
    kb.on("keydown-R", function () { ensureAudio(); restart(scene); });
    kb.on("keydown-LEFT", function () { moveCursor(-1, 0); });
    kb.on("keydown-A", function () { moveCursor(-1, 0); });
    kb.on("keydown-RIGHT", function () { moveCursor(1, 0); });
    kb.on("keydown-D", function () { moveCursor(1, 0); });
    kb.on("keydown-UP", function () { moveCursor(0, -1); });
    kb.on("keydown-W", function () { moveCursor(0, -1); });
    kb.on("keydown-DOWN", function () { moveCursor(0, 1); });
    kb.on("keydown-S", function () { moveCursor(0, 1); });
    kb.on("keydown-TAB", function () { moveCursor(1, 0); });
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var dt = (delta || 16.7) / 1000;
    timeLeft -= dt;
    if (timeLeft <= 10.5 && timeLeft > 0) {
      var sec = Math.ceil(timeLeft);
      if (sec !== lastTickSecond) {
        lastTickSecond = sec;
        sndTick();
        if (hudTime) {
          var sc = hudTime.scene;
          sc.tweens.add({ targets: hudTime, scale: 1.35, yoyo: true, duration: 120 });
        }
      }
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      refreshHud();
      var scn = hudTime.scene;
      showLose(scn);
      return;
    }
    refreshHud();
  }
})();
</script>
