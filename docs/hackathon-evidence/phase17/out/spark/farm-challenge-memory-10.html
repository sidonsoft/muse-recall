<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  var game = new Phaser.Game(config);
  game.events.once("ready", function () {
    var cv = game.canvas;
    if (cv) {
      cv.setAttribute("tabindex", "0");
      cv.setAttribute("role", "application");
      cv.setAttribute("aria-label", "Farmyard memory match. Easy has 6 pairs, Hard challenge has 8 pairs. Use arrow keys and Enter to flip cards, M to switch mode, R to restart.");
    }
  });

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var mode = "easy";
  var PAIR_COUNT = 6;
  var EXTRA_ANIMALS = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F413}", name: "Rooster" }
  ];
  var hudMoves, hudScore, hudMsg, hudSub, endOverlay, endTitle, endDetail, startOverlay;
  var modeBtn, modeBtnLabel, focusIndex = 0, focusRing = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function modeAnimals() {
    return mode === "hard" ? ANIMALS.concat(EXTRA_ANIMALS) : ANIMALS;
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24, "#102A43"));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24, "#102A43"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    modeBtn = scene.add.container(W - 300, 116);
    var mbg = scene.add.graphics();
    mbg.fillStyle(0x4EA8DE, 1); mbg.fillRoundedRect(-70, -26, 140, 52, 26);
    modeBtnLabel = scene.add.text(0, 0, "\u{1F30A} Hard", textStyle(22, "#ffffff")).setOrigin(0.5);
    modeBtn.add([mbg, modeBtnLabel]);
    mbg.setInteractive(new Phaser.Geom.Rectangle(-70, -26, 140, 52), Phaser.Geom.Rectangle.Contains);
    mbg.on("pointerdown", function () { setMode(scene, mode === "hard" ? "easy" : "hard"); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#102A43")).setOrigin(0.5);
    if (scene.input && scene.input.keyboard) {
      scene.input.keyboard.on("keydown-R", function () { restart(scene); });
      scene.input.keyboard.on("keydown-M", function () { setMode(scene, mode === "hard" ? "easy" : "hard"); });
      scene.input.keyboard.on("keydown-LEFT", function () { moveFocus(scene, -1, 0); });
      scene.input.keyboard.on("keydown-RIGHT", function () { moveFocus(scene, 1, 0); });
      scene.input.keyboard.on("keydown-UP", function () { moveFocus(scene, 0, -1); });
      scene.input.keyboard.on("keydown-DOWN", function () { moveFocus(scene, 0, 1); });
      scene.input.keyboard.on("keydown-ENTER", function () { activateFocused(scene); });
      scene.input.keyboard.on("keydown-SPACE", function () { activateFocused(scene); });
    }
  }

  function setMode(scene, next) {
    mode = next;
    PAIR_COUNT = mode === "hard" ? 8 : 6;
    modeBtnLabel.setText(mode === "hard" ? "\u{1F423} Easy" : "\u{1F30A} Hard");
    hudSub.setText(mode === "hard" ? "Challenge: find all 8 animal pairs!" : "Find the 6 animal pairs!");
    restart(scene);
  }

  function gridCols() { return 4; }
  function gridRows() { return mode === "hard" ? 4 : 3; }

  function shuffledDeck() {
    var deck = [];
    var pool = modeAnimals();
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIndex = 0;
    var deck = shuffledDeck();
    var cols = gridCols(), rows = gridRows();
    var cw = 185, ch = mode === "hard" ? 105 : 140, gx = 62, gy = 195, padX = 22, padY = mode === "hard" ? 12 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    drawFocusRing(scene);
  }

  function drawFocusRing(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length) { return; }
    var card = cards[focusIndex];
    if (!card) { return; }
    var w = card.w || 185, h = card.h || 140;
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, 0x102A43, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function moveFocus(scene, dx, dy) {
    if (!started || !cards.length) { return; }
    var cols = gridCols();
    var next = focusIndex + dx + dy * cols;
    if (next < 0 || next >= cards.length) { return; }
    focusIndex = next;
    drawFocusRing(scene);
  }

  function activateFocused(scene) {
    if (!started) {
      if (startOverlay && startOverlay.visible) {
        started = true; lockBoard = false;
        startOverlay.setVisible(false);
        hudMsg.setText("Tap a card!");
      }
      return;
    }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    var card = cards[focusIndex];
    if (card) { onCard(scene, card); }
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var small = h < 120;
    var emo = scene.add.text(0, small ? -12 : -18, data.emoji, { fontSize: small ? "44px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, small ? 30 : 44, data.name, textStyle(small ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () {
      for (var i = 0; i < cards.length; i++) { if (cards[i] === card) { focusIndex = i; break; } }
      drawFocusRing(scene);
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + PAIR_COUNT);
        hudMsg.setText(matches === PAIR_COUNT ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === PAIR_COUNT) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function startGame(scene, hard) {
    setModeSilent(hard ? "hard" : "easy");
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    drawFocusRing(scene);
  }

  function setModeSilent(next) {
    mode = next;
    PAIR_COUNT = mode === "hard" ? 8 : 6;
    if (modeBtnLabel) { modeBtnLabel.setText(mode === "hard" ? "\u{1F423} Easy" : "\u{1F30A} Hard"); }
    if (hudSub) { hudSub.setText(mode === "hard" ? "Challenge: find all 8 animal pairs!" : "Find the 6 animal pairs!"); }
    moves = 0; matches = 0; firstPick = null;
    if (hudMoves) { hudMoves.setText("Moves: 0"); }
    if (hudScore) { hudScore.setText("Pairs: 0 / " + PAIR_COUNT); }
    buildBoard(startOverlay.scene);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Flip the cards and find the pairs!\nEasy: 6 pairs. Hard: 8 pairs.", Object.assign(textStyle(23, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 28, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x4EA8DE, 1); easyBg.fillRoundedRect(-272, 80, 250, 70, 35);
    var easyTx = scene.add.text(-147, 115, "\u25B6 Easy: 6", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x102A43, 1); hardBg.fillRoundedRect(22, 80, 250, 70, 35);
    var hardTx = scene.add.text(147, 115, "\u{1F30A} Hard: 8", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 165, "Keys: 1 = Easy, 2 = Hard, arrows + Enter flip cards", textStyle(15, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, easyBg, easyTx, hardBg, hardTx, hint]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-272, 80, 250, 70), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { startGame(scene, false); });
    hardBg.setInteractive(new Phaser.Geom.Rectangle(22, 80, 250, 70), Phaser.Geom.Rectangle.Contains);
    hardBg.on("pointerdown", function () { startGame(scene, true); });
    if (scene.input && scene.input.keyboard) {
      scene.input.keyboard.on("keydown-ONE", function () { if (startOverlay.visible) { startGame(scene, false); } });
      scene.input.keyboard.on("keydown-TWO", function () { if (startOverlay.visible) { startGame(scene, true); } });
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = mode === "hard"
      ? (moves <= 16 ? 3 : (moves <= 24 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    var modeLine = mode === "hard" ? "Hard mode cleared! " : "";
    endDetail.setText(modeLine + "You found all " + PAIR_COUNT + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + PAIR_COUNT); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
