<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #game:focus{outline:3px solid #ffb703;outline-offset:4px;border-radius:18px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" tabindex="0" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to move between cards, Enter to flip, R to restart."></div>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, streak = 0, bestStreak = 0, timeLeft = 90, timeUp = false;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  var hudPts, hudTime, hudCombo, focusRing, focusIndex = 0, timerEvent = null;
  var TOTAL_TIME = 90, MISS_PENALTY = 3, audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    focusRing = s.add.graphics().setDepth(5);
    drawFocus();
    makeStartOverlay(s);
    makeEndOverlay(s);
    document.addEventListener("keydown", function (e) { handleKey(e, s); });
    announce("Farmyard Match loaded. Press Enter to start.");
  }

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.value = 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + (dur || 0.12));
    } catch (e) { /* audio is decoration only */ }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudPts = scene.add.text(24, 122, "Score: 0", textStyle(24, "#a35b00"));
    hudCombo = scene.add.text(24, 150, "Streak: -", textStyle(20, "#7a4a2b"));
    hudTime = scene.add.text(W - 24, 22, "\u23F1 90", textStyle(30, "#5b3a29")).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function updateTimeHud() {
    if (!hudTime) { return; }
    hudTime.setText("\u23F1 " + timeLeft);
    hudTime.setColor(timeLeft <= 15 ? "#d00000" : "#5b3a29");
  }

  function updateComboHud() {
    if (!hudCombo) { return; }
    hudCombo.setText(streak >= 2 ? "Streak: x" + streak + " COMBO!" : (streak === 1 ? "Streak: x1" : "Streak: -"));
  }

  function drawFocus() {
    if (!focusRing || !cards.length) { return; }
    focusRing.clear();
    if (!started || timeUp) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIndex];
    if (!card) { return; }
    var w = 185 + 12, h = 140 + 12;
    focusRing.lineStyle(5, 0xffb703, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2, card.view.y - h / 2, w, h, 26);
  }

  function setFocus(idx, scene, quiet) {
    if (!cards.length) { return; }
    focusIndex = (idx + cards.length) % cards.length;
    drawFocus();
    if (!quiet && cards[focusIndex]) {
      var d = cards[focusIndex].data;
      var row = Math.floor(focusIndex / 4) + 1, col = (focusIndex % 4) + 1;
      announce(d.name + ", row " + row + " column " + col + (cards[focusIndex].matched ? ", matched" : ""));
    }
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      var made = makeCard(scene, cx, cy, cw, ch, card);
      made.index = idx;
      cards.push(made);
    });
    drawFocus();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: -1 };
    cont.on("pointerdown", function () { setFocus(card.index, scene, true); drawFocus(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function scorePopup(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(26, color || "#a35b00")).setOrigin(0.5).setDepth(8);
    scene.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, onComplete: function () { t.destroy(); } });
  }

  function matchBurst(scene, x, y) {
    var bits = ["\u2B50", "\u{1F389}", "\u2728"];
    for (var i = 0; i < 8; i++) {
      var p = scene.add.text(x, y, bits[i % bits.length], { fontSize: "22px" }).setOrigin(0.5).setDepth(8);
      scene.tweens.add({
        targets: p,
        x: x + Phaser.Math.Between(-90, 90),
        y: y + Phaser.Math.Between(-80, 40),
        alpha: 0, duration: Phaser.Math.Between(500, 900),
        onComplete: (function (t) { return function () { t.destroy(); }; })(p)
      });
    }
  }

  function onCard(scene, card) {
    if (!started || timeUp || lockBoard || card.faceUp || card.matched) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    flip(card, true);
    beep(660, 0.08, "square");
    announce(card.data.name + " flipped.");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (timeUp) { return; }
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var pts = 100 + (streak - 1) * 25;
        score += pts;
        hudPts.setText("Score: " + score);
        updateComboHud();
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "You did it!" : (streak >= 2 ? "COMBO x" + streak + "! \u{1F525}" : "Yay! A pair! \u{1F389}"));
        announce("Pair found! " + card.data.name + ". +" + pts + " points." + (streak >= 2 ? " Combo times " + streak + "." : ""));
        beep(880, 0.1, "square");
        setTimeout(function () { beep(1174, 0.14, "square"); }, 90);
        matchBurst(scene, card.view.x, card.view.y);
        scorePopup(scene, card.view.x, card.view.y - 70, "+" + pts + (streak >= 2 ? " COMBO x" + streak : ""));
        lockBoard = false;
        drawFocus();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      updateComboHud();
      timeLeft = Math.max(0, timeLeft - MISS_PENALTY);
      updateTimeHud();
      hudMsg.setText("Miss! -" + MISS_PENALTY + "s \u{1F340}");
      announce("No match. Minus " + MISS_PENALTY + " seconds. " + timeLeft + " seconds left.");
      beep(180, 0.2, "sawtooth");
      try { scene.cameras.main.shake(150, 0.006); } catch (e) { /* older canvas fallback */ }
      scorePopup(scene, card.view.x, card.view.y - 70, "-" + MISS_PENALTY + "s", "#d00000");
      var delay = Math.max(400, 700 - matches * 50);
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, delay);
      if (timeLeft <= 0) { onTimeUp(scene); }
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -132, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -58, "Find all 6 pairs before the clock runs out!\nMatches build COMBO bonus. Misses cost 3s!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 22, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 62, "Arrows move \u2022 Enter flips \u2022 R restarts", textStyle(17, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    started = true; timeUp = false; lockBoard = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Beat the clock!");
    setFocus(focusIndex, scene, true);
    drawFocus();
    startTimer(scene);
    announce("Go! Find all 6 pairs before time runs out. " + timeLeft + " seconds left.");
    beep(523, 0.1, "square");
    setTimeout(function () { beep(784, 0.14, "square"); }, 100);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(); timerEvent = null; }
  }

  function startTimer(scene) {
    stopTimer();
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started || timeUp) { return; }
      if (endOverlay && endOverlay.visible) { return; }
      timeLeft--;
      if (timeLeft <= 10 && timeLeft > 0) { beep(440, 0.08, "square"); }
      if (timeLeft <= 0) { timeLeft = 0; updateTimeHud(); onTimeUp(scene); return; }
      updateTimeHud();
    }});
  }

  function showWin(scene) {
    stopTimer();
    var bonus = timeLeft * 5;
    score += bonus;
    hudPts.setText("Score: " + score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs in " + moves + " moves!\nTime bonus +" + bonus + "  Best combo x" + Math.max(bestStreak, 1) + "\nScore: " + score + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    if (focusRing) { focusRing.clear(); }
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win! Score " + score + " in " + moves + " moves. Press Enter to play again.");
    [523, 659, 784, 1046].forEach(function (f, i) {
      setTimeout(function () { beep(f, 0.15, "square"); }, i * 120);
    });
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function onTimeUp(scene) {
    if (timeUp) { return; }
    timeUp = true;
    stopTimer();
    lockBoard = true;
    firstPick = null;
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nMoves: " + moves + "  Score: " + score + "\nPress Enter for another run!");
    endOverlay.setVisible(true);
    if (focusRing) { focusRing.clear(); }
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    announce("Time's up! You found " + matches + " of 6 pairs. Score " + score + ". Press Enter to play again.");
    [400, 300, 220].forEach(function (f, i) {
      setTimeout(function () { beep(f, 0.18, "sawtooth"); }, i * 150);
    });
    try { scene.cameras.main.shake(250, 0.01); } catch (e) { /* older canvas fallback */ }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0;
    timeLeft = TOTAL_TIME; timeUp = false;
    firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPts.setText("Score: 0"); hudMsg.setText("Beat the clock!");
    updateComboHud(); updateTimeHud();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    setFocus(0, scene, true);
    drawFocus();
    startTimer(scene);
    announce("New game. " + timeLeft + " seconds on the clock. Good luck!");
  }

  function handleKey(e, scene) {
    var k = e.key;
    if (startOverlay && startOverlay.visible) {
      if (k === "Enter" || k === " ") { startGame(scene); }
      return;
    }
    if (endOverlay && endOverlay.visible) {
      if (k === "Enter" || k === " " || k === "r" || k === "R") { restart(scene); }
      return;
    }
    if (k === "r" || k === "R") { restart(scene); return; }
    if (!started || timeUp || lockBoard) { return; }
    if (k === "ArrowLeft") { setFocus(focusIndex - 1, scene); }
    else if (k === "ArrowRight") { setFocus(focusIndex + 1, scene); }
    else if (k === "ArrowUp") { setFocus(focusIndex - 4, scene); }
    else if (k === "ArrowDown") { setFocus(focusIndex + 4, scene); }
    else if (k === "Enter" || k === " ") {
      var card = cards[focusIndex];
      if (card) { onCard(scene, card); }
    }
  }

  function update(time, delta) {
    if (hudTime && started && !timeUp && timeLeft <= 15 && (!endOverlay || !endOverlay.visible)) {
      var pulse = 1 + 0.08 * Math.sin(time / 150);
      hudTime.setScale(pulse);
    } else if (hudTime) {
      hudTime.setScale(1);
    }
  }
})();
