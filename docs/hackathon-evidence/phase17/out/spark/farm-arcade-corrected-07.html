<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d3b5e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#0d3b5e",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, combo = 0, bestCombo = 0, timeLeft = 75, gameOver = false;
  var focusIndex = 0;
  var hudMoves, hudScore, hudMsg, hudTime, hudScoreText, hudCombo, endOverlay, endTitle, endDetail, startOverlay;
  var focusRing = null;
  var ACCENT = "#4EA8DE", INK = "#102A43";

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    enableKeyboard(s);
    updateArcadeHud();
    updateFocusRing();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0x0d3b5e, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0x12607e, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.12); g.fillCircle(770, 110, 55);
    g.fillStyle(0x4ea8de, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0x1b6f8f, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102a43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xbde0fe, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xbde0fe, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x4ea8de, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Segoe UI",Verdana,sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 12, "\u{1F33B} Farmyard Match: ARCADE", textStyle(30, "#ffffff")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 52, "Moves: 0", textStyle(22, "#bde0fe"));
    hudScore = scene.add.text(24, 80, "Pairs: 0 / 6", textStyle(22, "#bde0fe"));
    hudScoreText = scene.add.text(24, 108, "Score: 0", textStyle(24, "#ffd166"));
    hudTime = scene.add.text(24, 138, "Time: 75", textStyle(26, "#4EA8DE"));
    hudCombo = scene.add.text(W / 2, 168, "", textStyle(22, "#ffd166")).setOrigin(0.5);
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(22, "#ffffff")).setOrigin(1, 0);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart (R)", textStyle(22, "#102A43")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 140, "Match fast! Miss resets combo. +4s per pair!", textStyle(20, "#caf0f8")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    updateFocusRing();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0x102a43, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xbde0fe, 0xcaf0f8, 0x90e0ef, 0xade8f4, 0xccf5ff, 0x48cae4];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () {
      for (var i = 0; i < cards.length; i++) { if (cards[i] === card) { focusIndex = i; } }
      updateFocusRing();
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function addScorePopup(scene, x, y, text, color) {
    var p = scene.add.text(x, y, text, textStyle(28, color || "#ffd166")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: p, y: y - 60, alpha: 0, duration: 900, onComplete: function () { p.destroy(); } });
  }

  function updateArcadeHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudScoreText.setText("Score: " + score);
    hudTime.setText("Time: " + Math.ceil(timeLeft));
    hudTime.setColor(timeLeft <= 10 ? "#ff5d5d" : "#4EA8DE");
    hudCombo.setText(combo >= 2 ? ("COMBO x" + combo + " \u{1F525}") : "");
  }

  function onCard(scene, card) {
    if (!started || gameOver || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    updateArcadeHud();
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        combo++;
        if (combo > bestCombo) { bestCombo = combo; }
        var gained = 100 * combo + Math.ceil(timeLeft);
        score += gained;
        timeLeft += 4;
        addScorePopup(scene, card.view.x, card.view.y - 80, "+" + gained, "#ffd166");
        updateArcadeHud();
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "You did it!" : ("Nice! +" + gained + (combo >= 2 ? "  COMBO x" + combo : "")));
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      score = Math.max(0, score - 25);
      updateArcadeHud();
      hudMsg.setText("Miss! -25  \u{1F340}");
      if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(150, 0.004); }
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function startGame(scene) {
    started = true; gameOver = false; lockBoard = false;
    timeLeft = 75;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    updateArcadeHud();
    hudMsg.setText("Go! Beat the clock!");
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102a43, 0.62); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -130, "\u{1F33B} Farmyard Match: ARCADE \u{1F404}", textStyle(34)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "75 seconds! Chain pairs for COMBO x2, x3...\nMatch: 100 x combo + time bonus (+4s)\nMiss: -25 pts, combo lost. Arrows + Enter work!", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start (Enter)", textStyle(28, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again (R)", textStyle(26, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    gameOver = true; lockBoard = true;
    var timeBonus = Math.ceil(timeLeft) * 10;
    score += timeBonus;
    updateArcadeHud();
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} ARCADE CLEAR! \u{1F389}");
    endDetail.setText("All 6 pairs! Time bonus +" + timeBonus + "\nScore: " + score + "  Moves: " + moves + "\nBest combo: x" + Math.max(bestCombo, 1) + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    gameOver = true; lockBoard = true;
    endTitle.setText("\u23F0 TIME UP!");
    endDetail.setText("Pairs: " + matches + " / 6   Score: " + score + "\nBest combo: x" + Math.max(bestCombo, 0) + "\nPress R or Play Again!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time up! Try again!");
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; combo = 0; bestCombo = 0; timeLeft = 75;
    firstPick = null; lockBoard = false; started = true; gameOver = false;
    updateArcadeHud(); hudMsg.setText("Go! Beat the clock!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function updateFocusRing() {
    if (!cards.length) { return; }
    var scene = cards[0].view.scene;
    if (focusIndex < 0) { focusIndex = 0; }
    if (focusIndex >= cards.length) { focusIndex = cards.length - 1; }
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    var target = cards[focusIndex];
    if (!target || target.matched) { return; }
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, 0xffd166, 1);
    focusRing.strokeRoundedRect(target.view.x - 98, target.view.y - 75, 196, 150, 24);
  }

  function moveFocus(dir) {
    if (!cards.length) { return; }
    var cols = 4;
    var next = focusIndex;
    if (dir === "left") { next = (focusIndex + cards.length - 1) % cards.length; }
    else if (dir === "right") { next = (focusIndex + 1) % cards.length; }
    else if (dir === "up") { next = (focusIndex + cards.length - cols) % cards.length; }
    else if (dir === "down") { next = (focusIndex + cols) % cards.length; }
    focusIndex = next;
    updateFocusRing();
  }

  function enableKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-LEFT", function () { moveFocus("left"); });
    kb.on("keydown-A", function () { moveFocus("left"); });
    kb.on("keydown-RIGHT", function () { moveFocus("right"); });
    kb.on("keydown-D", function () { moveFocus("right"); });
    kb.on("keydown-UP", function () { moveFocus("up"); });
    kb.on("keydown-W", function () { moveFocus("up"); });
    kb.on("keydown-DOWN", function () { moveFocus("down"); });
    kb.on("keydown-S", function () { moveFocus("down"); });
    kb.on("keydown-ENTER", function () { activateFocused(scene); });
    kb.on("keydown-SPACE", function () { activateFocused(scene); });
    kb.on("keydown-R", function () { restart(scene); });
  }

  function activateFocused(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    var card = cards[focusIndex];
    if (card) { onCard(scene, card); }
  }

  function update(time, delta) {
    if (!started || gameOver) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    timeLeft -= delta / 1000;
    if (timeLeft <= 0) {
      timeLeft = 0;
      updateArcadeHud();
      var scene = hudTime.scene;
      showLose(scene);
      return;
    }
    hudTime.setText("Time: " + Math.ceil(timeLeft));
    hudTime.setColor(timeLeft <= 10 ? "#ff5d5d" : "#4EA8DE");
  }
})();
</script>
</body>
</html>
