<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Match Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d6eaf8;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.25)}
  #status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard match arcade game. Use arrow keys to choose a card and Enter to flip it."></div>
<div id="status" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#d6eaf8",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, round = 1;
  var focusIndex = 0, focusRing = null, bubbles = [];
  var hudMoves, hudScore, hudMsg, hudExtra, endOverlay, endTitle, endDetail, startOverlay, nextBtnBg, nextBtnTx;
  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeBubbles(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeys(s);
  }
  function makeBubbles(scene) {
    // slow rising bubbles: ambient motion only, no flashing
    for (var i = 0; i < 14; i++) {
      var b = scene.add.circle(
        Phaser.Math.Between(20, W - 20),
        Phaser.Math.Between(200, H),
        Phaser.Math.Between(3, 8),
        0xffffff, 0.35
      ).setDepth(1);
      b.speed = Phaser.Math.FloatBetween(12, 32);
      b.wobble = Phaser.Math.FloatBetween(0, Math.PI * 2);
      bubbles.push(b);
    }
  }
  function setupKeys(scene) {
    function moveFocus(dx, dy) {
      if (!cards.length) { return; }
      var cols = 4;
      var next = (focusIndex + dx + dy * cols + cards.length) % cards.length;
      focusIndex = next;
      drawFocus();
    }
    function flipFocused() {
      if (!started) { return; }
      if (startOverlay && startOverlay.visible) { return; }
      if (endOverlay && endOverlay.visible) { return; }
      var card = cards[focusIndex];
      if (card) { onCard(scene, card); }
    }
    scene.input.keyboard.on("keydown-LEFT", function () { moveFocus(-1, 0); });
    scene.input.keyboard.on("keydown-RIGHT", function () { moveFocus(1, 0); });
    scene.input.keyboard.on("keydown-UP", function () { moveFocus(0, -1); });
    scene.input.keyboard.on("keydown-DOWN", function () { moveFocus(0, 1); });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { nextRound(scene); return; }
      flipFocused();
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { nextRound(scene); return; }
      flipFocused();
    });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
  }
  function startGame(scene) {
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Tap a card! Round " + round);
    announce("Round " + round + " started. Find all 6 pairs to score!");
    drawFocus();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // cool ocean palette: air, sea bands, sandy shore
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xbde0fe, 1); g.fillRect(0, 300, W, 170);
    g.fillStyle(0xcaf0f8, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // gentle waves (static arcs, animated bubbles come from update)
    g.lineStyle(5, 0xffffff, 0.8);
    for (var wxi = 0; wxi < 6; wxi++) {
      g.strokeCircle(90 + wxi * 140, 420, 34);
    }
    // barn keeps its shape, repainted in ocean accent
    g.fillStyle(0x4ea8de, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2a7ca8, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence in deep sea tone
    g.lineStyle(8, 0x5e60ce, 0.65);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers / shells along the shore
    var cols = [0x4ea8de, 0x48c9b0, 0x90be6d, 0x5e60ce];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a7ca8, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match Arcade", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudExtra = scene.add.text(24, 122, "Round 1  \u2022  Score 0  \u2022  Streak x0", textStyle(22));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#2a7ca8")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    btn.setSize(172, 52);
    btn.setInteractive({ useHandCursor: true });
    btn.on("pointerdown", function () { restart(scene); });
    btn.on("pointerover", function () { btn.setScale(1.06); });
    btn.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match pairs to score \u2014 streaks earn bonus points!", textStyle(22, "#2a7ca8")).setOrigin(0.5);
    scene.add.text(W / 2, 646, "Arrows: choose \u2022 Enter: flip \u2022 R: restart", textStyle(18, "#2a7ca8")).setOrigin(0.5);
  }
  function refreshExtra() {
    if (hudExtra) { hudExtra.setText("Round " + round + "  \u2022  Score " + score + "  \u2022  Streak x" + streak); }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function peekDelay() {
    // Later rounds flip back a little faster: a gentle challenge, never a timer.
    return Math.max(420, 700 - (round - 1) * 80);
  }
  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(true); });
    cards = [];
    firstPick = null;
    focusIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 128, gx = 62, gy = 195, padX = 22, padY = 14;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (!focusRing) {
      focusRing = scene.add.graphics().setDepth(5);
    }
    drawFocus();
  }
  function drawFocus() {
    if (!focusRing || !cards.length) { return; }
    focusRing.clear();
    var card = cards[focusIndex];
    if (!card || card.matched) {
      // focus the first unmatched card so keyboard play never gets stuck
      for (var i = 0; i < cards.length; i++) {
        if (!cards[i].matched) { focusIndex = i; card = cards[i]; break; }
      }
    }
    if (!card) { return; }
    focusRing.lineStyle(5, 0x102a43, 1);
    focusRing.strokeRoundedRect(card.view.x - 98, card.view.y - 69, 196, 138, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xbde0fe, 0xa2d2ff, 0x90e0c8, 0xcdeffd, 0xdbe9ff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, index: cards.length };
    cont.on("pointerdown", function () { focusIndex = card.index; drawFocus(); onCard(scene, card); });
    cont.on("pointerover", function () { focusIndex = card.index; drawFocus(); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function addScorePopup(scene, x, y, text) {
    var p = scene.add.text(x, y - 60, text, textStyle(28, "#2a7ca8")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: p, y: y - 120, alpha: 0, duration: 900, ease: "Sine.easeOut",
      onComplete: function () { p.destroy(); } });
  }
  function splashRing(scene, x, y) {
    // one slow expanding ring: gentle celebration, no flashing or blinking
    var g = scene.add.graphics().setDepth(6);
    g.lineStyle(6, 0x4ea8de, 0.9);
    g.strokeCircle(x, y, 20);
    var s = { r: 20, a: 0.9 };
    scene.tweens.add({ targets: s, r: 95, a: 0, duration: 600, ease: "Sine.easeOut",
      onUpdate: function () {
        g.clear();
        g.lineStyle(6, 0x4ea8de, Math.max(0, s.a));
        g.strokeCircle(x, y, s.r);
      },
      onComplete: function () { g.destroy(); } });
  }
  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("First card: " + card.data.name); drawFocus(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        // gentle arcade pop: grow once and settle, no flashing
        scene.tweens.add({ targets: [a.view, card.view], scale: { from: 1, to: 1.1 }, duration: 170, yoyo: true, ease: "Sine.easeInOut" });
        splashRing(scene, card.view.x, card.view.y);
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 25;
        score += gained;
        addScorePopup(scene, card.view.x, card.view.y, "+" + gained);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        refreshExtra();
        var msg = matches === 6 ? "You did it! Score " + score + "!" : "Yay! A pair! +" + gained + " \u{1F389}";
        if (streak >= 2 && matches < 6) { msg += " Streak x" + streak + "!"; }
        hudMsg.setText(msg);
        announce(msg);
        lockBoard = false;
        drawFocus();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      // mistakes never cost points: the streak simply starts fresh next try
      streak = 0;
      refreshExtra();
      hudMsg.setText("Try again! \u{1F340}");
      announce("Not a pair. " + a.data.name + " and " + card.data.name + ". Try again!");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, peekDelay());
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match Arcade \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -45, "Flip cards, find all 6 pairs,\nand build a scoring streak!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} Round Clear! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    nextBtnBg = scene.add.graphics();
    nextBtnBg.fillStyle(0x4ea8de, 1); nextBtnBg.fillRoundedRect(-140, 45, 280, 70, 35);
    nextBtnTx = scene.add.text(0, 80, "\u25B6 Next Round", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, nextBtnBg, nextBtnTx]);
    nextBtnBg.setInteractive(new Phaser.Geom.Rectangle(-140, 45, 280, 70), Phaser.Geom.Rectangle.Contains);
    nextBtnBg.on("pointerdown", function () { nextRound(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    var extra = round > 1 ? "\nCards flip back a little faster each round!" : "\nNext round hides cards a little faster!";
    endDetail.setText("You found all 6 pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) +
      "\nScore: " + score + "  \u2022  Best streak: x" + bestStreak + extra);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Round " + round + " clear! \u{1F389}");
    announce("Round " + round + " clear! Score " + score + ". Press Next Round to keep playing.");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      // slow one-way fall: celebration drift, no flashing
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1600, 2600), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function nextRound(scene) {
    // arcade progression: score carries over, board reshuffles, peek time shrinks
    round++;
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); refreshExtra();
    hudMsg.setText("Round " + round + ": tap a card!");
    announce("Round " + round + " started. Score carries over: " + score + " points.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(true); });
    buildBoard(scene);
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0; round = 1;
    firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); refreshExtra();
    hudMsg.setText("Tap a card!");
    announce("Game restarted. Round 1, score zero.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(true); });
    buildBoard(scene);
  }

  function update(time, delta) {
    // slow ambient bubble drift; guard for headless smoke tests without tweens
    if (!bubbles.length || !delta) { return; }
    var dt = Math.min(delta, 100) / 1000;
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.wobble += dt * 0.8;
      b.y -= b.speed * dt;
      b.x += Math.sin(b.wobble) * 8 * dt;
      if (b.y < 180) {
        b.y = 690;
        b.x = Phaser.Math.Between(20, W - 20);
      }
    }
  }
})();
</script>
</body>
</html>
