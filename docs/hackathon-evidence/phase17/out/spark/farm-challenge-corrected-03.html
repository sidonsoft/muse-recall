<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #keys{font-size:13px;color:#102A43;background:#fdf6ec;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="wrap">
<div id="game" role="application" aria-label="Farmyard memory match card game"></div>
<div id="keys">Keyboard: arrow keys choose a card, Enter or Space flips it. Press 1 for Relaxed, 2 for Challenge, R to restart.</div>
</div>
<div id="live" class="vh" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var EXTRA_ANIMALS = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F986}", name: "Duck" }
  ];
  // Ocean-accented challenge theme: primary accent #4EA8DE, dark text #102A43.
  var MODES = {
    relaxed: { id: "relaxed", label: "Relaxed", pairs: 6, cols: 4, rows: 3, flipBackMs: 700, timeLimit: 0 },
    challenge: { id: "challenge", label: "Challenge", pairs: 8, cols: 4, rows: 4, flipBackMs: 400, timeLimit: 120 }
  };
  var mode = "relaxed";
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var timeLeft = 0, timerEvent = null, focusIndex = 0, focusRing = null, gameOver = false;
  var hudMoves, hudScore, hudMsg, hudMode, hudTimer, hudSub, endOverlay, endTitle, endDetail, startOverlay;
  var startModeDesc;

  function live(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }
  function fmtTime(sec) {
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + ":" + (r < 10 ? "0" + r : "" + r);
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    focusRing = s.add.graphics().setDepth(5);
    makeStartOverlay(s);
    makeEndOverlay(s);
    drawFocus();
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMode = scene.add.text(24, 122, "Mode: Relaxed  (press C to switch)", textStyle(18, "#102A43"));
    hudMode.setInteractive({ useHandCursor: true });
    hudMode.on("pointerdown", function () { toggleMode(scene); });
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    hudTimer = scene.add.text(W - 24, 152, "", textStyle(22, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    refreshHudMode();
  }

  function refreshHudMode() {
    var cfg = MODES[mode];
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + cfg.pairs); }
    if (hudMode) { hudMode.setText("Mode: " + cfg.label + "  (press C to switch)"); }
    if (hudSub) {
      hudSub.setText(mode === "challenge"
        ? "Challenge: find " + cfg.pairs + " pairs before the clock runs out!"
        : "Find the " + cfg.pairs + " animal pairs!");
    }
    if (hudTimer) {
      hudTimer.setText(mode === "challenge" && started ? "Time: " + fmtTime(timeLeft) : "");
    }
  }

  function toggleMode(scene) {
    setMode(scene, mode === "challenge" ? "relaxed" : "challenge");
  }

  function setMode(scene, next) {
    if (!MODES[next]) { return; }
    mode = next;
    if (startModeDesc) {
      startModeDesc.setText(next === "challenge"
        ? "Challenge: 8 pairs, 2:00 clock, mismatches hide fast."
        : "Relaxed: 6 pairs, no clock. Learn the board.");
    }
    var overlayUp = startOverlay && startOverlay.visible;
    restart(scene);
    if (overlayUp) {
      // restart() starts play; when the start overlay is up we stay on it.
      started = false; lockBoard = true;
      if (startOverlay) { startOverlay.setVisible(true); }
      if (endOverlay) { endOverlay.setVisible(false); }
      stopTimer();
      refreshHudMode();
    }
    live("Mode: " + MODES[mode].label);
  }

  function shuffledDeck() {
    var deck = [];
    var pool = ANIMALS.concat(EXTRA_ANIMALS).slice(0, MODES[mode].pairs);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIndex = 0;
    var cfg = MODES[mode];
    var deck = shuffledDeck();
    var cols = cfg.cols;
    var cw = 185, ch = cfg.rows > 3 ? 102 : 140, gx = 62, gy = 195, padX = 22, padY = cfg.rows > 3 ? 12 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    drawFocus();
  }

  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || !cards.length || gameOver) { return; }
    var card = cards[Math.min(focusIndex, cards.length - 1)];
    if (!card || card.matched) { return; }
    var w = card.view.width || 185, h = card.h || 140;
    focusRing.lineStyle(5, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function moveFocus(dx, dy) {
    var cfg = MODES[mode];
    var cols = cfg.cols;
    var i = focusIndex + dx + dy * cols;
    if (i < 0) { i = 0; }
    if (i > cards.length - 1) { i = cards.length - 1; }
    focusIndex = i;
    drawFocus();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { focusIndex = cards.indexOf(card); drawFocus(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || gameOver || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) {
      firstPick = card; hudMsg.setText("One more!");
      live("First card: " + card.data.name);
      drawFocus();
      return;
    }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var cfg = MODES[mode];
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + cfg.pairs);
        var done = matches === cfg.pairs;
        hudMsg.setText(done ? "You did it!" : "Yay! A pair! \u{1F389}");
        live(done ? "All pairs found!" : "Pair found: " + card.data.name + ". " + matches + " of " + cfg.pairs + ".");
        lockBoard = false;
        drawFocus();
        if (done) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      live("No match: " + a.data.name + " and " + card.data.name + ".");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, cfg.flipBackMs);
    }
  }

  function startGame(scene, chosen) {
    mode = MODES[chosen] ? chosen : "relaxed";
    var cfg = MODES[mode];
    started = true; lockBoard = false; gameOver = false;
    moves = 0; matches = 0; firstPick = null; focusIndex = 0;
    hudMoves.setText("Moves: 0");
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    buildBoard(scene);
    refreshHudMode();
    startTimer(scene);
    hudMsg.setText(mode === "challenge" ? "Challenge: beat the clock!" : "Tap a card!");
    live(mode === "challenge"
      ? "Challenge mode: find " + cfg.pairs + " pairs in " + fmtTime(cfg.timeLimit) + "."
      : "Relaxed mode: find " + cfg.pairs + " pairs.");
    drawFocus();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -215, 620, 430, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -215, 620, 430, 30);
    var title = scene.add.text(0, -155, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -95, "Flip the cards and find the animal pairs!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    startModeDesc = scene.add.text(0, 18, "Relaxed: 6 pairs, no clock. Learn the board.", Object.assign(textStyle(19, "#102A43"), { align: "center" })).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x5da85f, 1); easyBg.fillRoundedRect(-280, 55, 265, 68, 34);
    var easyTx = scene.add.text(-147, 89, "\u25B6 Relaxed", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x4EA8DE, 1); hardBg.fillRoundedRect(15, 55, 265, 68, 34);
    var hardTx = scene.add.text(147, 89, "\u2605 Challenge", textStyle(26, "#ffffff")).setOrigin(0.5);
    var keys = scene.add.text(0, 160, "Keys: 1 = Relaxed   2 = Challenge   Enter = start", textStyle(17, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, startModeDesc, easyBg, easyTx, hardBg, hardTx, keys]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-280, 55, 265, 68), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(15, 55, 265, 68), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { startGame(scene, "relaxed"); });
    hardBg.on("pointerdown", function () { startGame(scene, "challenge"); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function starLine(n) {
    var s = "";
    for (var i = 0; i < n; i++) { s += "\u2B50"; }
    return s;
  }

  function showWin(scene) {
    stopTimer();
    gameOver = true;
    var cfg = MODES[mode];
    var stars = mode === "challenge"
      ? (moves <= 14 ? 3 : (moves <= 20 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    var extra = mode === "challenge" ? "\nChallenge cleared with " + fmtTime(timeLeft) + " left!" : "";
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("Mode: " + cfg.label + " — all " + cfg.pairs + " pairs!\nMoves: " + moves + "  " + starLine(stars) + extra);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    live("You win in " + cfg.label + " mode with " + moves + " moves.");
    if (focusRing) { focusRing.clear(); }
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showTimeUp(scene) {
    stopTimer();
    gameOver = true; lockBoard = true; firstPick = null;
    var cfg = MODES[mode];
    endTitle.setText("\u23F0 Time's Up!");
    endDetail.setText("Challenge: " + matches + " / " + cfg.pairs + " pairs in " + moves + " moves.\nTry again or play Relaxed (press 1).");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F0");
    live("Time is up. You found " + matches + " of " + cfg.pairs + " pairs.");
    if (focusRing) { focusRing.clear(); }
  }

  function stopTimer() {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
  }

  function startTimer(scene) {
    stopTimer();
    refreshHudMode();
    if (mode !== "challenge") {
      if (hudTimer) { hudTimer.setText(""); }
      return;
    }
    timeLeft = MODES.challenge.timeLimit;
    if (hudTimer) { hudTimer.setText("Time: " + fmtTime(timeLeft)); }
    timerEvent = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (!started || gameOver) { return; }
      timeLeft--;
      if (hudTimer) { hudTimer.setText("Time: " + fmtTime(Math.max(timeLeft, 0))); }
      if (timeLeft <= 0) { showTimeUp(scene); }
    }});
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true; gameOver = false;
    hudMoves.setText("Moves: 0"); hudMsg.setText(mode === "challenge" ? "Challenge: beat the clock!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    refreshHudMode();
    startTimer(scene);
    live("New game in " + MODES[mode].label + " mode.");
    drawFocus();
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-ONE", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, "relaxed"); }
      else { setMode(scene, "relaxed"); }
    });
    kb.on("keydown-TWO", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, "challenge"); }
      else { setMode(scene, "challenge"); }
    });
    kb.on("keydown-C", function () {
      if (startOverlay && startOverlay.visible) { return; }
      toggleMode(scene);
    });
    kb.on("keydown-R", function () {
      if (startOverlay && startOverlay.visible) { return; }
      restart(scene);
    });
    kb.on("keydown-ENTER", function () { pressFocused(scene); });
    kb.on("keydown-SPACE", function () { pressFocused(scene); });
    kb.on("keydown-LEFT", function () { moveFocus(-1, 0); });
    kb.on("keydown-RIGHT", function () { moveFocus(1, 0); });
    kb.on("keydown-UP", function () { moveFocus(0, -1); });
    kb.on("keydown-DOWN", function () { moveFocus(0, 1); });
  }

  function pressFocused(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene, mode); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    var card = cards[Math.min(focusIndex, cards.length - 1)];
    if (card) { onCard(scene, card); }
  }

  function update() {}
})();
</script>
</body>
</html>
