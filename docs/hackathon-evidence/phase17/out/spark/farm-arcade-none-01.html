<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard memory match game. Use arrow keys to choose a card, Enter or Space to flip it, R to restart."></div>
<div id="status" class="sr-only" role="status" aria-live="polite">Farmyard Match loaded. Press Start to play.</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var score = 0, combo = 0, bestCombo = 0, level = 1, won = false;
  var timeTotal = 90, timeLeft = 90, lastTick = 0;
  var hudMoves, hudScore, hudMsg, hudTime, hudPoints, hudCombo, hudLevel;
  var timerBg, timerBar, endOverlay, endTitle, endDetail, startOverlay;
  var focusIdx = 0, clouds = [], sunGlow = null, sunCore = null, msgBaseY = 60;
  var audioCtx = null;

  function announce(msg) {
    try { document.getElementById("status").textContent = msg; } catch (e) {}
  }
  function beep(freq, dur, type, when) {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (!audioCtx || audioCtx.state === "suspended") { audioCtx.resume(); }
      var t = audioCtx.currentTime + (when || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function sndFlip() { beep(520, 0.09, "square"); }
  function sndMatch() { beep(660, 0.1, "square"); beep(880, 0.12, "square", 0.09); beep(1320, 0.16, "square", 0.18); }
  function sndMiss() { beep(220, 0.16, "sawtooth"); beep(160, 0.2, "sawtooth", 0.1); }
  function sndTick() { beep(980, 0.06, "square"); }
  function sndWin() { [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { beep(f, 0.14, "square", i * 0.11); }); }
  function sndLose() { [400, 340, 280, 200].forEach(function (f, i) { beep(f, 0.18, "sawtooth", i * 0.13); }); }

  function create() {
    var s = this;
    clouds = [];
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    updateFocusRing();
    if (s.input && s.input.keyboard) {
      s.input.keyboard.on("keydown", function (e) { onKey(s, e); });
    }
  }

  function onKey(scene, e) {
    var k = e.key;
    if (k === "Enter" && startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (k === "Enter" && endOverlay && endOverlay.visible) { restart(scene); return; }
    if (k === "r" || k === "R") { restart(scene); return; }
    if (!started || !cards.length) { return; }
    var cols = 4;
    if (k === "ArrowLeft") { focusIdx = (focusIdx + cards.length - 1) % cards.length; updateFocusRing(); e.preventDefault && e.preventDefault(); }
    else if (k === "ArrowRight") { focusIdx = (focusIdx + 1) % cards.length; updateFocusRing(); e.preventDefault && e.preventDefault(); }
    else if (k === "ArrowUp") { focusIdx = (focusIdx + cards.length - cols) % cards.length; updateFocusRing(); e.preventDefault && e.preventDefault(); }
    else if (k === "ArrowDown") { focusIdx = (focusIdx + cols) % cards.length; updateFocusRing(); e.preventDefault && e.preventDefault(); }
    else if (k === " " || k === "Enter") { e.preventDefault && e.preventDefault(); onCard(scene, cards[focusIdx]); }
  }

  function updateFocusRing() {
    cards.forEach(function (c, i) { if (c.focusRing) { c.focusRing.setVisible(i === focusIdx && started); } });
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    sunGlow = scene.add.graphics().setDepth(-4);
    sunGlow.fillStyle(0xffe08a, 0.35); sunGlow.fillCircle(770, 110, 58);
    sunCore = scene.add.graphics().setDepth(-4);
    sunCore.fillStyle(0xffe08a, 1); sunCore.fillCircle(770, 110, 42);
    [[190, 112, 1], [560, 82, 2], [380, 60, 3]].forEach(function (c, i) {
      var cg = scene.add.graphics().setDepth(-3);
      cg.fillStyle(0xffffff, 0.9);
      cg.fillEllipse(0, 0, 130, 40); cg.fillEllipse(35, -10, 100, 36);
      cg.x = c[0]; cg.y = c[1];
      cg.setData("speed", 6 + i * 3); cg.setData("baseY", c[1]);
      clouds.push(cg);
    });
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudLevel = scene.add.text(380, 24, "Lv 1  \u23F1 90s", textStyle(24, "#7a4a2b"));
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudTime = scene.add.text(24, 122, "\u23F1 90s", textStyle(24, "#b5651d"));
    hudPoints = scene.add.text(300, 58, "Score: 0", textStyle(24, "#0a7d2c"));
    hudCombo = scene.add.text(300, 90, "Combo x0", textStyle(24, "#c2410c"));
    hudMsg = scene.add.text(W - 24, 56, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    msgBaseY = 56;
    var btn = scene.add.container(W - 110, 106);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    timerBg = scene.add.graphics().setDepth(5);
    timerBg.fillStyle(0x000000, 0.15); timerBg.fillRoundedRect(60, 184, 780, 12, 6);
    timerBar = scene.add.graphics().setDepth(6);
    drawTimerBar();
    scene.add.text(W / 2, 160, "Match fast for COMBOS \u2014 clock is ticking!", textStyle(20, "#8a6a4a")).setOrigin(0.5);
  }

  function drawTimerBar() {
    if (!timerBar) { return; }
    timerBar.clear();
    var frac = Math.max(0, timeLeft / timeTotal);
    var col = frac > 0.5 ? 0x5da85f : (frac > 0.25 ? 0xffb703 : 0xef233c);
    timerBar.fillStyle(col, 1);
    var w = Math.max(0.001, 772 * frac);
    timerBar.fillRoundedRect(64, 186, w, 8, 4);
  }

  function bounceMsg(scene) {
    if (!hudMsg) { return; }
    scene.tweens.killTweensOf(hudMsg);
    hudMsg.setScale(1.25);
    scene.tweens.add({ targets: hudMsg, scale: 1, duration: 220, ease: "Back.easeOut" });
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 132, gx = 62, gy = 208, padX = 22, padY = 14;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIdx = 0;
    updateFocusRing();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    var focusRing = scene.add.graphics();
    focusRing.lineStyle(6, 0xffb703, 1);
    focusRing.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 24);
    focusRing.setVisible(false);
    cont.add([showBack, face, focusRing]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, focusRing: focusRing, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { focusIdx = cards.indexOf(card); updateFocusRing(); onCard(scene, card); });
    cont.on("pointerover", function () { if (started && !card.matched) { scene.tweens.add({ targets: cont, scale: 1.03, duration: 120 }); } });
    cont.on("pointerout", function () { scene.tweens.add({ targets: cont, scale: 1, duration: 120 }); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function burst(scene, x, y, big) {
    var bits = ["\u2B50", "\u{1F389}", "\u2728", "\u{1F33B}"];
    var n = big ? 14 : 8;
    for (var i = 0; i < n; i++) {
      var p = scene.add.text(x, y, bits[i % bits.length], { fontSize: (big ? 34 : 24) + "px" }).setOrigin(0.5).setDepth(30);
      scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-120, 120), y: y + Phaser.Math.Between(-120, 60),
        alpha: 0, scale: 0.3, duration: Phaser.Math.Between(500, 900), ease: "Cubic.easeOut",
        onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPoints.setText("Score: " + score);
    hudCombo.setText(combo >= 2 ? "Combo x" + combo + " \u{1F525}" : "Combo x" + combo);
    hudCombo.setColor(combo >= 3 ? "#ea580c" : "#c2410c");
    hudTime.setText("\u23F1 " + Math.ceil(timeLeft) + "s");
    hudLevel.setText("Lv " + level + "  \u23F1 " + timeTotal + "s");
    drawTimerBar();
  }

  function onCard(scene, card) {
    if (!started || lockBoard || won || timeLeft <= 0 || card.faceUp || card.matched) { return; }
    sndFlip();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); bounceMsg(scene); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      var speedBonus = Math.max(0, Math.ceil(timeLeft / 10)) * 5;
      combo++;
      bestCombo = Math.max(bestCombo, combo);
      var gained = 100 + (combo - 1) * 50 + speedBonus + (level - 1) * 25;
      if (timeLeft <= 15) { gained *= 2; }
      score += gained;
      refreshHud();
      hudMsg.setText(combo >= 3 ? "COMBO x" + combo + "! +" + gained + " \u{1F525}" : "Yay! +" + gained + " \u{1F389}");
      bounceMsg(scene);
      announce("Pair found! " + card.data.name + ". Score " + score + ". " + matches + 1 + " of 6 pairs.");
      setTimeout(function () {
        a.matched = card.matched = true;
        sndMatch();
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.12, yoyo: true, duration: 160 });
        burst(scene, card.view.x, card.view.y, combo >= 3);
        burst(scene, a.view.x, a.view.y, false);
        matches++;
        refreshHud();
        hudScore.setText("Pairs: " + matches + " / 6");
        lockBoard = false;
        updateFocusRing();
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      combo = 0;
      score = Math.max(0, score - 10);
      refreshHud();
      hudMsg.setText("Miss! -10 \u{1F340}");
      bounceMsg(scene);
      sndMiss();
      try { scene.cameras.main.shake(150, 0.004); } catch (e) {}
      announce("No match. Try again.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateFocusRing(); });
      }, 650);
    }
    hudMoves.setText("Moves: " + moves);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -132, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -62, "ARCADE MODE: beat the clock!\nMatch fast for COMBOS. Last 15s = DOUBLE points!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 12, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 58, "Arrows: pick card  \u2022  Enter/Space: flip  \u2022  R: restart", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    timeTotal = Math.max(45, 90 - (level - 1) * 10);
    timeLeft = timeTotal; lastTick = Math.ceil(timeLeft);
    started = true; lockBoard = false; won = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    refreshHud();
    hudMsg.setText("GO! \u{1F525}");
    bounceMsg(scene);
    announce("Level " + level + " started. " + timeTotal + " seconds. Find all 6 pairs!");
    updateFocusRing();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 55, 260, 70, 35);
    var btnTx = scene.add.text(0, 90, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 55, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    won = true; lockBoard = true; started = false;
    var bonus = Math.ceil(timeLeft) * 5;
    score += bonus;
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} Level " + level + " CLEAR! \u{1F389}");
    endDetail.setText("Score: " + score + "  (time bonus +" + bonus + ")\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nBest combo x" + bestCombo + " \u2014 next level: faster clock!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Level clear! \u{1F389}");
    sndWin();
    refreshHud();
    announce("Level " + level + " clear! Score " + score + ". Press Play Again for level " + (level + 1) + ".");
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function showLose(scene) {
    won = false; lockBoard = true; started = false;
    if (firstPick && firstPick.faceUp) { flip(firstPick, false); }
    firstPick = null;
    endTitle.setText("\u23F1 Time's Up!");
    endDetail.setText("Level " + level + " \u2014 Score: " + score + "\nPairs: " + matches + " / 6  \u2022  Best combo x" + bestCombo + "\nFaster matching builds combos!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! \u23F1");
    sndLose();
    try { scene.cameras.main.shake(250, 0.008); } catch (e) {}
    announce("Time is up. Score " + score + ". Press Play Again to retry level " + level + ".");
  }

  function restart(scene) {
    var wasWon = won;
    if (wasWon) { level++; }
    won = false;
    timeTotal = Math.max(45, 90 - (level - 1) * 10);
    timeLeft = timeTotal; lastTick = Math.ceil(timeLeft);
    moves = 0; matches = 0; combo = 0; bestCombo = 0;
    if (!wasWon) { score = 0; }
    firstPick = null; lockBoard = false; started = true;
    refreshHud();
    hudMsg.setText("GO! Level " + level + " \u{1F525}");
    bounceMsg(scene);
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    announce("Level " + level + " started. " + timeTotal + " seconds. Find all 6 pairs!");
  }

  function update(time, delta) {
    var t = time || 0;
    clouds.forEach(function (cg, i) {
      cg.x += cg.getData("speed") * (delta || 16) / 1000;
      if (cg.x - 90 > W) { cg.x = -90; }
      cg.y = cg.getData("baseY") + Math.sin((t / 900) + i * 2) * 5;
    });
    if (sunGlow) { var s = 1 + Math.sin(t / 500) * 0.06; sunGlow.setScale(s); }
    if (sunCore) { var r = 1 + Math.sin(t / 500 + 1) * 0.03; sunCore.setScale(r); }
    if (hudCombo && combo >= 3 && started) {
      hudCombo.setScale(1 + Math.sin(t / 150) * 0.08);
    } else if (hudCombo) { hudCombo.setScale(1); }
    if (!started || won) { return; }
    if (timeLeft > 0) {
      timeLeft -= (delta || 16) / 1000;
      if (timeLeft <= 0) {
        timeLeft = 0;
        refreshHud();
        var scene = this;
        showLose(scene);
        return;
      }
      var whole = Math.ceil(timeLeft);
      if (whole !== lastTick) {
        lastTick = whole;
        refreshHud();
        if (whole <= 10 && whole > 0) { sndTick(); }
        if (whole === 15) { hudMsg.setText("FRENZY! Double points! \u{1F525}"); bounceMsg(this); }
      } else {
        drawTimerBar();
        if (hudTime) { hudTime.setText("\u23F1 " + Math.ceil(timeLeft) + "s"); }
      }
      if (timeLeft <= 15 && hudTime) { hudTime.setColor(Math.floor(t / 300) % 2 ? "#ef233c" : "#b5651d"); }
    }
  }

  new Phaser.Game(config);
})();
</script>
