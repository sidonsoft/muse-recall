<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #modebar{display:flex;align-items:center;gap:8px;padding:8px 12px;z-index:10}
  #modebar .modelabel{font-weight:bold;color:#5b3a29;font-size:18px}
  #modebar button{font-family:inherit;font-weight:bold;font-size:16px;border-radius:999px;border:3px solid #5da85f;padding:6px 14px;cursor:pointer;background:#fff;color:#5b3a29}
  #modebar button[aria-pressed="true"]{background:#5da85f;color:#fff}
  #modebar button:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
  #game{width:100vw;height:calc(100vh - 52px);max-width:900px;max-height:700px;display:flex;align-items:center;justify-content:center}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="modebar" role="group" aria-label="Difficulty mode">
  <span class="modelabel" id="modeLabel">Mode:</span>
  <button type="button" id="btnEasy" aria-label="Easy mode, 6 animal pairs" aria-pressed="true">Easy: 6 pairs</button>
  <button type="button" id="btnHard" aria-label="Hard challenge mode, 8 animal pairs with faster flips and a timer" aria-pressed="false">Hard: 8 pairs</button>
</div>
<div id="game"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var EXTRA_ANIMALS = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F430}", name: "Rabbit" }
  ];
  var mode = "easy";
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, hudSub, hudTimer, modeToggleBtn, modeToggleLabel;
  var endOverlay, endTitle, endDetail, startOverlay, startSub, startRow, easyPill, easyPillBg, hardPill, hardPillBg;
  var mainScene = null, startTime = 0, elapsed = 0, timerEvent = null;
  var focusIndex = -1, focusRing = null;

  function totalPairs() { return mode === "hard" ? 8 : 6; }
  function activeAnimals() { return mode === "hard" ? ANIMALS.concat(EXTRA_ANIMALS) : ANIMALS.slice(); }
  function mismatchDelay() { return mode === "hard" ? 450 : 700; }
  function starCount() {
    if (mode === "hard") { return moves <= 14 ? 3 : (moves <= 22 ? 2 : 1); }
    return moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
  }
  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    mainScene = s;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    wireModeButtons(s);
    labelCanvas();
    syncModeUI(s);
  }

  function labelCanvas() {
    var c = document.querySelector("#game canvas");
    if (c) {
      c.setAttribute("tabindex", "0");
      c.setAttribute("role", "img");
      c.setAttribute("aria-label", "Farmyard Match memory board. Use the Easy or Hard mode buttons to choose difficulty, then Tab to the game and use arrow keys plus Enter to flip cards.");
    }
  }

  function wireModeButtons(scene) {
    var easy = document.getElementById("btnEasy");
    var hard = document.getElementById("btnHard");
    if (easy) {
      easy.addEventListener("click", function () { setMode("easy", scene, true); });
    }
    if (hard) {
      hard.addEventListener("click", function () { setMode("hard", scene, true); });
    }
    document.addEventListener("keydown", function (e) {
      if (!mainScene) { return; }
      var k = e.key;
      if (k === "Enter" && startOverlay && startOverlay.visible) {
        startGame(mainScene);
      } else if (k === "e" || k === "E") {
        setMode("easy", mainScene, true);
      } else if (k === "h" || k === "H") {
        setMode("hard", mainScene, true);
      } else if (k === "m" || k === "M") {
        setMode(mode === "hard" ? "easy" : "hard", mainScene, true);
      } else if (k === "r" || k === "R") {
        restart(mainScene);
      }
    });
  }

  function setupKeyboard(scene) {
    if (!scene.input || !scene.input.keyboard) { return; }
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      if (focusIndex >= 0 && cards[focusIndex]) { onCard(scene, cards[focusIndex]); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      if (focusIndex >= 0 && cards[focusIndex]) { onCard(scene, cards[focusIndex]); }
    });
    scene.input.keyboard.on("keydown-E", function () { setMode("easy", scene, true); });
    scene.input.keyboard.on("keydown-H", function () { setMode("hard", scene, true); });
    scene.input.keyboard.on("keydown-M", function () { setMode(mode === "hard" ? "easy" : "hard", scene, true); });
    scene.input.keyboard.on("keydown-R", function () { restart(scene); });
    var cols = function () { return 4; };
    scene.input.keyboard.on("keydown-LEFT", function () { moveFocus(scene, -1, 0, cols()); });
    scene.input.keyboard.on("keydown-RIGHT", function () { moveFocus(scene, 1, 0, cols()); });
    scene.input.keyboard.on("keydown-UP", function () { moveFocus(scene, 0, -1, cols()); });
    scene.input.keyboard.on("keydown-DOWN", function () { moveFocus(scene, 0, 1, cols()); });
  }

  function moveFocus(scene, dx, dy, colsN) {
    if (!cards.length || !started || (endOverlay && endOverlay.visible)) { return; }
    if (focusIndex < 0) { focusIndex = 0; }
    else {
      var rowsN = Math.ceil(cards.length / colsN);
      var r = Math.floor(focusIndex / colsN), c = focusIndex % colsN;
      c = Math.min(colsN - 1, Math.max(0, c + dx));
      r = Math.min(rowsN - 1, Math.max(0, r + dy));
      focusIndex = Math.min(cards.length - 1, r * colsN + c);
    }
    drawFocusRing(scene);
    var nm = cards[focusIndex] && cards[focusIndex].data ? cards[focusIndex].data.name : "card";
    announce("Focused " + nm + ", card " + (focusIndex + 1) + " of " + cards.length + ". Press Enter to flip.");
  }

  function drawFocusRing(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (focusIndex < 0 || !cards[focusIndex]) { return; }
    var v = cards[focusIndex].view;
    var cw2 = (cards[focusIndex].w || 185) / 2 + 4, ch2 = (cards[focusIndex].h || 140) / 2 + 4;
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, 0xffb703, 1);
    focusRing.strokeRoundedRect(v.x - cw2, v.y - ch2, cw2 * 2, ch2 * 2, 22);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMode = scene.add.text(24, 122, "Mode: Easy", textStyle(20, "#7a4a2b"));
    hudTimer = scene.add.text(24, 148, "Time: 0s", textStyle(20, "#7a4a2b")).setVisible(false);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    modeToggleBtn = scene.add.container(W - 310, 116);
    var modeToggleBg = scene.add.graphics();
    modeToggleBg.fillStyle(0xffffff, 1); modeToggleBg.fillRoundedRect(-86, -26, 172, 52, 26);
    modeToggleBg.lineStyle(3, 0x5da85f, 1); modeToggleBg.strokeRoundedRect(-86, -26, 172, 52, 26);
    modeToggleLabel = scene.add.text(0, 0, "Mode: Easy", textStyle(20, "#5b3a29")).setOrigin(0.5);
    modeToggleBtn.add([modeToggleBg, modeToggleLabel]);
    modeToggleBg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    modeToggleBg.on("pointerdown", function () { setMode(mode === "hard" ? "easy" : "hard", scene, true); });
    modeToggleBg.on("pointerover", function () { modeToggleBtn.setScale(1.06); });
    modeToggleBg.on("pointerout", function () { modeToggleBtn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    var pool = activeAnimals();
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIndex = -1;
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    var deck = shuffledDeck();
    var cols = 4;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    if (mode === "hard") { ch = 112; padY = 12; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xffb4a2, 0xbde0fe];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs());
        hudMsg.setText(matches === totalPairs() ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Pair found! " + matches + " of " + totalPairs() + " pairs.");
        lockBoard = false;
        if (matches === totalPairs()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, mismatchDelay());
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -132, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    startSub = scene.add.text(0, -66, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    startRow = scene.add.text(0, -2, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "36px" }).setOrigin(0.5);
    easyPillBg = scene.add.graphics();
    var easyTx = scene.add.text(-112, 62, "Easy: 6", textStyle(22, "#ffffff")).setOrigin(0.5);
    hardPillBg = scene.add.graphics();
    var hardTx = scene.add.text(112, 62, "Hard: 8", textStyle(22, "#ffffff")).setOrigin(0.5);
    easyPill = scene.add.container(0, 0, [easyPillBg, easyTx]);
    hardPill = scene.add.container(0, 0, [hardPillBg, hardTx]);
    paintPills();
    var hint = scene.add.text(0, 92, "Hard: 8 pairs, faster flips + timer  |  Keys: E / H, Enter", textStyle(15, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 108, 260, 66, 33);
    var btnTx = scene.add.text(0, 141, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, startSub, startRow, easyPillBg, easyTx, hardPillBg, hardTx, hint, btnBg, btnTx]);
    easyPillBg.setInteractive(new Phaser.Geom.Rectangle(-212, 40, 200, 44), Phaser.Geom.Rectangle.Contains);
    easyPillBg.on("pointerdown", function () { setMode("easy", scene, false); });
    hardPillBg.setInteractive(new Phaser.Geom.Rectangle(12, 40, 200, 44), Phaser.Geom.Rectangle.Contains);
    hardPillBg.on("pointerdown", function () { setMode("hard", scene, false); });
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 108, 260, 66), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function paintPills() {
    if (!easyPillBg || !hardPillBg) { return; }
    easyPillBg.clear();
    hardPillBg.clear();
    if (mode === "hard") {
      easyPillBg.fillStyle(0xcccccc, 1); easyPillBg.fillRoundedRect(-212, 40, 200, 44, 22);
      hardPillBg.fillStyle(0x5da85f, 1); hardPillBg.fillRoundedRect(12, 40, 200, 44, 22);
    } else {
      easyPillBg.fillStyle(0x5da85f, 1); easyPillBg.fillRoundedRect(-212, 40, 200, 44, 22);
      hardPillBg.fillStyle(0xcccccc, 1); hardPillBg.fillRoundedRect(12, 40, 200, 44, 22);
    }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    stopTimer(scene);
    var stars = starCount();
    var label = mode === "hard" ? "Hard mode cleared!" : "You found all 6 pairs!";
    var detail = label + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars);
    if (mode === "hard") { detail += "\nTime: " + elapsed + "s";
      if (elapsed <= 90 && moves <= 14) { detail += "  \u{1F3C6}"; } }
    endDetail.setText(detail);
    announce(label + " Moves " + moves + (mode === "hard" ? ", time " + elapsed + " seconds." : "."));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    moves = 0; matches = 0; firstPick = null;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / " + totalPairs());
    hudMsg.setText("Tap a card!");
    announce((mode === "hard" ? "Hard mode" : "Easy mode") + " started. Find all " + totalPairs() + " pairs.");
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs()); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
    announce((mode === "hard" ? "Hard mode" : "Easy mode") + " restarted. " + totalPairs() + " pairs.");
  }

  function setMode(next, scene, restartBoard) {
    if (next !== "easy" && next !== "hard") { return; }
    var changed = (next !== mode);
    mode = next;
    syncModeUI(scene);
    if (!scene) { return; }
    if (restartBoard) {
      if (startOverlay && startOverlay.visible) {
        buildBoard(scene);
        lockBoard = true; started = false;
        moves = 0; matches = 0; firstPick = null;
        hudMoves.setText("Moves: 0");
        hudScore.setText("Pairs: 0 / " + totalPairs());
      } else {
        restart(scene);
      }
    }
    if (changed) { announce(next === "hard" ? "Hard challenge mode selected: 8 pairs, faster flips, timer on." : "Easy mode selected: 6 pairs."); }
  }

  function syncModeUI(scene) {
    var easy = document.getElementById("btnEasy");
    var hard = document.getElementById("btnHard");
    if (easy) { easy.setAttribute("aria-pressed", mode === "easy" ? "true" : "false"); }
    if (hard) { hard.setAttribute("aria-pressed", mode === "hard" ? "true" : "false"); }
    if (!scene) { return; }
    paintPills();
    if (hudMode) { hudMode.setText("Mode: " + (mode === "hard" ? "Hard" : "Easy")); }
    if (modeToggleLabel) { modeToggleLabel.setText("Mode: " + (mode === "hard" ? "Hard" : "Easy")); }
    if (hudSub) { hudSub.setText(mode === "hard" ? "Hard: find the 8 animal pairs!" : "Find the 6 animal pairs!"); }
    if (hudTimer) { hudTimer.setVisible(mode === "hard"); }
    if (startSub) { startSub.setText(mode === "hard" ? "Flip the cards and find\nall 8 animal pairs!\nFaster flips + timer!" : "Flip the cards and find\nall 6 animal pairs!"); }
    if (startRow) { startRow.setText(mode === "hard" ? "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F410} \u{1F430}" : "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}"); }
    if (hudScore && !started) { hudScore.setText("Pairs: 0 / " + totalPairs()); }
  }

  function startTimer(scene) {
    stopTimer(scene);
    elapsed = 0;
    if (hudTimer) {
      hudTimer.setText("Time: 0s");
      hudTimer.setVisible(mode === "hard");
    }
    if (mode !== "hard") { return; }
    startTime = Date.now();
    timerEvent = scene.time.addEvent({ delay: 500, loop: true, callback: function () {
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      if (hudTimer) { hudTimer.setText("Time: " + elapsed + "s"); }
    }});
  }

  function stopTimer(scene) {
    if (timerEvent) { timerEvent.remove(false); timerEvent = null; }
    if (mode === "hard" && startTime) {
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      if (hudTimer) { hudTimer.setText("Time: " + elapsed + "s"); }
    }
  }

  function update() {}
})();
</script>
</body>
</html>
