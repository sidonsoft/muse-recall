<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#eaf6fb;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  #game:focus{outline:3px solid #4EA8DE;outline-offset:2px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" tabindex="0" role="application" aria-label="Farmyard Match card game. Use arrow keys to move between cards, Enter or Space to flip a card, T for Tide Shuffle, R to restart."></div>
<div id="live" class="visually-hidden" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, round = 1, streak = 0, bestStreak = 0, shufflesLeft = 1;
  var focusIndex = 0, focusRing = null;
  var hudMoves, hudScore, hudMsg, hudPoints, hudRound, hudStreak, hudSub, shuffleBtn, shuffleLabel;
  var endOverlay, endTitle, endDetail, startOverlay;

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s, true);
    makeStartOverlay(s);
    makeEndOverlay(s);
    makeBubbles(s);
    wireKeyboard();
    updateFocusRing(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // Cool ocean palette: pale sea-sky up top, soft seafoam meadow below.
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xd8eefa, 1); g.fillRect(0, 0, W, 200);
    g.fillStyle(0xc9e9f2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(770, 110, 55);
    g.fillStyle(0xfff3b0, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn in ocean accent
    g.fillStyle(0x4ea8de, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x102a43, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xffffff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xffffff, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x7fb8d9, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers
    var cols = [0x90e0ef, 0xcaf0f8, 0xccfbf1, 0xe0f2fe];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a9d8f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeBubbles(scene) {
    // Slow, gentle drifting bubbles for arcade sea atmosphere (no flashing).
    for (var i = 0; i < 12; i++) {
      var bx = 20 + Math.random() * (W - 40);
      var by = 200 + Math.random() * (H - 220);
      var r = 4 + Math.random() * 10;
      var b = scene.add.graphics();
      b.lineStyle(2, 0x4ea8de, 0.45);
      b.strokeCircle(0, 0, r);
      b.fillStyle(0xffffff, 0.25);
      b.fillCircle(0, 0, r);
      var holder = scene.add.container(bx, by, [b]).setDepth(-1).setAlpha(0.7);
      scene.tweens.add({
        targets: holder, y: by - 40 - Math.random() * 60, x: bx + Phaser.Math.Between(-24, 24),
        duration: 3500 + Math.random() * 3500, yoyo: true, repeat: -1, ease: "Sine.easeInOut", delay: i * 300
      });
    }
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 86, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 114, "Score: 0", textStyle(22));
    hudRound = scene.add.text(W / 2, 30, "Round 1", textStyle(24)).setOrigin(0.5, 0);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24)).setOrigin(1, 0.5);
    hudStreak = scene.add.text(W - 24, 88, "", textStyle(20, "#1d6f8f")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 130);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4ea8de, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Round 1: find the 6 animal pairs!", textStyle(22)).setOrigin(0.5);
    shuffleBtn = scene.add.container(W - 310, 130);
    var sbg = scene.add.graphics();
    sbg.fillStyle(0x1d6f8f, 1); sbg.fillRoundedRect(-86, -26, 172, 52, 26);
    shuffleLabel = scene.add.text(0, 0, "Shuffle", textStyle(22, "#ffffff")).setOrigin(0.5);
    shuffleBtn.add([sbg, shuffleLabel]);
    sbg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    sbg.on("pointerdown", function () { tideShuffle(scene); });
    sbg.on("pointerover", function () { shuffleBtn.setScale(1.06); });
    sbg.on("pointerout", function () { shuffleBtn.setScale(1); });
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPoints.setText("Score: " + score);
    hudRound.setText("Round " + round);
    hudSub.setText("Round " + round + ": find the 6 animal pairs!");
    hudStreak.setText(streak >= 2 ? "Splash x" + streak + "!" : "");
    if (shuffleLabel) {
      shuffleLabel.setText(shufflesLeft > 0 ? "Shuffle" : "Used");
      shuffleBtn.setAlpha(shufflesLeft > 0 ? 1 : 0.55);
    }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene, instant) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      var built = makeCard(scene, cx, cy, cw, ch, card);
      built.homeX = cx; built.homeY = cy;
      cards.push(built);
      // Gentle arcade deal-in: cards rise into place one after another.
      if (!instant) {
        built.view.setScale(0.01);
        scene.tweens.add({ targets: built.view, scale: 1, duration: 260, delay: idx * 45, ease: "Back.easeOut" });
      }
    });
    updateFocusRing(scene);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4ea8de, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd8f0fa, 0xcaf0f8, 0xade8f6, 0x90e0ef, 0xccfbf1, 0xe0f2fe];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h, homeX: x, homeY: y };
    cont.on("pointerdown", function () {
      focusIndex = cards.indexOf(card);
      onCard(scene, card);
      updateFocusRing(scene);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce(card.data.name + " turned over. Pick one more card."); return; }
    moves++;
    refreshHud();
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 200 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var earned = 100 + (streak >= 2 ? (streak - 1) * 25 : 0);
        score += earned;
        praise(scene, (a.view.x + card.view.x) / 2, (a.view.y + card.view.y) / 2 - 70,
          streak >= 3 ? "Super Splash x" + streak + "! +" + earned : "Splash Pair! +" + earned);
        refreshHud();
        hudMsg.setText(matches === 6 ? "You did it! Round " + round + " clear!" : "Yay! A pair! +" + earned + "!");
        lockBoard = false;
        announce("Pair found! " + matches + " of 6 pairs. Score " + score + ".");
        moveFocusToNextOpen(scene);
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      // No penalty: a miss simply starts a fresh splash run with a friendly note.
      streak = 0;
      refreshHud();
      hudMsg.setText("Try again! \u{1F340}");
      announce("Those two did not match. " + a.data.name + " and " + card.data.name + ". Keep exploring!");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; moveFocusToNextOpen(scene); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -55, "Flip cards, match pairs,\nearn Splash bonuses every round!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 168, "Arrows + Enter flip cards.  T = Shuffle.  R = Restart.", textStyle(16)).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx, hint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4ea8de, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4ea8de, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "Next Round", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { nextRound(scene); });
  }

  function showWin(scene) {
    // Celebration only: every finish earns praise, never a lower rating.
    var splashLine = bestStreak >= 2 ? "Best splash: x" + bestStreak + "!" : "Nice splashing!";
    endDetail.setText("Round " + round + " clear! You found all 6 pairs!\nMoves: " + moves + "   Score: " + score + "\n" + splashLine + "  " + "Keep splashing!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    announce("Round " + round + " complete! All 6 pairs found. Score " + score + ".");
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    refreshHud();
    updateFocusRing(scene);
    announce("Round 1. Find the 6 animal pairs. Score Splash bonuses for back-to-back matches!");
    var holder = document.getElementById("game");
    if (holder && holder.focus) { holder.focus(); }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; round = 1;
    streak = 0; bestStreak = 0; shufflesLeft = 1;
    firstPick = null; lockBoard = false; started = true;
    hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshHud();
    announce("New game. Round 1. Score " + score + ".");
  }

  function nextRound(scene) {
    // Arcade progression: score carries over, the board deals fresh and trickier.
    round++;
    moves = 0; matches = 0; streak = 0; shufflesLeft = 1;
    firstPick = null; lockBoard = false; started = true;
    hudMsg.setText("Round " + round + ": tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshHud();
    announce("Round " + round + ". A fresh board! Score so far: " + score + ".");
  }

  function tideShuffle(scene) {
    // Player-triggered challenge remix: once per round, the sea mixes up
    // every unmatched face-down card with a gentle slide. Never a penalty.
    if (!started || lockBoard || firstPick || shufflesLeft <= 0) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    var open = cards.filter(function (c) { return !c.matched && !c.faceUp; });
    if (open.length < 2) { return; }
    shufflesLeft--;
    lockBoard = true;
    var spots = open.map(function (c) { return { x: c.homeX, y: c.homeY }; });
    for (var i = spots.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = spots[i]; spots[i] = spots[j]; spots[j] = t;
    }
    open.forEach(function (c, k) {
      c.homeX = spots[k].x; c.homeY = spots[k].y;
      scene.tweens.add({ targets: c.view, x: c.homeX, y: c.homeY, duration: 420, delay: k * 40, ease: "Sine.easeInOut" });
    });
    hudMsg.setText("The tide mixed the cards!");
    praise(scene, W / 2, 220, "Tide Shuffle!");
    refreshHud();
    announce("Tide shuffle! The unmatched cards slid to new spots.");
    setTimeout(function () { lockBoard = false; updateFocusRing(scene); }, 450 + open.length * 40);
  }

  function praise(scene, x, y, msg) {
    // Slow rising praise note: gentle scale and fade, never a flash.
    var t = scene.add.text(x, y, msg, textStyle(26, "#1d6f8f")).setOrigin(0.5).setDepth(15).setScale(0.6);
    scene.tweens.add({ targets: t, y: y - 46, scale: 1.05, duration: 550, ease: "Sine.easeOut" });
    scene.tweens.add({ targets: t, alpha: 0, duration: 600, delay: 550, onComplete: function () { t.destroy(); } });
  }

  function updateFocusRing(scene) {
    if (!scene) { return; }
    if (!focusRing) { focusRing = scene.add.graphics().setDepth(6); }
    focusRing.clear();
    if (!started) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIndex];
    if (!card) { return; }
    focusRing.lineStyle(5, 0x102a43, 1);
    focusRing.strokeRoundedRect(card.view.x - card.w / 2 - 7, card.view.y - card.h / 2 - 7, card.w + 14, card.h + 14, 26);
  }

  function moveFocusToNextOpen(scene) {
    for (var step = 1; step <= cards.length; step++) {
      var idx = (focusIndex + step) % cards.length;
      if (!cards[idx].matched) { focusIndex = idx; break; }
    }
    updateFocusRing(scene);
  }

  function wireKeyboard() {
    document.addEventListener("keydown", function (ev) {
      var scene = cards.length ? cards[0].view.scene : null;
      if (!scene) { return; }
      var key = ev.key;
      if (startOverlay && startOverlay.visible) {
        if (key === "Enter" || key === " ") { startGame(scene); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (key === "Enter" || key === " ") { nextRound(scene); }
        return;
      }
      if (!started) { return; }
      var cols = 4;
      var moved = false;
      if (key === "ArrowLeft") { focusIndex = (focusIndex + cards.length - 1) % cards.length; moved = true; }
      else if (key === "ArrowRight") { focusIndex = (focusIndex + 1) % cards.length; moved = true; }
      else if (key === "ArrowUp") { focusIndex = (focusIndex + cards.length - cols) % cards.length; moved = true; }
      else if (key === "ArrowDown") { focusIndex = (focusIndex + cols) % cards.length; moved = true; }
      else if (key === "Home") { focusIndex = 0; moved = true; }
      else if (key === "End") { focusIndex = cards.length - 1; moved = true; }
      else if (key === "Enter" || key === " ") {
        var card = cards[focusIndex];
        if (card && !card.matched) { onCard(scene, card); }
        updateFocusRing(scene);
        return;
      }
      else if (key === "r" || key === "R") { restart(scene); return; }
      else if (key === "t" || key === "T") { tideShuffle(scene); return; }
      else { return; }
      if (moved) {
        if (cards[focusIndex] && cards[focusIndex].matched) { moveFocusToNextOpen(scene); }
        else { updateFocusRing(scene); }
        var cur = cards[focusIndex];
        if (cur) { announce("Card " + (focusIndex + 1) + " of " + cards.length + (cur.matched ? ", already matched." : ".")); }
      }
    });
  }

  function update() {}
})();
</script>
