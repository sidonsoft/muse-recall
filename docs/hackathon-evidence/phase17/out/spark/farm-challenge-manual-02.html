<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" class="visually-hidden" aria-live="polite" role="status"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F436}", name: "Dog" },
    { emoji: "\u{1F430}", name: "Rabbit" }
  ];
  var MODES = {
    easy: { label: "Cozy Farm", pairs: 6, hint: "Easy: 6 pairs" },
    tricky: { label: "Tricky Farm", pairs: 8, hint: "Tricky: 8 pairs" }
  };
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, mode = "easy", pairCount = 6;
  var focusIndex = 0, focusRing = null, selectedMode = "easy";
  var hudMoves, hudScore, hudMsg, hudMode, hudSub, endOverlay, endTitle, endDetail, startOverlay;
  var startEasyBg, startTrickyBg, startEasyTx, startTrickyTx;

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard(s);
    announce("Farmyard Match. Choose Cozy Farm with 6 pairs, or Tricky Farm with 8 pairs. Press 1 or 2.");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34, "#102A43")).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24, "#102A43"));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24, "#102A43"));
    hudMode = scene.add.text(24, 122, "Cozy Farm", textStyle(20, "#4EA8DE"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    refreshHudText();
  }

  function refreshHudText() {
    hudScore.setText("Pairs: " + matches + " / " + pairCount);
    hudMode.setText(MODES[mode].label + " (" + pairCount + " pairs)");
    if (hudSub) { hudSub.setText("Find the " + pairCount + " animal pairs!"); }
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.slice(0, pairCount).forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function gridFor(pairs) {
    if (pairs <= 6) { return { cols: 4, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 }; }
    return { cols: 4, cw: 185, ch: 106, gx: 62, gy: 192, padX: 22, padY: 12 };
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIndex = 0;
    var deck = shuffledDeck();
    var g = gridFor(pairCount);
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / g.cols), c = idx % g.cols;
      var cx = g.gx + c * (g.cw + g.padX) + g.cw / 2;
      var cy = g.gy + r * (g.ch + g.padY) + g.ch / 2;
      cards.push(makeCard(scene, cx, cy, g.cw, g.ch, card));
    });
    drawFocusRing(scene);
  }

  function focusedCols() { return 4; }

  function drawFocusRing(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length || !started) { return; }
    var target = cards[Math.min(focusIndex, cards.length - 1)];
    var w = target.view.width + 10, h = target.view.height + 10;
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(4, 0x102A43, 1);
    focusRing.strokeRoundedRect(target.view.x - w / 2, target.view.y - h / 2, w, h, 24);
  }

  function moveFocus(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = focusedCols();
    var next = focusIndex + dx + dy * cols;
    next = (next + cards.length) % cards.length;
    focusIndex = next;
    drawFocusRing(scene);
    var nm = cards[focusIndex].data.name;
    announce("Card " + (focusIndex + 1) + " of " + cards.length + ": " + nm + " spot.");
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var compact = h < 120;
    var emo = scene.add.text(0, compact ? -14 : -18, data.emoji, { fontSize: compact ? "44px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, compact ? 30 : 44, data.name, textStyle(compact ? 18 : 22, "#102A43")).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    focusIndex = cards.indexOf(card);
    drawFocusRing(scene);
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("You flipped " + card.data.name + ". Pick one more card."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + pairCount);
        hudMsg.setText(matches === pairCount ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Yay! You found the " + card.data.name + " pair. " + matches + " of " + pairCount + " pairs.");
        lockBoard = false;
        if (matches === pairCount) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("Those two are different. The cards flip back so you can try again. No worries!");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function paintModeButtons() {
    if (!startEasyBg) { return; }
    startEasyBg.clear();
    startTrickyBg.clear();
    var easySel = selectedMode === "easy", trickySel = selectedMode === "tricky";
    startEasyBg.fillStyle(easySel ? 0x4EA8DE : 0x5da85f, 1);
    startEasyBg.fillRoundedRect(-282, 72, 268, 78, 24);
    if (easySel) { startEasyBg.lineStyle(5, 0x102A43, 1); startEasyBg.strokeRoundedRect(-282, 72, 268, 78, 24); }
    startTrickyBg.fillStyle(trickySel ? 0x4EA8DE : 0xffffff, 1);
    startTrickyBg.fillRoundedRect(14, 72, 268, 78, 24);
    startTrickyBg.lineStyle(trickySel ? 5 : 3, trickySel ? 0x102A43 : 0x4EA8DE, 1);
    startTrickyBg.strokeRoundedRect(14, 72, 268, 78, 24);
    startEasyTx.setColor("#ffffff");
    startTrickyTx.setColor(trickySel ? "#ffffff" : "#102A43");
  }

  function highlightMode(m) {
    selectedMode = m;
    paintModeButtons();
    announce(m === "tricky"
      ? "Tricky Farm selected: 16 cards, 8 pairs. Press Enter to play, or press 1 for Cozy Farm."
      : "Cozy Farm selected: 12 cards, 6 pairs. Press Enter to play, or press 2 for Tricky Farm.");
  }

  function startMode(scene, m) {
    mode = m; selectedMode = m; pairCount = MODES[m].pairs;
    moves = 0; matches = 0; firstPick = null;
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMoves.setText("Moves: 0");
    refreshHudText();
    hudMsg.setText("Tap a card!");
    buildBoard(scene);
    announce(MODES[m].label + " started with " + pairCount + " pairs. Use arrow keys and Enter, or tap a card.");
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38, "#102A43")).setOrigin(0.5);
    var sub = scene.add.text(0, -88, "Flip the cards and find the pairs!\nNo timer, no rushing — just have fun.", Object.assign(textStyle(21, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 38, "Keys: 1 = Cozy Farm   •   2 = Tricky Farm   •   Enter = play", textStyle(16, "#102A43")).setOrigin(0.5);
    startEasyBg = scene.add.graphics();
    startTrickyBg = scene.add.graphics();
    startEasyTx = scene.add.text(-148, 111, "\u25B6 Cozy: 6 pairs", textStyle(22, "#ffffff")).setOrigin(0.5);
    startTrickyTx = scene.add.text(148, 111, "\u2605 Tricky: 8 pairs", textStyle(22, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys, startEasyBg, startTrickyBg, startEasyTx, startTrickyTx]);
    paintModeButtons();
    startEasyBg.setInteractive(new Phaser.Geom.Rectangle(-282, 72, 268, 78), Phaser.Geom.Rectangle.Contains);
    startTrickyBg.setInteractive(new Phaser.Geom.Rectangle(14, 72, 268, 78), Phaser.Geom.Rectangle.Contains);
    startEasyBg.on("pointerdown", function () { startMode(scene, "easy"); });
    startTrickyBg.on("pointerdown", function () { startMode(scene, "tricky"); });
    startEasyBg.on("pointerover", function () { highlightMode("easy"); });
    startTrickyBg.on("pointerover", function () { highlightMode("tricky"); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -112, "\u{1F389} You Win! \u{1F389}", textStyle(40, "#102A43")).setOrigin(0.5);
    endDetail = scene.add.text(0, -42, "", Object.assign(textStyle(24, "#102A43"), { align: "center" })).setOrigin(0.5);
    var againBg = scene.add.graphics();
    againBg.fillStyle(0x5da85f, 1); againBg.fillRoundedRect(-262, 30, 250, 62, 31);
    var againTx = scene.add.text(-137, 61, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    var modesBg = scene.add.graphics();
    modesBg.fillStyle(0x4EA8DE, 1); modesBg.fillRoundedRect(12, 30, 250, 62, 31);
    var modesTx = scene.add.text(137, 61, "Pick a farm", textStyle(24, "#ffffff")).setOrigin(0.5);
    var keys = scene.add.text(0, 130, "Keys: Enter = again   •   M = farms", textStyle(16, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, againBg, againTx, modesBg, modesTx, keys]);
    againBg.setInteractive(new Phaser.Geom.Rectangle(-262, 30, 250, 62), Phaser.Geom.Rectangle.Contains);
    modesBg.setInteractive(new Phaser.Geom.Rectangle(12, 30, 250, 62), Phaser.Geom.Rectangle.Contains);
    againBg.on("pointerdown", function () { restart(scene); });
    modesBg.on("pointerdown", function () { openModes(scene); });
  }

  function starTargets() {
    return pairCount > 6 ? { three: 14, two: 22 } : { three: 10, two: 16 };
  }

  function showWin(scene) {
    var t = starTargets();
    var stars = moves <= t.three ? 3 : (moves <= t.two ? 2 : 1);
    endTitle.setText("\u{1F389} " + MODES[mode].label + " Win! \u{1F389}");
    endDetail.setText("You found all " + pairCount + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You found all " + pairCount + " pairs in " + MODES[mode].label + " in " + moves + " moves. Press Enter to play again, or M to pick a farm.");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t2) { return function () { t2.destroy(); }; })(p) });
    }
  }

  function openModes(scene) {
    firstPick = null; lockBoard = true; started = false;
    endOverlay.setVisible(false);
    paintModeButtons();
    startOverlay.setVisible(true);
    hudMsg.setText("Pick a farm!");
    announce("Pick a farm. Press 1 for Cozy Farm with 6 pairs, or 2 for Tricky Farm with 8 pairs.");
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); refreshHudText(); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    announce(MODES[mode].label + " restarted with " + pairCount + " pairs. Good luck!");
  }

  function wireKeyboard(scene) {
    document.addEventListener("keydown", function (ev) {
      var k = ev.key;
      if (startOverlay && startOverlay.visible) {
        if (k === "1") { highlightMode("easy"); startMode(scene, "easy"); }
        else if (k === "2") { highlightMode("tricky"); startMode(scene, "tricky"); }
        else if (k === "ArrowLeft" || k === "ArrowRight") { highlightMode(selectedMode === "easy" ? "tricky" : "easy"); }
        else if (k === "Enter" || k === " ") { startMode(scene, selectedMode); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (k === "Enter" || k === " ") { restart(scene); }
        else if (k === "m" || k === "M" || k === "Escape") { openModes(scene); }
        else if (k === "1") { startMode(scene, "easy"); }
        else if (k === "2") { startMode(scene, "tricky"); }
        return;
      }
      if (k === "ArrowLeft") { moveFocus(scene, -1, 0); }
      else if (k === "ArrowRight") { moveFocus(scene, 1, 0); }
      else if (k === "ArrowUp") { moveFocus(scene, 0, -1); }
      else if (k === "ArrowDown") { moveFocus(scene, 0, 1); }
      else if (k === "Enter" || k === " ") {
        var card = cards[Math.min(focusIndex, cards.length - 1)];
        if (card) { onCard(scene, card); }
      }
      else if (k === "r" || k === "R") { restart(scene); }
      else if (k === "m" || k === "M") { openModes(scene); }
    });
    document.addEventListener("click", function () {
      var cv = document.querySelector("canvas");
      if (cv && document.activeElement !== cv && cv.focus) { cv.focus(); }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
