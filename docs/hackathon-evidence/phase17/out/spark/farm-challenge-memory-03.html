<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard memory match game. Use arrow keys to choose a card, Enter to flip it, E for easy level, H for hard level."></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F436}", name: "Dog" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var mode = "easy", totalPairs = 6;
  var hudMoves, hudScore, hudMsg, hudGoal, endOverlay, endTitle, endDetail, startOverlay;
  var easyPill, easyPillBg, hardPill, hardPillBg, focusRing, focusIdx = 0, overlayFocus = "easy";
  var easyStartBg, hardStartBg;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    focusRing = s.add.graphics().setDepth(5);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    var cv = document.querySelector("#game canvas");
    if (cv) { cv.setAttribute("tabindex", "0"); cv.setAttribute("aria-label", "Farmyard match board. Arrow keys choose a card, Enter flips it."); }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudGoal = scene.add.text(W / 2, 168, "Find the 6 animal pairs! (Easy)", textStyle(22)).setOrigin(0.5);
    makeModePills(scene);
  }

  function makeModePills(scene) {
    easyPill = scene.add.container(W / 2 - 82, 116);
    easyPillBg = scene.add.graphics();
    var easyTx = scene.add.text(0, 0, "Easy: 6", textStyle(20, "#ffffff")).setOrigin(0.5);
    easyPill.add([easyPillBg, easyTx]);
    easyPillBg.setInteractive(new Phaser.Geom.Rectangle(-72, -22, 144, 44), Phaser.Geom.Rectangle.Contains);
    easyPillBg.on("pointerdown", function () { setMode(scene, "easy"); });
    hardPill = scene.add.container(W / 2 + 82, 116);
    hardPillBg = scene.add.graphics();
    var hardTx = scene.add.text(0, 0, "Hard: 8", textStyle(20, "#ffffff")).setOrigin(0.5);
    hardPill.add([hardPillBg, hardTx]);
    hardPillBg.setInteractive(new Phaser.Geom.Rectangle(-72, -22, 144, 44), Phaser.Geom.Rectangle.Contains);
    hardPillBg.on("pointerdown", function () { setMode(scene, "hard"); });
    drawModePills();
  }

  function drawModePills() {
    if (!easyPillBg || !hardPillBg) { return; }
    [["easy", easyPillBg], ["hard", hardPillBg]].forEach(function (p) {
      var selected = (mode === p[0]);
      var g = p[1];
      g.clear();
      if (selected) { g.fillStyle(0x4EA8DE, 1); }
      else { g.fillStyle(0xffffff, 1); }
      g.fillRoundedRect(-72, -22, 144, 44, 22);
      g.lineStyle(3, 0x4EA8DE, 1);
      g.strokeRoundedRect(-72, -22, 144, 44, 22);
    });
    easyPill.list[1].setColor(mode === "easy" ? "#ffffff" : "#102A43");
    hardPill.list[1].setColor(mode === "hard" ? "#ffffff" : "#102A43");
  }

  function activeAnimals() {
    return mode === "hard" ? ANIMALS.slice(0, 8) : ANIMALS.slice(0, 6);
  }

  function setMode(scene, m) {
    if (mode === m && started && !startOverlay.visible) { return; }
    mode = m;
    overlayFocus = m;
    totalPairs = (m === "hard" ? 8 : 6);
    drawModePills();
    drawStartSelection();
    restart(scene);
  }

  function shuffledDeck() {
    var deck = [];
    activeAnimals().forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    totalPairs = (mode === "hard" ? 8 : 6);
    var deck = shuffledDeck();
    var cols = 4, rows = (mode === "hard" ? 4 : 3);
    var cw = 185, ch = (mode === "hard" ? 104 : 140);
    var gx = 62, gy = 195, padX = 22, padY = (mode === "hard" ? 12 : 16);
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIdx = 0;
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + totalPairs); }
    if (hudGoal) { hudGoal.setText("Find the " + totalPairs + " animal pairs! (" + (mode === "hard" ? "Hard" : "Easy") + ")"); }
    drawFocus();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emoSize = h < 120 ? "44px" : "62px";
    var emo = scene.add.text(0, -10, data.emoji, { fontSize: emoSize }).setOrigin(0.5);
    var nm = scene.add.text(0, h / 2 - 24, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    focusIdx = cards.indexOf(card);
    drawFocus();
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        for (var k = 0; k < cards.length; k++) { if (!cards[k].matched) { focusIdx = k; break; } }
        drawFocus();
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -128, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -62, "Flip the cards and find every pair!\nEasy has 6 pairs, Hard has 8.", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    easyStartBg = scene.add.graphics();
    hardStartBg = scene.add.graphics();
    var easyTx = scene.add.text(-140, 108, "\u25B6 Easy: 6", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hardTx = scene.add.text(140, 108, "\u2605 Hard: 8", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 162, "Keys: E easy \u00B7 H hard \u00B7 \u2190/\u2192 choose \u00B7 Enter start", textStyle(17)).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, easyStartBg, hardStartBg, easyTx, hardTx, hint]);
    easyStartBg.setInteractive(new Phaser.Geom.Rectangle(-270, 73, 260, 70), Phaser.Geom.Rectangle.Contains);
    hardStartBg.setInteractive(new Phaser.Geom.Rectangle(10, 73, 260, 70), Phaser.Geom.Rectangle.Contains);
    easyStartBg.on("pointerdown", function () { startMode(scene, "easy"); });
    hardStartBg.on("pointerdown", function () { startMode(scene, "hard"); });
    drawStartSelection();
  }

  function drawStartSelection() {
    if (!easyStartBg || !hardStartBg) { return; }
    [["easy", easyStartBg], ["hard", hardStartBg]].forEach(function (p) {
      var selected = (overlayFocus === p[0]);
      var g = p[1];
      var rx = (p[0] === "easy" ? -270 : 10);
      g.clear();
      if (selected) { g.fillStyle(0x4EA8DE, 1); }
      else { g.fillStyle(0xffffff, 1); }
      g.fillRoundedRect(rx, 73, 260, 70, 35);
      if (!selected) { g.lineStyle(4, 0x4EA8DE, 1); g.strokeRoundedRect(rx, 73, 260, 70, 35); }
      else { g.lineStyle(4, 0x102A43, 0.55); g.strokeRoundedRect(rx, 73, 260, 70, 35); }
    });
    if (startOverlay && startOverlay.list.length > 8) {
      startOverlay.list[7].setColor(overlayFocus === "easy" ? "#ffffff" : "#102A43");
      startOverlay.list[8].setColor(overlayFocus === "hard" ? "#ffffff" : "#102A43");
    }
  }

  function startMode(scene, m) {
    mode = m;
    overlayFocus = m;
    totalPairs = (m === "hard" ? 8 : 6);
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    drawModePills();
    drawStartSelection();
    hudMsg.setText("Tap a card!");
    moves = 0; matches = 0; firstPick = null;
    hudMoves.setText("Moves: 0");
    if (endOverlay) { endOverlay.setVisible(false); }
    buildBoard(scene);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-270, 50, 260, 70, 35);
    var btnTx = scene.add.text(-140, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var lvlBg = scene.add.graphics();
    lvlBg.fillStyle(0xffffff, 1); lvlBg.fillRoundedRect(10, 50, 260, 70, 35);
    lvlBg.lineStyle(4, 0x4EA8DE, 1); lvlBg.strokeRoundedRect(10, 50, 260, 70, 35);
    var lvlTx = scene.add.text(140, 85, "Levels", textStyle(26)).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, lvlBg, lvlTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-270, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    lvlBg.setInteractive(new Phaser.Geom.Rectangle(10, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    lvlBg.on("pointerdown", function () {
      endOverlay.setVisible(false);
      startOverlay.setVisible(true);
      lockBoard = true;
      hudMsg.setText("Pick a level!");
    });
  }

  function showWin(scene) {
    var stars = (mode === "hard")
      ? (moves <= 14 ? 3 : (moves <= 22 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    endDetail.setText("You found all " + totalPairs + " pairs (" + (mode === "hard" ? "Hard" : "Easy") + ")!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    totalPairs = (mode === "hard" ? 8 : 6);
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card!");
    if (hudGoal) { hudGoal.setText("Find the " + totalPairs + " animal pairs! (" + (mode === "hard" ? "Hard" : "Easy") + ")"); }
    drawModePills();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || !cards.length) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIdx];
    if (!card || card.matched) { return; }
    var w = card.w || 185, h = card.h || 140;
    focusRing.lineStyle(4, 0x102A43, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function moveFocus(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var rows = cards.length / cols;
    var r = Math.floor(focusIdx / cols), c = focusIdx % cols;
    c = (c + dx + cols) % cols;
    r = (r + dy + rows) % rows;
    focusIdx = r * cols + c;
    drawFocus();
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-E", function () {
      if (startOverlay && startOverlay.visible) { startMode(scene, "easy"); }
      else { setMode(scene, "easy"); }
    });
    kb.on("keydown-H", function () {
      if (startOverlay && startOverlay.visible) { startMode(scene, "hard"); }
      else { setMode(scene, "hard"); }
    });
    kb.on("keydown-R", function () { restart(scene); });
    kb.on("keydown-LEFT", function () {
      if (startOverlay && startOverlay.visible) { overlayFocus = "easy"; drawStartSelection(); }
      else { moveFocus(scene, -1, 0); }
    });
    kb.on("keydown-RIGHT", function () {
      if (startOverlay && startOverlay.visible) { overlayFocus = "hard"; drawStartSelection(); }
      else { moveFocus(scene, 1, 0); }
    });
    kb.on("keydown-UP", function () { moveFocus(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveFocus(scene, 0, 1); });
    kb.on("keydown-ENTER", function () { pressFocused(scene); });
    kb.on("keydown-SPACE", function () { pressFocused(scene); });
  }

  function pressFocused(scene) {
    if (startOverlay && startOverlay.visible) { startMode(scene, overlayFocus); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    var card = cards[focusIdx];
    if (card) { onCard(scene, card); drawFocus(); }
  }

  function update() {}
})();
</script>
</body>
</html>
