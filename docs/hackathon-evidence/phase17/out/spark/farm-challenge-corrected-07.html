<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  #kb-help{position:fixed;left:12px;bottom:10px;max-width:min(92vw,560px);font-size:12px;line-height:1.4;color:#102A43;background:rgba(255,255,255,.85);border:1px solid #4EA8DE;border-radius:10px;padding:6px 10px}
</style>
</head>
<body>
<div id="game" tabindex="0" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to move between cards, Enter to flip, R to restart, 1 for normal mode, 2 for challenge mode."></div>
<div id="sr-status" class="sr-only" aria-live="polite"></div>
<div id="kb-help">Arrows: choose card &middot; Enter: flip &middot; R: restart &middot; 1: normal &middot; 2: challenge</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var EXTRA_ANIMALS = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F415}", name: "Dog" }
  ];
  var OCEAN = 0x4EA8DE, INK = "#102A43";
  var mode = "normal";
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, pairTotal = 6;
  var startTime = 0, elapsed = 0, timerOn = false;
  var focusIdx = 0, focusRing = null, cols = 4;
  var hudMoves, hudScore, hudMsg, hudTime, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  function pairCount() { return mode === "hard" ? 8 : 6; }
  function mismatchDelay() { return mode === "hard" ? 450 : 700; }
  function announce(msg) {
    var el = document.getElementById("sr-status");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudMode = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    hudTime = scene.add.text(W - 24, 88, "", textStyle(20, "#7a4a2b")).setOrigin(1, 0.5);
  }
  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + pairTotal);
    hudMode.setText(mode === "hard" ? "Challenge: 8 pairs \u00B7 quick flip-back \u00B7 timed" : "Find the 6 animal pairs!");
  }

  function shuffledDeck() {
    var deck = [];
    var pool = mode === "hard" ? ANIMALS.concat(EXTRA_ANIMALS) : ANIMALS.slice();
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    pairTotal = pairCount();
    var deck = shuffledDeck();
    cols = 4;
    var rows = mode === "hard" ? 4 : 3;
    var cw = 185, ch = mode === "hard" ? 110 : 140, gx = 62, gy = mode === "hard" ? 188 : 195, padX = 22, padY = mode === "hard" ? 10 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIdx = 0;
    drawFocus(scene);
    refreshHud();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    focusIdx = cards.indexOf(card);
    drawFocus(scene);
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce(card.data.name + " flipped. Pick one more card."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + pairTotal);
        hudMsg.setText(matches === pairTotal ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Pair found: " + card.data.name + ". " + matches + " of " + pairTotal + " pairs.");
        lockBoard = false;
        drawFocus(scene);
        if (matches === pairTotal) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("No match. " + a.data.name + " and " + card.data.name + ". Cards flip back.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, mismatchDelay());
    }
  }

  function startGame(scene, hard) {
    mode = hard ? "hard" : "normal";
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    restart(scene, mode);
    hudMsg.setText(mode === "hard" ? "Challenge: tap a card!" : "Tap a card!");
    announce(mode === "hard" ? "Challenge mode started. 8 pairs, cards flip back faster." : "Normal game started. 6 pairs.");
  }
  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -205, 600, 410, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -205, 600, 410, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -5, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var note = scene.add.text(0, 42, "Challenge: 8 pairs \u00B7 faster flip-back \u00B7 timed", textStyle(20, INK)).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-272, 70, 256, 64, 32);
    var btnTx = scene.add.text(-144, 102, "\u25B6  Start", textStyle(27, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(OCEAN, 1); hardBg.fillRoundedRect(16, 70, 256, 64, 32);
    var hardTx = scene.add.text(144, 102, "\u26A1 Challenge", textStyle(27, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, note, btnBg, btnTx, hardBg, hardTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-272, 70, 256, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene, false); });
    hardBg.setInteractive(new Phaser.Geom.Rectangle(16, 70, 256, 64), Phaser.Geom.Rectangle.Contains);
    hardBg.on("pointerdown", function () { startGame(scene, true); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -185, 580, 370, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -185, 580, 370, 30);
    endTitle = scene.add.text(0, -115, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-272, 55, 256, 62, 31);
    var btnTx = scene.add.text(-144, 86, "\u21BB Play Again", textStyle(25, "#ffffff")).setOrigin(0.5);
    var swBg = scene.add.graphics();
    swBg.fillStyle(OCEAN, 1); swBg.fillRoundedRect(16, 55, 256, 62, 31);
    var swTx = scene.add.text(144, 86, "", textStyle(25, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, swBg, swTx]);
    endOverlay.swTx = swTx;
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-272, 55, 256, 62), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene, mode); });
    swBg.setInteractive(new Phaser.Geom.Rectangle(16, 55, 256, 62), Phaser.Geom.Rectangle.Contains);
    swBg.on("pointerdown", function () { restart(scene, mode === "hard" ? "normal" : "hard"); });
  }

  function fmtTime(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60); s = s % 60;
    return m + ":" + (s < 10 ? "0" + s : "" + s);
  }

  function showWin(scene) {
    timerOn = false;
    var stars = mode === "hard"
      ? (moves <= 18 ? 3 : (moves <= 26 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    var head = mode === "hard" ? "Challenge cleared!" : "You found all 6 pairs!";
    if (mode === "hard") { head = "You found all 8 pairs!"; }
    endDetail.setText(head + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + (mode === "hard" ? "\nTime: " + fmtTime(elapsed) : ""));
    endTitle.setText(mode === "hard" ? "\u26A1 Challenge Win! \u26A1" : "\u{1F389} You Win! \u{1F389}");
    endOverlay.swTx.setText(mode === "hard" ? "Normal mode" : "\u26A1 Challenge");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win. " + matches + " pairs in " + moves + " moves." + (mode === "hard" ? " Time " + fmtTime(elapsed) + "." : ""));
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene, nextMode) {
    if (nextMode) { mode = nextMode; }
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    elapsed = 0; startTime = Date.now(); timerOn = true;
    if (hudTime) { hudTime.setText(mode === "hard" ? "0:00" : ""); }
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + pairCount()); hudMsg.setText(mode === "hard" ? "Challenge: tap a card!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    announce(mode === "hard" ? "Challenge mode. 8 pairs. Good luck." : "Normal mode. 6 pairs.");
  }

  function drawFocus(scene) {
    if (!scene) { return; }
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!started || !cards.length) { return; }
    if (focusIdx < 0) { focusIdx = 0; }
    if (focusIdx >= cards.length) { focusIdx = cards.length - 1; }
    var card = cards[focusIdx];
    if (!card) { return; }
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, OCEAN, 1);
    var w = card.view.width || 185, h = card.view.height || 140;
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 4, card.view.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function moveFocus(scene, dx, dy) {
    if (!cards.length) { return; }
    var next = focusIdx + dx + dy * cols;
    var total = cards.length;
    next = ((next % total) + total) % total;
    focusIdx = next;
    drawFocus(scene);
    var c = cards[focusIdx];
    if (c) { announce("Card " + (focusIdx + 1) + " of " + total + (c.matched ? ", matched " + c.data.name : ", face down") + "."); }
  }

  function wireKeyboard(scene) {
    function flipFocused() {
      var c = cards[focusIdx];
      if (c) { onCard(scene, c); }
    }
    function domKey(e) {
      var k = e.key;
      if (k === "ArrowLeft") { moveFocus(scene, -1, 0); }
      else if (k === "ArrowRight") { moveFocus(scene, 1, 0); }
      else if (k === "ArrowUp") { moveFocus(scene, 0, -1); e.preventDefault && e.preventDefault(); }
      else if (k === "ArrowDown") { moveFocus(scene, 0, 1); e.preventDefault && e.preventDefault(); }
      else if (k === "Enter" || k === " ") {
        if (startOverlay && startOverlay.visible) { startGame(scene, mode === "hard"); }
        else if (endOverlay && endOverlay.visible) { restart(scene, mode); }
        else { flipFocused(); }
      } else if (k === "r" || k === "R") { if (started) { restart(scene, mode); } }
      else if (k === "1") { if (startOverlay && startOverlay.visible) { startGame(scene, false); } }
      else if (k === "2") { if (startOverlay && startOverlay.visible) { startGame(scene, true); } }
      else { return; }
    }
    window.addEventListener("keydown", domKey);
    var gameEl = document.getElementById("game");
    if (gameEl) {
      gameEl.addEventListener("click", function () { drawFocus(scene); });
    }
  }

  function update() {
    if (timerOn && started && hudTime && mode === "hard") {
      elapsed = Date.now() - startTime;
      hudTime.setText(fmtTime(elapsed));
    }
  }
})();
</script>
</body>
</html>
