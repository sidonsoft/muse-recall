<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#DFF2FA;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#DFF2FA",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, wave = 1;
  var muted = false, audioCtx = null, focusIdx = 0, focusRing = null, bubbles = [];
  var hudMoves, hudScore, hudPoints, hudWave, hudMsg, hudHint, endOverlay, endTitle, endDetail, startOverlay;

  function create() {
    var s = this;
    drawFarm(s);
    makeBubbles(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    var cv = document.querySelector("#game canvas");
    if (cv) { cv.setAttribute("tabindex", "0"); cv.setAttribute("role", "application"); cv.setAttribute("aria-label", "Farmyard Match memory game. Use arrow keys to choose a card and press Enter to flip it."); }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // Cool ocean backdrop: pale sky over a calm sea meadow (keeps barn + layout).
    g.fillStyle(0xDFF2FA, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xBFE3F2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xffffff, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xFFE08A, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn in ocean tones
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x1D6FA5, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xF2FAFF, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xF2FAFF, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x5FA8C9, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers / coral dots
    var cols = [0xFFAFCC, 0xFFC8DD, 0x90E0EF, 0xBDE0FE];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2A9D8F, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xFFF200, 1); g.fillCircle(fx, fy - 8, 4);
    }
    // soft waves
    g.lineStyle(5, 0xffffff, 0.7);
    for (var wx = 40; wx < W; wx += 120) {
      g.beginPath();
      g.moveTo(wx, 492);
      g.quadraticCurveTo(wx + 20, 484, wx + 40, 492);
      g.quadraticCurveTo(wx + 60, 500, wx + 80, 492);
      g.strokePath();
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 10, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 50, "Moves: 0", textStyle(21));
    hudScore = scene.add.text(24, 76, "Pairs: 0 / 6", textStyle(21));
    hudPoints = scene.add.text(24, 102, "Score: 0   Streak: 0", textStyle(21, "#1D6FA5"));
    hudWave = scene.add.text(W - 24, 22, "Wave 1", textStyle(22, "#1D6FA5")).setOrigin(1, 0);
    hudMsg = scene.add.text(W - 24, 56, "Tap a card!", textStyle(22)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 110);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    btn.setData("label", "Restart game");
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var mute = scene.add.container(W - 268, 110);
    var mbg = scene.add.graphics();
    mbg.fillStyle(0x102A43, 1); mbg.fillRoundedRect(-64, -26, 128, 52, 26);
    var mlabel = scene.add.text(0, 0, "\u266A Sound: On", textStyle(18, "#ffffff")).setOrigin(0.5);
    mute.add([mbg, mlabel]);
    mute.setData("mlabel", mlabel);
    scene.muteBtn = mute;
    mbg.setInteractive(new Phaser.Geom.Rectangle(-64, -26, 128, 52), Phaser.Geom.Rectangle.Contains);
    mbg.on("pointerdown", function () { toggleMute(scene); });
    hudHint = scene.add.text(W / 2, 168, "Wave 1 \u2022 Find the 6 pairs! Streaks earn bonus!", textStyle(20, "#334E68")).setOrigin(0.5);
    focusRing = scene.add.graphics().setDepth(5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / 6");
    hudPoints.setText("Score: " + score + "   Streak: " + streak);
    hudWave.setText("Wave " + wave);
    hudHint.setText("Wave " + wave + " \u2022 Find the 6 pairs! Streaks earn bonus!");
  }

  function announce(msg) {
    var el = document.getElementById("live");
    if (el) { el.textContent = msg; }
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, idx));
    });
    drawFocus(scene);
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xCAF0F8, 0xADE8F4, 0x90E0EF, 0xBDE0FE, 0xA2D2FF, 0xCCDBFD];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function ensureAudio() {
    if (muted) { return null; }
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return null; }
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      return audioCtx;
    } catch (e) { return null; }
  }

  function playTone(freq, dur, type, vol, delay) {
    if (muted) { return; }
    var ctx = ensureAudio();
    if (!ctx) { return; }
    try {
      var t = ctx.currentTime + (delay || 0);
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function playFlip() { playTone(520, 0.09, "sine", 0.08, 0); }
  function playMatch(st) {
    var base = 620 + Math.min(st, 6) * 40;
    playTone(base, 0.12, "sine", 0.12, 0);
    playTone(base * 1.335, 0.16, "sine", 0.12, 0.09);
  }
  function playMiss() { playTone(240, 0.14, "sine", 0.05, 0); }
  function playWin() {
    var notes = [523, 659, 784, 1047];
    notes.forEach(function (f, i) { playTone(f, 0.18, "triangle", 0.11, i * 0.12); });
  }

  function toggleMute(scene) {
    muted = !muted;
    if (scene && scene.muteBtn) {
      var ml = scene.muteBtn.getData("mlabel");
      if (ml) { ml.setText(muted ? "\u266A Sound: Off" : "\u266A Sound: On"); }
    }
    announce(muted ? "Sound off." : "Sound on.");
    if (!muted) { ensureAudio(); playFlip(); }
  }

  function scorePopup(scene, x, y, text) {
    var p = scene.add.text(x, y, text, textStyle(26, "#1D6FA5")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: p, y: y - 46, alpha: 0, duration: 850, ease: "Cubic.easeOut",
      onComplete: function () { p.destroy(); } });
  }

  function ripple(scene, x, y) {
    var r = scene.add.graphics().setDepth(6);
    r.lineStyle(5, 0x4EA8DE, 0.9);
    r.strokeCircle(x, y, 20);
    var o = { rad: 20 };
    scene.tweens.add({ targets: o, rad: 95, duration: 450, ease: "Cubic.easeOut",
      onUpdate: function () {
        r.clear();
        r.lineStyle(5, 0x4EA8DE, 0.9);
        r.strokeCircle(x, y, o.rad);
      },
      onComplete: function () { r.destroy(); } });
  }

  function drawFocus(scene) {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || !cards.length) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIdx];
    if (!card) { return; }
    var w = card.view.width || 185, h = card.view.height || 140;
    focusRing.lineStyle(4, 0x1D6FA5, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 6, card.view.y - h / 2 - 6, w + 12, h + 12, 26);
  }

  function setupKeyboard(scene) {
    document.addEventListener("keydown", function (e) {
      var k = e.key;
      if (startOverlay && startOverlay.visible) {
        if (k === "Enter" || k === " " || k === "s" || k === "S") { startGame(scene); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (k === "Enter" || k === "n" || k === "N" || k === " ") { nextWave(scene); }
        else if (k === "r" || k === "R") { restart(scene); }
        else if (k === "m" || k === "M") { toggleMute(scene); }
        return;
      }
      if (!started) { return; }
      if (k === "ArrowRight" || k === "ArrowLeft" || k === "ArrowUp" || k === "ArrowDown") {
        if (e.preventDefault) { e.preventDefault(); }
        var cols = 4;
        if (k === "ArrowRight") { focusIdx = (focusIdx + 1) % cards.length; }
        else if (k === "ArrowLeft") { focusIdx = (focusIdx + cards.length - 1) % cards.length; }
        else if (k === "ArrowDown") { focusIdx = (focusIdx + cols) % cards.length; }
        else if (k === "ArrowUp") { focusIdx = (focusIdx + cards.length - cols) % cards.length; }
        drawFocus(scene);
        var fc = cards[focusIdx];
        if (fc) { announce("Card " + (focusIdx + 1) + " of 12" + (fc.matched ? ", matched" : "") + "."); }
      } else if (k === "Enter" || k === " ") {
        if (e.preventDefault) { e.preventDefault(); }
        var c = cards[focusIdx];
        if (c) { onCard(scene, c); }
      } else if (k === "r" || k === "R") { restart(scene); }
      else if (k === "m" || k === "M") { toggleMute(scene); }
      else if (k >= "1" && k <= "9") {
        var idx = parseInt(k, 10) - 1;
        if (idx < cards.length) { focusIdx = idx; drawFocus(scene); onCard(scene, cards[idx]); }
      } else if (k === "0") {
        if (9 < cards.length) { focusIdx = 9; drawFocus(scene); onCard(scene, cards[9]); }
      }
    });
    document.addEventListener("pointerdown", function () { ensureAudio(); }, true);
  }

  function makeBubbles(scene) {
    bubbles.forEach(function (b) { b.destroy(); });
    bubbles = [];
    for (var i = 0; i < 14; i++) {
      var bx = 20 + Math.random() * (W - 40);
      var by = 200 + Math.random() * (H - 220);
      var br = 4 + Math.random() * 10;
      var c = scene.add.graphics().setDepth(1).setAlpha(0.22 + Math.random() * 0.13);
      c.fillStyle(0xffffff, 1);
      c.fillCircle(0, 0, br);
      c.x = bx; c.y = by;
      bubbles.push(c);
      scene.tweens.add({ targets: c, y: by - 60 - Math.random() * 60, x: bx + Phaser.Math.Between(-24, 24),
        duration: 5000 + Math.random() * 5000, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
    }
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    var idx = cards.indexOf(card);
    if (idx >= 0) { focusIdx = idx; drawFocus(scene); }
    ensureAudio(); playFlip();
    flip(card, true);
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("First card: " + card.data.name + ". Pick one more."); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        ripple(scene, card.view.x, card.view.y);
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var points = 100 + (streak - 1) * 25 + (wave - 1) * 10;
        score += points;
        refreshHud();
        scorePopup(scene, card.view.x, card.view.y - 80, "+" + points);
        playMatch(streak);
        var msg;
        if (matches === 6) { msg = "You did it!"; }
        else if (streak >= 3) { msg = "Wavy! Streak x" + streak + "! \u{1F30A}"; }
        else if (streak === 2) { msg = "Great! Streak x2! \u2728"; }
        else { msg = "Yay! A pair! \u{1F389}"; }
        hudMsg.setText(msg);
        announce(msg + " Score " + score + ". Pairs " + matches + " of 6.");
        lockBoard = false;
        drawFocus(scene);
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      var kindMsgs = ["Try again! \u{1F340}", "Good try! \u{1F41A}", "Keep going! \u{1F30A}"];
      var m2 = kindMsgs[moves % kindMsgs.length];
      hudMsg.setText(m2);
      playMiss();
      announce("Not a pair. " + card.data.name + " and " + a.data.name + ". No points lost.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(scene); });
      }, 700);
      streak = 0;
      refreshHud();
    }
  }

  function startGame(scene) {
    ensureAudio(); playFlip();
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    announce("Wave " + wave + " started. Find the 6 animal pairs. Score " + score + ".");
    drawFocus(scene);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -128, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -58, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 56, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 92, 260, 66, 33);
    var arcade = scene.add.text(0, 8, "Arcade waves! Pairs earn 100 pts. Streaks earn bonus.", textStyle(19, "#1D6FA5")).setOrigin(0.5);
    var controls = scene.add.text(0, -168, "Arrows + Enter to flip. R restart. M sound.", textStyle(16, "#334E68")).setOrigin(0.5);
    var btnTx = scene.add.text(0, 125, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, arcade, row, controls, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 92, 260, 66), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} Wave Clear! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -38, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var nextBg = scene.add.graphics();
    nextBg.fillStyle(0x4EA8DE, 1); nextBg.fillRoundedRect(-252, 52, 240, 64, 32);
    var nextTx = scene.add.text(-132, 84, "Next Wave", textStyle(24, "#ffffff")).setOrigin(0.5);
    var againBg = scene.add.graphics();
    againBg.fillStyle(0x102A43, 1); againBg.fillRoundedRect(12, 52, 240, 64, 32);
    var againTx = scene.add.text(132, 84, "Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    var keys = scene.add.text(0, 140, "Enter: next wave. R: restart.", textStyle(16, "#334E68")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, nextBg, nextTx, againBg, againTx, keys]);
    nextBg.setInteractive(new Phaser.Geom.Rectangle(-252, 52, 240, 64), Phaser.Geom.Rectangle.Contains);
    nextBg.on("pointerdown", function () { nextWave(scene); });
    againBg.setInteractive(new Phaser.Geom.Rectangle(12, 52, 240, 64), Phaser.Geom.Rectangle.Contains);
    againBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} Wave " + wave + " Clear! \u{1F389}");
    endDetail.setText("6 pairs found! Moves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "   Best streak: " + bestStreak + "\nNext wave keeps your score going!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Wave clear! \u{1F389}");
    announce("Wave " + wave + " clear! Score " + score + ". Moves " + moves + ". Best streak " + bestStreak + ".");
    playWin();
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F42C}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function nextWave(scene) {
    wave++;
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    refreshHud();
    hudMsg.setText("Wave " + wave + "! Tap a card!");
    announce("Wave " + wave + ". Score carries over: " + score + ".");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0; wave = 1;
    firstPick = null; lockBoard = false; started = true;
    refreshHud();
    hudMsg.setText("Tap a card!");
    announce("Game restarted. Wave 1, score zero.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
