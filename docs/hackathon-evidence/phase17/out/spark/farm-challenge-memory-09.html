<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var CHALLENGE_EXTRA = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F425}", name: "Chick" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var mode = "easy", pendingMode = "easy", focusIndex = 0;
  var hudMoves, hudScore, hudMsg, hudMode, modeBtn, modeBtnLabel, endOverlay, endTitle, endDetail, startOverlay;
  var startSub, easyBtnBg, easyBtnTx, hardBtnBg, hardBtnTx, focusRing;

  function pairCount() { return mode === "challenge" ? 8 : 6; }
  function pendingCount() { return pendingMode === "challenge" ? 8 : 6; }
  function activeAnimals() {
    return mode === "challenge" ? ANIMALS.concat(CHALLENGE_EXTRA) : ANIMALS;
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    focusRing = s.add.graphics().setDepth(5);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    showFocus();
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#102A43")).setOrigin(1, 0.5);
    hudMode = scene.add.text(W - 24, 32, "Mode: Easy (6 pairs)", textStyle(18, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    modeBtn = scene.add.container(W - 110, 172);
    var modeBg = scene.add.graphics();
    modeBg.fillStyle(0x4EA8DE, 1); modeBg.fillRoundedRect(-86, -22, 172, 44, 22);
    modeBtnLabel = scene.add.text(0, 0, "\u2605 Challenge", textStyle(20, "#ffffff")).setOrigin(0.5);
    modeBtn.add([modeBg, modeBtnLabel]);
    modeBg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    modeBg.on("pointerdown", function () {
      setMode(scene, mode === "challenge" ? "easy" : "challenge");
    });
    scene.add.text(W / 2, 168, "Find the animal pairs!", textStyle(22, "#102A43")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    activeAnimals().forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = Math.ceil(deck.length / cols);
    var padX = 22, padY = 16;
    var cw = Math.min(185, (800 - (cols - 1) * padX) / cols);
    var ch = Math.min(140, (470 - (rows - 1) * padY) / rows);
    var gx = (W - (cols * cw + (cols - 1) * padX)) / 2;
    var gy = rows > 3 ? 200 : 195;
    var small = ch < 125;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card, small));
    });
    focusIndex = 0;
    showFocus();
  }

  function makeCard(scene, x, y, w, h, data, small) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, small ? -14 : -18, data.emoji, { fontSize: small ? "46px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, small ? 32 : 44, data.name, textStyle(small ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () {
      focusIndex = cards.indexOf(card);
      showFocus();
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + pairCount());
        hudMsg.setText(matches === pairCount() ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === pairCount()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 430, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -210, 620, 430, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    startSub = scene.add.text(0, -85, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -15, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    easyBtnBg = scene.add.graphics();
    easyBtnTx = scene.add.text(-135, 68, "Easy: 6 pairs", textStyle(20, "#ffffff")).setOrigin(0.5);
    hardBtnBg = scene.add.graphics();
    hardBtnTx = scene.add.text(135, 68, "\u2605 Hard: 8 pairs", textStyle(20, "#ffffff")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 105, 260, 64, 32);
    var btnTx = scene.add.text(0, 137, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 192, "Left / Right picks mode - Enter starts", textStyle(15, "#5C7D99")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, startSub, row, easyBtnBg, easyBtnTx, hardBtnBg, hardBtnTx, btnBg, btnTx, hint]);
    easyBtnBg.setInteractive(new Phaser.Geom.Rectangle(-260, 40, 250, 56), Phaser.Geom.Rectangle.Contains);
    hardBtnBg.setInteractive(new Phaser.Geom.Rectangle(10, 40, 250, 56), Phaser.Geom.Rectangle.Contains);
    easyBtnBg.on("pointerdown", function () { setPendingMode("easy"); });
    hardBtnBg.on("pointerdown", function () { setPendingMode("challenge"); });
    refreshModeButtons();
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 105, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function setPendingMode(m) {
    pendingMode = m;
    refreshModeButtons();
  }

  function refreshModeButtons() {
    if (!easyBtnBg) { return; }
    var pairs = pendingCount();
    startSub.setText("Flip the cards and find\nall " + pairs + " animal pairs!");
    [[easyBtnBg, easyBtnTx, pendingMode === "easy"],
     [hardBtnBg, hardBtnTx, pendingMode === "challenge"]].forEach(function (entry) {
      var g = entry[0], t = entry[1], on = entry[2];
      var cx = t.x;
      g.clear();
      g.fillStyle(on ? 0x4EA8DE : 0xEAF6FB, 1);
      g.fillRoundedRect(cx - 125, 40, 250, 56, 28);
      g.lineStyle(3, 0x4EA8DE, 1);
      g.strokeRoundedRect(cx - 125, 40, 250, 56, 28);
      t.setColor(on ? "#ffffff" : "#102A43");
    });
  }

  function startGame(scene) {
    mode = pendingMode;
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / " + pairCount());
    updateModeHud();
    hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    startOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var need = pairCount();
    var stars = mode === "challenge"
      ? (moves <= 14 ? 3 : (moves <= 22 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    var praise = mode === "challenge" ? "Challenge complete!" : "You found all 6 pairs!";
    if (mode === "challenge") { praise = "Challenge complete: all 8 pairs!"; }
    endTitle.setText(mode === "challenge" ? "\u{1F389} Challenge Win! \u{1F389}" : "\u{1F389} You Win! \u{1F389}");
    endDetail.setText(praise + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nPairs: " + need + " / " + need);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function setMode(scene, m) {
    mode = m; pendingMode = m;
    refreshModeButtons();
    restart(scene);
  }

  function updateModeHud() {
    var label = mode === "challenge" ? "Mode: Challenge (8 pairs)" : "Mode: Easy (6 pairs)";
    if (hudMode) { hudMode.setText(label); }
    if (modeBtnLabel) { modeBtnLabel.setText(mode === "challenge" ? "Easy mode" : "\u2605 Challenge"); }
    if (hudScore) { hudScore.setText("Pairs: " + matches + " / " + pairCount()); }
  }

  function showFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || !cards.length) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIndex];
    if (!card) { return; }
    var pos = card.view.x !== undefined ? { x: card.view.x, y: card.view.y } : { x: W / 2, y: H / 2 };
    focusRing.lineStyle(4, 0x1B6FA0, 1);
    focusRing.strokeRoundedRect(pos.x - card.w / 2 - 4, pos.y - card.h / 2 - 4, card.w + 8, card.h + 8, 24);
  }

  function moveFocus(dx, dy) {
    if (!cards.length) { return; }
    var cols = 4;
    var n = cards.length;
    var row = Math.floor(focusIndex / cols), col = focusIndex % cols;
    var rows = Math.ceil(n / cols);
    col = (col + dx + cols) % cols;
    row = (row + dy + rows) % rows;
    var next = row * cols + col;
    if (next >= n) { next = n - 1; }
    focusIndex = next;
    showFocus();
  }

  function setupKeyboard(scene) {
    var K = (Phaser.Input && Phaser.Input.Keyboard && Phaser.Input.Keyboard.KeyCodes) || {};
    var ENTER = K.ENTER || 13, SPACE = K.SPACE || 32;
    var LEFT = K.LEFT || 37, UP = K.UP || 38, RIGHT = K.RIGHT || 39, DOWN = K.DOWN || 40;
    var ONE = K.ONE || 49, TWO = K.TWO || 50;
    var C = K.C || 67, E = K.E || 69, R = K.R || 82;
    function onStartScreen() {
      return startOverlay && startOverlay.visible;
    }
    function activateFocused() {
      if (onStartScreen()) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      var card = cards[focusIndex];
      if (card) { onCard(scene, card); }
    }
    scene.input.keyboard.on("keydown", function (event) {
      if (!event) { return; }
      var kc = event.keyCode;
      if (kc === ENTER || kc === SPACE) { activateFocused(); }
      else if (kc === LEFT || kc === RIGHT) {
        if (onStartScreen()) { setPendingMode(pendingMode === "challenge" ? "easy" : "challenge"); }
        else { moveFocus(kc === LEFT ? -1 : 1, 0); }
      }
      else if (kc === UP) { if (!onStartScreen()) { moveFocus(0, -1); } }
      else if (kc === DOWN) { if (!onStartScreen()) { moveFocus(0, 1); } }
      else if (kc === ONE || kc === E) { if (onStartScreen()) { setPendingMode("easy"); } }
      else if (kc === TWO) { if (onStartScreen()) { setPendingMode("challenge"); } }
      else if (kc === C) {
        if (onStartScreen()) { setPendingMode("challenge"); }
        else { setMode(scene, mode === "challenge" ? "easy" : "challenge"); }
      }
      else if (kc === R) { if (started) { restart(scene); } }
    });
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + pairCount()); hudMsg.setText("Tap a card!");
    updateModeHud();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
