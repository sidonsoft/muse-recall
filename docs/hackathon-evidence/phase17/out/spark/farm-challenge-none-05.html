<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "🐐", name: "Goat" },
    { emoji: "🐰", name: "Bunny" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var mode = "easy", totalPairs = 6, cursor = 0, cursorBox = null;
  var hudMoves, hudScore, hudMsg, hudSub, endOverlay, endTitle, endDetail, startOverlay;
  var startEasyBg, startHardBg, startFocusHard = false, modeBtns = [];

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / " + totalPairs, textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    makeModeButtons(scene);
  }

  function shuffledDeck(count) {
    var deck = [];
    var pool = ANIMALS.slice(0, count || totalPairs);
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    cursor = 0;
    var deck = shuffledDeck(totalPairs);
    var cols = 4, rows = (totalPairs > 6 ? 4 : 3);
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    if (totalPairs > 6) { ch = 106; gy = 188; padY = 12; }
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    drawCursor(scene);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs);
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, (mode === "hard" ? 450 : 700));
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 430, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 430, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Flip the cards and find\nall the animal pairs!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 30, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    btnTx.setText("Easy: 6 pairs");
    startEasyBg = btnBg;
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0xc0563c, 1); hardBg.fillRoundedRect(-130, 162, 260, 62, 31);
    var hardTx = scene.add.text(0, 193, "Hard: 8 pairs", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hardHint = scene.add.text(0, 60, "Hard: 8 pairs, bigger board, quicker flip-back", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    startHardBg = hardBg;
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx, hardBg, hardTx, hardHint]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(-130, 162, 260, 62), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startFromMenu(scene, "easy"); });
    hardBg.on("pointerdown", function () { startFromMenu(scene, "hard"); });
    btnBg.on("pointerover", function () { btnTx.setScale(1.06); });
    btnBg.on("pointerout", function () { btnTx.setScale(1); });
    hardBg.on("pointerover", function () { hardTx.setScale(1.06); });
    hardBg.on("pointerout", function () { hardTx.setScale(1); });
    highlightStartFocus();
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var par3 = (totalPairs > 6 ? 14 : 10), par2 = (totalPairs > 6 ? 22 : 16);
    var stars = moves <= par3 ? 3 : (moves <= par2 ? 2 : 1);
    endDetail.setText("You found all " + totalPairs + " pairs (" + mode + ")!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs); hudMsg.setText("Tap a card! (" + mode + ")");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshModeLabels(scene);
    drawCursor(scene);
  }

  function makeModeButtons(scene) {
    modeBtns.forEach(function (b) { b.destroy(); });
    modeBtns = [];
    var defs = [
      { id: "easy", x: W / 2 - 70, label: "Easy" },
      { id: "hard", x: W / 2 + 70, label: "Hard" }
    ];
    defs.forEach(function (d) {
      var active = (mode === d.id);
      var bg = scene.add.graphics();
      bg.fillStyle(active ? 0x5da85f : 0xd8cfbc, 1);
      bg.fillRoundedRect(d.x - 62, 96, 124, 34, 17);
      var tx = scene.add.text(d.x, 113, d.label, textStyle(18, active ? "#ffffff" : "#5b3a29")).setOrigin(0.5);
      var holder = scene.add.container(0, 0, [bg, tx]);
      bg.setInteractive(new Phaser.Geom.Rectangle(d.x - 62, 96, 124, 34), Phaser.Geom.Rectangle.Contains);
      bg.on("pointerdown", function () { setMode(scene, d.id); });
      modeBtns.push(holder);
    });
  }

  function refreshModeLabels(scene) {
    hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    hudSub.setText(mode === "hard" ? "Hard: find the 8 animal pairs!" : "Find the 6 animal pairs!");
    makeModeButtons(scene);
  }

  function setMode(scene, next) {
    if (mode === next && started) { return; }
    mode = next;
    totalPairs = (mode === "hard" ? 8 : 6);
    moves = 0; matches = 0; firstPick = null;
    hudMoves.setText("Moves: 0");
    hudMsg.setText(started ? "Tap a card! (" + mode + ")" : "Tap a card!");
    if (endOverlay) { endOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshModeLabels(scene);
    if (started) { lockBoard = false; }
  }

  function startFromMenu(scene, next) {
    mode = next;
    totalPairs = (mode === "hard" ? 8 : 6);
    moves = 0; matches = 0; firstPick = null;
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMoves.setText("Moves: 0");
    hudMsg.setText("Tap a card! (" + mode + ")");
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshModeLabels(scene);
    drawCursor(scene);
  }

  function drawCursor(scene) {
    if (cursorBox) { cursorBox.destroy(); cursorBox = null; }
    if (!cards.length) { return; }
    if (cursor < 0) { cursor = 0; }
    if (cursor >= cards.length) { cursor = cards.length - 1; }
    var card = cards[cursor];
    if (!card) { return; }
    cursorBox = scene.add.graphics().setDepth(5);
    cursorBox.lineStyle(5, 0xffb703, 1);
    cursorBox.strokeRoundedRect(card.view.x - card.w / 2 - 4, card.view.y - card.h / 2 - 4, card.w + 8, card.h + 8, 24);
  }

  function moveCursor(scene, dx, dy) {
    if (!cards.length) { return; }
    if ((endOverlay && endOverlay.visible) || (startOverlay && startOverlay.visible)) { return; }
    var cols = 4;
    var rows = Math.ceil(cards.length / cols);
    var r = Math.floor(cursor / cols), c = cursor % cols;
    r = (r + dy + rows) % rows;
    c = (c + dx + cols) % cols;
    var next = r * cols + c;
    if (next >= cards.length) { next = cards.length - 1; }
    cursor = next;
    drawCursor(scene);
    hudMsg.setText("Selected: " + cards[cursor].data.name + " - press Enter to flip");
  }

  function activateCursor(scene) {
    if ((endOverlay && endOverlay.visible) || (startOverlay && startOverlay.visible)) { return; }
    var card = cards[cursor];
    if (card) { onCard(scene, card); drawCursor(scene); }
  }

  function highlightStartFocus() {
    if (!startEasyBg || !startHardBg) { return; }
    startEasyBg.clear();
    startEasyBg.fillStyle(startFocusHard ? 0x8fc28f : 0x5da85f, 1);
    startEasyBg.fillRoundedRect(-130, 80, 260, 70, 35);
    startHardBg.clear();
    startHardBg.fillStyle(startFocusHard ? 0xc0563c : 0xd98a7a, 1);
    startHardBg.fillRoundedRect(-130, 162, 260, 62, 31);
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-LEFT", function () {
      if (startOverlay && startOverlay.visible) { startFocusHard = false; highlightStartFocus(); }
      else { moveCursor(scene, -1, 0); }
    });
    kb.on("keydown-RIGHT", function () {
      if (startOverlay && startOverlay.visible) { startFocusHard = true; highlightStartFocus(); }
      else { moveCursor(scene, 1, 0); }
    });
    kb.on("keydown-UP", function () { moveCursor(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveCursor(scene, 0, 1); });
    kb.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { startFromMenu(scene, startFocusHard ? "hard" : "easy"); }
      else if (endOverlay && endOverlay.visible) { restart(scene); }
      else { activateCursor(scene); }
    });
    kb.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) { startFromMenu(scene, startFocusHard ? "hard" : "easy"); }
      else if (!(endOverlay && endOverlay.visible)) { activateCursor(scene); }
    });
    kb.on("keydown-E", function () {
      if (startOverlay && startOverlay.visible) { startFromMenu(scene, "easy"); }
      else { setMode(scene, "easy"); }
    });
    kb.on("keydown-H", function () {
      if (startOverlay && startOverlay.visible) { startFromMenu(scene, "hard"); }
      else { setMode(scene, "hard"); }
    });
    kb.on("keydown-R", function () { restart(scene); });
  }

  function update() {}
})();
</script>
</body>
</html>
