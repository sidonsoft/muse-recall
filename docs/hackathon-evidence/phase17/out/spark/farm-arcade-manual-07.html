<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #game:focus{outline:3px solid #4EA8DE;outline-offset:4px}
</style>
</head>
<body>
<div id="game" tabindex="0" role="application" aria-label="Farmyard Match card game. Use arrow keys to choose a card, Enter to flip, R to restart, M to mute sound."></div>
<div id="status" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F986}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, best = 0, level = 1, streak = 0, muted = false;
  var hudMoves, hudScore, hudMsg, hudPoints, hudLevel, endOverlay, endTitle, endDetail, startOverlay;
  var cursorIndex = 0, cursorRing = null, clouds = [], sunDisc = null, sunRays = null;
  var audioCtx = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard();
    announce("Farmyard Match loaded. Press Enter to start.");
  }

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function ensureAudio() {
    if (muted) { return null; }
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      return audioCtx;
    } catch (e) { return null; }
  }

  function tone(freq, t0, dur, vol) {
    var ctx = ensureAudio();
    if (!ctx) { return; }
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      var t = ctx.currentTime + (t0 || 0);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function sndFlip() { tone(520, 0, 0.12, 0.08); }
  function sndMatch() { tone(523, 0, 0.15, 0.12); tone(659, 0.09, 0.15, 0.12); tone(784, 0.18, 0.22, 0.12); }
  function sndMiss() { tone(330, 0, 0.16, 0.07); tone(294, 0.1, 0.18, 0.06); }
  function sndWin() { tone(523, 0, 0.16, 0.12); tone(587, 0.12, 0.16, 0.12); tone(659, 0.24, 0.16, 0.12); tone(784, 0.36, 0.3, 0.12); }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe8f4fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    sunRays = scene.add.graphics();
    sunRays.fillStyle(0x4EA8DE, 0.18); sunRays.fillCircle(770, 110, 58);
    sunDisc = scene.add.graphics();
    sunDisc.fillStyle(0xffe08a, 1); sunDisc.fillCircle(770, 110, 42);
    clouds = [];
    [[200, 110, 1], [590, 80, 1.15]].forEach(function (c) {
      var cl = scene.add.container(c[0], c[1]);
      var cg = scene.add.graphics();
      cg.fillStyle(0xffffff, 1);
      cg.fillEllipse(0, 0, 150 * c[2], 44 * c[2]);
      cg.fillEllipse(55 * c[2], -8, 110 * c[2], 40 * c[2]);
      cg.fillEllipse(-55 * c[2], -6, 90 * c[2], 36 * c[2]);
      cl.add(cg);
      cl.setData("speed", 6 + Math.random() * 6);
      clouds.push(cl);
    });
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudPoints = scene.add.text(24, 122, "Score: 0   Best: 0", textStyle(22));
    hudLevel = scene.add.text(24, 150, "Level 1", textStyle(22, "#4EA8DE"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#102A43")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 110);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    var muteBg = scene.add.graphics();
    muteBg.fillStyle(0xffffff, 1); muteBg.fillRoundedRect(-46, -21, 92, 42, 21);
    muteBg.lineStyle(3, 0x4EA8DE, 1); muteBg.strokeRoundedRect(-46, -21, 92, 42, 21);
    var muteTx = scene.add.text(0, 0, "\u{1F50A} Sound", textStyle(18)).setOrigin(0.5);
    var muteBtn = scene.add.container(W - 70, 158, [muteBg, muteTx]);
    muteBg.setInteractive(new Phaser.Geom.Rectangle(-46, -21, 92, 42), Phaser.Geom.Rectangle.Contains);
    muteBg.on("pointerdown", function () { toggleMute(muteTx); });
    scene.add.text(W / 2, 172, "Find the 6 animal pairs! Streaks earn bonus points!", textStyle(20, "#334E68")).setOrigin(0.5);
  }

  function toggleMute(label) {
    muted = !muted;
    if (label) { label.setText(muted ? "\u{1F507} Muted" : "\u{1F50A} Sound"); }
    announce(muted ? "Sound off." : "Sound on.");
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 200, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    cursorIndex = 0; firstPick = null;
    if (cursorRing) { cursorRing.destroy(); cursorRing = null; }
    cursorRing = scene.add.graphics().setDepth(5);
    drawCursor();
  }

  function drawCursor() {
    if (!cursorRing || !cards.length) { return; }
    var card = cards[cursorIndex];
    if (!card) { return; }
    cursorRing.clear();
    cursorRing.lineStyle(5, 0x4EA8DE, 1);
    cursorRing.strokeRoundedRect(card.x - 98, card.y - 75, 196, 150, 24);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, x: x, y: y };
    cont.on("pointerdown", function () { ensureAudio(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function floatPoints(scene, x, y, text) {
    var t = scene.add.text(x, y - 60, text, textStyle(28, "#0B6FA4")).setOrigin(0.5).setDepth(6);
    scene.tweens.add({ targets: t, y: y - 110, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function refreshPoints() {
    hudPoints.setText("Score: " + score + "   Best: " + best);
    hudLevel.setText("Level " + level + (streak >= 2 ? "   Streak x" + streak + "!" : ""));
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    sndFlip();
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("One card up. Pick one more."); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        sndMatch();
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180 });
        scene.tweens.add({ targets: [a.view, card.view], y: "-=10", yoyo: true, duration: 180 });
        streak++;
        var gained = 100 + (streak >= 2 ? (streak - 1) * 50 : 0);
        score += gained;
        if (score > best) { best = score; }
        refreshPoints();
        floatPoints(scene, card.x, card.y, "+" + gained);
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        var msg = matches === 6 ? "You did it!" : (streak >= 2 ? "Streak x" + streak + "! Amazing! \u{1F389}" : "Yay! A pair! \u{1F389}");
        hudMsg.setText(msg);
        announce(msg + " Pairs " + matches + " of 6. Score " + score + ".");
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      refreshPoints();
      sndMiss();
      hudMsg.setText("Good try! \u{1F340}");
      announce("Good try. Those two did not match. No points lost.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -45, "Flip the cards and find all 6 pairs!\nMatches earn 100 points. Streaks earn bonus!\nArrows + Enter work too. No rushing!", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 35, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F986}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function startGame(scene) {
    ensureAudio();
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Tap a card!");
    announce("Game started. Level " + level + ". Use arrow keys and Enter, or tap a card.");
    if (scene) { scene.tweens.add({ targets: cards.map(function (c) { return c.view; }), scale: { from: 0.96, to: 1 }, duration: 220, ease: "Sine.easeOut" }); }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -175, 580, 350, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -175, 580, 350, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var againBg = scene.add.graphics();
    againBg.fillStyle(0xffffff, 1); againBg.fillRoundedRect(-260, 45, 240, 64, 32);
    againBg.lineStyle(3, 0x4EA8DE, 1); againBg.strokeRoundedRect(-260, 45, 240, 64, 32);
    var againTx = scene.add.text(-140, 77, "\u21BB Replay", textStyle(26)).setOrigin(0.5);
    var nextBg = scene.add.graphics();
    nextBg.fillStyle(0x4EA8DE, 1); nextBg.fillRoundedRect(20, 45, 240, 64, 32);
    var nextTx = scene.add.text(140, 77, "Next Level \u25B6", textStyle(26, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, againBg, againTx, nextBg, nextTx]);
    againBg.setInteractive(new Phaser.Geom.Rectangle(-260, 45, 240, 64), Phaser.Geom.Rectangle.Contains);
    againBg.on("pointerdown", function () { restart(scene, false); });
    nextBg.setInteractive(new Phaser.Geom.Rectangle(20, 45, 240, 64), Phaser.Geom.Rectangle.Contains);
    nextBg.on("pointerdown", function () { restart(scene, true); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    if (score > best) { best = score; }
    refreshPoints();
    endTitle.setText("\u{1F389} Level " + level + " Clear! \u{1F389}");
    endDetail.setText("All 6 pairs found!\nMoves: " + moves + "  Score: " + score + "  " + "\u2B50".repeat(stars) + "\nNext level shuffles the cards again!");
    endOverlay.setVisible(true);
    sndWin();
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.85, to: 1 }, duration: 300, ease: "Back.easeOut" });
    hudMsg.setText("Level " + level + " clear! \u{1F389}");
    announce("Level " + level + " clear. Score " + score + ". Press Enter for the next level.");
    for (var i = 0; i < 36; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F986}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1600, 2600), ease: "Sine.easeIn", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene, nextLevel) {
    if (nextLevel) { level++; }
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    if (!nextLevel) { score = 0; }
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudMsg.setText("Tap a card!");
    refreshPoints();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    announce(nextLevel ? ("Level " + level + " started. Fresh shuffle!") : "New game started. Level " + level + ".");
  }

  function wireKeyboard() {
    window.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        ensureAudio();
      }
      if (startOverlay && startOverlay.visible) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startGame(null); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (e.key === "Enter" || e.key === "n" || e.key === "N") {
          e.preventDefault();
          var sc = cursorRing ? cursorRing.scene : (cards.length ? cards[0].view.scene : null);
          if (sc) { restart(sc, true); }
        } else if (e.key === "r" || e.key === "R") {
          e.preventDefault();
          var sc2 = cursorRing ? cursorRing.scene : (cards.length ? cards[0].view.scene : null);
          if (sc2) { restart(sc2, false); }
        }
        return;
      }
      if (!cards.length) { return; }
      var cols = 4;
      var handled = true;
      if (e.key === "ArrowLeft") { cursorIndex = (cursorIndex + cards.length - 1) % cards.length; }
      else if (e.key === "ArrowRight") { cursorIndex = (cursorIndex + 1) % cards.length; }
      else if (e.key === "ArrowUp") { cursorIndex = (cursorIndex + cards.length - cols) % cards.length; }
      else if (e.key === "ArrowDown") { cursorIndex = (cursorIndex + cols) % cards.length; }
      else if (e.key === "Enter" || e.key === " ") { onCard(cards[cursorIndex].view.scene, cards[cursorIndex]); }
      else if (e.key === "r" || e.key === "R") { restart(cards[cursorIndex].view.scene, false); }
      else if (e.key === "m" || e.key === "M") { muted = !muted; announce(muted ? "Sound off." : "Sound on."); }
      else { handled = false; }
      if (handled) { e.preventDefault(); drawCursor(); }
    });
  }

  function update(time) {
    var t = (time || 0) / 1000;
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      if (!c || !c.active) { continue; }
      c.x += c.getData("speed") * (1 / 60);
      if (c.x > W + 110) { c.x = -110; }
    }
    if (sunDisc) { sunDisc.setScale(1 + Math.sin(t * 0.8) * 0.03); }
    if (sunRays) { sunRays.setScale(1 + Math.sin(t * 0.8 + 0.6) * 0.04); }
  }
})();
</script>
</body>
</html>
