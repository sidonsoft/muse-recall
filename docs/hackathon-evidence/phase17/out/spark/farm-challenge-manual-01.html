<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game-status" class="sr-only" role="status" aria-live="polite"></div>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F407}", name: "Rabbit" }
  ];
  var OCEAN = 0x4EA8DE, INK = "#102A43";
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false, round = 0;
  var moves = 0, matches = 0;
  var mode = "cozy";
  var focusIndex = 0, focusRing = null;
  var hudMoves, hudScore, hudMsg, hudMode, hudGoal, endOverlay, endTitle, endDetail, startOverlay;
  var startSub, startRow, modeCozyBg, modeCozyTx, modeHardBg, modeHardTx;
  var hudCozyBg, hudCozyTx, hudHardBg, hudHardTx, endSwitchBg, endSwitchTx;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    focusRing = s.add.graphics().setDepth(6);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    refreshModeButtons();
    announce("Farmyard Match. Cozy mode, 6 pairs. Pick a mode and press Start.");
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function totalPairs() { return mode === "hard" ? 8 : 6; }

  function animalsForMode() { return ANIMALS.slice(0, totalPairs()); }

  function announce(msg) {
    try {
      var el = document.getElementById("game-status");
      if (el) { el.textContent = msg; }
    } catch (e) {}
  }

  function drawPill(bg, selected) {
    bg.clear();
    if (selected) { bg.fillStyle(OCEAN, 1); }
    else { bg.fillStyle(0xffffff, 1); }
    bg.fillRoundedRect(-bg.pillW / 2, -bg.pillH / 2, bg.pillW, bg.pillH, bg.pillH / 2);
    if (!selected) {
      bg.lineStyle(3, OCEAN, 1);
      bg.strokeRoundedRect(-bg.pillW / 2, -bg.pillH / 2, bg.pillW, bg.pillH, bg.pillH / 2);
    }
  }

  function refreshModeButtons() {
    if (!hudCozyBg || !modeCozyBg || !endSwitchBg) { return; }
    var cozy = mode === "cozy";
    var n = totalPairs();
    drawPill(modeCozyBg, cozy);
    modeCozyTx.setColor(cozy ? "#ffffff" : INK);
    drawPill(modeHardBg, !cozy);
    modeHardTx.setColor(!cozy ? "#ffffff" : INK);
    drawPill(hudCozyBg, cozy);
    hudCozyTx.setColor(cozy ? "#ffffff" : INK);
    drawPill(hudHardBg, !cozy);
    hudHardTx.setColor(!cozy ? "#ffffff" : INK);
    drawPill(endSwitchBg, false);
    hudScore.setText("Pairs: " + matches + " / " + n);
    hudMode.setText("Mode: " + (cozy ? "Cozy Farm" : "Barn Challenge"));
    hudGoal.setText("Find the " + n + " animal pairs!");
    startSub.setText("Flip the cards and find\nall " + n + " animal pairs!");
    startRow.setText(animalsForMode().map(function (a) { return a.emoji; }).join(" "));
    endSwitchTx.setText(cozy ? "Try the 8-pair Challenge!" : "Back to Cozy (6 pairs)");
  }

  function chooseMode(scene, m) {
    if (m !== "cozy" && m !== "hard") { return; }
    if (m === mode) { refreshModeButtons(); return; }
    var picking = !!(startOverlay && startOverlay.visible);
    mode = m;
    firstPick = null; moves = 0; matches = 0;
    hudMoves.setText("Moves: 0");
    refreshModeButtons();
    buildBoard(scene);
    if (picking) {
      started = false; lockBoard = true;
      hudMsg.setText("Pick a mode, then Start!");
      announce(m === "hard" ? "Challenge mode picked: 8 pairs. Press Start when ready." : "Cozy mode picked: 6 pairs. Press Start when ready.");
    } else {
      started = true; lockBoard = false;
      endOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      announce(m === "hard" ? "New Challenge game: 8 pairs. Tap a card!" : "New Cozy game: 6 pairs. Tap a card!");
    }
    focusIndex = 0;
    drawFocus();
  }

  function startGame(scene) {
    if (startOverlay && !startOverlay.visible && started) { return; }
    started = true; lockBoard = false; firstPick = null;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    focusIndex = 0;
    drawFocus();
    announce("Game started. " + totalPairs() + " pairs. Tap a card!");
  }

  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIndex];
    if (!card || card.matched) { return; }
    focusRing.lineStyle(4, OCEAN, 1);
    focusRing.strokeRoundedRect(card.view.x - card.w / 2 - 4, card.view.y - card.h / 2 - 4, card.w + 8, card.h + 8, 24);
  }

  function moveFocus(delta) {
    if (!started || lockBoard || !cards.length) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    focusIndex = (((focusIndex + delta) % cards.length) + cards.length) % cards.length;
    drawFocus();
  }

  function confirmKey(scene) {
    if (startOverlay && startOverlay.visible) { startGame(scene); return; }
    if (endOverlay && endOverlay.visible) { restart(scene); return; }
    if (started && !lockBoard) {
      var card = cards[focusIndex];
      if (card) { onCard(scene, card); }
    }
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-ONE", function () { if (startOverlay.visible) { chooseMode(scene, "cozy"); } });
    kb.on("keydown-TWO", function () { if (startOverlay.visible) { chooseMode(scene, "hard"); } });
    kb.on("keydown-C", function () { chooseMode(scene, mode === "cozy" ? "hard" : "cozy"); });
    kb.on("keydown-R", function () { restart(scene); });
    kb.on("keydown-ENTER", function () { confirmKey(scene); });
    kb.on("keydown-SPACE", function () { confirmKey(scene); });
    kb.on("keydown-LEFT", function () { moveFocus(-1); });
    kb.on("keydown-RIGHT", function () { moveFocus(1); });
    kb.on("keydown-UP", function () { moveFocus(-4); });
    kb.on("keydown-DOWN", function () { moveFocus(4); });
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudMode = scene.add.text(24, 120, "Mode: Cozy Farm", textStyle(20, INK));
    hudGoal = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    var toggle = scene.add.container(W - 100, 172);
    hudCozyBg = scene.add.graphics(); hudCozyBg.pillW = 92; hudCozyBg.pillH = 38; hudCozyBg.x = -50;
    hudHardBg = scene.add.graphics(); hudHardBg.pillW = 92; hudHardBg.pillH = 38; hudHardBg.x = 50;
    hudCozyTx = scene.add.text(-50, 0, "Cozy", textStyle(18, "#ffffff")).setOrigin(0.5);
    hudHardTx = scene.add.text(50, 0, "Hard", textStyle(18, "#ffffff")).setOrigin(0.5);
    toggle.add([hudCozyBg, hudHardBg, hudCozyTx, hudHardTx]);
    drawPill(hudCozyBg, true);
    drawPill(hudHardBg, false);
    hudHardTx.setColor(INK);
    hudCozyBg.setInteractive(new Phaser.Geom.Rectangle(-46, -19, 92, 38), Phaser.Geom.Rectangle.Contains);
    hudHardBg.setInteractive(new Phaser.Geom.Rectangle(-46, -19, 92, 38), Phaser.Geom.Rectangle.Contains);
    hudCozyBg.on("pointerdown", function () { chooseMode(scene, "cozy"); });
    hudHardBg.on("pointerdown", function () { chooseMode(scene, "hard"); });
  }

  function shuffledDeck(pick) {
    var deck = [];
    (pick || animalsForMode()).forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIndex = 0;
    round++;
    var deck = shuffledDeck();
    var hard = totalPairs() === 8;
    var cols = 4, rows = hard ? 4 : 3;
    var cw = 185, ch = hard ? 110 : 140, gx = 62, gy = hard ? 188 : 195, padX = 22, padY = hard ? 13 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    drawFocus();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      var seen = round;
      setTimeout(function () {
        if (seen !== round) { return; }
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        var need = totalPairs();
        hudScore.setText("Pairs: " + matches + " / " + need);
        hudMsg.setText(matches === need ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce(matches === need ? "All pairs found! You did it!" : "Yay! The " + card.data.name + " pair! " + matches + " of " + need + " pairs.");
        lockBoard = false;
        if (matches === need) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      var seenMiss = round;
      setTimeout(function () {
        if (seenMiss !== round) { return; }
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -208, 620, 416, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-310, -208, 620, 416, 30);
    var title = scene.add.text(0, -142, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    startSub = scene.add.text(0, -78, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    startRow = scene.add.text(0, -8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    modeCozyBg = scene.add.graphics(); modeCozyBg.pillW = 250; modeCozyBg.pillH = 54; modeCozyBg.x = -135; modeCozyBg.y = 52;
    modeHardBg = scene.add.graphics(); modeHardBg.pillW = 250; modeHardBg.pillH = 54; modeHardBg.x = 135; modeHardBg.y = 52;
    modeCozyTx = scene.add.text(-135, 52, "Cozy Farm: 6 pairs", textStyle(19, "#ffffff")).setOrigin(0.5);
    modeHardTx = scene.add.text(135, 52, "Challenge: 8 pairs", textStyle(19, INK)).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 102, 260, 66, 33);
    var btnTx = scene.add.text(0, 135, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 188, "Tip: keys 1 / 2 pick a mode, Enter starts", textStyle(14, "#8a6a4a")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, startSub, startRow, modeCozyBg, modeHardBg, modeCozyTx, modeHardTx, btnBg, btnTx, hint]);
    drawPill(modeCozyBg, true);
    drawPill(modeHardBg, false);
    modeCozyBg.setInteractive(new Phaser.Geom.Rectangle(-125, -27, 250, 54), Phaser.Geom.Rectangle.Contains);
    modeHardBg.setInteractive(new Phaser.Geom.Rectangle(-125, -27, 250, 54), Phaser.Geom.Rectangle.Contains);
    modeCozyBg.on("pointerdown", function () { chooseMode(scene, "cozy"); });
    modeHardBg.on("pointerdown", function () { chooseMode(scene, "hard"); });
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 102, 260, 66), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -108, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -38, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 34, 260, 64, 32);
    var btnTx = scene.add.text(0, 66, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endSwitchBg = scene.add.graphics(); endSwitchBg.pillW = 340; endSwitchBg.pillH = 44; endSwitchBg.x = 0; endSwitchBg.y = 128;
    endSwitchTx = scene.add.text(0, 128, "Try the 8-pair Challenge!", textStyle(20, INK)).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, endSwitchBg, endSwitchTx]);
    drawPill(endSwitchBg, false);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 34, 260, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    endSwitchBg.setInteractive(new Phaser.Geom.Rectangle(-170, -22, 340, 44), Phaser.Geom.Rectangle.Contains);
    endSwitchBg.on("pointerdown", function () { chooseMode(scene, mode === "cozy" ? "hard" : "cozy"); });
  }

  function showWin(scene) {
    var need = totalPairs();
    var stars = mode === "hard" ? (moves <= 14 ? 3 : (moves <= 22 ? 2 : 1)) : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    endDetail.setText("You found all " + need + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    refreshModeButtons();
    endOverlay.setVisible(true);
    announce("You win! You found all " + need + " pairs in " + moves + " moves. Great matching!");
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + totalPairs()); hudMsg.setText("Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
    focusIndex = 0;
    drawFocus();
    announce("New game. " + totalPairs() + " pairs. Tap a card!");
  }

  function update() {}
})();
</script>
</body>
</html>
