<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="img" aria-label="Farmyard memory match card game"></div>
<p id="status" class="visually-hidden" aria-live="polite"></p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F413}", name: "Rooster" }
  ];
  var MODES = {
    easy: { label: "Easy", pairs: 6, cols: 4, rows: 3, mismatchMs: 700, star2: 16, star3: 10 },
    hard: { label: "Hard", pairs: 8, cols: 4, rows: 4, mismatchMs: 450, star2: 24, star3: 16 }
  };
  var mode = "easy";
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudSub, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var startSub, startRow, modeBtns = {}, cursor = 0, cursorBox = null;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    announce("Farmyard Match loaded. Choose Easy or Hard, then press Start.");
  }

  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    hudMode = scene.add.text(24, 122, "", textStyle(20, "#8a6a4a")).setOrigin(0, 0.5);
    refreshHudText();
  }

  function refreshHudText() {
    var m = MODES[mode];
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + m.pairs);
    hudSub.setText("Find the " + m.pairs + " animal pairs! (" + m.label + ")");
    hudMode.setText("Mode: " + m.label);
  }

  function shuffledDeck() {
    var deck = [];
    var want = MODES[mode].pairs;
    ANIMALS.slice(0, want).forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function boardLayout() {
    var m = MODES[mode];
    if (m.rows === 4) {
      return { cols: 4, rows: 4, cw: 185, ch: 108, gx: 62, gy: 190, padX: 22, padY: 10, compact: true };
    }
    return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16, compact: false };
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    var deck = shuffledDeck();
    var L = boardLayout();
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / L.cols), c = idx % L.cols;
      var cx = L.gx + c * (L.cw + L.padX) + L.cw / 2;
      var cy = L.gy + r * (L.ch + L.padY) + L.ch / 2;
      cards.push(makeCard(scene, cx, cy, L.cw, L.ch, card, L.compact, idx));
    });
    cursor = 0;
    drawCursor(scene);
  }

  function drawCursor(scene) {
    if (cursorBox) { cursorBox.destroy(); cursorBox = null; }
    if (!cards.length || !started) { return; }
    var target = cards[Math.min(cursor, cards.length - 1)];
    var w = target.w || 185, h = target.h || 140;
    cursorBox = scene.add.graphics().setDepth(5);
    cursorBox.lineStyle(4, 0x5b3a29, 1);
    cursorBox.strokeRoundedRect(target.x - w / 2 - 4, target.y - h / 2 - 4, w + 8, h + 8, 24);
  }

  function makeCard(scene, x, y, w, h, data, compact, index) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, compact ? -14 : -18, data.emoji, { fontSize: compact ? "44px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, compact ? 28 : 44, data.name, textStyle(compact ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, x: x, y: y, w: w, h: h, index: index };
    cont.on("pointerdown", function () { cursor = card.index; drawCursor(scene); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) {
      firstPick = card;
      hudMsg.setText("One more!");
      announce(card.data.name + " flipped. Pick one more card.");
      return;
    }
    moves++;
    var m = MODES[mode];
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + m.pairs);
        hudMsg.setText(matches === m.pairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce("Pair found! " + matches + " of " + m.pairs + " pairs. Moves: " + moves + ".");
        lockBoard = false;
        if (matches === m.pairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("No match. " + a.data.name + " and " + card.data.name + ".");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, m.mismatchMs);
    }
  }

  function modeEmojis() {
    var list = ANIMALS.slice(0, MODES[mode].pairs).map(function (a) { return a.emoji; });
    return list.join(" ");
  }

  function refreshStartText() {
    var m = MODES[mode];
    startSub.setText("Flip the cards and find\nall " + m.pairs + " animal pairs!" + (mode === "hard" ? "\nHard: 16 cards, quick flip-back!" : "\nEasy: 12 cards, relaxed pace."));
    startRow.setText(modeEmojis());
    ["easy", "hard"].forEach(function (k) {
      var b = modeBtns[k];
      if (!b) { return; }
      b.bg.clear();
      if (k === mode) {
        b.bg.fillStyle(0x5da85f, 1);
      } else {
        b.bg.fillStyle(0xffffff, 1);
        b.bg.lineStyle(4, 0x5da85f, 1);
      }
      b.bg.fillRoundedRect(b.x, b.y, b.w, b.h, 24);
      if (k !== mode) { b.bg.strokeRoundedRect(b.x, b.y, b.w, b.h, 24); }
      b.tx.setColor(k === mode ? "#ffffff" : "#5b3a29");
      b.sx.setColor(k === mode ? "#ffffff" : "#8a6a4a");
    });
  }

  function setMode(scene, next) {
    if (!MODES[next]) { return; }
    mode = next;
    refreshHudText();
    refreshStartText();
    announce(MODES[next].label + " mode selected: " + MODES[next].pairs + " pairs. Press Start or Enter to play.");
  }

  function makeModeButton(scene, key, cx, cy, label, sub) {
    var w = 200, h = 64, x = cx - w / 2, y = cy - h / 2;
    var bg = scene.add.graphics();
    var tx = scene.add.text(cx, cy - 8, label, textStyle(24, "#ffffff")).setOrigin(0.5);
    var sx = scene.add.text(cx, cy + 16, sub, textStyle(15, "#ffffff")).setOrigin(0.5);
    modeBtns[key] = { bg: bg, tx: tx, sx: sx, x: x, y: y, w: w, h: h, cx: cx, cy: cy };
    bg.setInteractive(new Phaser.Geom.Rectangle(x, y, w, h), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { setMode(scene, key); refreshStartText(); drawCursor(scene); });
    bg.on("pointerover", function () { scene.game.canvas.style.cursor = "pointer"; });
    bg.on("pointerout", function () { scene.game.canvas.style.cursor = "default"; });
    return [bg, tx, sx];
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -225, 620, 450, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-310, -225, 620, 450, 30);
    var title = scene.add.text(0, -165, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    startSub = scene.add.text(0, -85, "", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    startRow = scene.add.text(0, -5, "", { fontSize: "34px" }).setOrigin(0.5);
    var easyParts = makeModeButton(scene, "easy", -110, 62, "Easy", "6 pairs");
    var hardParts = makeModeButton(scene, "hard", 110, 62, "Hard", "8 pairs");
    var hint = scene.add.text(0, 105, "Keys: E = Easy, H = Hard, Enter = Start", textStyle(16, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 125, 260, 70, 35);
    var btnTx = scene.add.text(0, 160, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, startSub, startRow].concat(easyParts, hardParts, [hint, btnBg, btnTx]));
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 125, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
    refreshStartText();
  }

  function startGame(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    hudMsg.setText("Tap a card!");
    refreshHudText();
    buildBoard(scene);
    drawCursor(scene);
    announce(MODES[mode].label + " game started. " + MODES[mode].pairs + " pairs. Use arrow keys and Enter to flip cards.");
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-260, 50, 240, 70, 35);
    var btnTx = scene.add.text(-140, 85, "\u21BB Play Again", textStyle(26, "#ffffff")).setOrigin(0.5);
    var menuBg = scene.add.graphics();
    menuBg.fillStyle(0xffffff, 1); menuBg.fillRoundedRect(20, 50, 240, 70, 35);
    menuBg.lineStyle(4, 0x5da85f, 1); menuBg.strokeRoundedRect(20, 50, 240, 70, 35);
    var menuTx = scene.add.text(140, 85, "Menu", textStyle(26, "#5b3a29")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, menuBg, menuTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-260, 50, 240, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    menuBg.setInteractive(new Phaser.Geom.Rectangle(20, 50, 240, 70), Phaser.Geom.Rectangle.Contains);
    menuBg.on("pointerdown", function () { showMenu(scene); });
  }

  function showWin(scene) {
    var m = MODES[mode];
    var stars = moves <= m.star3 ? 3 : (moves <= m.star2 ? 2 : 1);
    endTitle.setText("\u{1F389} " + m.label + " Win! \u{1F389}");
    endDetail.setText("You found all " + m.pairs + " pairs (" + m.label + ")!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    announce("You win " + m.label + " mode in " + moves + " moves!");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    hudMsg.setText("Tap a card!");
    refreshHudText();
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    drawCursor(scene);
    announce(MODES[mode].label + " game restarted. " + MODES[mode].pairs + " pairs.");
  }

  function showMenu(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = true; started = false;
    refreshHudText();
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    if (cursorBox) { cursorBox.destroy(); cursorBox = null; }
    refreshStartText();
    startOverlay.setVisible(true);
    hudMsg.setText("Pick a mode!");
    announce("Menu. Choose Easy or Hard, then press Start.");
  }

  function moveCursor(scene, dx, dy) {
    if (!cards.length) { return; }
    var m = MODES[mode];
    var cols = m.cols;
    var next = cursor + dx + dy * cols;
    next = Math.max(0, Math.min(cards.length - 1, next));
    cursor = next;
    drawCursor(scene);
    if (cards[cursor]) {
      announce("Card " + (cursor + 1) + " of " + cards.length + (cards[cursor].matched ? ", matched" : "") + ".");
    }
  }

  function flipCursorCard(scene) {
    if (!started || lockBoard) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[Math.min(cursor, cards.length - 1)];
    if (card) { onCard(scene, card); }
  }

  function setupKeyboard(scene) {
    var kb = scene.input.keyboard;
    if (!kb) { return; }
    kb.on("keydown-E", function () { if (startOverlay && startOverlay.visible) { setMode(scene, "easy"); } });
    kb.on("keydown-H", function () { if (startOverlay && startOverlay.visible) { setMode(scene, "hard"); } });
    kb.on("keydown-ONE", function () { if (startOverlay && startOverlay.visible) { setMode(scene, "easy"); } });
    kb.on("keydown-TWO", function () { if (startOverlay && startOverlay.visible) { setMode(scene, "hard"); } });
    kb.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      flipCursorCard(scene);
    });
    kb.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      flipCursorCard(scene);
    });
    kb.on("keydown-LEFT", function () { moveCursor(scene, -1, 0); });
    kb.on("keydown-RIGHT", function () { moveCursor(scene, 1, 0); });
    kb.on("keydown-UP", function () { moveCursor(scene, 0, -1); });
    kb.on("keydown-DOWN", function () { moveCursor(scene, 0, 1); });
    kb.on("keydown-R", function () {
      if (started && !(endOverlay && endOverlay.visible)) { restart(scene); }
    });
    kb.on("keydown-M", function () {
      if (endOverlay && endOverlay.visible) { showMenu(scene); }
    });
  }

  function update() {}
})();
</script>
</body>
</html>
