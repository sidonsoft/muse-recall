<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to choose a card and Enter to flip it. Press E for easy mode, H for hard mode."></div>
<p class="sr-only">Farmyard Match: flip cards to find animal pairs. Arrow keys move between cards, Enter flips a card. Hard mode has more pairs, with no timer and no penalties.</p>
<div id="status" class="sr-only" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F415}", name: "Dog" },
    { emoji: "\u{1F408}", name: "Cat" }
  ];
  var W = 900, H = 700;
  var isHard = false;
  function pairCount() { return isHard ? 8 : 6; }
  function modeName() { return isHard ? "Hard" : "Easy"; }

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudGoal, modeBtn, modeBtnLabel, endOverlay, endTitle, endDetail, startOverlay;
  var focusIdx = 0, focusRing = null;
  function announce(msg) {
    try { var el = document.getElementById("status"); if (el) { el.textContent = msg; } } catch (e) {}
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    focusRing = s.add.graphics().setDepth(5);
    drawFocus();
    s.input.keyboard.on("keydown", function (ev) { onKey(s, ev); });
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / " + pairCount(), textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudGoal = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    modeBtn = scene.add.container(W - 110, 172);
    varmbg = scene.add.graphics();
    varmbg.fillStyle(0x4EA8DE, 1); varmbg.fillRoundedRect(-86, -22, 172, 44, 22);
    modeBtnLabel = scene.add.text(0, 0, "★ Hard: Off", textStyle(20, "#ffffff")).setOrigin(0.5);
    modeBtn.add([varmbg, modeBtnLabel]);
    varmbg.setInteractive(new Phaser.Geom.Rectangle(-86, -22, 172, 44), Phaser.Geom.Rectangle.Contains);
    varmbg.on("pointerdown", function () { toggleMode(scene); });
    varmbg.on("pointerover", function () { modeBtn.setScale(1.06); });
    varmbg.on("pointerout", function () { modeBtn.setScale(1); });
    refreshHud();
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + pairCount());
    hudGoal.setText("Find the " + pairCount() + " animal pairs! (" + modeName() + ")");
    if (modeBtnLabel) { modeBtnLabel.setText(isHard ? "★ Hard: On" : "☆ Hard: Off"); }
  }

  function toggleMode(scene) {
    isHard = !isHard;
    announce(isHard ? "Hard mode selected. Eight pairs." : "Easy mode selected. Six pairs.");
    restart(scene);
  }

  function shuffledDeck() {
    var deck = [];
    var pool = ANIMALS.slice(0, pairCount());
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    focusIdx = 0; firstPick = null;
    var deck = shuffledDeck();
    var cols = 4, rows = isHard ? 4 : 3;
    var cw = 185, ch = isHard ? 104 : 140, gx = 62, gy = isHard ? 200 : 195, padX = 22, padY = isHard ? 10 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (typeof hudScore !== "undefined" && hudScore) { refreshHud(); }
    drawFocus();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var small = h < 120;
    var paw = scene.add.text(0, small ? -4 : -6, "\u{1F43E}", { fontSize: small ? "42px" : "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xd0ebff, 0xcaf0f8];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, small ? -12 : -18, data.emoji, { fontSize: small ? "46px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, small ? 30 : 44, data.name, textStyle(small ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); announce("One card up. Pick one more."); drawFocus(); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + pairCount());
        hudMsg.setText(matches === pairCount() ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce(matches === pairCount() ? "You found every pair. Well done!" : "A pair! " + matches + " of " + pairCount() + " found. Keep going.");
        lockBoard = false;
        drawFocus();
        if (matches === pairCount()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      announce("Those two are different. Try again, there is no hurry.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawFocus(); });
      }, 700);
    }
  }

  function startGame(scene, hard) {
    isHard = !!hard;
    started = true; lockBoard = false;
    moves = 0; matches = 0; firstPick = null;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshHud();
    hudMsg.setText("Tap a card!");
    announce(isHard ? "Hard mode started. Find all 8 pairs. No timer, no worries." : "Easy mode started. Find all 6 pairs. Have fun!");
    drawFocus();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -85, "Pick a mode, then flip cards\nto find every pair!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -15, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "38px" }).setOrigin(0.5);
    var easyBg = scene.add.graphics();
    easyBg.fillStyle(0x5da85f, 1); easyBg.fillRoundedRect(-262, 48, 248, 64, 32);
    var easyTx = scene.add.text(-138, 80, "\u25B6 Easy (6)", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x4EA8DE, 1); hardBg.fillRoundedRect(14, 48, 248, 64, 32);
    var hardTx = scene.add.text(138, 80, "★ Hard (8)", textStyle(26, "#ffffff")).setOrigin(0.5);
    var calm = scene.add.text(0, 138, "Hard has 8 pairs. Same calm play: no timer, no penalties.", textStyle(17, "#102A43")).setOrigin(0.5);
    var keys = scene.add.text(0, 162, "Keys: E = Easy, H = Hard, arrows + Enter flip cards", textStyle(15, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, easyBg, easyTx, hardBg, hardTx, calm, keys]);
    easyBg.setInteractive(new Phaser.Geom.Rectangle(-262, 48, 248, 64), Phaser.Geom.Rectangle.Contains);
    easyBg.on("pointerdown", function () { startGame(scene, false); });
    hardBg.setInteractive(new Phaser.Geom.Rectangle(14, 48, 248, 64), Phaser.Geom.Rectangle.Contains);
    hardBg.on("pointerdown", function () { startGame(scene, true); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var limit3 = isHard ? 14 : 10, limit2 = isHard ? 22 : 16;
    var stars = moves <= limit3 ? 3 : (moves <= limit2 ? 2 : 1);
    endDetail.setText("You found all " + pairCount() + " pairs (" + modeName() + ")!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nNo timer, no penalties — nice playing!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    refreshHud(); hudMsg.setText("Tap a card!");
    announce(modeName() + " game restarted. Find all " + pairCount() + " pairs.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function colsForMode() { return 4; }

  function drawFocus() {
    if (!focusRing) { return; }
    focusRing.clear();
    if (!started || !cards.length) { return; }
    if (startOverlay && startOverlay.visible) { return; }
    if (endOverlay && endOverlay.visible) { return; }
    var card = cards[focusIdx];
    if (!card || !card.view) { return; }
    var w = card.w || card.view.width || 185, h = card.h || card.view.height || 140;
    var x = card.view.x, y = card.view.y;
    focusRing.lineStyle(5, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(x - w / 2 - 5, y - h / 2 - 5, w + 10, h + 10, 24);
  }

  function moveFocus(dRow, dCol) {
    if (!cards.length) { return; }
    var cols = colsForMode();
    var rows = Math.ceil(cards.length / cols);
    var r = Math.floor(focusIdx / cols), c = focusIdx % cols;
    r = (r + dRow + rows) % rows;
    c = (c + dCol + cols) % cols;
    var next = r * cols + c;
    if (next >= cards.length) { next = cards.length - 1; }
    focusIdx = next;
    drawFocus();
  }

  function onKey(scene, ev) {
    var k = ev.key;
    var kl = (k || "").toLowerCase();
    if (startOverlay && startOverlay.visible) {
      if (kl === "e" || kl === "1") { startGame(scene, false); if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} } }
      else if (kl === "h" || kl === "2") { startGame(scene, true); if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} } }
      else if (k === "Enter" || k === " ") { startGame(scene, isHard); if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} } }
      return;
    }
    if (endOverlay && endOverlay.visible) {
      if (kl === "e") { startGame(scene, false); }
      else if (kl === "h") { startGame(scene, true); }
      else if (k === "Enter" || k === " " || kl === "r") { restart(scene); }
      return;
    }
    if (kl === "e" && !started) { return; }
    if (kl === "h") { toggleMode(scene); return; }
    if (kl === "r") { restart(scene); return; }
    var cols = colsForMode();
    if (k === "ArrowLeft") { moveFocus(0, -1); if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} } }
    else if (k === "ArrowRight") { moveFocus(0, 1); if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} } }
    else if (k === "ArrowUp") { moveFocus(-1, 0); if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} } }
    else if (k === "ArrowDown") { moveFocus(1, 0); if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} } }
    else if (k === "Enter" || k === " ") {
      var card = cards[focusIdx];
      if (card) { onCard(scene, card); }
      if (ev.preventDefault) { try { ev.preventDefault(); } catch (e) {} }
    }
  }

  function update() {}
})();
</script>
</body>
</html>
