<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, endOverlay, endTitle, endDetail, startOverlay;
  // Arcade additions: countdown clock, score + combo streak, keyboard focus.
  var TIME_LIMIT = 90, MISS_PENALTY = 3;
  var score = 0, streak = 0, bestStreak = 0, timeLeft = TIME_LIMIT;
  var timerEv = null, over = false;
  var hudPoints, hudTime, focusRing, focusIdx = 0, keyUsed = false;

  // Boot after state above exists, so create() is safe however Phaser schedules it.
  new Phaser.Game(config);

  function create() {
    var s = this;
    if (s.game && s.game.canvas) {
      s.game.canvas.setAttribute("tabindex", "0");
      s.game.canvas.setAttribute("role", "application");
      s.game.canvas.setAttribute("aria-label", "Farmyard Match memory card game. Use arrow keys to choose a card and Enter to flip it.");
    }
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudPoints = scene.add.text(24, 122, "Score: 0", textStyle(24, "#2a7f2e"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    hudTime = scene.add.text(W - 24, 22, "⏱ 1:30", textStyle(26, "#7a4a2b")).setOrigin(1, 0);
    focusRing = scene.add.graphics().setDepth(5).setVisible(false);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match fast — 90 seconds on the clock! Miss = -3s", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { if (c.view) { c.view.destroy(); } });
    cards = [];
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIdx = 0;
    updateFocusRing(scene);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, x: x, y: y, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || over || lockBoard || card.faceUp || card.matched) { return; }
    var ci = cards.indexOf(card);
    if (ci >= 0) { focusIdx = ci; updateFocusRing(scene); }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        if (over) { return; }
        a.matched = card.matched = true;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 50;
        score += gained;
        hudPoints.setText("Score: " + score + (streak > 1 ? "  Combo x" + streak : ""));
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.18, yoyo: true, duration: 180, ease: "Quad.easeOut" });
        burst(scene, card.x, card.y);
        popupText(scene, card.x, card.y - 70, "+" + gained + (streak > 1 ? "  COMBO x" + streak + "!" : ""), "#2a7f2e");
        matches++;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudMsg.setText(matches === 6 ? "You did it!" : (streak > 1 ? "Combo x" + streak + "! \u{1F525}" : "Yay! A pair! \u{1F389}"));
        lockBoard = false;
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      hudPoints.setText("Score: " + score);
      hudMsg.setText("Try again! \u{1F340}");
      timeLeft = Math.max(0, timeLeft - MISS_PENALTY);
      updateTimerHud(scene);
      popupText(scene, card.x, card.y - 70, "-" + MISS_PENALTY + "s", "#d62828");
      if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(140, 0.006); }
      if (timeLeft <= 0) {
        flip(a, false); flip(card, false);
        lockBoard = false;
        gameOver(scene);
        return;
      }
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 22, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var rules = scene.add.text(0, 58, "90 seconds! Pair fast for combos. Miss = -3s.", textStyle(20, "#8a6a4a")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, rules, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function fmtTime(t) {
    var m = Math.floor(t / 60), s = t % 60;
    return m + ":" + (s < 10 ? "0" + s : "" + s);
  }

  function updateTimerHud(scene) {
    if (!hudTime) { return; }
    hudTime.setText("⏱ " + fmtTime(timeLeft));
    hudTime.setColor(timeLeft <= 15 ? "#d62828" : "#7a4a2b");
    if (timeLeft <= 15 && started && !over && scene) {
      scene.tweens.killTweensOf(hudTime);
      hudTime.setScale(1);
      scene.tweens.add({ targets: hudTime, scale: 1.15, yoyo: true, duration: 240 });
    } else if (scene) {
      scene.tweens.killTweensOf(hudTime);
      hudTime.setScale(1);
    }
  }

  function startTimer(scene) {
    stopTimer(scene);
    updateTimerHud(scene);
    timerEv = scene.time.addEvent({ delay: 1000, loop: true, callback: function () {
      if (over || !started) { return; }
      timeLeft = Math.max(0, timeLeft - 1);
      updateTimerHud(scene);
      if (timeLeft <= 0) { gameOver(scene); }
    }});
  }

  function stopTimer(scene) {
    if (timerEv) { try { timerEv.remove(false); } catch (e) {} timerEv = null; }
  }

  function popupText(scene, x, y, msg, color) {
    var t = scene.add.text(x, y, msg, textStyle(26, color || "#2a7f2e")).setOrigin(0.5).setDepth(15);
    scene.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 900, ease: "Quad.easeOut",
      onComplete: function () { t.destroy(); } });
  }

  function burst(scene, x, y) {
    var bits = ["\u2B50", "\u{1F389}", "\u2728", "\u{1F33B}"];
    for (var i = 0; i < 10; i++) {
      var p = scene.add.text(x, y, bits[i % bits.length], { fontSize: "24px" }).setOrigin(0.5).setDepth(15);
      var dx = Phaser.Math.Between(-110, 110), dy = Phaser.Math.Between(-120, -20);
      scene.tweens.add({ targets: p, x: x + dx, y: y + dy, alpha: 0, duration: Phaser.Math.Between(500, 900),
        ease: "Quad.easeOut", onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function updateFocusRing(scene) {
    if (!focusRing) { return; }
    if (!started || over || !cards.length) { focusRing.setVisible(false); return; }
    if (focusIdx < 0 || focusIdx >= cards.length) { focusIdx = 0; }
    var c = cards[focusIdx];
    focusRing.clear();
    if (keyUsed && !c.matched) {
      focusRing.lineStyle(5, 0xffb703, 1);
      focusRing.strokeRoundedRect(c.x - c.w / 2 - 5, c.y - c.h / 2 - 5, c.w + 10, c.h + 10, 26);
    }
    focusRing.setVisible(keyUsed);
  }

  function setupKeyboard(scene) {
    if (!scene.input || !scene.input.keyboard) { return; }
    scene.input.keyboard.on("keydown", function (e) {
      var k = (e.key || "").toLowerCase();
      var code = e.keyCode || 0;
      var isEnter = k === "enter" || k === " " || code === 13 || code === 32;
      if (startOverlay && startOverlay.visible) {
        if (isEnter) { startGame(scene); }
        return;
      }
      if (endOverlay && endOverlay.visible) {
        if (isEnter || k === "r") { restart(scene); }
        return;
      }
      if (!started || over) { return; }
      var cols = 4, moved = false;
      if (k === "arrowleft" || k === "a") { focusIdx = (focusIdx + cards.length - 1) % cards.length; moved = true; }
      else if (k === "arrowright" || k === "d") { focusIdx = (focusIdx + 1) % cards.length; moved = true; }
      else if (k === "arrowup" || k === "w") { focusIdx = (focusIdx + cards.length - cols) % cards.length; moved = true; }
      else if (k === "arrowdown" || k === "s") { focusIdx = (focusIdx + cols) % cards.length; moved = true; }
      else if (k === "r") { restart(scene); return; }
      if (moved) { keyUsed = true; updateFocusRing(scene); return; }
      if (isEnter && cards[focusIdx]) { keyUsed = true; onCard(scene, cards[focusIdx]); }
    });
  }

  function startGame(scene) {
    started = true; lockBoard = false; over = false;
    if (timeLeft <= 0 || matches === 6) {
      moves = 0; matches = 0; score = 0; streak = 0; timeLeft = TIME_LIMIT; firstPick = null;
      hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6"); hudPoints.setText("Score: 0");
    }
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    hudMsg.setText("Tap a card! Arrows + Enter works too.");
    updateFocusRing(scene);
    startTimer(scene);
  }

  function showWin(scene) {
    over = true;
    stopTimer(scene);
    var timeBonus = timeLeft * 5;
    score += timeBonus;
    hudPoints.setText("Score: " + score);
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText("\u{1F389} You Win! \u{1F389}");
    endDetail.setText("All 6 pairs in " + fmtTime(TIME_LIMIT - timeLeft) + "!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) +
      "\nTime bonus: +" + timeBonus + "  Best combo: x" + Math.max(1, bestStreak) + "\nScore: " + score);
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389} Score " + score);
    if (scene.cameras && scene.cameras.main) { scene.cameras.main.flash(200, 255, 255, 255); }
    for (var i = 0; i < 60; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F525}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function gameOver(scene) {
    if (over) { return; }
    over = true; lockBoard = true; firstPick = null;
    stopTimer(scene);
    timeLeft = Math.max(0, timeLeft);
    updateTimerHud(scene);
    endTitle.setText("⏰ Time's Up!");
    endDetail.setText("You found " + matches + " / 6 pairs.\nMoves: " + moves + "  Score: " + score + "\nPress Enter or Play Again!");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Time's up! Try again! \u{1F525}");
    if (scene.cameras && scene.cameras.main) { scene.cameras.main.shake(200, 0.008); }
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; timeLeft = TIME_LIMIT;
    firstPick = null; lockBoard = false; started = true; over = false;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: 0"); hudMsg.setText("Tap a card!");
    updateTimerHud(scene);
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    startTimer(scene);
  }

  function update() {
    if (started && !over && timeLeft <= 10 && hudTime) {
      hudTime.setAlpha((Math.floor(Date.now() / 250) % 2 === 0) ? 1 : 0.45);
    } else if (hudTime) {
      hudTime.setAlpha(1);
    }
  }
})();
</script>
</body>
</html>
