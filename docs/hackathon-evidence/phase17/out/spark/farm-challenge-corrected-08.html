<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game"></div>
<div id="status" class="sr-only" aria-live="polite">Farmyard Match loaded. Choose a difficulty and press Start.</div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var EXTRA_ANIMALS = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F407}", name: "Rabbit" }
  ];
  var ACCENT = 0x4EA8DE, INK = "#102A43";
  var mode = "normal";
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, focusIdx = 0;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, startOverlay;
  var modeBtnNormal, modeBtnHard, focusRing;
  function pairCount() { return mode === "hard" ? 8 : 6; }
  function activeAnimals() { return mode === "hard" ? ANIMALS.concat(EXTRA_ANIMALS) : ANIMALS; }
  function mismatchDelay() { return mode === "hard" ? 400 : 700; }
  function announce(msg) {
    var el = document.getElementById("status");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMode = scene.add.text(24, 122, "Mode: Normal", textStyle(20));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(ACCENT, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find the pairs! Keys 1/2 pick mode, R restarts.", textStyle(22, INK)).setOrigin(0.5);
    scene.input.keyboard.on("keydown", function (e) { onKey(scene, e); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && startOverlay && startOverlay.visible) { beginPlay(scene); }
    });
  }

  function shuffledDeck() {
    var deck = [];
    activeAnimals().forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    var deck = shuffledDeck();
    var hard = (mode === "hard");
    var cols = 4, rows = hard ? 4 : 3;
    var cw = hard ? 185 : 185, ch = hard ? 105 : 140, gx = 62, gy = 195, padX = 22, padY = hard ? 12 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    focusIdx = 0;
    drawFocus(scene);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var compact = (h < 120);
    var emo = scene.add.text(0, compact ? -12 : -18, data.emoji, { fontSize: compact ? "44px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, compact ? 32 : 44, data.name, textStyle(compact ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { focusIdx = cards.indexOf(card); drawFocus(scene); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + pairCount());
        hudMsg.setText(matches === pairCount() ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        announce("Pair found! " + matches + " of " + pairCount() + ".");
        if (matches === pairCount()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
        announce("No match. Cards flipped back.");
      }, mismatchDelay());
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -210, 600, 420, 30);
    panel.lineStyle(6, ACCENT, 1); panel.strokeRoundedRect(-300, -210, 600, 420, 30);
    var title = scene.add.text(0, -120, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(40)).setOrigin(0.5);
    var sub = scene.add.text(0, -50, "Flip the cards and find\nall 6 animal pairs!", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 5, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "44px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 100, 260, 70, 35);
    var btnTx = scene.add.text(0, 135, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 100, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { beginPlay(scene); });
    modeBtnNormal = makeModeButton(scene, -140, 68, "Normal 6", "normal");
    modeBtnHard = makeModeButton(scene, 140, 68, "Hard 8", "hard");
    paintModeButtons();
    startOverlay.add([modeBtnNormal.c, modeBtnHard.c]);
    announce("Choose Normal with 6 pairs or Hard with 8 pairs, then press Start.");
  }

  function makeModeButton(scene, x, y, label, value) {
    var c = scene.add.container(x, y);
    var g = scene.add.graphics();
    var t = scene.add.text(0, 0, label, textStyle(22, "#ffffff")).setOrigin(0.5);
    c.add([g, t]);
    g.setInteractive(new Phaser.Geom.Rectangle(-120, -28, 240, 56), Phaser.Geom.Rectangle.Contains);
    g.on("pointerdown", function () { setMode(scene, value); });
    return { c: c, g: g, t: t, value: value };
  }

  function paintModeButtons() {
    [["normal", modeBtnNormal], ["hard", modeBtnHard]].forEach(function (pair) {
      var value = pair[0], b = pair[1];
      if (!b) { return; }
      var selected = (mode === value);
      b.g.clear();
      if (selected) { b.g.fillStyle(ACCENT, 1); }
      else { b.g.fillStyle(0xe6f2f9, 1); }
      b.g.fillRoundedRect(-120, -28, 240, 56, 28);
      b.g.lineStyle(selected ? 0 : 3, ACCENT, 1);
      if (!selected) { b.g.strokeRoundedRect(-120, -28, 240, 56, 28); }
      b.t.setColor(selected ? "#ffffff" : INK);
    });
  }

  function setMode(scene, value) {
    mode = value;
    paintModeButtons();
    var sub2 = "Flip the cards and find\nall " + pairCount() + " animal pairs!";
    startOverlay.list.forEach(function (child) {
      if (child && child.type === "Text" && child.y === -50) { child.setText(sub2); }
    });
    announce((mode === "hard" ? "Hard mode: 8 pairs, faster flip-back." : "Normal mode: 6 pairs.") + " Press Start to play.");
  }

  function beginPlay(scene) {
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    restart(scene);
    hudMsg.setText("Tap a card!");
    announce((mode === "hard" ? "Hard mode" : "Normal mode") + " started. " + pairCount() + " pairs. Use arrow keys and Enter to flip cards.");
  }

  function drawFocus(scene) {
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    if (!cards.length || !started) { return; }
    if (focusIdx < 0) { focusIdx = 0; }
    if (focusIdx >= cards.length) { focusIdx = cards.length - 1; }
    var target = cards[focusIdx].view;
    var hw = (target.width || 185) / 2 + 7, hh = (target.height || 140) / 2 + 7;
    focusRing = scene.add.graphics().setDepth(5);
    focusRing.lineStyle(5, ACCENT, 1);
    focusRing.strokeRoundedRect(target.x - hw, target.y - hh, hw * 2, hh * 2, 22);
  }

  function onKey(scene, e) {
    var k = e.key;
    if (startOverlay && startOverlay.visible) {
      if (k === "1") { setMode(scene, "normal"); }
      else if (k === "2") { setMode(scene, "hard"); }
      else if (k === "Enter" || k === " ") { beginPlay(scene); }
      return;
    }
    if (endOverlay && endOverlay.visible) {
      if (k === "Enter" || k === " " || k === "r" || k === "R") { restart(scene); }
      return;
    }
    if (!started) { return; }
    var cols = 4;
    if (k === "r" || k === "R") { restart(scene); }
    else if (k === "1") { setMode(scene, "normal"); restart(scene); }
    else if (k === "2") { setMode(scene, "hard"); restart(scene); }
    else if (k === "ArrowLeft") { focusIdx = (focusIdx + cards.length - 1) % cards.length; drawFocus(scene); e.preventDefault && e.preventDefault(); }
    else if (k === "ArrowRight") { focusIdx = (focusIdx + 1) % cards.length; drawFocus(scene); e.preventDefault && e.preventDefault(); }
    else if (k === "ArrowUp") { focusIdx = (focusIdx + cards.length - cols) % cards.length; drawFocus(scene); e.preventDefault && e.preventDefault(); }
    else if (k === "ArrowDown") { focusIdx = (focusIdx + cols) % cards.length; drawFocus(scene); e.preventDefault && e.preventDefault(); }
    else if (k === "Enter" || k === " ") { onCard(scene, cards[focusIdx]); e.preventDefault && e.preventDefault(); }
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(ACCENT, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars;
    if (mode === "hard") { stars = moves <= 14 ? 3 : (moves <= 22 ? 2 : 1); }
    else { stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1); }
    endDetail.setText("You found all " + pairCount() + " pairs (" + (mode === "hard" ? "Hard" : "Normal") + ")!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    announce("You win! All " + pairCount() + " pairs found in " + moves + " moves.");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; focusIdx = 0; lockBoard = false;
    if (startOverlay && startOverlay.visible) { started = false; lockBoard = true; }
    else { started = true; }
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / " + pairCount());
    hudMode.setText("Mode: " + (mode === "hard" ? "Hard (8 pairs)" : "Normal (6 pairs)"));
    hudMsg.setText("Tap a card!");
    announce("New game. " + (mode === "hard" ? "Hard mode, 8 pairs." : "Normal mode, 6 pairs."));
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
