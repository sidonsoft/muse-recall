<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game"></div>
<p id="gameHelp" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">Memory matching game. Press 1 for normal mode, 2 for hard mode, Enter to start, arrow keys to move between cards, Enter or Space to flip a card, R to restart.</p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var EXTRA_ANIMALS = [
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F407}", name: "Bunny" }
  ];
  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var mode = "normal", totalPairs = 6, focusIdx = 0, focusRing = null;
  var hudMoves, hudScore, hudMsg, hudMode, endOverlay, endTitle, endDetail, endSwitchTx, endSwitchBg, startOverlay;

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMode = scene.add.text(24, 122, "Mode: Normal", textStyle(18, "#102A43"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Find every animal pair!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
  }

  function allAnimals() {
    return ANIMALS.concat(EXTRA_ANIMALS);
  }

  function shuffledDeck(count) {
    var pool = allAnimals().slice(0, count || totalPairs);
    var deck = [];
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + totalPairs);
    hudMode.setText(mode === "hard" ? "Mode: Hard \u2022 8 pairs" : "Mode: Normal");
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    focusIdx = 0;
    var deck = shuffledDeck();
    var cols = 4;
    var hard = totalPairs > 6;
    var cw = 185, ch = hard ? 108 : 140, gx = 62, gy = hard ? 188 : 195, padX = 22, padY = hard ? 10 : 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    if (focusRing) { focusRing.destroy(); focusRing = null; }
    focusRing = scene.add.graphics().setDepth(5);
    drawFocus();
  }

  function drawFocus() {
    if (!focusRing || !cards.length) { return; }
    var card = cards[focusIdx];
    if (!card) { return; }
    focusRing.clear();
    if (!started) { return; }
    var w = card.w || 185, h = card.h || 140;
    focusRing.lineStyle(5, 0x4EA8DE, 1);
    focusRing.strokeRoundedRect(card.view.x - w / 2 - 5, card.view.y - h / 2 - 5, w + 10, h + 10, 26);
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var small = h < 120;
    var emo = scene.add.text(0, small ? -14 : -18, data.emoji, { fontSize: small ? "48px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, small ? 32 : 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        refreshHud();
        hudMsg.setText(matches === totalPairs ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        if (matches === totalPairs) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, mode === "hard" ? 450 : 700);
    }
  }

  function startGame(scene, chosenMode) {
    if (chosenMode === "hard" || chosenMode === "normal") {
      mode = chosenMode;
      totalPairs = (mode === "hard") ? 8 : 6;
    }
    moves = 0; matches = 0; firstPick = null; started = true; lockBoard = false;
    refreshHud();
    hudMsg.setText(mode === "hard" ? "Hard mode: 8 pairs, fast flip!" : "Tap a card!");
    if (endOverlay) { endOverlay.setVisible(false); }
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -190, 600, 380, 30);
    panel.lineStyle(6, 0x5da85f, 1); panel.strokeRoundedRect(-300, -190, 600, 380, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Flip the cards and find every pair!\nNormal: 6 pairs, relaxed \u2022 Hard: 8 pairs, fast flip", Object.assign(textStyle(20, "#102A43"), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var normalBg = scene.add.graphics();
    normalBg.fillStyle(0x5da85f, 1); normalBg.fillRoundedRect(-270, 52, 250, 66, 33);
    var normalTx = scene.add.text(-145, 85, "\u25B6  Start", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hardBg = scene.add.graphics();
    hardBg.fillStyle(0x4EA8DE, 1); hardBg.fillRoundedRect(20, 52, 250, 66, 33);
    var hardTx = scene.add.text(145, 85, "\u2605 Hard: 8", textStyle(26, "#ffffff")).setOrigin(0.5);
    var hint = scene.add.text(0, 152, "Keys: 1 = Normal, 2 = Hard, Enter = Start", textStyle(16, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, normalBg, normalTx, hardBg, hardTx, hint]);
    normalBg.setInteractive(new Phaser.Geom.Rectangle(-270, 52, 250, 66), Phaser.Geom.Rectangle.Contains);
    hardBg.setInteractive(new Phaser.Geom.Rectangle(20, 52, 250, 66), Phaser.Geom.Rectangle.Contains);
    normalBg.on("pointerdown", function () { startGame(scene, "normal"); });
    hardBg.on("pointerdown", function () { startGame(scene, "hard"); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-130, 40, 260, 66, 33);
    var btnTx = scene.add.text(0, 73, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endSwitchBg = scene.add.graphics();
    endSwitchBg.fillStyle(0x4EA8DE, 1); endSwitchBg.fillRoundedRect(-110, 112, 220, 44, 22);
    endSwitchTx = scene.add.text(0, 134, "", textStyle(20, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, endSwitchBg, endSwitchTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 40, 260, 66), Phaser.Geom.Rectangle.Contains);
    endSwitchBg.setInteractive(new Phaser.Geom.Rectangle(-110, 112, 220, 44), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    endSwitchBg.on("pointerdown", function () {
      restart(scene, mode === "hard" ? "normal" : "hard");
    });
  }

  function showWin(scene) {
    var stars = mode === "hard"
      ? (moves <= 14 ? 3 : (moves <= 22 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    endDetail.setText("You found all " + totalPairs + " pairs (" + (mode === "hard" ? "Hard" : "Normal") + ")!\nMoves: " + moves + "  " + "\u2B50".repeat(stars));
    endSwitchTx.setText(mode === "hard" ? "Try Normal" : "Try Hard: 8");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene, nextMode) {
    if (nextMode === "hard" || nextMode === "normal") {
      mode = nextMode;
      totalPairs = (mode === "hard") ? 8 : 6;
    }
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    refreshHud();
    hudMsg.setText(mode === "hard" ? "Hard mode: 8 pairs, fast flip!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
  }

  function setupKeyboard(scene) {
    var input = scene.input.keyboard;
    if (!input) { return; }
    input.on("keydown-ONE", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, "normal"); }
    });
    input.on("keydown-TWO", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); }
    });
    input.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { startGame(scene, "normal"); return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      if (started && cards[focusIdx]) { onCard(scene, cards[focusIdx]); }
    });
    input.on("keydown-SPACE", function () {
      if (started && !(endOverlay && endOverlay.visible) && cards[focusIdx]) { onCard(scene, cards[focusIdx]); }
    });
    input.on("keydown-R", function () {
      if (started) { restart(scene); }
    });
    function moveFocus(dx, dy) {
      if (!started || !cards.length) { return; }
      var cols = 4;
      var next = focusIdx + dx + dy * cols;
      if (next < 0 || next >= cards.length) { return; }
      focusIdx = next;
      drawFocus();
    }
    input.on("keydown-LEFT", function () { moveFocus(-1, 0); });
    input.on("keydown-RIGHT", function () { moveFocus(1, 0); });
    input.on("keydown-UP", function () { moveFocus(0, -1); });
    input.on("keydown-DOWN", function () { moveFocus(0, 1); });
  }

  function update() {}
})();
</script>
</body>
</html>
