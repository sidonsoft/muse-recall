<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var EXTRA_ANIMALS = [
    { emoji: "🐐", name: "Goat" },
    { emoji: "🐰", name: "Rabbit" }
  ];
  var W = 900, H = 700;
  var mode = "normal";
  var ACCENT = 0x4EA8DE, ACCENT_DARK = 0x102A43;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0;
  var hudMoves, hudScore, hudMsg, hudMode, hudGoal, endOverlay, endTitle, endDetail, startOverlay, selBox;
  var cursor = 0;

  function totalPairs() { return mode === "hard" ? 8 : 6; }
  function poolForMode() { return mode === "hard" ? ANIMALS.concat(EXTRA_ANIMALS) : ANIMALS; }
  function mismatchDelay() { return mode === "hard" ? 420 : 700; }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    setupKeyboard(s);
    setupA11y();
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#5b3a29", fontStyle: "bold" };
  }

  function hudModeLabel() { return mode === "hard" ? "Mode: Hard (8 pairs, fast)" : "Mode: Normal (6 pairs)"; }
  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMode = scene.add.text(24, 122, hudModeLabel(), textStyle(17, "#102A43"));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24, "#7a4a2b")).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 116);
    var bg = scene.add.graphics();
    bg.fillStyle(0x5da85f, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudGoal = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22, "#8a6a4a")).setOrigin(0.5);
    scene.add.text(W / 2, 190, "Keys: 1 Normal  2 Hard  Arrows+Enter flip  R restart", textStyle(13, "#102A43")).setOrigin(0.5, 0).setAlpha(0.85);
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + totalPairs());
    hudMode.setText(hudModeLabel());
    hudGoal.setText(mode === "hard" ? "Hard: find the 8 animal pairs — fast!" : "Find the 6 animal pairs!");
  }

  function shuffledDeck() {
    var deck = [];
    poolForMode().forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function boardGeometry() {
    if (mode === "hard") {
      return { cols: 4, rows: 4, cw: 185, ch: 104, gx: 62, gy: 212, padX: 22, padY: 12 };
    }
    return { cols: 4, rows: 3, cw: 185, ch: 140, gx: 62, gy: 195, padX: 22, padY: 16 };
  }
  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    cursor = 0; firstPick = null;
    var deck = shuffledDeck();
    var g = boardGeometry();
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / g.cols), c = idx % g.cols;
      var cx = g.gx + c * (g.cw + g.padX) + g.cw / 2;
      var cy = g.gy + r * (g.ch + g.padY) + g.ch / 2;
      cards.push(makeCard(scene, cx, cy, g.cw, g.ch, card));
    });
    if (selBox) { selBox.destroy(); selBox = null; }
    selBox = scene.add.graphics().setDepth(5);
    drawCursor();
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var compact = h < 120;
    var emo = scene.add.text(0, compact ? -14 : -18, data.emoji, { fontSize: compact ? "44px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, compact ? 30 : 44, data.name, textStyle(compact ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, cx: x, cy: y, cw: w, ch: h };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    scene.sound.noop = true;
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + totalPairs());
        hudMsg.setText(matches === totalPairs() ? "You did it!" : "Yay! A pair! \u{1F389}");
        lockBoard = false;
        drawCursor();
        if (matches === totalPairs()) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Try again! \u{1F340}");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, mismatchDelay());
    }
  }

  function startGame(scene, chosen) {
    mode = chosen || "normal";
    started = true; lockBoard = false;
    startOverlay.setVisible(false);
    endOverlay.setVisible(false);
    moves = 0; matches = 0; firstPick = null;
    refreshHud();
    hudMsg.setText(mode === "hard" ? "Hard mode: tap a card!" : "Tap a card!");
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshHud();
  }
  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -195, 620, 390, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -195, 620, 390, 30);
    var title = scene.add.text(0, -135, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -80, "Flip the cards and find the pairs!", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -22, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988} \u{1F410} \u{1F430}", { fontSize: "34px" }).setOrigin(0.5);
    var descN = scene.add.text(-155, 22, "Normal: 6 pairs", Object.assign(textStyle(17, "#102A43"), { align: "center" })).setOrigin(0.5, 0);
    var descH = scene.add.text(155, 22, "Hard: 8 pairs, flips back fast", Object.assign(textStyle(17, "#102A43"), { align: "center" })).setOrigin(0.5, 0);
    var btnN = scene.add.graphics();
    btnN.fillStyle(ACCENT, 1); btnN.fillRoundedRect(-285, 62, 270, 66, 33);
    var btnNTx = scene.add.text(-150, 95, "\u25B6  Normal", textStyle(26, "#ffffff")).setOrigin(0.5);
    var btnH = scene.add.graphics();
    btnH.fillStyle(ACCENT_DARK, 1); btnH.fillRoundedRect(15, 62, 270, 66, 33);
    var btnHTx = scene.add.text(150, 95, "\u{1F525} Hard", textStyle(26, "#ffffff")).setOrigin(0.5);
    var keys = scene.add.text(0, 148, "Keys: 1 Normal   2 Hard   Enter Start", textStyle(16, "#102A43")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, descN, descH, btnN, btnNTx, btnH, btnHTx, keys]);
    btnN.setInteractive(new Phaser.Geom.Rectangle(-285, 62, 270, 66), Phaser.Geom.Rectangle.Contains);
    btnH.setInteractive(new Phaser.Geom.Rectangle(15, 62, 270, 66), Phaser.Geom.Rectangle.Contains);
    btnN.on("pointerdown", function () { startGame(scene, "normal"); });
    btnH.on("pointerdown", function () { startGame(scene, "hard"); });
    btnN.on("pointerover", function () { btnNTx.setScale(1.06); });
    btnN.on("pointerout", function () { btnNTx.setScale(1); });
    btnH.on("pointerover", function () { btnHTx.setScale(1.06); });
    btnH.on("pointerout", function () { btnHTx.setScale(1); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} You Win! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -40, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x5da85f, 1); btnBg.fillRoundedRect(-265, 45, 250, 64, 32);
    var btnTx = scene.add.text(-140, 77, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    var btnModeBg = scene.add.graphics();
    btnModeBg.fillStyle(ACCENT_DARK, 1); btnModeBg.fillRoundedRect(15, 45, 250, 64, 32);
    var btnModeTx = scene.add.text(140, 77, "Switch Mode", textStyle(24, "#ffffff")).setOrigin(0.5);
    var endKeys = scene.add.text(0, 125, "Keys: Enter replay   M modes", textStyle(15, "#102A43")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx, btnModeBg, btnModeTx, endKeys]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-265, 45, 250, 64), Phaser.Geom.Rectangle.Contains);
    btnModeBg.setInteractive(new Phaser.Geom.Rectangle(15, 45, 250, 64), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
    btnModeBg.on("pointerdown", function () {
      endOverlay.setVisible(false);
      started = false; lockBoard = true; firstPick = null;
      startOverlay.setVisible(true);
      hudMsg.setText("Pick a mode!");
    });
  }

  function showWin(scene) {
    var need = totalPairs();
    var stars = mode === "hard"
      ? (moves <= need + 6 ? 3 : (moves <= need + 12 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    endTitle.setText(mode === "hard" ? "\u{1F525} Hard Mode Clear! \u{1F525}" : "\u{1F389} You Win! \u{1F389}");
    endDetail.setText((mode === "hard" ? "Hard: all " + need + " pairs!\n" : "You found all " + need + " pairs!\n") + "Moves: " + moves + "  " + "\u2B50".repeat(stars));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene, nextMode) {
    if (nextMode) { mode = nextMode; }
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    refreshHud();
    hudMsg.setText(mode === "hard" ? "Hard mode: tap a card!" : "Tap a card!");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshHud();
  }

  function drawCursor() {
    if (!selBox || !cards.length) { return; }
    selBox.clear();
    if (!started) { return; }
    var c = cards[cursor];
    if (!c || c.matched) { return; }
    selBox.lineStyle(4, ACCENT_DARK, 1);
    selBox.strokeRoundedRect(c.cx - c.cw / 2 - 4, c.cy - c.ch / 2 - 4, c.cw + 8, c.ch + 8, 24);
  }

  function moveCursor(scene, dx, dy) {
    var g = boardGeometry();
    var cols = g.cols, n = cards.length;
    var i = (cursor + dx + dy * cols) % n;
    if (i < 0) { i += n; }
    cursor = i;
    drawCursor();
    if (scene) { scene.sound.noop = true; }
  }

  function flipCursorCard(scene) {
    var c = cards[cursor];
    if (c && !c.matched) { onCard(scene, c); drawCursor(); }
  }

  function setupKeyboard(scene) {
    if (!scene.input || !scene.input.keyboard) { return; }
    scene.input.keyboard.on("keydown", function (e) {
      var k = (e.key || "").toLowerCase();
      if (k === "1" || k === "n") {
        if (startOverlay.visible || endOverlay.visible) { startGame(scene, "normal"); }
        else { restart(scene, "normal"); }
      } else if (k === "2" || k === "h") {
        if (startOverlay.visible || endOverlay.visible) { startGame(scene, "hard"); }
        else { restart(scene, "hard"); }
      } else if (k === "r") {
        restart(scene);
      } else if (k === "m") {
        endOverlay.setVisible(false);
        started = false; lockBoard = true; firstPick = null;
        startOverlay.setVisible(true);
        hudMsg.setText("Pick a mode!");
      } else if (k === "enter" || k === " ") {
        if (startOverlay.visible) { startGame(scene, mode); }
        else if (endOverlay.visible) { restart(scene); }
        else { flipCursorCard(scene); }
        if (e.preventDefault) { try { e.preventDefault(); } catch (x) {} }
      } else if (k === "arrowleft") { moveCursor(scene, -1, 0); }
      else if (k === "arrowright") { moveCursor(scene, 1, 0); }
      else if (k === "arrowup") { moveCursor(scene, 0, -1); }
      else if (k === "arrowdown") { moveCursor(scene, 0, 1); }
    });
    var origOnCard = onCard;
    onCard = function (sceneArg, card) {
      var idx = cards.indexOf(card);
      if (idx >= 0) { cursor = idx; }
      origOnCard(sceneArg, card);
      drawCursor();
    };
  }

  function setupA11y() {
    try {
      var host = document.getElementById("game");
      if (host) {
        host.setAttribute("role", "application");
        host.setAttribute("aria-label", "Farmyard Match memory game. Normal mode has 6 pairs. Hard mode has 8 pairs and cards flip back faster. Keyboard: 1 normal, 2 hard, arrows move, Enter flips, R restarts, M changes mode.");
      }
      var cv = host ? host.querySelector("canvas") : null;
      if (cv) {
        cv.setAttribute("tabindex", "0");
        cv.setAttribute("aria-label", "Memory card board. Use arrow keys and Enter to flip cards. Press 1 for normal mode, 2 for hard mode.");
      }
    } catch (x) {}
  }

  function update() {}
})();
</script>
</body>
</html>
