<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d7edf7;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(16,42,67,.18)}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game. Use arrow keys to choose a card and Enter to flip it."></div>
<p class="visually-hidden" aria-live="polite" id="game-status">Farmyard Match. Flip cards to find animal pairs. Matching earns points and builds a combo. Mistakes never lose points.</p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#eaf6fb",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, score = 0, streak = 0, bestStreak = 0, level = 1;
  var selectedIndex = 0, selRing = null;
  var hudMoves, hudScore, hudPoints, hudLevel, hudMsg, endOverlay, endTitle, endDetail, endNextBg, endNextTx, startOverlay;
  function mismatchDelay() { return Math.max(450, 750 - (level - 1) * 60); }
  function announce(msg) {
    var el = document.getElementById("game-status");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeBubbles(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    enableKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    // cool ocean backdrop: pale sky over calm sea
    g.fillStyle(0xeaf6fb, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeef7, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xbde0fe, 1); g.fillRect(0, 470, W, 26);
    g.fillStyle(0xffffff, 1); g.fillRect(0, 496, W, 5);
    g.fillStyle(0xffffff, 0.9);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // sun: soft ocean-day disc
    g.fillStyle(0xffffff, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe9a8, 1); g.fillCircle(770, 110, 42);
    // boathouse in ocean accent
    g.fillStyle(0x4EA8DE, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x2a6f97, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xf4fbff, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xf4fbff, 1);
    g.lineBetween(80, 330, 230, 330);
    // pier rails
    g.lineStyle(8, 0x5398be, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers: shells and bubbles on the sand line
    var cols = [0x4EA8DE, 0x72c6ef, 0x90e0c0, 0xa9d6e5];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a6f97, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }
  function makeBubbles(scene) {
    // slow ambient bubbles: gentle arcade motion, no flashing
    for (var i = 0; i < 12; i++) {
      var bx = 20 + Math.random() * (W - 40);
      var by = 200 + Math.random() * 420;
      var r = 4 + Math.random() * 9;
      var c = scene.add.circle(bx, by, r).setStrokeStyle(2, 0x4EA8DE, 0.45).setFillStyle(0xffffff, 0.18).setDepth(-1);
      scene.tweens.add({
        targets: c, y: by - 40 - Math.random() * 60, alpha: 0.55,
        duration: 2600 + Math.random() * 2600, yoyo: true, repeat: -1,
        ease: "Sine.easeInOut", delay: Math.random() * 2000
      });
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 54, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 82, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 110, "Score: 0", textStyle(22));
    hudLevel = scene.add.text(W - 24, 96, "Level 1", textStyle(22)).setOrigin(1, 0.5);
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(22)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 130);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    scene.add.text(W / 2, 168, "Match pairs to score! Combos earn more. Arrows + Enter work too.", textStyle(19)).setOrigin(0.5);
  }

  function shuffledDeck() {
    var deck = [];
    ANIMALS.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    selectedIndex = 0;
    var deck = shuffledDeck();
    var cols = 4, rows = 3;
    var cw = 185, ch = 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
    updateSelection(scene);
  }
  function updateSelection(scene) {
    if (!cards.length) { return; }
    if (selectedIndex < 0) { selectedIndex = 0; }
    if (selectedIndex >= cards.length) { selectedIndex = cards.length - 1; }
    if (selRing) { selRing.destroy(); selRing = null; }
    var card = cards[selectedIndex];
    if (!card || !started) { return; }
    var w = card.view.width + 12, h = card.view.height + 12;
    selRing = scene.add.graphics();
    selRing.lineStyle(4, 0x2a6f97, 1);
    selRing.strokeRoundedRect(card.view.x - w / 2, card.view.y - h / 2, w, h, 20);
    selRing.setDepth(5);
  }
  function moveSelection(scene, dx, dy) {
    if (!started || !cards.length) { return; }
    var cols = 4;
    var idx = selectedIndex + dx + dy * cols;
    var r = Math.floor(selectedIndex / cols), c = selectedIndex % cols;
    var nr = r + dy, nc = c + dx;
    if (nr < 0 || nr > 2 || nc < 0 || nc > 3) { return; }
    selectedIndex = nr * cols + nc;
    updateSelection(scene);
    void idx;
  }
  function enableKeyboard(scene) {
    scene.input.keyboard.on("keydown-LEFT", function () { moveSelection(scene, -1, 0); });
    scene.input.keyboard.on("keydown-A", function () { moveSelection(scene, -1, 0); });
    scene.input.keyboard.on("keydown-RIGHT", function () { moveSelection(scene, 1, 0); });
    scene.input.keyboard.on("keydown-D", function () { moveSelection(scene, 1, 0); });
    scene.input.keyboard.on("keydown-UP", function () { moveSelection(scene, 0, -1); });
    scene.input.keyboard.on("keydown-W", function () { moveSelection(scene, 0, -1); });
    scene.input.keyboard.on("keydown-DOWN", function () { moveSelection(scene, 0, 1); });
    scene.input.keyboard.on("keydown-S", function () { moveSelection(scene, 0, 1); });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (cards[selectedIndex]) { onCard(scene, cards[selectedIndex]); }
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (cards[selectedIndex]) { onCard(scene, cards[selectedIndex]); }
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xd8f1fb, 0xcdeef7, 0xbde0fe, 0xa9d6e5, 0xcaf0f8, 0xe0f7fa];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, -18, data.emoji, { fontSize: "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, 44, data.name, textStyle(22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () {
      for (var i = 0; i < cards.length; i++) { if (cards[i] === card) { selectedIndex = i; break; } }
      updateSelection(scene);
      onCard(scene, card);
    });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function addPoints(scene, x, y, text) {
    var t = scene.add.text(x, y - 70, text, textStyle(26, "#2a6f97")).setOrigin(0.5).setDepth(8);
    scene.tweens.add({ targets: t, y: y - 110, alpha: 0, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }
  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) {
      firstPick = card;
      hudMsg.setText("One more!");
      announce("One card up. Pick one more.");
      return;
    }
    moves++;
    hudMoves.setText("Moves: " + moves);
    var a = firstPick; firstPick = null; lockBoard = true;
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 180 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 25 + (level - 1) * 15;
        score += gained;
        hudScore.setText("Pairs: " + matches + " / 6");
        hudPoints.setText("Score: " + score);
        hudLevel.setText("Level " + level + "  •  Combo x" + streak);
        addPoints(scene, card.view.x, card.view.y, "+" + gained);
        if (streak >= 2) {
          hudMsg.setText("Combo x" + streak + "! +" + gained);
        } else {
          hudMsg.setText(matches === 6 ? "You did it!" : "Yay! A pair! +" + gained);
        }
        announce("Pair found. Score " + score + ", combo " + streak + ". Pairs " + matches + " of 6.");
        lockBoard = false;
        updateSelection(scene);
        if (matches === 6) { showWin(scene); }
      }, 350);
    } else {
      streak = 0;
      hudLevel.setText("Level " + level + "  •  Combo x" + streak);
      hudMsg.setText("Splash! No points lost.");
      announce("Not a pair. No points lost. Combo restarts.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; updateSelection(scene); });
      }, mismatchDelay());
    }
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -200, 600, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -200, 600, 400, 30);
    var title = scene.add.text(0, -140, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -60, "Flip cards, find all 6 pairs!\nPairs score points. Back-to-back pairs\nbuild a COMBO for bonus points.\nClear the board to reach the next level!", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 55, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 95, 260, 70, 35);
    var btnTx = scene.add.text(0, 130, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 95, 260, 70), Phaser.Geom.Rectangle.Contains);
    var startGame = function () {
      started = true; lockBoard = false;
      startOverlay.setVisible(false);
      hudMsg.setText("Tap a card!");
      announce("Game started. Level 1. Use arrows and Enter, or tap a card.");
      updateSelection(scene);
    };
    btnBg.on("pointerdown", startGame);
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay.visible) { startGame(); }
      else if (endOverlay.visible) { nextLevel(scene); }
    });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x102A43, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -180, 600, 360, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -180, 600, 360, 30);
    endTitle = scene.add.text(0, -115, "\u{1F389} Board Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -35, "", Object.assign(textStyle(23), { align: "center" })).setOrigin(0.5);
    endNextBg = scene.add.graphics();
    endNextBg.fillStyle(0x4EA8DE, 1); endNextBg.fillRoundedRect(-270, 55, 255, 64, 32);
    endNextTx = scene.add.text(-142, 87, "Next Level \u25B6", textStyle(24, "#ffffff")).setOrigin(0.5);
    var againBg = scene.add.graphics();
    againBg.fillStyle(0x2a6f97, 1); againBg.fillRoundedRect(15, 55, 255, 64, 32);
    var againTx = scene.add.text(142, 87, "\u21BB Play Again", textStyle(24, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, endNextBg, endNextTx, againBg, againTx]);
    endNextBg.setInteractive(new Phaser.Geom.Rectangle(-270, 55, 255, 64), Phaser.Geom.Rectangle.Contains);
    endNextBg.on("pointerdown", function () { nextLevel(scene); });
    againBg.setInteractive(new Phaser.Geom.Rectangle(15, 55, 255, 64), Phaser.Geom.Rectangle.Contains);
    againBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var stars = moves <= 10 ? 3 : (moves <= 16 ? 2 : 1);
    endTitle.setText(level >= 2 ? "\u{1F389} Level " + level + " Clear! \u{1F389}" : "\u{1F389} Board Clear! \u{1F389}");
    endDetail.setText("Score: " + score + "  •  Best combo x" + Math.max(bestStreak, 1) + "\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nNext level hides cards a little faster.\nMistakes still cost nothing.");
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Level " + level + " clear! \u{1F389}");
    announce("Level " + level + " clear. Score " + score + ". Press Enter or choose Next Level.");
    for (var i = 0; i < 28; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F41A}", "\u2B50", "\u{1F404}", "\u26F5"][i % 4], { fontSize: "26px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-60, 60), duration: Phaser.Math.Between(1600, 2600), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function nextLevel(scene) {
    level++;
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0");
    hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: " + score);
    hudLevel.setText("Level " + level + "  •  Combo x0");
    hudMsg.setText("Level " + level + "! Tap a card!");
    announce("Level " + level + ". Cards hide a little faster. Score carries over: " + score + ".");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    if (selRing) { selRing.destroy(); selRing = null; }
    buildBoard(scene);
  }

  function restart(scene) {
    moves = 0; matches = 0; score = 0; streak = 0; bestStreak = 0; level = 1;
    firstPick = null; lockBoard = false; started = true;
    hudMoves.setText("Moves: 0"); hudScore.setText("Pairs: 0 / 6");
    hudPoints.setText("Score: 0"); hudLevel.setText("Level 1  •  Combo x0");
    hudMsg.setText("Tap a card!");
    announce("Game restarted. Level 1, score zero.");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    if (selRing) { selRing.destroy(); selRing = null; }
    buildBoard(scene);
  }

  function update() {}
})();
</script>
</body>
</html>
