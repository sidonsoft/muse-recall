<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fdf6ec;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game" role="application" aria-label="Farmyard Match memory card game"></div>
<div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F407}", name: "Bunny" }
  ];
  var OCEAN = "#102A43";
  var ACCENT = "#4EA8DE";
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#fdeec9",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, mode = "easy", focusIndex = -1;
  var hudMoves, hudScore, hudMsg, hudSub, endOverlay, endTitle, endDetail, startOverlay, modeLabel;

  function pairCount() { return mode === "hard" ? 8 : 6; }

  function announce(msg) {
    var el = document.getElementById("sr-status");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    wireKeyboard(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xfdeec9, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeeb0, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 1);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0xe26d5a, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0xb34a3e, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xfff3e0, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xfff3e0, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0xb98850, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // flowers
    var cols = [0xf49ac1, 0xff9d76, 0x9ad0f5, 0xc5a3ff];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x5da85f, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xfff200, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || OCEAN, fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 14, "\u{1F33B} Farmyard Match", textStyle(34)).setOrigin(0, 0);
    hudMoves = scene.add.text(24, 58, "Moves: 0", textStyle(24));
    hudScore = scene.add.text(24, 90, "Pairs: 0 / 6", textStyle(24));
    hudMsg = scene.add.text(W - 24, 60, "Tap a card!", textStyle(24)).setOrigin(1, 0.5);
    modeLabel = scene.add.text(W - 24, 88, "Mode: Easy", textStyle(18)).setOrigin(1, 0.5);
    var btn = scene.add.container(W - 110, 128);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-86, -26, 172, 52, 26);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(24, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-86, -26, 172, 52), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    hudSub = scene.add.text(W / 2, 168, "Find the 6 animal pairs!", textStyle(22)).setOrigin(0.5);
  }

  function refreshHud() {
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + pairCount());
    hudSub.setText(mode === "hard" ? "Hard: find the 8 animal pairs!" : "Find the 6 animal pairs!");
    modeLabel.setText(mode === "hard" ? "Mode: Hard (8 pairs)" : "Mode: Easy (6 pairs)");
  }

  function shuffledDeck() {
    var deck = [];
    var want = pairCount();
    ANIMALS.slice(0, want).forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null; focusIndex = -1;
    var deck = shuffledDeck();
    var cols = 4, rows = pairCount() === 8 ? 4 : 3;
    var cw = 185, ch = pairCount() === 8 ? 106 : 140, gx = 62, gy = 195, padX = 22, padY = 16;
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / cols), c = idx % cols;
      var cx = gx + c * (cw + padX) + cw / 2;
      var cy = gy + r * (ch + padY) + ch / 2;
      cards.push(makeCard(scene, cx, cy, cw, ch, card));
    });
  }

  function makeCard(scene, x, y, w, h, data) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x8ecae6, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xfff1a8, 0xffc8dd, 0xc8e7ff, 0xd8f3b8, 0xffd6a5, 0xe4c1f9, 0xd3f8e2, 0xe7c6ff];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var compact = h < 120;
    var emo = scene.add.text(0, compact ? -14 : -18, data.emoji, { fontSize: compact ? "48px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, compact ? 32 : 44, data.name, textStyle(compact ? 19 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    var ring = scene.add.graphics();
    ring.lineStyle(5, 0x4EA8DE, 1);
    ring.strokeRoundedRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8, 26);
    ring.setVisible(false);
    cont.add([showBack, face, ring]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, ring: ring, data: data, matched: false, faceUp: false };
    cont.on("pointerdown", function () { onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    if (!firstPick) {
      firstPick = card;
      hudMsg.setText("One more!");
      announce("First card: " + card.data.name + ". Pick one more card.");
      return;
    }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    hudMoves.setText("Moves: " + moves);
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        hudScore.setText("Pairs: " + matches + " / " + pairCount());
        var done = matches === pairCount();
        hudMsg.setText(done ? "You did it!" : "Yay! A pair! \u{1F389}");
        announce(done ? "You found all " + pairCount() + " pairs!" : "Yay! You found " + card.data.name + "! " + matches + " of " + pairCount() + " pairs.");
        lockBoard = false;
        if (done) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Good try — keep looking! \u{1F340}");
      announce("Good try! Those two do not match. Keep looking.");
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; });
      }, 700);
    }
  }

  function setFocus(index) {
    if (!cards.length) { return; }
    var n = cards.length;
    focusIndex = ((index % n) + n) % n;
    cards.forEach(function (c, i) { c.ring.setVisible(i === focusIndex); });
  }

  function moveFocus(dx, dy, cols) {
    if (focusIndex < 0) { setFocus(0); return; }
    var n = cards.length;
    var next;
    if (dx !== 0) {
      next = focusIndex + dx;
      var row = Math.floor(focusIndex / cols);
      if (Math.floor(next / cols) !== row || next < 0 || next >= n) { return; }
    } else {
      next = focusIndex + dy * cols;
      if (next < 0 || next >= n) { return; }
    }
    setFocus(next);
  }

  function flipFocused(scene) {
    if (focusIndex < 0) { setFocus(0); return; }
    var card = cards[focusIndex];
    if (card) { onCard(scene, card); }
  }

  function wireKeyboard(scene) {
    var cols = function () { return 4; };
    scene.input.keyboard.on("keydown-LEFT", function () { setFocus(focusIndex < 0 ? 0 : focusIndex); moveFocus(-1, 0, cols()); });
    scene.input.keyboard.on("keydown-RIGHT", function () { setFocus(focusIndex < 0 ? 0 : focusIndex); moveFocus(1, 0, cols()); });
    scene.input.keyboard.on("keydown-UP", function () { setFocus(focusIndex < 0 ? 0 : focusIndex); moveFocus(0, -1, cols()); });
    scene.input.keyboard.on("keydown-DOWN", function () { setFocus(focusIndex < 0 ? 0 : focusIndex); moveFocus(0, 1, cols()); });
    scene.input.keyboard.on("keydown-ENTER", function () {
      if (startOverlay && startOverlay.visible) { return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      flipFocused(scene);
    });
    scene.input.keyboard.on("keydown-SPACE", function () {
      if (startOverlay && startOverlay.visible) { return; }
      if (endOverlay && endOverlay.visible) { restart(scene); return; }
      flipFocused(scene);
    });
    scene.input.keyboard.on("keydown-ONE", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "easy"); } });
    scene.input.keyboard.on("keydown-TWO", function () { if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "e" || e.key === "E") { if (startOverlay && startOverlay.visible) { startGame(scene, "easy"); } }
      if (e.key === "h" || e.key === "H") { if (startOverlay && startOverlay.visible) { startGame(scene, "hard"); } }
      if (e.key === "r" || e.key === "R") {
        if (started && !(endOverlay && endOverlay.visible)) { restart(scene); }
      }
    });
  }

  function startGame(scene, nextMode) {
    mode = nextMode;
    moves = 0; matches = 0; firstPick = null;
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    if (endOverlay) { endOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshHud();
    hudMoves.setText("Moves: 0");
    hudMsg.setText(mode === "hard" ? "Hard mode: tap a card!" : "Tap a card!");
    announce(mode === "hard" ? "Hard mode started. Find all 8 animal pairs. No timers, just have fun!" : "Easy game started. Find all 6 animal pairs!");
  }

  function makeModeButton(scene, parent, cx, cy, label, hint, isHard) {
    var box = scene.add.container(cx, cy);
    var bg = scene.add.graphics();
    bg.fillStyle(isHard ? 0x102A43 : 0x4EA8DE, 1);
    bg.fillRoundedRect(-130, -34, 260, 62, 31);
    if (isHard) {
      bg.lineStyle(3, 0x4EA8DE, 1);
      bg.strokeRoundedRect(-130, -34, 260, 62, 31);
    }
    var tx = scene.add.text(0, -6, label, textStyle(24, "#ffffff")).setOrigin(0.5);
    var sub = scene.add.text(0, 16, hint, { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: "15px", color: "#ffffff" }).setOrigin(0.5);
    box.add([bg, tx, sub]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-130, -34, 260, 62), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { startGame(scene, isHard ? "hard" : "easy"); });
    bg.on("pointerover", function () { box.setScale(1.05); });
    bg.on("pointerout", function () { box.setScale(1); });
    parent.add(box);
    return box;
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-310, -210, 620, 420, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-310, -210, 620, 420, 30);
    var title = scene.add.text(0, -150, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -95, "Flip the cards and find the pairs!\nEasy has 6 pairs. Hard has 8 pairs — no timers,\nno rushing, just more animals to find.", Object.assign(textStyle(21), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, -8, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var keys = scene.add.text(0, 32, "Keys: arrows move • Enter flips • 1 easy • 2 hard", textStyle(16)).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, keys]);
    makeModeButton(scene, startOverlay, -140, 108, "\u25B6 Easy", "6 pairs (press 1)", false);
    makeModeButton(scene, startOverlay, 140, 108, "\u2605 Hard", "8 pairs (press 2)", true);
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -170, 580, 340, 30);
    panel.lineStyle(6, 0xffb703, 1); panel.strokeRoundedRect(-290, -170, 580, 340, 30);
    endTitle = scene.add.text(0, -100, "\u{1F389} You Win! \u{1F389}", textStyle(42)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(25), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 50, 260, 70, 35);
    var btnTx = scene.add.text(0, 85, "\u21BB Play Again", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 50, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { restart(scene); });
  }

  function showWin(scene) {
    var total = pairCount();
    var stars = mode === "hard"
      ? (moves <= 16 ? 3 : (moves <= 24 ? 2 : 1))
      : (moves <= 10 ? 3 : (moves <= 16 ? 2 : 1));
    endDetail.setText("You found all " + total + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + (mode === "hard" ? "\nHard mode superstar!" : ""));
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("You win! \u{1F389}");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}"][i % 4], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function restart(scene) {
    moves = 0; matches = 0; firstPick = null; lockBoard = false; started = true;
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    cards.forEach(function (c) { c.view.destroy(); });
    buildBoard(scene);
    refreshHud();
    hudMoves.setText("Moves: 0");
    hudMsg.setText(mode === "hard" ? "Hard mode: tap a card!" : "Tap a card!");
    announce(mode === "hard" ? "Hard game restarted. Find all 8 pairs!" : "Game restarted. Find all 6 pairs!");
  }

  function update() {}
})();
</script>
</body>
</html>
