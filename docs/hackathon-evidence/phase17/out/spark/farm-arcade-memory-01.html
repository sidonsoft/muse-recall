<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmyard Memory Match</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#d7ecf5;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif}
  #game{width:100vw;height:100vh;max-width:900px;max-height:700px}
  canvas{border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="game"></div>
<p class="sr-only" id="gameHelp">Farmyard Match arcade. Use Left, Right, Up and Down arrows to choose a card. Press Enter or Space to flip it. Press R to restart. Press M to mute sounds.</p>
<p class="sr-only" aria-live="polite" id="gameStatus">Press Start to play.</p>
<script>
(function () {
  var ANIMALS = [
    { emoji: "\u{1F404}", name: "Cow" },
    { emoji: "\u{1F437}", name: "Pig" },
    { emoji: "\u{1F414}", name: "Hen" },
    { emoji: "\u{1F40E}", name: "Horse" },
    { emoji: "\u{1F411}", name: "Sheep" },
    { emoji: "\u{1F988}", name: "Duck" },
    { emoji: "\u{1F410}", name: "Goat" },
    { emoji: "\u{1F407}", name: "Bunny" },
    { emoji: "\u{1F983}", name: "Turkey" },
    { emoji: "\u{1F415}", name: "Dog" }
  ];
  var LEVELS = [
    { pairs: 6, cols: 4, rows: 3, label: "Level 1" },
    { pairs: 8, cols: 4, rows: 4, label: "Level 2" },
    { pairs: 10, cols: 5, rows: 4, label: "Level 3" }
  ];
  var W = 900, H = 700;

  var config = {
    type: Phaser.AUTO,
    parent: "game",
    width: W,
    height: H,
    backgroundColor: "#e6f4fa",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: { create: create, update: update }
  };
  new Phaser.Game(config);

  var cards = [], firstPick = null, lockBoard = true, started = false;
  var moves = 0, matches = 0, level = 1, score = 0, streak = 0, bestStreak = 0;
  var soundOn = true, selected = 0, audioCtx = null;
  var bubbles = [];
  var hudMoves, hudScore, hudMsg, hudLevel, hudPoints, hudStreak, endOverlay, endTitle, endDetail, startOverlay, endBtnLabel;
  var progressBg, progressFill, selRing;

  function pairsForLevel() { return LEVELS[level - 1].pairs; }
  function announce(msg) {
    var el = document.getElementById("gameStatus");
    if (el) { el.textContent = msg; }
  }

  function create() {
    var s = this;
    drawFarm(s);
    makeHud(s);
    buildBoard(s);
    makeStartOverlay(s);
    makeEndOverlay(s);
    makeBubbles(s);
    bindKeys(s);
  }

  function drawFarm(scene) {
    var g = scene.add.graphics();
    g.fillStyle(0xe6f4fa, 1); g.fillRect(0, 0, W, H);
    g.fillStyle(0xcdeaf2, 1); g.fillRect(0, 470, W, 230);
    g.fillStyle(0xfff6dd, 1); g.fillCircle(770, 110, 55);
    g.fillStyle(0xffe08a, 1); g.fillCircle(770, 110, 42);
    g.fillStyle(0xffffff, 0.95);
    g.fillEllipse(180, 110, 150, 48); g.fillEllipse(240, 100, 120, 44);
    g.fillEllipse(560, 80, 140, 44);
    // barn
    g.fillStyle(0x2a7fa8, 1); g.fillRect(80, 330, 150, 140);
    g.fillStyle(0x1b5d7d, 1); g.fillTriangle(60, 330, 155, 250, 250, 330);
    g.fillStyle(0xe6f4fa, 1); g.fillRect(135, 390, 40, 80);
    g.lineStyle(4, 0xe6f4fa, 1);
    g.lineBetween(80, 330, 230, 330);
    // fence
    g.lineStyle(8, 0x7fb6c9, 1);
    for (var x = 320; x <= 860; x += 60) { g.lineBetween(x, 500, x, 570); }
    g.lineBetween(300, 515, 880, 515); g.lineBetween(300, 545, 880, 545);
    // sea flowers (soft shells)
    var cols = [0x90e0ef, 0xcaf0f8, 0xade8f4, 0xe0fbfc];
    for (var i = 0; i < 10; i++) {
      var fx = 30 + i * 88, fy = 620 + (i % 2) * 30;
      g.fillStyle(0x2a7fa8, 1); g.fillRect(fx - 2, fy, 5, 26);
      g.fillStyle(cols[i % 4], 1);
      g.fillCircle(fx, fy - 8, 9);
      g.fillStyle(0xffffff, 1); g.fillCircle(fx, fy - 8, 4);
    }
  }

  function makeBubbles(scene) {
    for (var i = 0; i < 8; i++) {
      var b = scene.add.circle(Phaser.Math.Between(20, W - 20), Phaser.Math.Between(200, H - 20), Phaser.Math.Between(4, 12), 0xffffff, 0.35);
      b.setDepth(1);
      bubbles.push({ view: b, speed: Phaser.Math.Between(8, 26) });
    }
  }

  function textStyle(size, color) {
    return { fontFamily: '"Comic Sans MS",ChalkboardSE,"Segoe UI",sans-serif', fontSize: size + "px", color: color || "#102A43", fontStyle: "bold" };
  }

  function makeHud(scene) {
    scene.add.text(24, 12, "\u{1F33B} Farmyard Match", textStyle(32)).setOrigin(0, 0);
    hudLevel = scene.add.text(24, 52, "Level 1 of 3", textStyle(22));
    hudMoves = scene.add.text(24, 80, "Moves: 0", textStyle(22));
    hudScore = scene.add.text(24, 108, "Pairs: 0 / 6", textStyle(22));
    hudPoints = scene.add.text(24, 136, "Score: 0", textStyle(22));
    hudStreak = scene.add.text(W / 2, 168, "", textStyle(22, "#1b5d7d")).setOrigin(0.5);
    hudMsg = scene.add.text(W - 24, 52, "Tap a card!", textStyle(22)).setOrigin(1, 0);
    var btn = scene.add.container(W - 104, 112);
    var bg = scene.add.graphics();
    bg.fillStyle(0x4EA8DE, 1); bg.fillRoundedRect(-80, -24, 160, 48, 24);
    var label = scene.add.text(0, 0, "\u21BB Restart", textStyle(22, "#ffffff")).setOrigin(0.5);
    btn.add([bg, label]);
    bg.setInteractive(new Phaser.Geom.Rectangle(-80, -24, 160, 48), Phaser.Geom.Rectangle.Contains);
    bg.on("pointerdown", function () { ensureAudio(); playTone(300, 0.08, "sine"); restart(scene); });
    bg.on("pointerover", function () { btn.setScale(1.06); });
    bg.on("pointerout", function () { btn.setScale(1); });
    // gentle sound toggle (click only, no keyboard trap)
    var snd = scene.add.text(W - 24, 150, "Sound: on", textStyle(18, "#1b5d7d")).setOrigin(1, 0.5);
    snd.setInteractive({ useHandCursor: true });
    snd.on("pointerdown", function () {
      soundOn = !soundOn;
      snd.setText(soundOn ? "Sound: on" : "Sound: off");
      announce(soundOn ? "Sound on." : "Sound off.");
    });
    scene.add.text(W / 2, 192, "Find the 6 animal pairs!", textStyle(20, "#334e68")).setOrigin(0.5).setName("goalLine");
    progressBg = scene.add.graphics();
    progressBg.fillStyle(0xffffff, 0.9); progressBg.fillRoundedRect(W / 2 - 160, 206, 320, 14, 7);
    progressFill = scene.add.graphics();
    drawProgress();
  }

  function drawProgress() {
    if (!progressFill) { return; }
    progressFill.clear();
    var total = pairsForLevel();
    var frac = total ? matches / total : 0;
    progressFill.fillStyle(0x4EA8DE, 1);
    if (frac > 0) { progressFill.fillRoundedRect(W / 2 - 160, 206, Math.max(14, 320 * frac), 14, 7); }
  }

  function shuffledDeck() {
    var deck = [];
    var pool = ANIMALS.slice(0, pairsForLevel());
    pool.forEach(function (a, i) {
      deck.push({ key: i, emoji: a.emoji, name: a.name });
      deck.push({ key: i, emoji: a.emoji, name: a.name });
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function boardLayout() {
    var cfg = LEVELS[level - 1];
    if (cfg.pairs <= 6) { return { cols: 4, rows: 3, cw: 185, ch: 128, gx: 62, gy: 234, padX: 22, padY: 14 }; }
    if (cfg.pairs <= 8) { return { cols: 4, rows: 4, cw: 185, ch: 100, gx: 62, gy: 232, padX: 22, padY: 10 }; }
    return { cols: 5, rows: 4, cw: 148, ch: 100, gx: 52, gy: 232, padX: 14, padY: 10 };
  }

  function buildBoard(scene) {
    cards.forEach(function (c) { c.view.destroy(); });
    cards = [];
    firstPick = null;
    selected = 0;
    var deck = shuffledDeck();
    var L = boardLayout();
    deck.forEach(function (card, idx) {
      var r = Math.floor(idx / L.cols), c = idx % L.cols;
      var cx = L.gx + c * (L.cw + L.padX) + L.cw / 2;
      var cy = L.gy + r * (L.ch + L.padY) + L.ch / 2;
      cards.push(makeCard(scene, cx, cy, L.cw, L.ch, card, idx));
    });
    if (selRing) { selRing.destroy(); }
    selRing = scene.add.graphics().setDepth(5);
    drawSelection();
  }

  function drawSelection() {
    if (!selRing || !cards.length) { return; }
    selRing.clear();
    if (!started) { return; }
    var card = cards[selected];
    if (!card || card.matched) { return; }
    var w = card.w, h = card.h, x = card.view.x, y = card.view.y;
    selRing.lineStyle(5, 0x102A43, 1);
    selRing.strokeRoundedRect(x - w / 2 - 5, y - h / 2 - 5, w + 10, h + 10, 24);
  }

  function ensureAudio() {
    if (!soundOn) { return; }
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
    } catch (e) { audioCtx = null; }
  }

  function playTone(freq, dur, type, delay) {
    if (!soundOn || !audioCtx) { return; }
    try {
      var t = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }

  function flipSound() { playTone(520, 0.09, "sine"); }
  function matchSound() { playTone(523, 0.12, "sine"); playTone(659, 0.14, "sine", 0.09); playTone(784, 0.18, "sine", 0.18); }
  function gentleSound() { playTone(392, 0.12, "sine"); playTone(440, 0.14, "sine", 0.1); }
  function winSound() { playTone(523, 0.14, "triangle"); playTone(587, 0.14, "triangle", 0.12); playTone(659, 0.14, "triangle", 0.24); playTone(784, 0.26, "triangle", 0.36); }

  function floatScore(scene, x, y, msg) {
    var t = scene.add.text(x, y - 40, msg, textStyle(26, "#1b5d7d")).setOrigin(0.5).setDepth(8);
    scene.tweens.add({ targets: t, y: y - 90, alpha: 0, duration: 900, ease: "Sine.easeOut", onComplete: function () { t.destroy(); } });
  }

  function makeCard(scene, x, y, w, h, data, idx) {
    var cont = scene.add.container(x, y);
    var back = scene.add.graphics();
    back.fillStyle(0xffffff, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    back.fillStyle(0x4EA8DE, 1); back.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    back.fillStyle(0xffffff, 0.85);
    back.fillCircle(-w / 4, -h / 4, 12); back.fillCircle(w / 4, 0, 9); back.fillCircle(0, h / 4, 14);
    var small = h < 110;
    var paw = scene.add.text(0, -6, "\u{1F43E}", { fontSize: small ? "40px" : "56px" }).setOrigin(0.5);
    var face = scene.add.container(0, 0).setVisible(false).setScale(0.1);
    var fg = scene.add.graphics();
    var palette = [0xcaf0f8, 0xade8f4, 0x90e0ef, 0xe0fbfc, 0xc8e7ff, 0xd4eefd, 0xbde0fe, 0xa2d2ff, 0xcaf0f8, 0xe0fbfc];
    fg.fillStyle(0xffffff, 1); fg.fillRoundedRect(-w / 2, -h / 2, w, h, 22);
    fg.fillStyle(palette[data.key % palette.length], 1);
    fg.fillRoundedRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16);
    var emo = scene.add.text(0, small ? -14 : -18, data.emoji, { fontSize: small ? "46px" : "62px" }).setOrigin(0.5);
    var nm = scene.add.text(0, small ? 32 : 44, data.name, textStyle(small ? 18 : 22)).setOrigin(0.5);
    face.add([fg, emo, nm]);
    var showBack = scene.add.container(0, 0, [back, paw]);
    cont.add([showBack, face]);
    cont.setSize(w, h);
    cont.setInteractive({ useHandCursor: true });
    var card = { view: cont, back: showBack, face: face, data: data, matched: false, faceUp: false, w: w, h: h, idx: idx };
    cont.on("pointerdown", function () { ensureAudio(); selected = idx; drawSelection(); onCard(scene, card); });
    return card;
  }

  function flip(card, show, done) {
    var s = card.view.scene;
    s.tweens.add({ targets: card.view, scaleX: 0, duration: 130, onComplete: function () {
      card.back.setVisible(!show); card.face.setVisible(show);
      card.faceUp = show;
      if (show) { card.face.setScale(1); }
      s.tweens.add({ targets: card.view, scaleX: 1, duration: 130, onComplete: done || function () {} });
    }});
  }

  function refreshHud() {
    var total = pairsForLevel();
    hudLevel.setText(LEVELS[level - 1].label + " of 3");
    hudMoves.setText("Moves: " + moves);
    hudScore.setText("Pairs: " + matches + " / " + total);
    hudPoints.setText("Score: " + score);
    if (streak >= 2) { hudStreak.setText("Streak x" + streak + "! Sweet!"); }
    else if (streak === 1) { hudStreak.setText("Nice! Keep matching!"); }
    else { hudStreak.setText(""); }
    drawProgress();
  }

  function onCard(scene, card) {
    if (!started || lockBoard || card.faceUp || card.matched) { return; }
    flip(card, true);
    flipSound();
    announce(card.data.name + "!");
    if (!firstPick) { firstPick = card; hudMsg.setText("One more!"); return; }
    moves++;
    var a = firstPick; firstPick = null; lockBoard = true;
    refreshHud();
    if (a.data.key === card.data.key) {
      setTimeout(function () {
        a.matched = card.matched = true;
        scene.tweens.add({ targets: [a.view, card.view], scale: 1.08, yoyo: true, duration: 160 });
        matches++;
        streak++;
        if (streak > bestStreak) { bestStreak = streak; }
        var gained = 100 + (streak - 1) * 25 + (level - 1) * 25;
        score += gained;
        floatScore(scene, card.view.x, card.view.y, "+" + gained);
        matchSound();
        refreshHud();
        var total = pairsForLevel();
        if (matches === total) { hudMsg.setText("Level clear!"); }
        else if (streak >= 3) { hudMsg.setText("Arcade combo x" + streak + "! \u{1F389}"); }
        else if (streak === 2) { hudMsg.setText("Double match! \u{1F389}"); }
        else { hudMsg.setText("Yay! A pair! \u{1F389}"); }
        announce("Pair found! " + matches + " of " + total + ". Score " + score + ".");
        lockBoard = false;
        drawSelection();
        if (matches === total) { showWin(scene); }
      }, 350);
    } else {
      hudMsg.setText("Nice try! Keep going! \u{1F340}");
      announce("No match. Keep trying!");
      gentleSound();
      setTimeout(function () {
        flip(a, false); flip(card, false, function () { lockBoard = false; drawSelection(); });
      }, 700);
      streak = 0;
      setTimeout(function () { refreshHud(); }, 750);
    }
  }

  function startGame(scene) {
    ensureAudio();
    playTone(523, 0.12, "sine"); playTone(784, 0.16, "sine", 0.1);
    started = true; lockBoard = false;
    if (startOverlay) { startOverlay.setVisible(false); }
    hudMsg.setText("Tap a card!");
    announce("Level " + level + ". Find " + pairsForLevel() + " pairs. Score " + score + ".");
    drawSelection();
  }

  function makeStartOverlay(scene) {
    startOverlay = scene.add.container(W / 2, H / 2).setDepth(10);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.45); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-300, -200, 600, 400, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-300, -200, 600, 400, 30);
    var title = scene.add.text(0, -132, "\u{1F33B} Farmyard Match \u{1F404}", textStyle(38)).setOrigin(0.5);
    var sub = scene.add.text(0, -76, "Arcade challenge: 3 levels!\n6, 8, then 10 animal pairs.\nChain matches for combo bonus!", Object.assign(textStyle(22), { align: "center" })).setOrigin(0.5);
    var row = scene.add.text(0, 18, "\u{1F404} \u{1F437} \u{1F414} \u{1F40E} \u{1F411} \u{1F988}", { fontSize: "40px" }).setOrigin(0.5);
    var hint = scene.add.text(0, 58, "Arrows + Enter work too!", textStyle(18, "#334e68")).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-130, 80, 260, 70, 35);
    var btnTx = scene.add.text(0, 115, "\u25B6  Start", textStyle(30, "#ffffff")).setOrigin(0.5);
    startOverlay.add([bg, panel, title, sub, row, hint, btnBg, btnTx]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-130, 80, 260, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { startGame(scene); });
  }

  function makeEndOverlay(scene) {
    endOverlay = scene.add.container(W / 2, H / 2).setDepth(20).setVisible(false);
    var bg = scene.add.graphics();
    bg.fillStyle(0x000000, 0.5); bg.fillRect(-W / 2, -H / 2, W, H);
    var panel = scene.add.graphics();
    panel.fillStyle(0xffffff, 1); panel.fillRoundedRect(-290, -180, 580, 360, 30);
    panel.lineStyle(6, 0x4EA8DE, 1); panel.strokeRoundedRect(-290, -180, 580, 360, 30);
    endTitle = scene.add.text(0, -110, "\u{1F389} Level Clear! \u{1F389}", textStyle(40)).setOrigin(0.5);
    endDetail = scene.add.text(0, -30, "", Object.assign(textStyle(24), { align: "center" })).setOrigin(0.5);
    var btnBg = scene.add.graphics();
    btnBg.fillStyle(0x4EA8DE, 1); btnBg.fillRoundedRect(-150, 60, 300, 70, 35);
    endBtnLabel = scene.add.text(0, 95, "\u25B6 Next Level", textStyle(28, "#ffffff")).setOrigin(0.5);
    endOverlay.add([bg, panel, endTitle, endDetail, btnBg, endBtnLabel]);
    btnBg.setInteractive(new Phaser.Geom.Rectangle(-150, 60, 300, 70), Phaser.Geom.Rectangle.Contains);
    btnBg.on("pointerdown", function () { ensureAudio(); advance(scene); });
  }

  function showWin(scene) {
    winSound();
    var total = pairsForLevel();
    var stars = moves <= total + 4 ? 3 : (moves <= total + 10 ? 2 : 1);
    if (level < LEVELS.length) {
      endTitle.setText("\u{1F389} Level " + level + " Clear! \u{1F389}");
      endDetail.setText("You found all " + total + " pairs!\nMoves: " + moves + "  " + "\u2B50".repeat(stars) + "\nScore: " + score + "  Best streak: x" + Math.max(1, bestStreak));
      endBtnLabel.setText("\u25B6 Next Level");
    } else {
      endTitle.setText("\u{1F3C6} Arcade Champion! \u{1F3C6}");
      endDetail.setText("You cleared all 3 levels!\nScore: " + score + "  Best streak: x" + Math.max(1, bestStreak) + "\nMoves this level: " + moves + "  " + "\u2B50".repeat(stars));
      endBtnLabel.setText("\u21BB Play Again");
    }
    endOverlay.setVisible(true);
    scene.tweens.add({ targets: endOverlay, scale: { from: 0.8, to: 1 }, duration: 250, ease: "Back.easeOut" });
    hudMsg.setText("Amazing! \u{1F389}");
    announce(endTitle.text + " Score " + score + ".");
    for (var i = 0; i < 40; i++) {
      var p = scene.add.text(Math.random() * W, -20, ["\u{1F33B}", "\u2B50", "\u{1F389}", "\u{1F404}", "\u{1F411}"][i % 5], { fontSize: "28px" }).setDepth(30);
      scene.tweens.add({ targets: p, y: H + 40, x: p.x + Phaser.Math.Between(-80, 80), duration: Phaser.Math.Between(1200, 2200), onComplete: (function (t) { return function () { t.destroy(); }; })(p) });
    }
  }

  function advance(scene) {
    if (level < LEVELS.length) {
      level++;
      moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
      endOverlay.setVisible(false);
      refreshHud();
      updateGoalLine(scene);
      hudMsg.setText("Level " + level + "! Tap a card!");
      announce("Level " + level + ". Find " + pairsForLevel() + " pairs.");
      buildBoard(scene);
    } else {
      level = 1; score = 0; bestStreak = 0;
      restart(scene);
    }
  }

  function updateGoalLine(scene) {
    var total = pairsForLevel();
    scene.children.each(function (child) {
      if (child.name === "goalLine") { child.setText("Level " + level + ": find the " + total + " animal pairs!"); }
    });
  }

  function restart(scene) {
    moves = 0; matches = 0; streak = 0; firstPick = null; lockBoard = false; started = true;
    if (level < 1 || level > LEVELS.length) { level = 1; }
    refreshHud();
    updateGoalLine(scene);
    hudMsg.setText("Tap a card!");
    announce("Restarted. Level " + level + ". Score " + score + ".");
    endOverlay.setVisible(false);
    if (startOverlay) { startOverlay.setVisible(false); }
    buildBoard(scene);
  }

  function moveSelection(scene, dx, dy) {
    if (!cards.length) { return; }
    var cols = LEVELS[level - 1].cols;
    var n = cards.length;
    var next = selected;
    for (var k = 0; k < n; k++) {
      next = (next + dx + dy * cols + n * 4) % n;
      if (!cards[next].matched) { break; }
      if (dx === 0 && dy === 0) { break; }
    }
    selected = next;
    drawSelection();
    var c = cards[selected];
    if (c) { announce("Card " + (selected + 1) + " of " + n + ": " + (c.faceUp || c.matched ? c.data.name : "face down") + "."); }
  }

  function pressSelected(scene) {
    if (!started) {
      if (startOverlay && startOverlay.visible) { startGame(scene); return; }
      if (endOverlay && endOverlay.visible) { advance(scene); return; }
    }
    if (endOverlay && endOverlay.visible) { advance(scene); return; }
    var card = cards[selected];
    if (card && !card.matched) { onCard(scene, card); }
  }

  function bindKeys(scene) {
    document.addEventListener("keydown", function (e) {
      var k = e.key;
      if (k === "ArrowLeft" || k === "a" || k === "A") { e.preventDefault(); moveSelection(scene, -1, 0); }
      else if (k === "ArrowRight" || k === "d" || k === "D") { e.preventDefault(); moveSelection(scene, 1, 0); }
      else if (k === "ArrowUp" || k === "w" || k === "W") { e.preventDefault(); moveSelection(scene, 0, -1); }
      else if (k === "ArrowDown" || k === "s" || k === "S") { e.preventDefault(); moveSelection(scene, 0, 1); }
      else if (k === "Enter" || k === " ") { e.preventDefault(); ensureAudio(); pressSelected(scene); }
      else if (k === "r" || k === "R") { ensureAudio(); level = 1; score = 0; bestStreak = 0; restart(scene); }
      else if (k === "m" || k === "M") { soundOn = !soundOn; announce(soundOn ? "Sound on." : "Sound off."); }
    });
  }

  function update() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.view.y -= b.speed * 0.016;
      b.view.x += Math.sin(b.view.y * 0.02 + i) * 0.3;
      if (b.view.y < 190) { b.view.y = H - 10; b.view.x = Phaser.Math.Between(20, W - 20); }
    }
  }
})();
</script>
</body>
</html>
