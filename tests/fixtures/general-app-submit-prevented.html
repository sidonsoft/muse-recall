<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submit prevented — negative control</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141311; color: #f1eee6; font-family: system-ui, sans-serif; }
      main { width: min(28rem, 100% - 2rem); }
      input, button { padding: 0.55rem; border-radius: 0.4rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Task list</h1>
      <p id="count" aria-live="polite">0 tasks</p>
      <!-- Negative control for the exact FocusFlow v1 failure: a submit control
           plus a submit handler that calls preventDefault(). Chrome checks the
           sandboxed forms flag before dispatching submit, so the handler never
           runs. This fixture must remain incompatible; do not "fix" it. -->
      <form id="task-form">
        <label for="task-input">New task</label>
        <input id="task-input" name="task" type="text" required />
        <button type="submit">Add task</button>
      </form>
      <ul id="task-list"></ul>
    </main>
    <script>
      const form = document.getElementById('task-form');
      const input = document.getElementById('task-input');
      const list = document.getElementById('task-list');
      const count = document.getElementById('count');
      const tasks = [];
      function addTask() {
        const value = input.value.trim();
        if (value.length === 0) return;
        tasks.push(value);
        input.value = '';
        const item = document.createElement('li');
        item.textContent = value;
        list.append(item);
        count.textContent = `${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'}`;
      }
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        addTask();
      });
    </script>
  </body>
</html>
