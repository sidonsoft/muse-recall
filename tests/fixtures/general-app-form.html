<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task list</title>
    <style>
      :root { color-scheme: dark; --accent: #e7c17c; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141311; color: #f1eee6; font-family: system-ui, sans-serif; }
      main { width: min(28rem, 100% - 2rem); }
      form { display: flex; gap: 0.5rem; align-items: end; margin-block: 1rem; }
      label { display: block; font-size: 0.8rem; margin-block-end: 0.25rem; }
      input { flex: 1; padding: 0.55rem 0.65rem; border-radius: 0.4rem; border: 1px solid #3a3630; background: #1d1b17; color: inherit; }
      button { padding: 0.55rem 0.8rem; border: 0; border-radius: 0.4rem; background: var(--accent); color: #141311; font-weight: 600; }
      ul { padding-inline-start: 1.1rem; }
      li { margin-block: 0.35rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Task list</h1>
      <p id="empty">No tasks yet. Add the first one.</p>
      <form id="task-form">
        <div>
          <label for="task-input">New task</label>
          <input id="task-input" name="task" type="text" autocomplete="off" required />
        </div>
        <button id="add-button" type="button">Add task</button>
      </form>
      <p id="count" aria-live="polite">0 tasks</p>
      <ul id="task-list"></ul>
    </main>
    <script>
      // The preview sandbox has no allow-forms and CSP form-action 'none'.
      // Chrome blocks a sandboxed submission before the submit event fires, so
      // the form never uses type="submit" or a submit handler. It keeps the
      // semantic markup for grouping/labels and wires click plus Enter itself.
      const form = document.getElementById('task-form');
      const input = document.getElementById('task-input');
      const addButton = document.getElementById('add-button');
      const list = document.getElementById('task-list');
      const count = document.getElementById('count');
      const empty = document.getElementById('empty');
      const tasks = [];

      function render() {
        list.replaceChildren();
        for (const task of tasks) {
          const item = document.createElement('li');
          const label = document.createElement('span');
          label.textContent = task;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = 'Delete';
          remove.setAttribute('aria-label', `Delete task: ${task}`);
          remove.addEventListener('click', () => {
            tasks.splice(tasks.indexOf(task), 1);
            render();
          });
          item.append(label, ' ', remove);
          list.append(item);
        }
        count.textContent = `${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'}`;
        empty.hidden = tasks.length > 0;
      }

      function addTask() {
        const value = input.value.trim();
        if (value.length === 0) return;
        tasks.push(value);
        input.value = '';
        input.focus();
        render();
      }

      form.addEventListener('submit', (event) => {
        // Defence in depth: if the markup is ever changed to a submit control,
        // never navigate. Chrome may block before this listener in the sandbox.
        event.preventDefault();
        addTask();
      });
      addButton.addEventListener('click', () => addTask());
      input.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        addTask();
      });
      render();
    </script>
  </body>
</html>
