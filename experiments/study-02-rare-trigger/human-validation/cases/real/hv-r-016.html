<!-- Study 02 corpus variant. Deterministic template-engine output; no model involvement. Checked against corpus/corpus.sha256. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Arcade Match</title>
<style>

:root{
  /* Ocean Palette per request */
  --bg:#e0f7fa;--surface:#ffffff;--ink:#102A43;--muted:#5d8aa8;
  --accent:#4EA8DE;--accent-dark:#2980b9;--accent-2:#81d4fa;--line:#b2ebf2;--warn:#ff7043;
  
  --card:#ffffff;--radius:16px;--shadow:0 8px 24px rgba(16, 42, 67, .15);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:radial-gradient(circle at 50% 0%, #e1f5fe 0%, var(--bg) 70%);
  color:var(--ink);font-family:"Trebuchet MS",Verdana,"Segoe UI",sans-serif;
  display:flex;justify-content:center;padding:24px 16px 40px;
}
.skip-link{position:absolute;left:-9999px;top:0;background:#fff;color:var(--ink);padding:10px 14px;border-radius:8px;z-index:50}
.skip-link:focus{left:12px;top:12px}
.app{width:100%;max-width:960px;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(1.4rem,2.5vw,2rem);margin:0;line-height:1.15;letter-spacing:-.02em;color:var(--accent-dark)}
.tagline{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0}
.stat{min-width:104px;background:#f0faff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}
.stat dd{margin:2px 0 0;font-size:1.15rem;font-weight:800; color:var(--accent-dark)}
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:10px}
.card{
  position:relative;appearance:none;border:0;padding:0;margin:0;cursor:pointer;
  aspect-ratio:4/3;border-radius:14px;background:transparent;
  transform-style: preserve-3d; transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px;z-index:10}
.card-back,.card-face{
  position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;
  transition:opacity .2s ease, transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);border:2px solid var(--line);
  backface-visibility: hidden;
}
.card-back{
  background:linear-gradient(135deg, var(--accent), var(--accent-dark));
  color:#fff; font-size:2rem; opacity:1;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1);
}
.card-face{background:var(--card);font-size:clamp(1.6rem,3vw,2.5rem);opacity:0; transform: rotateY(180deg); box-shadow:inset 0 0 0 2px var(--accent)}
.card.face-up .card-back{ opacity:0; transform: scale(0.9); }
.card.face-up .card-face{ opacity:1; transform: rotateY(0deg); }
.card.matched .card-face{box-shadow:inset 0 0 0 4px var(--accent), 0 0 12px var(--accent-2)}
.card:disabled{cursor:default}

/* Arcade Juice */
.card.pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes pop { 
  0% { transform: scale(1); } 
  50% { transform: scale(1.15); } 
  100% { transform: scale(1); } 
}

.message{
  margin:0;min-height:1.5em;font-size:1rem;color:var(--ink);
  background:#f0faff;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;
}
.message[aria-live]{text-align:left}
.btn{
  appearance:none;border:2px solid var(--line);background:#fff;color:var(--ink);
  font:inherit;font-weight:700;padding:10px 16px;border-radius:999px;cursor:pointer;min-height:44px;
  transition: transform 0.1s, background 0.2s;
}
.btn:hover{background:#f0faff; border-color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn--ghost{background:transparent}
.btn--solid{background:var(--accent);border-color:var(--accent-dark);color:#fff}
.btn:active { transform: translateY(2px); }

.overlay{
  position:fixed;inset:0;background:rgba(16, 42, 67, .6);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:40; backdrop-filter: blur(3px);
}
.overlay[hidden]{display:none}
.overlay-panel{background:#fff;border-radius:20px;padding:30px 24px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow); border: 2px solid var(--accent)}
.overlay-panel h2{margin:0 0 8px;font-size:1.5rem;color:var(--accent-dark)}
.overlay-panel p{margin:0 0 18px;color:var(--muted)}
.meter{height:12px;border-radius:999px;background:#e3f2fd;overflow:hidden;border:1px solid var(--line)}
.meter-fill{display:block;height:100%;width:0;background:linear-gradient(90deg, var(--accent), var(--accent-dark));transition:width .25s ease}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#f0faff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.chip strong{color:var(--ink)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.log li{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding:4px 8px}
.toast{
  position:fixed;right:18px;top:18px;z-index:45;max-width:280px;background:#fff;border:1px solid var(--accent);
  border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);font-size:.92rem; font-weight:bold; color:var(--ink);
}
.toast[hidden]{display:none}
.dock{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rail{display:flex;flex-direction:column;gap:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.lede{margin:0;color:var(--muted);font-size:.95rem}

/* Particle Effects */
.particle {
  position: absolute; pointer-events: none; border-radius: 50%;
  background: var(--accent-2); opacity: 0.8; animation: floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}

@media (max-width:640px){
  body{padding:14px 10px 28px}
  .stats{gap:8px}
  .stat{min-width:86px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important; animation:none!important}
}

.t01{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.t01 .rail{position:sticky;top:18px}
.t01 .play{display:block}
@media (max-width:760px){.t01{grid-template-columns:1fr}}

/* Study 02 corpus design system */
:root{--space-1:.35rem;--space-2:.6rem;--space-3:1rem;--space-4:1.5rem;--space-5:2rem;--radius-sm:10px;--radius-lg:22px}
body{line-height:1.5}
::selection{background:var(--accent);color:#fff}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
p{margin:0 0 .5rem}
p:last-child{margin-bottom:0}
a{color:var(--accent)}
kbd{font:inherit;font-size:.8em;background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
hr{border:0;border-top:1px solid var(--line);margin:var(--space-4) 0}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:var(--space-2)}
.wrap{flex-wrap:wrap}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.badge{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem;font-size:.75rem;color:var(--muted)}
.badge strong{color:var(--ink)}
.divider{height:1px;background:var(--line);margin:var(--space-3) 0}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn--wide{width:100%;justify-content:center}
input,button,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.panel-title{margin:0 0 var(--space-2);font-size:1.05rem}
.hint{margin:0;color:var(--muted);font-size:.85rem}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
@media (max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}}
@media (forced-colors:active){.panel,.stat,.card,.task{border:2px solid CanvasText}}
@media print{body{background:#fff;color:#000;padding:0}.panel{box-shadow:none}}
@media (prefers-contrast:more){:root{--muted:var(--ink)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}

/* Farmyard component details */
.card{box-shadow:0 4px 8px rgba(16, 42, 67, .1)}
.card:hover .card-back{filter:brightness(1.1) drop-shadow(0 4px 4px rgba(0,0,0,0.1))}
.card.matched .card-face::after{content:"";position:absolute;right:6px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.board--wide{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.stats--stack{flex-direction:column;align-items:stretch}
.stats--stack .stat{width:100%}
.stat dd{font-variant-numeric:tabular-nums}
.meter--wide{height:10px}
.overlay{backdrop-filter:blur(2px)}
.overlay-panel{border:1px solid var(--line)}
.toast{pointer-events:none}
.log li:nth-child(odd){background:rgba(0,0,0,.03)}
.log li strong{color:var(--ink)}
.rail h2,.topbar h2{margin-top:0}
.app>.panel+.panel{margin-top:0}
@media (max-width:520px){.board{gap:7px}.card{border-radius:11px}.stat{min-width:78px}}
@media (prefers-reduced-motion:reduce){.overlay{backdrop-filter:none}}

/* s02:hook:css */
.hook-zone{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.hook-grid{display:flex;gap:10px;flex-wrap:wrap}
.hook-card{min-width:96px;background:#f0faff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.hook-label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.hook-value{font-size:1.05rem}
.hook-sub{display:block;font-size:.75rem;color:var(--muted)}
/* /s02:hook:css */
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to game</a><div class="app t01"><aside class="rail panel" aria-label="Game controls and statistics"><div class="brand"><h1>Ocean Arcade Match</h1><p class="lede">Match the deep sea creatures!</p></div><dl class="stats stats--stack" aria-label="Game statistics"><div class="stat"><dt>Moves</dt><dd data-s02="moves">0</dd></div><div class="stat"><dt>Pairs</dt><dd data-s02="pairs">0 / 0</dd></div></dl><p class="message" data-s02="message" aria-live="polite">Tap a card to begin.</p><button type="button" class="btn btn--ghost" data-s02="restart">Restart</button><!-- s02:hook:html -->
<section class="hook-zone" aria-label="Points, streak and pacing feedback">
  <div class="hook-grid">
    <div class="hook-card"><span class="hook-label">Score</span><strong class="hook-value" data-s02="points">0</strong></div>
    <div class="hook-card"><span class="hook-label">Streak</span><strong class="hook-value" data-s02="streak">x1</strong></div>
    <div class="hook-card"><span class="hook-label">Round</span><strong class="hook-value" data-s02="round">1</strong></div>
  </div>
</section>
<!-- /s02:hook:html --></aside><main class="play" id="main"><div class="board" data-s02="board" role="grid" aria-label="Card board"></div></main><div class="overlay" data-s02="overlay" hidden><div class="overlay-panel"><h2>All Pairs Found!</h2><p data-s02="detail">You cleared the ocean floor.</p><button type="button" class="btn btn--solid" data-s02="playagain">Play Again</button></div></div></div>
<script>

(function () {
  'use strict';
  
  // Arcade Configuration: Ocean Theme
  var CFG = {
    "cols": 5, 
    "labels": ["Dolphin", "Octopus", "Clownfish", "Starfish", "Turtle", "Shark", "Whale", "Seahorse", "Jellyfish", "Crab"], 
    "pairs": 6, // Increased pairs for arcade challenge
    "seed": 1102, 
    // Emojis for ocean theme
    "symbols": [9743, 128053, 128163, 127784, 128017, 129426, 128062, 129424, 128126, 129405] 
  };
  
  var SYMBOLS = CFG.symbols.map(function (code) { return String.fromCodePoint(code); });
  var LABELS = CFG.labels;
  var PAIRS = CFG.pairs;
  
  function all(role) { return Array.prototype.slice.call(document.querySelectorAll('[data-s02="' + role + '"]')); }
  function one(role) { return document.querySelector('[data-s02="' + role + '"]'); }
  function set(role, text) { all(role).forEach(function (node) { node.textContent = String(text); }); }
  
  var S02 = window.S02 = window.S02 || { onMatch: [], onMiss: [], onWin: [], onRestart: [] };
  function emit(name, data) { (S02[name] || []).forEach(function (fn) { try { fn(data); } catch (err) {} }); }

  // Audio Engine (Synthesized - No external files)
  var audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  
  function playSound(type) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    var now = audioCtx.currentTime;
    if (type === 'flip') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'match') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(600, now + 0.1);
      osc.frequency.linearRampToValueAtTime(900, now + 0.2);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if (type === 'miss') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'win') {
      // Fanfare
      [440, 554, 659, 880].forEach(function(freq, i) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'square';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, now + i*0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.4);
        o.start(now + i*0.1);
        o.stop(now + i*0.1 + 0.4);
      });
    }
  }

  function log(text) {
    var list = one('log'); if (!list) { return; }
    var li = document.createElement('li'); li.textContent = text; list.insertBefore(li, list.firstChild);
    while (list.children.length > 5) { list.removeChild(list.lastChild); }
  }
  
  function toast(text) {
    var node = one('toast');
    if (!node) { set('message', text); return; }
    node.textContent = text; node.hidden = false;
    window.clearTimeout(toast._timer);
    toast._timer = window.setTimeout(function () { node.hidden = true; }, 2000);
  }

  // Particle Effects (Arcade Juice)
  function spawnParticles(element) {
    var rect = element.getBoundingClientRect();
    var centerX = rect.left + rect.width / 2;
    var centerY = rect.top + rect.height / 2;
    
    for (var i = 0; i < 8; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      p.style.left = centerX + 'px';
      p.style.top = centerY + 'px';
      p.style.width = (Math.random() * 6 + 4) + 'px';
      p.style.height = p.style.width;
      var angle = Math.random() * Math.PI * 2;
      var dist = Math.random() * 60 + 30;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 1000);
    }
  }

  var seed = CFG.seed >>> 0;
  function rand() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed; }
  var deck = [], first = null, locked = false, moves = 0, matches = 0;

  function buildDeck() {
    var cards = [], i, j, swap;
    for (i = 0; i < PAIRS; i += 1) {
      cards.push({ key: i, symbol: SYMBOLS[i % SYMBOLS.length], label: LABELS[i % LABELS.length] });
      cards.push({ key: i, symbol: SYMBOLS[i % SYMBOLS.length], label: LABELS[i % LABELS.length] });
    }
    for (i = cards.length - 1; i > 0; i -= 1) { j = rand() % (i + 1); swap = cards[i]; cards[i] = cards[j]; cards[j] = swap; }
    return cards;
  }

  function render() {
    var board = one('board'); if (!board) { return; }
    board.innerHTML = '';
    board.style.setProperty('--cols', String(CFG.cols));
    deck.forEach(function (card, index) {
      var button = document.createElement('button');
      button.type = 'button'; button.className = 'card';
      button.setAttribute('data-key', String(card.key));
      button.setAttribute('aria-label', 'Hidden card ' + (index + 1));
      // Arcade styling: Big symbols, clear faces
      button.innerHTML = '<span class="card-back" aria-hidden="true">?</span><span class="card-face" aria-hidden="true">' + card.symbol + '</span><span class="sr-only">' + card.label + '</span>';
      button.addEventListener('click', function () { onCard(button); });
      board.appendChild(button);
    });
  }

  function paint() {
    set('moves', moves); 
    set('pairs', matches + ' / ' + PAIRS);
    var meter = one('meter'); if (meter) { meter.style.width = Math.round(100 * matches / PAIRS) + '%'; }
    var status = one('status'); if (status) { status.textContent = matches === PAIRS ? 'Complete' : 'Playing'; }
  }

  function onCard(button) {
    initAudio(); // Ensure audio context starts on user interaction
    
    if (locked || button.classList.contains('matched') || button.classList.contains('face-up')) { return; }
    
    playSound('flip');
    button.classList.add('face-up');
    button.setAttribute('aria-label', 'Revealed card');
    
    set('message', 'One more!');
    
    if (!first) { 
      first = button; 
      return; 
    }

    moves += 1; 
    paint();
    
    var previous = first; 
    first = null;
    
    if (previous.getAttribute('data-key') === button.getAttribute('data-key')) {
      // Match
      locked = true;
      playSound('match');
      
      // Arcade Juice: Pop animation
      previous.classList.add('pop');
      button.classList.add('pop');
      spawnParticles(previous);
      
      window.setTimeout(function () {
        previous.classList.add('matched'); 
        button.classList.add('matched');
        matches += 1; 
        locked = false; 
        paint();
        
        set('message', matches === PAIRS ? 'Amazing! You did it!' : 'Great Match!');
        log('Matched a pair. Moves: ' + moves + '.');
        emit('onMatch', { matches: matches, moves: moves });
        if (matches === PAIRS) { win(); }
      }, 300);
    } else {
      // Miss
      locked = true;
      playSound('miss');
      
      window.setTimeout(function () {
        previous.classList.remove('face-up'); 
        button.classList.remove('face-up');
        locked = false;
        
        set('message', 'Try again!');
        toast('Not a pair - try again.');
        emit('onMiss', { moves: moves });
      }, 800); // Slightly longer to see the mismatch
    }
  }

  function win() {
    playSound('win');
    var overlay = one('overlay');
    if (overlay) { overlay.hidden = false; set('detail', 'All pairs found in ' + moves + ' moves.'); }
    set('message', 'Victory! All pairs found.');
    log('Board cleared in ' + moves + ' moves.');
    emit('onWin', { moves: moves, matches: matches });
  }

  function restart() {
    initAudio();
    moves = 0; matches = 0; first = null; locked = false; deck = buildDeck();
    render(); paint(); set('message', 'Tap a card to begin.');
    var overlay = one('overlay'); if (overlay) { overlay.hidden = true; }
    emit('onRestart', {});
  }

  all('restart').forEach(function (button) { button.addEventListener('click', restart); });
  all('playagain').forEach(function (button) { button.addEventListener('click', restart); });
  
  deck = buildDeck(); 
  render(); 
  paint();
})();


/* Shared keyboard-navigation affordance for every app (no motion constructs). */
(function () {
  'use strict';
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Home' && event.key !== 'End') { return; }
    var body = document.body;
    if (!body) { return; }
    window.scrollTo(0, event.key === 'Home' ? 0 : body.scrollHeight);
  });
})();


/* Farmyard board keyboard navigation: arrow keys move focus between cards. */
(function () {
  'use strict';
  var board = document.querySelector('[data-s02="board"]');
  if (!board) { return; }
  board.addEventListener('keydown', function (event) {
    var cards = Array.prototype.slice.call(board.querySelectorAll('.card'));
    var current = cards.indexOf(document.activeElement);
    if (current < 0) { return; }
    var cols = parseInt(window.getComputedStyle(board).getPropertyValue('--cols'), 10) || 4;
    var next = current;
    if (event.key === 'ArrowRight') { next = Math.min(cards.length - 1, current + 1); }
    else if (event.key === 'ArrowLeft') { next = Math.max(0, current - 1); }
    else if (event.key === 'ArrowDown') { next = Math.min(cards.length - 1, current + cols); }
    else if (event.key === 'ArrowUp') { next = Math.max(0, current - cols); }
    else { return; }
    event.preventDefault();
    cards[next].focus();
  });
})();

(function () {
