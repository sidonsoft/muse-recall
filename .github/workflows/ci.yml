name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI runs entirely on the deterministic offline provider. No Meta
      # credentials are required, and no model quota is consumed by a PR.
      - name: Lint and format check
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          DATABASE_PATH: ./data/ci.db
          MODEL_PROVIDER: echo
          LOG_LEVEL: silent

  browser:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit fields only: no conditionals, so nothing can be coerced
        # (GitHub Actions treats empty strings as falsy in && / || chains).
        # The Chromium leg keeps the historical required check name; the
        # Firefox leg adds a second independent engine (roadmap §7 G-10).
        include:
          - engine: managed
            extra_browser: ''
            job_name: Managed browser workflow (fake provider)
          - engine: firefox
            extra_browser: firefox
            job_name: Managed browser workflow (fake provider · managed Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # (No FORGE_VISUAL_UPDATE here: baselines are committed; this job now
    #  compares. Set the job env to '1' temporarily to re-record after an
    #  intentional UI change, then commit the new PNGs and remove it.)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pin the browser to the Playwright version in the lockfile. The cache
      # key includes the lockfile and the matrix engine so a Playwright
      # upgrade cannot silently reuse an incompatible build.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium is installed on every leg: the approval gate's runtime check
      # loads the staged page in managed Chromium server-side, whatever engine
      # the driving workflow uses. The Firefox leg adds its engine on top.
      - name: Install Playwright Chromium${{ matrix.extra_browser && ' + Firefox' || '' }}
        run: pnpm exec playwright-core install --with-deps chromium ${{ matrix.extra_browser }}

      - name: Build production artifacts
        run: pnpm run build
        env:
          DATABASE_PATH: ./data/ci.db
          MODEL_PROVIDER: echo
          LOG_LEVEL: silent

      # Uses the deterministic fake Muse CLI. No credentials, no model quota,
      # and no live checks. Live-model suites stay opt-in via MML_LIVE_MUSE=1.
      - name: Run managed Studio workflow
        run: pnpm verify:studio-workflow
        env:
          MODEL_PROVIDER: echo
          LOG_LEVEL: warn
          FORGE_RUNTIME_BROWSER: ${{ matrix.engine }}

      # Baselines live in the repository (tests/visual). The update run
      # uploads them for review/commit; drift runs upload the failing
      # actual screenshots and diff images for triage.
      - name: Upload recorded visual baselines
        if: env.FORGE_VISUAL_UPDATE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.engine }}
          path: tests/visual/*.png

      - name: Upload visual drift evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.engine }}
          path: test-results/studio-after/visual-*.png
          if-no-files-found: ignore
