name: Feature request
description: Suggest a change or new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to happen. Rough ideas are fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Areas this touches
      description: Changes to these need a design discussion before a large PR.
      options:
        - label: Memory storage, migrations or deletion
        - label: Approval, authorization or tool permissions
        - label: Integrations (MCP, agent clients, Muse CLI)
