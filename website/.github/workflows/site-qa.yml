name: Site QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      # Test-only: a11y audit, widget state machine, mobile overflow, LCP/CLS
      # against `vite preview`. Deliberately not a deploy.
      - run: npm run qa
